objectives:["تفسیر خروجی ping شامل RTT، mdev و packet loss","اجرای traceroute با UDP، ICMP و TCP و تفسیر ستاره‌ها","خواندن درست mtr و تفکیک Loss واقعی از Rate Limit ICMP"],
example:"کاربران یک شهر از کندی شکایت دارند. mtr -rwzbc 200 api.example.com از یک سرور در آن منطقه نشان می‌دهد Loss از Hop ششم (یک روتر Transit) شروع می‌شود و تا مقصد حدود ۸٪ باقی می‌ماند — Loss واقعی است و با همین گزارش تیکت به ارائه‌دهنده باز می‌شود.",
code:"ping -c 20 -i 0.2 10.0.0.5          # ۲۰ بسته با فاصلهٔ ۰.۲ ثانیه\nping -M do -s 1472 -c 3 10.0.0.5    # تست MTU بدون Fragmentation\n\ntraceroute -n api.example.com          # پیش‌فرض: UDP\nsudo traceroute -n -T -p 443 api.example.com   # TCP SYN به 443\ntracepath -n api.example.com          # بدون root، MTU مسیر را هم نشان می‌دهد\n\nmtr -n api.example.com                # حالت تعاملی\nmtr -rwzbc 100 api.example.com        # گزارش با AS برای ارسال به ISP\nmtr -T -P 443 -rwc 100 api.example.com",
exercise:"برای سه مقصد (یک سرور داخلی، یک سایت داخل کشور، یک سایت خارجی) خروجی mtr -rwzc 100 بگیرید و برای هر Hop بنویسید Loss آن واقعی است یا ناشی از Rate Limit. سپس traceroute با UDP، ICMP و TCP را برای یک مقصد پشت Cloudflare مقایسه کنید و تفاوت‌ها را توضیح دهید.",
project:"", resources:[{t:"ping(8) man page",u:"https://man7.org/linux/man-pages/man8/ping.8.html"},{t:"traceroute(8) man page",u:"https://linux.die.net/man/8/traceroute"},{t:"mtr - official site",u:"https://www.bitwizard.nl/mtr/"},{t:"Cloudflare Learning - What is ICMP?",u:"https://www.cloudflare.com/learning/ddos/glossary/internet-control-message-protocol-icmp/"}],
criteria:"می‌توانید از خروجی mtr تشخیص دهید Loss در کدام بخش مسیر واقعی است و یک گزارش قابل ارسال به ISP تهیه کنید؛ و می‌دانید چرا شکست ping به معنای خرابی سرویس نیست.",
interview:["traceroute چطور با TTL مسیر را کشف می‌کند؟","در mtr، Loss در Hop وسط ولی صفر در مقصد را چطور تفسیر می‌کنید؟","چرا یک سرور ممکن است به ping پاسخ ندهد اما سرویسش سالم باشد؟"],
mistakes:["نتیجه‌گیری «سرور خاموش است» فقط از شکست ping","گزارش Loss یک Hop میانی به‌عنوان مشکل، در حالی که مقصد Loss ندارد","بررسی فقط یک جهت مسیر در حالی که مسیر برگشت متفاوت است"],
production:"در گزارش کندی کاربران یک منطقه یا ISP خاص، خروجی mtr دوطرفه مدرکی است که تیم شبکه یا ارائه‌دهنده را به اقدام وادار می‌کند.",
ai:"ping، traceroute و mtr را با تمرکز بر تفسیر درست خروجی به من یاد بده. چند خروجی واقعی mtr با الگوهای مختلف Loss و Latency نشانم بده و بخواه برای هر Hop بگویم مشکل واقعی است یا نه و چرا."},
{id:"tool-dig",title:"dig، host و nslookup: دیباگ حرفه‌ای DNS",level:"Beginner",minLadder:1,prereqs:["dns-resolution"],
short:"پرس‌وجوی مستقیم DNS، دنبال کردن مسیر Resolve از Root و مقایسهٔ پاسخ Resolverهای مختلف.",
deep:"dig ابزار استاندارد دیباگ DNS است چون پاسخ را خام و کامل نشان می‌دهد. بخش‌های خروجی: HEADER با status (NOERROR یعنی موفق، NXDOMAIN یعنی نام وجود ندارد، SERVFAIL یعنی Resolver نتوانسته پاسخ معتبر بگیرد — اغلب به‌دلیل خطای DNSSEC یا در دسترس نبودن Authoritative، REFUSED یعنی سرور به شما سرویس نمی‌دهد) و Flagها (aa یعنی پاسخ از سرور Authoritative است، rd/ra یعنی Recursion درخواست و ارائه شده)؛ ANSWER SECTION با TTL باقی‌مانده هر رکورد (اگر چند بار پشت‌سرهم بپرسید و TTL کم شود یعنی از کش پاسخ می‌گیرید)؛ و در انتها Query time و SERVER که می‌گوید کدام Resolver پاسخ داده است. گزینه‌های کلیدی: @1.1.1.1 برای پرسیدن از یک Resolver مشخص (مقایسهٔ Resolver داخلی، Resolver ISP و Authoritative برای فهمیدن مشکل کش یا Split-Horizon)، +short برای خروجی فقط مقدار، +trace برای دنبال کردن کامل مسیر از Root به TLD و سپس Authoritative بدون استفاده از کش، -x برای Reverse Lookup (رکورد PTR)، +norecurse برای پرسیدن بدون Recursion، و +dnssec برای دیدن امضاها. یک نکتهٔ مهم: dig از /etc/resolv.conf استفاده می‌کند اما مستقیم DNS می‌پرسد، در حالی که اپلیکیشن‌ها معمولاً از getaddrinfo و nsswitch استفاده می‌کنند که /etc/hosts و systemd-resolved را هم در نظر می‌گیرند؛ برای دیدن نتیجه‌ای که اپلیکیشن می‌بیند از getent hosts یا getent ahosts استفاده کنید. host و nslookup ساده‌ترند و برای بررسی سریع کافی‌اند، اما خروجی dig برای مستندسازی اینسیدنت دقیق‌تر است.",
objectives:["تفسیر status، flagها، TTL و SERVER در خروجی dig","استفاده از @server، +short، +trace و -x","تفکیک پاسخ DNS از دید dig و از دید اپلیکیشن (getent)"],
example:"بعد از تغییر IP سرور API، بعضی کاربران هنوز به سرور قدیمی می‌روند. dig +short api.example.com @ns1.provider.com IP جدید را می‌دهد ولی dig api.example.com @8.8.8.8 هنوز IP قدیمی را با TTL ۳۴۰۰ نشان می‌دهد: TTL قبلی ۳۶۰۰ بوده و تا یک ساعت کش‌ها پاسخ قدیمی را برمی‌گردانند.",
code:"dig api.example.com                 # خروجی کامل\ndig +short api.example.com A\ndig api.example.com @1.1.1.1        # پرسیدن از Resolver مشخص\ndig api.example.com @ns1.example-dns.com +norecurse   # مستقیم از Authoritative\ndig +trace api.example.com          # از Root تا Authoritative\ndig -x 8.8.8.8 +short               # PTR\ndig example.com MX +short ; dig example.com TXT +short ; dig example.com NS\ndig example.com +dnssec\n\n# آنچه اپلیکیشن می‌بیند (hosts + nsswitch)\ngetent ahosts api.example.com\nresolvectl query api.example.com",
exercise:"برای دامنهٔ یک سایت معروف: ۱) با +trace مسیر کامل Resolve را دنبال کنید و سرورهای Root، TLD و Authoritative را نام ببرید، ۲) پاسخ و TTL را از سه Resolver مختلف مقایسه کنید، ۳) یک ورودی در /etc/hosts اضافه کنید و نشان دهید dig آن را نمی‌بیند ولی getent می‌بیند، ۴) رکوردهای MX، TXT (SPF) و CAA را استخراج کنید.",
project:"", resources:[{t:"BIND 9 - dig manual",u:"https://bind9.readthedocs.io/en/latest/manpages.html"},{t:"Julia Evans - How to use dig",u:"https://jvns.ca/blog/2021/12/04/how-to-use-dig/"},{t:"Cloudflare Learning - What is DNS?",u:"https://www.cloudflare.com/learning/dns/what-is-dns/"}],
criteria:"می‌توانید با dig تشخیص دهید مشکل DNS در Authoritative است، در کش Resolver، یا در پیکربندی محلی میزبان، و خروجی را برای گزارش اینسیدنت تفسیر کنید.",
interview:["تفاوت NXDOMAIN و SERVFAIL چیست و هرکدام به چه مشکلی اشاره دارد؟","dig +trace چه کاری انجام می‌دهد که dig عادی نمی‌کند؟","چرا ممکن است dig و اپلیکیشن برای یک نام پاسخ متفاوت بگیرند؟"],
mistakes:["تست DNS فقط با یک Resolver و نتیجه‌گیری کلی","استفاده از dig برای بررسی رفتاری که اپلیکیشن از /etc/hosts یا nsswitch می‌گیرد","نادیده گرفتن TTL باقی‌مانده و انتظار تغییر فوری"],
production:"در مهاجرت یا Failover مبتنی بر DNS، مقایسهٔ پاسخ Authoritative با Resolverهای عمومی به‌کمک dig سریع‌ترین راه تخمین زمان باقی‌ماندهٔ انتشار تغییر است.",
ai:"dig را با تمرکز بر تفسیر خروجی (status، flags، TTL، SERVER) و گزینه‌های @، +trace، +short و -x به من آموزش بده. سپس چند سناریوی خرابی DNS (کش قدیمی، SERVFAIL ناشی از DNSSEC، Split-Horizon) بساز و خروجی dig هرکدام را بده تا علت را پیدا کنم."},
{id:"tool-curl-wget",title:"curl حرفه‌ای: -v، --resolve، --connect-to، زمان‌بندی (-w) و httpie",level:"Beginner",minLadder:1,prereqs:["http-11"],
short:"curl فقط برای دانلود نیست؛ ابزار اصلی تست HTTP/TLS، دور زدن DNS و اندازه‌گیری دقیق مراحل تأخیر یک درخواست است.",
deep:"curl -v کل گفت‌وگو را نشان می‌دهد: خطوط با * اطلاعات اتصال (IP انتخاب‌شده، نتیجهٔ هندشیک TLS، نسخهٔ پروتکل، ALPN و گواهی سرور)، خطوط با > هدرهای ارسالی و خطوط با < هدرهای دریافتی؛ -I فقط هدرها را با HEAD می‌گیرد و -i هدرها را همراه بدنه چاپ می‌کند. دو گزینهٔ طلایی برای تست بدون تغییر DNS: --resolve api.example.com:443:10.0.0.5 که نام را به IP دلخواه نگاشت می‌کند ولی SNI و هدر Host را درست نگه می‌دارد (برای تست مستقیم یک Backend پشت Load Balancer یا سرور جدید قبل از تغییر DNS)، و --connect-to که حتی پورت را هم بازنویسی می‌کند. در مقابل، curl https://10.0.0.5 -H 'Host: api.example.com' به‌دلیل SNI اشتباه معمولاً خطای گواهی می‌دهد. گزینهٔ -w با متغیرهایی مثل time_namelookup، time_connect، time_appconnect (پایان TLS)، time_starttransfer (TTFB) و time_total نشان می‌دهد تأخیر در کدام مرحله است؛ اگر time_namelookup یک ثانیه باشد مشکل DNS است نه اپلیکیشن. گزینه‌های پرکاربرد دیگر: -s -o /dev/null -w '%{http_code}' برای Health Check در اسکریپت، --fail برای exit code غیرصفر روی 4xx/5xx، -L برای دنبال کردن Redirect، --http2 و --http3، -k فقط برای تست (عدم بررسی گواهی) و --cacert برای CA داخلی، --max-time و --connect-timeout برای جلوگیری از آویزان ماندن، و -x یا --socks5-hostname برای عبور از پراکسی. wget برای دانلود بازگشتی و از سرگیری مناسب است و httpie (http) برای کار تعاملی با APIهای JSON خواناتر است. برای مهندس بک‌اند، curl -v اولین پاسخ به سؤال «مشکل از کلاینت است یا سرور؟» است.",
objectives:["خواندن خروجی curl -v و تشخیص مراحل DNS، TCP، TLS و HTTP","تست یک Backend مشخص با --resolve یا --connect-to بدون تغییر DNS","اندازه‌گیری زمان هر مرحله با -w و تشخیص گلوگاه"],
example:"قبل از انتقال ترافیک به سرور جدید، curl -sv --resolve api.example.com:443:10.0.3.21 https://api.example.com/health اجرا می‌شود: گواهی، نسخهٔ HTTP و پاسخ سرور جدید دقیقاً همان‌طور که کاربران خواهند دید تست می‌شود، بدون دست زدن به DNS.",
code:"curl -v https://api.example.com/health\ncurl -sI https://example.com                     # فقط هدرها\ncurl -s -o /dev/null -w '%{http_code}\\n' --fail --max-time 5 https://api.example.com/health\n\n# تست یک Backend مشخص با SNI درست\ncurl -v --resolve api.example.com:443:10.0.3.21 https://api.example.com/\ncurl -v --connect-to api.example.com:443:10.0.3.21:8443 https://api.example.com/\n\n# زمان‌بندی مراحل\ncurl -s -o /dev/null -w 'dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\\n' https://api.example.com/\n\n# POST JSON\ncurl -sS -X POST https://api.example.com/v1/orders -H 'Content-Type: application/json' -d '{\"symbol\":\"BTCUSDT\",\"qty\":1}'\nhttp POST api.example.com/v1/orders symbol=BTCUSDT qty:=1     # httpie",
exercise:"یک اسکریپت Bash بنویسید که برای لیستی از URLها، زمان DNS، Connect، TLS، TTFB و Total را با curl -w اندازه بگیرد و کندترین مرحله را برای هرکدام چاپ کند. سپس با --resolve یک سایت را مستقیماً روی یکی از IPهای دیگرش (از dig) تست کنید و تفاوت آن را با ارسال هدر Host روی IP توضیح دهید.",
project:"", resources:[{t:"Everything curl (free book)",u:"https://everything.curl.dev/"},{t:"curl man page",u:"https://curl.se/docs/manpage.html"},{t:"HTTPie CLI docs",u:"https://httpie.io/docs/cli"}],
criteria:"می‌توانید با یک دستور curl نشان دهید تأخیر یک درخواست در کدام مرحله است و یک سرور مشخص را با SNI و Host درست تست کنید بدون تغییر DNS.",
interview:["تفاوت --resolve با ارسال هدر Host روی IP چیست؟","time_appconnect و time_starttransfer در curl چه چیزی را اندازه می‌گیرند؟","چرا curl -k در اسکریپت‌های تولید خطرناک است؟"],
mistakes:["استفاده از -k در کد و اسکریپت تولید و از کار انداختن اعتبارسنجی TLS","نگذاشتن --max-time در Health Check و آویزان ماندن اسکریپت","تست سرور جدید با IP خالی و نتیجه‌گیری غلط از خطای گواهی"],
production:"در تقریباً هر اینسیدنت API، اولین مدرک قابل اشتراک یک خروجی curl -v یا curl -w است که نشان می‌دهد مشکل در DNS، TLS، اتصال یا خود اپلیکیشن است.",
ai:"curl را در سطح حرفه‌ای (‎-v، --resolve، --connect-to، -w، --fail، timeoutها) به من آموزش بده. سپس چند سناریوی مشکل (DNS کند، گواهی اشتباه، Backend خراب پشت LB) بده و از من بخواه با دستور curl مناسب علت را ثابت کنم."},
{id:"tool-ss-netstat-lsof",title:"ss، netstat و lsof: سوکت‌ها، پورت‌ها و پروسهٔ صاحب آن‌ها",level:"Beginner",minLadder:2,prereqs:["tp-ports-sockets"],
short:"چه پروسه‌ای روی چه پورتی گوش می‌دهد، چند اتصال در چه وضعیتی داریم و صف‌های Accept پر شده‌اند یا نه.",
deep:"ss جایگزین سریع و مدرن netstat است و مستقیماً از Netlink کرنل می‌خواند (روی سروری با صدها هزار اتصال، netstat ممکن است دقیقه‌ها طول بکشد). ترکیب استاندارد ss -tlnp یعنی TCP (-t)، فقط سوکت‌های در حال گوش دادن (-l)، بدون Resolve نام (-n) و با پروسهٔ صاحب (-p، برای پروسه‌های دیگران نیاز به root). نکتهٔ مهم در خروجی، آدرس محلی است: 127.0.0.1:5432 یعنی فقط از خود میزبان قابل دسترس است، 0.0.0.0:5432 یا [::]:5432 یعنی روی همهٔ رابط‌ها — اغلب پاسخ سؤال «چرا از بیرون وصل نمی‌شود؟» یا برعکس «چرا دیتابیس از بیرون باز است؟». برای سوکت‌های LISTEN، ستون Recv-Q تعداد اتصالات کامل‌شده‌ای است که منتظر accept() هستند و Send-Q اندازهٔ backlog است؛ اگر Recv-Q به Send-Q برسد یعنی اپلیکیشن به‌اندازهٔ کافی سریع accept نمی‌کند و اتصالات جدید دور ریخته می‌شوند (شمارندهٔ ListenOverflows در nstat). برای اتصالات برقرار، Recv-Q بزرگ یعنی اپلیکیشن داده را نمی‌خواند و Send-Q بزرگ یعنی طرف مقابل یا شبکه کند است. فیلترهای ss قدرتمندند: ss -tan state time-wait | wc -l برای شمارش TIME_WAIT، ss -tn dst 10.0.0.5:5432 برای اتصالات به دیتابیس، ss -s برای خلاصهٔ کل، و ss -ti برای جزئیات TCP مثل rtt، cwnd و retrans. lsof نگاه از سمت پروسه است: lsof -i :8000 می‌گوید چه کسی پورت را گرفته و lsof -p PID همهٔ فایل‌ها و سوکت‌های یک پروسه را نشان می‌دهد که برای تشخیص نشت اتصال (Connection Leak) یا رسیدن به سقف ulimit -n حیاتی است.",
objectives:["پیدا کردن پروسهٔ گوش‌دهنده روی هر پورت و آدرس bind آن","تفسیر Recv-Q و Send-Q برای سوکت‌های LISTEN و ESTABLISHED","شمارش و فیلتر اتصالات بر اساس وضعیت و مقصد"],
example:"اپ Django خطای could not connect to server می‌دهد. ss -tlnp روی سرور دیتابیس نشان می‌دهد postgres روی 127.0.0.1:5432 گوش می‌دهد نه 0.0.0.0؛ listen_addresses در postgresql.conf اصلاح و فقط از طریق فایروال به IP اپ اجازه داده می‌شود.",
code:"sudo ss -tlnp                       # پورت‌های TCP در حال گوش دادن + پروسه\nsudo ss -ulnp                       # UDP\nss -s                               # خلاصهٔ کل سوکت‌ها\nss -tan state established '( dport = :5432 )' | wc -l   # اتصالات به PostgreSQL\nss -tan state time-wait | wc -l\nss -tlnp 'sport = :8000'            # Recv-Q در برابر Send-Q (backlog)\nss -ti dst 10.0.0.5                 # rtt، cwnd، retrans هر اتصال\n\n# شمارش وضعیت‌ها\nss -tan | awk 'NR>1 {print $1}' | sort | uniq -c | sort -rn\n\n# lsof\nsudo lsof -i :8000\nsudo lsof -nP -iTCP -sTCP:LISTEN\nsudo lsof -p $(pgrep -f gunicorn | head -1) | grep -c TCP\nnstat -az | grep -E 'ListenOverflows|ListenDrops'",
exercise:"روی ماشین خودتان: ۱) همهٔ پورت‌های در حال گوش دادن و آدرس bind آن‌ها را لیست کنید و هرکدام که روی 0.0.0.0 است را توجیه کنید، ۲) یک سرور ساده پایتون با backlog کوچک بسازید که accept نمی‌کند، با چند اتصال هم‌زمان Recv-Q را پر کنید و ListenOverflows را در nstat ببینید، ۳) تعداد اتصالات هر وضعیت TCP را با یک pipeline شمارش کنید.",
project:"", resources:[{t:"ss(8) man page",u:"https://man7.org/linux/man-pages/man8/ss.8.html"},{t:"lsof(8) man page",u:"https://man7.org/linux/man-pages/man8/lsof.8.html"},{t:"netstat(8) man page",u:"https://man7.org/linux/man-pages/man8/netstat.8.html"}],
criteria:"بدون جستجو می‌توانید بگویید کدام پروسه روی کدام پورت و آدرس گوش می‌دهد، پر شدن صف Accept را تشخیص دهید و توزیع وضعیت اتصالات TCP را استخراج کنید.",
interview:["Recv-Q و Send-Q برای یک سوکت LISTEN چه معنایی دارند؟","تفاوت bind روی 127.0.0.1 و 0.0.0.0 چیست؟","چطور یک Connection Leak را در یک پروسه تشخیص می‌دهید؟"],
mistakes:["استفاده از netstat کند روی سرور پرترافیک وسط اینسیدنت","نادیده گرفتن آدرس bind و باز گذاشتن سرویس داخلی روی همهٔ رابط‌ها","اجرای ss -p بدون sudo و نتیجه‌گیری اینکه هیچ پروسه‌ای پورت را ندارد"],
production:"تشخیص اینکه Gunicorn به سقف backlog رسیده یا هزاران اتصال به PostgreSQL باز مانده، با یک دستور ss در چند ثانیه ممکن است — قبل از اینکه داشبوردها جواب بدهند.",
ai:"ss و lsof را با تمرکز بر تفسیر Recv-Q/Send-Q، آدرس bind و وضعیت‌های TCP به من آموزش بده. سپس خروجی‌های واقعی ss از سرورهای مشکل‌دار (backlog پر، Connection Leak، TIME_WAIT زیاد) نشانم بده و بخواه تشخیص بدهم."},
{id:"tool-nc-socat-nmap",title:"nc، socat و nmap: ساخت اتصال دستی و اسکن پورت",level:"Intermediate",minLadder:2,prereqs:["tp-ports-sockets"],
short:"تست دستی اتصال TCP/UDP، ساخت سرور و رله‌های موقت، و کشف پورت‌ها و سرویس‌های باز.",
deep:"nc (netcat) چاقوی سوئیسی شبکه است: nc -vz host 5432 بررسی می‌کند آیا اتصال TCP برقرار می‌شود (سریع‌ترین تست «فایروال باز است؟» وقتی telnet نصب نیست)، nc -l 9000 یک سرور ساده می‌سازد که هرچه دریافت کند چاپ می‌کند، و با Pipe می‌توان فایل منتقل کرد یا یک درخواست HTTP دستی نوشت. چند نسخهٔ nc وجود دارد (OpenBSD، traditional، ncat از nmap) و گزینه‌ها کمی متفاوت‌اند؛ اگر هیچ‌کدام نصب نبود، Bash با /dev/tcp/host/port یک اتصال TCP خام می‌سازد. نتیجهٔ تست هم معنادار است: Connection refused یعنی میزبان در دسترس است ولی کسی روی پورت گوش نمی‌دهد (RST)، در حالی که Timeout یعنی بسته در جایی (معمولاً فایروال یا Security Group) بی‌صدا DROP شده است. socat نسخهٔ قدرتمندتر است که دو «آدرس» دلخواه را به هم وصل می‌کند: TCP، UDP، Unix Socket، TLS، فایل یا PTY؛ مثلاً یک Unix Socket را روی TCP در دسترس قرار می‌دهد یا یک پراکسی TCP موقت برای مهاجرت می‌سازد. nmap ابزار کشف شبکه است: -sS (SYN Scan، نیمه‌باز)، -sT (اتصال کامل، بدون root)، -sU (UDP)، -p- (همهٔ ۶۵۵۳۵ پورت)، -sV (تشخیص نسخهٔ سرویس) و --script ssl-enum-ciphers برای فهرست Cipherهای TLS. خروجی nmap سه وضعیت اصلی دارد: open، closed (RST برگشته) و filtered (پاسخی نیامده؛ فایروال). کاربرد دفاعی nmap برای مهندس بک‌اند، تأیید این است که از دید اینترنت فقط پورت‌های مورد انتظار باز هستند. اسکن فقط روی سیستم‌هایی مجاز است که مالکشان هستید یا مجوز کتبی دارید؛ در بسیاری از کشورها و قراردادهای کلاود، اسکن بدون مجوز تخلف محسوب می‌شود.",
objectives:["تست اتصال TCP/UDP با nc و تفسیر refused در برابر timeout","استفاده از socat برای رله و پراکسی موقت بین انواع سوکت","اسکن پورت‌های میزبان خودتان با nmap و تفسیر open/closed/filtered"],
example:"اپ در Kubernetes به Redis خارجی وصل نمی‌شود. kubectl exec و سپس nc -vz -w 3 redis.internal 6379 بعد از ۳ ثانیه Timeout می‌شود (نه refused) — یعنی بسته در مسیر DROP شده؛ بررسی نشان می‌دهد Security Group Redis رنج IP Podها را مجاز نکرده است.",
code:"nc -vz -w 3 db.internal 5432        # تست TCP\nnc -vzu -w 3 10.0.0.2 53            # تست UDP (کم‌اعتمادتر)\nnc -l 9000                          # سرور ساده (OpenBSD nc)\nprintf 'GET / HTTP/1.1\\r\\nHost: example.com\\r\\nConnection: close\\r\\n\\r\\n' | nc example.com 80\n\n# بدون nc: Bash\ntimeout 3 bash -c '</dev/tcp/db.internal/5432' && echo open || echo closed/filtered\n\n# socat\nsocat TCP-LISTEN:8080,fork,reuseaddr TCP:10.0.0.5:80           # پراکسی TCP موقت\nsocat TCP-LISTEN:2375,bind=127.0.0.1,fork UNIX-CONNECT:/var/run/docker.sock\nsocat - OPENSSL:example.com:443,verify=1\n\n# nmap (فقط روی سیستم‌های خودتان)\nnmap -sT -p 22,80,443,5432,6379 my-server.example.com\nsudo nmap -sS -p- --min-rate 1000 my-server.example.com\nnmap -sV -p 443 --script ssl-enum-ciphers my-server.example.com",
exercise:"با nc یک گفت‌وگوی چت ساده بین دو ترمینال بسازید و یک درخواست HTTP دستی بفرستید. سپس با socat یک پراکسی موقت جلوی یک سرور محلی بسازید و با tcpdump ترافیک را ببینید. در نهایت VM خودتان را با nmap از بیرون اسکن کنید، یک پورت را با فایروال DROP و یکی را با REJECT ببندید و تفاوت filtered و closed را مشاهده کنید.",
project:"", resources:[{t:"Nmap Reference Guide",u:"https://nmap.org/book/man.html"},{t:"socat documentation",u:"http://www.dest-unreach.org/socat/doc/socat.html"},{t:"Ncat Users' Guide",u:"https://nmap.org/ncat/guide/index.html"}],
criteria:"می‌توانید با nc تشخیص دهید مشکل اتصال ناشی از فایروال است یا سرویس خاموش، یک رلهٔ موقت با socat بسازید و از دید بیرونی پورت‌های باز سرورهای خودتان را ممیزی کنید.",
interview:["تفاوت Connection refused و Timeout در تست اتصال چیست؟","وضعیت filtered در nmap چه معنایی دارد؟","SYN Scan چرا نیمه‌باز نامیده می‌شود؟"],
mistakes:["اسکن سیستم‌های دیگران بدون مجوز","اعتماد به نتیجهٔ تست UDP با nc (عدم پاسخ لزوماً یعنی بسته نیست)","رها کردن رلهٔ socat روی 0.0.0.0 بعد از پایان کار"],
production:"ممیزی دوره‌ای پورت‌های باز سرورهای عمومی با nmap از بیرون شبکه، یکی از ساده‌ترین کنترل‌هایی است که جلوی نشت سرویس‌های داخلی را می‌گیرد.",
ai:"nc، socat و nmap را با تمرکز بر عیب‌یابی اتصال و ممیزی امنیتی سرورهای خودم آموزش بده. چند سناریو بده که در آن باید با یک دستور تشخیص دهم مشکل از فایروال است، از سرویس یا از DNS، و خروجی nmap را با هم تفسیر کنیم."},
{id:"tool-tcpdump-wireshark",title:"tcpdump، tshark و Wireshark: کپچر و تحلیل بسته",level:"Intermediate",minLadder:3,prereqs:["tp-tcp-handshake-states"],
short:"دیدن حقیقت روی سیم: کپچر هدفمند با فیلتر BPF روی سرور و تحلیل عمیق با Wireshark.",
deep:"وقتی لاگ‌ها و حدس‌ها به نتیجه نمی‌رسند، بسته‌ها دروغ نمی‌گویند. tcpdump روی سرور کپچر می‌کند و دو نوع فیلتر وجود دارد: فیلتر کپچر BPF (مثلاً host 10.0.0.5 and tcp port 5432) که در کرنل اعمال می‌شود و فقط بسته‌های لازم را برمی‌دارد، و فیلتر نمایش Wireshark (مثلاً tcp.analysis.retransmission یا http.response.code >= 500) که بعداً روی فایل اعمال می‌شود. گزینه‌های کلیدی tcpdump: -i any یا رابط مشخص، -n و -nn (بدون Resolve نام و پورت؛ ضروری برای سرعت و جلوگیری از ترافیک DNS اضافه)، -w file.pcap برای ذخیره، -c برای محدود کردن تعداد، -s برای snaplen، -A یا -X برای دیدن Payload، و -C/-W برای چرخش فایل در کپچرهای طولانی. خواندن خروجی متنی: Flags [S] یعنی SYN، [S.] یعنی SYN-ACK، [.] یعنی ACK، [P.] یعنی داده با PSH، [F.] یعنی FIN و [R] یعنی RST؛ SYN بدون SYN-ACK یعنی بسته به سرور نمی‌رسد یا پاسخش برنمی‌گردد، و RST فوری یعنی کسی روی پورت گوش نمی‌دهد یا فایروالی REJECT می‌کند. Wireshark با Follow TCP Stream، گراف‌های Stream (tcptrace)، Expert Info و تحلیل خودکار Retransmission، Duplicate ACK و Zero Window، الگوهای کندی را آشکار می‌کند. TLS رمز شده است، اما می‌توان در محیط تست با متغیر SSLKEYLOGFILE (در curl، مرورگر و بسیاری از کتابخانه‌ها) کلیدها را ذخیره و در Wireshark رمزگشایی کرد. tshark نسخهٔ خط فرمان Wireshark برای تحلیل اسکریپتی است. ملاحظات: کپچر روی سرور تولید ممکن است دادهٔ حساس مشتری را شامل شود، پس با فیلتر دقیق، حجم محدود و رعایت سیاست نگهداری داده انجام دهید.",
objectives:["نوشتن فیلترهای BPF دقیق برای کپچر روی سرور تولید","خواندن Flagهای TCP در خروجی tcpdump و تشخیص الگوهای خرابی (SYN بی‌پاسخ، RST، Retransmission)","تحلیل فایل pcap در Wireshark با فیلتر نمایش و Follow Stream"],
example:"درخواست‌های اپ به یک API پرداخت گاهی ۳ ثانیه کند می‌شوند. tcpdump -nn -i any host 198.51.100.7 -w pay.pcap و تحلیل در Wireshark نشان می‌دهد اولین SYN بی‌پاسخ مانده و بعد از ۱ ثانیه SYN دوباره ارسال شده — Loss در مسیر، نه کندی اپلیکیشن طرف مقابل.",
code:"# کپچر هدفمند\nsudo tcpdump -i any -nn 'host 10.0.0.5 and tcp port 5432' -c 200\nsudo tcpdump -i eth0 -nn 'tcp[tcpflags] & (tcp-syn|tcp-rst) != 0'   # فقط SYN و RST\nsudo tcpdump -i any -nn port 53                 # ترافیک DNS\nsudo tcpdump -i eth0 -nn -s 0 -w /tmp/api.pcap 'host 198.51.100.7' -C 100 -W 5\nsudo tcpdump -nn -A 'tcp port 80'               # Payload متنی HTTP\n\n# tshark\ntshark -r /tmp/api.pcap -Y 'tcp.analysis.retransmission' | wc -l\ntshark -r /tmp/api.pcap -q -z conv,tcp\n\n# رمزگشایی TLS در محیط تست\nSSLKEYLOGFILE=/tmp/keys.log curl -s https://example.com -o /dev/null\n# Wireshark: Preferences > Protocols > TLS > (Pre)-Master-Secret log filename\n\n# فیلترهای نمایش Wireshark: tcp.flags.reset==1 , tcp.analysis.zero_window , http.response.code>=500",
exercise:"یک درخواست curl به یک سایت HTTPS را کپچر کنید و در Wireshark هندشیک TCP، هندشیک TLS (ClientHello با SNI) و بستن اتصال را شناسایی کنید؛ سپس با SSLKEYLOGFILE ترافیک را رمزگشایی کنید. در مرحلهٔ دوم، با tc qdisc netem روی یک VM ۵٪ Loss ایجاد کنید و Retransmissionها را در tshark شمارش کنید.",
project:"", resources:[{t:"tcpdump(1) man page",u:"https://www.tcpdump.org/manpages/tcpdump.1.html"},{t:"pcap-filter(7) - BPF filter syntax",u:"https://www.tcpdump.org/manpages/pcap-filter.7.html"},{t:"Wireshark User's Guide",u:"https://www.wireshark.org/docs/wsug_html_chunked/"},{t:"Wireshark Display Filter Reference",u:"https://www.wireshark.org/docs/dfref/"}],
criteria:"می‌توانید روی سرور تولید یک کپچر هدفمند و کم‌حجم بگیرید، از روی آن تشخیص دهید مشکل در هندشیک، Loss، RST یا کندی پاسخ سرور است و یافته را با شواهد pcap گزارش کنید.",
interview:["SYN بدون SYN-ACK در کپچر به چه معناست؟ RST فوری چطور؟","تفاوت فیلتر کپچر BPF و فیلتر نمایش Wireshark چیست؟","چطور ترافیک TLS را در محیط تست رمزگشایی می‌کنید؟"],
mistakes:["کپچر بدون فیلتر روی سرور پرترافیک و پر کردن دیسک","فراموش کردن -n و ایجاد بار DNS و کندی کپچر","نگهداری pcap حاوی دادهٔ حساس مشتری بدون رعایت سیاست امنیتی"],
production:"در اختلاف‌های «مشکل از ماست یا از سرویس‌دهندهٔ ثالث؟» (درگاه پرداخت، بانک، صرافی دیگر)، یک pcap با Timestamp دقیق قطعی‌ترین مدرک است.",
ai:"tcpdump و Wireshark را با تمرکز بر عیب‌یابی واقعی اتصالات TCP و TLS به من آموزش بده. خروجی‌های متنی tcpdump از سناریوهای مختلف (SYN بی‌پاسخ، RST، Retransmission، Zero Window) به من بده و بخواه هرکدام را تفسیر کنم و فیلتر مناسب برای کپچر بعدی بنویسم."},
{id:"tool-iperf-perf",title:"iperf3، ethtool، iftop/nethogs و اندازه‌گیری کارایی شبکه",level:"Intermediate",minLadder:3,prereqs:["nf-latency-bandwidth"],
short:"اندازه‌گیری واقعی Throughput بین دو نقطه، بررسی سلامت NIC و پیدا کردن اینکه کدام اتصال یا پروسه پهنای باند را مصرف می‌کند.",
deep:"قبل از اینکه دیتابیس یا اپلیکیشن را مقصر کندی بدانید، باید ظرفیت واقعی شبکه را بدانید. iperf3 با یک سرور (iperf3 -s) و یک کلاینت (iperf3 -c host) Throughput را اندازه می‌گیرد: -t مدت تست، -P تعداد جریان موازی (یک جریان TCP اغلب به‌دلیل محدودیت BDP و پنجره نمی‌تواند لینک پرتأخیر را پر کند، پس اختلاف تک‌جریان و چندجریان آموزنده است)، -R برای تست جهت معکوس (دانلود)، و -u -b 100M برای UDP که Jitter و درصد Loss را گزارش می‌کند. ستون Retr در خروجی TCP تعداد Retransmission است و مقدار بالای آن نشانهٔ Loss یا ازدحام است. ethtool سلامت سخت‌افزار را نشان می‌دهد: ethtool eth0 سرعت و Duplex مذاکره‌شده (یک لینک ۱۰ گیگ که روی ۱ گیگ یا Half Duplex مذاکره کرده عامل کلاسیک کندی است)، ethtool -S شمارنده‌های سطح درایور (rx_missed، rx_crc_errors، drops)، ethtool -g اندازهٔ Ring Buffer و ethtool -k وضعیت Offloadها (TSO، GRO). برای دیدن مصرف لحظه‌ای: iftop پهنای باند هر جفت IP، nethogs مصرف هر پروسه، nload نمودار کلی رابط و sar -n DEV 1 یا ip -s link برای آمار تاریخی و drop. nstat و /proc/net/snmp شمارنده‌های پروتکلی کرنل (RetransSegs، InErrors) را می‌دهند. tc qdisc netem هم ابزار شبیه‌سازی است: اضافه کردن Delay، Loss و Jitter مصنوعی برای اینکه ببینید سرویس شما با ۱۰۰ میلی‌ثانیه تأخیر یا ۲٪ Loss چه رفتاری دارد. در کلاود، سقف پهنای باند و PPS هر نوع Instance محدود است و Burst Credit دارد؛ اندازه‌گیری با iperf3 قبل از انتخاب Instance برای Replica دیتابیس یا Kafka از غافلگیری جلوگیری می‌کند.",
objectives:["اندازه‌گیری Throughput TCP و UDP با iperf3 و تفسیر Retr، Jitter و Loss","بررسی سرعت، Duplex و شمارنده‌های خطای NIC با ethtool","پیدا کردن مصرف‌کنندهٔ پهنای باند با iftop/nethogs و شبیه‌سازی شرایط بد با netem"],
example:"Replication دیتابیس بین دو دیتاسنتر عقب می‌افتد. iperf3 با یک جریان ۹۰ مگابیت و با -P 8 حدود ۸۵۰ مگابیت نشان می‌دهد: لینک ظرفیت دارد اما یک جریان TCP با RTT پنجاه میلی‌ثانیه به‌خاطر بافر/پنجرهٔ کوچک محدود شده؛ افزایش tcp_rmem/tcp_wmem مشکل را حل می‌کند.",
code:"# سرور\niperf3 -s\n# کلاینت\niperf3 -c 10.0.0.5 -t 20            # TCP یک جریان\niperf3 -c 10.0.0.5 -t 20 -P 8       # ۸ جریان موازی\niperf3 -c 10.0.0.5 -R               # جهت معکوس\niperf3 -c 10.0.0.5 -u -b 200M       # UDP: jitter و loss\n\n# سلامت NIC\nsudo ethtool eth0 | grep -E 'Speed|Duplex|Link detected'\nsudo ethtool -S eth0 | grep -iE 'drop|err|miss' | grep -v ': 0'\nip -s link show eth0\nnstat -az | grep -E 'TcpRetransSegs|TcpExtTCPLostRetransmit'\n\n# چه کسی پهنای باند را مصرف می‌کند؟\nsudo iftop -nNP -i eth0\nsudo nethogs eth0\nsar -n DEV 1 5\n\n# شبیه‌سازی شبکهٔ بد (روی VM تست)\nsudo tc qdisc add dev eth0 root netem delay 100ms 20ms loss 2%\nsudo tc qdisc del dev eth0 root",
exercise:"بین دو VM با iperf3 Throughput را با ۱ و ۸ جریان اندازه بگیرید. سپس با tc netem تأخیر ۸۰ms و Loss یک درصد اضافه کنید و دوباره اندازه بگیرید و نتیجه را با فرمول BDP و رفتار Congestion Control توضیح دهید. در نهایت یک دانلود بزرگ اجرا کنید و با nethogs و iftop پروسه و اتصال مصرف‌کننده را پیدا کنید.",
project:"", resources:[{t:"iperf3 - official site",u:"https://iperf.fr/"},{t:"esnet/iperf on GitHub",u:"https://github.com/esnet/iperf"},{t:"ethtool(8) man page",u:"https://man7.org/linux/man-pages/man8/ethtool.8.html"},{t:"tc-netem(8) man page",u:"https://man7.org/linux/man-pages/man8/tc-netem.8.html"}],
criteria:"می‌توانید ظرفیت واقعی شبکه بین دو سرور را اندازه بگیرید، مشکل سخت‌افزاری (Duplex، خطای CRC، drop) را از محدودیت پروتکلی (BDP، پنجره) تفکیک کنید و رفتار سرویس را زیر شرایط شبکهٔ بد آزمایش کنید.",
interview:["چرا یک جریان TCP نمی‌تواند لینک ۱ گیگ با RTT بالا را پر کند در حالی که چند جریان می‌توانند؟","ستون Retr در iperf3 چه چیزی را نشان می‌دهد؟","چطور رفتار سرویس را زیر Loss و تأخیر بالا تست می‌کنید؟"],
mistakes:["اجرای iperf3 روی لینک تولید در ساعات اوج و ایجاد اختلال","نتیجه‌گیری دربارهٔ ظرفیت لینک فقط از یک جریان TCP","فراموش کردن حذف قانون netem بعد از آزمایش"],
production:"انتخاب نوع Instance برای Replica دیتابیس، Kafka یا Node کلاستر بدون اندازه‌گیری واقعی شبکه، منجر به Replication Lag در روزهای پرترافیک بازار می‌شود.",
ai:"iperf3، ethtool، iftop/nethogs و tc netem را با تمرکز بر تفکیک مشکل ظرفیت لینک، خطای سخت‌افزار و محدودیت TCP به من آموزش بده. نتایج چند تست iperf3 و ethtool به من بده و بخواه علت کندی را تشخیص دهم."}
]},

{id:"p13",num:13,title:"شبکه در کرنل لینوکس",icon:"🐧",summary:"Namespace، veth و Bridge، تیونینگ sysctl، مسیر بسته در کرنل و eBPF/XDP.",
topics:[
{id:"lk-namespaces-veth",title:"Network Namespace، veth و Bridge: ساخت شبکهٔ کانتینر از صفر",level:"Advanced",minLadder:4,prereqs:["tool-iproute2","rt-linux-routing"],
short:"کانتینرها جادو نیستند: هر کانتینر یک network namespace است که با یک جفت veth به یک bridge روی میزبان وصل شده و با NAT به بیرون می‌رود.",
deep:"Network Namespace یک نسخهٔ کاملاً ایزولهٔ پشتهٔ شبکهٔ کرنل است: اینترفیس‌ها، جدول مسیریابی، قوانین iptables/nftables، جدول ARP، سوکت‌ها و حتی loopback مخصوص خودش را دارد. وقتی Docker یا containerd یک کانتینر می‌سازد، در عمل یک namespace جدید ایجاد می‌کند و چون namespace جدید در ابتدا فقط یک lo خاموش دارد، باید راهی برای اتصالش به دنیای بیرون ساخت. ابزار اصلی veth pair است: دو اینترفیس مجازی که مثل دو سر یک کابل‌اند؛ هر بسته‌ای که به یک سر وارد شود از سر دیگر خارج می‌شود. یک سر را داخل namespace کانتینر (معمولاً با نام eth0) و سر دیگر را روی میزبان نگه می‌دارند و به یک Linux bridge (مثل docker0 یا cni0) وصل می‌کنند؛ bridge مانند یک سوییچ لایه ۲ مجازی عمل می‌کند و کانتینرهای روی یک میزبان را به هم وصل می‌کند. برای دسترسی به اینترنت، bridge یک IP (مثلاً 172.17.0.1) به‌عنوان default gateway کانتینرها می‌گیرد، net.ipv4.ip_forward=1 روشن می‌شود و یک قانون MASQUERADE در جدول nat آدرس‌های خصوصی را به IP میزبان ترجمه می‌کند؛ Port Publishing (-p 8080:80) هم چیزی جز یک قانون DNAT نیست. فهم این زنجیره (namespace → veth → bridge → routing → NAT) یعنی وقتی پاد یا کانتینری به دیتابیس وصل نمی‌شود، به‌جای restart کورکورانه می‌توانید با nsenter وارد namespace شوید، ip route و ss را ببینید و دقیقاً بفهمید بسته کجا گم می‌شود. همین مفاهیم پایهٔ CNIهای Kubernetes (bridge، Calico، Cilium) هستند.",
objectives:["ساخت دستی دو namespace و اتصال آن‌ها با veth و bridge","فراهم کردن دسترسی اینترنت برای namespace با ip_forward و MASQUERADE","ورود به namespace یک کانتینر واقعی با nsenter و دیباگ شبکهٔ آن"],
example:"کانتینر Django به Postgres روی میزبان وصل نمی‌شود: با nsenter -t PID -n ip route می‌بینید default gateway روی 172.17.0.1 است ولی Postgres فقط روی 127.0.0.1 گوش می‌دهد؛ loopback کانتینر با loopback میزبان یکی نیست.",
code:"# دو namespace و یک bridge\nsudo ip netns add red\nsudo ip netns add blue\nsudo ip link add br0 type bridge\nsudo ip addr add 10.10.0.1/24 dev br0\nsudo ip link set br0 up\n\n# veth pair برای red\nsudo ip link add veth-red type veth peer name veth-red-br\nsudo ip link set veth-red netns red\nsudo ip link set veth-red-br master br0 up\nsudo ip netns exec red ip addr add 10.10.0.2/24 dev veth-red\nsudo ip netns exec red ip link set veth-red up\nsudo ip netns exec red ip link set lo up\nsudo ip netns exec red ip route add default via 10.10.0.1\n# (همین کار را برای blue با 10.10.0.3 تکرار کنید)\n\n# دسترسی به اینترنت\nsudo sysctl -w net.ipv4.ip_forward=1\nsudo iptables -t nat -A POSTROUTING -s 10.10.0.0/24 ! -o br0 -j MASQUERADE\nsudo ip netns exec red ping -c2 1.1.1.1\n\n# ورود به namespace یک کانتینر واقعی\nPID=$(docker inspect -f '{{.State.Pid}}' mycontainer)\nsudo nsenter -t $PID -n ss -tlnp",
exercise:"دو namespace به نام red و blue بسازید، با یک bridge به هم وصلشان کنید و ping بین آن‌ها را برقرار کنید. سپس اینترنت را برای هر دو فعال کنید و یک سرور python -m http.server را داخل red روی پورت 8000 اجرا کنید و با یک قانون DNAT از پورت 9000 میزبان در دسترس قرار دهید. در پایان با tcpdump -i br0 مسیر بسته‌ها را ببینید.",
project:"",
resources:[{t:"ip-netns(8) man page",u:"https://man7.org/linux/man-pages/man8/ip-netns.8.html"},{t:"veth(4) man page",u:"https://man7.org/linux/man-pages/man4/veth.4.html"},{t:"network_namespaces(7) man page",u:"https://man7.org/linux/man-pages/man7/network_namespaces.7.html"},{t:"Docker docs - Bridge network driver",u:"https://docs.docker.com/engine/network/drivers/bridge/"}],
criteria:"بدون Docker و فقط با ip/iptables می‌توانید دو «کانتینر» با شبکهٔ کامل (ارتباط با هم، اینترنت و Port Publishing) بسازید و هر مرحله را توضیح دهید.",
interview:["وقتی docker run -p 8080:80 اجرا می‌کنید، در سطح کرنل دقیقاً چه چیزهایی ساخته می‌شود؟","چرا localhost داخل کانتینر به سرویس‌های میزبان دسترسی ندارد؟","veth pair چیست و چرا همیشه به‌صورت جفت ساخته می‌شود؟"],
mistakes:["فراموش کردن ip link set lo up داخل namespace و خراب شدن سرویس‌هایی که به 127.0.0.1 وصل می‌شوند","خاموش بودن net.ipv4.ip_forward و گشتن بی‌نتیجه دنبال مشکل در iptables","فرض اینکه loopback کانتینر همان loopback میزبان است"],
production:"اکثر مشکلات «کانتینر به X وصل نمی‌شود» در Docker و Kubernetes در یکی از حلقه‌های namespace/veth/bridge/route/NAT رخ می‌دهد؛ مهندسی که این زنجیره را بشناسد در چند دقیقه با nsenter و tcpdump محل قطعی را پیدا می‌کند.",
ai:"مرا قدم‌به‌قدم در ساخت دستی شبکهٔ دو کانتینر با ip netns، veth، bridge و iptables همراهی کن و بعد از هر مرحله از من بخواه پیش‌بینی کنم ping یا curl کار می‌کند یا نه و چرا. در پایان این مدل را با کاری که Docker و یک CNI در Kubernetes انجام می‌دهند مقایسه کن."},
{id:"lk-sysctl-tuning",title:"تیونینگ sysctl: somaxconn، backlog، ephemeral ports، tcp_tw_reuse و بافرها",level:"Advanced",minLadder:4,prereqs:["tp-tcp-flow-congestion","tool-ss-netstat-lsof"],
short:"پارامترهای کرنل که در ترافیک بالا تعیین می‌کنند اتصال‌ها پذیرفته شوند، پورت خروجی تمام نشود و بافرها پهنای باند را محدود نکنند.",
deep:"پیش‌فرض‌های کرنل لینوکس برای یک سرور عمومی تنظیم شده‌اند، نه برای یک API Gateway که ده‌ها هزار اتصال در ثانیه می‌پذیرد. چند پارامتر کلیدی: net.core.somaxconn سقف طول صف accept (اتصال‌های کامل‌شده‌ای که هنوز اپلیکیشن accept نکرده) است؛ پیش‌فرض قدیمی 128 بود و از کرنل 5.4 به 4096 رسید، اما مقدار واقعی min(somaxconn, backlog پاس‌داده‌شده به listen()) است، پس باید backlog در Nginx یا Gunicorn هم بالا برود. net.ipv4.tcp_max_syn_backlog صف اتصال‌های نیمه‌باز (SYN_RECV) را محدود می‌کند. وقتی صف accept پر شود، کرنل SYN یا ACK را دور می‌ریزد و کلاینت با تأخیرهای ۱، ۳ و ۷ ثانیه‌ای retry می‌کند؛ نشانه‌اش افزایش ListenOverflows در nstat است. net.ipv4.ip_local_port_range محدودهٔ پورت‌های موقت کلاینت است (پیش‌فرض 32768-60999 یعنی حدود ۲۸ هزار پورت)؛ سرویسی که بدون connection pooling به یک upstream ثابت وصل می‌شود، با اتصال‌های TIME_WAIT (۶۰ ثانیه) سریع این محدوده را تمام می‌کند و خطای EADDRNOTAVAIL می‌گیرد. tcp_tw_reuse=1 اجازهٔ استفادهٔ مجدد امن از TIME_WAIT برای اتصال‌های خروجی را می‌دهد، ولی tcp_tw_recycle به‌دلیل خراب کردن کلاینت‌های پشت NAT حذف شده و نباید دنبالش بود. بافرهای net.core.rmem_max/wmem_max و tcp_rmem/tcp_wmem سقف پنجرهٔ TCP را تعیین می‌کنند؛ طبق BDP، برای 1Gbps با RTT برابر 100ms حداقل 12.5MB بافر لازم است. اصل طلایی: هیچ sysctl را کورکورانه از وبلاگ کپی نکنید؛ اول با ss -lnt، nstat و netstat -s ثابت کنید گلوگاه کجاست، یک پارامتر را تغییر دهید و اثرش را اندازه بگیرید.",
objectives:["تشخیص سرریز صف accept با ss -lnt و شمارنده‌های ListenOverflows/ListenDrops","توضیح رابطهٔ somaxconn با backlog اپلیکیشن","تشخیص و رفع کمبود ephemeral port","محاسبهٔ اندازهٔ بافر TCP لازم بر اساس BDP"],
example:"در کمپین فروش، سرویس سفارش‌ها خطای connect: cannot assign requested address به Redis می‌دهد؛ ss -tan state time-wait | wc -l حدود ۲۸ هزار اتصال TIME_WAIT نشان می‌دهد. راه‌حل اصلی connection pooling در کلاینت Redis است و بزرگ کردن ip_local_port_range و tcp_tw_reuse فقط مسکن.",
code:"# وضعیت صف accept: در حالت LISTEN ستون Recv-Q = طول فعلی صف و Send-Q = سقف آن\nss -lnt '( sport = :80 )'\n# شمارنده‌های سرریز\nnstat -az TcpExtListenOverflows TcpExtListenDrops\n\n# مقادیر فعلی\nsysctl net.core.somaxconn net.ipv4.tcp_max_syn_backlog net.ipv4.ip_local_port_range net.ipv4.tcp_tw_reuse\n\n# شمارش TIME_WAIT به تفکیک مقصد\nss -tan state time-wait | awk 'NR>1{print $4}' | sort | uniq -c | sort -rn | head\n\n# تنظیم پایدار در /etc/sysctl.d/90-net.conf\nnet.core.somaxconn = 8192\nnet.ipv4.tcp_max_syn_backlog = 8192\nnet.ipv4.ip_local_port_range = 10240 65000\nnet.ipv4.tcp_tw_reuse = 1\nnet.core.rmem_max = 16777216\nnet.core.wmem_max = 16777216\n# اعمال:\nsudo sysctl --system\n\n# یادتان نرود backlog اپلیکیشن را هم بالا ببرید (مثلاً nginx: listen 80 backlog=8192;  gunicorn: --backlog 8192)",
exercise:"یک سرور ساده با backlog=10 بنویسید که accept را با sleep کند می‌کند، سپس با wrk یا hey بار بزنید و افزایش ListenOverflows را در nstat ببینید. بعد backlog و somaxconn را بالا ببرید و نتیجه (تعداد خطا و p99) را مقایسه کنید. در یک آزمایش جدا، با یک اسکریپت پایتون بدون pooling هزاران اتصال کوتاه بسازید تا ephemeral port تمام شود.",
project:"",
resources:[{t:"Linux kernel docs - ip-sysctl",u:"https://docs.kernel.org/networking/ip-sysctl.html"},{t:"Cloudflare blog - SYN packet handling in the wild",u:"https://blog.cloudflare.com/syn-packet-handling-in-the-wild/"},{t:"Brendan Gregg - Linux Performance",u:"https://www.brendangregg.com/linuxperf.html"}],
criteria:"برای یک سرور زیر بار می‌توانید با داده (ss، nstat) نشان دهید گلوگاه صف accept است یا ephemeral port یا بافر، و تغییر sysctl مناسب را همراه با اندازه‌گیری قبل/بعد پیشنهاد دهید.",
interview:["Recv-Q و Send-Q در خروجی ss برای سوکت LISTEN چه معنایی دارند؟","چرا یک میکروسرویس با خطای EADDRNOTAVAIL مواجه می‌شود و راه‌حل اصولی چیست؟","چرا tcp_tw_recycle حذف شد و چرا نباید TIME_WAIT را دشمن دانست؟"],
mistakes:["کپی کردن لیست بلند sysctl از اینترنت بدون اندازه‌گیری و فهم اثر هرکدام","بالا بردن somaxconn بدون بالا بردن backlog در Nginx/Gunicorn","حل کمبود ephemeral port با tcp_tw_reuse به‌جای connection pooling"],
production:"در صرافی، اسپایک ترافیک هنگام نوسان شدید بازار می‌تواند صف accept را پر کند و کاربران تایم‌اوت‌های چندثانیه‌ای ببینند بدون اینکه CPU بالا باشد؛ مانیتور کردن ListenOverflows و TIME_WAIT جزو داشبوردهای پایهٔ هر سرویس پرترافیک است.",
ai:"یک سرور لینوکسی پشت Nginx را شبیه‌سازی کن که زیر بار، کاربران تایم‌اوت می‌گیرند و خروجی ss و nstat را مرحله‌به‌مرحله به من نشان بده تا خودم تشخیص دهم مشکل از صف accept، ephemeral port یا بافر است. بعد از من بخواه تغییر sysctl و تنظیم اپلیکیشن لازم را پیشنهاد و توجیه کنم."},
{id:"lk-packet-path",title:"مسیر بسته در کرنل: NIC، Ring Buffer، NAPI/softirq، Netfilter Hooks و Socket",level:"Expert",minLadder:null,prereqs:["fw-netfilter-iptables"],
short:"یک بسته از لحظهٔ رسیدن به کارت شبکه تا رسیدن به recv() اپلیکیشن از چه مراحلی در کرنل عبور می‌کند و کجاها ممکن است دور ریخته شود.",
deep:"وقتی یک فریم به NIC می‌رسد، کارت آن را با DMA مستقیماً در RX Ring Buffer (صفی از descriptorها در RAM که اندازه‌اش با ethtool -g دیده می‌شود) می‌نویسد و یک interrupt سخت‌افزاری می‌فرستد. لینوکس برای جلوگیری از طوفان interrupt در ترافیک بالا از NAPI استفاده می‌کند: هندلر interrupt فقط یک softirq از نوع NET_RX زمان‌بندی می‌کند و سپس کرنل در حالت polling چندین بسته را یکجا از ring برمی‌دارد (بودجه‌ای که با net.core.netdev_budget کنترل می‌شود). اگر ring پر شود، NIC بسته را دور می‌ریزد (rx_missed/rx_no_buffer در ethtool -S)؛ اگر softirq وقت کم بیاورد، ستون دوم /proc/net/softnet_stat رشد می‌کند. RSS و RPS بار پردازش را بین چند هستهٔ CPU پخش می‌کنند. سپس بسته به‌صورت sk_buff وارد پشتهٔ IP می‌شود و از hookهای Netfilter عبور می‌کند: PREROUTING (جایی که conntrack و DNAT اعمال می‌شوند)، تصمیم مسیریابی، سپس INPUT برای بسته‌های محلی یا FORWARD برای بسته‌های عبوری، و در مسیر خروجی OUTPUT و POSTROUTING (SNAT/MASQUERADE). بسته‌های محلی وارد لایهٔ TCP/UDP می‌شوند، سوکت مقصد با lookup پیدا می‌شود و داده در receive buffer سوکت قرار می‌گیرد؛ اگر اپلیکیشن کند بخواند و بافر پر شود، پنجرهٔ TCP صفر اعلام می‌شود. tcpdump با AF_PACKET قبل از Netfilter می‌بیند، پس دیدن بسته در tcpdump تضمین نمی‌کند فایروال آن را رد نکرده باشد. این دانش برای مهندسی است که باید dropهای مرموز را در سرورهای با ترافیک چند Gbps ریشه‌یابی کند.",
objectives:["ترسیم مسیر بسته از NIC تا سوکت و برعکس","شناخت نقاط drop: ring buffer، softnet backlog، Netfilter، socket buffer","خواندن ethtool -S، /proc/net/softnet_stat و nstat برای یافتن محل drop"],
example:"سرور WebSocket قیمت‌ها در اوج ترافیک بسته از دست می‌دهد اما CPU کلی پایین است؛ mpstat نشان می‌دهد یک هسته با ٪100 softirq اشباع شده چون همهٔ صف‌های NIC به آن هسته map شده‌اند؛ پخش IRQها و فعال کردن RPS مشکل را حل می‌کند.",
code:"# اندازهٔ ring buffer و drop در سطح NIC\nethtool -g eth0\nethtool -S eth0 | grep -Ei 'drop|miss|fifo|no_buf'\n\n# drop در softirq: ستون دوم = dropped، ستون سوم = time_squeeze (هگزادسیمال)\ncat /proc/net/softnet_stat\n\n# توزیع interruptها و مصرف softirq روی هسته‌ها\ngrep eth0 /proc/interrupts\nmpstat -P ALL 1   # ستون %soft\n\n# dropها در لایهٔ IP/TCP\nnstat -az | grep -Ei 'drop|overflow|prune'\n\n# ردیابی محل دقیق drop در کرنل (نیازمند bpftrace)\nsudo bpftrace -e 'tracepoint:skb:kfree_skb { @[kstack(5)] = count(); }'\n\n# بزرگ کردن ring buffer\nsudo ethtool -G eth0 rx 4096",
exercise:"روی یک VM با iperf3 بار UDP سنگین ایجاد کنید و هم‌زمان ethtool -S، softnet_stat و nstat را مانیتور کنید تا اولین نقطهٔ drop را پیدا کنید. سپس یک قانون iptables DROP روی INPUT اضافه کنید و نشان دهید tcpdump هنوز بسته‌ها را می‌بیند؛ توضیح دهید چرا.",
project:"",
resources:[{t:"PackageCloud - Monitoring and Tuning the Linux Networking Stack: Receiving Data",u:"https://blog.packagecloud.io/monitoring-tuning-linux-networking-stack-receiving-data/"},{t:"Linux kernel docs - Scaling in the Linux Networking Stack (RSS/RPS)",u:"https://docs.kernel.org/networking/scaling.html"},{t:"Netfilter project",u:"https://www.netfilter.org/"}],
criteria:"می‌توانید مسیر یک بستهٔ ورودی و یک بستهٔ forward شده را با نام hookها رسم کنید و برای یک سناریوی packet loss بگویید کدام شمارنده را برای هر لایه بررسی می‌کنید.",
interview:["چرا ممکن است بسته در tcpdump دیده شود ولی به اپلیکیشن نرسد؟","NAPI چه مشکلی را حل می‌کند؟","DNAT در کدام hook اعمال می‌شود و چرا قبل از تصمیم مسیریابی؟"],
mistakes:["اعتماد به tcpdump به‌عنوان اثبات رسیدن بسته به اپلیکیشن","نگاه به CPU کل به‌جای مصرف softirq هر هسته","تغییر اندازهٔ ring buffer بدون اندازه‌گیری drop واقعی"],
production:"در سرویس‌های کم‌تأخیر مثل market data یا موتور تطبیق، dropهای میکروثانیه‌ای در ring buffer یا softirq به‌صورت تأخیرهای retransmit چندصد میلی‌ثانیه‌ای در p99 ظاهر می‌شوند؛ یافتن آن‌ها بدون نقشهٔ مسیر بسته تقریباً غیرممکن است.",
ai:"مسیر یک بستهٔ TCP ورودی را از NIC تا recv() اپلیکیشن با من مرور کن و در هر مرحله از من بپرس اگر بسته اینجا drop شود با کدام ابزار و شمارنده آن را می‌بینم. سپس یک سناریوی packet loss زیر بار طراحی کن تا با این نقشه ریشه‌یابی کنم."},
{id:"lk-ebpf-xdp",title:"eBPF و XDP برای Observability و فیلتر سریع شبکه",level:"Expert",minLadder:null,prereqs:["lk-packet-path"],
short:"اجرای برنامه‌های کوچک و ایمن در کرنل برای ردیابی، فیلتر و پردازش بسته با سرعت نزدیک به سخت‌افزار، بدون تغییر کرنل.",
deep:"eBPF یک ماشین مجازی درون کرنل لینوکس است که اجازه می‌دهد برنامه‌های کوچک را بدون نوشتن ماژول کرنل و بدون ری‌بوت، به نقاط مختلف کرنل (kprobe، tracepoint، سوکت، tc، XDP، cgroup) متصل کنید. هر برنامه قبل از بارگذاری از verifier عبور می‌کند که تضمین می‌کند حلقهٔ بی‌پایان یا دسترسی غیرمجاز به حافظه ندارد، سپس با JIT به کد ماشین تبدیل می‌شود. داده بین کرنل و فضای کاربر از طریق mapها (hash، array، ring buffer) جابه‌جا می‌شود. در Observability، ابزارهایی مثل bpftrace و BCC (tcpconnect، tcpretrans، tcplife، tcpdrop) بدون overhead قابل‌توجه نشان می‌دهند کدام پروسه به کجا وصل می‌شود، کدام اتصال retransmit دارد و کجا بسته drop می‌شود — اطلاعاتی که قبلاً نیازمند tcpdump سنگین یا حدس بود. XDP (eXpress Data Path) برنامهٔ eBPF را در اولین نقطهٔ ممکن، در درایور NIC و قبل از ساخت sk_buff اجرا می‌کند و می‌تواند بسته را با XDP_DROP، XDP_PASS، XDP_TX یا XDP_REDIRECT مدیریت کند؛ به همین دلیل فیلتر DDoS با XDP می‌تواند ده‌ها میلیون بسته در ثانیه را روی یک سرور دور بریزد (Cloudflare و Facebook/Katran از آن استفاده می‌کنند). Cilium با eBPF جایگزین kube-proxy و iptables در Kubernetes می‌شود و NetworkPolicy را در سطح L3 تا L7 اعمال می‌کند. محدودیت‌ها: نیاز به کرنل جدید (ترجیحاً 5.x به بالا با BTF)، پیچیدگی نوشتن برنامه و نیاز به دسترسی root/CAP_BPF.",
objectives:["استفاده از ابزارهای آمادهٔ BCC/bpftrace برای ردیابی اتصال‌ها و retransmitها","توضیح جایگاه XDP در مسیر بسته و اکشن‌های آن","توضیح اینکه Cilium چگونه با eBPF جایگزین iptables می‌شود"],
example:"تیم SRE به‌جای tcpdump روی سرور پرترافیک، tcpretrans را اجرا می‌کند و در چند ثانیه می‌بیند تمام retransmitها به یک IP خاص از کلاستر Kafka مربوط است؛ مشکل به یک NIC معیوب روی آن broker محدود می‌شود.",
code:"# ابزارهای آمادهٔ BCC (در Ubuntu: apt install bpfcc-tools)\nsudo tcpconnect-bpfcc        # هر connect() خروجی با PID و مقصد\nsudo tcpretrans-bpfcc        # retransmitهای TCP به‌صورت زنده\nsudo tcplife-bpfcc           # طول عمر و حجم داده هر اتصال\n\n# bpftrace: شمارش اتصال‌های خروجی به تفکیک پروسه\nsudo bpftrace -e 'kprobe:tcp_connect { @[comm] = count(); }'\n\n# برنامهٔ XDP حداقلی (xdp_drop.c) که همهٔ بسته‌ها را دور می‌ریزد\n#include <linux/bpf.h>\n#include <bpf/bpf_helpers.h>\nSEC(\"xdp\")\nint xdp_drop_all(struct xdp_md *ctx) { return XDP_DROP; }\nchar _license[] SEC(\"license\") = \"GPL\";\n\n# کامپایل و اتصال (فقط روی اینترفیس آزمایشی!)\nclang -O2 -g -target bpf -c xdp_drop.c -o xdp_drop.o\nsudo ip link set dev veth-test xdp obj xdp_drop.o sec xdp\nsudo ip link set dev veth-test xdp off",
exercise:"bpfcc-tools را نصب کنید و هنگام اجرای تست‌های یک پروژهٔ Django، با tcpconnect همهٔ اتصال‌های خروجی (DB، Redis، APIهای خارجی) را فهرست کنید. سپس روی یک veth در یک namespace آزمایشی یک برنامهٔ XDP بنویسید که فقط ICMP را drop کند و با ping و curl نتیجه را بسنجید.",
project:"",
resources:[{t:"ebpf.io - What is eBPF?",u:"https://ebpf.io/what-is-ebpf/"},{t:"BCC tools (GitHub)",u:"https://github.com/iovisor/bcc"},{t:"bpftrace (GitHub)",u:"https://github.com/bpftrace/bpftrace"},{t:"Cilium documentation",u:"https://docs.cilium.io/"}],
criteria:"می‌توانید با ابزارهای eBPF یک سؤال واقعی دربارهٔ رفتار شبکهٔ یک سرویس (چه کسی به کجا وصل می‌شود، کجا retransmit داریم) را بدون tcpdump پاسخ دهید و توضیح دهید چرا XDP از iptables برای drop سریع‌تر است.",
interview:["verifier در eBPF چه چیزی را تضمین می‌کند؟","چرا XDP برای مقابله با DDoS سریع‌تر از iptables است؟","Cilium چه مزیتی نسبت به kube-proxy مبتنی بر iptables در کلاستر بزرگ دارد؟"],
mistakes:["اتصال برنامهٔ XDP آزمایشی به اینترفیس اصلی سرور و قطع دسترسی SSH","فرض اینکه همهٔ کرنل‌ها همهٔ قابلیت‌های eBPF را دارند","نوشتن برنامهٔ eBPF دست‌ساز وقتی ابزار آماده (BCC/bpftrace) همان سؤال را جواب می‌دهد"],
production:"eBPF امروز پایهٔ Observability و شبکهٔ مدرن کلاسترهای Kubernetes (Cilium، Pixie، Falco) است؛ حتی اگر خودتان برنامهٔ eBPF ننویسید، استفاده از ابزارهای آن در اینسیدنت‌ها زمان ریشه‌یابی را از ساعت به دقیقه می‌رساند.",
ai:"اول با ابزارهای آمادهٔ BCC و bpftrace مرا با eBPF آشنا کن و چند سؤال واقعی دیباگ شبکه بده که باید با آن‌ها جواب دهم. سپس XDP را با یک برنامهٔ ساده که بسته‌ها را فیلتر می‌کند توضیح بده و جایگاهش را در مسیر بسته کرنل با iptables مقایسه کن."}
]},

{id:"p14",num:14,title:"شبکهٔ کانتینر و کلاود",icon:"☸️",summary:"شبکهٔ Docker، مدل شبکهٔ Kubernetes و CNI، Service/Ingress، NetworkPolicy و VPC کلاود.",
topics:[
{id:"cn-docker-net",title:"شبکهٔ Docker: bridge، host، none، Port Publishing و DNS داخلی",level:"Intermediate",minLadder:2,prereqs:["ip-private-nat"],
short:"درایورهای شبکهٔ Docker، تفاوت شبکهٔ پیش‌فرض و user-defined، نحوهٔ کار -p و اینکه کانتینرها چگونه همدیگر را با نام پیدا می‌کنند.",
deep:"Docker چند درایور شبکه دارد: bridge (پیش‌فرض) هر کانتینر را در namespace جداگانه با یک veth به bridge میزبان (docker0) وصل می‌کند و با NAT به بیرون می‌برد؛ host کانتینر را در namespace شبکهٔ میزبان اجرا می‌کند (بدون ایزولاسیون و بدون NAT، با کارایی بالاتر ولی خطر تداخل پورت)؛ none فقط loopback دارد؛ و overlay برای ارتباط کانتینرها روی چند میزبان (Swarm) است. نکتهٔ مهم: شبکهٔ پیش‌فرض bridge از DNS داخلی پشتیبانی نمی‌کند، اما در شبکهٔ user-defined (که docker compose به‌طور خودکار برای هر پروژه می‌سازد)، Docker یک DNS سرور embedded روی 127.0.0.11 دارد که نام سرویس‌ها را به IP کانتینرها resolve می‌کند؛ به همین دلیل در compose می‌نویسید DATABASE_HOST=db. Port Publishing با -p 8080:80 در واقع یک قانون DNAT در زنجیرهٔ DOCKER از جدول nat و (در برخی حالت‌ها) یک پروسهٔ docker-proxy است. یک خطای امنیتی بسیار رایج: -p 5432:5432 به‌طور پیش‌فرض روی 0.0.0.0 گوش می‌دهد و چون Docker قوانین خودش را قبل از قوانین UFW در iptables قرار می‌دهد، دیتابیس با وجود فعال بودن UFW از اینترنت در دسترس می‌شود؛ باید -p 127.0.0.1:5432:5432 نوشت یا از زنجیرهٔ DOCKER-USER استفاده کرد. همچنین محدودهٔ پیش‌فرض 172.17.0.0/16 و 172.18+ ممکن است با شبکهٔ VPN یا VPC شرکت تداخل داشته باشد و باعث شود سرور به بخشی از شبکهٔ داخلی دسترسی نداشته باشد؛ این را با default-address-pools در daemon.json حل می‌کنند.",
objectives:["توضیح تفاوت درایورهای bridge، host و none","استفاده از DNS داخلی Docker در شبکهٔ user-defined و compose","انتشار امن پورت‌ها و شناخت مشکل Docker و UFW","رفع تداخل subnet داکر با شبکهٔ شرکت"],
example:"تیم Postgres را در compose با ports: '5432:5432' بالا آورده و UFW هم فعال است؛ اسکن خارجی با nmap پورت 5432 را باز نشان می‌دهد چون قانون DNAT داکر قبل از UFW اعمال می‌شود. اصلاح: حذف ports و دسترسی اپ از طریق شبکهٔ داخلی compose یا bind به 127.0.0.1.",
code:"# شبکهٔ user-defined با DNS داخلی\ndocker network create appnet\ndocker run -d --name db --network appnet -e POSTGRES_PASSWORD=x postgres:16\ndocker run --rm --network appnet alpine sh -c 'cat /etc/resolv.conf; getent hosts db'\n\n# انتشار پورت فقط روی localhost\ndocker run -d -p 127.0.0.1:8080:80 nginx\nsudo iptables -t nat -L DOCKER -n -v   # قانون DNAT ساخته‌شده\n\n# بررسی شبکه و IP کانتینرها\ndocker network inspect appnet --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{println}}{{end}}'\n\n# /etc/docker/daemon.json برای جلوگیری از تداخل subnet\n{\n  \"default-address-pools\": [{\"base\": \"10.200.0.0/16\", \"size\": 24}]\n}\n\n# مسدود کردن دسترسی بیرونی به پورت‌های منتشرشده\nsudo iptables -I DOCKER-USER -i eth0 ! -s 10.0.0.0/8 -j DROP",
exercise:"یک compose با سه سرویس (web، db، redis) بنویسید که فقط web پورت عمومی دارد و بقیه با نام سرویس در دسترس‌اند. سپس عمداً db را با ports: 5432:5432 منتشر کنید، UFW را فعال کنید و از ماشین دیگری با nmap ثابت کنید پورت باز است؛ در پایان با DOCKER-USER یا bind به 127.0.0.1 آن را ببندید.",
project:"",
resources:[{t:"Docker docs - Networking overview",u:"https://docs.docker.com/engine/network/"},{t:"Docker docs - Packet filtering and firewalls",u:"https://docs.docker.com/engine/network/packet-filtering-firewalls/"},{t:"Docker docs - Networking in Compose",u:"https://docs.docker.com/compose/how-tos/networking/"}],
criteria:"می‌توانید برای یک compose واقعی توضیح دهید هر سرویس چگونه دیگری را resolve می‌کند، کدام پورت‌ها از بیرون در دسترس‌اند و چرا، و قانون iptables متناظر با هر -p را نشان دهید.",
interview:["چرا در شبکهٔ پیش‌فرض bridge نمی‌توان با نام کانتینر وصل شد ولی در compose می‌شود؟","چرا UFW جلوی پورت منتشرشده توسط Docker را نمی‌گیرد؟","چه زمانی از network_mode: host استفاده می‌کنید و چه ریسکی دارد؟"],
mistakes:["انتشار پورت دیتابیس و Redis روی 0.0.0.0 در سرورهای عمومی","استفاده از IP کانتینر به‌جای نام سرویس که با هر restart تغییر می‌کند","نادیده گرفتن تداخل subnet داکر با VPN یا VPC شرکت"],
production:"Redis یا Postgresی که به‌اشتباه با Docker روی اینترنت منتشر شده یکی از رایج‌ترین علل نشت داده و نفوذ (مثلاً ماینرهای کریپتو) است؛ در یک صرافی، این خطا می‌تواند مستقیماً به افشای اطلاعات کاربران منجر شود.",
ai:"شبکهٔ Docker را با تمرکز بر compose، DNS داخلی و Port Publishing به من آموزش بده و از من بخواه برای یک compose نمونه پیش‌بینی کنم کدام سرویس‌ها از بیرون در دسترس‌اند. سپس مشکل امنیتی Docker و UFW را با من بازتولید و رفع کن."},
{id:"cn-cloud-vpc",title:"VPC کلاود: Subnet عمومی/خصوصی، Route Table، NAT Gateway، Peering و PrivateLink",level:"Intermediate",minLadder:3,prereqs:["rt-routing-table","ip-private-nat"],
short:"شبکهٔ خصوصی مجازی در کلاود: تقسیم آدرس، اینکه چه چیزی یک subnet را عمومی می‌کند، خروج امن به اینترنت و اتصال VPCها به هم.",
deep:"VPC (Virtual Private Cloud) یک شبکهٔ ایزولهٔ لایه ۳ در کلاود با یک بلوک CIDR (مثلاً 10.20.0.0/16) است که به subnetهایی در Availability Zoneهای مختلف تقسیم می‌شود. نکتهٔ کلیدی این است که «عمومی» یا «خصوصی» بودن یک subnet ویژگی خودش نیست، بلکه به Route Table آن بستگی دارد: subnetی که مسیر 0.0.0.0/0 آن به Internet Gateway اشاره کند عمومی است و منابعش با IP عمومی مستقیماً در دسترس‌اند؛ subnet خصوصی مسیر پیش‌فرضش به یک NAT Gateway در subnet عمومی است تا سرورها بتوانند به بیرون (مثلاً برای pip install یا API بانک) درخواست بدهند ولی از بیرون در دسترس نباشند. معماری استاندارد سه‌لایه: Load Balancer در subnet عمومی، اپلیکیشن در subnet خصوصی و دیتابیس در subnet خصوصی ایزوله‌تر، هرکدام در حداقل دو AZ. Security Group فایروال stateful در سطح اینترفیس و NACL فایروال stateless در سطح subnet است. برای اتصال VPCها: VPC Peering (یک‌به‌یک و غیرگذرا؛ اگر A با B و B با C peer باشد، A به C نمی‌رسد)، Transit Gateway (هاب مرکزی برای ده‌ها VPC و اتصال on-prem) و PrivateLink/VPC Endpoint (دسترسی خصوصی به یک سرویس مشخص مثل S3 بدون عبور از اینترنت). برنامه‌ریزی CIDR از روز اول حیاتی است: VPCهایی با CIDR هم‌پوشان هرگز نمی‌توانند peer شوند و تغییر بعدی بسیار پرهزینه است. هزینه هم جزو طراحی است: ترافیک NAT Gateway و ترافیک بین AZها هزینه دارند و یک سرویس پرحجم می‌تواند صورت‌حساب را منفجر کند.",
objectives:["طراحی CIDR و subnetهای عمومی/خصوصی در چند AZ","توضیح اینکه Route Table چه چیزی subnet را عمومی می‌کند","تفاوت Security Group و NACL","انتخاب بین Peering، Transit Gateway و PrivateLink"],
example:"سرور اپلیکیشن در subnet خصوصی نمی‌تواند به API یک درگاه پرداخت وصل شود؛ Route Table نشان می‌دهد مسیر 0.0.0.0/0 وجود ندارد چون NAT Gateway فراموش شده است. پس از افزودن NAT، IP عمومی ثابت آن را به allowlist درگاه پرداخت هم می‌دهید.",
code:"# Terraform: VPC با یک subnet عمومی و یک خصوصی (خلاصه)\nresource \"aws_vpc\" \"main\" { cidr_block = \"10.20.0.0/16\" }\n\nresource \"aws_subnet\" \"public_a\"  { vpc_id = aws_vpc.main.id  cidr_block = \"10.20.0.0/24\"  availability_zone = \"eu-central-1a\" }\nresource \"aws_subnet\" \"private_a\" { vpc_id = aws_vpc.main.id  cidr_block = \"10.20.10.0/24\" availability_zone = \"eu-central-1a\" }\n\nresource \"aws_internet_gateway\" \"igw\" { vpc_id = aws_vpc.main.id }\nresource \"aws_eip\" \"nat\" { domain = \"vpc\" }\nresource \"aws_nat_gateway\" \"nat\" { allocation_id = aws_eip.nat.id  subnet_id = aws_subnet.public_a.id }\n\n# همین Route Tableها هستند که subnet را عمومی/خصوصی می‌کنند\nresource \"aws_route_table\" \"public\" {\n  vpc_id = aws_vpc.main.id\n  route { cidr_block = \"0.0.0.0/0\"  gateway_id = aws_internet_gateway.igw.id }\n}\nresource \"aws_route_table\" \"private\" {\n  vpc_id = aws_vpc.main.id\n  route { cidr_block = \"0.0.0.0/0\"  nat_gateway_id = aws_nat_gateway.nat.id }\n}\n\n# برنامه‌ریزی CIDR با پایتون\nimport ipaddress\nfor s in list(ipaddress.ip_network('10.20.0.0/16').subnets(new_prefix=20))[:6]: print(s)",
exercise:"برای یک سرویس سه‌لایه (ALB، اپ Django، Postgres) در دو AZ یک طرح CIDR و Route Table روی کاغذ بکشید و سپس با Terraform (یا در LocalStack/حساب آزمایشی) پیاده کنید. ثابت کنید سرور خصوصی به اینترنت می‌رسد ولی از اینترنت در دسترس نیست. در پایان هزینهٔ ماهانهٔ NAT Gateway را برای ۵۰۰ گیگابایت ترافیک خروجی تخمین بزنید.",
project:"",
resources:[{t:"AWS - How Amazon VPC works",u:"https://docs.aws.amazon.com/vpc/latest/userguide/how-it-works.html"},{t:"AWS - NAT gateways",u:"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html"},{t:"AWS - VPC peering",u:"https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html"},{t:"Google Cloud - VPC overview",u:"https://cloud.google.com/vpc/docs/vpc"}],
criteria:"می‌توانید یک VPC چند-AZ با subnet عمومی و خصوصی طراحی کنید، توضیح دهید چرا CIDR هم‌پوشان آینده را می‌بندد و برای اتصال به VPC دیگر یا سرویس مدیریت‌شده گزینهٔ مناسب را با دلیل انتخاب کنید.",
interview:["چه چیزی یک subnet را در AWS عمومی می‌کند؟","چرا VPC Peering گذرا نیست و چه زمانی Transit Gateway لازم است؟","تفاوت Security Group و NACL چیست؟"],
mistakes:["انتخاب CIDR هم‌پوشان (مثلاً همه 10.0.0.0/16) برای چند VPC که بعداً باید به هم وصل شوند","قرار دادن دیتابیس در subnet عمومی","یک NAT Gateway برای چند AZ که هم نقطهٔ شکست است و هم هزینهٔ ترافیک بین‌AZ دارد"],
production:"درگاه‌های پرداخت و بانک‌ها معمولاً IP مبدأ را allowlist می‌کنند؛ طراحی درست NAT با IP ثابت، جداسازی subnet دیتابیس و برنامه‌ریزی CIDR برای اتصال آیندهٔ VPCها و دیتاسنتر داخلی از تصمیمات پایه‌ای زیرساخت یک صرافی است.",
ai:"یک VPC برای یک سرویس مالی سه‌لایه با من طراحی کن: از من بخواه CIDR، subnetها، Route Tableها و Security Groupها را پیشنهاد دهم و اشکالاتم را با سناریوهای واقعی (اتصال به VPC دیگر، دسترسی به درگاه پرداخت، خرابی یک AZ) به چالش بکش."},
{id:"cn-k8s-net-model",title:"مدل شبکهٔ Kubernetes: Pod IP و CNI (Calico، Cilium، Flannel)",level:"Advanced",minLadder:3,prereqs:["cn-docker-net"],
short:"قوانین بنیادی شبکهٔ Kubernetes (هر Pod یک IP، ارتباط مستقیم بدون NAT) و اینکه پلاگین‌های CNI چگونه این قوانین را پیاده می‌کنند.",
deep:"مدل شبکهٔ Kubernetes سه قانون ساده ولی قدرتمند دارد: هر Pod یک IP واقعی و یکتا در کلاستر دارد؛ همهٔ Podها بدون NAT می‌توانند مستقیماً با همهٔ Podهای دیگر (روی هر Node) ارتباط بگیرند؛ و agentهای روی Node (مثل kubelet) می‌توانند با همهٔ Podهای آن Node صحبت کنند. همهٔ کانتینرهای یک Pod یک network namespace مشترک دارند (که توسط کانتینر pause نگه داشته می‌شود)، پس از طریق localhost با هم صحبت می‌کنند و نباید روی یک پورت گوش دهند. خود Kubernetes این شبکه را پیاده نمی‌کند؛ این کار CNI (Container Network Interface) است: وقتی Pod ساخته می‌شود، container runtime پلاگین CNI را صدا می‌زند تا veth بسازد، IP از محدودهٔ Pod CIDR آن Node تخصیص دهد (IPAM) و مسیرها را تنظیم کند. تفاوت CNIها در نحوهٔ رساندن بسته بین Nodeهاست: Flannel ساده است و معمولاً با VXLAN overlay کار می‌کند (۵۰ بایت overhead و کاهش MTU)؛ Calico می‌تواند بدون overlay با BGP مسیر Podها را به روترها اعلام کند (routing خالص، کارایی بالا) و NetworkPolicy قوی دارد؛ Cilium مبتنی بر eBPF است، می‌تواند جایگزین kube-proxy شود و Policy لایه ۷ و Observability (Hubble) ارائه می‌دهد؛ CNIهای کلاود مثل AWS VPC CNI به Podها مستقیماً IP از VPC می‌دهند که ادغام با شبکهٔ کلاود را ساده ولی تعداد Pod هر Node را به تعداد ENI و IP محدود می‌کند. تصمیمات کلیدی: اندازهٔ Pod CIDR (تمام شدن IP یک خطای رایج است)، عدم تداخل با CIDR شبکهٔ شرکت، و MTU درست در overlay.",
objectives:["توضیح سه قانون مدل شبکهٔ Kubernetes","توضیح نقش کانتینر pause و namespace مشترک Pod","مقایسهٔ overlay (VXLAN) با routing (BGP) و CNIهای کلاود","دیباگ ارتباط Pod به Pod روی دو Node"],
example:"بعد از مهاجرت به Flannel با VXLAN، آپلود فایل‌های بزرگ بین سرویس‌ها گاهی گیر می‌کند در حالی که ping کار می‌کند؛ علت MTU است: اینترفیس Pod هنوز 1500 دارد ولی overlay فقط 1450 را جا می‌دهد و بسته‌های بزرگ با DF drop می‌شوند.",
code:"# IP Podها و Node میزبان\nkubectl get pods -o wide\nkubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"  \"}{.spec.podCIDR}{\"\\n\"}{end}'\n\n# پیکربندی CNI روی Node\nls /etc/cni/net.d/ && cat /etc/cni/net.d/*.conflist\n\n# Pod دیباگ با ابزارهای شبکه\nkubectl run netshoot --rm -it --image=nicolaka/netshoot -- bash\n#   ip addr; ip route; ping <POD_IP_ON_OTHER_NODE>; tracepath <POD_IP>\n\n# روی Node: veth هر Pod و مسیرها به Pod CIDR بقیهٔ Nodeها\nip route | grep -E 'cni|flannel|cali|vxlan'\nip -d link show flannel.1   # جزئیات VXLAN و MTU\n\n# Cilium: وضعیت و مشاهدهٔ جریان‌ها\ncilium status\nhubble observe --pod default/myapp",
exercise:"با kind یا k3d یک کلاستر دو Node بسازید، دو Pod روی دو Node مختلف بالا بیاورید و مسیر بسته بین آن‌ها را با ip route روی Nodeها و tcpdump روی اینترفیس overlay ردیابی کنید. سپس CNI را (مثلاً از Flannel به Cilium یا Calico) عوض کنید و تفاوت مسیرها و MTU را مستند کنید.",
project:"",
resources:[{t:"Kubernetes docs - Cluster Networking",u:"https://kubernetes.io/docs/concepts/cluster-administration/networking/"},{t:"CNI specification (GitHub)",u:"https://github.com/containernetworking/cni"},{t:"Calico documentation",u:"https://docs.tigera.io/calico/latest/about/"},{t:"Cilium documentation",u:"https://docs.cilium.io/"}],
criteria:"می‌توانید توضیح دهید یک بسته از Pod A روی Node 1 به Pod B روی Node 2 با CNI کلاستر خودتان دقیقاً از چه اینترفیس‌ها و مسیرهایی عبور می‌کند و برای انتخاب CNI یک مقایسهٔ مستدل ارائه دهید.",
interview:["سه قانون مدل شبکهٔ Kubernetes چیست؟","کانتینر pause چه نقشی دارد؟","تفاوت Calico در حالت BGP با Flannel در حالت VXLAN از نظر کارایی و پیچیدگی چیست؟"],
mistakes:["انتخاب Pod CIDR کوچک یا هم‌پوشان با شبکهٔ شرکت","نادیده گرفتن MTU در شبکهٔ overlay","فرض اینکه Kubernetes خودش بدون CNI شبکهٔ Podها را می‌سازد"],
production:"در کلاستری که سرویس‌های سفارش، کیف پول و market data روی آن‌اند، انتخاب CNI روی تأخیر بین سرویس‌ها، امکان اعمال NetworkPolicy و قابلیت مشاهده‌پذیری ترافیک اثر مستقیم دارد و تغییر آن بعد از راه‌اندازی بسیار پرهزینه است.",
ai:"مدل شبکهٔ Kubernetes را با رسم مسیر یک بسته بین دو Pod روی دو Node برای من توضیح بده و بعد تفاوت Flannel، Calico، Cilium و AWS VPC CNI را با پرسش‌هایی که مرا مجبور به مقایسه کند آموزش بده. در پایان یک مشکل اتصال Pod به Pod طراحی کن تا دیباگ کنم."},
{id:"cn-k8s-services-ingress",title:"Service، kube-proxy (iptables/IPVS)، Ingress، Gateway API و CoreDNS",level:"Advanced",minLadder:3,prereqs:["cn-k8s-net-model","px-l4-l7-lb"],
short:"چگونه ترافیک به مجموعهٔ متغیری از Podها می‌رسد: ClusterIP مجازی، پیاده‌سازی kube-proxy، DNS سرویس‌ها و ورود ترافیک بیرونی با Ingress و Gateway API.",
deep:"Podها موقتی‌اند و IPشان با هر restart عوض می‌شود؛ Service یک آدرس پایدار (ClusterIP) و یک نام DNS برای مجموعه‌ای از Podها که با selector انتخاب می‌شوند فراهم می‌کند. ClusterIP یک IP مجازی است که روی هیچ اینترفیسی وجود ندارد: kube-proxy روی هر Node از EndpointSliceها (فهرست IP Podهای آماده) قوانین iptables یا IPVS می‌سازد که بسته‌های مقصد ClusterIP را با DNAT به یکی از Podها می‌فرستند. در حالت iptables، انتخاب Pod تصادفی و هزینهٔ به‌روزرسانی قوانین با تعداد سرویس‌ها خطی رشد می‌کند؛ IPVS از جدول hash و الگوریتم‌هایی مثل round-robin و least-conn استفاده می‌کند و در کلاسترهای بزرگ مقیاس‌پذیرتر است؛ Cilium می‌تواند کل kube-proxy را با eBPF جایگزین کند. انواع Service: ClusterIP (داخلی)، NodePort (پورت 30000-32767 روی همهٔ Nodeها)، LoadBalancer (درخواست LB از کلاود) و Headless (clusterIP: None که DNS مستقیماً IP Podها را برمی‌گرداند؛ برای StatefulSet و دیتابیس‌ها). CoreDNS نام‌ها را به شکل svc.namespace.svc.cluster.local resolve می‌کند؛ تنظیم پیش‌فرض ndots:5 باعث می‌شود هر نام خارجی مثل api.stripe.com اول با چند search domain امتحان شود و چند کوئری بیهوده بسازد. نکتهٔ مهم: Service در لایه ۴ کار می‌کند و چون اتصال‌های HTTP/2 و gRPC طولانی‌اند، توزیع بار در سطح اتصال انجام می‌شود نه درخواست. Ingress (و نسل جدیدش Gateway API) ترافیک HTTP بیرونی را بر اساس host و path به سرویس‌ها می‌رساند و TLS را terminate می‌کند؛ externalTrafficPolicy: Local هم IP واقعی کلاینت را حفظ می‌کند.",
objectives:["توضیح نحوهٔ کار ClusterIP و DNAT توسط kube-proxy","مقایسهٔ حالت‌های iptables و IPVS","استفادهٔ درست از انواع Service از جمله Headless","پیکربندی Ingress/Gateway API با TLS و شناخت مشکل ndots"],
example:"سرویس gRPC قیمت‌گذاری سه replica دارد ولی تمام بار روی یکی است؛ چون Service لایه ۴ است و کلاینت gRPC فقط یک اتصال HTTP/2 طولانی باز کرده. راه‌حل: Headless Service با load balancing سمت کلاینت یا یک پراکسی L7 مثل Envoy/Linkerd.",
code:"# Service و Endpointها\nkubectl get svc,endpointslices -l app=orders\nkubectl describe svc orders\n\n# قوانین ساخته‌شده توسط kube-proxy (حالت iptables) روی یک Node\nsudo iptables -t nat -L KUBE-SERVICES -n | grep orders\nsudo ipvsadm -Ln   # در حالت IPVS\n\n# DNS داخل Pod\nkubectl exec -it deploy/orders -- cat /etc/resolv.conf\nkubectl exec -it deploy/orders -- nslookup postgres.db.svc.cluster.local\n\n# کاهش کوئری‌های DNS بیهوده برای نام‌های خارجی\nspec:\n  dnsConfig:\n    options:\n      - name: ndots\n        value: \"2\"\n\n# Ingress با TLS\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: api\nspec:\n  ingressClassName: nginx\n  tls:\n    - hosts: [api.example.com]\n      secretName: api-tls\n  rules:\n    - host: api.example.com\n      http:\n        paths:\n          - path: /\n            pathType: Prefix\n            backend:\n              service: { name: orders, port: { number: 80 } }",
exercise:"در یک کلاستر kind یک Deployment سه‌replica با یک Service بسازید، قوانین iptables متناظر را روی Node پیدا کنید و ترتیب زنجیره‌ها (KUBE-SERVICES → KUBE-SVC → KUBE-SEP) را رسم کنید. سپس با tcpdump روی Pod coredns نشان دهید یک nslookup برای google.com با ndots:5 چند کوئری می‌سازد و بعد از ndots:2 چند تا.",
project:"",
resources:[{t:"Kubernetes docs - Service",u:"https://kubernetes.io/docs/concepts/services-networking/service/"},{t:"Kubernetes docs - Virtual IPs and Service Proxies",u:"https://kubernetes.io/docs/reference/networking/virtual-ips/"},{t:"Kubernetes docs - DNS for Services and Pods",u:"https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"},{t:"Gateway API",u:"https://gateway-api.sigs.k8s.io/"}],
criteria:"می‌توانید مسیر یک درخواست از اینترنت تا Pod (LB → Ingress Controller → Service → Pod) را با جزئیات DNAT و DNS توضیح دهید و یک مشکل عدم توازن بار یا کندی DNS را ریشه‌یابی کنید.",
interview:["ClusterIP روی کدام اینترفیس است؟ بسته چطور به Pod می‌رسد؟","چرا Service برای gRPC بار را خوب پخش نمی‌کند؟","Headless Service چیست و چه زمانی لازم است؟"],
mistakes:["انتظار load balancing درخواست‌به‌درخواست از Service برای اتصال‌های پایدار HTTP/2/gRPC","نادیده گرفتن ndots:5 و انفجار کوئری‌های DNS به CoreDNS","نداشتن readinessProbe و ارسال ترافیک به Podهایی که هنوز آماده نیستند"],
production:"اینسیدنت‌های رایج در کلاسترهای پرترافیک شامل throttling یا timeout در CoreDNS، conntrack race در DNS روی UDP و عدم توازن بار gRPC است؛ فهم لایهٔ Service و DNS برای سرویس‌هایی مثل ثبت سفارش که هر میلی‌ثانیه مهم است ضروری است.",

{id:"cn-k8s-netpol",title:"NetworkPolicy و ایزوله‌سازی ترافیک در Kubernetes",level:"Advanced",minLadder:4,prereqs:["cn-k8s-net-model","fw-netfilter-iptables"],
short:"به‌طور پیش‌فرض هر Pod به هر Pod دیگری دسترسی دارد؛ NetworkPolicy فایروال لایه ۳/۴ مبتنی بر label برای پیاده‌سازی default-deny و حداقل دسترسی است.",
deep:"در Kubernetes، شبکه به‌طور پیش‌فرض کاملاً باز است: هر Pod در هر namespace می‌تواند به هر Pod دیگر وصل شود. یعنی اگر یک سرویس کم‌اهمیت (مثلاً سرویس ارسال ایمیل) نفوذ شود، مهاجم مستقیماً به دیتابیس کیف پول دسترسی شبکه‌ای دارد. NetworkPolicy منابعی است که با podSelector مشخص می‌کند روی کدام Podها اعمال شود و با قوانین ingress و egress (بر اساس podSelector، namespaceSelector، ipBlock و پورت) ترافیک مجاز را تعریف می‌کند. منطق آن additive است: به محض اینکه یک Pod توسط حداقل یک Policy از نوع Ingress انتخاب شود، هر ترافیک ورودی که صراحتاً مجاز نشده رد می‌شود؛ هیچ قانون deny صریحی وجود ندارد و Policyها با هم OR می‌شوند. الگوی استاندارد: یک Policy با podSelector خالی برای default-deny ورودی و خروجی در هر namespace، سپس Policyهای کوچک allow برای هر جریان مجاز. دام بزرگ: اگر egress را deny کنید و DNS (پورت 53 UDP/TCP به CoreDNS در kube-system) را مجاز نکنید، همهٔ سرویس‌ها از کار می‌افتند. یک دام مهم‌تر: NetworkPolicy فقط یک API است و اگر CNI آن را پشتیبانی نکند (مثل Flannel خالص) بدون هیچ خطایی نادیده گرفته می‌شود. NetworkPolicy استاندارد فقط L3/L4 است؛ برای قوانین مبتنی بر FQDN یا مسیر HTTP باید از CiliumNetworkPolicy یا Calico GlobalNetworkPolicy یا service mesh با mTLS و AuthorizationPolicy استفاده کرد. در یک سازمان مالی، NetworkPolicy جزئی از Defense in Depth و اغلب از الزامات ممیزی مثل PCI DSS برای segmentation است.",
objectives:["پیاده‌سازی default-deny برای ingress و egress در یک namespace","نوشتن Policyهای allow مبتنی بر label و namespace","آزمایش و اعتبارسنجی Policyها و شناخت وابستگی به CNI","شناخت محدودیت‌های L3/L4 و گزینه‌های L7"],
example:"در namespace payments ابتدا default-deny اعمال می‌شود، سپس فقط Pod‌های app=api از namespace gateway اجازهٔ ورود روی پورت 8000 دارند، Pod‌های payments فقط به postgres روی 5432 و به DNS روی 53 خروجی دارند و دسترسی به بقیهٔ کلاستر قطع است.",
code:"# default-deny برای همهٔ Podهای namespace\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: default-deny, namespace: payments }\nspec:\n  podSelector: {}\n  policyTypes: [Ingress, Egress]\n---\n# اجازهٔ DNS (بدون این، همه‌چیز می‌شکند)\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: allow-dns, namespace: payments }\nspec:\n  podSelector: {}\n  policyTypes: [Egress]\n  egress:\n    - to:\n        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }\n          podSelector: { matchLabels: { k8s-app: kube-dns } }\n      ports: [ { protocol: UDP, port: 53 }, { protocol: TCP, port: 53 } ]\n---\n# فقط gateway می‌تواند به api روی 8000 وصل شود\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: allow-from-gateway, namespace: payments }\nspec:\n  podSelector: { matchLabels: { app: api } }\n  ingress:\n    - from:\n        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gateway } }\n      ports: [ { protocol: TCP, port: 8000 } ]\n\n# آزمایش\nkubectl -n other run t --rm -it --image=nicolaka/netshoot -- curl -m3 api.payments:8000",
exercise:"در یک کلاستر kind با Calico یا Cilium، سه namespace (frontend، payments، db) بسازید، default-deny را اعمال کنید و فقط جریان‌های frontend → payments:8000 و payments → db:5432 را باز کنید. با Podهای netshoot یک ماتریس تست اتصال بنویسید که ثابت کند همهٔ مسیرهای دیگر بسته‌اند. سپس همین Policyها را روی کلاستری با Flannel اعمال کنید و ببینید هیچ اثری ندارند.",
project:"",
resources:[{t:"Kubernetes docs - Network Policies",u:"https://kubernetes.io/docs/concepts/services-networking/network-policies/"},{t:"Kubernetes Network Policy Recipes (GitHub)",u:"https://github.com/ahmetb/kubernetes-network-policy-recipes"},{t:"Cilium - Network Policy",u:"https://docs.cilium.io/en/stable/security/policy/"},{t:"Network Policy Editor (Cilium)",u:"https://editor.networkpolicy.io/"}],
criteria:"می‌توانید برای یک namespace واقعی default-deny با allowهای حداقلی پیاده کنید، با تست خودکار اتصال آن را اثبات کنید و توضیح دهید چرا بدون پشتیبانی CNI یا بدون قانون DNS سیستم چه رفتاری دارد.",
interview:["اگر هیچ NetworkPolicyی وجود نداشته باشد رفتار پیش‌فرض چیست؟","چرا بعد از default-deny egress همهٔ سرویس‌ها از کار افتادند؟","چطور دسترسی خروجی را فقط به یک دامنهٔ خارجی (مثلاً API بانک) محدود می‌کنید؟"],
mistakes:["اعمال default-deny egress بدون مجاز کردن DNS","استفاده از CNI بدون پشتیبانی NetworkPolicy و احساس امنیت کاذب","استفاده از ipBlock برای IP Podها که دائماً عوض می‌شوند به‌جای label"],
production:"segmentation شبکه بین سرویس‌های عمومی و سرویس‌های حساس مثل کیف پول و امضای تراکنش یک الزام امنیتی و ممیزی در سازمان‌های مالی است؛ NetworkPolicy ساده‌ترین لایهٔ آن در Kubernetes است و جلوی حرکت جانبی (lateral movement) مهاجم را می‌گیرد.",
ai:"یک کلاستر فرضی با سرویس‌های frontend، api، wallet و postgres به من بده و از من بخواه NetworkPolicyهای حداقل دسترسی را بنویسم. Policyهای من را با سناریوهای حمله (نفوذ به frontend) و خطاهای رایج (فراموش کردن DNS، CNI بدون پشتیبانی) به چالش بکش."}
]},

{id:"p15",num:15,title:"عیب‌یابی، عملکرد و طراحی شبکه",icon:"🔍",summary:"روش لایه‌به‌لایه، MTU Black Hole، تحلیل تأخیر، مانیتورینگ شبکه و بازبینی معماری شبکهٔ سیستم.",
topics:[
{id:"ts-methodology",title:"روش لایه‌به‌لایهٔ عیب‌یابی شبکه (Bottom-up، Top-down، Divide & Conquer)",level:"Intermediate",minLadder:2,prereqs:["tool-ping-trace-mtr","tool-dig","tool-curl-wget"],
short:"به‌جای حدس زدن، مشکل شبکه را با پرسش‌های ترتیبی لایه‌به‌لایه (نام، مسیر، پورت، TLS، اپلیکیشن) به یک نقطهٔ مشخص محدود کنید.",
deep:"جملهٔ «شبکه مشکل دارد» در اکثر مواقع یعنی هنوز نمی‌دانیم مشکل کجاست. عیب‌یابی سیستماتیک با مدل لایه‌ای این ابهام را به یک سؤال مشخص تبدیل می‌کند. سه رویکرد رایج: Bottom-up از لایهٔ فیزیکی و IP شروع می‌کند (لینک بالا است؟ IP و route درست است؟)؛ Top-down از اپلیکیشن شروع می‌کند (کد خطا چیست؟ لاگ چه می‌گوید؟)؛ و Divide & Conquer از وسط شروع می‌کند، معمولاً با یک تست اتصال TCP، و بسته به نتیجه به بالا یا پایین می‌رود — سریع‌ترین روش در عمل. یک چک‌لیست عملی برای «سرویس A به B وصل نمی‌شود»: ۱) نام درست resolve می‌شود؟ (dig، و توجه به اینکه اپلیکیشن ممکن است از resolver یا /etc/hosts دیگری استفاده کند) ۲) مسیر وجود دارد؟ (ip route get، traceroute/mtr) ۳) پورت باز است؟ (nc -zv یا curl -v؛ تفاوت Connection refused که یعنی میزبان رسیده ولی کسی گوش نمی‌دهد یا RST فرستاده، با timeout که معمولاً یعنی فایروال بسته را بی‌صدا drop کرده) ۴) TLS موفق است؟ (openssl s_client، گواهی منقضی یا SNI اشتباه) ۵) اپلیکیشن پاسخ درست می‌دهد؟ (کد HTTP، لاگ). مهم است از همان جایی تست کنید که مشکل دارد: curl از لپ‌تاپ شما چیزی دربارهٔ مسیر Pod در کلاستر نمی‌گوید. همچنین «چه چیزی اخیراً تغییر کرده؟» (deploy، تغییر DNS، قانون فایروال، rotate گواهی) پرسودترین سؤال است. هر فرضیه را با یک تست که بتواند آن را رد کند بسنجید، نتایج را با timestamp یادداشت کنید و هم‌زمان چند چیز را تغییر ندهید.",
objectives:["اجرای چک‌لیست DNS → Route → Port → TLS → App برای هر مشکل اتصال","تفسیر تفاوت connection refused، timeout، no route to host و reset","انتخاب نقطهٔ درست برای تست (از همان مبدأ مشکل‌دار)","مستندسازی فرضیه‌ها و نتایج در طول اینسیدنت"],
example:"سرویس withdraw ناگهان به API نود بلاک‌چین وصل نمی‌شود. dig درست است، nc -zv به پورت 8545 timeout می‌دهد ولی از سرور دیگری کار می‌کند؛ ip route get نشان می‌دهد ترافیک از اینترفیس VPN می‌رود که دیروز تغییر کرده. مشکل در ۱۰ دقیقه پیدا می‌شود، نه با restart‌های پیاپی.",
code:"#!/usr/bin/env bash\n# چک‌لیست سریع اتصال: ./netcheck.sh api.example.com 443\nHOST=$1; PORT=${2:-443}\necho '== 1. DNS';   getent ahosts \"$HOST\" | head -3; dig +short \"$HOST\"\nIP=$(getent ahosts \"$HOST\" | awk 'NR==1{print $1}')\necho '== 2. Route'; ip route get \"$IP\"\necho '== 3. Path';  mtr -rwc 5 \"$IP\" 2>/dev/null | tail -5\necho '== 4. TCP';   nc -zv -w 3 \"$HOST\" \"$PORT\"\necho '== 5. TLS';   echo | openssl s_client -connect \"$HOST:$PORT\" -servername \"$HOST\" 2>/dev/null | openssl x509 -noout -subject -enddate\necho '== 6. HTTP';  curl -sS -o /dev/null -w 'code=%{http_code} total=%{time_total}s\\n' \"https://$HOST/\"\n\n# تفسیر خطاها\n# Connection refused  -> میزبان رسید، پورت بسته/کسی گوش نمی‌دهد (RST)\n# timeout             -> drop بی‌صدا (فایروال/SG) یا مسیر برگشت خراب\n# No route to host    -> ICMP unreachable یا ARP ناموفق\n# Connection reset    -> اتصال برقرار شد ولی طرف مقابل/پراکسی آن را بست",
exercise:"اسکریپت بالا را کامل کنید و روی پنج سناریوی ساختگی اجرا کنید: ۱) رکورد DNS اشتباه در /etc/hosts، ۲) سرویسی که اجرا نشده، ۳) قانون فایروال DROP، ۴) گواهی منقضی (badssl.com)، ۵) اپلیکیشن که 502 برمی‌گرداند. برای هرکدام توضیح دهید کدام مرحله اولین شکست را نشان داد.",
project:"",
resources:[{t:"Julia Evans - Bite Size Networking / blog",u:"https://jvns.ca/categories/networking/"},{t:"Red Hat - Configuring and managing networking (troubleshooting)",u:"https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/configuring_and_managing_networking/index"},{t:"badssl.com - TLS test endpoints",u:"https://badssl.com/"}],
criteria:"برای هر گزارش «وصل نمی‌شود» می‌توانید در کمتر از ۱۰ دقیقه مشخص کنید مشکل در کدام لایه است و شواهد (خروجی دستورات) آن را ارائه دهید.",
interview:["تفاوت connection refused و connection timeout چیست و هرکدام دربارهٔ مشکل چه می‌گوید؟","سرویس شما به یک API خارجی وصل نمی‌شود؛ قدم‌به‌قدم چه می‌کنید؟","چرا dig می‌تواند جواب درست بدهد ولی اپلیکیشن همچنان نام را اشتباه resolve کند؟"],
mistakes:["تست از لپ‌تاپ خود به‌جای مبدأ واقعی مشکل","restart کردن سرویس‌ها قبل از جمع‌آوری شواهد","استفاده از ping به‌عنوان تنها معیار (ICMP ممکن است مسدود باشد در حالی که TCP کار می‌کند)"],
production:"در اینسیدنت‌ها، تفاوت میان ۱۰ دقیقه و ۲ ساعت downtime معمولاً به داشتن یک روش ثابت و ابزارهای آماده برمی‌گردد؛ چک‌لیست لایه‌ای باید در runbook هر تیم آنکال باشد.",
ai:"چند سناریوی واقعی «سرویس A به B وصل نمی‌شود» برایم طراحی کن و فقط وقتی دستوری را اجرا می‌کنم خروجی‌اش را نشان بده. بر استفادهٔ من از روش لایه‌به‌لایه نظارت کن و اگر حدس زدم یا مرحله‌ای را جا انداختم تذکر بده."},
{id:"ts-latency-analysis",title:"تحلیل تأخیر: DNS/Connect/TLS/TTFB، Tail Latency و Packet Loss",level:"Advanced",minLadder:3,prereqs:["tool-curl-wget","tls-handshake"],
short:"شکستن زمان یک درخواست به اجزای شبکه‌ای و سروری، فهم صدک‌ها (p99) و اثر packet loss و retransmit بر تأخیر.",
deep:"زمان کل یک درخواست HTTPS از چند بخش تشکیل می‌شود که curl -w آن‌ها را جدا نشان می‌دهد: time_namelookup (DNS)، time_connect (هندشیک TCP، حدود یک RTT)، time_appconnect (هندشیک TLS، یک RTT در TLS 1.3 و دو RTT در TLS 1.2)، time_starttransfer یا TTFB (پردازش سرور + یک RTT) و time_total (انتقال بدنه). با یک RTT برابر 80ms، یک درخواست HTTPS جدید با TLS 1.2 قبل از رسیدن اولین بایت حداقل ۳۲۰ میلی‌ثانیه وقت صرف می‌کند؛ به همین دلیل connection reuse و keep-alive معمولاً از بهینه‌سازی کد اثر بیشتری دارند. میانگین گمراه‌کننده است: باید صدک‌ها (p50، p95، p99، p999) را دید؛ اگر یک صفحه ۲۰ درخواست backend داشته باشد، احتمال اینکه حداقل یکی به p99 بخورد حدود ۱۸٪ است (1-0.99^20)، یعنی tail latency تجربهٔ بسیاری از کاربران را می‌سازد. packet loss اثری غیرخطی دارد: از دست رفتن یک SYN باعث انتظار ۱ ثانیه‌ای برای retransmit می‌شود (RTO اولیه)، و ۱٪ loss می‌تواند throughput یک اتصال TCP را چند برابر کاهش دهد؛ به همین دلیل نمودارهای تأخیر با پله‌های دقیق ۱ یا ۳ ثانیه‌ای نشانهٔ کلاسیک drop بسته است، نه کندی اپلیکیشن. منابع دیگر تأخیر: کوئری DNS بدون کش، صف شدن در accept queue یا connection pool، Nagle و delayed ACK (تأخیر ۴۰ms)، و فاصلهٔ جغرافیایی (هر ۱۰۰۰ کیلومتر فیبر حدود ۱۰ms RTT). هدف تحلیل این است که بگویید زمان در کدام بخش صرف شده و آن را با داده اثبات کنید.",
objectives:["شکستن زمان درخواست با curl -w به DNS، TCP، TLS، TTFB و انتقال","تحلیل صدک‌ها و توضیح اثر fan-out بر tail latency","تشخیص علائم packet loss و retransmit در نمودار تأخیر","تخمین سهم RTT و تعداد round tripها در تأخیر کل"],
example:"p99 سرویس ثبت سفارش هر چند دقیقه دقیقاً حدود ۱۰۰۰ms بیشتر از p50 است. curl -w نشان می‌دهد time_connect گاهی ۱.۰۲ ثانیه است؛ این یعنی SYN اول drop و بعد از RTO یک‌ثانیه‌ای دوباره ارسال شده؛ نقطهٔ drop یک conntrack پرشده روی NAT است.",
code:"# فرمت زمان‌بندی curl\ncat > curl-time.txt <<'EOF'\n  dns:      %{time_namelookup}s\n  connect:  %{time_connect}s\n  tls:      %{time_appconnect}s\n  ttfb:     %{time_starttransfer}s\n  total:    %{time_total}s\nEOF\ncurl -so /dev/null -w @curl-time.txt https://api.example.com/health\n\n# ۲۰۰ نمونه و محاسبهٔ صدک‌ها\nfor i in $(seq 200); do curl -so /dev/null -w '%{time_total}\\n' https://api.example.com/health; done > t.txt\npython3 - <<'EOF'\nimport statistics as s\nv = sorted(float(x) for x in open('t.txt'))\nq = s.quantiles(v, n=100)\nprint(f'p50={q[49]*1000:.0f}ms p95={q[94]*1000:.0f}ms p99={q[98]*1000:.0f}ms max={v[-1]*1000:.0f}ms')\nEOF\n\n# شواهد packet loss و retransmit\nmtr -rwc 100 api.example.com\nnstat -az TcpRetransSegs TcpExtTCPSynRetrans\nss -ti dst api.example.com   # rtt، retrans و cwnd هر اتصال\n\n# شبیه‌سازی loss و تأخیر روی محیط تست\nsudo tc qdisc add dev eth0 root netem delay 80ms loss 1%\nsudo tc qdisc del dev eth0 root",
exercise:"با tc netem روی یک VM تأخیر 80ms و سپس 1٪ packet loss ایجاد کنید و برای هر حالت ۲۰۰ درخواست HTTPS بزنید؛ p50/p99 و تفکیک curl -w را مقایسه کنید. سپس همین تست را با keep-alive (یک session در requests پایتون) تکرار کنید و کاهش تأخیر را توضیح دهید.",
project:"",
resources:[{t:"High Performance Browser Networking (Ilya Grigorik, رایگان)",u:"https://hpbn.co/"},{t:"The Tail at Scale (Dean & Barroso, CACM)",u:"https://research.google/pubs/the-tail-at-scale/"},{t:"curl man page - write-out variables",u:"https://curl.se/docs/manpage.html"},{t:"tc-netem(8) man page",u:"https://man7.org/linux/man-pages/man8/tc-netem.8.html"}],
