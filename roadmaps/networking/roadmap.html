{id:"ts-mtu-blackhole",title:"MTU Black Hole، PMTUD و MSS Clamping",level:"Advanced",minLadder:4,prereqs:["ip-icmp-mtu","vpn-tunneling-basics"],
short:"چرا اتصال برقرار می‌شود و درخواست‌های کوچک کار می‌کنند اما پاسخ‌های بزرگ یا آپلودها گیر می‌کنند؛ و چگونه با MSS clamping و MTU درست رفعش کنیم.",
deep:"MTU استاندارد Ethernet برابر 1500 بایت است؛ هر لایهٔ تونل (VXLAN حدود 50، WireGuard حدود 60 تا 80، IPsec حدود 50 تا 73، PPPoE برابر 8 بایت) از این فضا کم می‌کند. در IPv4 مدرن، TCP بسته‌ها را با پرچم DF (Don't Fragment) می‌فرستد و به Path MTU Discovery تکیه می‌کند: اگر روتری در مسیر نتواند بسته را عبور دهد، آن را drop می‌کند و یک پیام ICMP Type 3 Code 4 (Fragmentation Needed) با MTU مجاز برمی‌گرداند تا فرستنده اندازه را کم کند (در IPv6 پیام ICMPv6 Packet Too Big است و روترها اصلاً fragment نمی‌کنند). مشکل وقتی است که یک فایروال یا Security Group بیش از حد سخت‌گیر همهٔ ICMPها را مسدود کند: فرستنده هرگز نمی‌فهمد بسته‌هایش بزرگ است و آن‌ها بی‌صدا ناپدید می‌شوند — این MTU Black Hole است. علائم کلاسیک و گیج‌کننده: هندشیک TCP (بسته‌های کوچک) موفق است، ping عادی و درخواست‌های کوچک کار می‌کنند، اما پاسخ‌های بزرگ، هندشیک TLS با زنجیرهٔ گواهی بزرگ، git clone یا آپلود فایل گیر می‌کنند و بعد از timeout قطع می‌شوند؛ اغلب هم فقط از پشت VPN یا در شبکهٔ overlay رخ می‌دهد. تشخیص: ping -M do -s 1472 (1472 + 28 بایت هدر = 1500) و کم کردن اندازه تا یافتن بزرگ‌ترین اندازهٔ عبوری، یا tracepath. راه‌حل‌ها: اجازهٔ عبور ICMP نوع 3/4 (و ICMPv6 Packet Too Big)، تنظیم MTU درست روی اینترفیس تونل یا Pod، یا MSS Clamping روی روتر/گیت‌وی که مقدار MSS در بسته‌های SYN را بازنویسی می‌کند تا دو طرف از ابتدا segmentهای کوچک‌تر بفرستند. لینوکس همچنین net.ipv4.tcp_mtu_probing را برای کشف MTU بدون اتکا به ICMP دارد.",
objectives:["توضیح PMTUD و نقش ICMP Fragmentation Needed و پرچم DF","تشخیص MTU Black Hole با ping -M do و tracepath","محاسبهٔ MTU و MSS درست برای یک تونل","پیاده‌سازی MSS clamping و tcp_mtu_probing"],
example:"کارمندان از طریق WireGuard به پنل ادمین وصل می‌شوند؛ صفحهٔ login باز می‌شود ولی بعد از ورود، داشبورد سنگین هرگز لود نمی‌شود. ping -M do -s 1472 شکست می‌خورد ولی 1392 موفق است؛ Security Group سرور ICMP را مسدود کرده بود. با MSS clamping روی گیت‌وی VPN مشکل حل شد.",
code:"# یافتن Path MTU (1472 بایت داده + 8 ICMP + 20 IP = 1500)\nping -M do -s 1472 -c 2 10.0.5.20   # اگر شکست خورد اندازه را کم کنید\nping -M do -s 1392 -c 2 10.0.5.20\ntracepath 10.0.5.20                   # pmtu را در طول مسیر گزارش می‌دهد\n\n# MTU اینترفیس‌ها\nip link show | grep -E 'mtu'\nsudo ip link set dev wg0 mtu 1420\n\n# دیدن پیام‌های ICMP Fragmentation Needed\nsudo tcpdump -ni any 'icmp[icmptype] == 3 and icmp[icmpcode] == 4'\n\n# MSS clamping روی گیت‌وی (iptables)\nsudo iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu\n# معادل nftables\n# nft add rule inet filter forward tcp flags syn tcp option maxseg size set rt mtu\n\n# کشف MTU بدون اتکا به ICMP\nsudo sysctl -w net.ipv4.tcp_mtu_probing=1\n\n# حداقل ICMP لازم در فایروال (iptables)\nsudo iptables -A INPUT -p icmp --icmp-type fragmentation-needed -j ACCEPT",
exercise:"دو namespace را با یک veth که MTU آن 1400 است به یک router namespace وصل کنید و در router همهٔ ICMPها را drop کنید. نشان دهید curl برای یک فایل ۱ مگابایتی گیر می‌کند ولی برای یک پاسخ کوچک کار می‌کند. سپس یک‌بار با اجازهٔ ICMP و یک‌بار با MSS clamping مشکل را رفع کنید و با tcpdump مقدار MSS در SYN را قبل و بعد ببینید.",
project:"",
resources:[{t:"Cloudflare blog - Path MTU discovery in practice",u:"https://blog.cloudflare.com/path-mtu-discovery-in-practice/"},{t:"RFC 1191 - Path MTU Discovery",u:"https://www.rfc-editor.org/rfc/rfc1191"},{t:"RFC 4821 - Packetization Layer Path MTU Discovery",u:"https://www.rfc-editor.org/rfc/rfc4821"},{t:"tracepath(8) man page",u:"https://man7.org/linux/man-pages/man8/tracepath.8.html"}],
criteria:"با دیدن علائم «اتصال برقرار است ولی داده‌های بزرگ گیر می‌کنند» فوراً به MTU مشکوک می‌شوید، Path MTU را اندازه می‌گیرید و یکی از راه‌حل‌ها را با دلیل پیاده می‌کنید.",
interview:["چرا مسدود کردن کامل ICMP ایدهٔ بدی است؟","علائم MTU Black Hole چیست و چرا هندشیک TCP موفق است؟","MSS clamping چگونه کار می‌کند و کجا اعمال می‌شود؟"],
mistakes:["مسدود کردن همهٔ ICMPها در فایروال یا Security Group به اسم امنیت","تنظیم MTU پیش‌فرض 1500 روی اینترفیس تونل یا Pod در شبکهٔ overlay","تست با ping معمولی (بستهٔ کوچک) و نتیجه‌گیری اینکه شبکه سالم است"],
production:"MTU Black Hole یکی از گیج‌کننده‌ترین اینسیدنت‌هاست چون فقط بخشی از درخواست‌ها و فقط برای برخی کاربران (مثلاً پشت VPN یا اپراتور موبایل خاص) شکست می‌خورد؛ در زیرساختی با VPN، overlay و چند ارائه‌دهندهٔ ابری، دانستن آن برای هر مهندس آنکال ضروری است.",
ai:"یک سناریوی واقعی MTU Black Hole (مثلاً پنل ادمین از پشت VPN) برایم بساز و فقط علائم را بگو. بگذار با سؤال و اجرای دستورات خودم علت را پیدا کنم، سپس MTU و MSS درست را برای چند نوع تونل از من بپرس."},
{id:"ts-observability",title:"مانیتورینگ شبکه: متریک‌های retransmit/drop، Blackbox Exporter و Synthetic Check",level:"Advanced",minLadder:4,prereqs:["ts-methodology"],
short:"دیدن مشکلات شبکه قبل از گزارش کاربر: متریک‌های سطح کرنل، پروب‌های بیرونی از دید کاربر و هشدار بر اساس آن‌ها.",
deep:"مشاهده‌پذیری شبکه دو نگاه مکمل دارد. نگاه از درون (white-box): متریک‌هایی که خود میزبان‌ها گزارش می‌دهند، مثلاً node_exporter در Prometheus بایت/بسته و drop/error هر اینترفیس (node_network_receive_drop_total)، شمارنده‌های TCP (node_netstat_Tcp_RetransSegs، ListenOverflows، تعداد اتصال در هر حالت)، استفاده از جدول conntrack (node_nf_conntrack_entries در برابر limit) و تعداد سوکت‌های TIME_WAIT. نرخ retransmit (RetransSegs تقسیم بر OutSegs) بالای ۱ تا ۲ درصد معمولاً نشانهٔ congestion یا loss است. نگاه از بیرون (black-box): پروب‌هایی که دقیقاً مثل کاربر رفتار می‌کنند. Blackbox Exporter در Prometheus پروب‌های HTTP، TCP، ICMP و DNS اجرا می‌کند و متریک‌هایی مثل probe_success، probe_duration_seconds به تفکیک فاز (resolve، connect، tls، processing) و probe_ssl_earliest_cert_expiry برمی‌گرداند — آخری به‌تنهایی جلوی اینسیدنت‌های پرتکرار انقضای گواهی را می‌گیرد. Synthetic Check باید از چند موقعیت (داخل کلاستر، دیتاسنتر دیگر، اینترنت عمومی و حتی ISPهای اصلی کاربران) اجرا شود تا مشکلات مسیر، DNS یا CDN منطقه‌ای دیده شوند. در سطح جریان، VPC Flow Logs، Hubble در Cilium یا sFlow/NetFlow نشان می‌دهند چه کسی با چه کسی صحبت می‌کند. اصول هشدار همان اصول SRE است: روی علائمی که کاربر حس می‌کند (موفقیت پروب، تأخیر p99، انقضای گواهی کمتر از ۱۴ روز) هشدار دهید و متریک‌های داخلی مثل retransmit را برای تشخیص علت در داشبورد نگه دارید، نه برای بیدار کردن آنکال.",
objectives:["جمع‌آوری متریک‌های شبکهٔ کرنل با node_exporter و ساخت داشبورد retransmit/drop/conntrack","پیکربندی Blackbox Exporter برای پروب HTTP، TCP، DNS و انقضای گواهی","طراحی Synthetic Check از چند موقعیت","نوشتن قوانین هشدار مبتنی بر علائم کاربر"],
example:"هشدار probe_ssl_earliest_cert_expiry < 14 روز دو هفته قبل از انقضای گواهی API عمومی به صدا درمی‌آید چون cert-manager به‌خاطر تغییر رکورد DNS نتوانسته بود challenge را پاس کند؛ بدون این پروب، اینسیدنت در نیمه‌شب روز انقضا کشف می‌شد.",
code:"# blackbox.yml\nmodules:\n  http_2xx:\n    prober: http\n    timeout: 5s\n    http:\n      preferred_ip_protocol: ip4\n      fail_if_not_ssl: true\n  dns_api:\n    prober: dns\n    dns:\n      query_name: api.example.com\n      query_type: A\n\n# prometheus.yml (بخش scrape)\n- job_name: blackbox-http\n  metrics_path: /probe\n  params: { module: [http_2xx] }\n  static_configs: [ { targets: ['https://api.example.com/health'] } ]\n  relabel_configs:\n    - { source_labels: [__address__], target_label: __param_target }\n    - { source_labels: [__param_target], target_label: instance }\n    - { target_label: __address__, replacement: 'blackbox:9115' }\n\n# قوانین هشدار (PromQL)\n# پروب ناموفق\nprobe_success == 0\n# انقضای گواهی کمتر از ۱۴ روز\n(probe_ssl_earliest_cert_expiry - time()) / 86400 < 14\n# نرخ retransmit بالای ۲٪\nrate(node_netstat_Tcp_RetransSegs[5m]) / rate(node_netstat_Tcp_OutSegs[5m]) > 0.02\n# پر شدن conntrack\nnode_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.8",
exercise:"با docker compose یک Prometheus، Grafana، node_exporter و Blackbox Exporter بالا بیاورید. برای سه endpoint (یک سایت سالم، expired.badssl.com و یک پورت بسته) پروب بسازید، داشبوردی با probe_duration به تفکیک فاز و نرخ retransmit رسم کنید و با tc netem روی یک میزبان loss ایجاد کنید تا هشدار retransmit را ببینید.",
project:"",
resources:[{t:"Prometheus Blackbox Exporter (GitHub)",u:"https://github.com/prometheus/blackbox_exporter"},{t:"Prometheus Node Exporter (GitHub)",u:"https://github.com/prometheus/node_exporter"},{t:"Google SRE Book - Monitoring Distributed Systems",u:"https://sre.google/sre-book/monitoring-distributed-systems/"},{t:"AWS - VPC Flow Logs",u:"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"}],
criteria:"برای سرویس‌های خود داشبورد شبکه (retransmit، drop، conntrack، TIME_WAIT) و پروب‌های black-box با هشدار انقضای گواهی و موفقیت/تأخیر دارید و می‌توانید توضیح دهید کدام متریک برای هشدار و کدام برای تشخیص است.",
interview:["تفاوت مانیتورینگ white-box و black-box در شبکه چیست و چرا هر دو لازم‌اند؟","چه متریک‌هایی نشان می‌دهند مشکل از شبکه است نه اپلیکیشن؟","چطور جلوی اینسیدنت انقضای گواهی را به‌صورت سیستماتیک می‌گیرید؟"],
mistakes:["پروب گرفتن فقط از داخل همان کلاستر که مشکلات DNS عمومی یا CDN را نمی‌بیند","هشدار روی متریک‌های علت (مثل retransmit) به‌جای علائم کاربر و ایجاد alert fatigue","نداشتن هشدار انقضای گواهی"],
production:"کاربران صرافی از شبکه‌ها و اپراتورهای مختلف وصل می‌شوند؛ پروب‌های synthetic از چند موقعیت جغرافیایی و ISP مشکلاتی مثل اختلال مسیر یا DNS در یک اپراتور را قبل از سیل تیکت‌های پشتیبانی نشان می‌دهند.",
ai:"به من کمک کن برای یک API عمومی و سرورهای پشت آن یک طرح مانیتورینگ شبکه با node_exporter و Blackbox Exporter بسازم. از من بخواه تصمیم بگیرم کدام متریک‌ها هشدار باشند و کدام فقط داشبورد، و انتخاب‌هایم را با سناریوهای اینسیدنت به چالش بکش."},
{id:"ts-design-review",title:"طراحی و بازبینی معماری شبکه: Segmentation، HA، DR و هزینهٔ ترافیک",level:"Expert",minLadder:6,prereqs:["cn-cloud-vpc","px-l4-l7-lb","fw-conntrack-stateful"],
short:"نگاه Staff به شبکه: طراحی و نقد معماری شبکهٔ یک سیستم کامل از نظر امنیت، دسترس‌پذیری، بازیابی از فاجعه، مقیاس و هزینه.",
deep:"در سطح Staff، سؤال دیگر «این پورت چرا بسته است» نیست، بلکه «آیا معماری شبکهٔ ما با رشد ۱۰ برابری، خرابی یک دیتاسنتر و ممیزی امنیتی سالم می‌ماند؟» است. یک بازبینی جامع چند محور دارد. Segmentation: تقسیم شبکه به zoneهای اعتماد (عمومی/DMZ، اپلیکیشن، داده، مدیریت و zone بسیار حساس مثل کیف پول سرد/گرم و امضای تراکنش)، با جریان‌های مجاز صریح بین آن‌ها و ترجیح Zero Trust (هویت سرویس و mTLS) بر اعتماد به IP. دسترس‌پذیری: حذف نقاط شکست تکی در هر لایه (چند AZ، LB افزونه، NAT Gateway در هر AZ، دو مسیر به اینترنت و ارائه‌دهندهٔ DNS ثانویه)، و پرسیدن «اگر X از کار بیفتد چه می‌شود؟» برای DNS، Load Balancer، VPN بین‌سایتی و ارائه‌دهندهٔ گواهی. DR: RTO/RPO هر سرویس، نحوهٔ جابه‌جایی ترافیک بین منطقه‌ها (DNS failover با TTL کوتاه، Anycast یا Global LB) و آزمودن واقعی failover. ظرفیت و محدودیت‌های پنهان: سقف اتصال LB، جدول conntrack، پورت‌های SNAT در NAT Gateway (حدود ۵۵ هزار اتصال هم‌زمان به هر مقصد یکتا)، تعداد IP در subnetها و Pod CIDR. هزینه: ترافیک خروجی به اینترنت، ترافیک بین AZ و منطقه، و پردازش NAT Gateway در کلاود می‌توانند بخش بزرگی از صورت‌حساب باشند؛ VPC Endpoint برای S3 یا قرار دادن سرویس‌های پرگفت‌وگو در یک AZ از بهینه‌سازی‌های رایج‌اند. خروجی این کار یک سند طراحی یا ADR است که trade-offها، ریسک‌های پذیرفته‌شده و برنامهٔ مهاجرت تدریجی را شفاف می‌کند و تیم‌های مختلف (امنیت، پلتفرم، محصول) را هم‌راستا می‌کند.",
objectives:["رسم نقشهٔ کامل جریان‌های شبکهٔ یک سیستم و zoneهای اعتماد","شناسایی نقاط شکست تکی و محدودیت‌های ظرفیت پنهان","طراحی استراتژی DR و failover شبکه با RTO/RPO مشخص","تحلیل و بهینه‌سازی هزینهٔ ترافیک شبکه و نوشتن ADR"],
example:"بازبینی نشان می‌دهد همهٔ سرویس‌ها از یک NAT Gateway در یک AZ به API بانک‌ها وصل می‌شوند (نقطهٔ شکست تکی + هزینهٔ بین‌AZ)، سرویس امضای تراکنش با بقیهٔ سرویس‌ها در یک subnet است و DNS فقط یک ارائه‌دهنده دارد. پیشنهاد: NAT در هر AZ، zone جدا با mTLS برای wallet و DNS ثانویه؛ در قالب یک ADR با برآورد هزینه و برنامهٔ مهاجرت سه‌ماهه.",
code:"# چک‌لیست بازبینی معماری شبکه (قالب ADR)\n## Context\n- نمودار جریان: کاربر → CDN/WAF → LB → Ingress → سرویس‌ها → DB/Cache/صف → APIهای خارجی\n## Segmentation\n- [ ] zoneها: public / app / data / mgmt / wallet\n- [ ] جریان‌های مجاز بین zoneها صریح و default-deny\n- [ ] دسترسی مدیریتی فقط از Bastion/ZTNA با MFA و لاگ\n## Availability\n- [ ] هر لایه حداقل در ۲ AZ؛ NAT Gateway در هر AZ\n- [ ] DNS با دو ارائه‌دهنده یا SLA مستند\n- [ ] اگر LB / DNS / VPN / CA از کار بیفتد؟\n## DR\n- [ ] RTO/RPO هر سرویس؛ روش failover (DNS TTL / Anycast / GSLB)\n- [ ] آخرین تست واقعی failover: تاریخ و نتیجه\n## Capacity\n- [ ] سقف conntrack، پورت SNAT، اتصال LB، IP subnet و Pod CIDR با ۱۰x رشد\n## Cost\n- [ ] ترافیک egress، بین‌AZ، NAT processing؛ VPC Endpointها\n## Decision / Consequences / Risks accepted\n\n# برآورد هزینهٔ NAT با پایتون\ngb_per_month = 8000; price_per_gb = 0.045\nprint(f'NAT processing ≈ ${gb_per_month*price_per_gb:,.0f}/month')",
exercise:"معماری شبکهٔ یک سیستم واقعی (یا پروژهٔ کتابخانهٔ نقشه راه اصلی) را رسم کنید: همهٔ جریان‌ها، zoneها، LBها، DNS و وابستگی‌های خارجی. با چک‌لیست بالا حداقل پنج ریسک (SPOF، ظرفیت، امنیت، هزینه، DR) پیدا کنید و برای مهم‌ترینشان یک ADR کامل با گزینه‌ها، trade-off و برنامهٔ مهاجرت بنویسید و آن را برای یک همکار ارشد ارائه دهید.",
project:"",
resources:[{t:"AWS Well-Architected - Reliability Pillar",u:"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html"},{t:"NIST SP 800-207 - Zero Trust Architecture",u:"https://csrc.nist.gov/pubs/sp/800/207/final"},{t:"Google SRE Book - Addressing Cascading Failures",u:"https://sre.google/sre-book/addressing-cascading-failures/"},{t:"ADR (Architecture Decision Records)",u:"https://adr.github.io/"}],
criteria:"می‌توانید برای یک سیستم واقعی سند بازبینی شبکه‌ای تهیه کنید که SPOFها، محدودیت‌های ظرفیت، ریسک‌های امنیتی و هزینه را با عدد نشان دهد و توسط تیم‌های امنیت و پلتفرم به‌عنوان مبنای تصمیم پذیرفته شود.",
interview:["معماری شبکهٔ یک صرافی را طراحی کنید؛ سرویس کیف پول را کجا قرار می‌دهید و چرا؟","اگر کل یک منطقهٔ کلاود از کار بیفتد، ترافیک کاربران چطور و در چه زمانی جابه‌جا می‌شود؟","هزینهٔ شبکهٔ کلاود ما ناگهان دو برابر شده؛ از کجا شروع به تحلیل می‌کنید؟"],
mistakes:["طراحی شبکهٔ تخت (flat) که در آن همه به همه دسترسی دارند","طراحی DR روی کاغذ بدون تست واقعی failover","نادیده گرفتن هزینهٔ ترافیک بین AZ و NAT تا رسیدن صورت‌حساب"],
production:"برای یک صرافی، تصمیمات معماری شبکه همزمان بر امنیت دارایی کاربران، الزامات رگولاتوری، دسترس‌پذیری در اوج بازار و هزینهٔ عملیاتی اثر دارند؛ مهندس Staff باید بتواند این trade-offها را شفاف کند و تیم‌ها را حول یک طرح تدریجی هم‌راستا کند.",
ai:"در نقش یک معمار ارشد زیرساخت و یک ممیز امنیتی، معماری شبکه‌ای را که برای یک صرافی پیشنهاد می‌دهم بازبینی کن. دربارهٔ segmentation، نقاط شکست تکی، DR، ظرفیت و هزینه سؤال‌های سخت بپرس و از من بخواه تصمیماتم را در قالب یک ADR مستند کنم."}
]},

{id:"p16",num:16,title:"پروژه‌های عملی شبکه (هم‌راستا با نردبان)",icon:"🏗️",summary:"یک زیرساخت واحد که در ۶ گام هم‌زمان با سطوح نردبان رشد می‌کند: هر سطح یک پروژه با صورت‌مسئلهٔ ثابت و معیار پذیرش عددی.",
topics:[
{id:"nproj-l1",title:"پروژه سطح یک: اسکریپت «چک‌آپ اتصال» برای عیب‌یابی DNS/TCP/TLS/HTTP یک سرویس",level:"Beginner",minLadder:1,prereqs:["tool-dig","tool-curl-wget","tool-ping-trace-mtr"],
short:"یک تسک مشخص (۱ تا ۲ هفته) برای تیم بک‌اند سرویس آزمایشی LabX (بک‌اند یک صرافی کوچک): ابزار خط فرمان netcheck که برای یک URL، لایه‌به‌لایه DNS، TCP، TLS و HTTP را بررسی کند و دقیقاً بگوید کدام لایه خراب است.",
deep:"صورت‌مسئلهٔ ثابت (نه انتخابی): تیم پشتیبانی LabX هر هفته چند تیکت «سایت باز نمی‌شود» دریافت می‌کند و هر بار یک مهندس باید دستی dig و curl و ping بزند. شما باید ابزار netcheck را (با Bash یا Python، فقط با ابزارهای استاندارد dig/curl/openssl/mtr یا کتابخانهٔ استاندارد پایتون) بسازید که دقیقاً این کارها را انجام دهد:\n۱) ورودی: netcheck <URL> [--resolver 1.1.1.1] [--json]. از URL، hostname، پورت (پیش‌فرض 443 برای https و 80 برای http) و مسیر را استخراج کند.\n۲) لایهٔ DNS: رکوردهای A و AAAA را با resolver سیستم و یک resolver عمومی جداگانه بگیرد، TTL هر رکورد را گزارش کند و اگر جواب دو resolver متفاوت بود هشدار بدهد. NXDOMAIN و SERVFAIL و timeout باید سه پیام متفاوت داشته باشند.\n۳) لایهٔ TCP: برای هر IP جداگانه تلاش اتصال به پورت با timeout دقیقاً ۵ ثانیه؛ تفکیک سه حالت: موفق، Connection refused (RST فوری) و timeout (احتمال فایروال یا drop).\n۴) لایهٔ TLS (فقط https): نسخهٔ TLS مذاکره‌شده، صادرکننده، تعداد روز باقی‌مانده تا انقضا، تطابق hostname با SAN، و کامل بودن زنجیره. گواهی منقضی، hostname نامنطبق و self-signed باید سه خطای متفاوت باشند.\n۵) لایهٔ HTTP: کد وضعیت، تعداد redirectها و زمان‌بندی تفکیکی (DNS، connect، TLS، TTFB، total) از curl -w.\n۶) خروجی: یک جدول خوانا برای انسان و با --json یک JSON ساختاریافته. Exit code دقیق: 0 همه‌چیز سالم، 1 خطای DNS، 2 خطای TCP، 3 خطای TLS، 4 خطای HTTP (کد 5xx)، 5 هشدار (مثلاً گواهی کمتر از ۱۴ روز اعتبار دارد).\n۷) یک README کوتاه با سه نمونه خروجی واقعی و یک بخش «این خروجی یعنی چه و قدم بعدی چیست».",
objectives:["تبدیل روش عیب‌یابی لایه‌به‌لایه به یک ابزار قابل‌تکرار","تفکیک دقیق refused از timeout و NXDOMAIN از SERVFAIL در کد","استخراج اطلاعات گواهی (انقضا، SAN، زنجیره) با openssl یا ماژول ssl پایتون","طراحی exit code و خروجی JSON مناسب برای استفاده در اسکریپت و مانیتورینگ"],
example:"netcheck https://expired.badssl.com باید DNS و TCP را سبز نشان دهد، در لایهٔ TLS با پیام «گواهی منقضی شده است» متوقف شود و با exit code 3 خارج شود؛ در حالی که netcheck https://nonexistent.labx-test.invalid باید در لایهٔ DNS با NXDOMAIN و exit code 1 متوقف شود.",
code:"#!/usr/bin/env bash\nset -euo pipefail\nhost=$1; port=${2:-443}\n# DNS\ndig +noall +answer \"$host\" A \"$host\" AAAA\n# TCP (timeout 5s)\ntimeout 5 bash -c \"</dev/tcp/$host/$port\" && echo 'tcp ok' || echo 'tcp fail'\n# TLS\necho | openssl s_client -connect \"$host:$port\" -servername \"$host\" 2>/dev/null | openssl x509 -noout -enddate -issuer -ext subjectAltName\n# HTTP timings\ncurl -so /dev/null -w 'dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}\\n' \"https://$host:$port/\"",
exercise:"ابزار را روی این شش هدف ثابت اجرا کنید و خروجی را در README بگذارید: https://example.com، https://expired.badssl.com، https://wrong.host.badssl.com، https://self-signed.badssl.com، http://example.com:81 (باید timeout شود) و یک دامنهٔ ناموجود با پسوند .invalid. برای هر کدام توضیح دهید کدام لایه شکست خورد و چرا.",
project:"ابزار خط فرمان netcheck برای سرویس LabX که برای هر URL، DNS (دو resolver)، TCP (به‌ازای هر IP)، TLS (انقضا/SAN/زنجیره) و HTTP (کد و زمان‌بندی) را بررسی می‌کند، خروجی جدولی و JSON دارد و با exit code مشخص لایهٔ خراب را اعلام می‌کند.",
resources:[{t:"badssl.com - گواهی‌های خراب برای تست",u:"https://badssl.com/"},{t:"curl man page (-w و write-out)",u:"https://curl.se/docs/manpage.html"},{t:"Python ssl module",u:"https://docs.python.org/3/library/ssl.html"},{t:"mtr (GitHub)",u:"https://github.com/traviscross/mtr"}],
criteria:"روی هر شش هدف تمرین، لایهٔ درست و exit code درست (0/1/2/3) گزارش می‌شود؛ تفاوت refused و timeout حداقل با یک مثال اثبات شده؛ اجرای کامل روی یک هدف سالم کمتر از ۱۰ ثانیه طول می‌کشد؛ خروجی --json با jq قابل پردازش است؛ یک هم‌تیمی بدون توضیح شفاهی فقط با README می‌تواند از ابزار استفاده کند.",
interview:["چرا ابزار شما به‌جای فقط curl زدن، لایه‌ها را جداگانه بررسی می‌کند؟","اتصال TCP بعد از ۵ ثانیه timeout شد؛ این با Connection refused چه تفاوتی در تشخیص علت دارد؟","چرا جواب دو resolver ممکن است متفاوت باشد و این چه زمانی مشکل است؟"],
mistakes:["بررسی فقط یکی از IPهای برگشتی DNS در حالی که دیگری خراب است","استفاده از curl -k برای «رد شدن» از خطای TLS و پنهان کردن مشکل واقعی","بدون timeout گذاشتن اتصال‌ها که باعث می‌شود ابزار برای دقایق گیر کند"],
production:"وسط یک اینسیدنت، اولین سؤال همیشه «کدام لایه خراب است؟» است؛ ابزاری که در ۱۰ ثانیه به این سؤال جواب بدهد، زمان تشخیص (MTTD) تیکت‌های پشتیبانی و هشدارهای on-call را به‌شدت کم می‌کند.",
ai:"نقش یک Senior Engineer را بازی کن که PR ابزار netcheck من را بازبینی می‌کند. خروجی‌ها و کدم را بررسی کن، یک یا دو سناریوی خرابی که پوشش نداده‌ام (مثل IPv6 خراب و IPv4 سالم) پیشنهاد بده و از من بخواه پیش‌بینی کنم ابزارم در آن سناریو چه خروجی‌ای می‌دهد."},

{id:"nproj-l2",title:"پروژه سطح دو: استقرار سرویس پشت Nginx با HTTPS (Let's Encrypt)، Redirect و IP درست کلاینت",level:"Beginner",minLadder:2,prereqs:["px-nginx-haproxy","tls-openssl-debug"],
short:"API سرویس LabX را روی یک VPS واحد پشت Nginx با HTTPS واقعی، تمدید خودکار گواهی، فایروال حداقلی و ثبت IP واقعی کلاینت مستقر کنید؛ با معیارهای پذیرش دقیق و قابل‌آزمون.",
deep:"صورت‌مسئلهٔ ثابت: API سرویس LabX (یک اپ ساده با Gunicorn یا Uvicorn که روی 127.0.0.1:8000 گوش می‌دهد و اندپوینت‌های /healthz و /api/prices دارد) باید روی یک VPS اوبونتو با یک دامنهٔ واقعی (مثلاً api.<دامنهٔ شما>) در دسترس عموم قرار بگیرد. الزامات دقیق:\n۱) اپ فقط روی 127.0.0.1 گوش دهد و از بیرون مستقیم قابل دسترس نباشد؛ Nginx تنها نقطهٔ ورود است.\n۲) HTTPS با گواهی Let's Encrypt (certbot یا acme.sh)؛ تمدید خودکار با systemd timer یا cron و اثبات آن با certbot renew --dry-run.\n۳) هر درخواست HTTP روی پورت 80 با کد 301 به HTTPS هدایت شود (به‌جز مسیر /.well-known/acme-challenge/).\n۴) فقط TLS 1.2 و 1.3 فعال باشد، HSTS با max-age حداقل ۶ ماه، و نمرهٔ SSL Labs حداقل A.\n۵) IP واقعی کلاینت در لاگ اپ ثبت شود: Nginx هدرهای X-Forwarded-For، X-Forwarded-Proto و Host را درست بفرستد و اپ فقط به 127.0.0.1 به‌عنوان پراکسی مورد اعتماد اعتماد کند (هدر جعلی X-Forwarded-For ارسالی کلاینت نباید IP ثبت‌شده را عوض کند).\n۶) Timeoutها صریح: proxy_connect_timeout 5s، proxy_read_timeout 30s؛ اندپوینت /api/slow که ۴۰ ثانیه طول می‌کشد باید 504 بدهد نه اینکه کلاینت تا ابد منتظر بماند.\n۷) client_max_body_size 10m: آپلود ۱۱ مگابایتی باید 413 بگیرد.\n۸) فایروال (UFW یا nftables): ورودی فقط 22، 80 و 443؛ اثبات با nmap از یک ماشین بیرونی که پورت 8000 بسته (filtered یا closed) است.\n۹) یک Runbook یک‌صفحه‌ای: «گواهی منقضی شد چه کنم» و «Nginx بعد از تغییر کانفیگ بالا نمی‌آید چه کنم» (شامل nginx -t قبل از reload).",
objectives:["پیکربندی Nginx به‌عنوان Reverse Proxy با timeout، محدودیت حجم و هدرهای پراکسی صحیح","صدور و تمدید خودکار گواهی Let's Encrypt و اثبات تمدید","پیکربندی امن TLS با نمرهٔ A در SSL Labs و HSTS","ثبت IP واقعی کلاینت بدون اعتماد به هدر جعلی","اعمال فایروال حداقلی و اثبات بسته بودن پورت داخلی از بیرون"],
example:"curl -H 'X-Forwarded-For: 6.6.6.6' https://api.example.com/healthz — در لاگ اپ باید IP واقعی شما ثبت شود نه 6.6.6.6؛ چون Nginx با proxy_set_header X-Forwarded-For $remote_addr (یا $proxy_add_x_forwarded_for به‌همراه اعتماد فقط به آخرین hop) هدر را کنترل می‌کند.",
code:"server {\n    listen 80;\n    server_name api.example.com;\n    location /.well-known/acme-challenge/ { root /var/www/acme; }\n    location / { return 301 https://$host$request_uri; }\n}\nserver {\n    listen 443 ssl;\n    http2 on;\n    server_name api.example.com;\n    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;\n    ssl_protocols TLSv1.2 TLSv1.3;\n    add_header Strict-Transport-Security \"max-age=15768000\" always;\n    client_max_body_size 10m;\n    location / {\n        proxy_pass http://127.0.0.1:8000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-For $remote_addr;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 30s;\n    }\n}",
exercise:"گواهی را عمداً با certbot در محیط staging صادر کنید و با openssl s_client ببینید چرا مرورگر به آن اعتماد نمی‌کند؛ سپس گواهی production بگیرید. یک خطای عمدی در کانفیگ Nginx بگذارید و نشان دهید nginx -t قبل از reload جلوی قطعی را می‌گیرد.",
project:"API سرویس LabX روی یک VPS واقعی پشت Nginx با HTTPS معتبر Let's Encrypt و تمدید خودکار، Redirect 301، TLS 1.2/1.3 با نمرهٔ A، ثبت IP واقعی کلاینت، timeout و محدودیت حجم صریح، فایروال حداقلی و یک Runbook یک‌صفحه‌ای.",
resources:[{t:"Mozilla SSL Configuration Generator",u:"https://ssl-config.mozilla.org/"},{t:"Certbot documentation",u:"https://eff-certbot.readthedocs.io/en/stable/"},{t:"Nginx ngx_http_proxy_module",u:"https://nginx.org/en/docs/http/ngx_http_proxy_module.html"},{t:"Qualys SSL Labs Server Test",u:"https://www.ssllabs.com/ssltest/"}],
criteria:"نمرهٔ SSL Labs حداقل A؛ certbot renew --dry-run موفق؛ curl -I http://... کد 301 برمی‌گرداند؛ /api/slow در کمتر از ۳۱ ثانیه 504 می‌دهد؛ آپلود ۱۱MB کد 413 می‌گیرد؛ nmap از بیرون فقط 22/80/443 را باز نشان می‌دهد؛ هدر جعلی X-Forwarded-For در لاگ اپ اثری ندارد؛ Runbook توسط یک هم‌تیمی بدون کمک قابل اجراست.",
interview:["چرا اپ باید روی 127.0.0.1 گوش دهد نه 0.0.0.0؟","اگر گواهی دیشب منقضی شده باشد، قدم‌به‌قدم چه می‌کنید و چطور جلوی تکرارش را می‌گیرید؟","چرا اعتماد کورکورانه به X-Forwarded-For یک آسیب‌پذیری امنیتی است؟"],
mistakes:["گوش دادن اپ روی 0.0.0.0 و دور زدن کامل Nginx و فایروال از بیرون","Redirect کردن مسیر acme-challenge به HTTPS که تمدید گواهی را می‌شکند","نصب گواهی بدون fullchain که در برخی کلاینت‌ها (مثل اندروید قدیمی یا curl) خطای زنجیره می‌دهد","reload کردن Nginx بدون nginx -t"],
production:"گواهی منقضی‌شده یکی از رایج‌ترین و شرم‌آورترین قطعی‌های سرویس‌های واقعی است؛ و ثبت نشدن IP واقعی کلاینت یعنی Rate Limiting و تحلیل امنیتی شما همه‌چیز را از یک IP (پراکسی) می‌بیند.",
ai:"نقش یک Senior Engineer را بازی کن که این استقرار را قبل از رفتن به تولید بازبینی می‌کند. کانفیگ Nginx و خروجی تست‌های من را بررسی کن و حداقل سه سؤال «اگر … اتفاق بیفتد چه می‌شود؟» دربارهٔ تمدید گواهی، IP کلاینت و timeoutها از من بپرس."},

{id:"nproj-l3",title:"پروژه سطح سه: شبکهٔ خصوصی سه‌سروری با WireGuard، فایروال nftables و DNS داخلی",level:"Intermediate",minLadder:3,prereqs:["vpn-wireguard","fw-netfilter-iptables","dns-linux-resolver"],
short:"LabX از یک سرور به سه سرور (edge، app، db) رشد کرده است: یک شبکهٔ خصوصی رمزنگاری‌شده با WireGuard، فایروال default-deny با nftables، DNS داخلی labx.internal و یک ماتریس تست خودکار جریان‌های مجاز/غیرمجاز بسازید.",
deep:"صورت‌مسئلهٔ ثابت: سه VPS (یا سه VM محلی با Vagrant/Multipass) با نقش‌های edge (Nginx از پروژهٔ L2)، app (اپ LabX) و db (PostgreSQL) دارید که ممکن است در دیتاسنترهای مختلف باشند و فقط IP عمومی دارند. الزامات دقیق:\n۱) شبکهٔ WireGuard با زیرشبکهٔ 10.10.0.0/24: edge=10.10.0.1، app=10.10.0.2، db=10.10.0.3؛ توپولوژی full-mesh؛ کلیدها فقط روی خود سرور تولید شوند و کلید خصوصی هرگز در git نباشد.\n۲) تمام ترافیک داخلی (edge→app روی 8000، app→db روی 5432) فقط از روی رابط wg0 عبور کند؛ PostgreSQL فقط روی 10.10.0.3 گوش دهد و pg_hba.conf فقط 10.10.0.2 را بپذیرد.\n۳) فایروال nftables روی هر سه سرور با policy drop برای ورودی: edge فقط 80/443 عمومی و پورت UDP WireGuard؛ app و db هیچ پورت عمومی جز پورت WireGuard ندارند؛ SSH فقط از روی wg0 (یعنی برای SSH ابتدا باید به VPN وصل شوید — لپ‌تاپ شما peer چهارم 10.10.0.100 است).\n۴) DNS داخلی با CoreDNS یا Unbound روی edge برای zone labx.internal (app.labx.internal، db.labx.internal)؛ سرورها با systemd-resolved فقط کوئری‌های *.labx.internal را به این DNS بفرستند (split DNS) و بقیه را به resolver عادی.\n۵) MTU رابط wg0 صریحاً تنظیم و مستند شود (چرا 1420 یا کمتر)؛ یک تست انتقال فایل ۱۰۰MB بین app و db بدون گیر کردن.\n۶) یک اسکریپت ماتریس تست که حداقل ۱۲ جریان را بررسی کند (مثلاً edge→app:8000 مجاز، edge→db:5432 غیرمجاز، اینترنت→app:8000 غیرمجاز، اینترنت→db:22 غیرمجاز، لپ‌تاپ‌روی‌VPN→app:22 مجاز) و برای هر کدام PASS/FAIL چاپ کند.\n۷) همه‌چیز بعد از reboot هر سه سرور خودکار برگردد (wg-quick@wg0 و nftables فعال در systemd).\n۸) یک سند معماری یک‌صفحه‌ای با نمودار شبکه و جدول جریان‌های مجاز.",
objectives:["راه‌اندازی شبکهٔ full-mesh WireGuard و درک AllowedIPs به‌عنوان جدول مسیریابی رمزنگاری‌شده","نوشتن rulesetهای nftables با policy drop و اصل کمترین دسترسی","راه‌اندازی split DNS برای یک zone داخلی","اثبات خودکار سیاست شبکه با یک ماتریس تست به‌جای بررسی دستی","مستندسازی معماری شبکه برای تیم"],
example:"از edge دستور nc -zv db.labx.internal 5432 باید timeout شود (فایروال db فقط 10.10.0.2 را مجاز می‌داند)، در حالی که از app همان دستور موفق است؛ و dig db.labx.internal روی app باید 10.10.0.3 برگرداند ولی روی لپ‌تاپ خارج از VPN جوابی ندهد.",
code:"# /etc/nftables.conf on db (10.10.0.3)\ntable inet filter {\n  chain input {\n    type filter hook input priority 0; policy drop;\n    ct state established,related accept\n    iif lo accept\n    udp dport 51820 accept                       # WireGuard\n    iifname \"wg0\" ip saddr 10.10.0.2 tcp dport 5432 accept\n    iifname \"wg0\" ip saddr 10.10.0.100 tcp dport 22 accept\n    icmp type echo-request limit rate 5/second accept\n  }\n}\n\n# /etc/wireguard/wg0.conf (db)\n[Interface]\nAddress = 10.10.0.3/24\nListenPort = 51820\nMTU = 1420\nPrivateKey = <generated-on-host>\n\n[Peer]  # app\nPublicKey = <app-pubkey>\nEndpoint = <app-public-ip>:51820\nAllowedIPs = 10.10.0.2/32",
exercise:"عمداً AllowedIPs یکی از peerها را اشتباه (مثلاً 10.10.0.0/24 روی دو peer) تنظیم کنید و با wg show و ip route توضیح دهید چرا ترافیک به peer اشتباه می‌رود. سپس قبل از اعمال rulesetهای nftables، یک cron یا at برای بازگرداندن خودکار بعد از ۵ دقیقه بگذارید تا اگر خودتان را lock-out کردید دسترسی برگردد.",
project:"زیرساخت سه‌سروری LabX (edge/app/db) با شبکهٔ خصوصی WireGuard، فایروال nftables با policy drop و SSH فقط از روی VPN، DNS داخلی labx.internal با split DNS، ماتریس تست خودکار ۱۲ جریانه و سند معماری شبکه.",
resources:[{t:"WireGuard Quick Start",u:"https://www.wireguard.com/quickstart/"},{t:"nftables wiki",u:"https://wiki.nftables.org/"},{t:"CoreDNS Manual",u:"https://coredns.io/manual/toc/"},{t:"Arch Wiki - WireGuard",u:"https://wiki.archlinux.org/title/WireGuard"}],
criteria:"ماتریس تست هر ۱۲+ جریان را با نتیجهٔ مورد انتظار PASS می‌کند؛ اسکن nmap از اینترنت روی app و db هیچ پورت TCP باز نشان نمی‌دهد؛ بعد از reboot هر سه سرور، ماتریس تست بدون دخالت دستی دوباره PASS می‌شود؛ انتقال ۱۰۰MB بین app و db بدون گیر کردن انجام می‌شود؛ هیچ کلید خصوصی در ریپو نیست؛ سند معماری به‌تنهایی برای فهم جریان‌ها کافی است.",
interview:["AllowedIPs در WireGuard دقیقاً چه دو نقشی دارد؟","چرا SSH را فقط از روی VPN باز گذاشتید و ریسک این تصمیم (مثلاً خراب شدن VPN) را چطور مدیریت می‌کنید؟","چرا MTU رابط WireGuard از 1500 کمتر است؟"],
mistakes:["اعمال ruleset فایروال روی سرور راه‌دور بدون راه بازگشت و قفل شدن بیرون از سرور","گوش دادن PostgreSQL روی 0.0.0.0 و اتکای کامل به فایروال (نبود defense in depth)","فراموش کردن ct state established,related و شکستن ترافیک برگشتی","قرار دادن کلیدهای خصوصی WireGuard در ریپوی git"],
production:"تقریباً همهٔ نشت‌های دیتابیس عمومی‌شده (Postgres/Redis/Elasticsearch باز روی اینترنت) از نبود همین لایه‌ها می‌آیند؛ ماتریس تست خودکار تضمین می‌کند یک تغییر کوچک فایروال در آینده بی‌صدا دیتابیس را باز نکند.",
ai:"نقش یک Tech Lead زیرساخت را بازی کن که طراحی شبکهٔ سه‌سروری من را بازبینی می‌کند. جدول جریان‌های مجاز و rulesetهای nftables من را بررسی کن، یک جریان که اشتباهاً باز مانده یا لازم است ولی بسته شده پیدا کن و از من بپرس اگر سرور edge از دست برود، دسترسی SSH و DNS داخلی چه می‌شود."},

{id:"nproj-l4",title:"پروژه سطح چهار: Load Balancer دسترس‌پذیر (keepalived/VRRP + HAProxy) و mTLS بین سرویس‌ها",level:"Advanced",minLadder:4,prereqs:["px-l4-l7-lb","tls-mtls"],
short:"پروژه‌ای در مقیاس یک OKR تیمی: حذف تک‌نقطهٔ شکست edge در LabX با دو HAProxy و Virtual IP روی VRRP، سه نمونهٔ اپ با Health Check، mTLS داخلی با CA اختصاصی و چرخش گواهی بدون Downtime — با اعداد پذیرش مشخص.",
deep:"صورت‌مسئلهٔ ثابت: edge در پروژهٔ L3 تک‌نقطهٔ شکست است و ترافیک LabX رشد کرده. الزامات دقیق:\n۱) دو نود LB (lb1، lb2) با HAProxy و keepalived؛ یک Virtual IP (مثلاً 10.20.0.100 در یک شبکهٔ L2 مشترک یا VMهای محلی) که در حالت عادی روی lb1 است؛ keepalived با یک vrrp_script سلامت HAProxy را چک کند و در صورت مرگ HAProxy (نه فقط مرگ نود) VIP جابه‌جا شود.\n۲) سه نمونهٔ اپ (app1..app3)؛ HAProxy با الگوریتم leastconn، Health Check فعال روی /healthz هر ۲ ثانیه با fall 3 rise 2، و اندپوینت /healthz که وقتی اپ به DB دسترسی ندارد 503 بدهد.\n۳) تخلیهٔ تمیز (graceful drain): خارج کردن یک نمونه برای deploy از طریق Runtime API هاپراکسی (set server ... state drain) بدون قطع درخواست‌های در جریان.\n۴) mTLS بین HAProxy و اپ‌ها: یک CA داخلی (step-ca یا openssl)؛ هر اپ گواهی سرور با SAN app<N>.labx.internal دارد و فقط کلاینتی را می‌پذیرد که گواهی امضاشده با همین CA ارائه کند؛ HAProxy گواهی کلاینت خودش را ارائه دهد و گواهی سرور اپ را verify کند (verify required).\n۵) عمر گواهی‌های داخلی ۷۲ ساعت و چرخش خودکار؛ اثبات اینکه چرخش در حین بار بدون خطا انجام می‌شود.\n۶) آزمون failover: در حین تست بار ۲۰۰ درخواست بر ثانیه (با k6، wrk یا vegeta)، HAProxy روی lb1 را kill کنید؛ VIP باید در کمتر از ۳ ثانیه جابه‌جا شود و نرخ خطای کل تست کمتر از ۰٫۵٪ باشد. همین آزمون برای kill کردن یکی از سه اپ: صفر درخواست ناموفق بیش از ۶ ثانیه بعد از kill.\n۷) هشدار انقضای گواهی (مثلاً با Blackbox Exporter یا اسکریپت netcheck پروژهٔ L1) وقتی کمتر از ۲۴ ساعت اعتبار مانده.\n۸) یک ADR که انتخاب LB لایه ۷ (HAProxy mode http) در برابر لایه ۴ (mode tcp با TLS passthrough) را با Trade-offها توضیح دهد، و یک Runbook برای failover دستی و «گواهی CA داخلی لو رفته است».",
objectives:["طراحی و پیاده‌سازی LB بدون تک‌نقطهٔ شکست با VRRP","پیکربندی Health Check و graceful drain برای deploy بدون downtime","راه‌اندازی CA داخلی و mTLS دوطرفه با چرخش خودکار گواهی کوتاه‌عمر","اندازه‌گیری عددی رفتار failover زیر بار","مستندسازی تصمیم معماری در قالب ADR و Runbook برای تیم"],
example:"در حین تست بار ۲۰۰rps، دستور systemctl stop haproxy روی lb1 اجرا می‌شود؛ keepalived روی lb1 از طریق vrrp_script متوجه می‌شود، priority را کم می‌کند و lb2 در حدود ۱ تا ۲ ثانیه VIP را با Gratuitous ARP اعلام می‌کند؛ گزارش k6 باید فقط تعداد انگشت‌شماری خطای اتصال در همان بازه نشان دهد.",
code:"# keepalived.conf (lb1)\nvrrp_script chk_haproxy {\n    script \"/usr/bin/killall -0 haproxy\"\n    interval 1\n    fall 2\n    weight -30\n}\nvrrp_instance VI_1 {\n    state MASTER\n    interface eth1\n    virtual_router_id 51\n    priority 110\n    advert_int 1\n    virtual_ipaddress { 10.20.0.100/24 }\n    track_script { chk_haproxy }\n}\n\n# haproxy.cfg (backend با mTLS)\nbackend labx_app\n    balance leastconn\n    option httpchk GET /healthz\n    default-server inter 2s fall 3 rise 2 ssl verify required ca-file /etc/labx/ca.crt crt /etc/labx/haproxy-client.pem\n    server app1 app1.labx.internal:8443 check\n    server app2 app2.labx.internal:8443 check\n    server app3 app3.labx.internal:8443 check",
exercise:"Split-brain را عمداً بسازید: ترافیک VRRP بین lb1 و lb2 را با nftables مسدود کنید و ببینید هر دو نود VIP را برمی‌دارند؛ با ip neigh روی یک کلاینت اثرش را ببینید، علت را مستند کنید و یک راهکار پیشگیری (مثلاً unicast_peer، تست سلامت شبکه یا fencing) را پیاده و آزمایش کنید.",
project:"لایهٔ ورودی دسترس‌پذیر LabX: دو HAProxy با VIP روی keepalived/VRRP، سه نمونهٔ اپ با Health Check و graceful drain، mTLS داخلی با CA اختصاصی و گواهی‌های ۷۲ ساعته با چرخش خودکار، آزمون failover عددی زیر بار، هشدار انقضای گواهی، ADR و Runbook.",
resources:[{t:"HAProxy Documentation",u:"https://docs.haproxy.org/"},{t:"Keepalived User Guide",u:"https://keepalived.readthedocs.io/en/latest/"},{t:"step-ca documentation",u:"https://smallstep.com/docs/step-ca/"},{t:"k6 documentation",u:"https://grafana.com/docs/k6/latest/"}],
criteria:"جابه‌جایی VIP بعد از kill کردن HAProxy کمتر از ۳ ثانیه (با لاگ زمان‌دار اثبات شده)؛ نرخ خطای تست بار ۲۰۰rps در طول failover کمتر از ۰٫۵٪؛ drain یک نمونه در حین بار صفر خطا؛ اتصال مستقیم به اپ بدون گواهی کلاینت با خطای handshake رد می‌شود؛ چرخش گواهی در حین بار صفر خطا؛ هشدار انقضا تست شده؛ ADR و Runbook توسط یک مهندس سطح ۲ قابل فهم و اجراست.",
interview:["VRRP چطور تصمیم می‌گیرد کدام نود VIP را داشته باشد و split-brain چطور رخ می‌دهد؟","چرا گواهی‌های داخلی را ۷۲ ساعته گرفتید و این چه فشاری روی اتوماسیون شما می‌آورد؟","Health Check فعال در برابر passive چه تفاوتی دارد و /healthz شما دقیقاً چه چیزی را باید چک کند (و چه چیزی را نه)؟"],
mistakes:["Health Check که فقط 200 برمی‌گرداند بدون بررسی وابستگی‌های حیاتی (یا برعکس، وابستگی به سرویس غیرحیاتی که باعث خروج همهٔ نمونه‌ها می‌شود)","keepalived که فقط زنده بودن نود را چک می‌کند نه زنده بودن HAProxy","mTLS با verify none در HAProxy که عملاً احراز هویت سرور را حذف می‌کند","آزمودن failover فقط در حالت بی‌بار"],
production:"این پروژه هم‌ارز «رهبری دلیوری یک پروژهٔ بزرگ در مقیاس OKR» در L4 است: حذف تک‌نقطهٔ شکست ورودی و رمزنگاری ترافیک داخلی دو الزام رایج ممیزی امنیتی در شرکت‌های مالی است و اعداد failover مستقیم وارد SLO سرویس می‌شوند.",
ai:"نقش یک Staff Engineer را بازی کن که طراحی LB دسترس‌پذیر و mTLS من را در جلسهٔ Design Review به چالش می‌کشد. روی split-brain، رفتار Health Check در خرابی DB و ریسک‌های CA داخلی سؤال بپرس و در پایان ADR من را از نظر وضوح Trade-offها نقد کن."},

{id:"nproj-l5",title:"پروژه سطح پنج: شبکهٔ کانتینر از صفر (namespace/veth/bridge/NAT) و مقایسه با CNI واقعی + NetworkPolicy",level:"Advanced",minLadder:5,prereqs:["lk-namespaces-veth","cn-k8s-netpol"],
short:"LabX در حال مهاجرت به Kubernetes است و شما مالک دامین شبکهٔ آن هستید: ابتدا شبکهٔ کانتینر را از صفر با ابزارهای کرنل بسازید تا مکانیزم را عمیقاً بفهمید، سپس با Docker و یک CNI واقعی مقایسه کنید و NetworkPolicy را با یک برنامهٔ rollout امن برای کل سازمان طراحی کنید.",
deep:"صورت‌مسئلهٔ ثابت در سه بخش:\nبخش الف — از صفر (فقط ip، nft و ابزارهای استاندارد، بدون Docker):\n۱) سه network namespace به نام‌های web، api و db؛ یک bridge به نام br-labx با آدرس 172.30.0.1/24؛ هر namespace با یک جفت veth به bridge وصل و به‌ترتیب 172.30.0.10، .20 و .30 بگیرد.\n۲) هر namespace بتواند به اینترنت برسد (ip_forward و MASQUERADE در nftables) و dig example.com از داخل آن کار کند.\n۳) Port publishing: پورت 8080 میزبان با DNAT به 172.30.0.10:80 برسد — هم از بیرون و هم از خود میزبان (hairpin/OUTPUT chain را درست کنید).\n۴) ایزوله‌سازی: web→api:8000 مجاز، api→db:5432 مجاز، web→db ممنوع؛ با rule در nftables روی forward chain.\n۵) با tcpdump روی veth، bridge و رابط بیرونی، مسیر یک بسته از web تا اینترنت را مرحله‌به‌مرحله (قبل و بعد از NAT) مستند کنید.\nبخش ب — مقایسه:\n۶) همان سه سرویس را با Docker (bridge network) اجرا کنید و diff قوانین iptables/nftables که Docker ساخته با قوانین دستی خودتان را تحلیل کنید.\n۷) یک کلاستر kind با Cilium یا Calico بالا بیاورید، سه سرویس را در namespace labx مستقر کنید و توضیح دهید Pod-to-Pod و Pod-to-Service در این CNI چطور پیاده شده (veth، routing، eBPF یا iptables).\nبخش پ — سیاست سازمانی:\n۸) NetworkPolicy با default-deny برای ingress و egress در namespace labx به‌همراه policyهای مجاز دقیقاً معادل بخش الف، و یک egress صریح برای DNS (CoreDNS روی 53 UDP/TCP) — و یک تست خودکار که هر ۶ جریان مجاز/غیرمجاز را بسنجد.\n۹) یک سند استراتژی rollout برای اعمال NetworkPolicy روی ده‌ها سرویس موجود سازمان: کشف جریان‌های واقعی (مثلاً با Hubble یا لاگ flow)، حالت audit/observe قبل از enforce، ترتیب namespaceها، معیار rollback و مالکیت policyها توسط تیم‌ها.\n۱۰) یک جلسهٔ آموزشی ۴۵ دقیقه‌ای (اسلاید یا سند) برای مهندسان دیگر با عنوان «یک بسته در کانتینر چه مسیری می‌رود».",
objectives:["ساخت کامل شبکهٔ کانتینر با namespace، veth، bridge، NAT و DNAT بدون هیچ ابزار سطح بالا","ردیابی مسیر بسته در هر hop با tcpdump و توضیح نقش NAT و conntrack","مقایسهٔ تحلیلی پیاده‌سازی دستی با Docker و یک CNI واقعی","طراحی NetworkPolicy با default-deny و استثنای DNS و آزمون خودکار آن","طراحی یک استراتژی rollout سازمانی امن و انتقال دانش به تیم‌ها"],
example:"بعد از اعمال default-deny egress در namespace labx، همهٔ Podها ناگهان نمی‌توانند نام سرویس‌ها را resolve کنند؛ علت این است که ترافیک DNS به CoreDNS در kube-system هم egress است و باید صریحاً با یک policy برای پورت 53 UDP و TCP مجاز شود — دقیقاً همان چیزی که در سند rollout باید پیش‌بینی شده باشد.",
code:"# بخش الف - اسکلت\nip link add br-labx type bridge && ip addr add 172.30.0.1/24 dev br-labx && ip link set br-labx up\nfor n in web:10 api:20 db:30; do\n  name=${n%%:*}; ip=${n##*:}\n  ip netns add $name\n  ip link add veth-$name type veth peer name eth0 netns $name\n  ip link set veth-$name master br-labx up\n  ip -n $name addr add 172.30.0.$ip/24 dev eth0\n  ip -n $name link set eth0 up; ip -n $name link set lo up\n  ip -n $name route add default via 172.30.0.1\ndone\nsysctl -w net.ipv4.ip_forward=1\nnft add table ip labxnat\nnft add chain ip labxnat post '{ type nat hook postrouting priority 100; }'\nnft add rule ip labxnat post ip saddr 172.30.0.0/24 oifname != \"br-labx\" masquerade\n\n# بخش پ - default deny\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: default-deny, namespace: labx }\nspec:\n  podSelector: {}\n  policyTypes: [Ingress, Egress]",
exercise:"در بخش الف عمداً net.ipv4.ip_forward را صفر کنید و با tcpdump نشان دهید بسته تا کجا می‌رود و کجا می‌میرد؛ سپس در کلاستر kind یک NetworkPolicy با selector اشتباه (مثلاً label تایپی) بنویسید و نشان دهید چرا «هیچ خطایی نمی‌دهد ولی هیچ کاری هم نمی‌کند» و چطور در CI جلوی این را می‌گیرید.",
project:"شبکهٔ کانتینر LabX ساخته‌شده از صفر با namespace/veth/bridge/NAT/DNAT و ایزوله‌سازی، مستند مسیر بسته با tcpdump، تحلیل مقایسه‌ای با Docker و یک CNI واقعی در kind، NetworkPolicyهای default-deny با تست خودکار، سند استراتژی rollout سازمانی و یک جلسهٔ آموزشی برای تیم‌ها.",
resources:[{t:"ip-netns(8) man page",u:"https://man7.org/linux/man-pages/man8/ip-netns.8.html"},{t:"Kubernetes - Network Policies",u:"https://kubernetes.io/docs/concepts/services-networking/network-policies/"},{t:"kind - Quick Start",u:"https://kind.sigs.k8s.io/docs/user/quick-start/"},{t:"Cilium Documentation",u:"https://docs.cilium.io/en/stable/"}],
criteria:"اسکریپت بخش الف روی یک VM تمیز در کمتر از ۵ ثانیه کل شبکه را می‌سازد و یک اسکریپت پاک‌سازی آن را کامل حذف می‌کند؛ ۶ جریان مجاز/غیرمجاز هم در بخش الف و هم در kind با تست خودکار درست هستند؛ مستند مسیر بسته شامل آدرس مبدأ/مقصد قبل و بعد از NAT در هر hop است؛ سند rollout شامل فاز audit، معیار rollback و مالک هر مرحله است؛ جلسهٔ آموزشی برگزار و حداقل یک مهندس دیگر توانسته تمرین بخش الف را مستقل تکرار کند.",
interview:["Docker دقیقاً چه قوانین nftables/iptables برای port publishing می‌سازد و چرا ترافیک از خود میزبان به localhost:8080 مسیر متفاوتی دارد؟","چرا NetworkPolicy با selector اشتباه بی‌صدا شکست می‌خورد و چطور در سطح سازمان جلوی آن را می‌گیرید؟","اعمال default-deny روی یک سرویس تولیدی که جریان‌هایش را نمی‌شناسید چه ریسکی دارد و قدم اول شما چیست؟"],
mistakes:["فراموش کردن egress برای DNS در default-deny و قطع کل namespace","اعمال مستقیم enforce روی تولید بدون فاز مشاهدهٔ جریان‌های واقعی","فرض اینکه همهٔ CNIها NetworkPolicy را پیاده می‌کنند (Flannel به‌تنهایی نمی‌کند)","پاک نکردن namespaceها و ruleهای آزمایشی و آلوده کردن میزبان"],
production:"این پروژه هم‌ارز مالکیت یک دامین (شبکهٔ پلتفرم) در L5 است: کسی که مکانیزم را از صفر ساخته، در اینسیدنت‌های شبکهٔ Kubernetes سریع‌ترین تشخیص را دارد؛ و rollout ناشیانهٔ NetworkPolicy یکی از راه‌های کلاسیک قطع گستردهٔ سرویس‌هاست.",
ai:"نقش یک Principal Engineer پلتفرم را بازی کن. ابتدا با سؤال‌های عمیق دربارهٔ مسیر بسته در پیاده‌سازی دستی من (NAT، conntrack، hairpin) مطمئن شو مکانیزم را واقعاً فهمیده‌ام، سپس سند rollout من را از دید یک تیم محصول که سرویسش ممکن است قطع شود نقد کن."},

{id:"nproj-l6",title:"پروژه سطح شش: طراحی شبکهٔ چندمنطقه‌ای با GeoDNS/Anycast، DR و سند طراحی + PoC",level:"Expert",minLadder:6,prereqs:["ts-design-review","dns-split-geo","rt-bgp-internet"],
short:"ابتکار در سطح Staff: LabX باید در دو منطقهٔ جغرافیایی فعال باشد. سند طراحی شبکهٔ چندمنطقه‌ای با سه گزینهٔ جایگزین و تحلیل هزینه/ریسک بنویسید، با یک PoC قابل اجرا (GeoDNS و Anycast با BGP در کانتینر) فرضیه‌های کلیدی را اثبات کنید و یک DR drill اجرا کنید.",
deep:"صورت‌مسئلهٔ ثابت: مدیریت LabX هدف «دسترس‌پذیری ۹۹٫۹۵٪ و ادامهٔ کار در صورت از دست رفتن کامل یک منطقه» را تعیین کرده است. RTO هدف ۱۰ دقیقه و RPO هدف ۳۰ ثانیه برای دادهٔ سفارش‌ها است. الزامات دقیق:\n۱) سند طراحی (Design Doc) با حداقل سه گزینه: (الف) Active-Passive با failover مبتنی بر DNS و Health Check، (ب) Active-Active با GeoDNS، (پ) Anycast با BGP (از طریق ارائه‌دهندهٔ ابری/CDN یا AS اختصاصی). برای هر گزینه: مسیر ترافیک کاربر، رفتار در خرابی منطقه، زمان واقعی failover با درنظرگرفتن TTL و کش resolverها، اثر روی دادهٔ دیتابیس (replication، split-brain)، هزینهٔ ترافیک بین‌منطقه‌ای (egress) و پیچیدگی عملیاتی.\n۲) یک ماتریس تصمیم وزن‌دار و یک توصیهٔ نهایی با دلایل و ریسک‌های پذیرفته‌شده؛ به‌علاوهٔ صریحاً بخش «چه چیزی را عمداً حل نمی‌کنیم».\n۳) PoC الف — GeoDNS/Failover: با CoreDNS (پلاگین‌های مناسب) یا PowerDNS یک zone بسازید که بر اساس منبع کوئری (شبیه‌سازی دو منطقه) IP متفاوت بدهد و با از کار افتادن Health Check یک منطقه، پاسخ را تغییر دهد؛ زمان واقعی همگرایی سمت کلاینت را با TTLهای 30، 60 و 300 ثانیه اندازه بگیرید.\n۴) PoC ب — Anycast: با Docker/containerlab دو «PoP» بسازید که هر کدام با BIRD یا FRR یک پیشوند یکسان (مثلاً 198.51.100.10/32) را به یک روتر «اینترنت» شبیه‌سازی‌شده اعلام کنند؛ با از کار افتادن سرویس یک PoP، اعلام مسیر آن خودکار withdraw شود (مثلاً با اسکریپت health یا ExaBGP)؛ زمان همگرایی را اندازه بگیرید و رفتار اتصال‌های TCP جاری هنگام تغییر مسیر را مستند کنید.\n۵) طراحی شبکهٔ بین‌منطقه‌ای: اتصال خصوصی (VPN site-to-site یا peering)، تخصیص CIDR بدون هم‌پوشانی برای رشد ۵ ساله، Segmentation (public/app/data) و جریان replication دیتابیس.\n۶) DR drill: یک Game Day مستند که در آن یک «منطقه» در محیط PoC کامل قطع شود، با زمان‌بندی دقیق تشخیص، تصمیم، failover و بازگشت (failback)، و مقایسه با RTO/RPO هدف.\n۷) برنامهٔ مهاجرت چندفصلی با نقاط تصمیم (go/no-go)، تخمین هزینه و نیاز به نیرو، و ارائهٔ ۲۰ دقیقه‌ای برای مدیریت فنی و غیرفنی.",
objectives:["نوشتن سند طراحی Staff-level با گزینه‌های جایگزین واقعی، ماتریس تصمیم و ریسک‌های صریح","اثبات فرضیه‌های کلیدی (زمان همگرایی DNS و BGP) با PoC عددی به‌جای حدس","طراحی آدرس‌دهی و Segmentation بین‌منطقه‌ای قابل رشد","اجرای DR drill و مقایسهٔ نتایج با RTO/RPO هدف","ارائهٔ تصمیم برای مخاطب فنی و کسب‌وکار"],
example:"PoC نشان می‌دهد با TTL=60، حدود ۹۰٪ کلاینت‌ها در ۹۰ ثانیه به منطقهٔ سالم می‌رسند اما برخی resolverها TTL را نادیده می‌گیرند و چند دقیقه دیرتر؛ در حالی که در Anycast همگرایی مسیر در چند ثانیه رخ می‌دهد ولی اتصال‌های TCP جاری قطع می‌شوند — این دو عدد مستقیماً ستون «زمان failover» ماتریس تصمیم را می‌سازند.",
code:"# bird.conf روی PoP-1 (اعلام پیشوند Anycast)\nrouter id 10.0.1.2;\nprotocol device {}\nprotocol static anycast {\n    ipv4;\n    route 198.51.100.10/32 blackhole;\n}\nprotocol bgp upstream {\n    local as 65001;\n    neighbor 10.0.1.1 as 65000;\n    ipv4 { import none; export where proto = \"anycast\"; };\n}\n\n# health-check ساده: اگر سرویس مرد، اعلام را بردار\nwhile sleep 2; do\n  if curl -sf --max-time 1 http://198.51.100.10/healthz >/dev/null; then birdc enable anycast; else birdc disable anycast; fi\ndone",
exercise:"در PoC Anycast، یک PoP را طوری خراب کنید که سرویس HTTP زنده باشد اما دیتابیسش در دسترس نباشد (خرابی خاکستری) و ببینید آیا health check شما اعلام مسیر را برمی‌دارد؛ نتیجه را به یک بخش «خرابی‌های جزئی» در سند طراحی تبدیل کنید.",
project:"بستهٔ کامل ابتکار چندمنطقه‌ای LabX: سند طراحی با سه گزینه و ماتریس تصمیم، PoC GeoDNS با اندازه‌گیری همگرایی در سه TTL، PoC Anycast با BIRD/FRR و withdraw خودکار، طرح آدرس‌دهی و Segmentation بین‌منطقه‌ای، گزارش DR drill با زمان‌بندی، برنامهٔ مهاجرت چندفصلی و ارائه برای مدیریت.",
resources:[{t:"Cloudflare Blog - A Brief Primer on Anycast",u:"https://blog.cloudflare.com/a-brief-anycast-primer/"},{t:"BIRD Internet Routing Daemon",u:"https://bird.network.cz/"},{t:"containerlab",u:"https://containerlab.dev/"},{t:"Google SRE Book",u:"https://sre.google/sre-book/table-of-contents/"}],
criteria:"سند طراحی سه گزینهٔ واقعی با اعداد (نه صفت) مقایسه می‌کند و بخش «عمداً حل نمی‌کنیم» دارد؛ هر دو PoC با یک دستور قابل اجرا هستند و زمان همگرایی را حداقل ۵ بار اندازه گرفته‌اند (میانه و بدترین حالت گزارش شده)؛ DR drill با timeline دقیقه‌به‌دقیقه مستند و با RTO=10min/RPO=30s مقایسه شده؛ طرح CIDR هیچ هم‌پوشانی ندارد و رشد ۵ ساله را پوشش می‌دهد؛ ارائه برای یک مخاطب غیرفنی قابل فهم است و توصیهٔ نهایی را با هزینه همراه دارد.",
interview:["چرا failover مبتنی بر DNS هرگز به اندازهٔ TTL سریع نیست؟","Anycast برای ترافیک TCP طولانی‌مدت (مثل WebSocket قیمت‌ها) چه ریسکی دارد و چطور کاهشش می‌دهید؟","Active-Active برای سیستمی که دفتر سفارش (order book) دارد چه مشکل بنیادینی در لایهٔ داده ایجاد می‌کند و چطور در طراحی شبکه منعکس می‌شود؟"],
mistakes:["طراحی شبکه بدون درنظرگرفتن لایهٔ داده و split-brain دیتابیس","اعتماد به TTL به‌عنوان زمان واقعی failover","Health Check سطحی که خرابی‌های خاکستری را نمی‌بیند","نادیده گرفتن هزینهٔ egress بین‌منطقه‌ای که در مقیاس بالا می‌تواند از هزینهٔ سرورها بیشتر شود","سند طراحی با فقط یک گزینه (تصمیم از قبل گرفته‌شده)"],
production:"این پروژه هم‌ارز ابتکار سطح Staff (L6) است: تصمیمی که چند تیم و چند فصل را درگیر می‌کند، هزینهٔ زیرساخت را تغییر می‌دهد و باید برای مدیریت قابل دفاع باشد؛ قطعی‌های بزرگ اینترنتی (BGP و DNS) بارها نشان داده‌اند که فرضیه‌های اثبات‌نشده دربارهٔ failover گران تمام می‌شوند.",

// کلید جدا از نقشه راه اصلی تا پیشرفت دو نقشه (که روی file:// یک localStorage مشترک دارند) قاطی نشود.
const STORAGE_KEY = 'network_roadmap_progress_v1';
const EXPORT_KIND = 'network-roadmap';
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); } catch(e) { console.error('storage failed', e); }
}
let PROGRESS = loadProgress(); // { topicId: {status, note, bookmark, review:{lastDate, nextDate, stage}} }

// ---------- Export / Import progress ----------
function exportProgress() {
  const payload = {kind: EXPORT_KIND, exportedAt: new Date().toISOString(), version: 1, progress: PROGRESS};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `network-roadmap-progress-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importProgress() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch(e) {
        alert('فایل معتبر JSON نیست.');
        return;
      }
      const incoming = (parsed && typeof parsed === 'object' && parsed.progress) ? parsed.progress : parsed;
      if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) {
        alert('ساختار فایل پیشرفت نامعتبر است.');
        return;
      }
      // جلوگیری از وارد کردن اشتباهی فایل پیشرفت نقشه راه اصلی
      const known = Object.keys(incoming).filter(k => TOPIC_BY_ID[k] || k.startsWith('netcapstone_')).length;
      const wrongKind = parsed.kind && parsed.kind !== EXPORT_KIND;
      if ((wrongKind || known === 0) && !confirm('به نظر می‌رسد این فایل مربوط به نقشه راه شبکه نیست (مثلاً فایل پیشرفت نقشه راه اصلی است). باز هم وارد شود؟')) {
        return;
      }
      const replace = confirm('برای جایگزینی کامل پیشرفت فعلی با فایل وارد شده OK بزنید؛ برای ادغام (merge) با پیشرفت فعلی Cancel بزنید.');
      if (replace) {
        PROGRESS = incoming;
      } else {
        PROGRESS = Object.assign({}, PROGRESS, incoming);
      }
      saveProgress();
      render();
      alert(`پیشرفت با موفقیت وارد شد (${known} مورد شناخته‌شده).`);
    };
    reader.readAsText(file);
  };
  input.click();
}

function getEntry(topicId) {
  if (!PROGRESS[topicId]) PROGRESS[topicId] = {status:'not_started', note:'', bookmark:false, review:null};
  return PROGRESS[topicId];
}

// ---------- Helpers ----------
function statusLabel(s) {
  return {not_started:'شروع نشده', learning:'در حال یادگیری', practicing:'در حال تمرین', completed:'تکمیل‌شده', mastered:'مسلط'}[s] || s;
}
function levelFa(l) {
  return {Beginner:'مبتدی', Intermediate:'متوسط', Advanced:'پیشرفته', Expert:'خبره'}[l] || l;
}
function ladderBadge(n) {
  if (n == null) return `<span class="badge ladder optional" title="برای هیچ سطح نردبانی الزامی نیست — دانش تکمیلی/تخصصی که بسته به نقش و علاقه یاد می‌گیرید">اختیاری</span>`;
  return `<span class="badge ladder" title="حداقل سطح نردبانی که باید این موضوع را بداند (سطوح بالاتر هم باید بدانند)">L${n}+</span>`;
}
function isDone(id) {
  const e = PROGRESS[id];
  return !!e && (e.status==='completed' || e.status==='mastered');
}
function computeStats() {
  const total = ALL_TOPICS.length;
  let completed=0, mastered=0, learning=0, practicing=0;
  ALL_TOPICS.forEach(t => {
    const e = PROGRESS[t.id];
    if (!e) return;
    if (e.status==='completed') completed++;
    else if (e.status==='mastered') mastered++;
    else if (e.status==='learning') learning++;
    else if (e.status==='practicing') practicing++;
  });
  const done = completed + mastered;
  return {total, completed, mastered, learning, practicing, done, pct: total? Math.round((done/total)*100):0};
}
function phaseStats(phase) {
  const total = phase.topics.length;
  const done = phase.topics.filter(t => isDone(t.id)).length;
  return {total, done, pct: total? Math.round((done/total)*100):0};
}
// پیشرفت لازم برای یک سطح نردبان: همهٔ موضوعات با minLadder <= n
function ladderStats(n) {
  const req = ALL_TOPICS.filter(t => t.minLadder != null && t.minLadder <= n);
  const done = req.filter(t => isDone(t.id)).length;
  return {total: req.length, done, pct: req.length ? Math.round((done/req.length)*100) : 0};
}

// ---------- Render: Phases / topic grid ----------
function matchesFilters(t) {
  if (SEARCH_QUERY) {
    const q = SEARCH_QUERY.toLowerCase();
    const hay = (t.id + ' ' + t.title + ' ' + t.short + ' ' + t.deep + ' ' + (t.code||'')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (FILTER_LEVEL && t.level !== FILTER_LEVEL) return false;
  if (FILTER_LADDER === 'none') { if (t.minLadder != null) return false; }
  else if (FILTER_LADDER && t.minLadder !== Number(FILTER_LADDER)) return false;
  if (FILTER_STATUS) {
    const e = PROGRESS[t.id];
    const s = e ? e.status : 'not_started';
    if (s !== FILTER_STATUS) return false;
  }
  if (FILTER_BOOKMARK) {
    const e = PROGRESS[t.id];
    if (!e || !e.bookmark) return false;
  }
  return true;
}

// ---------- Render: Review (spaced repetition) view ----------
function renderReviewView() {
  const now = new Date();
  const withReview = ALL_TOPICS.filter(t => PROGRESS[t.id] && PROGRESS[t.id].review);
  const due = withReview.filter(t => new Date(PROGRESS[t.id].review.nextDate) <= now);
  const upcoming = withReview.filter(t => new Date(PROGRESS[t.id].review.nextDate) > now)
    .sort((a,b) => new Date(PROGRESS[a.id].review.nextDate) - new Date(PROGRESS[b.id].review.nextDate));

  let html = `<div class="topbar"><div><h2>مرور دوره‌ای (Spaced Repetition)</h2><div class="sub">بعد از تکمیل هر موضوع، سیستم فاصلهٔ مرور بعدی را بر اساس بازخورد شما پیشنهاد می‌دهد.</div></div>
  <button class="iconbtn" onclick="toggleTheme()">🌓</button></div>`;

  html += `<div class="section-title">امروز نیازمند مرور (${due.length}) <div class="line"></div></div>`;
  if (due.length === 0) html += `<div class="empty">چیزی برای مرور امروز نیست 🎉</div>`;
  due.forEach(t => {
    html += `<div class="review-item"><span>${t.title} — فاز ${t.phaseNum}</span><button class="navbtn" style="flex:none;" onclick="openTopic('${t.id}')">مرور کن</button></div>`;
  });

  html += `<div class="section-title">مرورهای آینده (${upcoming.length}) <div class="line"></div></div>`;
  if (upcoming.length === 0) html += `<div class="empty">هیچ مرور برنامه‌ریزی‌شده‌ای وجود ندارد. بعد از تکمیل موضوعات، دکمهٔ مرور را در جزئیات هر موضوع بزنید.</div>`;
  upcoming.slice(0,30).forEach(t => {
    const d = new Date(PROGRESS[t.id].review.nextDate);
    html += `<div class="review-item"><span>${t.title}</span><span style="color:var(--muted);">${d.toLocaleDateString('fa-IR')}</span></div>`;
  });
  document.getElementById('mainContent').innerHTML = html;
}

// ---------- Render: Capstone view ----------
function renderCapstoneView() {
  let html = `<div class="topbar"><div><h2>آزمون جامع نهایی شبکه (Capstone)</h2><div class="sub">ارزیابی ترکیبی نظری، عملی، دیباگ و طراحی در تمام حوزه‌های نقشه راه شبکه</div></div>
  <button class="iconbtn" onclick="toggleTheme()">🌓</button></div>
  <div class="footer-note">⚠️ توجه: تکمیل این چک‌لیست جای تجربهٔ واقعی را نمی‌گیرد. مهارت شبکه وقتی واقعی است که بتوانید وسط یک اینسیدنت، فقط با ترمینال و چند ابزار ساده، لایهٔ مقصر را پیدا کنید.</div>`;
  CAPSTONE.sections.forEach(sec => {
    html += `<div class="section-title">${sec.title}<div class="line"></div></div><div class="topic-grid">`;
    sec.items.forEach((item, idx) => {
      const key = `netcapstone_${sec.title}_${idx}`;
      const checked = PROGRESS[key] && PROGRESS[key].status==='completed';
      html += `<div class="topic-card" style="cursor:default;" onclick="toggleCapstoneItem('${key}')">
        <div class="status-dot ${checked?'completed':''}"></div>
        <p style="margin-top:14px;">${item}</p>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('mainContent').innerHTML = html;
}
function toggleCapstoneItem(key) {
  if (!PROGRESS[key]) PROGRESS[key] = {status:'not_started'};
  PROGRESS[key].status = PROGRESS[key].status === 'completed' ? 'not_started' : 'completed';
  saveProgress();
  render();
}

// ---------- Topic Modal ----------
function openTopic(id) {
  const t = TOPIC_BY_ID[id];
  if (!t) return;
  const e = getEntry(id);
  const ai = fullAiPrompt(t);
  const resHtml = (t.resources||[]).map(r => `<a class="resbtn" href="${r.u}" target="_blank" rel="noopener">🔗 ${r.t}</a>`).join(' ');
  const prereqHtml = (t.prereqs||[]).length ? (t.prereqs||[]).map(p => {
    const pt = TOPIC_BY_ID[p];
    const done = isDone(p);
    return `<span class="badge" style="color:${done?'var(--good)':'var(--bad)'};cursor:pointer;" onclick="openTopic('${p}')">${done?'✓':'✗'} ${pt?pt.title:p}</span>`;
  }).join(' ') : '<span class="badge">ندارد</span>';

  const html = `
    <span class="modal-close" onclick="closeTopic()">×</span>
    <h3>${t.title}</h3>
    <div class="modal-sub">فاز ${t.phaseNum}: ${t.phaseTitle} · سطح: ${levelFa(t.level)} · ${t.minLadder == null ? 'نردبان' : 'حداقل سطح نردبان'}: ${ladderBadge(t.minLadder)}</div>

    <div class="statusbar">
      ${['not_started','learning','practicing','completed','mastered'].map(s =>
        `<div class="statusbtn ${e.status===s?'on':''}" onclick="setStatus('${id}','${s}')">${statusLabel(s)}</div>`
      ).join('')}
      <div class="statusbtn ${e.bookmark?'on':''}" onclick="toggleBookmark('${id}')">★ بوکمارک</div>
    </div>

    <div class="mrow"><h5>🎯 پیش‌نیازها</h5><div class="body">${prereqHtml}</div></div>
    <div class="mrow"><h5>📌 توضیح کوتاه</h5><div class="body">${t.short}</div></div>
    <div class="mrow"><h5>🔬 توضیح عمیق</h5><div class="body">${t.deep.replace(/\n/g,'<br>')}</div></div>
    ${t.objectives && t.objectives.length ? `<div class="mrow"><h5>🎓 اهداف یادگیری</h5><ul>${t.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>` : ''}
    ${t.example ? `<div class="mrow"><h5>💡 مثال</h5><div class="body">${t.example}</div></div>` : ''}
    ${t.code ? `<div class="mrow"><h5>💻 دستورات و کد</h5><pre>${escapeHtml(t.code)}</pre></div>` : ''}
    ${t.exercise ? `<div class="mrow"><h5>✍️ تمرین</h5><div class="body">${t.exercise}</div></div>` : ''}
    ${t.project ? `<div class="mrow"><h5>🏗️ پروژهٔ مرتبط</h5><div class="body">${t.project}</div></div>` : ''}
    ${t.criteria ? `<div class="mrow"><h5>✅ معیار تکمیل</h5><div class="body">${t.criteria}</div></div>` : ''}
    ${t.interview && t.interview.length ? `<div class="mrow"><h5>🎤 سؤالات مصاحبه</h5><ul>${t.interview.map(q=>`<li>${q}</li>`).join('')}</ul></div>` : ''}
    ${t.mistakes && t.mistakes.length ? `<div class="mrow"><h5>⚠️ اشتباهات رایج</h5><ul>${t.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul></div>` : ''}
    ${t.production ? `<div class="mrow"><h5>🏭 ارتباط با تولید</h5><div class="body">${t.production}</div></div>` : ''}
    <div class="mrow"><h5>📚 منابع رایگان</h5><div class="body">${resHtml || 'به‌زودی'}</div></div>
    ${ai ? `<div class="mrow"><h5>🤖 پرامپت مربی AI</h5><div class="aiprompt" id="aiprompt-${id}">${escapeHtml(ai)}</div><button class="copybtn" onclick="copyPrompt('${id}')">کپی پرامپت</button></div>` : ''}

    <div class="mrow"><h5>📝 یادداشت شخصی</h5><textarea class="notearea" id="note-${id}" oninput="saveNote('${id}', this.value)" placeholder="یادداشت خودتان را اینجا بنویسید...">${escapeHtml(e.note||'')}</textarea></div>

    <div class="mrow"><h5>🔁 مرور دوره‌ای</h5><div class="body" style="font-size:12px;color:var(--muted);">بعد از یادگیری، بازخورد بده تا فاصلهٔ مرور بعدی تنظیم شود.</div>
    <div class="reviewbtns">
      <button class="rb-forgot" onclick="scheduleReview('${id}','forgot')">فراموش کردم</button>
      <button class="rb-hard" onclick="scheduleReview('${id}','hard')">سخت بود</button>
      <button class="rb-good" onclick="scheduleReview('${id}','good')">خوب بود</button>
      <button class="rb-easy" onclick="scheduleReview('${id}','easy')">آسان بود</button>
    </div>
    ${e.review ? `<div style="font-size:11px;color:var(--muted);margin-top:6px;">مرور بعدی: ${new Date(e.review.nextDate).toLocaleDateString('fa-IR')}</div>` : ''}
    </div>
  `;
  document.getElementById('topicModal').innerHTML = html;
  document.getElementById('topicOverlay').classList.add('show');
  document.getElementById('topicOverlay').scrollTop = 0;
}
function closeTopic() {
  document.getElementById('topicOverlay').classList.remove('show');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function setStatus(id, status) {
  const e = getEntry(id);
  e.status = status;
  saveProgress();
  openTopic(id);
  render();
}
function toggleBookmark(id) {
  const e = getEntry(id);
  e.bookmark = !e.bookmark;
  saveProgress();
  openTopic(id);
  render();
}
function saveNote(id, val) {
  const e = getEntry(id);
  e.note = val;
  saveProgress();
}
function copyPrompt(id) {
  const t = TOPIC_BY_ID[id];
  if (!t || !t.ai) return;
  navigator.clipboard.writeText(fullAiPrompt(t)).catch(()=>{});
}
const REVIEW_SEQUENCE = [1,3,7,14,30,90];
function scheduleReview(id, quality) {
  const e = getEntry(id);
  if (!e.review) e.review = {lastDate: new Date().toISOString(), stage:0};
  let stage = e.review.stage || 0;
  if (quality === 'forgot') stage = 0;
  else if (quality === 'hard') stage = Math.max(0, stage);
  else if (quality === 'good') stage = Math.min(REVIEW_SEQUENCE.length-1, stage+1);
  else if (quality === 'easy') stage = Math.min(REVIEW_SEQUENCE.length-1, stage+2);
  const days = REVIEW_SEQUENCE[stage] || 1;
  const next = new Date();
  next.setDate(next.getDate() + days);
  e.review = {lastDate: new Date().toISOString(), nextDate: next.toISOString(), stage};
  saveProgress();
  openTopic(id);
}

// ---------- Search ----------
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    SEARCH_QUERY = e.target.value.trim();
    if (SEARCH_QUERY && CURRENT_VIEW !== 'phases') {
      CURRENT_VIEW = 'phases';
      CURRENT_PHASE_FILTER = null;
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view==='phases'));
    }
    render();
  });
  document.getElementById('topicOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'topicOverlay') closeTopic();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTopic();
  });
  render();
});

// ---------- Master render ----------
function render() {
  renderPhaseNav();
  if (CURRENT_VIEW === 'dashboard') renderDashboard();
  else if (CURRENT_VIEW === 'phases') renderPhasesView();
  else if (CURRENT_VIEW === 'compare') renderCompareView();
  else if (CURRENT_VIEW === 'scenarios') renderScenariosView();
  else if (CURRENT_VIEW === 'review') renderReviewView();
  else if (CURRENT_VIEW === 'capstone') renderCapstoneView();
}

</script>
</body>
</html>
