mistakes:["فرض اینکه UDP همیشه سریع‌تر است بدون در نظر گرفتن هزینهٔ پیاده‌سازی اطمینان در لایهٔ اپلیکیشن","فعال‌کردن HTTP/3 بدون باز کردن UDP/443 در فایروال/Security Group و بدون fallback"],
production:"DNS داخلی، WireGuard، متریک‌های StatsD و HTTP/3 لبهٔ CDN همه روی UDP هستند؛ timeout کوتاه conntrack برای UDP و مسدود بودن UDP در برخی شبکه‌های کاربران از منابع واقعی مشکلات تولید است.",
ai:"تفاوت TCP، UDP و QUIC را با مثال‌های واقعی (DNS، استریم قیمت بازار، HTTP/3 در اپ موبایل) به من آموزش بده و از من بخواه برای چند سناریو پروتکل مناسب را با استدلال انتخاب کنم."},
{id:"tp-keepalive-timeouts",title:"Keepalive، Timeoutها و Connection Pooling",level:"Intermediate",minLadder:3,prereqs:["tp-tcp-handshake-states"],
short:"تنظیم درست connect/read/idle timeout، TCP Keepalive و HTTP Keep-Alive، و استفاده از Connection Pool برای جلوگیری از قطعی‌های مرموز و تأخیر اضافه.",
deep:"هر اتصال شبکه بدون timeout یک قطعی بالقوه است: اگر سرور مقصد هنگ کند، thread یا worker شما برای همیشه منتظر می‌ماند و در چند دقیقه کل pool پر می‌شود. سه نوع timeout را باید جدا فهمید: connect timeout (برقراری هندشیک، معمولاً ۱ تا ۳ ثانیه)، read timeout (فاصلهٔ بین بایت‌های دریافتی، نه کل پاسخ) و کل deadline درخواست. کتابخانهٔ requests در پایتون به‌طور پیش‌فرض هیچ timeoutی ندارد! مشکل دوم، اتصالات idle است: Load Balancerها، NATها و فایروال‌ها جدول اتصال را با timeout نگه می‌دارند (AWS NLB حدود ۳۵۰ ثانیه، ALB پیش‌فرض ۶۰ ثانیه، conntrack لینوکس برای established ۵ روز ولی NAT خانگی گاهی چند دقیقه) و بعد اتصال را بی‌صدا فراموش می‌کنند؛ درخواست بعدی روی آن اتصال «مرده» با RST یا hang مواجه می‌شود. TCP Keepalive با ارسال probe پس از net.ipv4.tcp_keepalive_time (پیش‌فرض ۷۲۰۰ ثانیه — برای این کار عملاً بی‌فایده) اتصال را زنده نگه می‌دارد یا مرده‌بودنش را کشف می‌کند، پس برای اتصالات طولانی (Postgres، Redis، gRPC) باید مقدار کمتر تنظیم شود. HTTP Keep-Alive مفهوم دیگری است: استفادهٔ مجدد از یک اتصال TCP/TLS برای چند درخواست. قاعدهٔ طلایی زنجیره: idle timeout سمت کلاینت باید کمتر از idle timeout سرور/پراکسی باشد (مثلاً Gunicorn keepalive کوچکتر از ALB نباشد) وگرنه 502های پراکنده می‌گیرید. Connection Pool (مثل requests.Session، httpx.Client، PgBouncer یا CONN_MAX_AGE جنگو) هزینهٔ هندشیک TCP+TLS (۲ تا ۳ RTT) را حذف می‌کند، اما باید سقف اندازه، health check و بازیافت اتصالات قدیمی داشته باشد.",
objectives:["تعریف connect/read timeout و deadline برای هر فراخوانی شبکه در کد","توضیح تفاوت TCP Keepalive و HTTP Keep-Alive","هم‌راستا کردن idle timeoutها در زنجیرهٔ کلاینت → LB → پراکسی → اپ","استفادهٔ درست از Connection Pool و تشخیص اتصال مرده"],
example:"بعد از مهاجرت به پشت ALB، روزانه چند ده خطای 502 پراکنده دیده می‌شود. علت: keepalive سرور upstream (۵ ثانیه در Gunicorn پیش‌فرض ۲) کمتر از idle timeout ALB (۶۰ ثانیه) است و ALB روی اتصالی درخواست می‌فرستد که upstream همان لحظه بسته است. افزایش keepalive سرور به بیش از ۶۰ ثانیه مشکل را حل می‌کند.",
code:"# پایتون: همیشه timeout و Session (pool)\nimport requests\ns = requests.Session()\nr = s.get('https://api.example.com/price', timeout=(2, 5))  # (connect, read)\n\n# httpx با سقف pool\nimport httpx\nclient = httpx.Client(timeout=httpx.Timeout(5.0, connect=2.0),\n                      limits=httpx.Limits(max_connections=50, max_keepalive_connections=20))\n\n# TCP keepalive سیستم\nsysctl net.ipv4.tcp_keepalive_time net.ipv4.tcp_keepalive_intvl net.ipv4.tcp_keepalive_probes\n\n# دیدن تایمرهای keepalive روی اتصالات\nss -tno state established '( dport = :5432 )'\n\n# Django: استفادهٔ مجدد از اتصال دیتابیس\n# DATABASES['default']['CONN_MAX_AGE'] = 60\n# DATABASES['default']['CONN_HEALTH_CHECKS'] = True",
exercise:"یک سرور کند (sleep 30 قبل از پاسخ) بسازید و با requests بدون timeout و با timeout=(2,5) صدایش بزنید. سپس با ۲۰ thread همزمان نشان دهید بدون timeout همهٔ workerها قفل می‌شوند. در پایان زنجیرهٔ timeoutهای یک سرویس واقعی خودتان (کلاینت → Nginx → Gunicorn → DB) را در یک جدول مستند کنید.",
project:"", resources:[{t:"requests - Timeouts",u:"https://requests.readthedocs.io/en/latest/user/advanced/#timeouts"},{t:"TCP keepalive HOWTO (TLDP)",u:"https://tldp.org/HOWTO/TCP-Keepalive-HOWTO/"},{t:"tcp(7) - Linux manual page",u:"https://man7.org/linux/man-pages/man7/tcp.7.html"},{t:"Cloudflare blog - When TCP sockets refuse to die",u:"https://blog.cloudflare.com/when-tcp-sockets-refuse-to-die/"}],
criteria:"هیچ فراخوانی شبکه‌ای در کد شما بدون timeout نیست و می‌توانید جدول idle timeout کل زنجیرهٔ یک درخواست را بنویسید و توضیح دهید چرا مقادیرش با هم سازگارند.",
interview:["تفاوت connect timeout و read timeout چیست و هرکدام را چطور انتخاب می‌کنید؟","502های پراکنده پشت Load Balancer را چطور به عدم تطابق idle timeout ربط می‌دهید؟","TCP Keepalive با HTTP Keep-Alive چه فرقی دارد؟"],
mistakes:["استفاده از requests.get بدون timeout در کد تولیدی","ساختن Session/Client جدید برای هر درخواست و از دست دادن مزیت pool","idle timeout سرور upstream کوتاه‌تر از Load Balancer جلویش"],
production:"در صرافی، فراخوانی بدون timeout به یک سرویس قیمت یا نود بلاکچین کند می‌تواند در چند دقیقه همهٔ workerهای API را قفل کند؛ timeoutها و poolها خط اول دفاع در برابر cascading failure هستند.",
ai:"مفاهیم connect/read timeout، TCP Keepalive، HTTP Keep-Alive و Connection Pool را با یک سناریوی واقعی 502 پراکنده پشت Load Balancer به من آموزش بده و از من بخواه زنجیرهٔ timeoutهای یک سرویس Django پشت Nginx و ALB را طراحی کنم."}
]},

{id:"p5",num:5,title:"DNS",icon:"📖",summary:"از Resolve یک نام تا DNSSEC، Resolver لینوکس، مهاجرت DNS و Load Balancing مبتنی بر DNS.",
topics:[
{id:"dns-resolution",title:"DNS: سلسله‌مراتب، Recursive/Authoritative و مسیر Resolve",level:"Beginner",minLadder:1,prereqs:["nf-osi-tcpip"],
short:"DNS چطور یک نام مثل api.example.com را از Root تا سرور Authoritative دنبال می‌کند و نقش Stub، Recursive Resolver و Authoritative چیست.",
deep:"DNS یک پایگاه دادهٔ توزیع‌شده و سلسله‌مراتبی است. وقتی برنامهٔ شما api.example.com را می‌خواهد، Stub Resolver سیستم‌عامل (کتابخانهٔ libc یا systemd-resolved) فقط یک سؤال به Recursive Resolver (مثلاً resolver ISP، 1.1.1.1، 8.8.8.8 یا resolver داخلی VPC) می‌فرستد و انتظار جواب نهایی دارد. Recursive Resolver اگر جواب را در کش نداشته باشد، کار سخت را انجام می‌دهد: از یکی از ۱۳ نام Root Server (که با Anycast صدها نمونهٔ فیزیکی دارند) می‌پرسد، Root فقط می‌گوید «برای .com از این سرورهای TLD بپرس» (Referral)، سرور TLD می‌گوید «سرورهای Authoritative دامنهٔ example.com این‌ها هستند» و در نهایت سرور Authoritative (مثلاً Route53 یا Cloudflare DNS که شما رکوردها را در آن تعریف کرده‌اید) جواب قطعی را با یک TTL برمی‌گرداند. هر مرحله کش می‌شود، پس معمولاً فقط مرحلهٔ آخر واقعاً اتفاق می‌افتد. DNS به‌طور پیش‌فرض روی UDP پورت ۵۳ است و برای پاسخ‌های بزرگ (بیش از حد EDNS، یا زون ترنسفر) به TCP/53 می‌رود — بستن TCP/53 در فایروال یک اشتباه رایج است. کدهای پاسخ را بشناسید: NOERROR، NXDOMAIN (نام وجود ندارد)، SERVFAIL (resolver نتوانست جواب معتبر بگیرد، مثلاً خطای DNSSEC یا Authoritative در دسترس نیست) و REFUSED. از دید مهندس بک‌اند، DNS اولین وابستگی پنهان هر درخواست خروجی است: اگر resolver کند باشد، هر فراخوانی API چند ده تا چند صد میلی‌ثانیه کند می‌شود و اگر از کار بیفتد، تقریباً همه‌چیز از کار می‌افتد — جملهٔ معروف «It's always DNS».",
objectives:["رسم مسیر کامل Resolve از Stub تا Root، TLD و Authoritative","تفکیک Recursive Resolver از Authoritative Server","تفسیر کدهای پاسخ NOERROR، NXDOMAIN، SERVFAIL و REFUSED","استفاده از dig +trace برای دیدن مسیر Resolve"],
example:"dig +trace api.github.com نشان می‌دهد سؤال از Root (.) به سرورهای gtld-servers.net برای .com و سپس به سرورهای Authoritative گیت‌هاب ارجاع داده می‌شود تا رکورد نهایی برگردد.",
code:"# دنبال کردن مسیر کامل Resolve بدون کش resolver\ndig +trace api.github.com\n\n# پرسیدن از یک resolver مشخص و دیدن TTL و status\ndig @1.1.1.1 example.com A\ndig @8.8.8.8 doesnotexist.example.com   # status: NXDOMAIN\n\n# پرسیدن مستقیم از سرور Authoritative\ndig NS example.com +short\ndig @$(dig NS example.com +short | head -1) example.com A\n\n# Resolve از دید برنامه‌ها (با nsswitch و /etc/hosts)\ngetent hosts example.com\n\n# پایتون\nimport socket; print(socket.getaddrinfo('example.com', 443))",
exercise:"برای سه دامنه (یک سایت بزرگ، دامنهٔ شرکت خودتان و یک دامنهٔ ناموجود) dig +trace بگیرید و برای هرکدام نمودار مسیر Resolve را رسم کنید؛ مشخص کنید کدام سرور Authoritative است و TTL پاسخ نهایی چقدر است.",
project:"", resources:[{t:"Cloudflare Learning - What is DNS?",u:"https://www.cloudflare.com/learning/dns/what-is-dns/"},{t:"RFC 1034 - Domain Names: Concepts and Facilities",u:"https://www.rfc-editor.org/rfc/rfc1034"},{t:"How DNS Works (comic)",u:"https://howdns.works/"},{t:"Julia Evans - Implement DNS in a weekend",u:"https://implement-dns.wizardzines.com/"}],
criteria:"می‌توانید خروجی dig +trace را خط‌به‌خط توضیح دهید و بگویید یک SERVFAIL یا NXDOMAIN در کدام مرحلهٔ زنجیره ایجاد شده است.",
interview:["وقتی در مرورگر google.com را تایپ می‌کنید، DNS دقیقاً چه مراحلی را طی می‌کند؟","تفاوت Recursive Resolver و Authoritative Server چیست؟","SERVFAIL با NXDOMAIN چه فرقی دارد؟"],
mistakes:["نادیده گرفتن DNS به‌عنوان علت کندی یا قطعی و مستقیم رفتن سراغ اپلیکیشن","مسدود کردن TCP/53 در فایروال و شکست Resolve پاسخ‌های بزرگ"],
production:"قطعی resolver داخلی یا Authoritative (مثل رخداد Dyn در ۲۰۱۶) می‌تواند سرویس‌های کاملاً سالم را غیرقابل‌دسترس کند؛ یک صرافی باید هم resolver مطمئن و هم Authoritative با افزونگی (دو ارائه‌دهنده) داشته باشد.",
ai:"مسیر کامل Resolve یک نام دامنه از Stub Resolver تا Root، TLD و Authoritative را با خروجی واقعی dig +trace به من آموزش بده و چند خروجی dig مشکل‌دار (NXDOMAIN، SERVFAIL، timeout) نشان بده تا علتشان را تشخیص دهم."},
{id:"dns-records",title:"رکوردهای DNS: A/AAAA، CNAME، MX، TXT، NS، SOA، SRV، CAA و PTR",level:"Beginner",minLadder:2,prereqs:["dns-resolution"],
short:"هر نوع رکورد DNS چه کاری می‌کند، محدودیت‌های CNAME، و رکوردهای امنیتی/ایمیل مثل TXT (SPF/DKIM/DMARC) و CAA.",
deep:"A یک نام را به IPv4 و AAAA به IPv6 نگاشت می‌کند و یک نام می‌تواند چند A داشته باشد (Round-robin ساده). CNAME یک نام مستعار به نام دیگر است (www.example.com → example.cdn.net) و resolver باید زنجیره را دنبال کند؛ قانون مهم RFC: نامی که CNAME دارد نباید هیچ رکورد دیگری داشته باشد، به همین دلیل روی apex دامنه (example.com که حتماً NS و SOA دارد) نمی‌توان CNAME گذاشت و ارائه‌دهندگان با ALIAS/ANAME یا CNAME Flattening این را دور می‌زنند. NS مشخص می‌کند کدام سرورها Authoritative یک زون هستند و delegation یک زیردامنه به تیم/ارائه‌دهندهٔ دیگر با NS انجام می‌شود. SOA متادیتای زون است: سرور اصلی، ایمیل مسئول، serial و Negative TTL (مدت کش شدن NXDOMAIN). MX سرورهای ایمیل را با اولویت مشخص می‌کند و باید به نام (نه IP و نه CNAME) اشاره کند. TXT متن آزاد است اما در عمل برای SPF (کدام سرورها اجازهٔ ارسال ایمیل از طرف دامنه را دارند)، DKIM (کلید عمومی امضای ایمیل)، DMARC (سیاست برخورد با ایمیل جعلی) و اثبات مالکیت دامنه (Google، ACME DNS-01) استفاده می‌شود. SRV سرویس، پورت، وزن و اولویت را اعلام می‌کند (_service._proto.name) و در Kubernetes، SIP و Kerberos کاربرد دارد. CAA مشخص می‌کند کدام CAها اجازهٔ صدور گواهی برای دامنه را دارند — لایهٔ دفاعی ارزان در برابر صدور گواهی جعلی. PTR در زون معکوس (in-addr.arpa) IP را به نام برمی‌گرداند و برای اعتبار سرور ایمیل و خوانایی لاگ‌ها مهم است. برای یک صرافی، SPF/DKIM/DMARC درست یعنی ایمیل‌های OTP و تأیید برداشت به اسپم نمی‌روند و فیشینگ با دامنهٔ شما سخت‌تر می‌شود.",
objectives:["انتخاب نوع رکورد درست برای هر نیاز (سرویس، ایمیل، CDN، اثبات مالکیت)","توضیح محدودیت CNAME در apex و راه‌حل‌های ALIAS/Flattening","پیکربندی و بررسی SPF، DKIM، DMARC و CAA","delegation یک زیردامنه با رکورد NS"],
example:"دامنهٔ exchange.example: رکورد ALIAS روی apex به Load Balancer، CNAME برای www به همان، MX به سرویس ایمیل، TXT برای SPF و DMARC با p=reject، و CAA که فقط letsencrypt.org را مجاز می‌کند.",
code:"dig example.com A +short\ndig example.com AAAA +short\ndig www.github.com CNAME +short\ndig gmail.com MX +short\ndig example.com NS +short\ndig example.com SOA +short\ndig google.com TXT +short | grep spf\ndig _dmarc.google.com TXT +short\ndig google.com CAA +short\ndig -x 8.8.8.8 +short          # PTR\ndig _xmpp-server._tcp.jabber.org SRV +short\n\n# نمونهٔ زون (BIND)\n# @     3600 IN CAA 0 issue \"letsencrypt.org\"\n# @     3600 IN TXT \"v=spf1 include:_spf.google.com -all\"\n# _dmarc 3600 IN TXT \"v=DMARC1; p=reject; rua=mailto:dmarc@example.com\"",
exercise:"برای دامنهٔ شرکت خودتان (یا یک دامنهٔ بزرگ) همهٔ رکوردهای A، AAAA، MX، NS، SOA، TXT، CAA و _dmarc را با dig استخراج کنید و یک گزارش یک‌صفحه‌ای بنویسید: SPF/DMARC چقدر سخت‌گیرانه است؟ CAA دارد؟ apex چطور به CDN/LB اشاره می‌کند؟",
project:"", resources:[{t:"Cloudflare Learning - DNS records",u:"https://www.cloudflare.com/learning/dns/dns-records/"},{t:"RFC 1035 - Domain Names: Implementation and Specification",u:"https://www.rfc-editor.org/rfc/rfc1035"},{t:"RFC 8659 - DNS CAA Resource Record",u:"https://www.rfc-editor.org/rfc/rfc8659"},{t:"Cloudflare Learning - What is DMARC?",u:"https://www.cloudflare.com/learning/email-security/dmarc-dkim-spf/"}],
criteria:"می‌توانید رکوردهای DNS یک سرویس جدید (وب، API، ایمیل تراکنشی، CDN) را کامل طراحی کنید و توضیح دهید چرا روی apex از CNAME استفاده نکرده‌اید.",
interview:["چرا نمی‌توان روی apex دامنه CNAME گذاشت؟","SPF، DKIM و DMARC هرکدام چه مشکلی را حل می‌کنند؟","رکورد CAA چیست و چه حمله‌ای را سخت‌تر می‌کند؟"],
mistakes:["گذاشتن CNAME در کنار رکوردهای دیگر روی یک نام","SPF با ~all یا DMARC با p=none برای همیشه و آسیب‌پذیر ماندن در برابر جعل ایمیل","اشارهٔ MX به CNAME یا IP"],
production:"ایمیل‌های OTP، هشدار ورود و تأیید برداشت در یک صرافی حیاتی‌اند؛ پیکربندی ضعیف SPF/DKIM/DMARC هم تحویل ایمیل را خراب می‌کند و هم فیشینگ با دامنهٔ شما را ممکن می‌سازد.",
ai:"انواع رکوردهای DNS (A، AAAA، CNAME، MX، TXT، NS، SOA، SRV، CAA، PTR) را به من آموزش بده و بعد از من بخواه رکوردهای DNS یک سرویس جدید صرافی شامل وب، API، ایمیل تراکنشی و CDN را طراحی کنم و طراحی‌ام را نقد کن."},
{id:"dns-ttl-caching",title:"TTL، لایه‌های کش و مهاجرت DNS بدون Downtime",level:"Intermediate",minLadder:2,prereqs:["dns-records"],
short:"TTL چطور در لایه‌های مختلف کش اعمال می‌شود، چرا «Propagation» در واقع انقضای کش است و چطور IP یک سرویس را بدون قطعی عوض کنیم.",
deep:"DNS «منتشر» نمی‌شود؛ آنچه «Propagation» می‌نامند در واقع منقضی شدن کش‌ها در لایه‌های مختلف است. هر پاسخ Authoritative یک TTL (به ثانیه) دارد و هر کش در مسیر — Recursive Resolver، کش سیستم‌عامل (systemd-resolved، nscd)، کش زبان برنامه‌نویسی (مثلاً JVM که به‌طور پیش‌فرض گاهی تا ابد کش می‌کند)، کش مرورگر و connection poolهایی که هرگز دوباره Resolve نمی‌کنند — می‌تواند آن پاسخ را تا پایان TTL نگه دارد. بنابراین اگر TTL رکورد ۸۶۴۰۰ (یک روز) باشد و IP را عوض کنید، برخی کلاینت‌ها تا ۲۴ ساعت IP قدیمی را می‌بینند. نسخهٔ نگران‌کننده‌تر Negative Caching است: پاسخ NXDOMAIN هم بر اساس SOA minimum کش می‌شود، پس اگر قبل از ساختن رکورد یک بار آن را query کنید، تا مدتی «وجود ندارد» کش می‌ماند. روش استاندارد مهاجرت بدون downtime: ۱) حداقل به اندازهٔ TTL فعلی قبل از مهاجرت، TTL را به ۶۰ تا ۳۰۰ ثانیه کاهش دهید؛ ۲) سرور جدید را آماده و تست کنید (با curl --resolve بدون تغییر DNS)؛ ۳) رکورد را عوض کنید؛ ۴) سرور قدیمی را تا گذشت TTL قدیمی + حاشیه زنده نگه دارید و ترافیکش را مانیتور کنید تا به صفر برسد؛ ۵) TTL را دوباره بالا ببرید. TTL پایین هزینه دارد: تعداد query بیشتر، وابستگی بیشتر به در دسترس بودن DNS و کمی تأخیر بیشتر؛ TTL بالا انعطاف failover را می‌گیرد. برای رکوردهایی که در failover نقش دارند ۶۰ تا ۳۰۰ و برای رکوردهای پایدار (MX، NS) ساعت‌ها مناسب است.",
objectives:["توضیح اینکه Propagation همان انقضای کش در لایه‌های مختلف است","اجرای چک‌لیست مهاجرت DNS بدون downtime","شناسایی کش‌های پنهان (JVM، connection pool، nscd) و Negative Caching","انتخاب TTL مناسب بر اساس نیاز failover"],
example:"تیم Load Balancer را عوض می‌کند و رکورد A را تغییر می‌دهد، اما یک سرویس داخلی جاوا تا ری‌استارت همچنان به IP قدیمی وصل می‌شود چون networkaddress.cache.ttl آن بی‌نهایت تنظیم شده؛ و یک سرویس پایتون هم چون اتصالات pool قدیمی را هرگز نمی‌بندد.",
code:"# دیدن TTL باقی‌مانده در کش resolver (چند بار پشت‌سرهم اجرا کنید)\ndig @1.1.1.1 example.com A | grep -A1 'ANSWER SECTION'\n\n# TTL اصلی از سرور Authoritative\ndig @$(dig NS example.com +short | head -1) example.com A\n\n# Negative TTL از SOA (آخرین عدد)\ndig example.com SOA +short\n\n# تست سرور جدید قبل از تغییر DNS\ncurl -sv --resolve api.example.com:443:203.0.113.10 https://api.example.com/health\n\n# پاک کردن کش محلی\nresolvectl flush-caches && resolvectl statistics",
exercise:"یک چک‌لیست مهاجرت DNS برای انتقال api.example.com از LB قدیمی به جدید بنویسید با زمان‌بندی دقیق (T-48h کاهش TTL، ...). سپس روی یک دامنهٔ تست، TTL را ۶۰ کنید، IP را عوض کنید و با dig از چند resolver عمومی (1.1.1.1، 8.8.8.8، 9.9.9.9) زمان دیدن تغییر را اندازه بگیرید.",
project:"", resources:[{t:"RFC 2308 - Negative Caching of DNS Queries",u:"https://www.rfc-editor.org/rfc/rfc2308"},{t:"Cloudflare Learning - What is DNS TTL?",u:"https://www.cloudflare.com/learning/cdn/glossary/time-to-live-ttl/"},{t:"Julia Evans - DNS doesn't propagate",u:"https://jvns.ca/blog/2021/12/06/dns-doesn-t-propagate/"}],
criteria:"می‌توانید یک مهاجرت IP برای یک سرویس پرترافیک را بدون هیچ خطای کاربر برنامه‌ریزی و اجرا کنید و با داده (ترافیک سرور قدیمی) نشان دهید چه زمانی خاموش کردنش امن است.",
interview:["«DNS propagation» در واقع چیست؟","چطور IP یک API پرترافیک را بدون downtime عوض می‌کنید؟","Negative Caching چیست و چه مشکلی می‌تواند ایجاد کند؟"],
mistakes:["عوض کردن IP بدون کاهش TTL از قبل","خاموش کردن سرور قدیمی بلافاصله پس از تغییر DNS","فراموش کردن کش‌های لایهٔ اپلیکیشن و connection poolهای طولانی"],
production:"مهاجرت دیتاسنتر، تعویض CDN یا failover دستی در یک صرافی بدون مدیریت TTL به معنای ساعت‌ها خطای بخشی از کاربران است؛ و گاهی تنها راه failover سریع، TTL پایین از قبل است.",
ai:"مفهوم TTL، لایه‌های کش DNS، Negative Caching و مهاجرت بدون downtime را به من آموزش بده و یک سناریوی مهاجرت Load Balancer برایم طراحی کن تا چک‌لیست زمان‌بندی‌شده‌اش را بنویسم و تو نقدش کنی."},
{id:"dns-linux-resolver",title:"DNS در لینوکس: /etc/hosts، resolv.conf، nsswitch، systemd-resolved و ndots",level:"Intermediate",minLadder:3,prereqs:["dns-resolution"],
short:"برنامه‌ها در لینوکس دقیقاً چطور یک نام را Resolve می‌کنند: ترتیب nsswitch، فایل hosts، resolv.conf، systemd-resolved و اثر search/ndots در Kubernetes.",
deep:"وقتی برنامه getaddrinfo() را صدا می‌زند، glibc ابتدا /etc/nsswitch.conf را می‌خواند؛ خط hosts: files dns یعنی اول /etc/hosts و بعد DNS (در Ubuntu معمولاً files mdns4_minimal resolve dns). سپس /etc/resolv.conf تعیین می‌کند از کدام nameserver (حداکثر ۳) بپرسد، با چه timeout و attempts (پیش‌فرض ۵ ثانیه و ۲ تلاش — پس یک nameserver مرده در خط اول می‌تواند هر Resolve را ۵ ثانیه کند کند)، و با کدام search domainها. در Ubuntu مدرن، resolv.conf به stub محلی 127.0.0.53 اشاره می‌کند که systemd-resolved است و تنظیمات واقعی را با resolvectl status باید دید؛ پس dig @127.0.0.53 با dig به resolver بالادستی تفاوت دارد. ابزار dig از nsswitch و /etc/hosts استفاده نمی‌کند اما برنامه‌های شما استفاده می‌کنند؛ برای دیدن رفتار واقعی از getent hosts استفاده کنید. گزینهٔ ndots مهم‌ترین تله در Kubernetes است: resolv.conf پادها search domainهایی مثل default.svc.cluster.local svc.cluster.local cluster.local و ndots:5 دارد؛ یعنی هر نامی با کمتر از ۵ نقطه (مثل api.binance.com) اول با همهٔ search domainها امتحان می‌شود و هر بار برای A و AAAA — یعنی تا ۸ query بیهوده و NXDOMAIN قبل از query واقعی. نتیجه: بار سنگین روی CoreDNS، تأخیر اضافه و گاهی timeoutهای ۵ ثانیه‌ای به‌خاطر race در conntrack برای UDP. راه‌حل‌ها: نام کامل با نقطهٔ پایانی (api.binance.com.)، کاهش ndots در dnsConfig پاد، یا NodeLocal DNSCache. همچنین بدانید که هیچ کش DNS پیش‌فرضی در glibc نیست؛ بدون systemd-resolved یا nscd هر Resolve به شبکه می‌رود.",
objectives:["توضیح ترتیب Resolve در glibc از nsswitch تا resolv.conf","کار با systemd-resolved و resolvectl و تفاوت stub 127.0.0.53","تشخیص و رفع مشکل ndots/search domain در Kubernetes","تفاوت رفتار dig با getent/برنامه‌های واقعی"],
example:"فراخوانی‌های یک سرویس پایتون در Kubernetes به api.exchange-partner.com گاهی دقیقاً ۵ ثانیه طول می‌کشد. tcpdump روی پاد نشان می‌دهد قبل از query درست، query برای api.exchange-partner.com.default.svc.cluster.local و ... ارسال می‌شود و گاهی یکی از پاسخ‌های UDP گم می‌شود. تنظیم ndots:2 در dnsConfig تأخیر را حذف می‌کند.",
code:"cat /etc/nsswitch.conf | grep hosts\ncat /etc/resolv.conf\nresolvectl status\nresolvectl query example.com\n\n# Resolve واقعی مثل برنامه‌ها (با /etc/hosts)\ngetent hosts example.com\ngetent ahosts example.com\n\n# دیدن queryهای ndots در یک پاد\nkubectl exec -it mypod -- cat /etc/resolv.conf\nkubectl exec -it mypod -- sh -c 'apk add bind-tools >/dev/null; dig +search +showsearch api.example.com'\n\n# کاهش ndots در Pod spec\n# spec:\n#   dnsConfig:\n#     options:\n#       - name: ndots\n#         value: \"2\"",
exercise:"در یک کانتینر، resolv.conf را طوری تغییر دهید که nameserver اول یک IP مرده باشد و زمان getent hosts را اندازه بگیرید؛ سپس options timeout:1 attempts:1 rotate را اضافه کنید و دوباره اندازه بگیرید. در یک کلاستر Kubernetes (kind/minikube) queryهای ارسالی برای یک نام خارجی را با tcpdump ببینید و بعد از تنظیم ndots مقایسه کنید.",
project:"", resources:[{t:"resolv.conf(5) - Linux manual page",u:"https://man7.org/linux/man-pages/man5/resolv.conf.5.html"},{t:"nsswitch.conf(5) - Linux manual page",u:"https://man7.org/linux/man-pages/man5/nsswitch.conf.5.html"},{t:"Kubernetes - DNS for Services and Pods",u:"https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"},{t:"systemd-resolved.service(8)",u:"https://www.freedesktop.org/software/systemd/man/latest/systemd-resolved.service.html"}],
criteria:"می‌توانید توضیح دهید چرا یک نام در dig Resolve می‌شود اما در برنامه نه (یا برعکس) و مشکل تأخیر ۵ ثانیه‌ای DNS در Kubernetes را تشخیص و رفع کنید.",
interview:["ndots:5 در Kubernetes چه مشکلی ایجاد می‌کند و چطور حلش می‌کنید؟","چرا dig و برنامهٔ شما ممکن است جواب متفاوت بگیرند؟","nameserver 127.0.0.53 در resolv.conf به چه معناست؟"],
mistakes:["ویرایش دستی /etc/resolv.conf که توسط systemd-resolved یا NetworkManager بازنویسی می‌شود","دیباگ Resolve با dig و نادیده گرفتن /etc/hosts و nsswitch","فراخوانی نام‌های خارجی در Kubernetes بدون نقطهٔ پایانی و تحمل هزینهٔ search domainها"],
production:"در کلاسترهای پرترافیک، ndots و search domainها می‌توانند ۸۰٪ بار CoreDNS را بسازند و تأخیرهای ۵ ثانیه‌ای مرموز در فراخوانی سرویس‌های بیرونی (نودها، درگاه‌ها) ایجاد کنند.",
ai:"مسیر Resolve نام در لینوکس (nsswitch، /etc/hosts، resolv.conf، systemd-resolved) و تلهٔ ndots/search در Kubernetes را به من آموزش بده و یک سناریوی تأخیر ۵ ثانیه‌ای DNS در پاد برایم بساز تا قدم‌به‌قدم دیباگش کنم."},
{id:"dns-security-modern",title:"امنیت DNS: Spoofing/Cache Poisoning، DNSSEC، DoH/DoT و DNS Tunneling",level:"Advanced",minLadder:4,prereqs:["dns-records"],
short:"تهدیدهای DNS (جعل، مسموم‌سازی کش، ربودن دامنه، تونل‌زنی) و دفاع‌ها: DNSSEC برای اصالت، DoH/DoT برای محرمانگی، و کنترل‌های عملیاتی.",
deep:"DNS کلاسیک نه رمز شده و نه احراز اصالت شده است: هر کسی در مسیر می‌تواند queryها را ببیند و پاسخ جعلی بفرستد. در Cache Poisoning (حملهٔ Kaminsky ۲۰۰۸) مهاجم پاسخ‌های جعلی زیادی با حدس Transaction ID ۱۶بیتی به resolver می‌فرستد تا یک رکورد جعلی در کش بنشیند؛ دفاع فعلی تصادفی‌سازی پورت مبدأ و 0x20 encoding است. DNSSEC اصالت را با امضای دیجیتال تضمین می‌کند: هر زون رکوردهایش را امضا می‌کند (RRSIG)، کلید عمومی‌اش در DNSKEY است و هش آن کلید به‌صورت DS در زون والد قرار می‌گیرد تا زنجیرهٔ اعتماد از Root تا دامنهٔ شما ساخته شود؛ resolver اعتبارسنج اگر امضا نامعتبر باشد SERVFAIL برمی‌گرداند. DNSSEC محرمانگی نمی‌دهد و پیاده‌سازی اشتباهش (مثلاً rollover نادرست کلید یا انتقال دامنه بدون حذف DS) کل دامنه را برای کاربران resolverهای اعتبارسنج از کار می‌اندازد. محرمانگی کار DoT (DNS over TLS، پورت ۸۵۳) و DoH (DNS over HTTPS، روی ۴۴۳) است: queryها بین کلاینت و resolver رمز می‌شوند؛ DoH از ترافیک وب قابل تفکیک نیست که برای حریم خصوصی خوب و برای مانیتورینگ امنیتی سازمان دردسر است. تهدیدهای عملیاتی مهم‌تر از این‌ها اغلب ساده‌اند: Domain Hijacking از طریق حساب ضعیف registrar (دفاع: 2FA، Registry Lock)، Subdomain Takeover به‌خاطر CNAME آویزان به یک سرویس کلاود حذف‌شده، و DNS Tunneling که دادهٔ دزدیده‌شده یا C2 را در queryهای TXT/subdomain طولانی بیرون می‌برد و فقط با مانیتورینگ لاگ DNS (طول، آنتروپی و حجم query به یک دامنه) قابل کشف است.",
objectives:["توضیح Cache Poisoning و دفاع‌های آن","توضیح زنجیرهٔ اعتماد DNSSEC (RRSIG، DNSKEY، DS) و ریسک‌های عملیاتی‌اش","مقایسهٔ DoT و DoH از نظر حریم خصوصی و قابلیت مانیتورینگ","شناسایی Subdomain Takeover، Domain Hijacking و DNS Tunneling"],
example:"تیم یک bucket استاتیک کلاود را حذف می‌کند اما CNAME مربوط به promo.exchange.example را نگه می‌دارد؛ مهاجم یک bucket با همان نام می‌سازد و صفحهٔ فیشینگ را روی زیردامنهٔ رسمی صرافی بالا می‌آورد (Subdomain Takeover).",
code:"# بررسی DNSSEC یک دامنه\ndig cloudflare.com +dnssec | grep -E 'RRSIG|flags'\ndig cloudflare.com DS +short\ndig cloudflare.com DNSKEY +short\n# فلگ ad در پاسخ = resolver امضا را تأیید کرده\ndig @1.1.1.1 cloudflare.com +dnssec | grep flags\n\n# دامنهٔ عمداً خراب برای تست اعتبارسنجی\ndig @1.1.1.1 dnssec-failed.org   # status: SERVFAIL\ndig @1.1.1.1 dnssec-failed.org +cd   # بدون اعتبارسنجی\n\n# DoH با curl\ncurl -s -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=example.com&type=A'\n\n# پیدا کردن CNAMEهای آویزان (نمونه)\nfor h in $(cat subdomains.txt); do dig +short CNAME $h; done",
exercise:"برای دامنهٔ شرکت خود یک ممیزی امنیتی DNS انجام دهید: آیا DNSSEC فعال است؟ registrar چه 2FA و Registry Lock دارد؟ لیست زیردامنه‌ها را از Certificate Transparency (crt.sh) استخراج کنید و CNAMEهایی که به سرویس‌های کلاود ناموجود اشاره می‌کنند را پیدا کنید. نتیجه را در قالب یک گزارش ریسک بنویسید.",
project:"", resources:[{t:"Cloudflare Learning - How DNSSEC works",u:"https://www.cloudflare.com/learning/dns/dnssec/how-dnssec-works/"},{t:"Cloudflare Learning - DNS over TLS vs DNS over HTTPS",u:"https://www.cloudflare.com/learning/dns/dns-over-tls/"},{t:"RFC 8484 - DNS Queries over HTTPS (DoH)",u:"https://www.rfc-editor.org/rfc/rfc8484"},{t:"OWASP - Subdomain Takeover (WSTG)",u:"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover"}],
criteria:"می‌توانید یک ممیزی امنیتی DNS کامل برای دامنهٔ یک سازمان انجام دهید و برای هر یافته (نبود DNSSEC، CNAME آویزان، registrar ضعیف) ریسک و راه‌حل مشخص پیشنهاد دهید.",
interview:["DNSSEC چه چیزی را تضمین می‌کند و چه چیزی را نه؟","Subdomain Takeover چطور رخ می‌دهد و چطور جلویش را می‌گیرید؟","DNS Tunneling را چطور در شبکهٔ سازمان تشخیص می‌دهید؟"],
mistakes:["فعال‌کردن DNSSEC بدون فرآیند rollover کلید و در نتیجه از کار افتادن کل دامنه","حذف منابع کلاود بدون حذف رکوردهای DNS اشاره‌کننده به آن‌ها","حفاظت ضعیف حساب registrar با وجود سخت‌گیری روی همه‌چیز دیگر"],
production:"برای یک صرافی رمزارز، ربودن DNS یا زیردامنه یعنی فیشینگ با دامنهٔ رسمی و سرقت مستقیم دارایی کاربران (رخدادهای واقعی مشابه برای MyEtherWallet و دیگر سرویس‌ها رخ داده است)؛ امنیت DNS بخشی از امنیت دارایی است.",
ai:"تهدیدهای امنیتی DNS (Cache Poisoning، Domain Hijacking، Subdomain Takeover، DNS Tunneling) و دفاع‌ها (DNSSEC، DoH/DoT، Registry Lock) را به من آموزش بده و در نقش مهاجم یک سناریوی حمله به دامنهٔ یک صرافی بساز تا من راه‌های دفاع را پیشنهاد دهم."},
{id:"dns-split-geo",title:"Split-Horizon DNS، GeoDNS و Load Balancing مبتنی بر DNS",level:"Advanced",minLadder:5,prereqs:["dns-ttl-caching"],
short:"پاسخ متفاوت DNS بر اساس شبکهٔ پرسنده (داخلی/خارجی) یا موقعیت جغرافیایی، و استفاده از DNS برای توزیع بار و failover بین مناطق — با محدودیت‌هایش.",
deep:"Split-Horizon DNS یعنی یک نام برای کلاینت‌های داخلی (VPN/VPC) پاسخی متفاوت از کلاینت‌های اینترنت می‌گیرد: مثلاً db.exchange.internal فقط داخل VPC Resolve شود یا api.example.com داخل شبکه مستقیماً به IP خصوصی LB اشاره کند تا ترافیک از NAT و اینترنت عبور نکند. پیاده‌سازی با viewهای BIND، Private Hosted Zone در Route53 یا CoreDNS داخلی انجام می‌شود؛ ریسک‌ها: نشت نام‌های داخلی، سردرگمی دیباگ (جواب dig روی لپ‌تاپ با پاد متفاوت است) و شکستن وقتی VPN با DNS Leak کار می‌کند. GeoDNS بر اساس IP پرسنده پاسخ می‌دهد تا کاربر به نزدیک‌ترین منطقه برود؛ اما Authoritative فقط IP resolver را می‌بیند نه کاربر را، پس کاربری که از 8.8.8.8 استفاده می‌کند ممکن است اشتباه مسیریابی شود — افزونهٔ EDNS Client Subnet (ECS) با فرستادن پیشوند IP کاربر این را بهبود می‌دهد، با هزینهٔ حریم خصوصی و کارایی کش. Load Balancing مبتنی بر DNS (Weighted، Latency-based، Failover routing در Route53 یا Cloudflare LB) با health check، رکوردهای منطقهٔ ناسالم را از پاسخ حذف می‌کند. محدودیت بنیادین: DNS فقط در زمان Resolve تصمیم می‌گیرد و کلاینت‌ها تا پایان TTL (و گاهی بیشتر به‌خاطر کش‌های بدرفتار و اتصالات طولانی) روی IP قبلی می‌مانند؛ پس failover مبتنی بر DNS دقیقه‌ای است نه ثانیه‌ای، و توزیع بار بر اساس تعداد resolverها است نه کاربران. به همین دلیل سیستم‌های حیاتی DNS را با Anycast (یک IP از چند منطقه) یا Global Load Balancerهای لایه ۴/۷ ترکیب می‌کنند؛ انتخاب بین این‌ها یک تصمیم معماری سطح دامنه با trade-off هزینه، پیچیدگی و RTO است.",
objectives:["طراحی Split-Horizon DNS برای جداسازی نام‌های داخلی و خارجی","توضیح GeoDNS، محدودیت IP resolver و نقش EDNS Client Subnet","طراحی failover بین مناطق با DNS و محاسبهٔ RTO واقعی آن","مقایسهٔ DNS LB با Anycast و Global LB و انتخاب آگاهانه"],
example:"صرافی دو منطقه (تهران و یک دیتاسنتر پشتیبان) دارد؛ api.example.com با Failover routing و health check هر ۱۰ ثانیه و TTL برابر ۶۰ پیکربندی شده. در یک تمرین DR، با از کار انداختن منطقهٔ اصلی، ۹۵٪ ترافیک در ۳ دقیقه منتقل می‌شود اما چند کلاینت موبایل با اتصالات WebSocket باز تا قطع اتصال به منطقهٔ قدیمی وصل می‌مانند.",
code:"# مقایسهٔ پاسخ از دید resolverهای مختلف و با ECS\ndig @8.8.8.8 www.example.com +subnet=5.160.0.0/24\ndig @8.8.8.8 www.example.com +subnet=81.2.69.0/24\n\n# Split-horizon با CoreDNS (نمونهٔ Corefile)\n# exchange.internal:53 {\n#     hosts /etc/coredns/internal.hosts\n# }\n# .:53 {\n#     forward . 1.1.1.1 8.8.8.8\n#     cache 30\n# }\n\n# BIND views (خلاصه)\n# view \"internal\" { match-clients { 10.0.0.0/8; }; zone \"example.com\" { file \"internal.zone\"; }; };\n# view \"external\" { match-clients { any; }; zone \"example.com\" { file \"external.zone\"; }; };",
exercise:"با CoreDNS در Docker یک Split-Horizon بسازید: کلاینت‌های شبکهٔ داخلی Docker برای api.example.test یک IP خصوصی و کلاینت‌های دیگر IP عمومی بگیرند. سپس یک سند یک‌صفحه‌ای بنویسید که failover بین دو منطقه را با DNS طراحی کند و RTO مورد انتظار را بر اساس TTL، فاصلهٔ health check و رفتار کلاینت‌ها محاسبه کند.",
project:"", resources:[{t:"AWS Route 53 - Choosing a routing policy",u:"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html"},{t:"RFC 7871 - Client Subnet in DNS Queries",u:"https://www.rfc-editor.org/rfc/rfc7871"},{t:"CoreDNS Manual",u:"https://coredns.io/manual/toc/"},{t:"Cloudflare Learning - What is DNS-based load balancing?",u:"https://www.cloudflare.com/learning/performance/what-is-dns-load-balancing/"}],
criteria:"می‌توانید برای یک سرویس چندمنطقه‌ای استراتژی DNS (split-horizon، geo، failover) طراحی کنید، RTO واقعی آن را با عدد توجیه کنید و توضیح دهید چه زمانی DNS کافی نیست و Anycast یا Global LB لازم است.",
interview:["چرا failover مبتنی بر DNS ثانیه‌ای نیست؟","GeoDNS چطور موقعیت کاربر را تشخیص می‌دهد و کجا اشتباه می‌کند؟","Split-Horizon DNS چه مزایا و ریسک‌هایی دارد؟"],
mistakes:["تکیه بر DNS failover برای RTO چندثانیه‌ای","health check سطحی (فقط TCP) که منطقهٔ نیمه‌خراب را سالم نشان می‌دهد","نشت نام‌های داخلی در DNS عمومی به‌خاطر پیکربندی اشتباه view"],
production:"در طراحی DR و چندمنطقه‌ای یک صرافی، DNS معمولاً اولین لایهٔ هدایت ترافیک است؛ مهندس سطح دامنه باید محدودیت‌هایش را بداند تا وعدهٔ RTO غیرواقعی به کسب‌وکار ندهد.",
ai:"Split-Horizon DNS، GeoDNS، EDNS Client Subnet و failover مبتنی بر DNS را به من آموزش بده و بعد یک تمرین طراحی بده: معماری DNS یک صرافی با دو منطقه که باید RTO کمتر از ۵ دقیقه داشته باشد؛ طراحی من را از نظر واقع‌بینانه بودن RTO نقد کن."}
]},

{id:"p6",num:6,title:"رمزنگاری و PKI (پایهٔ SSL/TLS)",icon:"🔑",summary:"Hash، رمز متقارن/نامتقارن، Diffie-Hellman، گواهی X.509 و تاریخچهٔ SSL تا TLS 1.3.",
topics:[
{id:"tls-crypto-basics",title:"مبانی رمزنگاری: Hash، متقارن، نامتقارن، Diffie-Hellman و Forward Secrecy",level:"Intermediate",minLadder:2,prereqs:["nf-osi-tcpip"],
short:"ابزارهای پایه‌ای که TLS از آن‌ها ساخته شده: Hash و HMAC، رمز متقارن AEAD، رمز و امضای نامتقارن، تبادل کلید Diffie-Hellman و Forward Secrecy.",
deep:"TLS ترکیبی از چند ابزار رمزنگاری است و هرکدام یک مسئله را حل می‌کند. تابع Hash (SHA-256) از هر ورودی یک خروجی ثابت می‌سازد که برگشت‌ناپذیر و مقاوم در برابر برخورد است؛ برای یکپارچگی و امضا استفاده می‌شود (MD5 و SHA-1 شکسته‌اند). HMAC با ترکیب Hash و یک کلید مشترک، اصالت پیام را ثابت می‌کند — همان چیزی که در امضای webhookها و API keyهای صرافی‌ها استفاده می‌شود. رمز متقارن (AES-GCM، ChaCha20-Poly1305) با یک کلید مشترک بسیار سریع رمز می‌کند و در حالت AEAD هم‌زمان محرمانگی و یکپارچگی می‌دهد؛ تمام دادهٔ یک اتصال TLS با همین رمز می‌شود. مشکل این است که کلید مشترک را چطور روی شبکهٔ ناامن توافق کنیم. رمزنگاری نامتقارن (RSA، ECDSA، Ed25519) یک جفت کلید عمومی/خصوصی دارد: امضا با کلید خصوصی و تأیید با کلید عمومی، که برای احراز هویت سرور استفاده می‌شود؛ اما چند هزار برابر کندتر از متقارن است. Diffie-Hellman (در عمل ECDHE روی X25519) اجازه می‌دهد دو طرف بدون ارسال کلید، روی یک راز مشترک توافق کنند حتی اگر شنودگر همه‌چیز را ببیند. اگر کلیدهای DH برای هر اتصال موقت (Ephemeral) باشند، به ویژگی Forward Secrecy می‌رسیم: حتی اگر سال‌ها بعد کلید خصوصی سرور لو برود، ترافیک ضبط‌شدهٔ قبلی قابل رمزگشایی نیست — دقیقاً چیزی که تبادل کلید RSA قدیمی نداشت و TLS 1.3 به همین دلیل آن را حذف کرد. قاعدهٔ عملی برای مهندس: هرگز رمزنگاری را خودتان پیاده نکنید؛ از کتابخانه‌های بالغ (cryptography در پایتون، libsodium) و پیش‌فرض‌های امن استفاده کنید و برای مقایسهٔ توکن و امضا از مقایسهٔ constant-time (hmac.compare_digest) بهره بگیرید.",
objectives:["تفکیک کاربرد Hash، HMAC، رمز متقارن و نامتقارن","توضیح Diffie-Hellman و چرا شنودگر نمی‌تواند راز مشترک را بسازد","توضیح Forward Secrecy و چرا تبادل کلید RSA حذف شد","استفادهٔ امن از HMAC و مقایسهٔ constant-time در کد"],
example:"API معاملاتی صرافی درخواست‌ها را با HMAC-SHA256 روی بدنه و timestamp امضا می‌کند؛ سرور با همان secret امضا را دوباره می‌سازد و با hmac.compare_digest مقایسه می‌کند تا هم جعل و هم timing attack ممکن نباشد.",
code:"# Hash و HMAC\necho -n 'hello' | sha256sum\necho -n 'body' | openssl dgst -sha256 -hmac 'secret'\n\n# کلید نامتقارن، امضا و تأیید\nopenssl genpkey -algorithm ed25519 -out key.pem\nopenssl pkey -in key.pem -pubout -out pub.pem\necho 'msg' > m.txt\nopenssl pkeyutl -sign -inkey key.pem -rawin -in m.txt -out sig.bin\nopenssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in m.txt -sigfile sig.bin\n\n# پایتون: امضای HMAC و مقایسهٔ امن\nimport hmac, hashlib\nsig = hmac.new(b'secret', b'body', hashlib.sha256).hexdigest()\nprint(hmac.compare_digest(sig, received_sig))",
exercise:"یک تبادل کلید X25519 را در پایتون با کتابخانهٔ cryptography بین دو طرف (Alice و Bob) پیاده کنید و نشان دهید هر دو به یک راز مشترک می‌رسند، سپس با HKDF از آن کلید AES-GCM بسازید و یک پیام رمز و رمزگشایی کنید. در پایان توضیح دهید شنودگر کدام مقادیر را دیده و چرا نمی‌تواند راز را بسازد.",
project:"", resources:[{t:"Cloudflare Learning - What is encryption?",u:"https://www.cloudflare.com/learning/ssl/what-is-encryption/"},{t:"Python cryptography library docs",u:"https://cryptography.io/en/latest/"},{t:"Practical Cryptography for Developers (free book)",u:"https://cryptobook.nakov.com/"},{t:"Cloudflare blog - A (relatively easy to understand) primer on elliptic curve cryptography",u:"https://blog.cloudflare.com/a-relatively-easy-to-understand-primer-on-elliptic-curve-cryptography/"}],
criteria:"می‌توانید توضیح دهید در یک اتصال TLS هر ابزار (ECDHE، امضای ECDSA/RSA، AES-GCM، Hash) دقیقاً کجا و برای چه استفاده می‌شود و Forward Secrecy را با یک سناریو شرح دهید.",
interview:["چرا TLS از رمز متقارن برای داده و از نامتقارن برای هندشیک استفاده می‌کند؟","Forward Secrecy چیست و چرا مهم است؟","چرا مقایسهٔ امضای HMAC با == خطرناک است؟"],
mistakes:["پیاده‌سازی رمزنگاری دست‌ساز یا استفاده از حالت‌های ناامن مثل AES-ECB","استفاده از MD5/SHA-1 برای امنیت یا Hash ساده برای رمز عبور (به‌جای bcrypt/argon2)","مقایسهٔ توکن و امضا با == به‌جای مقایسهٔ constant-time"],
production:"امضای درخواست‌های API معاملاتی، رمزنگاری کلیدهای کیف پول و webhookهای پرداخت همه بر همین مبانی تکیه دارند؛ اشتباه در یکی از آن‌ها در صرافی مستقیماً به از دست رفتن دارایی منجر می‌شود.",
ai:"مبانی رمزنگاری لازم برای فهم TLS (Hash، HMAC، AES-GCM، RSA/ECDSA، Diffie-Hellman و Forward Secrecy) را بدون ریاضی سنگین اما دقیق به من آموزش بده و با تمرین‌های کوچک openssl و پایتون مطمئن شو هر ابزار را درست به کار می‌برم."},
{id:"tls-x509-pki",title:"گواهی X.509، زنجیرهٔ اعتماد، CA و Root Store",level:"Intermediate",minLadder:2,prereqs:["tls-crypto-basics"],
short:"گواهی دیجیتال چه چیزی را ثابت می‌کند، ساختار X.509 (Subject، SAN، اعتبار، Key Usage)، زنجیرهٔ Leaf → Intermediate → Root و نقش Root Store.",
deep:"گواهی X.509 سندی است که یک CA (مرجع صدور) امضا کرده و می‌گوید «این کلید عمومی متعلق به این نام است». فیلدهای کلیدی: Subject (به‌صورت تاریخی CN)، Subject Alternative Name یا SAN (فهرست نام‌هایی که گواهی برایشان معتبر است — مرورگرهای مدرن فقط SAN را بررسی می‌کنند و CN را نادیده می‌گیرند)، Issuer، بازهٔ اعتبار notBefore/notAfter (امروز حداکثر ۳۹۸ روز و رو به کاهش به ۴۷ روز تا ۲۰۲۹)، کلید عمومی، Key Usage/Extended Key Usage (serverAuth، clientAuth) و Basic Constraints (آیا خودش CA است یا نه). اعتماد به‌صورت زنجیره ساخته می‌شود: گواهی Leaf سایت شما توسط یک Intermediate CA امضا شده و Intermediate توسط Root CA. Rootها خودامضا هستند و در Root Store سیستم‌عامل یا مرورگر (مثلاً /etc/ssl/certs، بستهٔ ca-certificates، certifi در پایتون، NSS در فایرفاکس) از قبل نصب شده‌اند. کلید Root آفلاین نگه داشته می‌شود و Intermediateها کار روزمره را انجام می‌دهند تا در صورت لو رفتن، فقط Intermediate باطل شود. نکتهٔ عملیاتی بسیار مهم: سرور باید Leaf به‌علاوهٔ Intermediateها را بفرستد (fullchain)، نه فقط Leaf. مرورگرها گاهی Intermediate گم‌شده را از کش یا AIA پیدا می‌کنند و سایت در مرورگر «کار می‌کند»، اما curl، پایتون، اپ موبایل و سرویس‌های دیگر با خطای unable to get local issuer certificate شکست می‌خورند. باطل‌سازی (Revocation) با CRL و OCSP انجام می‌شود اما در عمل ضعیف است و به همین دلیل صنعت به سمت گواهی‌های کوتاه‌مدت رفته است. CA داخلی (برای mTLS یا سرویس‌های داخلی) هم همین ساختار را دارد و باید Root آن را به Trust Store کلاینت‌ها اضافه کنید، نه اینکه verify را خاموش کنید.",
objectives:["خواندن و تفسیر فیلدهای یک گواهی X.509 (SAN، اعتبار، EKU، Basic Constraints)","توضیح زنجیرهٔ Leaf → Intermediate → Root و نقش Root Store","تشخیص و رفع خطای زنجیرهٔ ناقص (fullchain)","ساخت یک CA داخلی کوچک و اعتماد صحیح به آن در کلاینت"],
example:"اپ اندروید صرافی پس از تمدید گواهی به سرور API وصل نمی‌شود اما سایت در کروم سالم است؛ openssl s_client نشان می‌دهد سرور فقط cert.pem را می‌فرستد نه fullchain.pem. اصلاح مسیر ssl_certificate در Nginx به fullchain مشکل را حل می‌کند.",
code:"# دیدن گواهی و زنجیرهٔ یک سایت\nopenssl s_client -connect github.com:443 -servername github.com -showcerts </dev/null\n\n# تفسیر فیلدهای گواهی\nopenssl x509 -in cert.pem -noout -subject -issuer -dates -ext subjectAltName,keyUsage,extendedKeyUsage,basicConstraints\n\n# اعتبارسنجی زنجیره در برابر Root Store\nopenssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted intermediate.pem leaf.pem\n\n# Root Store پایتون\npython3 -c 'import certifi; print(certifi.where())'\n\n# ساخت CA داخلی کوچک\nopenssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj '/CN=Internal Test CA'",
exercise:"با openssl یک CA داخلی بسازید، با آن برای localhost (با SAN درست) گواهی صادر کنید، یک سرور HTTPS ساده (python -m http.server پشت Nginx یا اسکریپت ssl پایتون) راه بیندازید و نشان دهید curl بدون --cacert خطا می‌دهد و با --cacert ca.crt موفق است. سپس عمداً گواهی بدون SAN بسازید و خطای آن را مشاهده کنید.",
project:"", resources:[{t:"Cloudflare Learning - What is an SSL certificate?",u:"https://www.cloudflare.com/learning/ssl/what-is-an-ssl-certificate/"},{t:"RFC 5280 - X.509 PKI Certificate and CRL Profile",u:"https://www.rfc-editor.org/rfc/rfc5280"},{t:"Let's Encrypt - Chains of Trust",u:"https://letsencrypt.org/certificates/"},{t:"Mozilla - Included CA Certificates (Root Store)",u:"https://wiki.mozilla.org/CA/Included_Certificates"}],
criteria:"می‌توانید با openssl زنجیرهٔ گواهی هر سرور را بررسی کنید، ناقص بودن زنجیره یا عدم تطابق SAN را تشخیص دهید و یک CA داخلی را بدون خاموش کردن verify در کلاینت‌ها مورد اعتماد قرار دهید.",
interview:["چرا یک سایت در مرورگر سالم است ولی curl خطای unable to get local issuer certificate می‌دهد؟","تفاوت Root CA و Intermediate CA چیست و چرا Root آفلاین نگه داشته می‌شود؟","چرا صنعت به سمت گواهی‌های کوتاه‌مدت می‌رود؟"],
mistakes:["پیکربندی سرور با cert.pem به‌جای fullchain.pem","حل خطای گواهی با verify=False یا curl -k در کد تولیدی","صدور گواهی بدون SAN و تکیه بر CN"],
production:"گواهی ناقص یا منقضی‌شده یکی از پرتکرارترین علل قطعی کامل سرویس‌هاست (حتی برای شرکت‌های بزرگ)؛ و verify=False در یک کلاینت پرداخت یا کیف پول در صرافی در عمل یعنی دعوت از حملهٔ MITM.",
ai:"ساختار گواهی X.509، زنجیرهٔ اعتماد و Root Store را با بررسی گواهی‌های واقعی با openssl به من آموزش بده و چند خطای رایج (زنجیرهٔ ناقص، SAN نامطابق، منقضی، CA داخلی) را شبیه‌سازی کن تا من تشخیصشان دهم."},
{id:"tls-ssl-history",title:"از SSL تا TLS 1.3: نسخه‌ها، حملات تاریخی (POODLE، BEAST، Heartbleed) و منسوخ‌شدن",level:"Intermediate",minLadder:3,prereqs:["tls-crypto-basics"],
short:"چرا هنوز می‌گوییم «SSL» در حالی که همهٔ نسخه‌های SSL منسوخ‌اند، تکامل TLS 1.0 تا 1.3 و درس‌های حملات معروف برای پیکربندی امروز.",
deep:"SSL 2.0 (۱۹۹۵) و SSL 3.0 (۱۹۹۶) پروتکل‌های نت‌اسکیپ بودند؛ IETF آن را با نام TLS 1.0 (۱۹۹۹) استاندارد کرد و TLS 1.1 (۲۰۰۶)، TLS 1.2 (۲۰۰۸) و TLS 1.3 (۲۰۱۸) آمدند. امروز SSL 2/3 کاملاً ممنوع‌اند و TLS 1.0 و 1.1 هم در RFC 8996 (۲۰۲۱) رسماً منسوخ شده‌اند؛ پیکربندی قابل‌قبول فقط TLS 1.2 و 1.3 است و «گواهی SSL» صرفاً یک نام بازاریابی باقی‌مانده است. هر حملهٔ معروف درسی دارد: BEAST (۲۰۱۱) از IV قابل پیش‌بینی در حالت CBC در TLS 1.0 سوءاستفاده کرد؛ CRIME و BREACH نشان دادند فشرده‌سازی روی دادهٔ رمز‌شده‌ای که شامل secret است طول را نشت می‌دهد؛ Lucky13 حملهٔ زمان‌بندی روی padding در CBC بود؛ POODLE (۲۰۱۴) padding oracle در SSL 3.0 بود و با حمله‌های Downgrade (وادار کردن کلاینت به نسخهٔ قدیمی) ترکیب می‌شد — دلیل اصلی کشتن SSL 3.0؛ FREAK و Logjam از پشتیبانی جاماندهٔ سرورها از رمزهای ضعیف «Export-grade» سوءاستفاده کردند؛ و Heartbleed (۲۰۱۴) اصلاً باگ پروتکل نبود بلکه باگ خواندن خارج از محدوده در OpenSSL بود که حافظهٔ سرور (شامل کلیدهای خصوصی و کوکی‌ها) را نشت می‌داد — درسش: patch سریع کتابخانه‌ها، تعویض کلید و ابطال گواهی پس از نشت. TLS 1.3 با حذف همهٔ این گزینه‌های خطرناک (CBC، RC4، فشرده‌سازی، تبادل کلید RSA، renegotiation، رمزهای export) و فقط نگه داشتن AEAD و ECDHE، «امن به‌صورت پیش‌فرض» شد و هندشیک را هم از ۲ RTT به ۱ RTT کاهش داد. درس کلی برای مهندس: امنیت پروتکل با گزینه‌های کمتر بیشتر می‌شود، و سازگاری با کلاینت‌های قدیمی باید یک تصمیم آگاهانه و موقت باشد نه پیش‌فرض.",
objectives:["ترسیم خط زمانی SSL 2/3 و TLS 1.0 تا 1.3 و وضعیت فعلی هرکدام","توضیح درس امنیتی BEAST، POODLE، CRIME/BREACH، Logjam و Heartbleed","توضیح تغییرات امنیتی و کارایی TLS 1.3 نسبت به 1.2","ممیزی نسخه‌ها و رمزهای فعال یک سرور"],
example:"اسکن یک سرویس قدیمی داخلی نشان می‌دهد هنوز TLS 1.0 و رمزهای CBC-SHA و حتی 3DES فعال است؛ این سرویس در ممیزی PCI DSS رد می‌شود و پس از غیرفعال کردن آن‌ها فقط یک کلاینت قدیمی ویندوزی نیاز به به‌روزرسانی دارد.",
code:"# بررسی پشتیبانی هر نسخه\nfor v in tls1 tls1_1 tls1_2 tls1_3; do\n  echo -n \"$v: \"; openssl s_client -connect example.com:443 -servername example.com -$v </dev/null 2>/dev/null | grep -q 'Cipher is' && echo yes || echo no\ndone\n\n# فهرست کامل نسخه‌ها و رمزها\nnmap --script ssl-enum-ciphers -p 443 example.com\n\n# ممیزی جامع (ابزار رایگان)\n# ./testssl.sh example.com\n\n# Nginx: فقط نسخه‌های مدرن\n# ssl_protocols TLSv1.2 TLSv1.3;",
exercise:"با testssl.sh یا nmap ssl-enum-ciphers سه سرویس (سایت شرکت، یک سرویس داخلی و یک سایت عمومی بزرگ) را اسکن کنید. برای هر یافتهٔ منسوخ (TLS 1.0، CBC، 3DES، RSA key exchange) بنویسید از کدام حملهٔ تاریخی درس گرفته شده و چه تغییر پیکربندی پیشنهاد می‌کنید.",
project:"", resources:[{t:"RFC 8446 - TLS 1.3",u:"https://www.rfc-editor.org/rfc/rfc8446"},{t:"RFC 8996 - Deprecating TLS 1.0 and TLS 1.1",u:"https://www.rfc-editor.org/rfc/rfc8996"},{t:"The Heartbleed Bug",u:"https://heartbleed.com/"},{t:"testssl.sh",u:"https://testssl.sh/"}],
criteria:"می‌توانید خروجی یک اسکن TLS را تفسیر کنید، برای هر گزینهٔ منسوخ حملهٔ مرتبط را نام ببرید و یک برنامهٔ مهاجرت به TLS 1.2+/1.3 با درنظر گرفتن کلاینت‌های قدیمی بنویسید.",
interview:["تفاوت SSL و TLS چیست و چرا هنوز می‌گوییم گواهی SSL؟","TLS 1.3 چه چیزهایی را حذف کرد و چرا؟","Heartbleed چه نوع آسیب‌پذیری بود و پس از آن چه اقداماتی لازم بود؟"],
mistakes:["فعال نگه داشتن TLS 1.0/1.1 برای «سازگاری» بدون اینکه بدانید کدام کلاینت به آن نیاز دارد","patch کردن OpenSSL پس از Heartbleed بدون تعویض کلید خصوصی و ابطال گواهی"],
production:"ممیزی‌های امنیتی و الزامات رگولاتوری (مثل PCI DSS) نسخه‌های قدیمی را رد می‌کنند؛ مهندس سطح Senior باید بتواند پیکربندی TLS سرویس‌ها را ممیزی و برنامهٔ حذف نسخه‌های قدیمی را بدون شکستن کلاینت‌ها اجرا کند.",
ai:"تاریخچهٔ SSL تا TLS 1.3 و حملات معروف (BEAST، CRIME/BREACH، POODLE، Logjam، Heartbleed) را با تمرکز بر درسی که هرکدام برای پیکربندی امروز دارند به من آموزش بده و یک خروجی اسکن testssl به من بده تا ممیزی و برنامهٔ اصلاح بنویسم."}
]},

{id:"p7",num:7,title:"TLS در عمل",icon:"🔒",summary:"هندشیک TLS 1.2/1.3، دیباگ با openssl، چرخهٔ عمر گواهی با ACME، mTLS و سخت‌سازی پیکربندی.",
topics:[
{id:"tls-handshake",title:"هندشیک TLS 1.2 و 1.3، SNI، ALPN و Session Resumption",level:"Advanced",minLadder:3,prereqs:["tls-x509-pki","tp-tcp-handshake-states"],
short:"دقیقاً چه پیام‌هایی بین کلاینت و سرور رد و بدل می‌شود تا یک کانال رمزشده ساخته شود، و چرا TLS 1.3 یک رفت‌وبرگشت (RTT) کمتر دارد.",
deep:"در TLS 1.2 کلاینت ClientHello را با فهرست Cipher Suiteها، یک عدد تصادفی و Extensionها می‌فرستد؛ سرور ServerHello، Certificate، ServerKeyExchange (پارامترهای ECDHE) و ServerHelloDone را برمی‌گرداند؛ سپس کلاینت ClientKeyExchange و ChangeCipherSpec و Finished را می‌فرستد و سرور هم Finished را — یعنی ۲ RTT قبل از اولین بایت دادهٔ اپلیکیشن (روی یک TCP که خودش ۱ RTT هزینه داشته). TLS 1.3 (RFC 8446) این را به ۱ RTT کاهش داد: کلاینت از همان ClientHello سهم کلید (key_share) را برای گروه‌های محتمل مثل X25519 حدس می‌زند و می‌فرستد، سرور در ServerHello سهم خودش را برمی‌گرداند و از همان لحظه بقیهٔ هندشیک (از جمله Certificate) رمزشده است. TLS 1.3 همچنین RSA Key Exchange و Cipherهای غیر-AEAD را حذف کرد، پس Forward Secrecy اجباری است. SNI (Server Name Indication) نام دامنه را در ClientHello می‌فرستد تا سرور با یک IP بتواند گواهی درست چند دامنه را انتخاب کند؛ نبود SNI در کلاینت‌های قدیمی یا ابزارها علت رایج دریافت گواهی اشتباه است. ALPN در همان هندشیک پروتکل لایهٔ بالا را مذاکره می‌کند (h2 یا http/1.1) و پایهٔ HTTP/2 است. Session Resumption با Session Ticket یا PSK اجازه می‌دهد اتصال‌های بعدی بدون تبادل کامل کلید ساخته شوند و 0-RTT در TLS 1.3 حتی داده را در اولین پرواز می‌فرستد، اما دادهٔ 0-RTT قابل Replay است و نباید برای درخواست‌های غیر idempotent (مثلاً ثبت سفارش در صرافی) پذیرفته شود. برای یک API پرتراکنش، هر RTT اضافه روی اتصال‌های بین‌قاره‌ای ده‌ها میلی‌ثانیه به p99 اضافه می‌کند.",
objectives:["رسم ترتیب پیام‌های هندشیک TLS 1.2 و TLS 1.3 و شمارش RTTها","توضیح نقش SNI و ALPN و عیب‌یابی مشکل نبودن SNI","توضیح Session Resumption، 0-RTT و خطر Replay آن"],
example:"کلاینت موبایل صرافی از تهران به سرور در فرانکفورت با RTT حدود ۱۲۰ms وصل می‌شود: TCP (۱ RTT) + TLS 1.2 (۲ RTT) یعنی ~۳۶۰ms قبل از ارسال درخواست؛ با TLS 1.3 به ~۲۴۰ms و با Resumption و اتصال پایدار عملاً به صفر برای درخواست‌های بعدی می‌رسد.",
code:"# دیدن هندشیک و نسخهٔ مذاکره‌شده\nopenssl s_client -connect example.com:443 -servername example.com -tls1_3 -msg </dev/null 2>&1 | head -40\n\n# مقایسه با TLS 1.2\nopenssl s_client -connect example.com:443 -servername example.com -tls1_2 </dev/null 2>/dev/null | grep -E 'Protocol|Cipher'\n\n# ALPN: آیا سرور h2 را پشتیبانی می‌کند؟\nopenssl s_client -connect example.com:443 -alpn h2,http/1.1 </dev/null 2>/dev/null | grep ALPN\n\n# بدون SNI چه گواهی‌ای برمی‌گردد؟\nopenssl s_client -connect example.com:443 -noservername </dev/null 2>/dev/null | openssl x509 -noout -subject\n\n# کپچر هندشیک برای Wireshark\nsudo tcpdump -i any -w tls.pcap 'tcp port 443 and host example.com'",
exercise:"با tcpdump هندشیک TLS 1.2 و 1.3 به یک سایت را کپچر کنید و در Wireshark (فیلتر tls.handshake) پیام‌ها را بشمارید؛ سپس با متغیر SSLKEYLOGFILE در curl کلیدها را ذخیره و ترافیک رمزشده را در Wireshark رمزگشایی کنید.",
project:"", resources:[{t:"The Illustrated TLS 1.3 Connection",u:"https://tls13.xargs.org/"},{t:"The Illustrated TLS 1.2 Connection",u:"https://tls12.xargs.org/"},{t:"RFC 8446 - TLS 1.3",u:"https://www.rfc-editor.org/rfc/rfc8446"},{t:"High Performance Browser Networking - TLS",u:"https://hpbn.co/transport-layer-security-tls/"}],
criteria:"می‌توانید روی کاغذ هندشیک TLS 1.3 را رسم کنید، بگویید از کدام پیام به بعد رمزشده است، و در یک کپچر واقعی SNI و ALPN را پیدا کنید.",
interview:["چرا TLS 1.3 یک RTT سریع‌تر از TLS 1.2 است؟","0-RTT چه ریسکی دارد و برای چه درخواست‌هایی نباید فعال باشد؟","اگر سرور گواهی دامنهٔ دیگری را برگرداند، اولین فرضیهٔ شما چیست؟"],
mistakes:["فعال کردن 0-RTT بدون بررسی idempotent بودن درخواست‌ها","فراموش کردن -servername در openssl s_client و نتیجه‌گیری غلط دربارهٔ گواهی","نادیده گرفتن هزینهٔ هندشیک و نبود Connection Reuse در کلاینت‌های سرویس‌به‌سرویس"],
production:"در صرافی، تأخیر اتصال اولیهٔ اپ موبایل و Websocket قیمت‌ها مستقیماً به تعداد RTT هندشیک وابسته است؛ فعال کردن TLS 1.3 و Session Resumption روی Edge یکی از ارزان‌ترین بهینه‌سازی‌های latency است.",
ai:"هندشیک TLS 1.2 و 1.3 را پیام‌به‌پیام با من مرور کن و از من بخواه قبل از هر مرحله حدس بزنم پیام بعدی چیست و آیا رمزشده است. سپس با یک خروجی openssl s_client واقعی از من بخواه نسخه، Cipher، SNI و ALPN را پیدا کنم."},
{id:"tls-openssl-debug",title:"عیب‌یابی TLS با openssl s_client، curl -v و بررسی زنجیرهٔ گواهی",level:"Intermediate",minLadder:2,prereqs:["tls-x509-pki"],
short:"تشخیص سریع خطاهای رایج TLS: زنجیرهٔ ناقص، گواهی منقضی، نام نامنطبق، CA ناشناخته و ناسازگاری نسخه.",
deep:"بیشتر اینسیدنت‌های TLS در چند دستهٔ تکراری می‌افتند و هرکدام امضای مشخصی دارند. «certificate has expired» یعنی تاریخ notAfter گذشته است (یا ساعت کلاینت غلط است). «unable to get local issuer certificate» یا «unable to verify the first certificate» معمولاً یعنی سرور زنجیرهٔ Intermediate را نمی‌فرستد — مرورگرها گاهی با کش یا AIA Fetching این را پنهان می‌کنند ولی curl، پایتون requests و کلاینت‌های موبایل شکست می‌خورند، پس «در مرورگر کار می‌کند» دلیل درستی نیست. «hostname mismatch» یعنی نام درخواستی در SAN گواهی نیست (فیلد CN دیگر توسط کلاینت‌های مدرن بررسی نمی‌شود). «handshake failure» یا «no shared cipher» یعنی نسخه یا Cipher مشترکی وجود ندارد، مثلاً کلاینت قدیمی فقط TLS 1.0 دارد. «self-signed certificate in chain» یعنی Root در Trust Store کلاینت نیست — در کانتینرهای slim که بستهٔ ca-certificates ندارند یا پشت پراکسی شرکتی که ترافیک را بازرسی می‌کند رایج است. ابزار اصلی openssl s_client است: با -showcerts کل زنجیرهٔ ارسالی را می‌بینید، با -servername SNI را تنظیم می‌کنید و خط «Verify return code» نتیجهٔ نهایی را می‌گوید. curl -v ترتیب Resolve، Connect، هندشیک و گواهی را نشان می‌دهد و --cacert و --resolve برای آزمایش فرضیه‌ها عالی‌اند. openssl x509 -noout -dates -subject -ext subjectAltName هم محتوای یک فایل گواهی را خلاصه می‌کند. روش درست: اول بفهمید سرور دقیقاً چه زنجیره‌ای می‌فرستد، بعد Trust Store کلاینت را بررسی کنید.",
objectives:["تفسیر خطاهای رایج TLS و نگاشت هرکدام به علت ریشه‌ای","دیدن کل زنجیرهٔ ارسالی سرور و تشخیص Intermediate گمشده","بررسی تاریخ انقضا و SANهای یک گواهی از خط فرمان"],
example:"سرویس پرداخت از داخل کانتینر python:3.12-slim با خطای CERTIFICATE_VERIFY_FAILED به درگاه بانک وصل نمی‌شود اما از لپ‌تاپ وصل می‌شود؛ openssl s_client -showcerts نشان می‌دهد درگاه فقط گواهی leaf را می‌فرستد و Intermediate را نه — مرورگر لپ‌تاپ آن را کش داشته است.",
code:"# زنجیرهٔ کامل ارسالی سرور + نتیجهٔ تأیید\nopenssl s_client -connect api.example.com:443 -servername api.example.com -showcerts </dev/null\n\n# فقط تاریخ‌ها، subject و SANها\necho | openssl s_client -connect api.example.com:443 -servername api.example.com 2>/dev/null \\\n  | openssl x509 -noout -subject -issuer -dates -ext subjectAltName\n\n# چند روز تا انقضا مانده؟ (exit code غیرصفر اگر کمتر از ۱۴ روز)\necho | openssl s_client -connect api.example.com:443 -servername api.example.com 2>/dev/null \\\n  | openssl x509 -noout -checkend $((14*24*3600))\n\n# تست با IP مشخص بدون تغییر DNS\ncurl -v --resolve api.example.com:443:10.0.0.12 https://api.example.com/health\n\n# پایتون: کدام CA bundle استفاده می‌شود؟\npython3 -c 'import ssl, certifi; print(ssl.get_default_verify_paths()); print(certifi.where())'",
exercise:"با سایت badssl.com (expired.badssl.com، wrong.host.badssl.com، self-signed.badssl.com، incomplete-chain.badssl.com) هر خطا را با curl و openssl s_client بازتولید و پیام هرکدام را در یک جدول با علت و راه‌حل ثبت کنید.",
project:"", resources:[{t:"badssl.com - نمونهٔ خطاهای TLS",u:"https://badssl.com/"},{t:"OpenSSL s_client manual",u:"https://docs.openssl.org/master/man1/openssl-s_client/"},{t:"curl - SSL certificate verification",u:"https://curl.se/docs/sslcerts.html"}],
criteria:"برای هر خطای TLS در لاگ یک سرویس، در کمتر از ۵ دقیقه با دو دستور می‌توانید تشخیص دهید مشکل از سمت سرور (زنجیره/انقضا/نام) است یا کلاینت (Trust Store/ساعت/نسخه).",
interview:["چرا ممکن است یک سایت در مرورگر سالم باشد اما curl خطای گواهی بدهد؟","چطور تاریخ انقضای گواهی تمام سرویس‌ها را به‌طور خودکار پایش می‌کنید؟"],
mistakes:["حل مشکل با verify=False یا curl -k در کد تولیدی","تکیه بر تست مرورگر برای اطمینان از سالم بودن زنجیرهٔ گواهی","فراموش کردن نصب ca-certificates در Image کانتینر"],
production:"verify=False که برای «یک تست سریع» اضافه شده و به تولید رسیده، کانال ارتباط با درگاه پرداخت را در برابر MITM بی‌دفاع می‌کند؛ ریشه‌یابی درست خطای TLS جایگزین امن آن است.",
ai:"چند خروجی واقعی و شبیه‌سازی‌شده از openssl s_client و curl -v با خطاهای مختلف TLS به من بده و از من بخواه علت ریشه‌ای و دستور تأیید فرضیه را بگویم؛ اگر اشتباه کردم با یک مثال دیگر همان نوع خطا را تمرین کنیم."},
{id:"tls-acme-lifecycle",title:"صدور و چرخهٔ عمر گواهی: Let's Encrypt، ACME، cert-manager و Rotation",level:"Intermediate",minLadder:3,prereqs:["tls-x509-pki","dns-records"],
short:"خودکارسازی صدور و تمدید گواهی با پروتکل ACME و جلوگیری از کلاسیک‌ترین اینسیدنت: گواهی منقضی‌شده.",
deep:"ACME (RFC 8555) پروتکلی است که Let's Encrypt و چند CA دیگر برای صدور خودکار گواهی استفاده می‌کنند: کلاینت (certbot، acme.sh، Caddy یا cert-manager در Kubernetes) یک Account Key می‌سازد، برای دامنه Order ثبت می‌کند، و CA با یک Challenge کنترل دامنه را می‌سنجد. HTTP-01 یک فایل توکن را از مسیر /.well-known/acme-challenge/ روی پورت ۸۰ می‌خواند — ساده است ولی Wildcard را پشتیبانی نمی‌کند و نیاز به دسترسی عمومی پورت ۸۰ دارد. DNS-01 یک رکورد TXT به نام _acme-challenge را بررسی می‌کند — برای Wildcard و سرورهای داخلی بدون دسترسی عمومی لازم است، اما API Key سرویس DNS را در اختیار کلاینت ACME قرار می‌دهد که خودش یک دارایی حساس است. TLS-ALPN-01 هم روی پورت ۴۴۳ کار می‌کند. گواهی‌های Let's Encrypt عمر ۹۰ روزه دارند و روند صنعت به سمت عمرهای کوتاه‌تر است (CA/Browser Forum کاهش تدریجی تا ۴۷ روز را تصویب کرده)، پس تمدید دستی عملاً غیرممکن می‌شود. Rate Limitها (مثل ۵۰ گواهی برای هر Registered Domain در هفته و محدودیت Duplicate Certificate) اگر در CI یا محیط تست با سرور Production کار کنید شما را قفل می‌کنند؛ برای تست از Staging استفاده کنید. رکورد CAA مشخص می‌کند کدام CAها مجاز به صدور برای دامنهٔ شما هستند. بعد از تمدید، فرایند reload سرویس (nginx -s reload یا Secret جدید در Kubernetes) فراموش‌شده‌ترین قدم است: فایل گواهی جدید روی دیسک است ولی پروسه هنوز گواهی قدیمی را در حافظه دارد. پایش انقضا مستقل از مکانیزم تمدید ضروری است.",
objectives:["توضیح جریان ACME و تفاوت Challengeهای HTTP-01، DNS-01 و TLS-ALPN-01","راه‌اندازی تمدید خودکار با certbot یا cert-manager و reload سرویس","طراحی پایش مستقل انقضای گواهی و آگاهی از Rate Limitها"],
example:"گواهی Wildcard *.exchange.example برای ده‌ها ساب‌دامین با cert-manager و DNS-01 روی Cloudflare صادر می‌شود؛ یک Blackbox Exporter جداگانه اگر هر گواهی کمتر از ۱۴ روز اعتبار داشته باشد هشدار می‌دهد، حتی اگر cert-manager بی‌صدا شکست خورده باشد.",
code:"# صدور با certbot و پلاگین nginx\nsudo certbot --nginx -d api.example.com --redirect\n# تست تمدید بدون صدور واقعی\nsudo certbot renew --dry-run\n# hook برای reload بعد از تمدید\nsudo certbot renew --deploy-hook 'systemctl reload nginx'\n\n# Wildcard با DNS-01 (acme.sh + Cloudflare)\nexport CF_Token='...'\nacme.sh --issue --dns dns_cf -d example.com -d '*.example.com' --server letsencrypt\n\n# cert-manager در Kubernetes\n# apiVersion: cert-manager.io/v1\n# kind: Certificate\n# spec:\n#   secretName: api-tls\n#   dnsNames: [api.example.com]\n#   issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}\n#   renewBefore: 720h\n\n# بررسی رکورد CAA\ndig +short CAA example.com",
exercise:"روی یک VPS ارزان با یک دامنهٔ تست، گواهی Let's Encrypt را ابتدا از سرور Staging و سپس Production با HTTP-01 بگیرید، تمدید خودکار با systemd timer و deploy-hook را تنظیم کنید و با certbot renew --force-renewal مطمئن شوید nginx گواهی جدید را سرو می‌کند (تاریخ notBefore را با openssl چک کنید).",
project:"", resources:[{t:"Let's Encrypt - Challenge Types",u:"https://letsencrypt.org/docs/challenge-types/"},{t:"Let's Encrypt - Rate Limits",u:"https://letsencrypt.org/docs/rate-limits/"},{t:"RFC 8555 - ACME",u:"https://www.rfc-editor.org/rfc/rfc8555"},{t:"cert-manager documentation",u:"https://cert-manager.io/docs/"}],
criteria:"یک دامنه دارید که گواهی آن بدون دخالت دستی تمدید و سرویس reload می‌شود، و یک هشدار مستقل که قبل از انقضا شما را باخبر می‌کند.",
interview:["تفاوت HTTP-01 و DNS-01 چیست و Wildcard با کدام ممکن است؟","گواهی تمدید شده اما کاربران هنوز گواهی منقضی می‌بینند؛ چه چیزی را بررسی می‌کنید؟","رکورد CAA چه کاری انجام می‌دهد؟"],
mistakes:["تست کلاینت ACME روی سرور Production و خوردن به Rate Limit","تمدید گواهی بدون reload پروسه‌ای که آن را سرو می‌کند","تکیه فقط بر ایمیل یادآوری CA به‌جای پایش داخلی"],
production:"گواهی منقضی‌شده یکی از رایج‌ترین علل قطعی کامل سرویس‌های بزرگ است (از Microsoft Teams تا Spotify)؛ برای صرافی این یعنی قطع API معامله‌گران و اپ موبایل به‌طور هم‌زمان.",
ai:"مرا در طراحی یک فرایند کامل مدیریت چرخهٔ عمر گواهی برای ۲۰ دامنه و ساب‌دامین (شامل Wildcard و سرویس‌های داخلی) راهنمایی کن: انتخاب Challenge، محل نگهداری کلیدها، reload و پایش. نقاط شکست طرح من را با سناریوهای واقعی به چالش بکش."},
{id:"tls-mtls",title:"mTLS و احراز هویت سرویس‌به‌سرویس",level:"Advanced",minLadder:4,prereqs:["tls-handshake"],
short:"در mTLS کلاینت هم گواهی ارائه می‌دهد و سرور آن را تأیید می‌کند؛ پایهٔ هویت سرویس‌ها در شبکه‌های Zero Trust و Service Mesh.",
deep:"در TLS معمولی فقط سرور هویتش را ثابت می‌کند؛ در mutual TLS سرور در هندشیک پیام CertificateRequest می‌فرستد و کلاینت باید گواهی و امضای CertificateVerify ارائه دهد که با یک CA مورد اعتماد سرور (معمولاً یک CA داخلی، نه عمومی) تأیید شود. نتیجه این است که هویت کلاینت در لایهٔ انتقال و قبل از رسیدن یک بایت به اپلیکیشن احراز می‌شود — برخلاف API Key یا Token که ممکن است در لاگ یا هدر نشت کنند. هویت معمولاً در SAN گواهی قرار می‌گیرد؛ استاندارد SPIFFE آن را به شکل URI مثل spiffe://exchange.internal/ns/payments/sa/withdrawal تعریف می‌کند و Service Meshهایی مثل Istio و Linkerd گواهی‌های کوتاه‌عمر (مثلاً ۲۴ ساعته) را به‌طور خودکار برای هر Pod صادر و Rotate می‌کنند. چالش‌های واقعی mTLS عملیاتی‌اند: مدیریت CA داخلی و Rotation خود CA بدون قطعی (دوره‌ای که هر دو CA قدیم و جدید معتبرند)، ابطال گواهی (CRL/OCSP در عمل سخت است، پس عمر کوتاه جایگزین ابطال می‌شود)، و Authorization: mTLS فقط می‌گوید «این سرویس payments است»؛ اینکه payments مجاز به فراخوانی endpoint برداشت است یا نه سیاست جداگانه‌ای می‌خواهد. وقتی TLS در پراکسی Terminate می‌شود، هویت کلاینت باید با هدری مثل X-Forwarded-Client-Cert به Backend برسد و Backend باید فقط به آن هدر از پراکسی مورد اعتماد اعتماد کند. دیباگ mTLS معمولاً با خطاهایی مثل «certificate required» یا «unknown ca» در لاگ سرور شروع می‌شود.",
objectives:["توضیح تفاوت هندشیک TLS معمولی و mTLS و نقش CertificateRequest","ساخت یک CA داخلی و صدور گواهی سرور و کلاینت برای تست","تفکیک Authentication (mTLS) از Authorization و طراحی Rotation گواهی‌ها"],
example:"سرویس withdrawal در صرافی فقط درخواست‌هایی را می‌پذیرد که با گواهی کلاینت دارای SAN spiffe://exchange/ns/risk/sa/risk-engine امضا شده باشند؛ حتی اگر مهاجم داخل VPC باشد، بدون کلید خصوصی آن سرویس نمی‌تواند درخواست برداشت ثبت کند.",
code:"# CA داخلی\nopenssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \\\n  -keyout ca.key -out ca.crt -days 365 -subj '/CN=internal-ca'\n\n# گواهی کلاینت\nopenssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \\\n  -keyout client.key -out client.csr -subj '/CN=risk-engine'\nopenssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial \\\n  -out client.crt -days 1\n\n# nginx: الزام گواهی کلاینت\n# ssl_client_certificate /etc/nginx/ca.crt;\n# ssl_verify_client on;\n# proxy_set_header X-Client-DN $ssl_client_s_dn;\n\n# تست\ncurl --cert client.crt --key client.key --cacert ca.crt https://withdrawal.internal/health\ncurl --cacert ca.crt https://withdrawal.internal/health   # باید 400 بدهد",
exercise:"یک CA داخلی بسازید، nginx را با ssl_verify_client on راه بیندازید، با و بدون گواهی کلاینت درخواست بزنید و با tcpdump/Wireshark پیام CertificateRequest را ببینید. سپس CA را Rotate کنید به‌طوری که در دورهٔ گذار هر دو CA پذیرفته شوند.",
project:"", resources:[{t:"Cloudflare Learning - What is mTLS?",u:"https://www.cloudflare.com/learning/access-management/what-is-mutual-tls/"},{t:"SPIFFE - Concepts",u:"https://spiffe.io/docs/latest/spiffe-about/spiffe-concepts/"},{t:"Istio - Mutual TLS Migration",u:"https://istio.io/latest/docs/tasks/security/authentication/mtls-migration/"},{t:"nginx ngx_http_ssl_module",u:"https://nginx.org/en/docs/http/ngx_http_ssl_module.html"}],
criteria:"می‌توانید یک ارتباط mTLS بین دو سرویس برقرار کنید، توضیح دهید هویت کلاینت کجا بررسی می‌شود، و یک برنامهٔ Rotation گواهی و CA بدون Downtime بنویسید.",
interview:["mTLS چه چیزی را تضمین می‌کند و چه چیزی را نه؟","چرا در Service Meshها گواهی‌های کوتاه‌عمر به ابطال (CRL/OCSP) ترجیح داده می‌شوند؟","اگر TLS در Load Balancer Terminate شود، Backend چطور هویت کلاینت را می‌فهمد؟"],
mistakes:["اعتماد Backend به هدر هویت کلاینت بدون اطمینان از اینکه فقط پراکسی می‌تواند آن را تنظیم کند","استفاده از CA عمومی برای گواهی کلاینت داخلی","Rotation ناگهانی CA که همهٔ اتصال‌ها را هم‌زمان قطع می‌کند"],
production:"در سیستم مالی، mTLS بین سرویس‌های حساس (کیف پول، برداشت، ledger) یک لایهٔ دفاعی کلیدی در برابر حرکت جانبی مهاجم داخل شبکه است و معمولاً در ممیزی‌های امنیتی پرسیده می‌شود.",
ai:"با من یک معماری mTLS برای سه سرویس داخلی صرافی (API، risk-engine، withdrawal) طراحی کن و درباره CA، صدور، Rotation و Authorization سؤال بپرس. سپس سناریوی نشت کلید یک سرویس را مطرح کن و ببین واکنش من درست است."},
{id:"tls-hardening",title:"پیکربندی امن TLS: Cipher Suite، HSTS، OCSP Stapling، Certificate Transparency و Pinning",level:"Advanced",minLadder:4,prereqs:["tls-handshake"],
short:"انتخاب نسخه‌ها و Cipherهای امن، فعال‌سازی HSTS و OCSP Stapling، استفاده از CT و فهم ریسک‌های Certificate Pinning.",
deep:"پیکربندی TLS یک مصالحه بین امنیت و سازگاری است و منبع مرجع آن Mozilla SSL Configuration Generator با سه پروفایل Modern (فقط TLS 1.3)، Intermediate (TLS 1.2 و 1.3 با Cipherهای AEAD و ECDHE) و Old است. برای اکثر APIها Intermediate انتخاب درستی است: TLS 1.0/1.1 غیرفعال، فقط Cipherهای ECDHE با AES-GCM یا ChaCha20-Poly1305، و ترجیحاً گواهی ECDSA (کوچک‌تر و سریع‌تر از RSA 2048). HSTS با هدر Strict-Transport-Security به مرورگر می‌گوید برای مدت max-age فقط HTTPS استفاده کند و حملهٔ SSL Stripping را بی‌اثر می‌کند؛ includeSubDomains و preload قدرتمندند اما برگشت‌ناپذیرند: اگر یک ساب‌دامین داخلی HTTPS نداشته باشد، برای ماه‌ها در دسترس نخواهد بود. OCSP Stapling یعنی سرور پاسخ امضاشدهٔ وضعیت ابطال را خودش در هندشیک می‌فرستد تا کلاینت مجبور نباشد به OCSP Responder وصل شود (حریم خصوصی و latency بهتر)؛ هرچند Let's Encrypt در حال کنار گذاشتن OCSP به نفع CRL است و باید وضعیت فعلی را پیگیری کنید. Certificate Transparency (CT) همهٔ گواهی‌های صادرشده را در لاگ‌های عمومی ثبت می‌کند؛ با crt.sh یا سرویس‌های پایش CT می‌توانید ببینید آیا گواهی‌ای برای دامنهٔ شما صادر شده که خودتان صادر نکرده‌اید — یک سیگنال مهم فیشینگ یا نفوذ. Certificate Pinning (به‌خصوص در اپ موبایل) جلوی MITM با CA جعلی را می‌گیرد ولی اگر کلید Pin شده عوض شود و Pin پشتیبان نداشته باشید، اپ کاملاً از کار می‌افتد؛ HPKP مرورگر دقیقاً به همین دلیل حذف شد. ابزارهایی مثل testssl.sh و SSL Labs پیکربندی را ممیزی می‌کنند.",
objectives:["پیکربندی nginx با پروفایل Intermediate موزیلا و رسیدن به نمرهٔ A در SSL Labs","توضیح HSTS، preload و ریسک includeSubDomains","پایش CT برای دامنه‌های سازمان و ارزیابی ریسک Pinning در اپ موبایل"],
example:"تیم امنیت با پایش crt.sh متوجه صدور گواهی برای exchange-login.example.com می‌شود که هیچ تیمی آن را درخواست نکرده؛ بررسی نشان می‌دهد یک رکورد DNS رهاشده (Dangling CNAME) به یک سرویس کلاود حذف‌شده اشاره می‌کرده و مهاجم آن را تصاحب کرده است.",
code:"# nginx - پروفایل Intermediate (خلاصه)\n# ssl_protocols TLSv1.2 TLSv1.3;\n# ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;\n# ssl_prefer_server_ciphers off;\n# ssl_session_timeout 1d;\n# ssl_session_tickets off;\n# ssl_stapling on; ssl_stapling_verify on;\n# add_header Strict-Transport-Security 'max-age=63072000' always;\n\n# ممیزی از خط فرمان\ndocker run --rm -ti drwetter/testssl.sh https://api.example.com\n\n# آیا TLS 1.0 هنوز پذیرفته می‌شود؟\nopenssl s_client -connect api.example.com:443 -tls1 </dev/null\n\n# گواهی‌های ثبت‌شده در CT برای یک دامنه\ncurl -s 'https://crt.sh/?q=%25.example.com&output=json' | jq -r '.[].name_value' | sort -u",
exercise:"پیکربندی TLS یک nginx را با Mozilla SSL Configuration Generator بسازید، با testssl.sh قبل و بعد ممیزی کنید و گزارش تفاوت‌ها را بنویسید. سپس همهٔ گواهی‌های ثبت‌شدهٔ دامنهٔ شرکت را در crt.sh بررسی و موارد ناشناخته را فهرست کنید.",
project:"", resources:[{t:"Mozilla SSL Configuration Generator",u:"https://ssl-config.mozilla.org/"},{t:"Mozilla Server Side TLS Guidelines",u:"https://wiki.mozilla.org/Security/Server_Side_TLS"},{t:"MDN - Strict-Transport-Security",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security"},{t:"crt.sh - Certificate Transparency Search",u:"https://crt.sh/"}],
criteria:"پیکربندی TLS سرویس شما در testssl.sh هیچ هشدار بحرانی ندارد و می‌توانید برای هر خط پیکربندی دلیل امنیتی و هزینهٔ سازگاری‌اش را توضیح دهید.",
interview:["HSTS preload چه ریسکی دارد؟","چرا HPKP حذف شد و Pinning در اپ موبایل را چطور ایمن پیاده می‌کنید؟","Certificate Transparency چه حمله‌ای را قابل تشخیص می‌کند؟"],
mistakes:["فعال کردن includeSubDomains و preload قبل از اطمینان از HTTPS بودن همهٔ ساب‌دامین‌ها","Pin کردن یک کلید بدون Pin پشتیبان و برنامهٔ Rotation","کپی پیکربندی Cipher قدیمی از وبلاگ‌های چندسال‌پیش"],
production:"صرافی‌ها هدف اصلی فیشینگ و MITM هستند؛ HSTS، پایش CT و پیکربندی TLS بدون نقطه‌ضعف بخش ثابت چک‌لیست‌های ممیزی امنیتی و الزامات رگولاتوری‌اند.",
ai:"پیکربندی TLS فعلی یک nginx (که خودم به تو می‌دهم) را مثل یک ممیز امنیتی بررسی کن، هر ضعف را با دلیل و ریسک مشخص کن و از من بخواه اصلاحش کنم. سپس دربارهٔ تصمیم Pinning در اپ موبایل صرافی با من بحث کن."}
]},

{id:"p8",num:8,title:"HTTP از دید شبکه",icon:"🌐",summary:"HTTP/1.1، HTTP/2، HTTP/3، کش و CDN، WebSocket و gRPC — با تمرکز بر رفتار روی سیم و پراکسی.",
topics:[
{id:"http-11",title:"HTTP/1.1: پیام، هدرها، Keep-Alive و Chunked Encoding",level:"Beginner",minLadder:1,prereqs:["tp-ports-sockets"],
short:"ساختار متنی درخواست و پاسخ HTTP/1.1، هدرهای کلیدی، اتصال پایدار و انتقال بدنه با طول نامعلوم.",
deep:"HTTP/1.1 یک پروتکل متنی روی TCP است: درخواست با یک Request Line مثل GET /api/orders?limit=10 HTTP/1.1 شروع می‌شود، سپس هدرها هرکدام در یک خط با CRLF، یک خط خالی و در نهایت بدنهٔ اختیاری. هدر Host اجباری است و همان چیزی است که اجازه می‌دهد ده‌ها سایت روی یک IP میزبانی شوند (Virtual Hosting). طول بدنه یا با Content-Length مشخص می‌شود یا با Transfer-Encoding: chunked که بدنه را در تکه‌هایی با طول هگزادسیمال می‌فرستد و با تکهٔ صفر تمام می‌کند — برای Streaming پاسخ‌هایی که طولشان از قبل معلوم نیست. ابهام بین این دو هدر وقتی پراکسی و Backend تفسیر متفاوتی دارند منشأ حملهٔ HTTP Request Smuggling است. در HTTP/1.1 اتصال به‌طور پیش‌فرض پایدار (Keep-Alive) است و چند درخواست پشت سر هم روی یک TCP فرستاده می‌شوند، اما فقط یکی در هر لحظه: پاسخ دوم تا تمام شدن پاسخ اول منتظر می‌ماند (Head-of-Line Blocking در لایهٔ اپلیکیشن)؛ Pipelining عملاً هیچ‌وقت درست پیاده نشد، به همین دلیل مرورگرها حدود ۶ اتصال موازی به هر Origin باز می‌کنند. Status Codeها معنای دقیق دارند: 301/308 دائمی و 302/307 موقت (307 و 308 متد را حفظ می‌کنند)، 429 برای Rate Limit، 502 یعنی پراکسی پاسخ نامعتبر از Backend گرفت، 503 یعنی سرویس در دسترس نیست و 504 یعنی پراکسی منتظر Backend ماند و Timeout شد. فهم این تفاوت‌ها اولین قدم دیباگ هر خطا در مسیر LB → Nginx → Gunicorn است.",
objectives:["نوشتن دستی یک درخواست HTTP/1.1 کامل با nc و تفسیر پاسخ خام","توضیح Content-Length در برابر Transfer-Encoding: chunked","تفکیک دقیق 502، 503 و 504 و محل تولید هرکدام در زنجیرهٔ پراکسی"],
example:"کاربر خطای 504 می‌بیند: یعنی nginx در proxy_read_timeout (پیش‌فرض ۶۰ ثانیه) پاسخی از Gunicorn نگرفته است، نه اینکه اپلیکیشن Exception داده باشد — که معمولاً 500 یا در صورت کرش worker، 502 می‌شود.",
code:"# درخواست خام HTTP با netcat\nprintf 'GET /get HTTP/1.1\\r\\nHost: httpbin.org\\r\\nConnection: close\\r\\n\\r\\n' | nc httpbin.org 80\n\n# دیدن هدرهای درخواست و پاسخ\ncurl -sv -o /dev/null http://httpbin.org/get\n\n# پاسخ chunked\ncurl -sv --raw http://httpbin.org/stream/3 2>&1 | head -30\n\n# استفادهٔ مجدد از اتصال (Re-using existing connection)\ncurl -sv http://httpbin.org/get http://httpbin.org/ip 2>&1 | grep -iE 'connected|re-using'\n\n# پایتون: Session اتصال را نگه می‌دارد\nimport requests\ns = requests.Session()\nfor _ in range(3):\n    s.get('https://httpbin.org/get')  # فقط یک هندشیک TCP/TLS",
exercise:"با nc یک درخواست GET و یک POST با بدنهٔ JSON (با Content-Length درست) به httpbin.org بفرستید. سپس با یک سرور ساده‌ی python -m http.server و tcpdump ببینید با Connection: keep-alive چند درخواست روی یک اتصال TCP می‌روند.",
project:"", resources:[{t:"MDN - An overview of HTTP",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview"},{t:"RFC 9112 - HTTP/1.1",u:"https://www.rfc-editor.org/rfc/rfc9112"},{t:"MDN - HTTP response status codes",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Status"}],
criteria:"می‌توانید یک درخواست HTTP را بدون ابزار سطح بالا بنویسید و برای هر کد 5xx بگویید کدام لایه آن را تولید کرده است.",
interview:["تفاوت 502 و 504 چیست؟","Keep-Alive در HTTP/1.1 چه مشکلی را حل می‌کند و چه مشکلی را نه؟","HTTP Request Smuggling چطور رخ می‌دهد؟"],
mistakes:["ساختن Session جدید requests برای هر درخواست و پرداخت هزینهٔ هندشیک تکراری","استفاده از 302 برای Redirect دائمی یا انتظار حفظ متد POST در Redirect 301/302","فرض اینکه هر 5xx یعنی Exception در کد اپلیکیشن"],
production:"دیباگ اینسیدنت‌های API تقریباً همیشه با خواندن درست Status Code و هدرها در لاگ nginx شروع می‌شود؛ ابهام بین 502/504 باعث می‌شود تیم ساعت‌ها در لایهٔ اشتباه دنبال مشکل بگردد.",
ai:"از من بخواه یک درخواست و پاسخ HTTP/1.1 را از حفظ و بایت‌به‌بایت بنویسم و اشتباهاتم را بگیر. سپس چند سناریوی خطای 502، 503 و 504 در زنجیرهٔ LB → nginx → Gunicorn بده تا لایهٔ مقصر را تشخیص دهم."},
{id:"http-caching-cdn",title:"کش HTTP و CDN: Cache-Control، ETag، Vary و Edge",level:"Intermediate",minLadder:2,prereqs:["http-11"],
short:"قواعد کش HTTP در مرورگر، پراکسی و CDN؛ اعتبارسنجی مجدد با ETag، و خطرات کش کردن پاسخ‌های شخصی.",
deep:"کش HTTP با هدر Cache-Control کنترل می‌شود: max-age مدت تازگی را برای همهٔ کش‌ها تعیین می‌کند و s-maxage فقط برای کش‌های مشترک (CDN، پراکسی) آن را Override می‌کند؛ public یعنی کش مشترک مجاز است، private یعنی فقط مرورگر کاربر، no-cache یعنی ذخیره کن ولی قبل از هر استفاده اعتبارسنجی کن، و no-store یعنی اصلاً ذخیره نکن — و این‌ها اغلب با هم اشتباه گرفته می‌شوند. وقتی پاسخ کهنه شد، کلاینت با If-None-Match (حاوی ETag) یا If-Modified-Since درخواست شرطی می‌فرستد و سرور در صورت عدم تغییر 304 Not Modified بدون بدنه برمی‌گرداند که پهنای باند را صرفه‌جویی می‌کند. هدر Vary مشخص می‌کند کدام هدرهای درخواست بخشی از کلید کش هستند؛ Vary: Accept-Encoding رایج است، اما Vary: Cookie یا User-Agent نرخ Hit را نابود می‌کند. stale-while-revalidate اجازه می‌دهد کش نسخهٔ کهنه را سرو کند و در پس‌زمینه تازه‌سازی کند و stale-if-error هنگام خرابی Origin پاسخ کهنه می‌دهد. CDN این کش را در Edgeهای نزدیک کاربر توزیع می‌کند و علاوه بر کاهش latency، بار Origin را کم و جلوی بخشی از DDoS را می‌گیرد؛ Cache Key معمولاً URL + برخی هدرهاست و Purge (ابطال) یا نسخه‌گذاری در نام فایل (app.3f9a2c.js با max-age یک‌ساله و immutable) دو راه به‌روزرسانی‌اند. خطرناک‌ترین اشتباه، کش شدن پاسخ شخصی (موجودی کیف پول یک کاربر) در CDN و نمایش آن به کاربر دیگر است — حادثه‌ای که برای چند سرویس بزرگ رخ داده و دقیقاً از نبود private/no-store یا Cache Key نادرست ناشی می‌شود.",
objectives:["انتخاب درست Cache-Control برای Asset استاتیک، پاسخ عمومی API و پاسخ شخصی","توضیح اعتبارسنجی مجدد با ETag و 304","طراحی Cache Key و Purge در CDN و جلوگیری از نشت دادهٔ شخصی"],
example:"endpoint عمومی /api/markets (لیست بازارها) با Cache-Control: public, s-maxage=5, stale-while-revalidate=30 در CDN کش می‌شود و بار Origin در ساعت اوج چند ده برابر کم می‌شود، اما /api/wallet/balance حتماً Cache-Control: private, no-store دارد.",
code:"# دیدن هدرهای کش و وضعیت CDN\ncurl -sI https://www.cloudflare.com/ | grep -iE 'cache-control|age|etag|cf-cache-status|vary'\n\n# درخواست شرطی با ETag\netag=$(curl -sI https://example.com/ | awk -F': ' 'tolower($1)==\"etag\"{print $2}' | tr -d '\\r')\ncurl -sI -H \"If-None-Match: $etag\" https://example.com/ | head -1   # انتظار: 304\n\n# nginx: کش بلندمدت برای فایل‌های نسخه‌دار\n# location ~* \\.[0-9a-f]{8}\\.(js|css)$ {\n#     add_header Cache-Control 'public, max-age=31536000, immutable';\n# }\n# location /api/wallet/ {\n#     add_header Cache-Control 'private, no-store';\n# }\n\n# Django\nfrom django.views.decorators.cache import cache_control\n@cache_control(public=True, s_maxage=5, stale_while_revalidate=30)\ndef markets(request): ...",
exercise:"برای ۵ endpoint یک API فرضی صرافی (لیست بازار، Order Book، تاریخچهٔ معاملات عمومی، موجودی کاربر، فایل JS فرانت) هدر Cache-Control مناسب را بنویسید و دلیل هرکدام را توضیح دهید؛ سپس با curl و هدر Age/cf-cache-status رفتار کش یک سایت پشت CDN را بررسی کنید.",
project:"", resources:[{t:"MDN - HTTP caching",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching"},{t:"RFC 9111 - HTTP Caching",u:"https://www.rfc-editor.org/rfc/rfc9111"},{t:"Cloudflare Learning - What is a CDN?",u:"https://www.cloudflare.com/learning/cdn/what-is-a-cdn/"}],
criteria:"برای هر نوع پاسخ می‌توانید بدون جستجو Cache-Control درست بنویسید و توضیح دهید چه چیزی در کلید کش CDN قرار دارد.",
interview:["تفاوت no-cache و no-store چیست؟","چطور مطمئن می‌شوید پاسخ‌های شخصی کاربران در CDN کش نمی‌شوند؟","چرا فایل‌های استاتیک را با hash در نام و max-age یک‌ساله سرو می‌کنیم؟"],
mistakes:["تصور اینکه no-cache یعنی کش نکن","کش شدن پاسخ‌های شامل Set-Cookie یا دادهٔ شخصی در CDN","استفاده از Vary روی هدرهای پرتنوع و صفر شدن نرخ Hit"],
production:"در اسپایک‌های بازار (مثلاً جهش قیمت بیت‌کوین) ترافیک endpointهای عمومی ده‌ها برابر می‌شود؛ کش درست در Edge تفاوت بین سرویس پایدار و Origin از کار افتاده است.",
ai:"چند پاسخ HTTP با هدرهای کش مختلف به من نشان بده و از من بپرس مرورگر و CDN با هرکدام چه می‌کنند. سپس یک سناریوی نشت دادهٔ شخصی از طریق CDN طرح کن و بخواه علت و رفع آن را پیدا کنم."},
{id:"http-2-3",title:"HTTP/2 و HTTP/3: Multiplexing، HPACK/QPACK و Head-of-Line Blocking",level:"Advanced",minLadder:3,prereqs:["http-11","tp-udp-quic","tls-handshake"],
short:"چرا HTTP/2 درخواست‌ها را روی یک اتصال Multiplex می‌کند، چه مشکلی باقی ماند، و چطور HTTP/3 با QUIC آن را حل کرد.",
deep:"HTTP/2 معنای HTTP را حفظ کرد اما قالب را باینری کرد: هر درخواست/پاسخ یک Stream با شناسه است و به Frameهایی (HEADERS، DATA، SETTINGS، WINDOW_UPDATE، RST_STREAM، GOAWAY) شکسته می‌شود که روی یک اتصال TCP درهم‌آمیخته (Multiplexed) ارسال می‌شوند؛ پس دیگر نیازی به ۶ اتصال موازی نیست و Head-of-Line Blocking لایهٔ اپلیکیشن از بین می‌رود. HPACK هدرها را با یک جدول ایستا و پویا فشرده می‌کند که برای APIها با هدرهای تکراری (Authorization، Cookie) صرفه‌جویی زیادی دارد. HTTP/2 در عمل همیشه روی TLS است و با ALPN (h2) مذاکره می‌شود؛ h2c (بدون TLS) عمدتاً بین سرویس‌ها و در gRPC دیده می‌شود. اما مشکل در لایهٔ پایین‌تر ماند: چون همهٔ Streamها روی یک TCP هستند، گم شدن یک بسته کل اتصال را تا Retransmission متوقف می‌کند (TCP HOL Blocking) و روی شبکه‌های موبایل با Packet Loss بالا HTTP/2 حتی می‌تواند از چند اتصال HTTP/1.1 بدتر باشد. HTTP/3 روی QUIC (روی UDP) اجرا می‌شود که Streamها را در لایهٔ انتقال مستقل می‌کند، TLS 1.3 را داخل خود دارد (هندشیک ۱ RTT و 0-RTT) و با Connection ID اجازهٔ مهاجرت اتصال بین Wi-Fi و 4G را بدون قطع می‌دهد؛ QPACK جایگزین HPACK شده چون ترتیب تحویل تضمین‌شده نیست. کشف HTTP/3 با هدر Alt-Svc در پاسخ HTTP/2 انجام می‌شود. برای مهندس بک‌اند نکات عملی مهم‌اند: Load Balancer لایه ۴ ممکن است ترافیک را نامتوازن کند چون یک کلاینت HTTP/2 همه‌چیز را روی یک اتصال می‌فرستد، فایروال‌هایی که UDP/443 را می‌بندند HTTP/3 را بی‌صدا به HTTP/2 برمی‌گردانند، و حملاتی مثل HTTP/2 Rapid Reset (CVE-2023-44487) از ارزانی ساخت و لغو Stream سوءاستفاده کردند.",
objectives:["توضیح Stream و Frame در HTTP/2 و تفاوت HOL Blocking لایهٔ HTTP و TCP","توضیح مزایای QUIC برای HTTP/3: Stream مستقل، 0-RTT و Connection Migration","تشخیص نسخهٔ HTTP مذاکره‌شده و فهم اثر HTTP/2 روی Load Balancing"],
example:"بعد از فعال شدن HTTP/2 بین Ingress و سرویس gRPC، یک Pod تمام بار را می‌گیرد و بقیه بیکارند: kube-proxy (لایه ۴) فقط اتصال را توزیع می‌کند و کلاینت همهٔ درخواست‌ها را روی همان یک اتصال HTTP/2 Multiplex کرده است؛ راه‌حل Load Balancing لایه ۷ است.",
code:"# نسخهٔ مذاکره‌شده\ncurl -sI --http2 https://www.cloudflare.com/ -o /dev/null -w '%{http_version}\\n'\ncurl -sI --http3 https://www.cloudflare.com/ -o /dev/null -w '%{http_version}\\n'   # نیازمند curl با پشتیبانی HTTP/3\n\n# اعلام HTTP/3 توسط سرور\ncurl -sI https://www.cloudflare.com/ | grep -i alt-svc\n\n# دیدن Frameهای HTTP/2\nnghttp -nv https://nghttp2.org/ | head -40\n\n# nginx\n# listen 443 ssl;\n# http2 on;\n# listen 443 quic reuseport;\n# add_header Alt-Svc 'h3=\":443\"; ma=86400';\n\n# پایتون با httpx\nimport httpx\nwith httpx.Client(http2=True) as c:\n    print(c.get('https://www.cloudflare.com/').http_version)",
exercise:"یک صفحه با ۵۰ تصویر کوچک را یک بار با HTTP/1.1 و یک بار با HTTP/2 بارگذاری کنید و Waterfall تب Network مرورگر را مقایسه کنید؛ سپس با tc netem روی لینوکس ۲٪ Packet Loss اضافه کنید و دوباره مقایسه کنید.",
project:"", resources:[{t:"High Performance Browser Networking - HTTP/2",u:"https://hpbn.co/http2/"},{t:"HTTP/3 explained (Daniel Stenberg)",u:"https://http3-explained.haxx.se/"},{t:"RFC 9113 - HTTP/2",u:"https://www.rfc-editor.org/rfc/rfc9113"},{t:"RFC 9114 - HTTP/3",u:"https://www.rfc-editor.org/rfc/rfc9114"}],
criteria:"می‌توانید توضیح دهید چرا HTTP/2 روی شبکهٔ پرتلفات کند می‌شود، HTTP/3 چه چیزی را عوض می‌کند، و چرا gRPC پشت LB لایه ۴ نامتوازن می‌شود.",
interview:["HTTP/2 کدام نوع Head-of-Line Blocking را حل کرد و کدام را نه؟","چرا HTTP/3 روی UDP ساخته شده است؟","چرا HTTP/2 بارِ پشت Load Balancer لایه ۴ را نامتوازن می‌کند؟"],
mistakes:["فرض اینکه HTTP/2 همیشه سریع‌تر است","استفاده از LB لایه ۴ برای gRPC/HTTP/2 طولانی‌مدت","مسدود بودن UDP/443 در فایروال و تعجب از کار نکردن HTTP/3"],
production:"اپ موبایل صرافی روی شبکه‌های ناپایدار موبایل بیشترین سود را از HTTP/3 و Connection Migration می‌برد؛ در سمت سرور، gRPC بین میکروسرویس‌ها بدون فهم Multiplexing به توزیع بار نامتوازن می‌رسد.",
ai:"تفاوت HTTP/1.1، HTTP/2 و HTTP/3 را با رسم تایم‌لاین بسته‌ها روی یک شبکهٔ پرتلفات برایم توضیح بده و از من بخواه پیش‌بینی کنم کدام سریع‌تر است. سپس یک مسئلهٔ توزیع بار نامتوازن gRPC پشت Kubernetes بده تا علت و راه‌حل را بگویم."},
{id:"http-websocket-grpc",title:"WebSocket، SSE و gRPC از دید شبکه و پراکسی",level:"Intermediate",minLadder:3,prereqs:["http-11"],
short:"اتصال‌های بلندمدت و دوطرفه چگونه ساخته می‌شوند و چرا پراکسی‌ها، Timeoutها و Load Balancerها اغلب آن‌ها را خراب می‌کنند.",
