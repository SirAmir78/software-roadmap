production:"بسیاری از باگ‌های 'داده‌ای که الان ذخیره کردم نمایش داده نمی‌شود' ریشه در خواندن از Replica با Lag دارند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. Streaming Replication، Logical Replication و Table Partitioning در PostgreSQL را توضیح بده. یک سناریوی 'داده تازه ذخیره‌شده در صفحهٔ بعدی دیده نمی‌شود' طراحی کن که علتش Replication Lag باشد و راه‌حل‌های ممکن را با من بررسی کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p19",num:19,title:"NoSQL",icon:"📦",summary:"مدل‌های داده‌ای متفاوت: Document (MongoDB)، Key-Value (Redis)، Wide-Column (Cassandra)، Search (Elasticsearch).",
topics:[
{id:"nosql-categories",title:"دسته‌بندی NoSQL و مدل CAP در انتخاب دیتابیس",level:"Intermediate",minLadder:3,prereqs:["db-normalization"],
short:"چرا دیتابیس‌های NoSQL متفاوت وجود دارند و هرکدام چه مصالحه‌ای (Trade-off) دارند.",
deep:"NoSQL یک تکنولوژی واحد نیست بلکه چند دستهٔ معماری متفاوت با مدل داده و تضمین‌های سازگاری متفاوت است: Key-Value (Redis, DynamoDB) ساده‌ترین مدل، دسترسی O(1) با کلید، مناسب کش و Session؛ Document (MongoDB) داده‌های نیمه‌ساخت‌یافته JSON-مانند با Schema انعطاف‌پذیر، مناسب داده‌ای که ساختارش زیاد تغییر می‌کند یا تودرتوست؛ Wide-Column (Cassandra) برای حجم بسیار بالای نوشتن با مدل داده‌ای بر پایهٔ Partition Key + Clustering Key، طراحی‌شده برای دسترس‌پذیری بالا در چند دیتاسنتر با سازگاری نهایی (Eventual Consistency)؛ Graph (Neo4j) برای داده‌ای که روابط پیچیده و پیمایش گراف اهمیت بیشتری از خود داده دارد (مثل شبکهٔ اجتماعی، تشخیص تقلب)؛ Search (Elasticsearch) برای جستجوی متنی و تحلیلی. تصمیم بین این‌ها باید بر اساس Access Pattern واقعی گرفته شود نه محبوبیت: اگر کوئری‌های شما عمدتاً Join پیچیده و تراکنش‌های ACID نیاز دارند، PostgreSQL هنوز بهترین انتخاب است؛ NoSQL زمانی توجیه دارد که مدل داده یا الگوی مقیاس‌پذیری واقعاً با نقاط قوت آن همسو باشد.",
objectives:["دسته‌بندی صحیح یک نیاز پروژه به یکی از انواع NoSQL","توضیح چرا انتخاب دیتابیس باید بر اساس Access Pattern باشد نه ترند"],
example:"یک سیستم لاگ رویداد با حجم میلیاردها رکورد در روز و نیاز به دسترس‌پذیری بالا در چند منطقه، کاندیدای طبیعی Cassandra است، نه PostgreSQL تک‌سرور.",
py:"", exercise:"برای سه سناریوی مختلف (کش نشست کاربر، فید محصولات یک فروشگاه، لاگ رویداد میلیاردی) دیتابیس مناسب را انتخاب و توجیه کنید.",
project:"", resources:[{t:"MongoDB - When to use MongoDB",u:"https://www.mongodb.com/resources/basics/databases/nosql-explained"},{t:"Martin Kleppmann - Designing Data-Intensive Applications (فصل‌های نمونهٔ رایگان ناشر)",u:"https://dataintensive.net/"}],
criteria:"می‌توانید برای سه سناریوی متفاوت، دیتابیس مناسب را با استدلال مبتنی بر Access Pattern انتخاب کنید نه صرفاً محبوبیت.",
interview:["چه زمانی MongoDB بهتر از PostgreSQL است و چه زمانی برعکس؟","Cassandra برای چه Workloadی طراحی شده؟"],
mistakes:["انتخاب NoSQL صرفاً به‌دلیل مقیاس‌ظاهری یا ترند بدون تحلیل واقعی Access Pattern"],
production:"بسیاری از پروژه‌هایی که 'برای مقیاس‌پذیری' به MongoDB مهاجرت کرده‌اند، بعداً به‌دلیل نیاز واقعی به تراکنش و Join، دوباره به PostgreSQL بازگشته‌اند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. دسته‌بندی دیتابیس‌های NoSQL (Key-Value, Document, Wide-Column, Graph, Search) و مدل CAP را توضیح بده. سه سناریوی واقعی به من بده تا برای هرکدام دیتابیس مناسب را با استدلال انتخاب کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"redis-data-structures",title:"Redis: ساختارهای داده، Persistence و کاربردهای توزیع‌شده",level:"Advanced",minLadder:3,prereqs:["nosql-categories","ds-hash-table"],
short:"Redis فراتر از یک کش ساده: ساختارهای داده در حافظه برای صف، شمارنده، قفل توزیع‌شده و Pub/Sub.",
deep:"Redis یک سرور Key-Value تک‌نخی (برای عملیات) در حافظه است که ساختارهای داده‌ای غنی (String، List، Set، Sorted Set، Hash، Stream) را با عملیات اتمیک ارائه می‌دهد؛ تک‌نخی بودن یعنی هر دستور به‌طور کامل و بدون Race Condition اجرا می‌شود، که آن را برای Rate Limiting، شمارنده‌های اتمیک و قفل توزیع‌شده (با دستور SET key value NX EX ttl) مناسب می‌کند. برای Persistence دو مکانیزم دارد: RDB (اسنپ‌شات دوره‌ای کامل حافظه، سریع برای بازیابی اما ممکن است چند ثانیه/دقیقهٔ آخر را از دست بدهد) و AOF (لاگ هر دستور نوشتنی، Durability بالاتر اما فایل بزرگ‌تر و بازیابی کندتر) - ترکیب هر دو رایج است. برای Cluster (مقیاس افقی)، Redis از Hash Slot (۱۶۳۸۴ اسلات ثابت که بین Nodeها تقسیم می‌شود) استفاده می‌کند تا کلیدها را توزیع کند؛ برای Sorted Set، ساختار داخلی Skip List است که عملیات Range با ترتیب امتیاز را در O(log n) ممکن می‌کند - پایهٔ پیاده‌سازی Leaderboard واقعی.",
objectives:["پیاده‌سازی قفل توزیع‌شده ساده با SET NX EX","توضیح تفاوت RDB و AOF از نظر Durability و سرعت بازیابی"],
example:"ZADD leaderboard 1500 'user:42' برای ثبت امتیاز؛ ZREVRANGE leaderboard 0 9 WITHSCORES برای ۱۰ نفر برتر.",
py:"import redis\nr = redis.Redis()\n\n# قفل توزیع‌شدهٔ ساده\nlock_acquired = r.set('lock:order:42', 'worker-1', nx=True, ex=10)\nif lock_acquired:\n    try:\n        pass  # کار حساس\n    finally:\n        r.delete('lock:order:42')",
exercise:"با Sorted Set در Redis یک Leaderboard بازی بسازید که امتیاز کاربران را ذخیره و ۱۰ نفر برتر را در O(log n) برگرداند.",
project:"سیستم Rate Limiter توزیع‌شده با Redis (الگوریتم Sliding Window Counter) برای محدود کردن درخواست هر کاربر.",
resources:[{t:"Redis docs - Data types",u:"https://redis.io/docs/latest/develop/data-types/"},{t:"Redis docs - Persistence",u:"https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"},{t:"Redis docs - Distributed locks (Redlock)",u:"https://redis.io/docs/latest/develop/use/patterns/distributed-locks/"}],
criteria:"می‌توانید یک Rate Limiter توزیع‌شده و یک Leaderboard با Sorted Set در Redis پیاده‌سازی کنید.",
interview:["چرا Redis تک‌نخی است و این چه مزیت/عیبی دارد؟","تفاوت RDB و AOF چیست؟","Redlock چیست و چرا بحث‌برانگیز است؟"],
mistakes:["استفاده از قفل ساده SET NX بدون در نظر گرفتن سناریوی از دست دادن قفل قبل از اتمام کار (نیاز به فرآیندهایی مثل Fencing Token)"],
production:"Redis معمولاً هم به‌عنوان کش (cache-aside)، هم Session Store، هم صف پیام سبک (با List یا Stream) و هم Rate Limiter در یک استک Django استفاده می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ساختارهای داده Redis (String, List, Set, Sorted Set, Hash) و کاربردهای عملی آن‌ها (Rate Limiting، Leaderboard، قفل توزیع‌شده) را با مثال پایتون آموزش بده و یک چالش (Rate Limiter توزیع‌شده) بده تا پیاده‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p20",num:20,title:"مقیاس‌پذیری دیتابیس",icon:"📈",summary:"Replication، Sharding، Consistent Hashing و الگوهای تراکنش توزیع‌شده.",
topics:[
{id:"sharding-consistent-hashing",title:"Sharding و Consistent Hashing",level:"Expert",minLadder:5,prereqs:["pg-replication-partitioning","ds-hash-table"],
short:"چگونه داده را بین چندین سرور دیتابیس مستقل تقسیم کنیم بدون از دست دادن مقیاس‌پذیری هنگام افزودن/حذف سرور.",
deep:"Sharding یعنی داده بر اساس یک Shard Key (مثلاً user_id) بین چند سرور دیتابیس مستقل تقسیم می‌شود؛ برخلاف Replication که هر Node کل داده را دارد، هر Shard فقط زیرمجموعه‌ای از داده را نگه می‌دارد که امکان مقیاس‌پذیری افقی هم برای نوشتن و هم خواندن را می‌دهد. روش ساده Hash Mod N (hash(key) % N) وقتی N (تعداد سرور) تغییر کند، تقریباً تمام کلیدها باید جابه‌جا شوند که هزینهٔ عظیم Rebalancing ایجاد می‌کند. Consistent Hashing این مشکل را حل می‌کند: سرورها و کلیدها روی یک حلقهٔ هش (مثلاً ۰ تا ۲³²) قرار می‌گیرند و هر کلید به نزدیک‌ترین سرور در جهت عقربه‌های ساعت متعلق می‌شود؛ اضافه یا حذف یک سرور فقط کلیدهای مجاور آن سرور را تحت تأثیر قرار می‌دهد نه کل داده. مشکل رایج Consistent Hashing ساده، Hot Partition است (وقتی توزیع کلیدها یکنواخت نیست یا یک کلید بسیار پرترافیک است مثل یک سلبریتی در شبکهٔ اجتماعی)؛ راه‌حل رایج، Virtual Nodes (هر سرور فیزیکی چند نقطهٔ مجازی روی حلقه دارد) است که توزیع را یکنواخت‌تر می‌کند.",
objectives:["توضیح چرا Hash Mod N برای Rebalancing نامناسب است","توضیح نقش Virtual Nodes در حل Hot Partition"],
example:"Cassandra و DynamoDB هر دو از Consistent Hashing با Virtual Nodes برای توزیع داده بین Nodeها استفاده می‌کنند.",
py:"import hashlib\n\ndef hash_key(key):\n    return int(hashlib.md5(key.encode()).hexdigest(), 16)\n\nclass ConsistentHashRing:\n    def __init__(self, nodes, vnodes=100):\n        self.ring = {}\n        for node in nodes:\n            for i in range(vnodes):\n                self.ring[hash_key(f'{node}-{i}')] = node\n        self.sorted_keys = sorted(self.ring.keys())\n    def get_node(self, key):\n        h = hash_key(key)\n        for k in self.sorted_keys:\n            if h <= k:\n                return self.ring[k]\n        return self.ring[self.sorted_keys[0]]",
exercise:"کد بالا را با ۵ Node اجرا کنید، توزیع ۱۰۰۰۰ کلید تصادفی را بررسی کنید، سپس یک Node اضافه کنید و ببینید چه درصدی از کلیدها جابه‌جا می‌شوند (باید بسیار کمتر از حالت Hash Mod N باشد).",
project:"پیاده‌سازی یک سیستم Sharding ساده برای یک Key-Value Store روی چند 'سرور' شبیه‌سازی‌شده (دیکشنری‌های پایتون جدا) با Consistent Hashing.",
resources:[{t:"Consistent Hashing (مقالهٔ اصلی Karger et al., خلاصهٔ MIT)",u:"https://www.akamai.com/site/en/documents/research-paper/consistent-hashing-and-random-trees-distributed-caching-protocols-for-relieving-hot-spots-on-the-world-wide-web-technical-publication.pdf"},{t:"Amazon DynamoDB paper (رایگان)",u:"https://www.allthingsdistributed.com/files/amazon-dynamo-sotware-update.pdf"}],
criteria:"می‌توانید Consistent Hashing با Virtual Node را از صفر در پایتون پیاده‌سازی کنید و توضیح دهید چرا Rebalancing آن ارزان‌تر از Hash Mod N است.",
interview:["چرا Hash Mod N برای Sharding مناسب نیست؟","Consistent Hashing چگونه Rebalancing را ارزان می‌کند؟","Hot Partition چیست و چگونه رفع می‌شود؟"],
mistakes:["انتخاب Shard Key نامناسب (مثل created_at) که باعث تمرکز نوشتن روی یک Shard در هر لحظه می‌شود"],
production:"انتخاب نادرست Shard Key یکی از پرهزینه‌ترین اشتباهات معماری است چون تغییر آن بعداً نیازمند Migration کامل داده است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. Sharding و Consistent Hashing (با Virtual Nodes) را عمیق توضیح بده، سپس از من بخواه یک نسخهٔ ساده از Consistent Hashing را در پایتون پیاده‌سازی کنم و تفاوت Rebalancing آن با Hash Mod N را با آزمایش واقعی نشان دهم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p21",num:21,title:"کشینگ",icon:"⚡",summary:"استراتژی‌های کش، مشکلات کلاسیک (Stampede، Penetration، Avalanche) و راه‌حل‌ها.",
topics:[
{id:"cache-strategies",title:"استراتژی‌های کش و مشکلات کلاسیک آن",level:"Advanced",minLadder:3,prereqs:["redis-data-structures"],
short:"Cache-Aside، Write-Through، Write-Back و مشکلات رایج مثل Cache Stampede.",
deep:"در الگوی Cache-Aside (رایج‌ترین در Django+Redis)، اپلیکیشن ابتدا کش را چک می‌کند؛ اگر نبود (Cache Miss) از دیتابیس می‌خواند و نتیجه را در کش می‌گذارد. Write-Through هر نوشتن را هم‌زمان به کش و دیتابیس می‌نویسد (سازگاری بالاتر، تأخیر نوشتن بیشتر). Write-Back نوشتن را فقط در کش انجام می‌دهد و بعداً به‌صورت Async به دیتابیس منتقل می‌کند (سریع اما ریسک از دست دادن داده در صورت خرابی کش). سه مشکل کلاسیک: Cache Stampede (وقتی یک کلید پرترافیک منقضی می‌شود، هزاران درخواست هم‌زمان به دیتابیس هجوم می‌برند تا دوباره آن را محاسبه کنند - راه‌حل: قفل (Lock) یا Probabilistic Early Expiration)؛ Cache Penetration (درخواست‌های مکرر برای کلیدی که اصلاً در دیتابیس وجود ندارد، هر بار از کش رد شده و به دیتابیس می‌رود - راه‌حل: کش کردن نتیجهٔ 'وجود ندارد' هم، یا Bloom Filter)؛ Cache Avalanche (تعداد زیادی کلید هم‌زمان منقضی می‌شوند - مثلاً همه با یک TTL ثابت تنظیم شده‌اند - و ناگهان همه هم‌زمان به دیتابیس فشار می‌آورند - راه‌حل: افزودن Jitter تصادفی به TTL هر کلید).",
objectives:["پیاده‌سازی راه‌حل Cache Stampede با قفل","افزودن Jitter به TTL برای جلوگیری از Cache Avalanche"],
example:"cache.set(key, value, timeout=3600 + random.randint(-300, 300)) به‌جای timeout=3600 ثابت برای همهٔ کلیدها.",
py:"import random\nfrom django.core.cache import cache\n\ndef get_product(product_id):\n    key = f'product:{product_id}'\n    data = cache.get(key)\n    if data is None:\n        lock_key = f'lock:{key}'\n        if cache.add(lock_key, 1, timeout=5):  # فقط یک درخواست قفل را می‌گیرد\n            data = fetch_from_db(product_id)\n            cache.set(key, data, timeout=3600 + random.randint(-300, 300))\n            cache.delete(lock_key)\n        else:\n            data = fetch_from_db(product_id)  # یا کمی صبر و retry\n    return data",
exercise:"یک تابع کش‌شده با Redis بسازید که Cache Stampede را با یک قفل ساده (cache.add) مدیریت کند و آن را با ۱۰۰ درخواست هم‌زمان (با threading) تست کنید.",
project:"لایهٔ کش کامل برای یک API لیست محصولات با مدیریت Stampede، Penetration و Avalanche.",
resources:[{t:"AWS - Caching best practices",u:"https://aws.amazon.com/caching/best-practices/"},{t:"Django docs - Cache framework",u:"https://docs.djangoproject.com/en/stable/topics/cache/"}],
criteria:"می‌توانید یک لایهٔ کش Cache-Aside بسازید که هر سه مشکل Stampede/Penetration/Avalanche را مدیریت کند.",
interview:["Cache Stampede چیست و چگونه رفع می‌شود؟","تفاوت Write-Through و Write-Back چیست؟"],
mistakes:["تنظیم TTL ثابت یکسان برای هزاران کلید که باعث Cache Avalanche می‌شود"],
production:"Cache Stampede یکی از رایج‌ترین دلایل 'فشار ناگهانی به دیتابیس دقیقاً هر ساعت' در سیستم‌های تولید است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. استراتژی‌های کش (Cache-Aside، Write-Through، Write-Back) و سه مشکل کلاسیک (Stampede، Penetration، Avalanche) را با مثال Redis+Django توضیح بده و یک سناریوی Stampede واقعی بده تا با قفل و Jitter رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p22",num:22,title:"پردازش ناهمگام",icon:"⏱️",summary:"صف تسک، Celery، Retry با Backoff و الگوهای تحویل پیام.",
topics:[
{id:"celery-retries-idempotency",title:"Celery: صف تسک، Retry با Exponential Backoff و Idempotency",level:"Advanced",minLadder:3,prereqs:["api-idempotency","redis-data-structures"],
short:"چگونه کارهای پس‌زمینه را قابل‌اعتماد اجرا کنیم، حتی وقتی Workerها یا شبکه شکست می‌خورند.",
deep:"Celery یک صف تسک توزیع‌شده است: اپلیکیشن Django تسک را در یک Broker (معمولاً Redis یا RabbitMQ) قرار می‌دهد، Workerهای مستقل تسک را از صف برمی‌دارند و اجرا می‌کنند، و نتیجه (اختیاری) در یک Result Backend ذخیره می‌شود. این معماری اجازه می‌دهد کارهای سنگین یا کند (ارسال ایمیل، پردازش تصویر، گزارش‌گیری) از چرخهٔ درخواست-پاسخ HTTP جدا شوند تا کاربر منتظر نماند. اما همروندی توزیع‌شده مشکلات خودش را دارد: اگر Worker وسط اجرای تسک کرش کند، ممکن است تسک از دست برود (at-most-once) یا دوباره اجرا شود (at-least-once) بسته به تنظیم acks_late؛ exactly-once تضمین واقعی تقریباً هیچ‌وقت رایگان نیست، به همین دلیل تسک‌ها باید Idempotent طراحی شوند (مثلاً با بررسی یک flag 'قبلاً پردازش شده' قبل از اجرای منطق). برای شکست‌های موقتی (مثل API خارجی موقتاً در دسترس نیست)، Retry با Exponential Backoff (تأخیر فزایندهٔ نمایی بین تلاش‌ها، مثلاً ۱، ۲، ۴، ۸ ثانیه) از هجوم فوری و بی‌فایده به سرویس ناموفق جلوگیری می‌کند؛ اگر تسک بارها شکست بخورد، باید به یک Dead-Letter Queue منتقل شود تا بعداً بررسی دستی شود نه اینکه بی‌نهایت Retry شود.",
objectives:["پیاده‌سازی Retry با Exponential Backoff در Celery","طراحی تسک Idempotent برای جلوگیری از پردازش دوبار"],
example:"@app.task(bind=True, max_retries=5)\ndef send_email(self, user_id):\n    try:\n        ...\n    except TemporaryError as exc:\n        raise self.retry(exc=exc, countdown=2 ** self.request.retries)",
py:"from celery import shared_task\nfrom django.core.cache import cache\n\n@shared_task(bind=True, max_retries=5, acks_late=True)\ndef process_order(self, order_id):\n    lock_key = f'processing:{order_id}'\n    if not cache.add(lock_key, 1, timeout=300):\n        return  # قبلاً در حال پردازش یا انجام شده - جلوگیری از تکرار\n    try:\n        # منطق واقعی پردازش سفارش (idempotent)\n        pass\n    except ExternalAPIError as exc:\n        raise self.retry(exc=exc, countdown=2 ** self.request.retries)\n    finally:\n        cache.delete(lock_key)",
exercise:"یک تسک Celery بسازید که به یک API خارجی ناپایدار (شبیه‌سازی‌شده با شکست تصادفی) وصل می‌شود، با Exponential Backoff دوباره تلاش می‌کند و بعد از ۵ شکست به یک 'صف بررسی دستی' (مثلاً یک جدول جداگانه) منتقل می‌شود.",
project:"سیستم پردازش سفارش ناهمگام کامل: ثبت سفارش → صف Celery → پردازش پرداخت → اعلان → مدیریت شکست با Retry و Dead-Letter.",
resources:[{t:"Celery docs - Retrying tasks",u:"https://docs.celeryq.dev/en/stable/userguide/tasks.html#retrying"},{t:"Celery docs - Task best practices",u:"https://docs.celeryq.dev/en/stable/userguide/tasks.html"}],
criteria:"می‌توانید یک تسک Celery Idempotent با Retry و Exponential Backoff و انتقال به Dead-Letter بعد از شکست‌های مکرر بسازید.",
interview:["تفاوت at-least-once و exactly-once delivery چیست؟","چرا Exponential Backoff بهتر از Retry فوری است؟","چگونه یک تسک Celery را Idempotent می‌کنید؟"],
mistakes:["فرض کردن Celery به‌طور خودکار exactly-once است در حالی که به‌طور پیش‌فرض چیزی شبیه at-least-once (با acks_late) یا at-most-once (بدون آن) ارائه می‌دهد"],
production:"ارسال ایمیل یا اعلان دوبار به کاربر، یا کسر دوبارهٔ موجودی، معمولاً ریشه در تسک‌های Celery غیر-Idempotent دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری Celery (Broker, Worker, Result Backend)، الگوهای تحویل پیام (at-least-once/at-most-once/exactly-once) و طراحی تسک Idempotent را عمیق توضیح بده. یک سناریوی 'ایمیل دوبار ارسال می‌شود' طراحی کن که با Idempotency Lock رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p23",num:23,title:"صف پیام و بروکرها",icon:"📬",summary:"RabbitMQ (Exchange/Queue) و Kafka (Partition/Offset/Consumer Group) — مقایسه و کاربرد.",
topics:[
{id:"rabbitmq-exchanges",title:"RabbitMQ: Exchange، Queue، Routing و Acknowledgement",level:"Advanced",minLadder:3,prereqs:["celery-retries-idempotency"],
short:"مدل انتشار/اشتراک AMQP و چگونگی تضمین تحویل پیام.",
deep:"در RabbitMQ، Producer پیام را مستقیم به Queue نمی‌فرستد؛ به یک Exchange می‌فرستد که بر اساس نوع (Direct، Topic، Fanout، Headers) و Binding، پیام را به یک یا چند Queue مسیریابی می‌کند - این جداسازی Producer از Queue واقعی، انعطاف بالایی می‌دهد (مثلاً افزودن یک Consumer جدید بدون تغییر Producer). Consumer پیام را از Queue می‌خواند و باید صریحاً Acknowledge (ack) کند؛ اگر Consumer قبل از ack کرش کند، RabbitMQ پیام را دوباره در صف قرار می‌دهد (Redelivery) - این یعنی مدل پیش‌فرض at-least-once است و Consumer باید Idempotent باشد. Prefetch Count تعداد پیام‌هایی که به یک Consumer بدون ack داده می‌شود را محدود می‌کند تا یک Consumer کند، صف را برای بقیه بلاک نکند. Dead Letter Exchange پیام‌هایی که بارها rejected شده‌اند یا منقضی شده‌اند (TTL) را به یک Exchange جداگانه هدایت می‌کند تا از حلقهٔ بی‌نهایت Redelivery جلوگیری شود. Publisher Confirms تضمین می‌کند Producer مطمئن شود پیام واقعاً توسط Broker پذیرفته شده (نه فقط ارسال شده) - این برای پیام‌های حیاتی (مثل سفارش) لازم است.",
objectives:["توضیح تفاوت Direct، Topic و Fanout Exchange","پیکربندی Dead Letter Exchange برای پیام‌های ناموفق"],
example:"یک Topic Exchange با Binding Key 'order.created.*' می‌تواند رویدادهای مختلف سفارش را به Queueهای متفاوت هدایت کند.",
py:"import pika\nconnection = pika.BlockingConnection(pika.ConnectionParameters('localhost'))\nchannel = connection.channel()\nchannel.exchange_declare(exchange='orders', exchange_type='topic')\nchannel.queue_declare(queue='order_emails')\nchannel.queue_bind(exchange='orders', queue='order_emails', routing_key='order.created.*')\nchannel.basic_publish(exchange='orders', routing_key='order.created.premium', body='...')",
exercise:"یک Producer و دو Consumer با RabbitMQ بسازید که یکی رویداد 'order.created' و دیگری 'order.cancelled' را با Topic Exchange دریافت کنند؛ سپس Dead Letter Exchange برای پیام‌های rejected اضافه کنید.",
project:"", resources:[{t:"RabbitMQ docs - Tutorials",u:"https://www.rabbitmq.com/tutorials"},{t:"RabbitMQ docs - Dead Letter Exchanges",u:"https://www.rabbitmq.com/docs/dlx"}],
criteria:"می‌توانید یک سیستم Producer/Consumer با RabbitMQ بسازید که شامل Topic Routing، Manual Ack و Dead Letter Exchange باشد.",
interview:["تفاوت Direct، Topic و Fanout Exchange چیست؟","چرا Consumer باید Idempotent باشد در مدل at-least-once RabbitMQ؟"],
mistakes:["استفاده از auto-ack که باعث از دست رفتن پیام در صورت کرش Consumer وسط پردازش می‌شود"],
production:"صف‌هایی که بی‌نهایت رشد می‌کنند معمولاً به‌دلیل Consumer کندتر از Producer یا نبود Dead Letter برای پیام‌های مشکل‌دار (Poison Message) هستند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدل AMQP در RabbitMQ (Exchange, Queue, Binding, Ack) را با مثال یک سیستم سفارش توضیح بده. یک سناریوی صف رو به رشد بی‌نهایت طراحی کن که با Prefetch Count و Dead Letter Exchange رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"kafka-partitions-consumer-groups",title:"Kafka: Partition، Offset و Consumer Group",level:"Expert",minLadder:5,prereqs:["rabbitmq-exchanges"],
short:"معماری لاگ توزیع‌شدهٔ Kafka که آن را برای Event Streaming با حجم بسیار بالا مناسب می‌کند.",
deep:"برخلاف RabbitMQ که پیام بعد از مصرف معمولاً از صف حذف می‌شود، Kafka یک لاگ دنباله‌ای تغییرناپذیر (Append-only Log) نگه می‌دارد که پیام‌ها برای مدت Retention مشخص (نه لزوماً تا زمان مصرف) باقی می‌مانند - این یعنی چند Consumer Group مستقل می‌توانند همان داده را با سرعت‌های متفاوت و حتی بارها بخوانند (Replay). هر Topic به چند Partition تقسیم می‌شود که هرکدام یک لاگ مستقل و مرتب‌شده است؛ ترتیب فقط درون یک Partition تضمین می‌شود نه بین کل Topic - به همین دلیل انتخاب Partition Key (مثلاً user_id) مهم است تا رویدادهای مرتبط با یک موجودیت به یک Partition بروند و ترتیبشان حفظ شود. Consumer Group مکانیزمی است که چند Consumer با هم یک Topic را مصرف می‌کنند و هر Partition دقیقاً به یک Consumer در گروه تخصیص می‌یابد (Load Balancing)؛ اگر یک Consumer کرش کند، Rebalancing رخ می‌دهد و Partitionهایش به بقیه واگذار می‌شود. Offset موقعیت خواندن هر Consumer Group در هر Partition را نگه می‌دارد و می‌تواند دستی Commit شود (کنترل دقیق‌تر روی at-least-once/at-most-once) یا خودکار. Replication با فاکتوری مثل ۳ و مفهوم ISR (In-Sync Replicas) تضمین می‌کند از دست رفتن یک Broker باعث از دست رفتن داده نشود.",
objectives:["توضیح چرا ترتیب فقط درون یک Partition تضمین می‌شود","توضیح نقش Consumer Group در مقیاس‌پذیری مصرف"],
example:"یک Topic 'user-events' با ۱۲ Partition و یک Consumer Group با ۴ Consumer یعنی هر Consumer میانگین ۳ Partition را مصرف می‌کند.",
py:"from kafka import KafkaProducer, KafkaConsumer\nproducer = KafkaProducer(bootstrap_servers='localhost:9092')\nproducer.send('user-events', key=b'user-42', value=b'{\"event\":\"login\"}')\n\nconsumer = KafkaConsumer('user-events', group_id='analytics-service', bootstrap_servers='localhost:9092', enable_auto_commit=False)\nfor msg in consumer:\n    process(msg)\n    consumer.commit()",
exercise:"یک Topic با ۳ Partition بسازید، پیام‌هایی با کلیدهای مختلف تولید کنید، و با دو Consumer در یک گروه، توزیع Partitionها را مشاهده کنید؛ سپس یکی از Consumerها را متوقف کنید و Rebalancing را ببینید.",
project:"پایپ‌لاین رویداد ساده: تولیدکنندهٔ رویداد سفارش → Kafka → دو Consumer Group مستقل (یکی برای آنالیتیکس، یکی برای اعلان) که مستقل از هم همان داده را می‌خوانند.",
resources:[{t:"Apache Kafka - Documentation",u:"https://kafka.apache.org/documentation/"},{t:"Confluent - Kafka fundamentals (رایگان)",u:"https://developer.confluent.io/courses/apache-kafka/events/"}],
criteria:"می‌توانید توضیح دهید چرا Kafka برای Event Streaming با Replay مناسب‌تر از RabbitMQ است و کِی برعکس RabbitMQ انتخاب بهتری است.",
interview:["تفاوت Kafka و RabbitMQ چیست و هرکدام برای چه Use Caseای مناسب‌ترند؟","چرا انتخاب Partition Key اهمیت دارد؟","Consumer Group Rebalancing چگونه کار می‌کند؟"],
mistakes:["انتخاب Partition Key تصادفی (مثل UUID) که رویدادهای یک کاربر را بین چند Partition پخش می‌کند و ترتیب را از بین می‌برد"],
production:"Kafka پایهٔ بسیاری از سیستم‌های Event-Driven بزرگ (LinkedIn، Netflix، Uber) برای Log Aggregation، Stream Processing و CDC است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری Kafka (Topic، Partition، Offset، Consumer Group، Replication/ISR) را با مقایسهٔ مستقیم با RabbitMQ توضیح بده. یک سناریوی انتخاب Partition Key نادرست بده که ترتیب رویدادها را خراب می‌کند و از من بخواه رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p24",num:24,title:"همروندی توزیع‌شده",icon:"🕰️",summary:"ساعت منطقی، اجماع (Consensus) و قفل توزیع‌شده.",
topics:[
{id:"logical-clocks-consensus",title:"ساعت منطقی (Lamport/Vector Clock) و مقدمهٔ Consensus (Raft)",level:"Expert",minLadder:5,prereqs:["kafka-partitions-consumer-groups"],
short:"در سیستم توزیع‌شده بدون ساعت مشترک، چگونه ترتیب رویدادها را تشخیص دهیم و روی یک مقدار توافق کنیم.",
deep:"در یک سیستم توزیع‌شده، ساعت‌های فیزیکی ماشین‌های مختلف هرگز کاملاً همگام نیستند (حتی با NTP)، پس نمی‌توان صرفاً بر اساس timestamp فیزیکی ترتیب رویدادها را در دو Node مختلف تشخیص داد. Lamport Clock یک شمارندهٔ منطقی ساده است که با هر رویداد محلی افزایش می‌یابد و با هر پیام دریافتی، به max(local, received)+1 به‌روزرسانی می‌شود - این ترتیب Causal (علّی) رویدادها را حفظ می‌کند (اگر A باعث B شده، Lamport(A) < Lamport(B)) اما نمی‌تواند رویدادهای همروند (Concurrent) بدون رابطهٔ علّی را تشخیص دهد. Vector Clock این را حل می‌کند: هر Node یک بردار از شمارنده‌ها (یکی برای هر Node) نگه می‌دارد که اجازه می‌دهد دقیقاً تشخیص داده شود دو رویداد علّی مرتبط‌اند یا همروند (Concurrent) - پایهٔ تشخیص Conflict در سیستم‌هایی مثل Riak و Dynamo. برای رسیدن به توافق واقعی روی یک مقدار در حضور خرابی Node (مثل انتخاب Leader)، الگوریتم‌های Consensus مثل Raft لازم‌اند: Raft با یک Leader انتخابی، تمام نوشتن‌ها را از طریق او هماهنگ می‌کند و با Log Replication به اکثریت Nodeها (Quorum) اطمینان می‌دهد که حتی اگر تعدادی Node از کار بیفتند، سیستم سازگار و در دسترس باقی بماند - این دقیقاً همان چیزی است که etcd (پایهٔ Kubernetes) و Consul از آن استفاده می‌کنند.",
objectives:["توضیح تفاوت Lamport Clock و Vector Clock","توضیح نقش Quorum در Raft برای تحمل خرابی"],
example:"etcd (که Kubernetes API Server برای ذخیرهٔ وضعیت خوشه از آن استفاده می‌کند) از Raft برای اجماع بین Nodeهای خودش استفاده می‌کند.",
py:"class VectorClock:\n    def __init__(self, node_id, nodes):\n        self.node_id = node_id\n        self.clock = {n: 0 for n in nodes}\n    def tick(self):\n        self.clock[self.node_id] += 1\n    def merge(self, other_clock):\n        for n, v in other_clock.items():\n            self.clock[n] = max(self.clock[n], v)\n        self.tick()",
exercise:"با کلاس بالا، دو Node شبیه‌سازی کنید که پیام رد و بدل می‌کنند و نشان دهید چطور Vector Clock تشخیص می‌دهد دو رویداد Concurrent هستند یا یکی باعث دیگری شده.",
project:"", resources:[{t:"Raft - The Raft Consensus Algorithm (رایگان، تصویری)",u:"https://raft.github.io/"},{t:"MIT 6.824 Distributed Systems (رایگان، YouTube)",u:"https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB"}],
criteria:"می‌توانید توضیح دهید چرا ساعت فیزیکی برای ترتیب‌دهی رویدادهای توزیع‌شده کافی نیست و Raft چگونه با Quorum در برابر خرابی Node مقاوم می‌ماند.",
interview:["چرا در سیستم توزیع‌شده نمی‌توان به ساعت فیزیکی برای ترتیب رویدادها اعتماد کرد؟","Raft چگونه Leader انتخاب می‌کند و چرا Quorum لازم است؟"],
mistakes:["اعتماد به timestamp فیزیکی برای حل Conflict در سیستم توزیع‌شده به‌جای Vector Clock یا مکانیزم‌های علّی"],
production:"etcd (زیرساخت Kubernetes)، Consul و بسیاری سیستم‌های هماهنگ‌کننده از Raft برای اجماع استفاده می‌کنند؛ فهم آن به دیباگ مشکلات خوشهٔ Kubernetes کمک می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ساعت منطقی (Lamport و Vector Clock) و مقدمهٔ Consensus با Raft را عمیق توضیح بده، با مثال پایتون Vector Clock پیاده‌سازی کنیم و در پایان توضیح بده چرا Kubernetes به etcd و Raft وابسته است. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"dist-2pc-paxos-crdt",title:"Two-Phase Commit، Paxos و CRDT: راه‌های دیگر توافق و ادغام بدون هماهنگی",level:"Expert",minLadder:null,prereqs:["logical-clocks-consensus"],
short:"سه راه متفاوت برای هماهنگ کردن Nodeهای توزیع‌شده: توافق قطعی با قفل (2PC)، اجماع مقاوم به خرابی (Paxos) و ادغام بدون هماهنگی اصلاً (CRDT).",
deep:"Two-Phase Commit (2PC) قدیمی‌ترین راه‌حل تراکنش توزیع‌شده است: یک Coordinator در فاز Prepare از همهٔ Participantها می‌پرسد 'آماده‌ای Commit کنی؟' و فقط اگر همه بله بگویند وارد فاز Commit واقعی می‌شود؛ مشکل بزرگ آن Blocking Problem است - اگر Coordinator درست بعد از فاز Prepare (وقتی همه منابع قفل‌اند) از کار بیفتد، Participantها تا ابد منتظر می‌مانند چون نمی‌دانند تصمیم نهایی Commit بوده یا Abort، و همین‌جاست که 2PC در سیستم‌های بزرگ مقیاس کنار گذاشته شده. Paxos همان مسئلهٔ Consensus را که Raft حل می‌کند حل می‌کند (توافق روی یک مقدار در حضور خرابی Node) اما بدون فرض یک Leader ثابت: Proposerها مقداری پیشنهاد می‌دهند، Acceptorها با شمارهٔ نسخهٔ بالاتر قبول می‌کنند و Learnerها نتیجهٔ نهایی را یاد می‌گیرند - این مدل به‌شدت انعطاف‌پذیر اما به‌قدری سخت برای استدلال درست است که اغلب تیم‌ها Raft (که همان قدرت را با یک Leader صریح و درک‌پذیرتر می‌دهد) را ترجیح می‌دهند؛ Paxos هنوز زیربنای سیستم‌هایی مثل Google Chubby و Spanner است. CRDT (Conflict-free Replicated Data Type) رویکرد کاملاً متفاوتی دارد: به‌جای هماهنگی قبل از نوشتن، هر Replica مستقل می‌نویسد و ساختار داده طوری طراحی شده که ادغام (Merge) دو نسخهٔ متفاوت همیشه به یک نتیجهٔ سازگار می‌رسد بدون نیاز به قفل یا Coordinator - مثلاً G-Counter (شمارندهٔ فقط-افزایشی که هر Node بخش خودش را نگه می‌دارد و ادغام یعنی جمع کردن) یا OR-Set (مجموعه‌ای که افزودن/حذف عناصر را بدون Conflict حتی در حضور شبکهٔ Partition‌شده مدیریت می‌کند). این سه رویکرد امروز در دنیای واقعی این‌طور تقسیم شده‌اند: 2PC در تراکنش‌های XA پایگاه‌داده‌های سنتی، Paxos/Raft در دیتابیس‌های توزیع‌شده و ابزارهای هماهنگ‌کننده (etcd، Spanner، ZooKeeper)، و CRDT در ابزارهای ویرایش هم‌زمان (مثل Figma یا Google Docs) و دیتابیس‌های Multi-Master مثل Riak.",
objectives:["توضیح Blocking Problem در 2PC و چرا در مقیاس بزرگ کنار گذاشته می‌شود","توضیح تفاوت فلسفی CRDT با Paxos/Raft: ادغام بدون هماهنگی در برابر توافق پیش از عمل"],
example:"در یک ابزار ویرایش هم‌زمان سند مثل Google Docs، وقتی دو کاربر آفلاین همزمان تایپ می‌کنند، به‌جای قفل یا رأی‌گیری، از ساختار داده‌ای شبیه CRDT استفاده می‌شود تا هر دو نسخه بدون Conflict با هم ادغام شوند.",
py:"class GCounter:\n    def __init__(self, node_id, nodes):\n        self.node_id = node_id\n        self.counts = {n: 0 for n in nodes}\n    def increment(self):\n        self.counts[self.node_id] += 1\n    def merge(self, other):\n        for n, v in other.counts.items():\n            self.counts[n] = max(self.counts[n], v)\n    def value(self):\n        return sum(self.counts.values())",
exercise:"با کلاس GCounter بالا، دو Node مستقل بسازید که هرکدام چند بار increment می‌شوند، سپس merge کنید و نشان دهید نتیجه صرف‌نظر از ترتیب merge همیشه یکسان است (خاصیت Commutative).",
project:"", resources:[{t:"MIT 6.824 - Paxos lecture (رایگان)",u:"https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB"},{t:"CRDT.tech - overview",u:"https://crdt.tech/"},{t:"Martin Kleppmann - CRDTs explained",u:"https://martin.kleppmann.com/2020/07/06/crdt-hard-parts-hydra.html"}],
criteria:"می‌توانید توضیح دهید چرا 2PC در مقیاس بزرگ Blocking است، Paxos چه مشکلی را مثل Raft حل می‌کند و چرا CRDT اصلاً نیازی به Coordinator ندارد.",
interview:["مشکل اصلی Two-Phase Commit در حضور خرابی Coordinator چیست؟","CRDT چگونه بدون هیچ هماهنگی، سازگاری نهایی را تضمین می‌کند؟"],
mistakes:["استفاده از 2PC بین چند میکروسرویس مستقل به‌جای Saga، که باعث قفل شدن منابع برای مدت طولانی و کاهش Availability می‌شود"],
production:"دیتابیس‌های توزیع‌شدهٔ مدرن (Spanner با Paxos، CockroachDB با Raft) و ابزارهای همکاری بلادرنگ (با CRDT) دقیقاً بر پایهٔ همین سه الگو ساخته شده‌اند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. Two-Phase Commit، Paxos و CRDT را در مقایسه با Raft که قبلاً یاد گرفته‌ام توضیح بده، با تمرکز بر اینکه هرکدام چه مشکلی را حل می‌کنند و در کدام سیستم‌های واقعی امروزی استفاده می‌شوند. کمکم کن کلاس GCounter را پیاده‌سازی و merge کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p25",num:25,title:"سیستم‌های توزیع‌شده",icon:"🌍",summary:"CAP/PACELC، سازگاری، الگوهای تحمل خطا (Circuit Breaker، Saga، Outbox).",
topics:[
{id:"cap-theorem",title:"قضیهٔ CAP و PACELC",level:"Advanced",minLadder:4,prereqs:["logical-clocks-consensus"],
short:"چرا نمی‌توان هم‌زمان سازگاری کامل، دسترس‌پذیری کامل و تحمل پارتیشن شبکه را داشت.",
deep:"قضیهٔ CAP می‌گوید در حضور یک Network Partition (که در سیستم‌های توزیع‌شدهٔ واقعی اجتناب‌ناپذیر است)، سیستم باید بین Consistency (همهٔ Nodeها همان داده را می‌بینند) و Availability (سیستم به هر درخواست پاسخ می‌دهد حتی اگر بعضی Node در دسترس نباشند) یکی را انتخاب کند - نمی‌توان هر سه (شامل Partition Tolerance که عملاً اجباری است) را کامل داشت. این یک انتخاب دوتایی سادهٔ همیشگی نیست؛ PACELC آن را تکمیل می‌کند: حتی وقتی Partition نداریم (Else)، باید بین Latency و Consistency مصالحه کنیم (سیستمی که سازگاری قوی می‌خواهد باید منتظر تأیید چند Node بماند که تأخیر می‌آورد). PostgreSQL تک‌سرور اساساً CA است (تا وقتی پارتیشن رخ ندهد سازگار و در دسترس است، اما با پارتیشن غیرقابل‌دسترس می‌شود)؛ Cassandra با تنظیمات پیش‌فرض AP است (همیشه پاسخ می‌دهد، حتی اگر گاهی داده کمی قدیمی باشد)؛ سیستم‌هایی مثل etcd/ZooKeeper با Consensus، CP هستند (وقتی اکثریت در دسترس نباشند، نوشتن را رد می‌کنند به‌جای پاسخ ناسازگار). درک این مصالحه به انتخاب معماری درست بر اساس نیاز واقعی کسب‌وکار کمک می‌کند: برای موجودی انبار یک فروشگاه بزرگ، AP قابل قبول است (کمی ناسازگاری موقت مهم نیست)؛ برای موجودی حساب بانکی، CP ترجیح داده می‌شود.",
objectives:["طبقه‌بندی یک سیستم آشنا به‌عنوان CP یا AP","توضیح مصالحهٔ Latency-Consistency در نبود Partition (بخش PACELC)"],
example:"DynamoDB به‌طور پیش‌فرض AP است (Eventual Consistency)؛ اما گزینهٔ Strongly Consistent Read هم دارد که Latency بیشتری می‌دهد - نمونهٔ واقعی PACELC.",
py:"", exercise:"برای سه سیستم (سبد خرید فروشگاه، موجودی حساب بانکی، شمارندهٔ لایک پست) تصمیم بگیرید کدام باید CP و کدام AP باشد و توجیه کنید.",
project:"", resources:[{t:"Julia Evans - CAP theorem",u:"https://jvns.ca/"},{t:"Martin Kleppmann - talk on CAP theorem (رایگان، YouTube)",u:"https://www.youtube.com/results?search_query=martin+kleppmann+cap+theorem"}],
criteria:"می‌توانید برای یک سیستم واقعی جدید، تصمیم CP یا AP را با استدلال کسب‌وکاری (نه صرفاً فنی) بگیرید.",
interview:["قضیهٔ CAP را توضیح دهید. آیا واقعاً باید همیشه بین C و A انتخاب کرد؟","PACELC چه چیزی را به CAP اضافه می‌کند؟"],
mistakes:["تفسیر غلط CAP به این معنا که 'همیشه باید بین Consistency و Availability انتخاب کنیم' حتی وقتی پارتیشنی نیست"],
production:"انتخاب دیتابیس و معماری Replication یک سیستم مستقیماً بازتاب تصمیم آگاهانه یا ناآگاهانهٔ تیم دربارهٔ CAP/PACELC است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. قضیهٔ CAP و PACELC را با مثال‌های واقعی (DynamoDB، PostgreSQL، etcd) توضیح بده، سپس سه سناریوی کسب‌وکاری بده تا برای هرکدام تصمیم CP/AP را با استدلال بگیرم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"resilience-patterns",title:"الگوهای تحمل خطا: Circuit Breaker، Retry، Bulkhead، Saga",level:"Expert",minLadder:5,prereqs:["cap-theorem"],
short:"چگونه یک سرویس را در برابر شکست سرویس‌های وابسته مقاوم کنیم و از Cascading Failure جلوگیری کنیم.",
deep:"Circuit Breaker از الگوی فیوز برق الهام گرفته: وقتی درخواست‌ها به یک سرویس وابسته پیوسته شکست می‌خورند، Circuit Breaker به حالت Open می‌رود و بلافاصله (بدون تلاش واقعی) خطا برمی‌گرداند تا از هدر رفتن منابع (Thread، Connection) روی درخواستی که احتمالاً باز هم شکست می‌خورد جلوگیری شود؛ بعد از یک بازهٔ زمانی، به حالت Half-Open می‌رود و چند درخواست آزمایشی می‌فرستد تا ببیند سرویس بازیابی شده یا نه. Bulkhead (الهام از دیوارهای ضدآب کشتی) منابع (مثل Connection Pool) هر سرویس وابسته را ایزوله می‌کند تا کندی یک وابستگی، تمام منابع مشترک را اشغال نکند و بقیهٔ سیستم را هم فلج نکند - این دقیقاً همان چیزی است که از Cascading Failure (شکست یک سرویس که مثل دومینو کل سیستم را می‌خواباند) جلوگیری می‌کند. برای تراکنش‌هایی که چند سرویس مستقل را درگیر می‌کنند (که تراکنش ACID سنتی نمی‌تواند پوشش دهد)، الگوی Saga از یک دنبالهٔ تراکنش‌های محلی با اقدامات جبرانی (Compensating Action) برای هر مرحله استفاده می‌کند: اگر مرحلهٔ N شکست بخورد، اقدامات جبرانی مراحل N-1 تا ۱ به‌ترتیب معکوس اجرا می‌شوند تا سیستم را به حالت سازگار برگردانند - مثلاً اگر رزرو پرواز موفق ولی رزرو هتل ناموفق بود، باید پرواز لغو (Compensate) شود.",
objectives:["پیاده‌سازی یک Circuit Breaker ساده","طراحی Saga با اقدامات جبرانی برای یک تراکنش چندسرویسی"],
example:"در معماری میکروسرویس فروشگاه، Saga سفارش شامل: رزرو موجودی → کسر پول → ارسال به انبار؛ اگر کسر پول شکست بخورد، رزرو موجودی باید Compensate (آزاد) شود.",
py:"import time\n\nclass CircuitBreaker:\n    def __init__(self, failure_threshold=5, reset_timeout=30):\n        self.failure_count = 0\n        self.failure_threshold = failure_threshold\n        self.reset_timeout = reset_timeout\n        self.state = 'closed'\n        self.opened_at = None\n    def call(self, func, *args, **kwargs):\n        if self.state == 'open':\n            if time.time() - self.opened_at > self.reset_timeout:\n                self.state = 'half-open'\n            else:\n                raise Exception('Circuit is open')\n        try:\n            result = func(*args, **kwargs)\n            self.failure_count = 0\n            self.state = 'closed'\n            return result\n        except Exception:\n            self.failure_count += 1\n            if self.failure_count >= self.failure_threshold:\n                self.state = 'open'\n                self.opened_at = time.time()\n            raise",
exercise:"کلاس CircuitBreaker بالا را با یک تابع شبیه‌سازی‌شده که گاهی شکست می‌خورد تست کنید و رفتار سه حالت (Closed/Open/Half-Open) را مشاهده کنید.",
project:"سیستم سفارش با Saga Pattern شامل سه سرویس شبیه‌سازی‌شده (موجودی، پرداخت، ارسال) با اقدامات جبرانی کامل برای هر مرحله.",
resources:[{t:"Microsoft - Circuit Breaker pattern",u:"https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker"},{t:"microservices.io - Saga pattern",u:"https://microservices.io/patterns/data/saga.html"}],
criteria:"می‌توانید یک Circuit Breaker و یک Saga با اقدامات جبرانی برای یک سناریوی چندسرویسی واقعی پیاده‌سازی کنید.",
interview:["Circuit Breaker چه مشکلی را حل می‌کند و سه حالت آن کدام‌اند؟","Saga Pattern چگونه جایگزین تراکنش توزیع‌شدهٔ 2PC می‌شود؟","Cascading Failure چیست و Bulkhead چگونه از آن جلوگیری می‌کند؟"],
mistakes:["پیاده‌سازی Retry بدون Circuit Breaker که باعث می‌شود سرویس ناموفق زیر بار Retryهای مکرر بیشتر فلج شود"],
production:"Cascading Failure (وقتی یک سرویس کند کل زنجیرهٔ وابسته را می‌خواباند) یکی از خطرناک‌ترین دسته اینسیدنت‌ها در معماری میکروسرویس است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. الگوهای تحمل خطا (Circuit Breaker، Retry، Bulkhead، Saga) را با مثال یک سیستم سفارش میکروسرویسی توضیح بده. یک سناریوی Cascading Failure طراحی کن که با Circuit Breaker و Bulkhead آن را رفع کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p26",num:26,title:"اصول مهندسی نرم‌افزار",icon:"📐",summary:"SOLID، DRY، KISS، YAGNI و اصول طراحی ماژولار.",
topics:[
{id:"solid-principles",title:"اصول SOLID با مثال پایتون/Django",level:"Intermediate",minLadder:2,prereqs:["py-oop-typing"],
short:"پنج اصل طراحی شیءگرا که کد را قابل نگهداری، تست‌پذیر و توسعه‌پذیر می‌کنند.",
deep:"Single Responsibility: هر کلاس باید فقط یک دلیل برای تغییر داشته باشد (مثلاً منطق محاسبهٔ قیمت نباید در همان کلاسی باشد که مسئول ارسال ایمیل است). Open/Closed: کد باید برای توسعه باز و برای تغییر بسته باشد (مثلاً افزودن یک روش پرداخت جدید نباید نیازمند تغییر کد پردازش پرداخت موجود باشد، بلکه با افزودن یک کلاس جدید که یک Interface/Protocol را پیاده می‌کند). Liskov Substitution: زیرکلاس باید بتواند جای کلاس پایه را بگیرد بدون شکستن رفتار مورد انتظار (مثلاً اگر یک متد انتظار دارد Notifier.send() استثنا نیندازد، هیچ زیرکلاسی نباید این قرارداد را نقض کند). Interface Segregation: کلاینت‌ها نباید مجبور به وابستگی به متدهایی شوند که استفاده نمی‌کنند (Interfaceهای کوچک و متمرکز بهتر از یک Interface غول‌پیکرند). Dependency Inversion: ماژول‌های سطح بالا نباید به ماژول‌های سطح پایین وابسته باشند، هردو باید به انتزاع (Abstraction) وابسته باشند - این دقیقاً همان چیزی است که Dependency Injection را ممکن می‌کند و تست‌پذیری را با Mock کردن وابستگی‌ها بالا می‌برد. این اصول ابزار جزم‌گرایانه نیستند؛ اعمال بیش از حد آن‌ها در یک پروژهٔ کوچک می‌تواند Over-engineering ایجاد کند.",
objectives:["بازنویسی کد نقض‌کنندهٔ SRP به کلاس‌های متمرکز","پیاده‌سازی Dependency Inversion با Protocol در پایتون"],
example:"کلاسی که هم منطق کسب‌وکار سفارش، هم ارسال ایمیل و هم لاگ کردن را دارد، SRP را نقض می‌کند و باید به سه کلاس/تابع مجزا تقسیم شود.",
py:"from typing import Protocol\n\nclass PaymentGateway(Protocol):\n    def charge(self, amount: int) -> bool: ...\n\nclass OrderService:\n    def __init__(self, gateway: PaymentGateway):\n        self.gateway = gateway  # وابستگی به انتزاع، نه پیاده‌سازی خاص\n    def checkout(self, amount: int) -> bool:\n        return self.gateway.charge(amount)\n\n# در تست، به‌سادگی یک FakeGateway جایگزین می‌شود",
exercise:"یک کلاس 'God Object' که همه‌کاره است (پردازش سفارش + ایمیل + لاگ + پرداخت) را طبق SRP به چهار کلاس مجزا تقسیم کنید.",
project:"", resources:[{t:"Real Python - SOLID Principles",u:"https://realpython.com/solid-principles-python/"}],
criteria:"می‌توانید یک کلاس نقض‌کنندهٔ چند اصل SOLID را بازنویسی کنید و برای هر تغییر توضیح دهید کدام اصل را رعایت می‌کند.",
interview:["اصل Dependency Inversion چیست و چگونه تست‌پذیری را بهبود می‌دهد؟","یک مثال از نقض Open/Closed Principle و راه‌حل آن بزنید."],
mistakes:["اعمال جزم‌گرایانهٔ SOLID در یک اسکریپت کوچک که باعث پیچیدگی غیرضروری (Over-engineering) می‌شود"],
production:"کد پایه‌ای که SRP و Dependency Inversion را رعایت می‌کند، تست واحد و تغییر آن در آینده بسیار ساده‌تر است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. اصول SOLID را با مثال‌های واقعی پایتون/Django (نه مثال‌های انتزاعی کتاب) توضیح بده. یک کلاس 'God Object' بساز که چند اصل SOLID را نقض کند و از من بخواه آن را بازنویسی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"dry-kiss-yagni",title:"DRY، KISS، YAGNI و مصالحهٔ آن‌ها با SOLID",level:"Intermediate",minLadder:2,prereqs:["solid-principles"],
short:"سه اصل ساده که اغلب اشتباه فهمیده و بیش از حد اعمال می‌شوند، و چرا گاهی تکرار کد از انتزاع اشتباه بهتر است.",
deep:"DRY (Don't Repeat Yourself) می‌گوید هر دانش باید یک نمایش واحد و بدون ابهام در سیستم داشته باشد؛ اما تفسیر رایج و اشتباه آن این است که 'هر دو تکه کد شبیه به هم باید فوراً به یک تابع/کلاس مشترک تبدیل شوند' - این تفسیر نادیده می‌گیرد که گاهی دو تکه کد امروز شبیه‌اند اما به دلایل کسب‌وکاری متفاوت تغییر می‌کنند (مثلاً اعتبارسنجی فرم ثبت‌نام و فرم تماس ممکن است امروز یکسان باشند اما فردا الزامات‌شان از هم جدا شود)؛ یکی‌کردن زودهنگام آن‌ها یک 'انتزاع اشتباه' (Wrong Abstraction) می‌سازد که بعداً جدا کردنش گران‌تر از تکرار اولیهٔ کد بوده است - قاعدهٔ عملی: 'تکرار کد ارزان‌تر از انتزاع اشتباه است'. KISS (Keep It Simple, Stupid) می‌گوید ساده‌ترین راه‌حلی که مسئلهٔ واقعی را حل می‌کند بهتر از راه‌حل هوشمندانه‌تر و پیچیده‌تر است، چون پیچیدگی هزینهٔ نگهداری بلندمدت دارد که اغلب دست‌کم گرفته می‌شود. YAGNI (You Aren't Gonna Need It) هشدار می‌دهد در برابر ساختن انعطاف‌پذیری یا Configuration برای نیازمندی‌های فرضی آینده‌ای که شاید هرگز اتفاق نیفتند - هر لایهٔ انتزاع اضافه، هزینهٔ شناختی (Cognitive Load) واقعی امروز دارد در ازای فایدهٔ احتمالی فردا. نکتهٔ کلیدی برای مهندس باتجربه: SOLID خودش هم می‌تواند KISS/YAGNI را نقض کند اگر جزم‌گرایانه اعمال شود - مثلاً ساختن یک Interface و Dependency Injection کامل برای کلاسی که هرگز پیاده‌سازی دومی نخواهد داشت، صرفاً پیچیدگی بدون فایده اضافه می‌کند؛ تصمیم درست همیشه به مقیاس واقعی تغییر و عدم قطعیت آیندهٔ آن کد بستگی دارد، نه اعمال کورکورانهٔ یک اصل.",
objectives:["تشخیص یک 'انتزاع اشتباه' که باید دوباره به کد تکراری تجزیه شود","توجیه یک تصمیم YAGNI: نساختن یک قابلیت انعطاف‌پذیر که فعلاً نیاز واقعی ندارد"],
example:"تیمی یک Interface عمومی برای 'هر نوع دیتابیسی که ممکن است در آینده استفاده شود' می‌سازد در حالی که پروژه هرگز چیزی جز PostgreSQL استفاده نخواهد کرد - این نقض YAGNI است.",
py:"", exercise:"دو تابع اعتبارسنجی مشابه (مثلاً برای فرم ثبت‌نام و فرم تماس) پیدا کنید یا بسازید؛ تحلیل کنید آیا یکی‌کردن آن‌ها الان به‌صرفه است یا باید طبق قاعدهٔ 'تکرار ارزان‌تر از انتزاع اشتباه' جدا بمانند.",
project:"", resources:[{t:"Sandi Metz - The Wrong Abstraction",u:"https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction"},{t:"Martin Fowler - Yagni",u:"https://martinfowler.com/bliki/Yagni.html"}],
criteria:"می‌توانید توضیح دهید چرا 'تکرار کد ارزان‌تر از انتزاع اشتباه است' و یک مثال واقعی از نقض YAGNI در کدهایی که دیده‌اید بیاورید.",
interview:["چرا DRY گاهی باعث ساخت انتزاع اشتباه می‌شود؟ چطور جلوی آن را می‌گیرید؟","YAGNI را با یک مثال واقعی توضیح دهید."],
mistakes:["یکی‌کردن زودهنگام دو تکهٔ کد شبیه به هم که به دلایل کسب‌وکاری متفاوت در آینده تغییر می‌کنند","ساختن پیکربندی/انتزاع برای نیازمندی فرضی‌ای که هرگز رخ نمی‌دهد"],
production:"در Code Review، رد یک Pull Request به بهانهٔ 'DRY نیست' بدون توجه به این‌که آیا دو تکه کد واقعاً یک دانش مشترک نمایش می‌دهند یا نه، یکی از رایج‌ترین اشتباهات ریویوی کد است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. DRY، KISS و YAGNI را با تمرکز بر مصالحهٔ آن‌ها با SOLID و خطر انتزاع اشتباه توضیح بده. دو تکه کد شبیه به هم به من بده و از من بخواه تصمیم بگیرم آیا باید یکی شوند یا جدا بمانند و توجیه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p27",num:27,title:"الگوهای طراحی",icon:"🧱",summary:"Creational، Structural و Behavioral Patterns با کاربرد واقعی پایتونی.",
topics:[
{id:"design-patterns-practical",title:"الگوهای طراحی رایج در بک‌اند: Factory، Strategy، Observer، Decorator",level:"Intermediate",minLadder:2,prereqs:["solid-principles"],
short:"الگوهای طراحی کلاسیک که در کد Django/پایتون روزمره ظاهر می‌شوند، اغلب بدون نام‌گذاری صریح.",
deep:"Factory Pattern ساخت اشیاء را از کد کلاینت جدا می‌کند (مثلاً یک تابع get_payment_gateway(name) که بر اساس نام، کلاس مناسب را برمی‌گرداند) و برای مواقعی که منطق ساخت شیء پیچیده یا وابسته به شرایط اجرا (Config) است مفید است. Strategy Pattern الگوریتم‌های قابل‌تعویض را در کلاس‌های جداگانه کپسوله می‌کند (مثلاً استراتژی‌های مختلف محاسبهٔ تخفیف که همگی یک Interface مشترک دارند) و مستقیماً Open/Closed Principle را پیاده می‌کند. Observer Pattern (که Django Signals نمونهٔ واقعی آن است) اجازه می‌دهد چند شنونده بدون وابستگی مستقیم به منبع رویداد، از یک تغییر مطلع شوند - اما استفادهٔ بیش از حد آن، جریان کنترل implicit و دیباگ سخت ایجاد می‌کند. Decorator Pattern (که دقیقاً همان چیزی است که دکوریتورهای پایتون مثل @login_required پیاده می‌کنند) رفتار یک شیء/تابع را بدون تغییر کد اصلی آن گسترش می‌دهد. نکتهٔ کلیدی برای مهندس ارشد: الگوهای طراحی ابزارند نه هدف؛ استفاده از یک الگو باید یک مشکل واقعی (تکرار کد، وابستگی سفت، سختی توسعه) را حل کند، نه صرفاً 'شبیه یک کتاب طراحی به نظر برسد'.",
objectives:["پیاده‌سازی Strategy Pattern برای چند روش محاسبهٔ تخفیف","تشخیص اینکه Django Signal یک پیاده‌سازی واقعی از Observer Pattern است"],
example:"class PercentageDiscount:\n    def apply(self, price): return price * 0.9\nclass FixedDiscount:\n    def apply(self, price): return price - 10\n# هر دو یک Interface مشترک دارند و در OrderService قابل تعویض‌اند",
py:"from typing import Protocol\n\nclass DiscountStrategy(Protocol):\n    def apply(self, price: float) -> float: ...\n\nclass PercentageDiscount:\n    def __init__(self, percent: float):\n        self.percent = percent\n    def apply(self, price: float) -> float:\n        return price * (1 - self.percent)\n\nclass OrderPricer:\n    def __init__(self, strategy: DiscountStrategy):\n        self.strategy = strategy\n    def final_price(self, price: float) -> float:\n        return self.strategy.apply(price)",
exercise:"سه استراتژی تخفیف (درصدی، ثابت، خرید دوم رایگان) پیاده‌سازی کنید که همگی یک Protocol مشترک دارند و در زمان اجرا قابل تعویض باشند بدون تغییر OrderPricer.",
project:"", resources:[{t:"Refactoring Guru - Design Patterns",u:"https://refactoring.guru/design-patterns/python"},{t:"Django docs - Signals",u:"https://docs.djangoproject.com/en/stable/topics/signals/"}],
criteria:"می‌توانید سه الگوی طراحی (Factory، Strategy، Decorator) را با مثال واقعی پایتونی (نه مثال کتابی انتزاعی) پیاده‌سازی و توجیه کنید چرا از آن استفاده کردید.",
interview:["Strategy Pattern چه مشکلی را حل می‌کند و چگونه با Open/Closed Principle مرتبط است؟","چرا استفادهٔ بیش از حد Django Signals می‌تواند دیباگ را سخت کند؟"],
mistakes:["استفاده از یک الگوی طراحی پیچیده برای مشکلی که با یک تابع ساده قابل حل بود (Over-engineering)"],
production:"استفادهٔ افراطی از Signal در Django یکی از رایج‌ترین دلایل 'چرا این کد اینجا اجرا شد' در دیباگ پروژه‌های بزرگ است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. الگوهای طراحی رایج (Factory، Strategy، Observer، Decorator) را با مثال‌های واقعی پایتون/Django توضیح بده، و بگو کِی استفاده از این الگوها Over-engineering محسوب می‌شود. یک سناریوی محاسبهٔ تخفیف بده تا با Strategy Pattern پیاده‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"design-patterns-creational-structural",title:"Singleton، Adapter، Builder و Command: الگوهای Creational/Structural باقی‌مانده",level:"Intermediate",minLadder:2,prereqs:["design-patterns-practical"],
short:"چهار الگوی دیگر که کنار Factory/Strategy/Observer/Decorator، دستهٔ Creational و Structural را کامل می‌کنند - و یکی از آن‌ها بیشتر وقت‌ها Anti-pattern است.",
deep:"Singleton تضمین می‌کند یک کلاس فقط یک نمونه دارد و دسترسی سراسری به آن می‌دهد؛ در پایتون/Django این الگو اغلب یک Anti-pattern محسوب می‌شود چون حالت مشترک سراسری (Global Mutable State) تست‌پذیری را نابود می‌کند (تست‌ها روی هم اثر می‌گذارند) و وابستگی پنهان می‌سازد - جایگزین بهتر معمولاً یک نمونهٔ ماژول-سطح (Module-level instance که پایتون به‌طور طبیعی همان رفتار Singleton را با import کردن ماژول می‌دهد) یا Dependency Injection صریح است؛ Django App Registry خودش نمونه‌ای از این الگو با مدیریت دقیق‌تر چرخهٔ حیات است. Adapter یک Interface ناسازگار (مثلاً SDK یک سرویس پرداخت خارجی با متدهای عجیب و مستندات ضعیف) را پشت یک Interface تمیز و متعلق به پروژهٔ خودتان می‌پوشاند، تا اگر فردا SDK یا سرویس عوض شد، فقط Adapter تغییر کند نه کل کد کسب‌وکار. Builder ساخت گام‌به‌گام یک شیء پیچیده با پارامترهای زیاد و اختیاری را خواناتر می‌کند (به‌جای یک Constructor با ۱۰ پارامتر) - در پایتون اغلب با متدهای زنجیره‌ای (Fluent Interface) یا حتی صرفاً کلاس‌های dataclass با مقادیر پیش‌فرض جایگزین می‌شود، اما در ساخت اشیاء واقعاً پیچیده (مثل یک QuerySet چندمرحله‌ای یا یک Request Object با هدرها/پارامترهای زیاد) هنوز کاربرد دارد. Command یک عملیات را به یک شیء مستقل (با متدهای execute/undo) تبدیل می‌کند تا بتوان آن را صف کرد، به تعویق انداخت، لاگ کرد یا Retry کرد بدون اینکه فراخوانندهٔ اصلی از جزئیات عملیات باخبر باشد - یک Celery Task دقیقاً همین الگو است: یک واحد کار مستقل که با آرگومان‌هایش سریال‌سازی، صف و بعداً (شاید روی ماشین دیگری) اجرا می‌شود.",
objectives:["توضیح چرا Singleton در پایتون/Django اغلب باید با یک نمونهٔ ماژول-سطح جایگزین شود","پیاده‌سازی یک Adapter برای پوشاندن یک SDK پرداخت خارجی فرضی"],
example:"یک Celery Task که ایمیل ارسال می‌کند، یک نمونهٔ واقعی از الگوی Command است: عملیات 'ارسال ایمیل' با آرگومان‌هایش به یک شیء سریال‌پذیر تبدیل شده که مستقل از فراخوانندهٔ اصلی اجرا/Retry می‌شود.",
py:"class PaymentGatewayAdapter:\n    \"\"\"سازگار می‌کند SDK ناسازگار پرداخت خارجی را با Interface داخلی پروژه\"\"\"\n    def __init__(self, external_sdk_client):\n        self._client = external_sdk_client\n    def charge(self, amount_cents: int, currency: str) -> bool:\n        # SDK خارجی متد و امضای عجیب دارد؛ اینجا یکبار برای همیشه ترجمه می‌شود\n        resp = self._client.do_transaction(amt=amount_cents / 100, ccy=currency)\n        return resp.get('status') == 'OK'",
exercise:"یک Adapter برای یک SDK فرضی پرداخت (با نام‌گذاری متد عجیب مثل do_transaction) بسازید که پشت یک Interface تمیزتر (charge(amount, currency)) پنهانش می‌کند، و یک تست واحد بنویسید که فقط Adapter را Mock می‌کند.",
project:"", resources:[{t:"Refactoring Guru - Singleton, Adapter, Builder, Command",u:"https://refactoring.guru/design-patterns/python"},{t:"Celery docs - Tasks as Commands",u:"https://docs.celeryq.dev/en/stable/userguide/tasks.html"}],
criteria:"می‌توانید توضیح دهید چرا Singleton در پایتون اغلب غیرضروری/مضر است و یک Adapter واقعی برای یک SDK خارجی بنویسید.",
interview:["چرا Singleton در پایتون/Django معمولاً Anti-pattern محسوب می‌شود؟","چگونه یک Celery Task نمونه‌ای از الگوی Command است؟"],
mistakes:["پیاده‌سازی Singleton با متغیرهای کلاس/global بدون توجه به اینکه import ماژول در پایتون خودش رفتار مشابه singleton می‌دهد و ساده‌تر است","فراخوانی مستقیم SDK خارجی در سراسر کد به‌جای پوشاندن آن پشت یک Adapter، که باعث می‌شود تغییر SDK به تغییرات پراکنده در کل پروژه نیاز داشته باشد"],
production:"وقتی یک تیم SDK پرداخت یا پیامک خارجی را مستقیم در ده‌ها جای کد صدا می‌زند، تعویض آن Provider در آینده به یک پروژهٔ چندهفته‌ای تبدیل می‌شود؛ یک Adapter از روز اول این هزینه را حذف می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. الگوهای Singleton، Adapter، Builder و Command را با مثال‌های واقعی پایتون/Django توضیح بده و مشخص کن چرا Singleton اغلب Anti-pattern است. کمکم کن یک Adapter برای SDK پرداخت خارجی فرضی بنویسم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p28",num:28,title:"معماری نرم‌افزار",icon:"🏛️",summary:"لایه‌بندی، Clean/Hexagonal Architecture و Domain-Driven Design.",
topics:[
{id:"clean-architecture-ddd",title:"Clean/Hexagonal Architecture و مفاهیم پایهٔ DDD",level:"Advanced",minLadder:4,prereqs:["solid-principles","design-patterns-practical"],
short:"چگونه منطق کسب‌وکار را از فریم‌ورک و زیرساخت جدا کنیم تا تست‌پذیر و مستقل از تغییرات فناوری بماند.",
deep:"Hexagonal Architecture (معماری پورت و آداپتور) منطق کسب‌وکار (Domain) را در مرکز قرار می‌دهد و آن را کاملاً مستقل از جزئیات فنی (دیتابیس، فریم‌ورک وب، API خارجی) نگه می‌دارد؛ ارتباط با دنیای بیرون از طریق Portها (Interface) و Adapterها (پیاده‌سازی واقعی، مثل ORM جنگو یا کلاینت HTTP) انجام می‌شود. Clean Architecture ایدهٔ مشابهی دارد با تأکید بر قانون وابستگی: کد سطح داخلی (Domain/Entities) هرگز نباید به کد سطح بیرونی (Framework، Database) وابسته باشد، فقط برعکس. این جدایی به این معناست که در تست واحد منطق کسب‌وکار، نیازی به راه‌اندازی دیتابیس واقعی نیست - Repository یک Interface است که در تولید با ORM پیاده می‌شود و در تست با یک پیاده‌سازی درون‌حافظه‌ای Fake. Domain-Driven Design (DDD) مفاهیمی مثل Entity (شیء با هویت پایدار، مثل یک سفارش با ID)، Value Object (شیء بدون هویت که فقط با مقدارش تعریف می‌شود، مثل Money)، Aggregate (گروهی از Entity/Value Object که به‌عنوان یک واحد سازگاری تراکنشی مدیریت می‌شوند، مثل Order با OrderItems آن) و Bounded Context (مرز واضح بین بخش‌های مختلف سیستم که هرکدام مدل داده و زبان مشترک خودشان را دارند) را معرفی می‌کند. در Django، این معماری معمولاً به‌معنای جداسازی منطق کسب‌وکار از View و مدل ORM با یک لایهٔ Service/Domain جداگانه است، هرچند Django به‌طور پیش‌فرض به سمت الگوی Active Record (مدل=هم داده هم رفتار پایگاه‌داده) گرایش دارد.",
objectives:["طراحی یک Repository Interface مستقل از ORM جنگو","تشخیص Entity، Value Object و Aggregate در یک دامنهٔ واقعی"],
example:"در یک سیستم مالی، Money یک Value Object است (دو Money با مقدار و ارز یکسان برابرند، بدون هویت)؛ Wallet یک Entity/Aggregate Root است که تراکنش‌های خودش را کنترل می‌کند.",
py:"from typing import Protocol\n\nclass OrderRepository(Protocol):\n    def get(self, order_id: int) -> 'Order': ...\n    def save(self, order: 'Order') -> None: ...\n\nclass DjangoOrderRepository:\n    def get(self, order_id):\n        from myapp.models import OrderModel\n        return OrderModel.objects.get(id=order_id)\n    def save(self, order):\n        pass  # نگاشت به مدل ORM\n\nclass OrderService:\n    def __init__(self, repo: OrderRepository):\n        self.repo = repo  # کاملاً مستقل از Django ORM در تست",
exercise:"یک OrderService بسازید که به یک Repository Interface وابسته باشد نه مستقیم به Django ORM، و برای تست واحد آن یک InMemoryOrderRepository بسازید.",
project:"بازطراحی یک بخش از سیستم سفارش با معماری لایه‌ای (Domain، Service، Repository، Presentation/View) که منطق کسب‌وکار بدون Django قابل تست باشد.",
resources:[{t:"Cosmic Python - Architecture Patterns with Python (رایگان آنلاین)",u:"https://www.cosmicpython.com/book/preface.html"},{t:"Eric Evans DDD summary (Martin Fowler)",u:"https://martinfowler.com/bliki/DomainDrivenDesign.html"}],
criteria:"می‌توانید یک لایهٔ Service/Domain بسازید که کاملاً مستقل از Django ORM قابل تست واحد باشد.",
interview:["چرا وابستگی مستقیم منطق کسب‌وکار به ORM می‌تواند مشکل‌ساز باشد؟","Aggregate در DDD چیست و چرا مرز تراکنشی مهم است؟"],
mistakes:["اعمال Clean Architecture کامل روی یک پروژهٔ CRUD ساده که باعث پیچیدگی بیش از حد می‌شود (Over-engineering)"],
production:"سیستم‌های مالی و سفارش پیچیده معمولاً از جداسازی Domain/Infrastructure بهره می‌برند چون منطق کسب‌وکار پیچیده‌تر از CRUD ساده است و باید مستقل تست شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. Clean/Hexagonal Architecture و مفاهیم پایهٔ DDD (Entity، Value Object، Aggregate، Bounded Context) را با مثال یک سیستم مالی توضیح بده، و کمکم کن یک OrderService مستقل از Django ORM طراحی کنم که با Repository Pattern قابل تست واحد باشد. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p29",num:29,title:"میکروسرویس‌ها",icon:"🧬",summary:"مرزبندی سرویس، ارتباطات، مالکیت داده و چرا میکروسرویس همیشه انتخاب درستی نیست.",
topics:[
{id:"microservices-boundaries",title:"مرزبندی سرویس، مالکیت داده و چرا مونولیت گاهی بهتر است",level:"Advanced",minLadder:4,prereqs:["clean-architecture-ddd","cap-theorem"],
short:"چگونه مرزهای درست بین میکروسرویس‌ها تعیین کنیم و چرا شروع با مونولیت اغلب توصیهٔ بهتری است.",
deep:"مرز درست یک میکروسرویس معمولاً با Bounded Context در DDD همسو است: هر سرویس باید مالکیت انحصاری داده و منطق کسب‌وکار خودش را داشته باشد (Database per Service) و هرگز مستقیماً به دیتابیس سرویس دیگر دسترسی نداشته باشد - ارتباط فقط از طریق API یا رویداد. مزیت میکروسرویس‌ها استقلال استقرار (Deploy مستقل هر تیم)، مقیاس‌پذیری مستقل هر بخش و ایزولاسیون خطا است؛ اما هزینهٔ سنگینی هم دارند: پیچیدگی عملیاتی بالا (مانیتورینگ توزیع‌شده، Observability، Service Discovery)، تراکنش‌های توزیع‌شده به‌جای ACID ساده (نیاز به Saga)، Network Latency بین سرویس‌ها که قبلاً یک فراخوانی تابع محلی بود، و پیچیدگی تست یکپارچه. مارتین فاولر و بسیاری مهندسان ارشد توصیه می‌کنند با یک 'Monolith First' شروع شود: یک مونولیت خوش‌ساخت با لایه‌بندی داخلی واضح (Modular Monolith) که مرزهای منطقی روشنی دارد، و تنها زمانی به میکروسرویس تجزیه شود که تیم به اندازهٔ کافی بزرگ شده و نیاز واقعی به مقیاس‌پذیری/استقلال مستقل تیم‌ها احساس شود - چون تجزیهٔ زودهنگام به میکروسرویس با مرزهای اشتباه (Distributed Monolith) بدترین حالت ممکن است: تمام پیچیدگی توزیع‌شده بدون مزایای واقعی استقلال.",
objectives:["تشخیص Distributed Monolith (میکروسرویس‌های با مرز نادرست)","توضیح چرا Modular Monolith اغلب نقطهٔ شروع بهتری از میکروسرویس است"],
example:"اگر تغییر یک قابلیت همیشه نیازمند Deploy هم‌زمان سه میکروسرویس باشد، این یک Distributed Monolith است نه معماری میکروسرویس واقعی.",
py:"", exercise:"یک اپلیکیشن فروشگاهی فرضی (کاربر، محصول، سفارش، پرداخت) را تحلیل کنید: کدام بخش‌ها باید یک سرویس مستقل باشند و کدام باید در یک ماژول مشترک (Modular Monolith) بمانند؟ توجیه کنید.",
project:"", resources:[{t:"Martin Fowler - MonolithFirst",u:"https://martinfowler.com/bliki/MonolithFirst.html"},{t:"microservices.io - Database per Service pattern",u:"https://microservices.io/patterns/data/database-per-service.html"}],
criteria:"می‌توانید برای یک سیستم واقعی تصمیم بگیرید کجا مرز میکروسرویس منطقی است و کجا Modular Monolith کافی و بهتر است.",
interview:["Distributed Monolith چیست و چرا بدتر از هر دو گزینهٔ خالص است؟","چرا Database per Service یک اصل کلیدی میکروسرویس است؟"],
mistakes:["تجزیهٔ زودهنگام یک محصول کوچک به ۱۵ میکروسرویس بدون تیم یا نیاز کافی برای مدیریت پیچیدگی آن"],
production:"بسیاری از استارتاپ‌هایی که زودهنگام به میکروسرویس رفته‌اند، سرعت توسعه‌شان به‌شدت کاهش یافته و بعضاً به مونولیت بازگشته‌اند (مثل تجربهٔ عمومی‌شدهٔ چند شرکت شناخته‌شده).",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مرزبندی میکروسرویس، مفهوم Database per Service و بحث Monolith First در برابر میکروسرویس زودهنگام را توضیح بده. یک سیستم فروشگاهی فرضی بده تا مرزهای سرویس مناسب را طراحی و توجیه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"microservices-communication-gateway",title:"ارتباط بین سرویس‌ها، API Gateway، Service Mesh و Strangler Fig",level:"Advanced",minLadder:4,prereqs:["microservices-boundaries"],
short:"چگونه سرویس‌ها با هم حرف می‌زنند، چه کسی نقطهٔ ورودی مشترک را مدیریت می‌کند، و چگونه بدون ریسک بزرگ از مونولیت به سرویس‌ها مهاجرت کنیم.",
deep:"ارتباط بین سرویس‌ها دو مدل اصلی دارد: همزمان (Synchronous، معمولاً REST یا gRPC) که ساده و قابل‌فهم است اما هر سرویس را به در دسترس بودن سرویس‌های وابسته‌اش گره می‌زند و ریسک تأخیر آبشاری (Cascading Latency) دارد؛ و ناهمزمان (Asynchronous، از طریق یک Message Broker) که Coupling زمانی را از بین می‌برد (سرویس فرستنده منتظر پاسخ فوری نمی‌ماند) اما سازگاری نهایی (Eventual Consistency) و پیچیدگی بیشتری در ردیابی جریان کلی یک عملیات به همراه می‌آورد. API Gateway یک نقطهٔ ورودی واحد جلوی همهٔ میکروسرویس‌ها قرار می‌دهد که مسئولیت‌های مشترک (احراز هویت، Rate Limiting، مسیریابی درخواست به سرویس درست، تجمیع پاسخ چند سرویس در یک پاسخ) را از تکرار در هر سرویس خارج می‌کند - این چیزی فراتر از یک Reverse Proxy ساده مثل Nginx است چون منطق مسیریابی و سیاست‌گذاری آگاه به سرویس‌ها دارد. Service Mesh یک لایه زیرساختی جداگانه (معمولاً با Sidecar Proxy کنار هر سرویس، مثل Istio یا Linkerd) اضافه می‌کند که mTLS بین سرویس‌ها، مدیریت ترافیک (Retry، Timeout، Circuit Breaking در سطح شبکه) و Observability را بدون تغییر کد اپلیکیشن فراهم می‌کند - این جداسازی 'concerns شبکه‌ای' از 'منطق کسب‌وکار' است. برای مهاجرت از یک مونولیت به میکروسرویس، الگوی Strangler Fig (نام از گیاه Strangler Fig که به‌آرامی دور یک درخت رشد می‌کند تا جایگزینش شود) توصیه می‌شود: به‌جای بازنویسی یک‌بارهٔ پرریسک، یک Proxy جلوی مونولیت قرار می‌گیرد که به‌تدریج مسیرها را یکی‌یکی به سرویس‌های جدید هدایت می‌کند، تا مونولیت قدیمی کم‌کم 'خفه' و جایگزین شود بدون یک Big-Bang Rewrite خطرناک.",

criteria:"می‌توانید برای یک سیستم واقعی تصمیم بگیرید کدام ارتباط بین سرویس باید همزمان و کدام ناهمزمان باشد، و یک برنامهٔ مهاجرت Strangler Fig طراحی کنید.",
