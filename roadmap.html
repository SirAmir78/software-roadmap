]},

{id:"p34",num:34,title:"Docker",icon:"🐳",summary:"Container، Image، Dockerfile چندمرحله‌ای، شبکه و امنیت.",
topics:[
{id:"docker-images-layers",title:"Image، Layer و Dockerfile چندمرحله‌ای (Multi-stage)",level:"Intermediate",minLadder:2,prereqs:["virtual-memory","linux-filesystem"],
short:"Container چیزی جز یک پروسهٔ لینوکسی ایزوله‌شده با namespaces و cgroups نیست.",
deep:"Container برخلاف Virtual Machine، هستهٔ لینوکس میزبان را با کل سیستم‌عامل‌های دیگر به اشتراک می‌گذارد؛ ایزولاسیون با namespaces (هرکدام یک بعد را ایزوله می‌کنند: PID namespace پروسه‌ها، Network namespace اینترفیس‌های شبکه، Mount namespace فایل‌سیستم) و محدودیت منابع با cgroups (که پیش‌تر در بحث حافظهٔ مجازی دیدیم) پیاده می‌شود - به همین دلیل Containerها بسیار سبک‌تر و سریع‌تر از VM راه‌اندازی می‌شوند. یک Docker Image از Layerهای فقط-خواندنی تشکیل شده که هرکدام یک دستور در Dockerfile (مثل RUN یا COPY) است؛ Docker این Layerها را کش می‌کند، پس اگر فقط کد تغییر کرده باشد (نه dependencies)، فقط Layerهای بعد از آن تغییر دوباره Build می‌شوند - به همین دلیل ترتیب دستورات در Dockerfile (کپی requirements.txt و نصب dependencies قبل از کپی کد اصلی) مستقیماً بر سرعت Build تأثیر دارد. Multi-stage Build اجازه می‌دهد یک مرحله برای Build (با ابزارهای سنگین کامپایل) و یک مرحلهٔ نهایی سبک‌تر فقط با artifact نهایی استفاده شود، که اندازهٔ Image نهایی تولید را به‌شدت کاهش می‌دهد - مهم برای امنیت (سطح حملهٔ کمتر) و سرعت Deploy.",
objectives:["نوشتن Dockerfile با ترتیب صحیح Layer برای بهره‌گیری از کش","نوشتن Multi-stage Build برای کاهش اندازهٔ Image نهایی"],
example:"COPY requirements.txt . \\nRUN pip install -r requirements.txt \\nCOPY . . — این ترتیب یعنی تغییر کد باعث Rebuild دوبارهٔ نصب dependencies نمی‌شود.",
py:"", exercise:"یک Dockerfile برای یک اپلیکیشن Django بنویسید که مرحلهٔ اول dependencies را نصب کند (با کش Layer) و در Dockerfile یک نسخهٔ Multi-stage بسازید که فقط فایل‌های لازم را در Image نهایی کپی کند.",
project:"Dockerize کردن کامل یک پروژهٔ Django+Gunicorn+Nginx با docker-compose، شامل تنظیم Health Check و Resource Limit.",
resources:[{t:"Docker docs - Dockerfile best practices",u:"https://docs.docker.com/build/building/best-practices/"},{t:"Docker docs - Multi-stage builds",u:"https://docs.docker.com/build/building/multi-stage/"}],
criteria:"می‌توانید یک Dockerfile بهینه (کش Layer صحیح + Multi-stage) برای یک اپلیکیشن Django بنویسید که اندازهٔ Image نهایی حداقلی باشد.",
interview:["تفاوت Container و Virtual Machine در سطح فنی چیست؟","چرا ترتیب دستورات در Dockerfile روی سرعت Build تأثیر دارد؟"],
mistakes:["کپی کل کد پروژه قبل از نصب dependencies که باعث می‌شود هر تغییر کوچک کد، کل نصب dependencies را دوباره اجرا کند"],
production:"Imageهای غول‌پیکر (چند گیگابایتی) به‌دلیل عدم استفاده از Multi-stage Build، هم Deploy را کند می‌کنند و هم سطح حملهٔ امنیتی را افزایش می‌دهند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری Docker (namespaces، cgroups، Layer، کش Build) را توضیح بده و کمکم کن یک Dockerfile بهینه با Multi-stage Build برای یک پروژهٔ Django بنویسم که اندازهٔ Image را به حداقل برساند. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p35",num:35,title:"Kubernetes",icon:"☸️",summary:"Pod، Deployment، Service، HPA، StatefulSet و مدیریت خوشه در مقیاس.",
topics:[
{id:"k8s-core-objects",title:"Pod، Deployment، Service و چرخهٔ حیات در Kubernetes",level:"Advanced",minLadder:4,prereqs:["docker-images-layers","logical-clocks-consensus"],
short:"واحدهای بنیادین Kubernetes و چگونگی مدیریت خودکار در دسترس بودن و مقیاس‌پذیری.",
deep:"Pod کوچک‌ترین واحد قابل استقرار در Kubernetes است که یک یا چند Container را با شبکه و Storage مشترک نگه می‌دارد؛ Podها به‌طور طبیعی فناپذیرند (Ephemeral) - هرگز نباید مستقیماً به یک Pod خاص وابسته شد. Deployment یک لایهٔ مدیریتی بالاتر است که تعداد مشخصی Replica از یک Pod را نگه می‌دارد و به‌طور خودکار Podهای از کار افتاده را جایگزین می‌کند (Self-healing)؛ همچنین Rolling Update (به‌روزرسانی تدریجی بدون Downtime، جایگزینی تدریجی نسخهٔ قدیم با جدید) را مدیریت می‌کند. Service یک آدرس شبکهٔ پایدار (و DNS Name) برای مجموعه‌ای از Podهای در حال تغییر فراهم می‌کند - چون IP هر Pod با هر ری‌استارت عوض می‌شود، Service با Label Selector، ترافیک را به Podهای سالم Load Balance می‌کند. Liveness Probe به Kubernetes می‌گوید آیا Container هنوز 'زنده' است (اگر نه، Restart می‌شود)؛ Readiness Probe می‌گوید آیا Container آمادهٔ دریافت ترافیک است (اگر نه، از Service حذف می‌شود بدون Restart) - تفاوت این دو Probe یک اشتباه رایج مبتدیان است که می‌تواند منجر به قطع سرویس یا Restart بی‌مورد شود. Resource Requests/Limits تعیین می‌کنند چقدر CPU/Memory یک Container نیاز دارد (برای زمان‌بندی) و حداکثر مجاز آن (که عبور از حد Memory منجر به OOM Kill می‌شود، دقیقاً مطابق مفهومی که در بحث حافظهٔ مجازی دیدیم).",
objectives:["توضیح تفاوت Liveness و Readiness Probe","توضیح چرا Deployment به‌جای مدیریت مستقیم Pod استفاده می‌شود"],
example:"apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: django-app}\nspec:\n  replicas: 3\n  template:\n    spec:\n      containers:\n      - name: web\n        image: myapp:1.2\n        readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}\n        resources: {requests: {memory: '256Mi'}, limits: {memory: '512Mi'}}",
py:"", exercise:"یک Deployment با ۳ Replica، Liveness/Readiness Probe و Resource Limits برای یک اپلیکیشن Django بنویسید؛ سپس عمداً یک Pod را با kubectl delete pod حذف کنید و مشاهده کنید Deployment آن را جایگزین می‌کند.",
project:"استقرار کامل یک اپلیکیشن Django روی یک خوشهٔ Kubernetes محلی (minikube/kind) با Deployment، Service، ConfigMap و Secret.",
resources:[{t:"Kubernetes docs - Pods",u:"https://kubernetes.io/docs/concepts/workloads/pods/"},{t:"Kubernetes docs - Deployments",u:"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"},{t:"Kubernetes docs - Probes",u:"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"}],
criteria:"می‌توانید یک Deployment کامل با Probe و Resource Limit صحیح برای یک اپلیکیشن Django بنویسید و رفتار Self-healing را نشان دهید.",
interview:["تفاوت Liveness و Readiness Probe چیست و اشتباه رایج در تنظیم آن‌ها چیست؟","چرا نباید مستقیماً به Pod تکی وابسته شد؟"],
mistakes:["تنظیم Liveness Probe سخت‌گیرانه که باعث Restart مکرر یک Pod سالم اما کمی کند می‌شود (Restart Loop)"],
production:"'Pod مدام Restart می‌شود (CrashLoopBackOff)' یکی از رایج‌ترین اینسیدنت‌های Kubernetes است که ریشه‌اش اغلب Liveness Probe نامناسب یا OOM Kill است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. اجزای بنیادین Kubernetes (Pod، Deployment، Service، Probe، Resource Limit) را توضیح بده و کمکم کن یک Deployment کامل برای یک اپلیکیشن Django بنویسم؛ سپس سناریوی CrashLoopBackOff طراحی کن تا با kubectl describe/logs دیباگش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p36",num:36,title:"کلاود",icon:"☁️",summary:"مفاهیم AWS (IAM، VPC، EC2، S3، RDS) قابل انتقال به سایر کلودها.",
topics:[
{id:"cloud-vpc-iam",title:"VPC، Subnet، Security Group و IAM",level:"Intermediate",minLadder:2,prereqs:["net-tcp-handshake","k8s-core-objects"],
short:"مفاهیم پایه‌ای شبکه و کنترل دسترسی در کلود که مستقل از ارائه‌دهنده قابل انتقال‌اند.",
deep:"VPC (Virtual Private Cloud) یک شبکهٔ ایزولهٔ منطقی درون کلود است که کنترل کامل بر آدرس‌دهی IP، Subnetها و مسیریابی را به شما می‌دهد. Subnet عمومی (با مسیر به Internet Gateway) برای منابعی که باید مستقیم از اینترنت در دسترس باشند (مثل Load Balancer) و Subnet خصوصی (بدون مسیر مستقیم به اینترنت، فقط از طریق NAT Gateway برای خروجی) برای منابع حساس (دیتابیس، اپلیکیشن بک‌اند) استفاده می‌شود - این جداسازی یک اصل امنیتی بنیادین Defense in Depth است. Security Group یک فایروال Stateful در سطح Instance است (اگر ترافیک ورودی مجاز باشد، پاسخ آن خودکار مجاز است)؛ Network ACL فایروال Stateless در سطح Subnet است. IAM (Identity and Access Management) کنترل می‌کند چه کسی (User، Role، Service) به چه منابعی چه دسترسی‌ای دارد، با اصل Least Privilege (حداقل دسترسی لازم، نه بیشتر) - یک اشتباه بسیار رایج و پرهزینه، دادن دسترسی AdministratorAccess به همه به‌جای تعریف دقیق Policy است. IAM Role (برخلاف User) برای اعطای دسترسی موقت به سرویس‌ها (مثل یک EC2 Instance که نیاز به خواندن از S3 دارد) بدون نیاز به ذخیرهٔ کلید دسترسی ثابت در کد استفاده می‌شود - این مفاهیم مستقیماً معادل خودشان در GCP (VPC, IAM) و Azure (VNet, IAM) هم وجود دارند.",
objectives:["طراحی یک VPC با Subnet عمومی/خصوصی برای یک اپلیکیشن سه‌لایه","توضیح چرا IAM Role بهتر از کلید دسترسی ثابت در کد است"],
example:"یک اپلیکیشن Django روی EC2 در Subnet خصوصی، پشت یک Application Load Balancer در Subnet عمومی، با دسترسی به RDS (دیتابیس) در همان Subnet خصوصی.",
py:"", exercise:"معماری شبکهٔ یک اپلیکیشن سه‌لایه (Load Balancer عمومی، اپلیکیشن خصوصی، دیتابیس خصوصی) را روی کاغذ طراحی کنید و Security Groupهای لازم برای هر لایه را مشخص کنید.",
project:"", resources:[{t:"AWS docs - VPC",u:"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{t:"AWS docs - IAM best practices",u:"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"}],
criteria:"می‌توانید یک معماری شبکهٔ سه‌لایه با Subnetهای صحیح و Security Groupهای حداقلی طراحی کنید.",
interview:["تفاوت Security Group و Network ACL چیست؟","چرا دیتابیس معمولاً در Subnet خصوصی قرار می‌گیرد نه عمومی؟"],
mistakes:["قرار دادن دیتابیس در Subnet عمومی با دسترسی مستقیم اینترنت که سطح حمله را به‌شدت افزایش می‌دهد"],
production:"نشت دادهٔ ناشی از دیتابیس‌های در معرض عموم بدون Security Group مناسب، یکی از رایج‌ترین حوادث امنیتی گزارش‌شده در کلود است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم VPC، Subnet عمومی/خصوصی، Security Group و IAM را توضیح بده. یک اپلیکیشن سه‌لایهٔ Django بده تا معماری شبکهٔ ایمن آن را طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p37",num:37,title:"زیرساخت به‌عنوان کد",icon:"🧾",summary:"Terraform: State، Provider، Module و مدیریت drift.",
topics:[
{id:"terraform-state-modules",title:"Terraform: State، Plan/Apply و ماژول‌سازی",level:"Advanced",minLadder:4,prereqs:["cloud-vpc-iam"],
short:"چگونه زیرساخت را با کد قابل نسخه‌بندی و بازتولید مدیریت کنیم به‌جای کلیک کردن دستی در کنسول.",
deep:"Terraform State یک فایل (معمولاً JSON، ذخیره‌شده در یک Backend مثل S3+DynamoDB برای Locking) است که نگاشت بین منابع تعریف‌شده در کد و منابع واقعی موجود در Cloud را نگه می‌دارد؛ بدون این State، Terraform نمی‌داند چه چیزی از قبل وجود دارد. terraform plan تغییرات لازم (ایجاد/تغییر/حذف) را بدون اعمال واقعی نشان می‌دهد - این مرحلهٔ حیاتی 'پیش‌نمایش' قبل از هر apply در تولید باید همیشه به‌دقت بازبینی شود. Drift زمانی رخ می‌دهد که کسی دستی (از طریق کنسول کلود) منبعی را تغییر دهد که Terraform مدیریت می‌کند؛ در این حالت State با واقعیت هم‌خوان نیست و apply بعدی می‌تواند رفتار غیرمنتظره داشته باشد - راه‌حل، هرگز تغییر دستی منابع مدیریت‌شده با Terraform و اجرای دورهٔ terraform plan برای تشخیص Drift است. Module امکان بسته‌بندی مجموعه‌ای از منابع (مثلاً یک 'VPC استاندارد شرکت' یا یک 'کلاستر RDS با Backup خودکار') را به‌عنوان یک واحد قابل استفادهٔ مجدد با ورودی/خروجی مشخص (Variables/Outputs) می‌دهد، که تکرار کد بین محیط‌های dev/staging/production را کاهش می‌دهد. Remote State با Locking (مثل DynamoDB Lock) از اجرای هم‌زمان دو terraform apply که می‌تواند State را خراب کند جلوگیری می‌کند - حیاتی برای کار تیمی.",
objectives:["توضیح چرا Terraform State باید Remote و Lock-دار باشد در کار تیمی","ساخت یک Module قابل استفادهٔ مجدد برای زیرساخت تکراری"],
example:"terraform {\n  backend \"s3\" {\n    bucket = \"my-terraform-state\"\n    key    = \"prod/vpc.tfstate\"\n    dynamodb_table = \"terraform-locks\"\n  }\n}",
py:"", exercise:"یک ماژول Terraform برای یک 'VPC استاندارد' (با Subnet عمومی/خصوصی) بسازید که در سه محیط dev/staging/prod با متغیرهای متفاوت (CIDR block) قابل استفاده باشد.",
project:"", resources:[{t:"Terraform docs - State",u:"https://developer.hashicorp.com/terraform/language/state"},{t:"Terraform docs - Modules",u:"https://developer.hashicorp.com/terraform/language/modules"}],
criteria:"می‌توانید یک زیرساخت چندمحیطی (dev/staging/prod) با Terraform Module و Remote State با Locking طراحی کنید.",
interview:["Terraform State چیست و چرا باید Remote و Lock-دار باشد؟","Drift چیست و چگونه تشخیص داده می‌شود؟"],
mistakes:["ذخیرهٔ State به‌صورت محلی (local) در کار تیمی که منجر به Conflict و خرابی State می‌شود"],
production:"از دست دادن یا خراب شدن Terraform State یکی از خطرناک‌ترین اینسیدنت‌های زیرساختی است چون Terraform دیگر نمی‌داند چه چیزی واقعاً وجود دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم Terraform State، Plan/Apply، Drift و Module را توضیح بده. کمکم کن یک ماژول VPC قابل استفادهٔ مجدد برای سه محیط dev/staging/prod بسازم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p38",num:38,title:"CI/CD",icon:"🔁",summary:"پایپ‌لاین ساخت/تست/استقرار و استراتژی‌های Deploy (Blue-Green، Canary).",
topics:[
{id:"cicd-deployment-strategies",title:"استراتژی‌های استقرار: Rolling، Blue-Green و Canary",level:"Advanced",minLadder:4,prereqs:["k8s-core-objects","git-branching-strategy"],
short:"چگونه نسخهٔ جدید نرم‌افزار را بدون Downtime و با ریسک کنترل‌شده مستقر کنیم.",
deep:"Rolling Update (پیش‌فرض Kubernetes Deployment) نسخهٔ جدید را تدریجی جایگزین نسخهٔ قدیم می‌کند، Pod به Pod - ساده و بدون منابع اضافی، اما در طول Rollout هر دو نسخه هم‌زمان فعال‌اند که نیازمند سازگاری بین نسخه‌هاست (مثلاً Migration دیتابیس باید Backward Compatible باشد). Blue-Green Deployment دو محیط کاملاً مجزا (Blue=فعلی، Green=جدید) نگه می‌دارد؛ بعد از تست کامل Green، ترافیک یک‌جا (با تغییر Load Balancer یا DNS) به آن سوییچ می‌شود - Rollback فوری است (فقط سوییچ برگردد) اما هزینهٔ دو برابر منابع در طول Deploy دارد. Canary Deployment نسخهٔ جدید را ابتدا به درصد کوچکی از ترافیک واقعی (مثلاً ۵٪) می‌دهد، متریک‌های کلیدی (نرخ خطا، تأخیر) را رصد می‌کند، و اگر سالم بود تدریجی درصد را افزایش می‌دهد - این روش بهترین تعادل بین ریسک و منابع را دارد و برای تغییرات پرریسک ترجیح داده می‌شود، اما نیازمند Observability قوی (برای تشخیص خودکار سالم/ناسالم بودن Canary) و مسیریابی ترافیک دقیق (مثل Service Mesh یا Ingress پیشرفته) است. Feature Flag مکمل این استراتژی‌هاست: کد جدید Deploy می‌شود اما پشت یک Flag غیرفعال می‌ماند و جداگانه (بدون Deploy مجدد) برای کاربران خاص فعال می‌شود، که ریسک Deploy را از ریسک انتشار قابلیت جدا می‌کند.",
objectives:["توضیح تفاوت ریسک/هزینهٔ Rolling، Blue-Green و Canary","طراحی یک پایپ‌لاین CI/CD با مرحلهٔ Canary"],
example:"در یک استقرار Canary در Kubernetes، دو Deployment (v1 با ۹۵٪ Replica و v2 با ۵٪ Replica) پشت یک Service مشترک قرار می‌گیرند.",
py:"", exercise:"یک پایپ‌لاین GitHub Actions طراحی کنید که: تست را اجرا کند → Image بسازد → به یک Registry پوش کند → با کوبرنتیز ابتدا ۵٪ ترافیک (Canary) و بعد از موفقیت، ۱۰۰٪ را به‌روزرسانی کند.",
project:"پایپ‌لاین CI/CD کامل برای یک پروژهٔ Django با GitHub Actions شامل: Lint، تست، Build Docker Image، و Deploy به Kubernetes با استراتژی Rolling.",
resources:[{t:"GitHub Actions docs",u:"https://docs.github.com/en/actions"},{t:"Kubernetes docs - Deployment strategies",u:"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy"},{t:"Martin Fowler - BlueGreenDeployment",u:"https://martinfowler.com/bliki/BlueGreenDeployment.html"}],
criteria:"می‌توانید یک پایپ‌لاین کامل CI/CD با GitHub Actions بسازید که شامل تست خودکار، Build و Deploy با یک استراتژی مشخص (حداقل Rolling) باشد.",
interview:["تفاوت Blue-Green و Canary Deployment چیست؟ هرکدام چه مصالحه‌ای دارند؟","Feature Flag چگونه ریسک Deploy را از ریسک انتشار قابلیت جدا می‌کند؟"],
mistakes:["استقرار Migration دیتابیس Breaking هم‌زمان با کد جدید در یک Rolling Update که باعث ناسازگاری بین نسخهٔ قدیم و جدید کد در طول Rollout می‌شود"],
production:"شرکت‌های بزرگ (Netflix، Google) به‌طور گسترده از Canary Deployment با رصد خودکار متریک برای کاهش ریسک انتشار استفاده می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. استراتژی‌های استقرار (Rolling، Blue-Green، Canary) و نقش Feature Flag را توضیح بده و کمکم کن یک پایپ‌لاین GitHub Actions با تست خودکار و Deploy به Kubernetes طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p39",num:39,title:"SRE",icon:"🚨",summary:"SLI/SLO/Error Budget، مدیریت اینسیدنت و پست‌مورتم بدون سرزنش.",
topics:[
{id:"sre-sli-slo-error-budget",title:"SLI، SLO، SLA و Error Budget",level:"Advanced",minLadder:4,prereqs:["math-prob-queueing"],
short:"چگونه قابلیت اطمینان را با اعداد دقیق تعریف کنیم به‌جای احساس مبهم 'سیستم باید همیشه کار کند'.",
deep:"SLI (Service Level Indicator) یک متریک قابل‌اندازه‌گیری از رفتار سرویس است (مثلاً درصد درخواست‌هایی که با موفقیت و زیر ۲۰۰ میلی‌ثانیه پاسخ داده شدند). SLO (Service Level Objective) هدف داخلی تیم برای آن SLI است (مثلاً 99.9٪ درخواست‌ها در یک ماه باید موفق باشند). SLA (Service Level Agreement) تعهد قراردادی به مشتری است که معمولاً کمی سخاوتمندانه‌تر از SLO داخلی تنظیم می‌شود و اغلب جریمهٔ مالی در صورت نقض دارد. Error Budget مکملِ SLO است: اگر SLO 99.9٪ باشد، Error Budget یعنی 0.1٪ خطا/Downtime مجاز است (که در یک ماه ۳۰ روزه تقریباً ۴۳ دقیقه می‌شود) - این عدد به تیم اجازه می‌دهد ریسک‌پذیرانه Deploy کنند تا زمانی که Budget تمام نشده؛ وقتی Error Budget در یک دوره تمام شود، تیم باید موقتاً تمرکز را از قابلیت‌های جدید به پایداری (Reliability Work) منتقل کند - این دقیقاً مکانیزمی است که SRE برای متعادل کردن سرعت توسعه و پایداری استفاده می‌کند، به‌جای بحث ذهنی و احساسی 'آیا این Deploy امن است'. انتخاب SLI درست حیاتی است: SLIهایی که واقعاً تجربهٔ کاربر را نشان می‌دهند (مثل نرخ موفقیت از دید کلاینت، نه فقط سرور) باید انتخاب شوند، نه صرفاً چیزی که اندازه‌گیری آن آسان است.",
objectives:["تعریف SLI/SLO مناسب برای یک API واقعی","محاسبهٔ Error Budget باقی‌مانده در یک دورهٔ زمانی"],
example:"SLO: 99.9٪ درخواست‌های API در ۳۰ روز گذشته باید کد ۲xx/۳xx و زیر ۵۰۰ میلی‌ثانیه باشند؛ Error Budget = 0.1٪ ≈ ۴۳ دقیقه Downtime مجاز در ماه.",
py:"total_requests = 10_000_000\nfailed_requests = 15_000\nslo_target = 0.999\nerror_budget_allowed = total_requests * (1 - slo_target)\nremaining_budget = error_budget_allowed - failed_requests\nprint(f'Error Budget باقی‌مانده: {remaining_budget:.0f} درخواست از {error_budget_allowed:.0f}')",
exercise:"برای یک API با ۵۰ میلیون درخواست در ماه و SLO 99.95٪، Error Budget مجاز را محاسبه کنید و اگر تا امروز (نیمهٔ ماه) ۱۵ هزار درخواست شکست خورده، بررسی کنید آیا Budget در حال تمام شدن است.",
project:"", resources:[{t:"Google SRE Book - Service Level Objectives (رایگان)",u:"https://sre.google/sre-book/service-level-objectives/"},{t:"Google - SRE Workbook (رایگان)",u:"https://sre.google/workbook/table-of-contents/"}],
criteria:"می‌توانید برای یک سرویس واقعی، SLI مناسب انتخاب کنید، یک SLO معقول تعریف کنید و Error Budget را محاسبه و تفسیر کنید.",
interview:["تفاوت SLI، SLO و SLA چیست؟","Error Budget چگونه به تصمیم‌گیری دربارهٔ سرعت Deploy کمک می‌کند؟"],
mistakes:["انتخاب SLI که اندازه‌گیریش آسان است اما تجربهٔ واقعی کاربر را نشان نمی‌دهد (مثل Uptime سرور به‌جای نرخ موفقیت واقعی از دید کلاینت)"],
production:"تیم‌های SRE گوگل و بسیاری شرکت بزرگ، تصمیم 'آیا امروز Deploy کنیم' را مستقیماً بر اساس باقیماندهٔ Error Budget می‌گیرند نه احساس شخصی.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم SLI، SLO، SLA و Error Budget را با مثال یک API واقعی توضیح بده و از من بخواه برای یک سرویس فرضی SLI/SLO مناسب تعریف کنم و Error Budget را محاسبه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"sre-incident-postmortem",title:"مدیریت اینسیدنت و پست‌مورتم بدون سرزنش (Blameless Postmortem)",level:"Advanced",minLadder:4,prereqs:["sre-sli-slo-error-budget"],
short:"چگونه اینسیدنت‌های تولید را مدیریت و از آن‌ها به‌عنوان فرصت یادگیری سیستمی استفاده کنیم.",
deep:"مدیریت اینسیدنت مؤثر نیازمند نقش‌های واضح است: Incident Commander (هماهنگ‌کنندهٔ کلی، تصمیم‌گیرندهٔ نهایی، نه لزوماً کسی که کد را دیباگ می‌کند)، Communications Lead (به‌روزرسانی ذی‌نفعان و مشتریان) و Responderها (کسانی که واقعاً دیباگ می‌کنند)؛ جدا کردن این نقش‌ها از هم مانع می‌شود که یک نفر هم‌زمان دیباگ کند و هم به ۲۰ نفر توضیح دهد. بعد از رفع اینسیدنت، Blameless Postmortem نوشته می‌شود: مستندی که Timeline دقیق (چه زمانی چه اتفاقی افتاد)، Impact (چند کاربر/چقدر درآمد تحت تأثیر بود)، Root Cause (علت ریشه‌ای، نه فقط علامت) و Action Item های مشخص (با مسئول و ضرب‌الاجل) را مستند می‌کند. کلمهٔ 'Blameless' حیاتی است: هدف پیدا کردن 'چه کسی مقصر بود' نیست بلکه 'چرا سیستم (شامل فرآیندها، ابزارها، مستندات) اجازه داد این خطا رخ دهد و به تولید برسد' - چون سرزنش فردی باعث می‌شود افراد اطلاعات را در پست‌مورتم‌های بعدی پنهان کنند و یادگیری سازمانی متوقف شود. یک تکنیک قدرتمند برای رسیدن به Root Cause واقعی (نه فقط علامت سطحی)، روش 5 Whys است: پرسیدن مکرر 'چرا' تا رسیدن به یک علت سیستمی قابل‌اصلاح.",
objectives:["نوشتن یک Blameless Postmortem کامل برای یک اینسیدنت فرضی","استفاده از روش 5 Whys برای رسیدن به Root Cause واقعی"],
example:"اینسیدنت سطحی: 'سرور کرش کرد'. با 5 Whys: چرا کرش کرد؟ حافظه تمام شد. چرا؟ Query Cache بی‌نهایت رشد کرد. چرا؟ TTL تنظیم نشده بود. چرا؟ در Code Review این موضوع بررسی نشد. چرا؟ چک‌لیست Code Review شامل بررسی TTL کش نبود — این علت ریشه‌ای قابل‌اصلاح واقعی است.",
py:"", exercise:"برای یک اینسیدنت فرضی ('API از ساعت ۱۴:۰۰ تا ۱۴:۴۵ خطای ۵۰۰ می‌داد')، یک Blameless Postmortem کامل با Timeline، Impact، 5 Whys و Action Itemهای مشخص بنویسید.",
project:"", resources:[{t:"Google SRE Book - Postmortem Culture (رایگان)",u:"https://sre.google/sre-book/postmortem-culture/"},{t:"PagerDuty - Incident Response documentation (رایگان)",u:"https://response.pagerduty.com/"}],
criteria:"می‌توانید یک Blameless Postmortem کامل بنویسید که با روش 5 Whys به یک علت ریشه‌ای سیستمی (نه فردی) برسد و Action Item های عملی تولید کند.",
interview:["Blameless Postmortem چیست و چرا سرزنش فردی مضر است؟","نقش Incident Commander چیست و چرا باید از Responder جدا باشد؟"],
mistakes:["نوشتن پست‌مورتمی که علت ریشه‌ای را در 'خطای فلان مهندس' خلاصه می‌کند به‌جای بررسی چرا سیستم/فرآیند اجازهٔ آن خطا را داد"],
production:"فرهنگ Blameless Postmortem مستقیماً کیفیت گزارش‌دهی داخلی و سرعت یادگیری سازمانی از اینسیدنت‌ها را تعیین می‌کند؛ سازمان‌هایی با فرهنگ سرزنش، اینسیدنت‌های تکراری بیشتری دارند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدیریت اینسیدنت (نقش‌ها، Incident Commander) و نگارش Blameless Postmortem با روش 5 Whys را آموزش بده. یک سناریوی اینسیدنت واقعی طراحی کن که من پست‌مورتم کامل آن را بنویسم و بازخورد بده آیا به علت ریشهٔ واقعی سیستمی رسیده‌ام یا فقط علامت سطحی را نوشته‌ام. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p40",num:40,title:"مشاهده‌پذیری",icon:"📊",summary:"سه ستون Observability: متریک (Prometheus/Grafana)، لاگ و ردیابی توزیع‌شده (OpenTelemetry).",
topics:[
{id:"observability-three-pillars",title:"سه ستون Observability: Metrics، Logs، Traces",level:"Advanced",minLadder:4,prereqs:["sre-incident-postmortem"],
short:"چگونه رفتار داخلی یک سیستم توزیع‌شده را بدون افزودن کد دیباگ جدید هر بار قابل مشاهده کنیم.",
deep:"Metrics اعداد تجمیع‌شده در طول زمان هستند (مثل تعداد درخواست، تأخیر p99، نرخ خطا) که برای Dashboard و Alerting مناسب‌اند اما جزئیات یک درخواست خاص را نشان نمی‌دهند؛ Prometheus با مدل Pull (خودش هر چند ثانیه Metricها را از یک Endpoint /metrics هر سرویس می‌کشد) و یک زبان کوئری قدرتمند (PromQL) استاندارد صنعتی است، Grafana لایهٔ بصری‌سازی (Dashboard) روی آن است. Logs رویدادهای گسسته با جزئیات کامل هستند (مثلاً 'کاربر ۴۲ سفارش ۱۰۰ ساخت')؛ Structured Logging (لاگ به فرمت JSON با فیلدهای مشخص به‌جای متن آزاد) امکان جستجو و فیلتر دقیق را می‌دهد. Traces مسیر کامل یک درخواست را در طول عبور از چند سرویس (مثل API Gateway → Order Service → Payment Service → Database) با یک Correlation ID مشترک (Trace ID) دنبال می‌کنند و برای دیباگ Latency در سیستم توزیع‌شده حیاتی‌اند - بدون Trace، فهمیدن اینکه کدام سرویس مسئول ۸۰٪ تأخیر یک درخواست کند بوده تقریباً غیرممکن است. OpenTelemetry استاندارد یکپارچهٔ جمع‌آوری هر سه (با یک SDK واحد) است که به Vendor Lock-in کمتر منجر می‌شود. Golden Signals (Latency، Traffic، Errors، Saturation) و RED Method (Rate، Errors، Duration برای سرویس‌ها) و USE Method (Utilization، Saturation، Errors برای منابع) چارچوب‌های استاندارد برای اینکه بدانیم دقیقاً چه چیزی را باید مانیتور کرد.",
objectives:["راه‌اندازی یک Metric سفارشی در Django با Prometheus client","توضیح چرا Trace ID برای دیباگ Latency توزیع‌شده ضروری است"],
example:"REQUEST_LATENCY = Histogram('http_request_duration_seconds', 'زمان پاسخ درخواست', ['endpoint'])\nبا PromQL: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) تأخیر p99 پنج‌دقیقهٔ اخیر را می‌دهد.",
py:"from prometheus_client import Histogram, Counter\nimport time\n\nREQUEST_LATENCY = Histogram('http_request_duration_seconds', 'زمان پاسخ', ['endpoint'])\nREQUEST_COUNT = Counter('http_requests_total', 'تعداد کل درخواست', ['endpoint', 'status'])\n\ndef instrumented_view(request):\n    start = time.time()\n    try:\n        response = actual_view(request)\n        REQUEST_COUNT.labels(endpoint='/api/orders', status=response.status_code).inc()\n        return response\n    finally:\n        REQUEST_LATENCY.labels(endpoint='/api/orders').observe(time.time() - start)",
exercise:"یک Middleware Django بسازید که برای هر درخواست، Metricهای Counter (تعداد) و Histogram (تأخیر) را با برچسب endpoint/status ثبت کند، سپس با Prometheus آن‌ها را جمع‌آوری و در Grafana یک Dashboard ساده بسازید.",
project:"پیاده‌سازی کامل Observability برای یک API Django: Metrics با Prometheus+Grafana، Structured Logging با JSON، و Distributed Tracing با OpenTelemetry بین دو سرویس شبیه‌سازی‌شده.",

deep:"Redundancy (افزونگی) اصل بنیادین در دسترس بودن بالاست: هیچ Single Point of Failure (نقطهٔ تکی شکست) نباید وجود داشته باشد - اگر یک سرور، یک Availability Zone یا حتی یک منطقهٔ جغرافیایی از کار بیفتد، سیستم باید ادامه کار دهد. Multi-AZ به‌معنای پخش منابع (دیتابیس، اپلیکیشن) بین چند Availability Zone مستقل درون یک منطقه (که خرابی برق/شبکهٔ مستقل دارند اما تأخیر شبکهٔ بسیار کم بین‌شان است) است - این سطح معمول برای اکثر سیستم‌ها کافی است. Multi-Region برای تحمل خرابی کامل یک منطقهٔ جغرافیایی (نادر اما فاجعه‌بار) یا کاهش Latency برای کاربران جهانی است، اما پیچیدگی زیادی می‌آورد (Replication بین مناطق با Latency بالاتر، تصمیمات سازگاری سخت‌تر طبق CAP). Automatic Failover (مثلاً با ابزارهایی مثل Patroni برای PostgreSQL یا قابلیت‌های داخلی Cloud) نیازمند Health Check دقیق و مکانیزم انتخاب Leader جدید (شبیه به بحث Consensus/Raft) است - یک ریسک واقعی، Split-Brain است: اگر مکانیزم Failover به اشتباه تشخیص دهد Primary از کار افتاده در حالی که فقط شبکه قطع شده، ممکن است دو Primary هم‌زمان فعال شوند که فساد داده ایجاد می‌کند. Graceful Degradation یعنی وقتی بخشی از سیستم (مثلاً سرویس توصیه‌گر) از کار می‌افتد، به‌جای خطای کامل، سیستم با قابلیت کاهش‌یافته (مثلاً بدون بخش پیشنهادات، اما بقیهٔ صفحه کار می‌کند) ادامه دهد - این نیازمند Timeout و Circuit Breaker مناسب روی هر وابستگی غیرحیاتی است.",

ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. اصول Chaos Engineering (فرضیه، Blast Radius، آزمایش کنترل‌شده) را با مثال Circuit Breaker از فازهای قبلی توضیح بده. یک فرضیهٔ آزمایش‌پذیر برای یک سیستم فرضی بده تا آزمایش Chaos آن را طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p44",num:44,title:"معماری رویدادمحور",icon:"⚡",summary:"Event Sourcing، CQRS، Transactional Outbox و CDC.",
topics:[
{id:"eda-outbox-cqrs",title:"الگوی Transactional Outbox و CQRS",level:"Expert",minLadder:5,prereqs:["kafka-partitions-consumer-groups","db-acid-isolation"],
short:"چگونه به‌طور قابل‌اعتماد هم دیتابیس را به‌روزرسانی و هم یک رویداد منتشر کنیم، بدون ناسازگاری.",
deep:"مشکل کلاسیک 'نوشتن دوگانه' (Dual Write): اگر یک سرویس ابتدا در تراکنش دیتابیس تغییری اعمال کند و سپس جداگانه یک پیام به Kafka/RabbitMQ منتشر کند، این دو عملیات Atomic نیستند - اگر بین این دو مرحله سرویس کرش کند، یا دیتابیس تغییر می‌کند اما پیام هرگز منتشر نمی‌شود (ناسازگاری) یا برعکس. الگوی Transactional Outbox این را حل می‌کند: به‌جای انتشار مستقیم پیام، رکورد پیام در همان تراکنش دیتابیسی (در یک جدول outbox) درج می‌شود - چون این در همان تراکنش ACID با تغییر اصلی است، هر دو با هم Commit یا هر دو Rollback می‌شوند؛ سپس یک فرآیند جداگانه (Message Relay، اغلب با Debezium و CDC یعنی Change Data Capture از WAL) رکوردهای جدول outbox را می‌خواند و به Kafka منتشر می‌کند، با تضمین at-least-once (پس Consumer باید Idempotent باشد، طبق اصلی که قبلاً دیدیم). CQRS (Command Query Responsibility Segregation) مدل نوشتن (Command، بهینه‌شده برای سازگاری و منطق کسب‌وکار) را از مدل خواندن (Query، اغلب یک View دنرمال‌شده و بهینه برای سرعت خواندن، که از طریق همین رویدادها به‌روز می‌ماند) جدا می‌کند - این برای سیستم‌هایی که الگوی خواندن و نوشتن‌شان بسیار متفاوت است (مثل داشبورد گزارش‌گیری سنگین کنار یک سیستم تراکنشی) مفید است، اما پیچیدگی Eventual Consistency بین دو مدل را اضافه می‌کند.",
objectives:["پیاده‌سازی الگوی Transactional Outbox برای انتشار رویداد قابل‌اعتماد","توضیح چرا CQRS منجر به Eventual Consistency بین مدل نوشتن و خواندن می‌شود"],
example:"در همان تراکنش ثبت سفارش، یک رکورد در جدول outbox_events با payload رویداد 'OrderCreated' درج می‌شود؛ یک Worker جداگانه این جدول را می‌خواند و به Kafka می‌فرستد.",
py:"from django.db import transaction\n\n@transaction.atomic\ndef create_order(customer, items):\n    order = Order.objects.create(customer=customer)\n    for item in items:\n        OrderItem.objects.create(order=order, **item)\n    OutboxEvent.objects.create(\n        event_type='OrderCreated',\n        payload={'order_id': order.id, 'total': order.total()}\n    )  # همان تراکنش، همان اتمیسیتی\n    return order",
exercise:"یک مدل OutboxEvent در Django بسازید، تابع create_order بالا را پیاده‌سازی کنید، و یک Management Command بنویسید که رکوردهای منتشرنشدهٔ outbox را بخواند و (شبیه‌سازی‌شده) به یک 'صف' منتقل کند و به‌عنوان منتشرشده علامت بزند.",
project:"سیستم سفارش با Transactional Outbox کامل که رویداد OrderCreated را به‌صورت قابل‌اعتماد به یک Consumer مستقل (سرویس اعلان) می‌رساند، حتی اگر سرویس اصلی بین ثبت سفارش و انتشار واقعی کرش کند.",
resources:[{t:"microservices.io - Transactional Outbox pattern",u:"https://microservices.io/patterns/data/transactional-outbox.html"},{t:"Debezium docs - Outbox Event Router",u:"https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html"},{t:"Martin Fowler - CQRS",u:"https://martinfowler.com/bliki/CQRS.html"}],
criteria:"می‌توانید الگوی Transactional Outbox را برای اطمینان از سازگاری بین تغییر دیتابیس و انتشار رویداد پیاده‌سازی کنید و توضیح دهید چرا 'نوشتن دوگانه' ساده مشکل‌ساز است.",
interview:["مشکل Dual Write چیست و Transactional Outbox چگونه آن را حل می‌کند؟","CQRS چه مصالحه‌ای (Eventual Consistency) به همراه دارد؟"],
mistakes:["انتشار مستقیم پیام به Kafka بلافاصله بعد از commit تراکنش دیتابیس (نه در همان تراکنش) که همچنان پنجرهٔ کوچکی از ناسازگاری در صورت کرش باقی می‌گذارد"],
production:"بسیاری از ناسازگاری‌های 'رویداد گم‌شده' در سیستم‌های Event-Driven واقعی، ریشه در Dual Write ساده به‌جای الگوی Outbox دارند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مشکل Dual Write و راه‌حل آن با الگوی Transactional Outbox، همچنین مفهوم CQRS را عمیق توضیح بده. کمکم کن یک مدل OutboxEvent و Management Command مربوطه را در Django پیاده‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p45",num:45,title:"مهندسی داده",icon:"📊",summary:"ETL/ELT، پردازش دسته‌ای/جریانی و انبار داده، تا حد نیاز یک بک‌اند ارشد.",
topics:[
{id:"data-eng-etl-cdc",title:"ETL/ELT و Change Data Capture (CDC)",level:"Intermediate",minLadder:2,prereqs:["eda-outbox-cqrs"],
short:"چگونه داده از سیستم‌های تراکنشی به انبار داده برای تحلیل منتقل می‌شود.",
deep:"ETL (Extract, Transform, Load) داده را از منبع استخراج می‌کند، قبل از بارگذاری تبدیل می‌کند (تمیزکاری، تجمیع) و در انبار داده ذخیره می‌کند - رایج در معماری سنتی با منابع محدود پردازش انبار. ELT (Extract, Load, Transform) خام داده را ابتدا بارگذاری می‌کند و تبدیل را درون خود انبار داده (که امروزه با موتورهای قدرتمند مثل Snowflake/BigQuery قدرت پردازش بالایی دارند) انجام می‌دهد - این الگوی مدرن‌تر انعطاف بیشتری می‌دهد چون داده خام همیشه در دسترس است برای تبدیل‌های جدید بعدی. Change Data Capture (CDC) به‌جای Batch Job های دوره‌ای که کل جدول را می‌خوانند (که برای جداول بزرگ کند و پرهزینه است)، تغییرات را به‌صورت Real-time مستقیم از WAL/Binlog دیتابیس می‌خواند (با ابزارهایی مثل Debezium) و به یک Stream (Kafka) منتشر می‌کند - این هم بار دیتابیس منبع را کاهش می‌دهد (چون دیگر Query سنگین دوره‌ای لازم نیست) و هم داده را تقریباً بلادرنگ به مصرف‌کنندگان (انبار داده، Cache، سرویس‌های دیگر) می‌رساند. برای مهندس بک‌اند ارشد، فهم این‌که CDC چگونه از همان WAL که برای Replication و Durability استفاده می‌شود بهره می‌برد (موضوعی که قبلاً در بحث PostgreSQL دیدیم)، پل مفهومی بین دیتابیس عملیاتی و دنیای مهندسی داده است.",
objectives:["توضیح تفاوت ETL و ELT","توضیح چرا CDC کارآمدتر از Batch Extraction دوره‌ای است"],
example:"Debezium یک Kafka Connector است که مستقیماً WAL دیتابیس PostgreSQL را می‌خواند و هر INSERT/UPDATE/DELETE را به‌عنوان یک رویداد به Kafka منتشر می‌کند.",
py:"", exercise:"معماری یک پایپ‌لاین CDC را طراحی کنید: PostgreSQL → Debezium → Kafka → مصرف‌کننده‌ای که جدول یک انبار داده را به‌روز نگه می‌دارد. توضیح دهید این چگونه با Batch ETL شبانه متفاوت است.",
project:"", resources:[{t:"Debezium docs",u:"https://debezium.io/documentation/reference/stable/index.html"},{t:"Fivetran - ETL vs ELT (توضیح مفهومی رایگان)",u:"https://www.fivetran.com/learn/etl-vs-elt"}],
criteria:"می‌توانید معماری یک پایپ‌لاین CDC از دیتابیس عملیاتی به یک مصرف‌کنندهٔ تحلیلی را طراحی و توجیه کنید.",
interview:["تفاوت ETL و ELT چیست؟","CDC چگونه کار می‌کند و چه مزیتی نسبت به Query دوره‌ای دارد؟"],
mistakes:["اجرای Query سنگین تحلیلی مستقیماً روی دیتابیس تراکنشی تولید که منابع آن را برای ترافیک واقعی کاربران مصرف می‌کند"],
production:"اجرای مستقیم گزارش‌گیری سنگین روی دیتابیس تولید (به‌جای Replica جداگانه یا انبار داده) یکی از رایج‌ترین دلایل کندی ناگهانی API در ساعات خاص (مثل پایان روز کاری) است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ETL در برابر ELT و مفهوم Change Data Capture (با Debezium) را با تمرکز بر ارتباط با WAL دیتابیس که قبلاً یاد گرفتم توضیح بده. کمکم کن معماری یک پایپ‌لاین CDC ساده طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p46",num:46,title:"جستجو",icon:"🔍",summary:"ایندکس معکوس، تحلیلگرها، Relevance (BM25) و معماری Elasticsearch.",
topics:[
{id:"search-inverted-index-bm25",title:"ایندکس معکوس، تحلیلگرها و رتبه‌بندی BM25",level:"Advanced",minLadder:4,prereqs:["ds-hash-table"],
short:"چگونه موتورهای جستجو میلیون‌ها سند را در میلی‌ثانیه بر اساس Relevance رتبه‌بندی می‌کنند.",
deep:"ایندکس معکوس (Inverted Index) برخلاف یک ایندکس معمولی دیتابیس که سند را به کلمات نگاشت می‌دهد (Forward Index)، هر کلمه (Term) را به لیست اسنادی که آن کلمه در آن‌ها وجود دارد نگاشت می‌دهد؛ این ساختار جستجوی 'کدام اسناد شامل این کلمه هستند' را در O(1) یا نزدیک به آن ممکن می‌کند به‌جای اسکن کل مجموعه اسناد. قبل از ساخت ایندکس، متن از Analyzer عبور می‌کند: Tokenization (شکستن متن به کلمات)، Lowercasing، حذف Stop Words (کلمات پرتکرار بی‌معنی مثل 'the'، 'و') و Stemming/Lemmatization (تبدیل کلمات به ریشه، مثل 'running' به 'run') تا جستجو مستقل از شکل دقیق کلمه کار کند. برای رتبه‌بندی نتایج بر اساس ارتباط (Relevance)، الگوریتم BM25 (جانشین مدرن TF-IDF) استفاده می‌شود: TF (Term Frequency) می‌گوید کلمهٔ جستجوشده چند بار در سند تکرار شده (اما با اشباع، یعنی تکرار ۱۰۰ بار خیلی بهتر از ۱۰ بار نیست)، IDF (Inverse Document Frequency) می‌گوید کلماتی که در همهٔ اسناد رایج‌اند (مثل 'است') وزن کمتری در تشخیص Relevance دارند نسبت به کلمات نادر و مشخص. Elasticsearch/OpenSearch این مفاهیم را با یک معماری توزیع‌شده (Shard و Replica، مشابه مفاهیمی که در Sharding دیدیم) در مقیاس میلیارد سندی پیاده‌سازی می‌کنند.",
objectives:["توضیح مکانیزم ایندکس معکوس و چرا سریع‌تر از LIKE '%...%' در دیتابیس رابطه‌ای است","توضیح اجزای BM25 (TF و IDF) و نقش هرکدام"],
example:"جستجوی 'گوشی سامسونگ ارزان' در یک فروشگاه آنلاین، اسنادی که همهٔ سه کلمه را دارند و 'سامسونگ' (نادرتر) در آن‌ها تکرار بیشتری دارد، رتبهٔ بالاتری می‌گیرند تا صرفاً اسنادی با کلمهٔ پرتکرار 'ارزان'.",
py:"# مثال بسیار ساده‌شدهٔ ساخت ایندکس معکوس\nfrom collections import defaultdict\n\ndef build_inverted_index(documents):\n    index = defaultdict(set)\n    for doc_id, text in documents.items():\n        for word in text.lower().split():\n            index[word].add(doc_id)\n    return index\n\ndocs = {1: 'گوشی سامسونگ ارزان', 2: 'لپ‌تاپ سامسونگ گران'}\nindex = build_inverted_index(docs)\nprint(index['سامسونگ'])  # {1, 2}",
exercise:"با تابع بالا یک ایندکس معکوس ساده روی ۱۰ سند متنی بسازید و یک تابع جستجوی چندکلمه‌ای (اشتراک مجموعه‌ها) بنویسید که اسناد حاوی همهٔ کلمات را برگرداند.",
project:"راه‌اندازی Elasticsearch محلی، ایندکس کردن یک مجموعه دادهٔ نمونه (مثل محصولات فروشگاه)، و ساخت یک API جستجو در Django که با کوئری‌های match و پاسخ‌های امتیازدهی‌شده کار کند.",
resources:[{t:"Elasticsearch docs - Inverted index",u:"https://www.elastic.co/guide/en/elasticsearch/reference/current/index.html"},{t:"Elasticsearch docs - BM25 relevance",u:"https://www.elastic.co/guide/en/elasticsearch/guide/current/scoring-theory.html"}],
criteria:"می‌توانید یک ایندکس معکوس ساده در پایتون بسازید و توضیح دهید BM25 چگونه تکرار کلمه و نادر بودن آن را در امتیاز ترکیب می‌کند.",
interview:["ایندکس معکوس چیست و چرا برای جستجوی متنی از LIKE در SQL بهتر است؟","TF-IDF/BM25 چگونه Relevance را محاسبه می‌کند؟"],
mistakes:["استفاده از LIKE '%keyword%' در PostgreSQL برای جستجوی متنی روی جدول بزرگ که نمی‌تواند از ایندکس معمولی B-Tree به‌طور کامل بهره ببرد و کند است"],
production:"جستجوی محصول در فروشگاه‌های بزرگ آنلاین همیشه روی Elasticsearch/OpenSearch ساخته می‌شود نه کوئری LIKE مستقیم روی دیتابیس اصلی.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم ایندکس معکوس، Analyzer (Tokenization/Stemming) و رتبه‌بندی BM25 را عمیق توضیح بده. کمکم کن یک ایندکس معکوس سادهٔ پایتونی بسازم و بعد با Elasticsearch واقعی مقایسه‌اش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p47",num:47,title:"سیستم‌های بلادرنگ",icon:"💬",summary:"WebSocket، SSE، Pub/Sub و معماری چت/اعلان.",
topics:[
{id:"realtime-websocket-presence",title:"WebSocket، Django Channels و مدیریت Presence",level:"Advanced",minLadder:4,prereqs:["wsgi-asgi","redis-data-structures"],
short:"چگونه ارتباط دوطرفهٔ بلادرنگ (مثل چت) را در Django پیاده‌سازی و در چند سرور مقیاس دهیم.",
deep:"WebSocket برخلاف HTTP معمولی، یک اتصال دوطرفهٔ پایدار (Full-duplex) روی یک اتصال TCP باز نگه می‌دارد که هم سرور و هم کلاینت می‌توانند در هر لحظه پیام بفرستند، بدون نیاز به Polling مکرر - ایده‌آل برای چت، اعلان بلادرنگ یا داشبورد زنده. Django Channels این قابلیت را با معماری ASGI به Django اضافه می‌کند: هر اتصال WebSocket یک Consumer (مشابه View اما برای پیام‌های async) دارد. چالش اصلی مقیاس‌پذیری: وقتی چند سرور Django Channels دارید، اتصال WebSocket کاربر A به سرور ۱ وصل است اما پیامی که باید به او برسد ممکن است از سرور ۲ (که کاربر دیگری در آن فعالیت کرده) تولید شود - راه‌حل، یک Channel Layer مشترک (معمولاً Redis Pub/Sub) است که پیام را بین تمام سرورها پخش می‌کند تا سروری که واقعاً اتصال کاربر مقصد را دارد، آن را به WebSocket برساند. Presence (نشان دادن 'کاربر آنلاین است') با نگه‌داشتن یک کلید در Redis با TTL کوتاه (که هر چند ثانیه توسط یک Heartbeat از کلاینت تمدید می‌شود) پیاده می‌شود؛ اگر Heartbeat قطع شود (کاربر آفلاین شده یا اتصال قطع شده)، کلید منقضی می‌شود و سیستم بدون نیاز به دریافت پیام صریح 'قطع اتصال' (که ممکن است هرگز نرسد، مثلاً موبایل خاموش شد) کاربر را آفلاین تشخیص می‌دهد.",
objectives:["پیاده‌سازی یک Consumer چت ساده با Django Channels","توضیح نقش Redis Channel Layer در معماری چندسروری WebSocket"],
example:"# routing.py\nwebsocket_urlpatterns = [path('ws/chat/<room_name>/', ChatConsumer.as_asgi())]",
py:"from channels.generic.websocket import AsyncWebsocketConsumer\nimport json\n\nclass ChatConsumer(AsyncWebsocketConsumer):\n    async def connect(self):\n        self.room_group_name = f'chat_{self.scope[\"url_route\"][\"kwargs\"][\"room_name\"]}'\n        await self.channel_layer.group_add(self.room_group_name, self.channel_name)\n        await self.accept()\n\n    async def receive(self, text_data):\n        data = json.loads(text_data)\n        await self.channel_layer.group_send(self.room_group_name, {'type': 'chat_message', 'message': data['message']})\n\n    async def chat_message(self, event):\n        await self.send(text_data=json.dumps({'message': event['message']}))",
exercise:"با کد بالا یک اتاق چت ساده بسازید که چند کاربر بتوانند از طریق مرورگر (با یک HTML ساده حاوی new WebSocket) با هم چت کنند؛ سپس دو نمونهٔ سرور Django را با یک Redis Channel Layer مشترک اجرا کنید و نشان دهید پیام بین سرورها منتقل می‌شود.",
project:"سیستم چت کامل با Django Channels، Redis Channel Layer، مدیریت Presence (آنلاین/آفلاین) و تاریخچهٔ پیام ذخیره‌شده در PostgreSQL.",
resources:[{t:"Django Channels docs",u:"https://channels.readthedocs.io/en/latest/"},{t:"MDN - WebSocket API",u:"https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API"}],
criteria:"می‌توانید یک سیستم چت چندنفره با Django Channels بسازید که در معماری چندسروری (با Redis Channel Layer) به‌درستی کار کند.",
interview:["تفاوت WebSocket و Server-Sent Events (SSE) چیست و هرکدام کِی مناسب‌ترند؟","چرا در معماری چندسروری WebSocket به یک Channel Layer مشترک نیاز داریم؟"],
mistakes:["فراموش کردن Channel Layer مشترک که باعث می‌شود پیام فقط بین کاربران متصل به همان سرور مشخص کار کند (به‌ظاهر در تست تک‌سروری کار می‌کند اما در تولید چندسروری می‌شکند)"],
production:"بسیاری از باگ‌های 'چت فقط گاهی کار می‌کند' در تولید ریشه در نبود یا پیکربندی نادرست Channel Layer مشترک در معماری چندسروری دارند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری WebSocket با Django Channels، نقش Redis Channel Layer در مقیاس‌پذیری چندسروری و مدیریت Presence را توضیح بده. کمکم کن یک سیستم چت ساده بسازم و سناریوی 'پیام بین سرورها منتقل نمی‌شود' را دیباگ کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p48",num:48,title:"شیوه‌های مهندسی",icon:"📝",summary:"کد تمیز، Code Review، ADR/RFC و مدیریت بدهی فنی.",
topics:[
{id:"eng-practices-adr-review",title:"Architecture Decision Record (ADR) و Code Review مؤثر",level:"Intermediate",minLadder:2,prereqs:["clean-architecture-ddd"],
short:"چگونه تصمیمات معماری را مستند کنیم و بازبینی کد را به ابزار یادگیری تیمی تبدیل کنیم نه صرفاً دروازهٔ Merge.",
deep:"ADR (Architecture Decision Record) یک سند کوتاه (معمولاً یک صفحه) است که یک تصمیم معماری مهم را مستند می‌کند: Context (چه مشکلی حل می‌شد و چه محدودیت‌هایی وجود داشت)، Decision (چه تصمیمی گرفته شد)، Alternatives Considered (چه گزینه‌های دیگری بررسی و چرا رد شدند) و Consequences (چه مصالحه‌هایی پذیرفته شد). بدون ADR، شش ماه بعد هیچ‌کس (حتی نویسندهٔ اصلی) به یاد نمی‌آورد چرا مثلاً MongoDB به‌جای PostgreSQL انتخاب شد، و ریسک این وجود دارد که همان بحث از صفر دوباره تکرار شود یا تصمیم اشتباه بدون فهم Context اصلی معکوس شود. Code Review مؤثر فراتر از پیدا کردن باگ نحوی است: باید بررسی کند آیا طراحی با اصول تیم (مثل SOLID، مرزهای معماری) همسو است، آیا تست کافی وجود دارد، و آیا کد برای یک عضو جدید تیم قابل فهم است - اما باید از Nitpicking بیش از حد (تمرکز روی جزئیات سبک کدنویسی که با ابزارهای خودکار مثل linter/formatter باید حل شوند نه بحث انسانی) پرهیز کرد. بازخورد باید Actionable (قابل اقدام مشخص) و محترمانه باشد؛ تفاوت گذاشتن بین 'این یک مشکل جدی است' و 'این یک پیشنهاد اختیاری است' (مثلاً با پیشوندهایی مثل nit: یا blocking:) ارتباط را شفاف‌تر می‌کند.",
objectives:["نوشتن یک ADR کامل برای یک تصمیم معماری واقعی","ارائهٔ بازخورد Code Review که هم دقیق و هم محترمانه باشد"],
example:"ADR-007: انتخاب PostgreSQL به‌جای MongoDB برای سرویس سفارش. Context: نیاز به تراکنش ACID بین چند جدول مرتبط. Decision: PostgreSQL. Alternatives: MongoDB (رد شد چون تراکنش چندسندی پیچیده‌تر بود).",
py:"", exercise:"برای یک تصمیم معماری واقعی که اخیراً در پروژهٔ خودتان گرفته‌اید (یا فرضی، مثل انتخاب Celery به‌جای Kafka برای صف تسک ساده)، یک ADR کامل با چهار بخش بنویسید.",
project:"", resources:[{t:"ADR GitHub organization (نمونه‌ها و ابزار رایگان)",u:"https://adr.github.io/"},{t:"Google Engineering Practices - Code Review",u:"https://google.github.io/eng-practices/review/"}],
criteria:"می‌توانید یک ADR کامل و قابل‌فهم برای یک تصمیم معماری بنویسید و یک بازخورد Code Review actionable و محترمانه ارائه دهید.",
interview:["ADR چیست و چه مشکلی را حل می‌کند؟","چطور بین بازخورد 'الزامی' و 'اختیاری' در Code Review تمایز قائل می‌شوید؟"],
mistakes:["ندادن دلیل رد شدن گزینه‌های جایگزین در ADR، که باعث می‌شود بعداً همان بحث بدون دانستن چرایی رد قبلی دوباره مطرح شود"],
production:"تیم‌های بزرگ مهندسی (Google، AWS) به‌طور رسمی از ADR و سند طراحی قبل از پیاده‌سازی تغییرات معماری بزرگ استفاده می‌کنند تا از تصمیم‌گیری‌های عجولانه جلوگیری شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم ADR و اصول Code Review مؤثر را توضیح بده. یک تصمیم معماری فرضی بده تا یک ADR کامل بنویسم، و یک قطعه کد با چند مشکل بده تا بازخورد Code Review دقیق و محترمانه بنویسم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p49",num:49,title:"مهارت دیباگ",icon:"🐞",summary:"سناریوهای واقعی اینسیدنت: CPU 100%، نشت حافظه، Connection Pool Exhaustion و بیشتر.",
topics:[
{id:"debug-cpu-100-connection-exhaustion",title:"سناریوی دیباگ: CPU ناگهان به ۱۰۰٪ می‌رسد و Connection Pool تمام می‌شود",level:"Expert",minLadder:5,prereqs:["linux-process-tools","perf-profiling","db-query-planner"],
short:"یک اینسیدنت واقع‌گرایانهٔ ترکیبی که نیازمند ترکیب چند مهارت دیباگ (Linux، پروفایلینگ، دیتابیس) است.",
deep:"سناریو: ساعت ۱۴:۳۰، Dashboard مانیتورینگ نشان می‌دهد CPU سرورهای اپلیکیشن به ۱۰۰٪ رسیده و کاربران گزارش خطای 'connection pool exhausted' می‌دهند. روند تحقیق سیستماتیک: (۱) با top/htop مشخص می‌شود آیا CPU توسط پروسه‌های Python (Gunicorn Worker) یا فرآیندی دیگر (مثل یک Backup ناخواسته) اشغال شده؛ (۲) اگر Workerها مقصرند، با py-spy dump --pid به یکی از آن‌ها متصل می‌شویم تا ببینیم دقیقاً کدام تابع در حال اجراست - فرض کنیم نتیجه نشان می‌دهد اکثر Workerها در حال اجرای یک متد سریالایزیشن پیچیده روی یک Queryset بزرگ هستند؛ (۳) با بررسی لاگ‌های اخیر Deploy، معلوم می‌شود یک تغییر کد اخیر یک select_related را حذف کرده، که یک N+1 Query شدید ایجاد کرده (این را با EXPLAIN ANALYZE و pg_stat_activity در دیتابیس تأیید می‌کنیم - تعداد کوئری‌های فعال ناگهان بالا رفته)؛ (۴) این یعنی هر Worker به‌جای پردازش سریع، اکنون صدها کوئری کوچک برای هر درخواست می‌زند که هم CPU (سریالایزیشن نتایج بیشتر) و هم Connection Pool دیتابیس (چون هر کوئری یک Connection را برای مدت طولانی‌تر اشغال می‌کند) را تحت فشار می‌گذارد؛ رفع فوری: Rollback فوری Deploy اخیر (اقدام تسکین‌دهنده)؛ رفع ریشه‌ای: بازگرداندن select_related و افزودن یک تست Regression که تعداد کوئری‌ها را برای این Endpoint اندازه‌گیری و در صورت افزایش غیرمنتظره Fail می‌کند.",
objectives:["اجرای فرآیند سیستماتیک تشخیص از علائم تا علت ریشه‌ای برای یک اینسیدنت چندلایه","نوشتن یک تست Regression که از بازگشت N+1 Query جلوگیری کند"],
example:"pg_stat_activity در PostgreSQL نشان می‌دهد تعداد کانکشن‌های active از ۱۰ به ۹۵ (نزدیک max_connections) در عرض چند دقیقه رسیده - نشانهٔ واضح یک تغییر کد اخیر.",
py:"# تست Regression برای جلوگیری از بازگشت N+1\nimport pytest\nfrom django.test.utils import CaptureQueriesContext\nfrom django.db import connection\n\n@pytest.mark.django_db\ndef test_order_list_query_count_is_constant():\n    from myapp.models import Order, Customer\n    customer = Customer.objects.create(name='test')\n    for _ in range(20):\n        Order.objects.create(customer=customer, total=100)\n    with CaptureQueriesContext(connection) as ctx:\n        response = client.get('/api/orders/')\n    assert len(ctx.captured_queries) < 5  # صرف‌نظر از تعداد سفارش‌ها، تعداد کوئری ثابت باید بماند",
exercise:"سناریوی بالا را به‌صورت مکتوب کامل کنید: علائم، فرضیه‌های اول تا آخر (شامل فرضیه‌های رد‌شده)، دستورات دقیق استفاده‌شده در هر مرحله، علت ریشه‌ای، رفع فوری، رفع ریشه‌ای و اقدام پیشگیرانه.",
project:"", resources:[{t:"PostgreSQL docs - pg_stat_activity",u:"https://www.postgresql.org/docs/current/monitoring-stats.html"},{t:"py-spy (GitHub)",u:"https://github.com/benfred/py-spy"}],
criteria:"می‌توانید یک اینسیدنت ترکیبی (CPU + Connection Pool) را با ترتیب صحیح ابزارها (top → py-spy → pg_stat_activity → EXPLAIN) از علامت تا علت ریشه‌ای دنبال کنید و اقدام پیشگیرانه (تست Regression) طراحی کنید.",
interview:["اگر CPU سرورهای اپلیکیشن ناگهان ۱۰۰٪ شود و کاربران خطای connection pool ببینند، دقیقاً چه مراحلی را طی می‌کنید؟"],
mistakes:["ری‌استارت سریع سرورها بدون بررسی علت ریشه‌ای که مشکل را موقتاً پنهان می‌کند اما ساعتی بعد دوباره ظاهر می‌شود"],
production:"این دقیقاً الگوی یک اینسیدنت واقعی رایج در تیم‌های Django است که معمولاً ریشه در یک Deploy اخیر بدون Review کافی روی تعداد کوئری‌ها دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. یک سناریوی کامل اینسیدنت 'CPU 100٪ و Connection Pool Exhaustion' طراحی کن، فقط علائم اولیه را به من بده (نه علت)، و من را قدم‌به‌قدم (top → py-spy → pg_stat_activity → کد) در فرآیند تشخیص راهنمایی کن، فقط بعد از هر فرضیهٔ من بازخورد بده که آیا این آزمایش می‌تواند فرضیه را رد یا تأیید کند. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p50",num:50,title:"کیفیت کد",icon:"💎",summary:"خوانایی، Coupling/Cohesion، طراحی خطا و سازگاری با گذشته.",
topics:[
{id:"code-quality-error-handling",title:"طراحی مدیریت خطا (Exception Design) و خوانایی کد",level:"Intermediate",minLadder:2,prereqs:["solid-principles"],
short:"چگونه استثناها را طوری طراحی کنیم که خطاها معنادار، قابل‌ردیابی و قابل‌مدیریت باشند.",
deep:"یک اشتباه رایج، استفاده از استثناهای عمومی (Exception, ValueError برای همه‌چیز) است که مدیریت انتخابی خطا را غیرممکن می‌کند - کلاینت کد نمی‌تواند تشخیص دهد آیا خطا یک مشکل موقتی قابل Retry است یا یک خطای دائمی کسب‌وکاری. طراحی خوب، سلسله‌مراتب استثنای دامنه‌محور می‌سازد (مثلاً InsufficientFundsError(PaymentError) و ExternalGatewayTimeoutError(PaymentError)) که به کد فراخوان اجازه می‌دهد با except دقیق، رفتار متفاوت (Retry برای Timeout، پیام کاربر برای موجودی ناکافی) اعمال کند. یک اصل مهم: 'Never Swallow Exceptions Silently' - گرفتن except Exception: pass بدون لاگ، دقیقاً یکی از مخرب‌ترین الگوهای کد است چون خطا بی‌صدا ناپدید می‌شود و ردیابی بعدی آن تقریباً غیرممکن است. خوانایی کد به‌معنای این است که یک مهندس دیگر (یا خودتان شش ماه بعد) بتواند بدون کامنت اضافی منظور کد را بفهمد - نام‌گذاری واضح (تابعی به نام calculate_total به‌جای process، متغیری به نام is_eligible_for_discount به‌جای flag) و توابع کوچک با یک مسئولیت مشخص (که مستقیماً به SRP وصل می‌شود) بیشترین تأثیر را دارند، بیشتر از هر کامنت طولانی.",
objectives:["طراحی یک سلسله‌مراتب استثنای دامنه‌محور برای یک سرویس پرداخت","بازنویسی یک except Exception عمومی به مدیریت خطای دقیق"],
example:"class PaymentError(Exception): pass\nclass InsufficientFundsError(PaymentError): pass\nclass GatewayTimeoutError(PaymentError): pass\n# کد فراخوان می‌تواند با except GatewayTimeoutError دوباره تلاش کند اما با except InsufficientFundsError پیام کاربر نمایش دهد",
py:"class PaymentError(Exception):\n    '''خطای پایهٔ همهٔ خطاهای پرداخت'''\n\nclass InsufficientFundsError(PaymentError):\n    def __init__(self, required, available):\n        self.required = required\n        self.available = available\n        super().__init__(f'موجودی ناکافی: نیاز {required}, موجود {available}')\n\nclass GatewayTimeoutError(PaymentError):\n    pass\n\ndef charge(amount):\n    try:\n        result = external_gateway.charge(amount)\n    except TimeoutError as e:\n        raise GatewayTimeoutError('درگاه پرداخت پاسخ نداد') from e\n    if not result.success:\n        raise InsufficientFundsError(amount, result.available_balance)\n    return result",
exercise:"یک تابع با except Exception: pass عمومی و بی‌صدا بنویسید (که یک باگ رایج را شبیه‌سازی می‌کند)، سپس آن را با یک سلسله‌مراتب استثنای دقیق و مدیریت جداگانهٔ هر نوع خطا بازنویسی کنید.",
project:"", resources:[{t:"Python docs - Built-in Exceptions",u:"https://docs.python.org/3/library/exceptions.html"},{t:"Google Python Style Guide",u:"https://google.github.io/styleguide/pyguide.html"}],
criteria:"می‌توانید یک سلسله‌مراتب استثنای دامنه‌محور برای یک سرویس واقعی طراحی کنید که کد فراخوان بتواند بر اساس نوع خطا رفتار متفاوت (Retry، پیام کاربر، لاگ بحرانی) اعمال کند.",
interview:["چرا except Exception: pass یک ضد-الگوی خطرناک است؟","چگونه یک سلسله‌مراتب استثنای معنادار طراحی می‌کنید؟"],
mistakes:["گرفتن استثنا و بی‌صدا نادیده گرفتن آن بدون لاگ، که خطا را برای همیشه پنهان می‌کند"],
production:"بسیاری از 'باگ‌های شبح' (که هرگز خطا نشان نمی‌دهند اما رفتار اشتباه دارند) ریشه در except عمومی بی‌صدا دارند که خطای واقعی را قورت داده است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی استثنا (Exception Design) و اصول خوانایی کد را با مثال یک سرویس پرداخت آموزش بده. یک تابع با except عمومی بی‌صدا بده تا آن را با سلسله‌مراتب استثنای دقیق بازنویسی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

deep:"Junior Engineer معمولاً روی Task های مشخص و محدود کار می‌کند و برای تصمیمات معماری به راهنمایی نیاز دارد؛ موفقیت او با 'آیا Task را کامل کرد' سنجیده می‌شود. Mid-level Engineer مستقل Featureهای متوسط را از طراحی تا Deploy انجام می‌دهد و شروع به دیدن پیامدهای تصمیمات فنی می‌کند. Senior Engineer نه‌فقط کد می‌نویسد بلکه Trade-offها را می‌بیند و به‌وضوح بیان می‌کند (مثلاً 'این راه‌حل سریع‌تر است اما بدهی فنی X را اضافه می‌کند')، مالکیت کامل یک بخش از سیستم را برعهده می‌گیرد (شامل مانیتورینگ، On-call، تصمیمات بلندمدت آن)، و به‌طور فعال مهندسان جوان‌تر را Mentor می‌کند. Staff Engineer معمولاً کد کمتری می‌نویسد اما تأثیرش را از طریق چند تیم می‌گذارد: طراحی معماری‌هایی که چند تیم را تحت تأثیر قرار می‌دهند، شناسایی مشکلات سیستمی قبل از تبدیل شدن به بحران (مثل 'ما داریم به یک Distributed Monolith تبدیل می‌شویم')، و رهبری فنی در اینسیدنت‌های بزرگ. Principal Engineer در سطح سازمانی تصمیم می‌گیرد (مثلاً انتخاب استک فناوری کل شرکت برای ۵ سال آینده) و اغلب نمایندهٔ فنی شرکت در تصمیمات کسب‌وکاری بزرگ است. تمایز کلیدی در تمام این سطوح، رشد از 'حل مشکل مشخص' به 'تشخیص مشکل درست برای حل کردن' و از 'تأثیر فردی' به 'تأثیر از طریق دیگران' است - نه صرفاً دانش فنی عمیق‌تر (که Staff/Principal لزوماً از هر Senior باتجربه بیشتر نمی‌دانند، بلکه دامنهٔ اثرگذاری و مسئولیت‌پذیری‌شان بزرگ‌تر است).",

interview:["تفاوت اصلی بین یک Senior و یک Staff Engineer چیست؟","چه چیزی یک مهندس را از 'حل مشکل' به 'یافتن مشکل درست' می‌رساند؟"],
mistakes:["تصور اینکه ارتقا به Senior/Staff صرفاً به‌معنای دانستن جزئیات فنی بیشتر است، بدون رشد در مسئولیت‌پذیری و تأثیرگذاری از طریق دیگران"],

ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تفاوت سطوح مهندسی (Junior تا Staff/Principal) را با تمرکز بر رفتار (نه صرفاً دانش فنی) توضیح بده. یک سناریوی تصمیم فنی واقعی بده تا پاسخ هر سطح را مقایسه و تحلیل کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}

{id:"p52",num:52,title:"طراحی سیستم سطح Senior/Staff",icon:"🏆",summary:"طراحی سیستم‌های واقعاً پیچیده: صرافی، سیستم پرداخت، فید خبر مقیاس‌بزرگ.",
topics:[
{id:"sysdesign-payment-ledger",title:"طراحی سیستم پرداخت و Ledger با تضمین سازگاری قوی",level:"Expert",minLadder:5,prereqs:["sysdesign-url-shortener","db-acid-isolation","resilience-patterns","api-idempotency"],
short:"یک طراحی سیستم سطح Staff که تمام مفاهیم دوره (تراکنش، Idempotency، Saga، Observability) را در یک مسئلهٔ واحد ترکیب می‌کند.",
deep:"سیستم پرداخت باید سه ویژگی سخت‌گیرانه داشته باشد: هرگز پول نباید 'گم' شود (Durability + Consistency)، هرگز عملیات نباید دوبار اجرا شود (Idempotency)، و کل تاریخچهٔ تراکنش‌ها باید قابل‌ممیزی (Auditable) باشد. طراحی معمولاً بر پایهٔ Double-Entry Ledger است (مانند حسابداری سنتی): هر تراکنش دقیقاً دو (یا بیشتر) رکورد ایجاد می‌کند که مجموعشان صفر است (بدهکار از یک حساب، بستانکار به حساب دیگر) - این طراحی به‌طور ذاتی خطاهای ناسازگاری را آشکار می‌کند (اگر مجموع کل Ledger صفر نشود، یک باگ وجود دارد) و از تغییر مستقیم 'موجودی' (که تاریخچه را از دست می‌دهد) اجتناب می‌کند؛ موجودی همیشه از جمع رکوردهای Ledger محاسبه می‌شود (یا با یک Snapshot دوره‌ای برای سرعت، به‌همراه رکوردهای Ledger بعد از آن نقطه). برای جلوگیری از Race Condition روی یک حساب (دو تراکنش هم‌زمان)، select_for_update در یک تراکنش دیتابیسی روی ردیف حساب قفل می‌گیرد، ولی باید همیشه به یک ترتیب ثابت (مثلاً بر اساس ID حساب مرتب‌شده) قفل گرفته شود تا از Deadlock جلوگیری شود. برای تراکنش‌هایی که چند سرویس مستقل را درگیر می‌کنند (مثل کیف‌پول + سرویس ارسال کالا)، Saga با Idempotency Key در هر مرحله ترکیب می‌شود. Observability حیاتی است: هر تراکنش باید یک Correlation ID داشته باشد که در تمام لاگ‌ها و Trace ها قابل ردیابی باشد تا در صورت شکایت کاربر ('پولم کسر شد ولی سفارش ثبت نشد')، مسیر دقیق تراکنش در چند دقیقه قابل بازسازی باشد.",
objectives:["طراحی یک مدل Double-Entry Ledger با Django ORM","ترکیب select_for_update، Idempotency Key و Saga در یک طراحی واحد"],
example:"یک انتقال ۱۰۰ تومانی از A به B، دو رکورد Ledger می‌سازد: {account: A, amount: -100}, {account: B, amount: +100} — مجموع صفر، تاریخچه کامل حفظ می‌شود.",
py:"from django.db import transaction\nfrom django.db.models import F\n\n@transaction.atomic\ndef transfer(from_account_id, to_account_id, amount, idempotency_key):\n    if LedgerEntry.objects.filter(idempotency_key=idempotency_key).exists():\n        return  # قبلاً پردازش شده، از تکرار جلوگیری می‌شود\n    ids_in_order = sorted([from_account_id, to_account_id])  # ترتیب ثابت قفل برای جلوگیری از Deadlock\n    accounts = Account.objects.select_for_update().filter(id__in=ids_in_order)\n    from_acc = next(a for a in accounts if a.id == from_account_id)\n    if from_acc.balance() < amount:\n        raise InsufficientFundsError()\n    LedgerEntry.objects.create(account_id=from_account_id, amount=-amount, idempotency_key=idempotency_key)\n    LedgerEntry.objects.create(account_id=to_account_id, amount=amount, idempotency_key=idempotency_key)",
exercise:"مدل LedgerEntry و Account را در Django طراحی کنید، تابع transfer بالا را کامل پیاده‌سازی کنید، و یک تست بنویسید که ۱۰۰ انتقال هم‌زمان (با threading) بین دو حساب را بدون Race Condition و بدون Deadlock تضمین کند.",
project:"سیستم کیف‌پول کامل با Double-Entry Ledger، Idempotency، select_for_update با ترتیب ثابت قفل، Observability (Correlation ID در لاگ)، و تست بار همزمانی با Locust.",
resources:[{t:"Martin Fowler - Accounting Patterns (مفهومی، از کتاب Analysis Patterns)",u:"https://martinfowler.com/eaaDev/AccountingNarrative.html"},{t:"Stripe Engineering blog - practical payment system design (رایگان)",u:"https://stripe.com/blog/engineering"}],
criteria:"می‌توانید یک سیستم Ledger مالی کامل طراحی کنید که در برابر Race Condition، Deadlock و درخواست تکراری مقاوم باشد و تاریخچهٔ کامل قابل‌ممیزی داشته باشد.",
interview:["چرا سیستم‌های مالی از Double-Entry Ledger به‌جای فقط یک ستون 'موجودی' استفاده می‌کنند؟","چگونه از Deadlock هنگام قفل گرفتن روی دو حساب هم‌زمان جلوگیری می‌کنید؟"],
mistakes:["به‌روزرسانی مستقیم ستون balance با UPDATE accounts SET balance = balance - X بدون Ledger، که تاریخچه و قابلیت ممیزی را از بین می‌برد و در برابر Race Condition آسیب‌پذیرتر است"],
production:"تمام سیستم‌های پرداخت واقعی بزرگ (Stripe، بانک‌ها) از الگوی Double-Entry Ledger برای تضمین صحت مالی و قابلیت حسابرسی استفاده می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی کامل یک سیستم Ledger مالی (با Double-Entry، Idempotency، قفل ایمن در برابر Deadlock) را مثل یک مصاحبهٔ System Design سطح Staff با من پیش ببر. از نیازمندی‌ها شروع کن، مرا به چالش بکش دربارهٔ Race Condition و Deadlock، و در پایان طراحی من را نقد کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p53",num:53,title:"آزمون جامع نهایی (Capstone)",icon:"🎯",summary:"ارزیابی نهایی ترکیبی از تمام حوزه‌ها: نظری، کدنویسی، SQL، دیباگ، طراحی سیستم و زیرساخت.",
topics:[
{id:"capstone-final-project",title:"پروژهٔ نهایی: پلتفرم سرمایه‌گذاری/مالی کامل با تمام لایه‌های تولیدی",level:"Expert",minLadder:5,prereqs:["sysdesign-payment-ledger","observability-three-pillars","k8s-core-objects","chaos-engineering-basics"],
short:"ساخت یک سیستم واقعی و کامل که تمام دانش این نقشه راه را در یک پروژهٔ واحد به کار می‌گیرد.",
deep:"این پروژه باید شامل باشد: کاربران و احراز هویت (JWT + Permission)، کیف‌پول با Double-Entry Ledger، سفارش‌ها و پرتفوی سرمایه‌گذاری، قیمت‌گذاری (با به‌روزرسانی از یک منبع خارجی شبیه‌سازی‌شده)، پردازش ناهمگام سفارش‌ها با Celery+Redis، رویدادهای Kafka برای اطلاع‌رسانی بین بخش‌های سیستم (مثلاً 'سفارش اجرا شد' → به‌روزرسانی پرتفوی)، جستجوی تراکنش‌ها با Elasticsearch، تمام موارد Dockerize و قابل استقرار روی Kubernetes با Health Probe صحیح، Observability کامل (Prometheus Metrics، Structured Logs، Distributed Tracing با Correlation ID)، و مستندسازی با حداقل سه ADR برای تصمیمات معماری کلیدی. باید به‌طور آگاهانه با چالش‌های زیر دست‌وپنجه نرم کنید: Race Condition واقعی در پردازش هم‌زمان سفارش‌ها (حل با select_for_update و/یا صف)، Idempotency در تمام Endpointهای حساس، ترتیب رویدادها در Kafka (انتخاب صحیح Partition Key)، مقیاس‌پذیری دیتابیس (تصمیم آگاهانه دربارهٔ Read Replica یا Partitioning)، و یک تمرین Disaster Recovery واقعی (شبیه‌سازی از دست رفتن یک Node/Replica و بازیابی). ارزیابی نهایی باید شامل حداقل یک آزمایش بار واقعی (با Locust یا k6) و یک آزمایش Chaos (خاموش کردن عمدی یک وابستگی) با مستندسازی نتیجه در قالب یک گزارش شبیه پست‌مورتم باشد.",
objectives:["ادغام تمام مفاهیم دوره در یک سیستم واحد قابل‌استقرار","اجرای یک آزمایش بار و یک آزمایش Chaos واقعی روی پروژه و مستندسازی نتایج"],
example:"معماری نهایی: Nginx → Gunicorn/Uvicorn (Django+DRF) → PostgreSQL (Primary+Replica) + Redis (کش/صف) + Kafka (رویداد) + Elasticsearch (جستجو)، همه روی Kubernetes با Prometheus+Grafana.",
py:"", exercise:"معماری کامل این پروژه را به‌صورت یک دیاگرام (حتی متنی/ASCII) رسم کنید، شامل تمام اجزا و جهت جریان داده بین آن‌ها.",
project:"پیاده‌سازی کامل پلتفرم توضیح‌داده‌شده در بالا، طبق ساختار زیر: Repository گیت با README کامل، حداقل ۳ ADR، Dockerfile+docker-compose برای توسعهٔ محلی، Manifestهای Kubernetes، پایپ‌لاین CI/CD (تست+build+deploy)، Dashboard Grafana با حداقل ۵ Panel معنادار، و یک گزارش Postmortem از یک آزمایش Chaos واقعی که روی سیستم اجرا کرده‌اید.",
resources:[{t:"System Design Primer (مرور نهایی، رایگان)",u:"https://github.com/donnemartin/system-design-primer"},{t:"Google SRE Book (مرور نهایی فصل‌های کلیدی، رایگان)",u:"https://sre.google/books/"}],
criteria:"پروژه باید بدون کمک بیرونی توسط شما قابل توضیح کامل باشد: چرا هر تصمیم معماری گرفته شد، چه مصالحه‌ای داشت، و چگونه سیستم تحت بار/خرابی رفتار می‌کند (با شواهد واقعی، نه فرضی).",
interview:["این پروژه را از ابتدا تا انتها برای من (به‌عنوان یک مصاحبه‌گر Staff-level) توضیح دهید: چرا این معماری، چه جایگزین‌هایی را رد کردید و چرا، و بزرگ‌ترین ریسک باقی‌مانده در طراحی فعلی چیست؟"],
mistakes:["ساخت یک سیستم صرفاً 'CRUD با چند تکنولوژی مد روز' بدون درگیر شدن واقعی با چالش‌های همزمانی، مقیاس‌پذیری و مشاهده‌پذیری که کل هدف این نقشه راه بود"],
production:"این پروژه دقیقاً الگویی از پیچیدگی واقعی است که در یک سیستم مالی تولیدی واقعی (نه یک تمرین آموزشی سطحی) با آن مواجه می‌شوید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من در پایان این نقشه راه هستم و می‌خواهم پروژهٔ Capstone (پلتفرم مالی کامل) را بسازم. مثل یک Staff Engineer که در حال Design Review است با من رفتار کن: طراحی من را قدم‌به‌قدم به چالش بکش، خصوصاً دربارهٔ همزمانی، Idempotency، مقیاس‌پذیری و Observability، و در پایان بگو آیا این کار برای نمونه‌کار سطح Senior قابل ارائه است یا چه چیزی کم دارد. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}

// ---------- Helpers ----------
function statusLabel(s) {
  return {not_started:'شروع نشده', learning:'در حال یادگیری', practicing:'در حال تمرین', completed:'تکمیل‌شده', mastered:'مسلط'}[s] || s;
}
function levelFa(l) {
  return {Beginner:'مبتدی', Intermediate:'متوسط', Advanced:'پیشرفته', Expert:'خبره'}[l] || l;
}
function ladderBadge(n) {
  return `<span class="badge ladder" title="حداقل سطح نردبانی که باید این موضوع را بداند (سطوح بالاتر هم باید بدانند)">L${n}+</span>`;
}
function computeStats() {
  const total = ALL_TOPICS.length;
  let completed=0, mastered=0, learning=0, practicing=0;
  ALL_TOPICS.forEach(t => {
    const e = PROGRESS[t.id];
    if (!e) return;
    if (e.status==='completed') completed++;
    else if (e.status==='mastered') mastered++;
    else if (e.status==='learning') learning++;
    else if (e.status==='practicing') practicing++;
  });
  const done = completed + mastered;
  return {total, completed, mastered, learning, practicing, done, pct: total? Math.round((done/total)*100):0};
}
function phaseStats(phase) {
  const total = phase.topics.length;
  let done = 0;
  phase.topics.forEach(t => {
    const e = PROGRESS[t.id];
    if (e && (e.status==='completed' || e.status==='mastered')) done++;
  });
  return {total, done, pct: total? Math.round((done/total)*100):0};
}

function matchesFilters(t) {
  if (SEARCH_QUERY) {
    const q = SEARCH_QUERY.toLowerCase();
    const hay = (t.title + ' ' + t.short + ' ' + t.deep).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (FILTER_LEVEL && t.level !== FILTER_LEVEL) return false;
  if (FILTER_STATUS) {
    const e = PROGRESS[t.id];
    const s = e ? e.status : 'not_started';
    if (s !== FILTER_STATUS) return false;
  }
  if (FILTER_BOOKMARK) {
    const e = PROGRESS[t.id];
    if (!e || !e.bookmark) return false;
  }
  return true;
}

  const now = new Date();
  const withReview = ALL_TOPICS.filter(t => PROGRESS[t.id] && PROGRESS[t.id].review);
  const due = withReview.filter(t => new Date(PROGRESS[t.id].review.nextDate) <= now);
  const upcoming = withReview.filter(t => new Date(PROGRESS[t.id].review.nextDate) > now)
    .sort((a,b) => new Date(PROGRESS[a.id].review.nextDate) - new Date(PROGRESS[b.id].review.nextDate));

  let html = `<div class="topbar"><div><h2>مرور دوره‌ای (Spaced Repetition)</h2><div class="sub">بعد از تکمیل هر موضوع، سیستم فاصلهٔ مرور بعدی را بر اساس بازخورد شما پیشنهاد می‌دهد.</div></div>
  <button class="iconbtn" onclick="toggleTheme()">🌓</button></div>`;

  html += `<div class="section-title">امروز نیازمند مرور (${due.length}) <div class="line"></div></div>`;
  if (due.length === 0) html += `<div class="empty">چیزی برای مرور امروز نیست 🎉</div>`;
  due.forEach(t => {
    html += `<div class="review-item"><span>${t.title} — فاز ${t.phaseNum}</span><button class="navbtn" style="flex:none;" onclick="openTopic('${t.id}')">مرور کن</button></div>`;
  });

  html += `<div class="section-title">مرورهای آینده (${upcoming.length}) <div class="line"></div></div>`;
  if (upcoming.length === 0) html += `<div class="empty">هیچ مرور برنامه‌ریزی‌شده‌ای وجود ندارد. بعد از تکمیل موضوعات، دکمهٔ مرور را در جزئیات هر موضوع بزنید.</div>`;
  upcoming.slice(0,30).forEach(t => {
    const d = new Date(PROGRESS[t.id].review.nextDate);
    html += `<div class="review-item"><span>${t.title}</span><span style="color:var(--muted);">${d.toLocaleDateString('fa-IR')}</span></div>`;
  });
  document.getElementById('mainContent').innerHTML = html;
}

// ---------- Render: Capstone view ----------
function renderCapstoneView() {
  let html = `<div class="topbar"><div><h2>آزمون جامع نهایی (Capstone)</h2><div class="sub">ارزیابی نهایی ترکیبی از تمام حوزه‌های نقشه راه</div></div>
  <button class="iconbtn" onclick="toggleTheme()">🌓</button></div>
  <div class="footer-note">⚠️ توجه: تکمیل این چک‌لیست به‌تنهایی شما را «مهندس ارشد» نمی‌کند. فرمول واقعی این است:<br>
  <b>دانش + پیاده‌سازی + دیباگ + تجربهٔ تولید + معماری + مالکیت = توانمندی مهندسی ارشد</b><br>
  این آزمون فقط بخش «دانش و پیاده‌سازی» را می‌سنجد؛ بقیه از طریق کار واقعی روی سیستم‌های تولیدی به دست می‌آید.</div>`;
  CAPSTONE.sections.forEach(sec => {
    html += `<div class="section-title">${sec.title}<div class="line"></div></div><div class="topic-grid">`;
    sec.items.forEach((item, idx) => {
      const key = `capstone_${sec.title}_${idx}`;
      const checked = PROGRESS[key] && PROGRESS[key].status==='completed';
      html += `<div class="topic-card" style="cursor:default;" onclick="toggleCapstoneItem('${key}')">
        <div class="status-dot ${checked?'completed':''}"></div>
        <p style="margin-top:14px;">${item}</p>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('mainContent').innerHTML = html;
}
function toggleCapstoneItem(key) {
  if (!PROGRESS[key]) PROGRESS[key] = {status:'not_started'};
  PROGRESS[key].status = PROGRESS[key].status === 'completed' ? 'not_started' : 'completed';
  saveProgress();
  render();
}

// ---------- Topic Modal ----------
function openTopic(id) {
  const t = TOPIC_BY_ID[id];
  if (!t) return;
  const e = getEntry(id);
  const resHtml = (t.resources||[]).map(r => `<a class="resbtn" href="${r.u}" target="_blank" rel="noopener">🔗 ${r.t}</a>`).join(' ');
  const prereqHtml = (t.prereqs||[]).length ? (t.prereqs||[]).map(p => {
    const pt = TOPIC_BY_ID[p];
    const pe = PROGRESS[p];
    const done = pe && (pe.status==='completed'||pe.status==='mastered');
    return `<span class="badge" style="color:${done?'var(--good)':'var(--bad)'}">${done?'✓':'✗'} ${pt?pt.title:p}</span>`;
  }).join(' ') : '<span class="badge">ندارد</span>';

  const html = `
    <span class="modal-close" onclick="closeTopic()">×</span>
    <h3>${t.title}</h3>
    <div class="modal-sub">فاز ${t.phaseNum}: ${t.phaseTitle} · سطح: ${levelFa(t.level)} · حداقل سطح نردبان: ${ladderBadge(t.minLadder)}</div>

    <div class="statusbar">
      ${['not_started','learning','practicing','completed','mastered'].map(s =>
        `<div class="statusbtn ${e.status===s?'on':''}" onclick="setStatus('${id}','${s}')">${statusLabel(s)}</div>`
      ).join('')}
      <div class="statusbtn ${e.bookmark?'on':''}" onclick="toggleBookmark('${id}')">★ بوکمارک</div>
    </div>

    <div class="mrow"><h5>🎯 پیش‌نیازها</h5><div class="body">${prereqHtml}</div></div>
    <div class="mrow"><h5>📌 توضیح کوتاه</h5><div class="body">${t.short}</div></div>
    <div class="mrow"><h5>🔬 توضیح عمیق</h5><div class="body">${t.deep}</div></div>
    ${t.objectives && t.objectives.length ? `<div class="mrow"><h5>🎓 اهداف یادگیری</h5><ul>${t.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>` : ''}
    ${t.example ? `<div class="mrow"><h5>💡 مثال</h5><div class="body">${t.example}</div></div>` : ''}
    ${t.py ? `<div class="mrow"><h5>🐍 مثال پایتون</h5><pre>${escapeHtml(t.py)}</pre></div>` : ''}
    ${t.exercise ? `<div class="mrow"><h5>✍️ تمرین</h5><div class="body">${t.exercise}</div></div>` : ''}
    ${t.project ? `<div class="mrow"><h5>🏗️ پروژهٔ مرتبط</h5><div class="body">${t.project}</div></div>` : ''}
    ${t.criteria ? `<div class="mrow"><h5>✅ معیار تکمیل</h5><div class="body">${t.criteria}</div></div>` : ''}
    ${t.interview && t.interview.length ? `<div class="mrow"><h5>🎤 سؤالات مصاحبه</h5><ul>${t.interview.map(q=>`<li>${q}</li>`).join('')}</ul></div>` : ''}
    ${t.mistakes && t.mistakes.length ? `<div class="mrow"><h5>⚠️ اشتباهات رایج</h5><ul>${t.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul></div>` : ''}
    ${t.production ? `<div class="mrow"><h5>🏭 ارتباط با تولید</h5><div class="body">${t.production}</div></div>` : ''}
    <div class="mrow"><h5>📚 منابع رایگان</h5><div class="body">${resHtml || 'به‌زودی'}</div></div>
    ${t.ai ? `<div class="mrow"><h5>🤖 پرامپت مربی AI</h5><div class="aiprompt" id="aiprompt-${id}">${escapeHtml(t.ai)}</div><button class="copybtn" onclick="copyPrompt('${id}')">کپی پرامپت</button></div>` : ''}

    <div class="mrow"><h5>📝 یادداشت شخصی</h5><textarea class="notearea" id="note-${id}" oninput="saveNote('${id}', this.value)" placeholder="یادداشت خودتان را اینجا بنویسید...">${e.note||''}</textarea></div>

    <div class="mrow"><h5>🔁 مرور دوره‌ای</h5><div class="body" style="font-size:12px;color:var(--muted);">بعد از یادگیری، بازخورد بده تا فاصلهٔ مرور بعدی تنظیم شود.</div>
    <div class="reviewbtns">
      <button class="rb-forgot" onclick="scheduleReview('${id}','forgot')">فراموش کردم</button>
      <button class="rb-hard" onclick="scheduleReview('${id}','hard')">سخت بود</button>
      <button class="rb-good" onclick="scheduleReview('${id}','good')">خوب بود</button>
      <button class="rb-easy" onclick="scheduleReview('${id}','easy')">آسان بود</button>
    </div>
    ${e.review ? `<div style="font-size:11px;color:var(--muted);margin-top:6px;">مرور بعدی: ${new Date(e.review.nextDate).toLocaleDateString('fa-IR')}</div>` : ''}
    </div>
  `;
  document.getElementById('topicModal').innerHTML = html;
  document.getElementById('topicOverlay').classList.add('show');
}
function closeTopic() {
  document.getElementById('topicOverlay').classList.remove('show');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function setStatus(id, status) {
  const e = getEntry(id);
  e.status = status;
  saveProgress();
  openTopic(id);
  renderPhaseNav();
}
function toggleBookmark(id) {
  const e = getEntry(id);
  e.bookmark = !e.bookmark;
  saveProgress();
  openTopic(id);
}
function saveNote(id, val) {
  const e = getEntry(id);
  e.note = val;
  saveProgress();
}
function copyPrompt(id) {
  const t = TOPIC_BY_ID[id];
  if (!t || !t.ai) return;
  navigator.clipboard.writeText(t.ai).catch(()=>{});
}
const REVIEW_INTERVALS = {forgot:1, hard:3, good:7, easy:14};
const REVIEW_SEQUENCE = [1,3,7,14,30,90];
function scheduleReview(id, quality) {
  const e = getEntry(id);
  if (!e.review) e.review = {lastDate: new Date().toISOString(), stage:0};
  let stage = e.review.stage || 0;
  if (quality === 'forgot') stage = 0;
  else if (quality === 'hard') stage = Math.max(0, stage);
  else if (quality === 'good') stage = Math.min(REVIEW_SEQUENCE.length-1, stage+1);
  else if (quality === 'easy') stage = Math.min(REVIEW_SEQUENCE.length-1, stage+2);
  const days = REVIEW_SEQUENCE[stage] || 1;
  const next = new Date();
  next.setDate(next.getDate() + days);
  e.review = {lastDate: new Date().toISOString(), nextDate: next.toISOString(), stage};
  saveProgress();
  openTopic(id);
}

// ---------- Search ----------
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    SEARCH_QUERY = e.target.value.trim();
    if (SEARCH_QUERY && CURRENT_VIEW !== 'phases') {
      CURRENT_VIEW = 'phases';
      CURRENT_PHASE_FILTER = null;
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view==='phases'));
    }
    render();
  });
  document.getElementById('topicOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'topicOverlay') closeTopic();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTopic();
  });
  renderPhaseNav();
  render();
});

// ---------- Master render ----------
function render() {
  renderPhaseNav();
  if (CURRENT_VIEW === 'dashboard') renderDashboard();
  else if (CURRENT_VIEW === 'phases') renderPhasesView();
  else if (CURRENT_VIEW === 'compare') renderCompareView();
  else if (CURRENT_VIEW === 'scenarios') renderScenariosView();
  else if (CURRENT_VIEW === 'review') renderReviewView();
  else if (CURRENT_VIEW === 'capstone') renderCapstoneView();
}

</script>
</body>
</html>
