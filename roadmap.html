<style>
:root{
  --bg:#0f1420; --bg2:#161d2e; --card:#1b2436; --card2:#212c42; --border:#2a3650;

}
[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f0f3fa; --border:#dde3f0;

*{box-sizing:border-box;}
body{margin:0;font-family:'Vazirmatn','Tahoma',sans-serif;background:var(--bg);color:var(--text);transition:.2s;}
@font-face{font-family:'Vazirmatn';src:local('Vazirmatn');}
a{color:var(--accent);text-decoration:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
.sidebar{background:var(--bg2);border-left:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;}
.brand h1{font-size:15px;margin:0;line-height:1.4;}
.brand p{margin:0;font-size:11px;color:var(--muted);}
.searchbox{position:relative;margin-bottom:12px;}
.searchbox input{width:100%;padding:10px 36px 10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;}
.searchbox span{position:absolute;right:12px;top:9px;color:var(--muted);}
.navbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.navbtn{flex:1 1 auto;font-size:11.5px;padding:7px 8px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;text-align:center;}
.navbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.phaselist{display:flex;flex-direction:column;gap:4px;}
.phase-item{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);}
.phase-item:hover{background:var(--card);}
.phase-item.active{background:var(--chip);color:var(--text);font-weight:700;}
.phase-item .pnum{background:var(--card2);border-radius:6px;padding:1px 6px;font-size:10px;margin-left:6px;color:var(--accent);}
.phase-item .pct{font-size:10px;color:var(--good);}
.main{padding:22px 28px;max-width:1300px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.topbar h2{margin:0;font-size:20px;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat-card .num{font-size:26px;font-weight:800;}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
.progressbar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:8px;}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filters select,.filters input{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;}
.section-title{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title .line{flex:1;height:1px;background:var(--border);}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;position:relative;}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.topic-card h4{margin:0 0 6px;font-size:14px;}
.topic-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.6;max-height:52px;overflow:hidden;}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--chip);color:var(--muted);}
.badge.lvl-Beginner{color:var(--good);} .badge.lvl-Intermediate{color:var(--accent);}
.badge.lvl-Advanced{color:var(--warn);} .badge.lvl-Expert{color:var(--bad);}
.badge.ladder{border:1px solid var(--border);font-weight:600;}
.badge.ladder.optional{border-style:dashed;font-weight:400;}
.status-dot{position:absolute;top:12px;left:12px;width:10px;height:10px;border-radius:50%;background:var(--border);}
.status-dot.mastered{background:var(--good);}
.status-dot.completed{background:var(--accent);}
.status-dot.practicing{background:var(--warn);}
.status-dot.learning{background:var(--accent2);}
.bm-star{position:absolute;top:10px;left:26px;font-size:13px;color:var(--warn);}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.6);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:30px 12px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:760px;width:100%;padding:24px 26px;box-shadow:var(--shadow);}
.modal h3{margin:0 0 3px;font-size:19px;}
.modal .modal-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.modal-close{float:left;cursor:pointer;font-size:20px;color:var(--muted);}
.mrow{margin-bottom:16px;}
.mrow h5{margin:0 0 6px;font-size:13px;color:var(--accent);display:flex;gap:6px;align-items:center;}
.mrow .body{font-size:13px;line-height:1.9;color:var(--text);}
.mrow ul{margin:4px 0;padding-right:20px;}
pre{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;direction:ltr;text-align:left;font-family:var(--mono);font-size:12.5px;}
.resbtn{display:inline-block;font-size:11.5px;padding:5px 10px;border-radius:8px;background:var(--chip);margin:3px;color:var(--text);}
.statusbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.statusbtn{font-size:11.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;}
.statusbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
textarea.notearea{width:100%;min-height:70px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px;font-size:12.5px;font-family:inherit;}
.reviewbtns{display:flex;gap:6px;margin-top:8px;}
.reviewbtns button{flex:1;padding:7px;border-radius:8px;border:none;cursor:pointer;font-size:11.5px;color:#fff;}
.rb-easy{background:var(--good);} .rb-good{background:var(--accent);} .rb-hard{background:var(--warn);} .rb-forgot{background:var(--bad);}
.aiprompt{background:var(--card);border:1px dashed var(--border);padding:10px;border-radius:9px;font-size:12px;line-height:1.8;white-space:pre-wrap;}
.copybtn{font-size:11px;padding:4px 10px;border-radius:7px;background:var(--accent);color:#fff;border:none;cursor:pointer;margin-top:6px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:10px;overflow:hidden;}
table th,table td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;}
table th{background:var(--card2);color:var(--accent);font-size:12px;}
.compare-wrap{overflow-x:auto;margin-bottom:20px;border:1px solid var(--border);border-radius:12px;}
.scenario{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:12px 14px;}
.scenario summary{cursor:pointer;font-weight:700;font-size:13.5px;}
.scenario .sc-body{margin-top:10px;font-size:12.5px;line-height:1.9;}
.gap-card{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.8;}
.gap-card.ok{border-right-color:var(--good);}
.gap-card.bad{border-right-color:var(--bad);}
.footer-note{color:var(--muted);font-size:11.5px;margin:30px 0 10px;line-height:2;}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px;}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.review-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:12.5px;}
@media(max-width:900px){.app{grid-template-columns:1fr;} .sidebar{position:relative;height:auto;}}
</style>
</head>

deep:"استفادهٔ درست از AI یعنی: اول خودتان تلاش کنید، بعد از AI فقط راهنمایی (hint) بخواهید نه راه‌حل کامل، پیاده‌سازی کنید، سپس از AI بخواهید کد را نقد کند، بعد راه‌حل را بدون کمک AI برای خودتان توضیح دهید و در نهایت از حافظه دوباره بنویسید. مشکل اصلی وابستگی به AI این است که توهم شایستگی (illusion of competence) ایجاد می‌کند: کد کار می‌کند اما شما نمی‌توانید آن را توضیح دهید یا در شرایط جدید تعمیم دهید. برای تأیید پاسخ‌های AI باید همیشه در مقابل مستندات رسمی، اجرای واقعی کد، و RFCها راستی‌آزمایی کنید، چون مدل‌های زبانی می‌توانند با اطمینان کامل جزئیات نادرست (hallucination) تولید کنند، به‌خصوص در نسخه‌های خاص کتابخانه‌ها یا رفتار Edge-case.",
objectives:["تشخیص Hallucination در پاسخ‌های AI","ساخت چرخهٔ تلاش مستقل → راهنمایی → پیاده‌سازی → بازبینی → توضیح → بازنویسی از حافظه"],

py:"import timeit\n# اندازه‌گیری واقعی زمان اجرا به‌جای اعتماد کورکورانه به ادعای پیچیدگی",
exercise:"یک پاسخ AI دربارهٔ یک تابع پایتون بگیرید و آن را با مستندات رسمی python.org راستی‌آزمایی کنید.",
project:"", resources:[{t:"Anthropic - Prompt engineering overview",u:"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview"}],

interview:["چطور مطمئن می‌شوید کدی که AI تولید کرده درست است؟"],
mistakes:["کپی مستقیم کد AI بدون فهمیدن","استفاده از AI برای دور زدن یادگیری مبانی"],
production:"در تیم‌های حرفه‌ای، مهندسی که نتواند کد تولیدشده توسط AI را توضیح دهد در Code Review رد می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من می‌خواهم یاد بگیرم چطور از AI به‌عنوان ابزار یادگیری استفاده کنم نه جایگزین تفکر. وقتی سؤالی می‌پرسم، ابتدا از من بخواه خودم تلاش کنم، بعد فقط راهنمایی بده، و در پایان از من بخواه راه‌حل را بدون کمک تو توضیح دهم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}

{id:"p1",num:1,title:"مبانی معماری کامپیوتر",icon:"🖥️",summary:"فهم سخت‌افزار زیربنایی: CPU، حافظه، کش و I/O — چرا این‌ها برای بک‌اند مهم‌اند.",
topics:[
{id:"cpu-basics",title:"CPU، رجیسترها و چرخهٔ اجرای دستورات",level:"Beginner",minLadder:1,prereqs:[],
short:"واحد پردازش مرکزی چگونه دستورات ماشین را واکشی، رمزگشایی و اجرا می‌کند.",
deep:"CPU با چرخهٔ Fetch-Decode-Execute کار می‌کند: دستور از حافظه واکشی می‌شود، رمزگشایی می‌شود تا مشخص شود چه عملیاتی باید انجام شود، و سپس روی داده‌های موجود در رجیسترها اجرا می‌شود. رجیسترها سریع‌ترین و کوچک‌ترین واحد ذخیره‌سازی هستند و مستقیماً در ALU (واحد محاسبه و منطق) استفاده می‌شوند. تکنیک‌های مدرن مثل Pipelining (اجرای هم‌زمان مراحل چند دستور)، Branch Prediction (حدس زدن مسیر شرط‌ها قبل از محاسبهٔ واقعی) و Speculative Execution سرعت را بالا می‌برند اما منشأ آسیب‌پذیری‌هایی مثل Spectre/Meltdown هم بوده‌اند. برای مهندس بک‌اند، فهم این‌که CPU مدرن instruction-level parallelism دارد کمک می‌کند بفهمید چرا کد cache-friendly (locality of reference) می‌تواند چند برابر سریع‌تر از کد مشابه با الگوی دسترسی پراکنده به حافظه اجرا شود.",
objectives:["توضیح چرخهٔ fetch-decode-execute","فهم branch prediction و تأثیر آن بر عملکرد کد"],
example:"یک حلقهٔ ساده روی آرایه که به ترتیب پیمایش می‌شود در مقابل پیمایش تصادفی، تفاوت چشمگیر سرعت دارد چون کش CPU بهتر پیش‌بینی می‌کند.",
py:"import time, random\nN=10_000_000\narr=list(range(N))\nt=time.time()\ns=sum(arr[i] for i in range(N))\nprint('sequential', time.time()-t)",
exercise:"با ماژول timeit سرعت پیمایش ترتیبی لیست را با پیمایش با ایندکس‌های شافل‌شده مقایسه کنید.",
project:"", resources:[{t:"CS:APP - Computer Systems (CMU)",u:"https://csapp.cs.cmu.edu/"},{t:"nand2tetris (رایگان)",u:"https://www.nand2tetris.org/"},{t:"CrashCourse Computer Science (YouTube)",u:"https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"}],
criteria:"می‌توانید توضیح دهید چرا دسترسی متوالی به حافظه سریع‌تر از دسترسی پراکنده است.",
interview:["Branch prediction چیست و چرا مهم است؟","چرا CPU مدرن instruction pipeline دارد؟"],
mistakes:["نادیده گرفتن تأثیر cache locality در کد پرفورمنس-حساس"],
production:"در سیستم‌های حساس به تأخیر (مثل موتور تطبیق سفارش در صرافی)، درک این لایه به بهینه‌سازی واقعی کمک می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من در حال یادگیری معماری کامپیوتر برای مهندسی بک‌اند هستم، نه برای طراحی سخت‌افزار. مفاهیم CPU، رجیستر و چرخهٔ اجرا را با تمرکز بر 'چرا برای برنامه‌نویس مهم است' آموزش بده و با مثال‌های عملکردی در پایتون آن را ملموس کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"memory-hierarchy",title:"سلسله‌مراتب حافظه: کش، RAM، دیسک",level:"Intermediate",minLadder:2,prereqs:["cpu-basics"],
short:"چرا داده در سطوح مختلف (L1/L2/L3، RAM، SSD/NVMe) ذخیره می‌شود و چه تفاوت سرعتی دارند.",
deep:"سلسله‌مراتب حافظه بر اساس یک مصالحهٔ بنیادین شکل گرفته: حافظهٔ سریع‌تر گران‌تر و کوچک‌تر است. L1 cache در حدود ۱ نانوثانیه، RAM حدود ۱۰۰ نانوثانیه، SSD NVMe حدود ۱۰۰ میکروثانیه و HDD حدود ۱۰ میلی‌ثانیه تأخیر دارند — یعنی تفاوت چند مرتبهٔ بزرگی. این اعداد (که در جدول معروف 'Latency Numbers Every Programmer Should Know' آمده) توضیح می‌دهند چرا هر بار Page Fault یا I/O دیسک برای یک برنامهٔ بک‌اند فاجعه‌بار است و چرا کش کردن (مثل Redis) این‌قدر مؤثر است: چون RAM را جایگزین دیسک می‌کند. Locality of Reference دو نوع دارد: Temporal (دادهٔ اخیراً استفاده‌شده احتمالاً دوباره استفاده می‌شود) و Spatial (داده‌های نزدیک به هم در حافظه احتمالاً با هم استفاده می‌شوند) — طراحی ایندکس دیتابیس، الگوریتم صفحه‌بندی حافظه و حتی طراحی ساختار داده‌ها (مثل B-Tree به‌جای Binary Tree برای دیسک) مستقیماً از این اصل نشأت می‌گیرد.",
objectives:["به خاطر سپردن مرتبهٔ بزرگی تأخیر هر سطح حافظه","توضیح چرا B-Tree برای دیسک بهتر از Binary Tree است"],
example:"جدول Latency Numbers: L1 cache ~0.5ns, RAM ~100ns, SSD random read ~150μs, HDD seek ~10ms, round trip در همان دیتاسنتر ~0.5ms.",
py:"", exercise:"لیستی با ۱۰ میلیون عنصر بسازید، یک بار پیمایش ترتیبی و یک بار پیمایش با گام‌های بزرگ (مثلاً هر ۶۴ عنصر) انجام دهید و زمان را مقایسه کنید.",
project:"", resources:[{t:"Latency Numbers Every Programmer Should Know",u:"https://gist.github.com/jboner/2841832"},{t:"What Every Programmer Should Know About Memory (Ulrich Drepper, PDF رایگان)",u:"https://people.freebsd.org/~lstewart/articles/cpumemory.pdf"}],
criteria:"می‌توانید توضیح دهید چرا کش کردن در RAM (Redis) هزاران برابر سریع‌تر از خواندن از دیتابیس روی دیسک است.",
interview:["چرا B-Tree برای ایندکس دیتابیس روی دیسک انتخاب می‌شود نه Binary Search Tree؟"],
mistakes:["نادیده گرفتن هزینهٔ واقعی I/O دیسک در طراحی سیستم"],
production:"طراحی صحیح کش (Redis) و ایندکس دیتابیس مستقیماً از فهم این سلسله‌مراتب می‌آید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم سلسله‌مراتب حافظه (cache/RAM/disk) را برایم با تمرکز بر تأثیرش در طراحی سیستم‌های بک‌اند (کشینگ، ایندکس دیتابیس) توضیح بده و از من در مورد اعداد latency تقریبی سؤال بپرس تا حفظ کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p2",num:2,title:"سیستم‌عامل",icon:"🐧",summary:"پردازش، نخ، حافظهٔ مجازی، همروندی و مکانیزم‌های هم‌گام‌سازی.",
topics:[
{id:"process-vs-thread",title:"Process، Thread و Context Switching",level:"Intermediate",minLadder:2,prereqs:["cpu-basics"],
short:"تفاوت پردازش و نخ، و اینکه چرا سوییچ کانتکست هزینه دارد.",
deep:"Process یک نمونهٔ اجراییِ ایزوله از برنامه است با فضای آدرس حافظهٔ مستقل، فایل دیسکریپتورها و شناسهٔ خودش (PID)؛ Thread واحد اجرای کوچک‌تری درون یک Process است که Stack خودش را دارد ولی حافظهٔ Heap و فایل دیسکریپتورها را با سایر نخ‌های همان Process به اشتراک می‌گذارد. سوییچ کانتکست بین Processها گران‌تر از بین Threadها است چون شامل تعویض کامل جدول صفحه (page table) و حافظهٔ مجازی است، در حالی که سوییچ بین Threadها فقط رجیسترها و Stack Pointer را عوض می‌کند. سیستم‌عامل با استفاده از الگوریتم‌های زمان‌بندی (مثل Completely Fair Scheduler در لینوکس) تصمیم می‌گیرد کدام Thread چه زمانی روی CPU اجرا شود. برای مهندس بک‌اند، این مفهوم توضیح می‌دهد چرا مدل‌های worker پروسه‌محور (مثل Gunicorn با چند worker) در برابر خطای یک worker مقاوم‌ترند اما حافظهٔ بیشتری مصرف می‌کنند، در حالی که مدل‌های Thread یا Async سبک‌تر اما نسبت به خطاهای یک تسک آسیب‌پذیرترند.",
objectives:["تمایز Process و Thread از نظر حافظه و ایزولاسیون","توضیح هزینهٔ context switch"],
example:"Gunicorn با پیش‌فرض worker از نوع sync، هر ری‌کوئست را در یک Process جدا مدیریت می‌کند؛ در مقابل Uvicorn با asyncio همه‌چیز در یک Thread رخ می‌دهد.",
py:"import os, threading\nprint('PID:', os.getpid())\ndef worker():\n    print('Thread:', threading.current_thread().name)\nthreading.Thread(target=worker).start()",
exercise:"با ماژول multiprocessing و threading در پایتون، یک تسک CPU-bound را یک‌بار با پروسه و یک‌بار با نخ اجرا کنید و به دلیل GIL تفاوت را مشاهده کنید.",
project:"", resources:[{t:"Linux Kernel Docs - Scheduler",u:"https://www.kernel.org/doc/html/latest/scheduler/index.html"},{t:"OSTEP (رایگان، دانشگاه Wisconsin)",u:"https://pages.cs.wisc.edu/~remzi/OSTEP/"}],
criteria:"می‌توانید توضیح دهید چرا Gunicorn معمولاً با چند worker process اجرا می‌شود نه چند thread.",
interview:["تفاوت Process و Thread چیست؟","Context switching چگونه کار می‌کند و چرا هزینه دارد؟"],
mistakes:["فرض اینکه thread همیشه سریع‌تر از process است"],
production:"انتخاب مدل worker (sync/thread/async) در Gunicorn/Uvicorn مستقیماً بر throughput و resilience سرویس تأثیر دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم Process و Thread و Context Switching را طوری برایم توضیح بده که به تصمیم‌گیری دربارهٔ تنظیمات worker در Gunicorn/Uvicorn برای یک اپلیکیشن Django مرتبط شود. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"concurrency-primitives",title:"Mutex، Semaphore، Race Condition و Deadlock",level:"Advanced",minLadder:3,prereqs:["process-vs-thread"],
short:"ابزارهای هم‌گام‌سازی همروندی و مشکلاتی که بدون آن‌ها رخ می‌دهند.",
deep:"Race Condition زمانی رخ می‌دهد که نتیجهٔ نهایی به ترتیب زمانی اجرای Threadها بستگی داشته باشد، مثلاً دو Thread هم‌زمان یک متغیر مشترک را افزایش دهند و یکی از افزایش‌ها گم شود. Mutex (Mutual Exclusion) تضمین می‌کند فقط یک Thread در هر لحظه به یک بخش بحرانی (critical section) دسترسی دارد. Semaphore عمومی‌تر است و اجازه می‌دهد تا N منبع هم‌زمان مصرف شود (مثلاً محدود کردن تعداد کانکشن‌های هم‌زمان به دیتابیس). Deadlock وقتی رخ می‌دهد که دو یا چند Thread هرکدام منتظر منبعی باشند که Thread دیگر آن را قفل کرده و رها نمی‌کند — چهار شرط کلاسیک Coffman (Mutual Exclusion، Hold and Wait، No Preemption، Circular Wait) باید هم‌زمان برقرار باشند تا Deadlock رخ دهد؛ شکستن هرکدام (مثلاً همیشه قفل‌ها را به یک ترتیب مشخص بگیرید) از آن جلوگیری می‌کند. در پایتون، به‌دلیل GIL، Race Condition روی بایت‌کدهای اتمیک کمتر پیش می‌آید اما همچنان در عملیات مرکب (مثل +=) و در تعامل با دیتابیس (مثل دو تراکنش که هم‌زمان یک ردیف را می‌خوانند و می‌نویسند) کاملاً واقعی است.",
objectives:["تشخیص Race Condition در کد هم‌روند","توضیح چهار شرط لازم برای Deadlock"],
example:"دو تراکنش دیتابیس که هر کدام سعی می‌کنند دو ردیف را به ترتیب معکوس قفل کنند، کلاسیک‌ترین مثال Deadlock در دیتابیس است.",
py:"import threading\nlock = threading.Lock()\ncounter = 0\ndef increment():\n    global counter\n    with lock:\n        counter += 1\nthreads=[threading.Thread(target=increment) for _ in range(1000)]\n[t.start() for t in threads]; [t.join() for t in threads]\nprint(counter)",
exercise:"کد بالا را بدون lock اجرا کنید و مشاهده کنید نتیجه گاهی کمتر از ۱۰۰۰ می‌شود؛ سپس با threading.Lock رفعش کنید.",
project:"", resources:[{t:"Python threading docs",u:"https://docs.python.org/3/library/threading.html"},{t:"OSTEP - Concurrency (رایگان)",u:"https://pages.cs.wisc.edu/~remzi/OSTEP/#concurrency"}],
criteria:"می‌توانید یک Race Condition واقعی در کد پایتون بسازید، آن را با ابزار مناسب (Lock/Semaphore) رفع کنید و دلیل رفع را توضیح دهید.",
interview:["Deadlock چیست و چه شرایطی باعث آن می‌شود؟","تفاوت Mutex و Semaphore چیست؟","چرا در پایتون با وجود GIL باز هم Race Condition ممکن است؟"],
mistakes:["فرض غلط که GIL همهٔ مشکلات همروندی را حل می‌کند","قفل گرفتن به ترتیب متفاوت در بخش‌های مختلف کد که منجر به Deadlock می‌شود"],
production:"Deadlock در سطح دیتابیس یکی از رایج‌ترین اینسیدنت‌های تولید در سیستم‌های با تراکنش‌های همزمان بالاست (مثل سیستم‌های مالی).",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من می‌خواهم Race Condition، Deadlock، Mutex و Semaphore را عمیق یاد بگیرم. مثال‌های واقعی در پایتون برایم بساز که در آن‌ها Race Condition رخ دهد، از من بخواه قبل از دیدن جواب حدس بزنم چه اتفاقی می‌افتد، و بعد راه‌حل صحیح را با من بررسی کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"virtual-memory",title:"حافظهٔ مجازی، Paging و Page Fault",level:"Advanced",minLadder:3,prereqs:["memory-hierarchy"],
short:"چگونه سیستم‌عامل توهم حافظهٔ نامحدود و ایزوله برای هر Process ایجاد می‌کند.",
deep:"هر Process فضای آدرس مجازی خودش را می‌بیند که توسط MMU (Memory Management Unit) به آدرس‌های فیزیکی RAM نگاشت می‌شود، از طریق جدول صفحه (Page Table). این نگاشت اجازه می‌دهد چند Process بدون تداخل در حافظهٔ یکدیگر اجرا شوند و امکان Swapping (انتقال صفحات کم‌استفاده به دیسک) را فراهم می‌کند. Page Fault زمانی رخ می‌دهد که Process به صفحه‌ای دسترسی پیدا کند که در حال حاضر در RAM نیست (یا اصلاً هنوز تخصیص نیافته)؛ سیستم‌عامل آن را از دیسک بارگذاری می‌کند که هزاران برابر کندتر از دسترسی مستقیم RAM است. وقتی حافظهٔ فیزیکی کم باشد و سیستم مدام صفحات را Swap کند، پدیدهٔ Thrashing رخ می‌دهد که عملکرد سیستم را به‌شدت فلج می‌کند — این دقیقاً همان چیزی است که در سرورهای تولید هنگام OOM (Out of Memory) نزدیک اتفاق می‌افتد. cgroups در لینوکس (که پایهٔ Docker و Kubernetes است) با محدود کردن حافظهٔ قابل‌دسترس هر Container، از این پدیده در سطح میزبان جلوگیری می‌کند اما در داخل Container، اگر برنامه از حد مجاز عبور کند، OOM Killer آن را می‌کشد.",
objectives:["توضیح نگاشت حافظهٔ مجازی به فیزیکی","تشخیص علائم Thrashing و OOM"],
example:"وقتی یک Pod در Kubernetes از memory limit عبور می‌کند، کرنل با OOM Killer پروسه را Kill می‌کند و Pod با کد خروج ۱۳۷ ری‌استارت می‌شود.",
py:"import resource\nprint(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)  # حداکثر حافظهٔ مصرفی فرآیند",
exercise:"با دستور free -h و vmstat 1 در لینوکس وضعیت حافظه و صفحه‌بندی سیستم خود را مشاهده کنید.",
project:"", resources:[{t:"OSTEP - Virtual Memory (رایگان)",u:"https://pages.cs.wisc.edu/~remzi/OSTEP/#virtualization"},{t:"cgroups v2 - kernel docs",u:"https://docs.kernel.org/admin-guide/cgroup-v2.html"}],
criteria:"می‌توانید توضیح دهید چرا Pod در Kubernetes با کد خطای 137 ری‌استارت می‌شود.",
interview:["Page Fault چیست و چه زمانی رخ می‌دهد؟","OOM Killer چگونه تصمیم می‌گیرد کدام پروسه را بکشد؟"],
mistakes:["تنظیم نکردن memory limit برای container که منجر به OOM غیرقابل‌پیش‌بینی می‌شود"],
production:"تنظیم صحیح requests/limits حافظه در Kubernetes مستقیماً از فهم Paging و OOM Killer می‌آید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم حافظهٔ مجازی، Page Fault و OOM Killer را طوری توضیح بده که به من کمک کند تنظیمات memory request/limit در Kubernetes را درست انتخاب کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

topics:[
{id:"linux-filesystem",title:"فایل‌سیستم لینوکس، inode و مجوزها",level:"Beginner",minLadder:1,prereqs:[],
short:"ساختار فایل‌سیستم لینوکس، inode، لینک‌ها و مدل مجوز.",
deep:"در لینوکس هر فایل یک inode دارد که متادیتای آن (اندازه، مالک، مجوزها، زمان‌ها، اشاره‌گر به بلوک‌های داده) را نگه می‌دارد؛ نام فایل صرفاً یک ورودی در دایرکتوری است که به یک inode اشاره می‌کند — به همین دلیل چند نام (Hard Link) می‌توانند به یک inode اشاره کنند و حذف یک نام، داده را از بین نمی‌برد تا زمانی‌که شمارندهٔ لینک به صفر برسد. Symbolic Link برخلاف Hard Link، یک فایل جداگانه است که فقط مسیر را نگه می‌دارد. مدل مجوز کلاسیک یونیکس (owner/group/other × read/write/execute) با bit‌های خاص مثل setuid و sticky bit تکمیل می‌شود. برای مهندس بک‌اند، فهم اینکه 'حذف' یک فایل باز روی لینوکس بلافاصله فضا را آزاد نمی‌کند (بلکه وقتی همهٔ فرآیندها آن را بستند) توضیح می‌دهد چرا لاگ‌فایل‌های حذف‌شده اما هنوز باز، می‌توانند دیسک را پر نگه دارند — یک اینسیدنت رایج در تولید.",
objectives:["توضیح تفاوت Hard Link و Symbolic Link","توضیح چرا دیسک پر می‌ماند وقتی فایل حذف شده اما فضا آزاد نشده"],
example:"وقتی nginx به یک فایل لاگ می‌نویسد و شما آن را rm می‌کنید بدون logrotate، فضای دیسک آزاد نمی‌شود تا nginx ری‌استارت شود چون فایل دسکریپتور هنوز باز است.",
py:"", exercise:"با دستورات ls -li، stat و df -h رفتار inode و فضای دیسک را در یک ماشین لینوکس (یا کانتینر) بررسی کنید. یک فایل بزرگ بسازید، آن را در حال باز بودن یک پروسه حذف کنید و مشاهده کنید df همچنان فضا را اشغال‌شده نشان می‌دهد.",
project:"", resources:[{t:"Linux Filesystem Hierarchy Standard",u:"https://refspecs.linuxfoundation.org/FHS_3.0/fhs-3.0.html"},{t:"The Linux Command Line (رایگان، PDF)",u:"https://linuxcommand.org/tlcl.php"}],
criteria:"می‌توانید توضیح دهید چرا حذف یک فایل لاگ باز، فضای دیسک را فوراً آزاد نمی‌کند و چگونه آن را رفع کنید.",
interview:["تفاوت Hard Link و Symbolic Link چیست؟","چرا df و du گاهی اعداد متفاوتی نشان می‌دهند؟"],
mistakes:["استفاده از rm روی لاگ‌فایل باز به‌جای logrotate یا truncate"],
production:"'دیسک پر است اما هیچ فایل بزرگی پیدا نمی‌کنم' یکی از کلاسیک‌ترین اینسیدنت‌های SRE است که ریشه‌اش در همین مفهوم است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم inode، Hard Link، Symbolic Link و مدیریت فضای دیسک در لینوکس را طوری توضیح بده که سناریوی واقعی «دیسک پر شده ولی du فایل بزرگی نشان نمی‌دهد» را بتوانم دیباگ کنم، و بعد از توضیح یک سناریوی مشابه به من بده تا حلش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-shell-basics",title:"مبانی Shell: ناوبری، Pipe، Redirect و Job Control",level:"Beginner",minLadder:1,prereqs:["linux-filesystem"],
short:"کار روان با ترمینال: جابه‌جایی، stdin/stdout/stderr، pipe، redirect، glob و مدیریت jobها.",
deep:"هر پروسه در لینوکس سه file descriptor استاندارد دارد: 0 (stdin)، 1 (stdout) و 2 (stderr). Pipe (|) خروجی stdout یک دستور را به stdin دستور بعدی می‌دهد و فلسفهٔ یونیکس ('ابزارهای کوچکی که یک کار را خوب انجام می‌دهند و با هم ترکیب می‌شوند') روی همین بنا شده است. Redirect با > (بازنویسی)، >> (افزودن)، 2> (فقط stderr) و 2>&1 (ادغام stderr در stdout) کار می‌کند — ترتیب مهم است: cmd > out.log 2>&1 هر دو را در فایل می‌نویسد اما cmd 2>&1 > out.log نه. Glob (*، ?، {a,b}) توسط خود shell قبل از اجرای دستور باز می‌شود، نه توسط دستور. Exit code (متغیر $?) صفر یعنی موفقیت و غیرصفر یعنی خطا؛ && و || بر همین اساس دستورات را زنجیر می‌کنند. Job control: Ctrl+Z پروسه را متوقف (SIGTSTP)، bg آن را در پس‌زمینه ادامه، fg به پیش‌زمینه برمی‌گرداند و & از ابتدا در پس‌زمینه اجرا می‌کند؛ nohup یا disown باعث می‌شود پروسه با بسته شدن ترمینال (SIGHUP) نمیرد. میان‌برهای حیاتی: Ctrl+R (جستجو در history)، Ctrl+A/E (ابتدا/انتهای خط)، !! (دستور قبلی) و !$ (آخرین آرگومان دستور قبلی).",
objectives:["توضیح تفاوت stdout و stderr و ترتیب درست 2>&1", "استفاده از exit code، && و || برای زنجیر کردن دستورات", "مدیریت پروسه‌های پس‌زمینه با &، bg، fg، jobs و nohup"],
example:"python manage.py migrate > migrate.log 2>&1 && echo OK || echo FAILED — خروجی و خطا هر دو در فایل ذخیره می‌شوند و بر اساس exit code پیام مناسب چاپ می‌شود.",
py:"import subprocess\nr = subprocess.run(['ls', '/nope'], capture_output=True, text=True)\nprint(r.returncode, repr(r.stdout), repr(r.stderr))  # stdout و stderr جدا هستند",
exercise:"یک دستور طولانی (مثل sleep 300) اجرا کنید، با Ctrl+Z متوقفش کنید، با bg به پس‌زمینه ببرید، با jobs ببینید و با fg برگردانید. سپس خروجی ls روی یک مسیر موجود و یک مسیر ناموجود را جداگانه در دو فایل out.txt و err.txt ذخیره کنید.",
project:"", resources:[{t:"The Linux Command Line (رایگان، PDF)",u:"https://linuxcommand.org/tlcl.php"},{t:"Bash Reference Manual - Redirections",u:"https://www.gnu.org/software/bash/manual/html_node/Redirections.html"},{t:"The Missing Semester (MIT) - Shell",u:"https://missing.csail.mit.edu/2020/course-shell/"}],
criteria:"بدون جستجو می‌توانید خروجی و خطای یک دستور را جدا یا ادغام در فایل ذخیره کنید و یک پروسه را از ترمینال جدا کنید تا با قطع SSH نمیرد.",
interview:["تفاوت cmd > f 2>&1 و cmd 2>&1 > f چیست؟", "چرا پروسه‌ای که در ترمینال SSH اجرا کرده‌اید با قطع اتصال می‌میرد و چطور جلویش را می‌گیرید؟"],
mistakes:["اجرای کارهای طولانی روی سرور بدون nohup/tmux و از دست دادن آن‌ها با قطع SSH", "نادیده گرفتن exit code در اسکریپت‌ها"],
production:"migration دیتابیس که وسط اجرا به خاطر قطع VPN و SIGHUP کشته شود، می‌تواند اسکیما را در وضعیت نیمه‌کاره رها کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مبانی کار با shell (stdin/stdout/stderr، pipe، redirect، exit code و job control) را با مثال‌های عملی روی یک سرور بک‌اند به من آموزش بده و بعد چند چالش کوچک ترمینالی به من بده تا حل کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-text-processing",title:"پردازش متن و جستجو: grep، find، sed، awk، xargs",level:"Beginner",minLadder:1,prereqs:["linux-shell-basics"],
short:"پیدا کردن فایل و متن، فیلتر و استخراج داده از لاگ‌ها و خروجی دستورات با ابزارهای متنی کلاسیک.",
deep:"grep خطوط منطبق با یک الگو را پیدا می‌کند: -i (بی‌توجه به بزرگی/کوچکی)، -r (بازگشتی)، -n (شمارهٔ خط)، -v (معکوس)، -E (regex گسترده)، -o (فقط بخش منطبق)، -c (شمارش) و -A/-B/-C (خطوط قبل/بعد برای کانتکست). ripgrep (rg) جایگزین مدرن و بسیار سریع‌تری است که .gitignore را هم رعایت می‌کند. find فایل‌ها را بر اساس نام، نوع، اندازه و زمان پیدا می‌کند (find /var/log -name '*.log' -mtime +7 -size +100M) و fd جایگزین ساده‌تر آن است. xargs خروجی یک دستور را به آرگومان دستور دیگر تبدیل می‌کند (برای نام‌های دارای فاصله از find -print0 | xargs -0 استفاده کنید). sed برای جایگزینی متن در جریان (sed -i 's/old/new/g' file) و awk برای کار ستونی مناسب است (awk '{print $1}' ستون اول را چاپ می‌کند). ترکیب کلاسیک sort | uniq -c | sort -rn | head پرتکرارترین مقادیر را نشان می‌دهد؛ cut، tr، wc، head و tail هم ابزارهای روزمره‌اند. برای JSON (مثل لاگ‌های ساختاریافته یا خروجی API) از jq استفاده کنید.",
objectives:["جستجوی بازگشتی کد و لاگ با grep/rg همراه با کانتکست", "استخراج پرتکرارترین IPها یا خطاها از یک لاگ با pipeline", "استفاده از find همراه با xargs یا -exec برای عملیات دسته‌ای"],
example:"awk '{print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -rn | head -10 — ده IP که بیشترین درخواست را زده‌اند (برای تشخیص حملهٔ brute-force یا کلاینت معیوب).",
py:"import re, collections\nips = collections.Counter(line.split()[0] for line in open('access.log'))\nprint(ips.most_common(10))  # معادل پایتونی pipeline بالا",
exercise:"یک فایل access.log نمونهٔ nginx دانلود یا تولید کنید و با یک pipeline پیدا کنید: ۱) تعداد درخواست‌های با status 5xx، ۲) پنج endpoint پرخطا، ۳) درخواست‌های کندتر از ۱ ثانیه (اگر فیلد request_time دارد). سپس با jq روی یک لاگ JSON فیلتر level=error بزنید.",
project:"", resources:[{t:"The Missing Semester (MIT) - Data Wrangling",u:"https://missing.csail.mit.edu/2020/data-wrangling/"},{t:"GNU grep manual",u:"https://www.gnu.org/software/grep/manual/grep.html"},{t:"The AWK Programming Language (کتاب)",u:"https://awk.dev/"},{t:"jq Manual",u:"https://jqlang.github.io/jq/manual/"}],
criteria:"در چند دقیقه می‌توانید از یک لاگ چندگیگابایتی، پرتکرارترین خطاها یا IPها را استخراج کنید بدون باز کردن کامل فایل در ادیتور.",
interview:["چطور ۱۰ IP پرتکرار را از لاگ nginx پیدا می‌کنید؟", "تفاوت find -exec و xargs چیست و چرا -print0 مهم است؟"],

ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ابزارهای grep، find، sed، awk، xargs و jq را با تمرکز بر تحلیل لاگ‌های واقعی بک‌اند به من آموزش بده. یک لاگ نمونهٔ nginx یا اپلیکیشن بساز و سؤال‌هایی بپرس که باید با یک pipeline جواب بدهم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-env-vars",title:"متغیرهای محیطی: export، PATH، فایل‌های .env و پیکربندی Shell",level:"Beginner",minLadder:1,prereqs:["linux-shell-basics"],
short:"تفاوت متغیر shell و متغیر محیطی، export، PATH، ترتیب لود شدن فایل‌های پیکربندی و مدیریت امن .env.",
deep:"متغیری که با VAR=value تعریف شود فقط در همان shell وجود دارد؛ export VAR=value آن را به محیط (environment) پروسه اضافه می‌کند تا همهٔ پروسه‌های فرزند آن را به ارث ببرند. نکتهٔ کلیدی: environment فقط از والد به فرزند کپی می‌شود و هیچ پروسهٔ فرزندی نمی‌تواند محیط والدش را تغییر دهد — به همین دلیل اجرای ./setenv.sh اثری ندارد و باید آن را source کنید (source setenv.sh یا . setenv.sh). VAR=value cmd متغیر را فقط برای همان یک اجرا تنظیم می‌کند. PATH لیست دایرکتوری‌هایی است که shell برای پیدا کردن دستورات به ترتیب جستجو می‌کند؛ which و type نشان می‌دهند کدام نسخه اجرا می‌شود. دستورات env، printenv و /proc/PID/environ محیط یک پروسه را نشان می‌دهند. فایل‌های پیکربندی: login shell فایل ~/.profile یا ~/.bash_profile (یا ~/.zprofile) و interactive shell فایل ~/.bashrc (یا ~/.zshrc) را می‌خواند؛ /etc/environment و /etc/profile.d سراسری هستند. در اپلیکیشن‌ها طبق اصل Twelve-Factor، پیکربندی از env var خوانده می‌شود؛ فایل .env را هرگز commit نکنید (در .gitignore بگذارید و یک .env.example نگه دارید). ابزارهایی مثل direnv متغیرها را به‌صورت خودکار بر اساس دایرکتوری لود می‌کنند. توجه کنید env var یک پروسه برای کاربران همان ماشین (از طریق /proc) و در لاگ‌های crash قابل مشاهده است، پس برای secretهای حساس در تولید، Secret Manager گزینهٔ بهتری است.",
objectives:["توضیح تفاوت متغیر shell و متغیر export‌شده و وراثت والد به فرزند", "توضیح چرا یک اسکریپت نمی‌تواند env والدش را تغییر دهد و نقش source", "اشکال‌زدایی PATH و تشخیص اینکه کدام باینری اجرا می‌شود"],
example:"بعد از نصب pyenv، دستور python هنوز نسخهٔ سیستمی را اجرا می‌کند چون خطوط مربوط به PATH در ~/.zshrc اضافه شده اما shell فعلی دوباره source نشده؛ type -a python همهٔ نسخه‌های موجود در PATH را به ترتیب نشان می‌دهد.",
py:"import os\ndb_url = os.environ.get('DATABASE_URL', 'sqlite:///dev.db')\nos.environ['CHILD_ONLY'] = '1'  # فقط روی این پروسه و فرزندانش اثر دارد، نه shell والد\nprint(db_url)",
exercise:"در یک shell متغیر A=1 (بدون export) و export B=2 تعریف کنید و با bash -c 'echo $A $B' ببینید کدام به فرزند می‌رسد. سپس اسکریپتی بنویسید که export C=3 می‌کند و یک بار با ./script.sh و یک بار با source اجرایش کنید و تفاوت را توضیح دهید. در نهایت یک پروژهٔ پایتون با .env، .env.example و python-dotenv راه بیندازید.",
project:"", resources:[{t:"The Twelve-Factor App - Config",u:"https://12factor.net/config"},{t:"Bash Startup Files",u:"https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html"},{t:"Zsh Startup Files",u:"https://zsh.sourceforge.io/Intro/intro_3.html"},{t:"direnv",u:"https://direnv.net/"}],
criteria:"می‌توانید توضیح دهید چرا متغیری که در ~/.bashrc تعریف کرده‌اید در یک cron job یا سرویس systemd وجود ندارد و چطور درستش کنید.",
interview:["تفاوت VAR=x و export VAR=x چیست؟", "چرا اسکریپت شما در ترمینال کار می‌کند اما در cron نه؟", "secretها را چطور به اپلیکیشن در تولید می‌دهید؟"],
mistakes:["commit کردن فایل .env حاوی secret در git", "فرض اینکه سرویس systemd یا cron همان env و PATH شِل تعاملی شما را دارد", "اضافه کردن مسیر به ابتدای PATH بدون فکر به shadow شدن باینری‌های سیستمی"],
production:"یکی از رایج‌ترین باگ‌های دیپلوی 'روی سیستم من کار می‌کند' این است که یک env var در shell توسعه‌دهنده تعریف شده ولی در کانتینر یا unit سرویس نه.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم environment variable، export، source، PATH و ترتیب لود شدن فایل‌های پیکربندی bash و zsh را به من آموزش بده، با تمرکز بر مشکلات واقعی مثل 'در cron کار نمی‌کند' و مدیریت امن secretها با .env. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-shells-zsh",title:"Shellهای مختلف (bash، zsh، fish)، Oh My Zsh، Aliases و Dotfiles",level:"Beginner",minLadder:null,prereqs:["linux-env-vars"],
short:"شناخت shellهای رایج، شخصی‌سازی ترمینال با zsh و Oh My Zsh، ساخت alias و تابع، و مدیریت dotfiles.",
deep:"sh (POSIX shell) استاندارد حداقلی است و روی هر سیستم یونیکسی وجود دارد (در Debian/Ubuntu در واقع dash است)؛ bash رایج‌ترین shell سرورها و پیش‌فرض اکثر توزیع‌هاست؛ zsh سازگاری بالایی با bash دارد اما تکمیل خودکار، glob پیشرفته و قابلیت شخصی‌سازی بسیار بیشتری دارد (پیش‌فرض macOS)؛ fish تجربهٔ کاربری عالی دارد اما سازگار با POSIX نیست. قاعدهٔ طلایی: shell تعاملی خود را هرچه دوست دارید انتخاب کنید، اما اسکریپت‌ها را با shebang صریح (#!/usr/bin/env bash) بنویسید تا مستقل از shell کاربر اجرا شوند. echo $SHELL shell پیش‌فرض و chsh -s $(which zsh) تغییر آن را انجام می‌دهد. Oh My Zsh فریم‌ورکی برای مدیریت پیکربندی zsh است: تم‌ها (ZSH_THEME)، و پلاگین‌هایی مثل git (aliasهای gst، gco، gp)، z یا zoxide (پرش سریع به دایرکتوری‌های پرکاربرد)، zsh-autosuggestions، zsh-syntax-highlighting، docker و kubectl. Powerlevel10k یا Starship promptهای سریع و اطلاعاتی (branch گیت، virtualenv، کانتکست Kubernetes) می‌سازند؛ مراقب باشید پلاگین‌های زیاد زمان باز شدن ترمینال را کند می‌کنند (با time zsh -i -c exit بسنجید). alias یک نام کوتاه برای دستور است (alias k=kubectl، alias ll='ls -lah')؛ برای منطق با آرگومان از تابع استفاده کنید (mkcd() { mkdir -p \"$1\" && cd \"$1\"; }). alias بدون آرگومان نشان می‌دهد چه aliasهایی تعریف شده و \\cmd یا command cmd alias را دور می‌زند. Dotfiles (.zshrc، .gitconfig، .tmux.conf و ...) را در یک ریپوی git نگه دارید و با symlink یا ابزاری مثل GNU Stow یا chezmoi روی ماشین‌های جدید مستقر کنید. ابزارهای مدرن مکمل: fzf (جستجوی fuzzy در history و فایل‌ها)، bat (cat با syntax highlight)، eza (ls بهتر).",
objectives:["توضیح تفاوت sh، bash، zsh و fish و اینکه اسکریپت را با کدام بنویسیم", "نصب و پیکربندی Oh My Zsh با چند پلاگین کاربردی", "ساخت alias و تابع shell و نگهداری dotfiles در git"],
example:"با alias k=kubectl و پلاگین kubectl در Oh My Zsh، و fzf روی Ctrl+R، دستورات طولانی روزمره (مثل k get pods -n payments) در چند کلید تایپ و از history پیدا می‌شوند.",
py:"",
exercise:"zsh و Oh My Zsh را نصب کنید، پلاگین‌های git، zsh-autosuggestions و zsh-syntax-highlighting را فعال کنید، fzf را نصب کنید و حداقل ۵ alias و ۱ تابع برای کارهای تکراری روزمره‌تان بسازید. سپس یک ریپوی dotfiles بسازید که .zshrc را با symlink مستقر می‌کند و زمان باز شدن shell را قبل و بعد از پلاگین‌ها اندازه بگیرید.",
project:"", resources:[{t:"Oh My Zsh",u:"https://ohmyz.sh/"},{t:"Zsh Documentation",u:"https://zsh.sourceforge.io/Doc/"},{t:"Starship Prompt",u:"https://starship.rs/"},{t:"fzf",u:"https://github.com/junegunn/fzf"},{t:"The Missing Semester (MIT) - Command-line Environment",u:"https://missing.csail.mit.edu/2020/command-line/"}],
criteria:"ترمینال شخصی‌سازی‌شده‌ای دارید که dotfiles آن در git است و روی یک ماشین جدید در چند دقیقه قابل بازسازی است، و می‌دانید چرا اسکریپت‌های پروژه نباید به zsh وابسته باشند.",
interview:["چرا shebang اسکریپت را #!/usr/bin/env bash می‌نویسید نه #!/bin/sh وقتی از قابلیت‌های bash استفاده می‌کنید؟", "تفاوت alias و تابع shell چیست؟"],
mistakes:["نوشتن اسکریپت‌های پروژه با syntax مخصوص zsh که روی سرور یا CI با bash یا sh شکست می‌خورند", "نصب ده‌ها پلاگین و کند شدن چندثانیه‌ای باز شدن ترمینال", "تعریف alias روی دستورات خطرناک (مثل rm) که روی سرورهای دیگر وجود ندارند و عادت غلط می‌سازند"],
production:"یک محیط ترمینال خوب سرعت شما را در اینسیدنت‌ها بالا می‌برد، اما روی سرورهای تولید معمولاً فقط bash خام دارید — پس به دستورات اصلی مسلط باشید، نه فقط به aliasهای خودتان.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تفاوت shellهای sh، bash، zsh و fish را توضیح بده و بعد مرا قدم‌به‌قدم در راه‌اندازی یک محیط ترمینال حرفه‌ای با zsh، Oh My Zsh، پلاگین‌های کاربردی، fzf، aliasها و یک ریپوی dotfiles راهنمایی کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-tmux",title:"tmux: Session، Window، Pane و کار پایدار روی سرور",level:"Beginner",minLadder:null,prereqs:["linux-shell-basics"],
short:"استفاده از terminal multiplexer برای تقسیم ترمینال، نگه‌داشتن sessionها بعد از قطع SSH و کار هم‌زمان روی چند چیز.",
deep:"tmux یک terminal multiplexer است: یک سرور در پس‌زمینه اجرا می‌شود که sessionها را نگه می‌دارد و کلاینت (ترمینال شما) فقط به آن attach می‌شود. نتیجهٔ مهم این است که اگر اتصال SSH قطع شود، session و همهٔ پروسه‌های داخلش زنده می‌مانند و با tmux attach دوباره به همان‌جا برمی‌گردید — جایگزینی بهتر از nohup برای کارهای تعاملی طولانی. سلسله‌مراتب: Session (یک فضای کاری، مثلاً یکی برای هر پروژه) ← Window (مثل تب) ← Pane (تقسیم صفحه). همهٔ کلیدها بعد از prefix (پیش‌فرض Ctrl+b) زده می‌شوند: % و \" تقسیم عمودی/افقی، کلیدهای جهت برای جابه‌جایی بین paneها، c ساخت window، n/p بعدی/قبلی، d جدا شدن (detach)، z بزرگ‌کردن pane، [ حالت copy/scroll. دستورات: tmux new -s name، tmux ls، tmux attach -t name، tmux kill-session -t name. در ~/.tmux.conf می‌توانید prefix را عوض کنید (مثلاً Ctrl+a)، mouse on را فعال کنید و ناوبری شبیه vim بسازید؛ پلاگین‌هایی مثل tmux-resurrect sessionها را حتی بعد از ری‌استارت ماشین بازیابی می‌کنند. با setw synchronize-panes on یک دستور هم‌زمان در همهٔ paneها (مثلاً روی چند سرور) تایپ می‌شود. screen جایگزین قدیمی‌تر است و Zellij جایگزین مدرن‌تر.",
objectives:["ساخت، detach و attach کردن session بعد از قطع SSH", "تقسیم صفحه به pane و مدیریت چند window", "پیکربندی پایهٔ ~/.tmux.conf"],
example:"روی سرور یک session به نام deploy می‌سازید: یک pane برای اجرای migration، یک pane با journalctl -f برای لاگ‌ها و یک pane با htop؛ اگر Wi‑Fi قطع شود، با tmux attach -t deploy همه‌چیز سر جایش است.",
py:"",
exercise:"یک session به نام work بسازید با سه window: editor، server (اجرای یک سرور پایتون) و logs (دو pane: tail -f و htop). از session detach کنید، ترمینال را ببندید، دوباره attach کنید. سپس یک ~/.tmux.conf با prefix دلخواه، mouse on و split با کلیدهای | و - بسازید و به ریپوی dotfiles اضافه کنید.",
project:"", resources:[{t:"tmux Wiki - Getting Started",u:"https://github.com/tmux/tmux/wiki/Getting-Started"},{t:"tmux Cheat Sheet",u:"https://tmuxcheatsheet.com/"},{t:"tmux 2: Productive Mouse-Free Development (کتاب)",u:"https://pragprog.com/titles/bhtmux2/tmux-2/"},{t:"tmux-resurrect",u:"https://github.com/tmux-plugins/tmux-resurrect"}],
criteria:"هر کار طولانی روی سرور را داخل tmux اجرا می‌کنید و بدون فکر کردن بین session، window و pane جابه‌جا می‌شوید.",
interview:["tmux چه مشکلی را حل می‌کند که nohup حل نمی‌کند؟", "اگر وسط اجرای یک اسکریپت طولانی روی سرور اتصال SSH قطع شود چه اتفاقی می‌افتد و چطور از آن جلوگیری می‌کنید؟"],
mistakes:["اجرای migration یا backup طولانی مستقیماً در SSH بدون tmux", "رها کردن ده‌ها session قدیمی روی سرورهای مشترک"],
production:"در عملیات دستی حساس (مثل migration بزرگ یا restore بکاپ) اجرای داخل tmux استاندارد عملی تیم‌های SRE است تا قطع شبکه باعث شکست نیمه‌کاره نشود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. tmux را از صفر به من آموزش بده: مفهوم session/window/pane، کلیدهای پرکاربرد و یک ~/.tmux.conf خوب. بعد چند تمرین عملی شبیه‌سازی کار روی سرور (مثل قطع SSH وسط کار) به من بده. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-htop-resources",title:"مانیتورینگ منابع: htop، free، df/du، iotop و Load Average",level:"Beginner",minLadder:1,prereqs:["linux-shell-basics"],
short:"خواندن درست htop و ابزارهای منابع سیستم: CPU، حافظه، دیسک، Load Average و اینکه کدام پروسه مقصر است.",
deep:"htop نسخهٔ تعاملی و خواناتر top است: نوارهای بالای صفحه مصرف هر هسته، حافظه و swap را نشان می‌دهند؛ Load Average سه عدد (میانگین ۱، ۵ و ۱۵ دقیقه) تعداد پروسه‌های در حال اجرا یا منتظر CPU/I/O غیرقابل‌وقفه (state D) است و باید با تعداد هسته‌ها مقایسه شود — load 8 روی ماشین ۸ هسته‌ای یعنی تقریباً کامل پر، روی ۲ هسته‌ای یعنی صف طولانی. ستون‌های مهم: VIRT (کل فضای آدرس مجازی — معمولاً بی‌اهمیت)، RES (حافظهٔ فیزیکی واقعاً مصرف‌شده)، SHR (بخش اشتراکی)، S (وضعیت: R در حال اجرا، S خواب، D منتظر I/O، Z زامبی)، و %CPU (می‌تواند بیش از ۱۰۰٪ باشد وقتی پروسه چندنخی است). کلیدهای کاربردی htop: F6 یا > (مرتب‌سازی)، F4 یا \\ (فیلتر)، F5 یا t (نمای درختی والد-فرزند)، H (نمایش/مخفی کردن thread‌ها)، F9 (ارسال سیگنال). free -h: ستون available مهم است نه free، چون لینوکس حافظهٔ آزاد را برای page cache استفاده می‌کند ('حافظهٔ آزاد، حافظهٔ هدررفته است'). df -h فضای هر فایل‌سیستم و df -i تعداد inodeهای باقی‌مانده را نشان می‌دهد (دیسک می‌تواند با فضای خالی به خاطر اتمام inode پر شود)؛ du -sh * | sort -h یا ncdu بزرگ‌ترین دایرکتوری‌ها را پیدا می‌کنند. iotop و pidstat -d 1 نشان می‌دهند کدام پروسه دیسک را اشغال کرده، و btop یا glances نمای جامع‌تری ارائه می‌کنند.",
objectives:["تفسیر درست Load Average نسبت به تعداد هسته‌ها", "تفاوت VIRT و RES و خواندن ستون available در free", "پیدا کردن سریع علت پر شدن دیسک با df، du و ncdu"],
example:"free -h نشان می‌دهد free فقط 200MB است و تیم نگران می‌شود، اما available برابر 6GB است — بقیه page cache است و مشکلی وجود ندارد. در مقابل، اگر swap مدام در حال رشد باشد و available نزدیک صفر، OOM در راه است.",
py:"import os, shutil\nprint('load avg:', os.getloadavg(), 'cores:', os.cpu_count())\nprint(shutil.disk_usage('/'))",
exercise:"htop را باز کنید و با stress یا stress-ng (یا یک حلقهٔ بی‌نهایت پایتون) بار CPU ایجاد کنید؛ پروسه را با فیلتر پیدا کنید، در نمای درختی ببینید و با F9 یک SIGTERM بفرستید. سپس با ncdu بزرگ‌ترین دایرکتوری‌های سیستم را پیدا کنید و با df -i وضعیت inode را چک کنید.",
project:"", resources:[{t:"htop Explained Visually",u:"https://peteris.rocks/blog/htop/"},{t:"Linux ate my RAM",u:"https://www.linuxatemyram.com/"},{t:"Brendan Gregg - Linux Load Averages",u:"https://www.brendangregg.com/blog/2017-08-08/linux-load-averages.html"},{t:"ncdu",u:"https://dev.yorhel.nl/ncdu"}],
criteria:"با یک نگاه به htop و free می‌توانید بگویید سیستم CPU-bound است، I/O-bound است یا کمبود حافظه دارد و کدام پروسه عامل آن است.",
interview:["Load Average برابر 4 خوب است یا بد؟", "تفاوت VIRT و RES در htop چیست؟", "چرا free حافظهٔ آزاد کمی نشان می‌دهد اما سیستم مشکلی ندارد؟"],
mistakes:["وحشت از free پایین به‌جای نگاه به available", "مقایسهٔ Load Average بدون در نظر گرفتن تعداد هسته‌ها", "kill -9 کردن پروسه به‌جای SIGTERM و فرصت دادن برای shutdown تمیز"],
production:"هشدار 'دیسک ۹۵٪ پر شد' در نیمه‌شب معمولاً با df -h، du -sh | sort -h و پیدا کردن لاگ یا فایل موقت بزرگ در چند دقیقه حل می‌شود — اگر ابزارها را بلد باشید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. خواندن htop، free، df/du، iotop و مفهوم Load Average را به من آموزش بده. برای هر ابزار یک خروجی نمونه از یک سرور دارای مشکل بساز و از من بپرس مشکل چیست و کدام پروسه مقصر است. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-process-tools",title:"ابزارهای مانیتورینگ و عیب‌یابی پردازش (ps, top, strace, lsof)",level:"Intermediate",minLadder:2,prereqs:["linux-htop-resources","process-vs-thread"],
short:"ابزارهای خط فرمان برای مشاهدهٔ وضعیت زندهٔ سیستم و عیب‌یابی مشکلات عملکردی.",
deep:"top/htop مصرف لحظه‌ای CPU و حافظه را نشان می‌دهند؛ ps aux لیست پروسه‌ها را نمایش می‌دهد؛ lsof -p PID فایل‌ها و سوکت‌های باز یک پروسه را نشان می‌دهد که برای پیدا کردن file descriptor leak یا کانکشن‌های آویزان حیاتی است؛ strace -p PID سیستم‌کال‌های واقعی که یک پروسه صادر می‌کند را نشان می‌دهد و برای فهمیدن اینکه یک پروسهٔ 'گیر کرده' دقیقاً منتظر چه چیزی است (مثلاً read روی یک سوکت) بی‌نظیر است؛ vmstat و iostat وضعیت حافظه و I/O دیسک را در طول زمان نشان می‌دهند. یک روش استاندارد عیب‌یابی: وقتی سرویسی کند شده، ابتدا top برای دیدن CPU/Memory، سپس vmstat 1 برای دیدن اگر CPU منتظر I/O است (ستون wa)، سپس iostat -x 1 برای دیدن دیسک کدام دستگاه درگیر است، و در نهایت strace یا perf برای عمیق‌تر شدن.",
objectives:["استفاده از strace برای فهمیدن اینکه پروسه منتظر چیست","استفاده از lsof برای پیدا کردن file descriptor leak"],
example:"اگر یک پروسهٔ پایتون هزاران فایل باز کرده و نبسته، lsof -p PID | wc -l تعداد آن‌ها را نشان می‌دهد و به شما می‌گوید 'Too many open files' از کجا می‌آید.",
py:"import resource\nprint(resource.getrlimit(resource.RLIMIT_NOFILE))  # محدودیت تعداد فایل دیسکریپتور باز",
exercise:"یک اسکریپت پایتون بنویسید که عمداً فایل دیسکریپتور لیک کند (فایل باز می‌کند و نمی‌بندد)، سپس با lsof رشد تعداد فایل‌های باز آن را رصد کنید.",
project:"", resources:[{t:"Brendan Gregg - Linux Performance",u:"https://www.brendangregg.com/linuxperf.html"},{t:"strace man page",u:"https://man7.org/linux/man-pages/man1/strace.1.html"}],
criteria:"در یک سناریوی 'سرویس گیر کرده' می‌توانید با ترکیب top/strace/lsof علت را در چند دقیقه پیدا کنید.",
interview:["strace چیست و چه زمانی استفاده می‌شود؟","چطور file descriptor leak را در تولید تشخیص می‌دهید؟"],
mistakes:["اجرای strace روی سرویس پرترافیک تولید بدون آگاهی از overhead آن"],
production:"'Too many open files' یک اینسیدنت رایج در سرویس‌های بک‌اند است که ریشه‌اش نبستن فایل/کانکشن است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. می‌خواهم ابزارهای عیب‌یابی لینوکس (top, ps, lsof, strace, vmstat, iostat) را در قالب سناریوهای واقعی SRE یاد بگیرم. یک سناریوی 'سرویس کند شده' طراحی کن و مرا قدم‌به‌قدم راهنمایی کن کدام ابزار را کِی استفاده کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-systemd",title:"systemd: مدیریت سرویس‌ها، Unit File و Timer",level:"Intermediate",minLadder:3,prereqs:["linux-env-vars", "linux-process-tools"],
short:"اجرای اپلیکیشن به‌عنوان سرویس پایدار با systemd: start/stop/enable، نوشتن unit file، ری‌استارت خودکار و زمان‌بندی با timer یا cron.",
deep:"systemd اولین پروسه (PID 1) در اکثر توزیع‌های مدرن است و سرویس‌ها را مدیریت می‌کند. systemctl status/start/stop/restart/reload nginx وضعیت را کنترل می‌کند؛ enable سرویس را برای اجرا بعد از بوت فعال می‌کند (با --now هم‌زمان اجرا هم می‌کند)؛ systemctl list-units --failed سرویس‌های شکست‌خورده را نشان می‌دهد. یک unit file (در /etc/systemd/system/app.service) شامل بخش [Unit] (توضیح و وابستگی‌ها مثل After=network-online.target)، [Service] (ExecStart، User، WorkingDirectory، Environment یا EnvironmentFile، Restart=on-failure، RestartSec) و [Install] (WantedBy=multi-user.target) است. بعد از هر تغییر systemctl daemon-reload لازم است. نکتهٔ مهم: سرویس systemd محیط shell شما را ندارد — PATH و متغیرها باید صریحاً تعریف شوند. systemd با cgroup محدودیت منابع اعمال می‌کند (MemoryMax، CPUQuota) و گزینه‌های امنیتی مثل NoNewPrivileges و ProtectSystem دارد. برای کارهای زمان‌بندی‌شده، systemd timer (فایل .timer کنار .service) جایگزین مدرن cron است و مزیت‌هایی مثل لاگ در journal و Persistent=true (اجرای کار جامانده بعد از خاموشی) دارد؛ اما crontab -e و syntax پنج‌ستونی cron (دقیقه ساعت روز ماه روزِهفته) همچنان همه‌جا وجود دارد و باید بلد باشید. systemd-analyze blame زمان بوت هر سرویس را نشان می‌دهد.",
objectives:["نوشتن unit file برای یک اپلیکیشن پایتون با Restart و EnvironmentFile", "عیب‌یابی سرویسی که start نمی‌شود با systemctl status و journalctl -u", "زمان‌بندی یک کار با systemd timer و با cron"],
example:"یک API ساخته‌شده با FastAPI به‌صورت سرویس systemd با User=app، EnvironmentFile=/etc/app/env و Restart=on-failure اجرا می‌شود؛ اگر crash کند، systemd بعد از ۵ ثانیه آن را دوباره بالا می‌آورد و لاگ‌ها در journalctl -u app قابل مشاهده‌اند.",
py:"# /etc/systemd/system/app.service\n# [Service]\n# ExecStart=/opt/app/.venv/bin/uvicorn main:app --port 8000\n# EnvironmentFile=/etc/app/env\n# Restart=on-failure\nimport signal, sys\nsignal.signal(signal.SIGTERM, lambda *_: sys.exit(0))  # shutdown تمیز هنگام systemctl stop",
exercise:"یک سرور HTTP پایتون ساده را به سرویس systemd تبدیل کنید (کاربر اختصاصی، EnvironmentFile، Restart=on-failure). پروسه را با kill -9 بکشید و ری‌استارت خودکار را در journalctl ببینید. سپس یک timer بسازید که هر ۵ دقیقه یک اسکریپت health-check اجرا کند و همان را با crontab هم پیاده کنید و مقایسه کنید.",
project:"", resources:[{t:"systemd.service man page",u:"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html"},{t:"ArchWiki - systemd",u:"https://wiki.archlinux.org/title/Systemd"},{t:"ArchWiki - systemd/Timers",u:"https://wiki.archlinux.org/title/Systemd/Timers"},{t:"crontab.guru",u:"https://crontab.guru/"}],
criteria:"می‌توانید یک اپلیکیشن را از صفر به سرویس پایدار با ری‌استارت خودکار و لاگ در journal تبدیل کنید و علت start نشدن یک سرویس را پیدا کنید.",
interview:["تفاوت systemctl enable و start چیست؟", "چرا اسکریپتی که در ترمینال کار می‌کند به‌عنوان سرویس systemd یا cron شکست می‌خورد؟", "مزیت systemd timer نسبت به cron چیست؟"],
mistakes:["فراموش کردن daemon-reload بعد از ویرایش unit file", "اجرای سرویس با کاربر root بدون دلیل", "Restart=always بدون RestartSec که باعث crash-loop سریع و پر شدن لاگ می‌شود"],
production:"حتی در دنیای Kubernetes، سرویس‌های زیرساختی (kubelet، containerd، node-exporter) با systemd اجرا می‌شوند و دیباگ نود بدون systemctl و journalctl ممکن نیست.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. systemd را به من آموزش بده: systemctl، نوشتن unit file برای یک اپلیکیشن پایتون، محدودیت منابع، timer و مقایسه با cron. بعد یک unit file دارای چند باگ به من بده تا پیدا و اصلاح کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-logs",title:"لاگ‌ها در لینوکس: journalctl، /var/log، tail -f، less و logrotate",level:"Intermediate",minLadder:2,prereqs:["linux-text-processing", "linux-process-tools"],
short:"پیدا کردن، خواندن و فیلتر کردن لاگ‌های سیستم و سرویس‌ها، و جلوگیری از پر شدن دیسک با چرخش لاگ.",
deep:"در سیستم‌های مدرن مبتنی بر systemd، سرویس‌ها به stdout/stderr می‌نویسند و systemd-journald آن‌ها را جمع‌آوری می‌کند؛ journalctl ابزار خواندن آن است: -u nginx (فقط یک سرویس)، -f (دنبال کردن زنده)، -n 100 (آخرین ۱۰۰ خط)، --since '1 hour ago' یا --since '2026-09-28 10:00' (بازهٔ زمانی)، -p err (فقط خطاها به بالا)، -b (از آخرین بوت؛ -b -1 بوت قبلی — برای فهمیدن علت ری‌استارت ناگهانی)، -k (پیام‌های کرنل) و -o json-pretty (خروجی ساختاریافته). journalctl --disk-usage و --vacuum-size=500M حجم journal را مدیریت می‌کنند. لاگ‌های فایلی سنتی در /var/log قرار دارند: syslog یا messages (عمومی)، auth.log یا secure (ورود و sudo — برای بررسی تلاش‌های SSH brute-force)، kern.log، و لاگ‌های اپلیکیشن مثل /var/log/nginx/. dmesg -T پیام‌های کرنل را با زمان خوانا نشان می‌دهد و جای اول برای دیدن OOM Killer (Out of memory: Killed process)، خطاهای دیسک یا مشکلات درایور است. tail -f file (یا tail -F که بعد از چرخش فایل هم ادامه می‌دهد) لاگ را زنده دنبال می‌کند؛ less +F همین کار را می‌کند و با Ctrl+C می‌توانید اسکرول و با / جستجو کنید؛ zgrep و zless روی لاگ‌های فشرده .gz کار می‌کنند. logrotate لاگ‌های فایلی را بر اساس زمان یا اندازه می‌چرخاند، فشرده و حذف می‌کند؛ گزینهٔ copytruncate یا postrotate با ارسال سیگنال به سرویس برای جلوگیری از مشکل 'فایل حذف‌شده اما باز' ضروری است. در کانتینرها، docker logs و kubectl logs (با --previous برای کانتینر crash‌شده) معادل این ابزارها هستند.",
objectives:["فیلتر لاگ یک سرویس بر اساس زمان و سطح با journalctl", "پیدا کردن اثر OOM Killer یا ری‌استارت ناگهانی در dmesg و journal بوت قبلی", "پیکربندی logrotate برای یک لاگ اپلیکیشن"],
example:"سرویس پرداخت ساعت ۳ صبح بی‌صدا ری‌استارت شده؛ journalctl -u payments --since '03:00' --until '03:10' آخرین لاگ‌ها را نشان می‌دهد و dmesg -T | grep -i 'killed process' ثابت می‌کند OOM Killer آن را کشته است.",
py:"import logging, sys\nlogging.basicConfig(stream=sys.stdout, level=logging.INFO,\n                    format='%(asctime)s %(levelname)s %(name)s %(message)s')\nlogging.getLogger('payments').error('charge failed')  # stdout -> journald / docker logs",
exercise:"یک سرویس systemd ساده (مثلاً اسکریپت پایتون که هر ثانیه لاگ می‌زند و گاهی error) بسازید. با journalctl فقط errorهای ۱۰ دقیقهٔ اخیر آن را ببینید، خروجی را به JSON بگیرید و با jq فیلتر کنید. سپس برای یک فایل لاگ دستی یک کانفیگ logrotate روزانه با نگهداری ۷ نسخه و فشرده‌سازی بنویسید و با logrotate -d تست کنید.",
project:"", resources:[{t:"journalctl man page",u:"https://man7.org/linux/man-pages/man1/journalctl.1.html"},{t:"DigitalOcean - How To Use Journalctl",u:"https://www.digitalocean.com/community/tutorials/how-to-use-journalctl-to-view-and-manipulate-systemd-logs"},{t:"logrotate man page",u:"https://man7.org/linux/man-pages/man8/logrotate.8.html"},{t:"The Twelve-Factor App - Logs",u:"https://12factor.net/logs"}],
criteria:"در یک اینسیدنت می‌توانید در کمتر از چند دقیقه لاگ‌های مرتبط با یک بازهٔ زمانی و یک سرویس را پیدا کنید و علت crash (خطای برنامه، OOM یا ری‌استارت ماشین) را تشخیص دهید.",
interview:["چطور می‌فهمید یک پروسه توسط OOM Killer کشته شده؟", "تفاوت tail -f و tail -F چیست؟", "چرا لاگ اپلیکیشن در کانتینر باید به stdout نوشته شود نه فایل؟"],
mistakes:["نبودن logrotate و پر شدن دیسک با لاگ", "جستجو فقط در لاگ اپلیکیشن و نادیده گرفتن dmesg و لاگ سیستم", "لاگ کردن داده‌های حساس (توکن، شماره کارت) که بعداً در /var/log و سیستم‌های تجمیع لاگ پخش می‌شوند"],
production:"تقریباً هر post-mortem با این سؤال شروع می‌شود که 'لاگ‌ها در آن لحظه چه می‌گفتند؟'؛ سرعت شما در پیدا کردن لاگ درست، مستقیماً MTTR را کاهش می‌دهد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدیریت و خواندن لاگ در لینوکس (journalctl، /var/log، dmesg، tail/less، logrotate و kubectl logs) را به من آموزش بده و بعد چند سناریوی واقعی 'سرویس crash کرده، علت را از لاگ‌ها پیدا کن' با خروجی نمونه طراحی کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-networking-tools",title:"ابزارهای شبکه: ss, tcpdump, dig, curl",level:"Intermediate",minLadder:2,prereqs:["linux-process-tools"],
short:"عیب‌یابی مشکلات شبکه از لایهٔ DNS تا TCP با ابزارهای خط فرمان.",
deep:"dig/nslookup برای عیب‌یابی DNS استفاده می‌شوند (آیا نام دامنه حل می‌شود؟ کدام سرور اقتدار پاسخ می‌دهد؟)؛ curl -v برای دیدن کامل چرخهٔ HTTP شامل هدرها و زمان‌بندی؛ ss -tulnp (جایگزین مدرن netstat) پورت‌های باز و کانکشن‌های TCP/UDP را نشان می‌دهد؛ tcpdump بسته‌های واقعی شبکه را capture می‌کند و برای دیدن اینکه آیا بسته‌ها اصلاً به سرور می‌رسند یا نه، یا آیا TLS handshake موفق است، حیاتی است. یک تکنیک کلیدی SRE: وقتی یک سرویس نمی‌تواند به سرویس دیگری متصل شود، ابتدا با dig بررسی کنید DNS درست resolve می‌شود، سپس با curl -v اتصال HTTP را تست کنید، و اگر مشکوک به مشکل شبکهٔ پایین‌تر بودید (مثل firewall)، با tcpdump ببینید آیا SYN packet اصلاً پاسخ SYN-ACK می‌گیرد یا خیر — این به شما می‌گوید مشکل در برنامه است یا در شبکه.",
objectives:["تشخیص اینکه مشکل اتصال در DNS، TCP یا اپلیکیشن است","خواندن خروجی tcpdump برای TCP handshake"],
example:"curl -v https://example.com نشان می‌دهد آیا DNS resolve شد، TCP connect چقدر طول کشید، TLS handshake موفق بود یا نه، و زمان دریافت هدرهای پاسخ.",
py:"import socket\ntry:\n    print(socket.gethostbyname('example.com'))\nexcept socket.gaierror as e:\n    print('DNS failed:', e)",
exercise:"با tcpdump -i any port 443 -c 20 یک درخواست HTTPS واقعی را رصد کنید و SYN/SYN-ACK/ACK را در خروجی پیدا کنید.",
project:"", resources:[{t:"tcpdump man page",u:"https://www.tcpdump.org/manpages/tcpdump.1.html"},{t:"ss(8) man page",u:"https://man7.org/linux/man-pages/man8/ss.8.html"}],
criteria:"می‌توانید در یک سناریوی 'سرویس A نمی‌تواند به سرویس B متصل شود' با ترکیب dig/curl/tcpdump لایهٔ مشکل را مشخص کنید.",
interview:["چطور تشخیص می‌دهید مشکل اتصال، DNS است یا TCP یا برنامه؟"],
mistakes:["فرض کردن مشکل در کد اپلیکیشن قبل از بررسی لایه‌های شبکه پایین‌تر"],
production:"در محیط‌های Kubernetes، بسیاری از مشکلات اتصال ریشه در DNS (CoreDNS) یا Network Policy دارند نه کد برنامه.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ابزارهای شبکهٔ لینوکس (dig, curl -v, ss, tcpdump) را در قالب چند سناریوی واقعی 'سرویس نمی‌تواند متصل شود' به من آموزش بده و از من بخواه لایهٔ مشکل (DNS/TCP/TLS/App) را تشخیص دهم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-ssh",title:"SSH حرفه‌ای: کلیدها، ~/.ssh/config، Tunneling و انتقال فایل",level:"Intermediate",minLadder:2,prereqs:["linux-shell-basics", "linux-networking-tools"],
short:"اتصال امن و سریع به سرورها با کلید، پیکربندی ~/.ssh/config، jump host، port forwarding و scp/rsync.",
deep:"احراز هویت با کلید (ssh-keygen -t ed25519) امن‌تر و راحت‌تر از رمز عبور است: کلید عمومی در ~/.ssh/authorized_keys سرور قرار می‌گیرد (ssh-copy-id) و کلید خصوصی هرگز ماشین شما را ترک نمی‌کند؛ مجوزها باید سخت‌گیرانه باشند (chmod 700 ~/.ssh و 600 روی کلید خصوصی) وگرنه SSH آن را رد می‌کند. ssh-agent کلید رمزگذاری‌شده را در حافظه نگه می‌دارد تا هر بار passphrase نپرسد. ~/.ssh/config برای هر سرور یک Host alias با HostName، User، Port، IdentityFile تعریف می‌کند تا فقط ssh prod-db تایپ کنید؛ ProxyJump (یا ssh -J) از طریق یک bastion/jump host به سرورهای شبکهٔ خصوصی وصل می‌شود. Port forwarding: ssh -L 5433:db.internal:5432 bastion پورت دیتابیس داخلی را روی localhost شما می‌آورد (برای وصل شدن با DBeaver یا psql بدون باز کردن دیتابیس به اینترنت)، -R برعکس آن و -D یک SOCKS proxy می‌سازد. انتقال فایل: scp برای موارد ساده و rsync -avz --progress برای انتقال‌های بزرگ یا تکراری (فقط تفاوت‌ها را منتقل می‌کند و قابل ادامه است). امنیت سرور: در /etc/ssh/sshd_config ورود با رمز (PasswordAuthentication no) و ورود root را غیرفعال کنید و از fail2ban استفاده کنید. ssh-agent forwarding (-A) را فقط روی سرورهای مورد اعتماد فعال کنید، چون root آن سرور می‌تواند از agent شما استفاده کند؛ ProxyJump امن‌تر است.",
objectives:["ساخت کلید ed25519 و تنظیم ورود بدون رمز", "نوشتن ~/.ssh/config با ProxyJump", "دسترسی به دیتابیس داخلی با local port forwarding"],
example:"ssh -L 5433:payments-db.internal:5432 bastion و سپس psql -h localhost -p 5433 — دسترسی موقت و امن به دیتابیس خصوصی بدون باز کردن هیچ پورتی در فایروال.",
py:"import subprocess\nsubprocess.run(['rsync', '-avz', '--progress', './dist/', 'prod-web:/opt/app/'], check=True)",
exercise:"یک کلید ed25519 با passphrase بسازید، آن را به یک VM یا کانتینر با sshd اضافه کنید و ورود با رمز را روی آن غیرفعال کنید. یک ~/.ssh/config با دو Host (یکی jump و یکی سرور پشت آن با ProxyJump) بنویسید. در نهایت با -L به یک سرویس داخلی (مثلاً Postgres یا Redis روی سرور) از localhost وصل شوید و یک دایرکتوری را با rsync همگام کنید.",
project:"", resources:[{t:"SSH Academy (ssh.com)",u:"https://www.ssh.com/academy/ssh"},{t:"ssh_config man page",u:"https://man7.org/linux/man-pages/man5/ssh_config.5.html"},{t:"The Missing Semester (MIT) - Remote Machines",u:"https://missing.csail.mit.edu/2020/command-line/#remote-machines"},{t:"rsync man page",u:"https://download.samba.org/pub/rsync/rsync.1"}],
criteria:"با یک دستور کوتاه به هر سرور (حتی پشت bastion) وصل می‌شوید و می‌توانید بدون تغییر فایروال به یک سرویس داخلی دسترسی موقت بگیرید.",
interview:["تفاوت ssh -L و ssh -R چیست؟", "چرا agent forwarding می‌تواند خطرناک باشد؟", "چطور یک سرور SSH را امن می‌کنید؟"],
mistakes:["commit یا اشتراک‌گذاری کلید خصوصی", "باز گذاشتن پورت دیتابیس به اینترنت به‌جای tunnel از طریق bastion", "استفاده از scp برای انتقال‌های بزرگ و قطع شدن بدون امکان ادامه به‌جای rsync"],
production:"در سازمان‌های مالی دسترسی به سرورها و دیتابیس‌های تولید تقریباً همیشه از طریق bastion و SSH tunnel (یا ابزارهایی مثل Teleport) و با ثبت ممیزی انجام می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. SSH را در سطح حرفه‌ای به من آموزش بده: کلیدها و ssh-agent، ~/.ssh/config، ProxyJump، port forwarding (-L، -R، -D)، rsync و امن‌سازی sshd. برای هر بخش یک سناریوی واقعی دسترسی به سرور یا دیتابیس خصوصی طراحی کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-bash-scripting",title:"اسکریپت‌نویسی Bash: متغیر، شرط، حلقه، تابع و اسکریپت امن",level:"Intermediate",minLadder:3,prereqs:["linux-text-processing", "linux-env-vars"],
short:"نوشتن اسکریپت‌های قابل‌اعتماد برای خودکارسازی کارهای روزمره، دیپلوی و عملیات، و دانستن اینکه کِی باید سراغ پایتون رفت.",
deep:"یک اسکریپت خوب با #!/usr/bin/env bash و set -euo pipefail شروع می‌شود: -e با اولین خطا متوقف می‌شود، -u استفاده از متغیر تعریف‌نشده را خطا می‌داند و pipefail باعث می‌شود شکست هر بخش از pipeline شکست کل آن باشد (بدون آن، false | true موفق است). متغیرها را همیشه داخل کوتیشن بگذارید (\"$file\")، چون بدون آن فاصله و کاراکترهای glob باعث word splitting می‌شوند — منشأ بسیاری از باگ‌های خطرناک مثل rm -rf $DIR/ وقتی DIR خالی است. ساختارها: if [[ -f \"$f\" ]]؛ for f in *.log؛ while read -r line؛ case برای پردازش آرگومان؛ $(cmd) برای command substitution؛ ${VAR:-default} برای مقدار پیش‌فرض؛ \"$@\" برای انتقال همهٔ آرگومان‌ها؛ آرایه‌ها و local در توابع. trap 'cleanup' EXIT تضمین می‌کند فایل‌های موقت (ساخته‌شده با mktemp) حتی در صورت خطا پاک شوند. getopts برای پردازش فلگ‌ها، و heredoc (<<EOF) برای متن چندخطی. ShellCheck یک linter ضروری است که اکثر این اشتباهات را پیدا می‌کند و باید در CI اجرا شود. قاعدهٔ عملی: اگر اسکریپت از حدود ۱۰۰ خط بیشتر شد، ساختار دادهٔ پیچیده، پردازش JSON جدی یا error handling دقیق لازم داشت، آن را با پایتون بنویسید.",
objectives:["نوشتن اسکریپت با set -euo pipefail، trap و quoting درست", "پردازش آرگومان‌ها با getopts یا case", "استفاده از ShellCheck و تشخیص مرز bash و پایتون"],
example:"یک اسکریپت backup.sh که با pg_dump از دیتابیس بکاپ می‌گیرد، آن را فشرده و با تاریخ نام‌گذاری می‌کند، بکاپ‌های قدیمی‌تر از ۷ روز را پاک می‌کند و در صورت شکست هر مرحله (به لطف pipefail) با کد غیرصفر خارج شده و هشدار می‌فرستد.",
py:"import subprocess\n# معادل امن‌تر اسکریپت‌های bash پیچیده: بدون word splitting و با خطای صریح\nsubprocess.run(['pg_dump', '-Fc', '-f', 'backup.dump', 'payments'], check=True)",
exercise:"اسکریپتی بنویسید که یک دایرکتوری لاگ را بگیرد (با فلگ -d و -n برای تعداد روز)، فایل‌های قدیمی‌تر از n روز را فشرده و به یک دایرکتوری archive منتقل کند، با trap فایل‌های موقت را پاک کند، و با --dry-run فقط کارهایی که انجام می‌دهد را چاپ کند. آن را با ShellCheck بدون هیچ هشداری تمیز کنید و روی نام فایل‌های دارای فاصله تست کنید.",
project:"", resources:[{t:"ShellCheck",u:"https://www.shellcheck.net/"},{t:"Bash Guide (Greg's Wiki)",u:"https://mywiki.wooledge.org/BashGuide"},{t:"Bash Pitfalls",u:"https://mywiki.wooledge.org/BashPitfalls"},{t:"Google Shell Style Guide",u:"https://google.github.io/styleguide/shellguide.html"}],
criteria:"اسکریپت‌هایی می‌نویسید که ShellCheck تمیز هستند، با نام فایل‌های عجیب نمی‌شکنند، در صورت خطا متوقف می‌شوند و بعد از خود تمیزکاری می‌کنند.",
interview:["set -euo pipefail چه می‌کند؟", "چرا باید متغیرها را در bash داخل کوتیشن گذاشت؟", "کِی یک اسکریپت bash را با پایتون بازنویسی می‌کنید؟"],
mistakes:["rm -rf با متغیر بدون کوتیشن و بدون بررسی خالی نبودن آن", "نبودن pipefail و نادیده گرفته شدن شکست در وسط pipeline", "ادامهٔ نوشتن bash برای منطقی که آشکارا به زبان برنامه‌نویسی واقعی نیاز دارد"],
production:"اسکریپت‌های دیپلوی، بکاپ و entrypoint کانتینرها معمولاً bash هستند؛ یک باگ quoting یا نبودن set -e در آن‌ها می‌تواند بکاپ خالی بسازد و هیچ‌کس متوجه نشود تا روز restore.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. اسکریپت‌نویسی bash امن و قابل‌اعتماد را به من آموزش بده (set -euo pipefail، quoting، trap، getopts، ShellCheck) و بعد یک اسکریپت پر از باگ‌های رایج به من بده تا پیدا و اصلاح کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},
