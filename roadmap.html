deep:"cProfile یک پروفایلر Deterministic است که هر فراخوانی تابع را ردیابی می‌کند و دقیق‌ترین آمار را می‌دهد اما Overhead قابل‌توجهی دارد و برای پروفایل کردن یک سرویس زندهٔ تولید مناسب نیست. py-spy یک پروفایلر Sampling (نمونه‌بردار) است که بدون نیاز به تغییر کد یا Restart، می‌تواند به یک پروسهٔ پایتون در حال اجرا در تولید متصل شود (py-spy dump/record) و با Overhead بسیار کم، تصویری از اینکه CPU چه زمانی کجا صرف می‌شود ارائه دهد؛ خروجی آن می‌تواند به‌صورت Flame Graph (نموداری که پهنای هر بلوک، سهم زمانی آن تابع را نشان می‌دهد) رندر شود که الگوهای گلوگاه را فوری بصری می‌کند. یک اصل کلیدی مهندسی عملکرد: هرگز حدس نزنید کجا کند است؛ همیشه اندازه‌گیری کنید (Premature Optimization بدون Profiling، اتلاف وقت مهندسی روی بخشی است که شاید اصلاً گلوگاه نبوده). برای کدهای I/O-bound (اکثر اپلیکیشن‌های Django)، پروفایلر CPU به‌تنهایی کافی نیست؛ باید زمان صرف‌شده در دیتابیس (با django-silk یا pg_stat_statements) هم جداگانه بررسی شود.",
objectives:["استفاده از py-spy برای پروفایل یک سرویس در حال اجرا بدون Downtime","خواندن Flame Graph برای یافتن گلوگاه"],
example:"py-spy record -o profile.svg --pid 12345 یک Flame Graph SVG از یک پروسهٔ Gunicorn در حال اجرا در تولید تولید می‌کند.",
py:"import cProfile\nimport pstats\n\ndef slow_function():\n    return sum(i*i for i in range(1_000_000))\n\nprofiler = cProfile.Profile()\nprofiler.enable()\nslow_function()\nprofiler.disable()\nstats = pstats.Stats(profiler).sort_stats('cumulative')\nstats.print_stats(10)",
exercise:"یک اسکریپت پایتون با یک تابع کند (حلقهٔ تودرتو ناکارآمد) بنویسید، آن را با cProfile پروفایل کنید، گلوگاه را پیدا و رفع کنید، و دوباره پروفایل بگیرید تا بهبود را عدد بزنید.",
project:"", resources:[{t:"Python docs - The Python Profilers",u:"https://docs.python.org/3/library/profile.html"},{t:"py-spy (GitHub)",u:"https://github.com/benfred/py-spy"},{t:"Brendan Gregg - Flame Graphs",u:"https://www.brendangregg.com/flamegraphs.html"}],
criteria:"می‌توانید یک سرویس پایتون کند را با py-spy یا cProfile پروفایل کنید، گلوگاه واقعی را (نه حدسی) پیدا و با عدد قبل/بعد بهبود را اثبات کنید.",
interview:["تفاوت پروفایلر Deterministic و Sampling چیست؟","چرا py-spy برای پروفایل کردن سرویس تولید مناسب‌تر از cProfile است؟"],
mistakes:["بهینه‌سازی کدی که Profiler هرگز نشان نداده گلوگاه است (حدس‌زنی به‌جای اندازه‌گیری)"],
production:"در اینسیدنت‌های 'API ناگهان کند شده'، py-spy dump یکی از سریع‌ترین ابزارها برای دیدن دقیقاً کجای کد در حال اجرا Worker گیر کرده است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. پروفایلینگ پایتون (cProfile برای توسعه، py-spy برای تولید) و خواندن Flame Graph را آموزش بده. یک تابع کند طراحی کن، از من بخواه قبل از دیدن جواب حدس بزنم گلوگاه کجاست، سپس با پروفایلر واقعی مقایسه کنیم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"perf-load-testing-n1",title:"تست بار (Load Testing) و شناسایی مشکل N+1",level:"Advanced",minLadder:3,prereqs:["perf-profiling"],
short:"چگونه با تست بار واقعی بفهمیم سیستم در چه نقطه‌ای می‌شکند، و چرا N+1 رایج‌ترین باگ پرفورمنسی مخفی است.",
deep:"تست بار (با ابزارهایی مثل Locust یا k6) شبیه‌سازی می‌کند صدها یا هزاران کاربر هم‌زمان چه شکلی از ترافیک تولید می‌کنند - نه فقط تعداد درخواست در ثانیه، بلکه الگوی واقعی رفتار کاربر (Ramp-up تدریجی، ترکیب Endpointهای مختلف). خروجی مهم‌تر از میانگین (Average) تأخیر، صدک‌های p50/p95/p99 است: میانگین می‌تواند طبیعی به‌نظر برسد در حالی که ۱٪ کاربران (p99) تأخیر فاجعه‌بار تجربه می‌کنند - و همین ۱٪ اغلب کاربرانی هستند که بیشترین داده یا فعالیت را دارند. هدف تست بار، یافتن 'نقطهٔ شکست' (Knee of the Curve) است: نقطه‌ای که با افزایش کمی بار، تأخیر به‌شدت غیرخطی بالا می‌رود (دقیقاً پدیده‌ای که در تئوری صف دیدیم). مشکل N+1 Query یکی از رایج‌ترین و مخفی‌ترین دلایل رسیدن زودهنگام به این نقطه است: یک کوئری برای گرفتن لیست، به‌علاوهٔ یک کوئری جداگانه به‌ازای هر آیتم برای گرفتن رابطه‌اش (مثلاً هر Orderهم یک کوئری برای Customerاش) - که در حجم کم نامحسوس است اما با رشد داده، خطی با تعداد رکورد رشد می‌کند. ابزارهایی مثل django-debug-toolbar (توسعه) و django-silk یا pg_stat_statements (تولید) تعداد کوئری واقعی هر درخواست را نشان می‌دهند؛ بهترین محافظت، نوشتن تستی است که صریحاً تعداد کوئری یک Endpoint را (با assertNumQueries) محدود می‌کند تا N+1 در آینده به‌طور خاموش برنگردد.",
objectives:["طراحی یک سناریوی تست بار واقع‌گرایانه با Locust/k6 و تفسیر p95/p99","نوشتن تستی که با assertNumQueries از بازگشت N+1 جلوگیری کند"],
example:"تست بار روی /api/orders/ نشان می‌دهد در ۵۰ کاربر هم‌زمان p99 تأخیر ۲۰۰ میلی‌ثانیه است، اما در ۲۰۰ کاربر هم‌زمان ناگهان به ۸ ثانیه می‌رسد - این 'نقطهٔ شکست' سیستم است.",
py:"from django.test.utils import CaptureQueriesContext\nfrom django.db import connection\n\ndef test_order_list_has_bounded_queries(client, django_assert_max_num_queries):\n    with django_assert_max_num_queries(3):\n        client.get('/api/orders/')  # اگر N+1 برگردد، این تست شکست می‌خورد",
exercise:"با locust یک سناریوی تست بار برای یک API لیست سفارش بنویسید که کاربران را از ۱۰ تا ۵۰۰ به‌صورت تدریجی افزایش دهد؛ نقطهٔ شکست (جایی که p99 به‌شدت بالا می‌رود) را پیدا کنید.",
project:"", resources:[{t:"Locust docs",u:"https://docs.locust.io/en/stable/"},{t:"k6 docs",u:"https://k6.io/docs/"},{t:"Django docs - assertNumQueries",u:"https://docs.djangoproject.com/en/stable/topics/testing/tools/#django.test.TransactionTestCase.assertNumQueries"}],
criteria:"می‌توانید با Locust/k6 یک تست بار طراحی کنید که نقطهٔ شکست سیستم را با اعداد p95/p99 مشخص کند، و تستی بنویسید که از بازگشت N+1 جلوگیری کند.",
interview:["چرا میانگین تأخیر برای قضاوت سلامت یک سرویس کافی نیست و باید p95/p99 را دید؟","مشکل N+1 چیست و چگونه در کد و در تست شناسایی می‌شود؟"],
mistakes:["اکتفا به تست بار با ترافیک ثابت و یکنواخت به‌جای الگوی واقعی ترافیک (Ramp-up، ترکیب Endpoint‌ها)","اضافه کردن select_related یک‌بار برای رفع N+1 بدون تستی که از بازگشت آن در آینده جلوگیری کند"],
production:"در بسیاری از اینسیدنت‌های 'کندی ناگهانی بعد از رشد کاربران'، ریشه یک N+1 Query است که در حجم کم داده هرگز خودش را نشان نداده بود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی تست بار با Locust/k6 و تفسیر p95/p99، و شناسایی/پیشگیری از N+1 Query را آموزش بده. یک API واقعی بده تا برایش سناریوی تست بار بنویسم و نقطهٔ شکستش را پیدا کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p32",num:32,title:"تست",icon:"✅",summary:"Unit/Integration/E2E، pytest، Mock و تست عمیق Django.",
topics:[
{id:"testing-django-pytest",title:"تست Django با pytest: Unit، Integration و Mock",level:"Intermediate",minLadder:2,prereqs:["django-orm-internals"],
short:"چگونه تست‌هایی بنویسیم که واقعاً باگ را پیش از تولید می‌گیرند، نه صرفاً درصد Coverage را بالا می‌برند.",
deep:"Unit Test یک واحد منطقی کوچک (یک تابع/متد) را ایزوله از وابستگی‌های خارجی (دیتابیس واقعی، API خارجی) تست می‌کند، معمولاً با Mock کردن وابستگی‌ها؛ سریع اجرا می‌شود و باید اکثریت تست‌ها را تشکیل دهد. Integration Test تعامل واقعی بین چند جزء (مثلاً View واقعی + دیتابیس تست واقعی) را بررسی می‌کند و باگ‌هایی که Unit Test به‌تنهایی نمی‌بیند (مثل خطای Migration یا مشکل واقعی کوئری) را می‌گیرد، اما کندتر است. pytest-django فیکسچرهای مفیدی مثل db (دسترسی به دیتابیس تست تراکنشی که بعد از هر تست Rollback می‌شود) و client (شبیه‌سازی درخواست HTTP) فراهم می‌کند. Mock باید با احتیاط استفاده شود: Mock بیش از حد (مثلاً Mock کردن خود منطقی که قرار است تست شود) باعث می‌شود تست همیشه سبز باشد بدون اینکه واقعاً چیزی را تضمین کند - این را Testing Implementation Details به‌جای Behavior می‌نامند. یک هرم تست سالم (Test Pyramid): پایه‌ای وسیع از Unit Testهای سریع، لایهٔ میانی کوچک‌تر از Integration Test، و لایهٔ بالای بسیار کوچک از E2E Test (که کند و شکننده‌اند).",
objectives:["نوشتن Unit Test با Mock برای یک سرویس با وابستگی خارجی","نوشتن Integration Test برای یک endpoint DRF با دیتابیس تست واقعی"],
example:"@pytest.mark.django_db\ndef test_order_creation(client):\n    response = client.post('/api/orders/', {'total': 100})\n    assert response.status_code == 201",
py:"import pytest\nfrom unittest.mock import patch\n\ndef test_send_notification_calls_external_api():\n    with patch('myapp.services.requests.post') as mock_post:\n        mock_post.return_value.status_code = 200\n        from myapp.services import send_notification\n        result = send_notification('user@example.com', 'سلام')\n        assert result is True\n        mock_post.assert_called_once()\n\n@pytest.mark.django_db\ndef test_order_total_calculation():\n    from myapp.models import Order, OrderItem\n    order = Order.objects.create()\n    OrderItem.objects.create(order=order, price=50, quantity=2)\n    assert order.total() == 100",
exercise:"برای یک سرویس OrderService که هم منطق محلی دارد و هم یک API خارجی (پرداخت) صدا می‌زند، یک Unit Test با Mock برای بخش API و یک Integration Test با دیتابیس تست واقعی برای منطق محاسبهٔ مجموع بنویسید.",
project:"مجموعه تست کامل (Unit + Integration) برای یک API سفارش با پوشش سناریوهای موفق، خطا، و لبه (Edge Case مثل سبد خالی).",
resources:[{t:"pytest-django docs",u:"https://pytest-django.readthedocs.io/en/latest/"},{t:"Django docs - Testing",u:"https://docs.djangoproject.com/en/stable/topics/testing/"},{t:"Real Python - Mocking",u:"https://realpython.com/python-mock-library/"}],
criteria:"می‌توانید برای یک سرویس با وابستگی خارجی، تست‌های Unit (با Mock) و Integration (با دیتابیس واقعی تست) بنویسید که هرم تست سالمی را رعایت کنند.",
interview:["تفاوت Unit Test و Integration Test چیست و چه نسبتی بین آن‌ها توصیه می‌شود؟","چه زمانی Mock کردن بیش از حد، تست را بی‌ارزش می‌کند؟"],
mistakes:["Mock کردن خود منطق کسب‌وکاری که قرار است تست شود، که باعث می‌شود تست همیشه سبز بماند بدون تضمین واقعی"],
production:"پوشش تست بالا (Coverage) بدون تست‌های معنادار می‌تواند احساس امنیت کاذب ایجاد کند؛ کیفیت تست مهم‌تر از درصد Coverage است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. نوشتن تست‌های Unit و Integration در Django با pytest را آموزش بده، تفاوت Mock درست و غلط را با مثال نشان بده، و یک سرویس با وابستگی خارجی (پرداخت) بده تا تست کامل آن را بنویسم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"testing-e2e-contract",title:"تست E2E، Contract Testing و Property-Based Testing",level:"Advanced",minLadder:3,prereqs:["testing-django-pytest"],
short:"سه سطح دیگر از تست که Unit/Integration پوشش نمی‌دهند: مسیر کامل کاربر، توافق بین سرویس‌ها، و ورودی‌های تصادفی.",
deep:"End-to-End (E2E) Test از دید کاربر واقعی و از طریق مرورگر یا کلاینت واقعی (با ابزارهایی مثل Playwright/Selenium) کل مسیر یک سناریو را تست می‌کند - ارزشمندترین نوع تست از نظر اطمینان (چون واقعاً شبیه استفادهٔ کاربر است) اما کندترین و شکننده‌ترین (تغییرات جزئی UI یا تأخیر شبکه می‌تواند تست را بدون تغییر واقعی در منطق، خراب کند)؛ به همین دلیل باید نوک باریک هرم تست باشد، نه پایهٔ آن. وقتی سیستم به چند سرویس مستقل تقسیم می‌شود (میکروسرویس)، تست Integration سنتی که همه‌چیز را در یک محیط اجرا کند سخت و کند می‌شود؛ Contract Testing (مثل Pact) این مشکل را حل می‌کند: مصرف‌کننده (Consumer) یک 'قرارداد' تعریف می‌کند (چه شکلی از درخواست/پاسخ انتظار دارد)، و تأمین‌کننده (Provider) به‌طور مستقل در برابر همان قرارداد تست می‌شود - بدون نیاز به اجرای هم‌زمان هر دو سرویس، تغییرات Breaking قبل از استقرار کشف می‌شوند. Property-Based Testing (با کتابخانه‌ای مثل Hypothesis) به‌جای نوشتن چند مثال دستی، یک ویژگی/ناوردا (Invariant) کلی را تعریف می‌کند (مثلاً 'مرتب‌سازی یک لیست، طول آن را تغییر نمی‌دهد') و کتابخانه صدها ورودی تصادفی (شامل Edge Caseهای عجیب که انسان معمولاً فراموش می‌کند) تولید می‌کند تا آن ویژگی را نقض کند - این روش باگ‌های لبه‌ای را پیدا می‌کند که تست‌های مثال‌محور معمولاً از قلم می‌اندازند.",
objectives:["تشخیص اینکه یک سناریو باید E2E باشد یا با تست ارزان‌تر (Unit/Integration) پوشش داده شود","نوشتن یک تست Property-Based ساده با Hypothesis برای یک تابع خالص"],
example:"یک تست Hypothesis برای تابع sorted: @given(st.lists(st.integers())) def test_sorted_preserves_length(lst): assert len(sorted(lst)) == len(lst)",
py:"from hypothesis import given, strategies as st\n\ndef normalize_price(price_cents: int) -> int:\n    return max(price_cents, 0)\n\n@given(st.integers())\ndef test_normalize_price_never_negative(price):\n    assert normalize_price(price) >= 0  # برای هزاران ورودی تصادفی امتحان می‌شود",
exercise:"برای یک تابع محاسبهٔ تخفیف سفارش، یک ناوردا تعریف کنید (مثلاً 'قیمت نهایی هرگز منفی نیست') و با Hypothesis آن را در برابر ورودی‌های تصادفی امتحان کنید.",
project:"", resources:[{t:"Hypothesis docs",u:"https://hypothesis.readthedocs.io/en/latest/"},{t:"Pact docs - Contract Testing",u:"https://docs.pact.io/"},{t:"Playwright docs",u:"https://playwright.dev/python/"}],
criteria:"می‌توانید توضیح دهید چه زمانی E2E لازم است، Contract Testing چه مشکلی در میکروسرویس‌ها حل می‌کند، و یک تست Property-Based ساده بنویسید.",
interview:["چرا E2E Test باید کم‌تعداد باشد اما Unit Test زیاد؟","Contract Testing چگونه نیاز به اجرای هم‌زمان همهٔ سرویس‌ها برای تست را حذف می‌کند؟"],
mistakes:["نوشتن اکثر تست‌ها به‌صورت E2E که باعث Suite کند و شکننده می‌شود (هرم تست وارونه)"],
production:"در معماری میکروسرویس، نبود Contract Testing باعث می‌شود تغییرات Breaking یک سرویس فقط در تولید، وقتی سرویس مصرف‌کننده خراب می‌شود، کشف شوند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تفاوت E2E، Contract Testing و Property-Based Testing را با مثال عملی (از جمله یک تست Hypothesis واقعی) آموزش بده. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p33",num:33,title:"امنیت",icon:"🛡️",summary:"OWASP Top 10، احراز هویت/اختیار، رمزنگاری و مدل‌سازی تهدید.",
topics:[
{id:"security-owasp-top",title:"OWASP Top 10: SQL Injection، XSS، CSRF، SSRF، IDOR",level:"Advanced",minLadder:3,prereqs:["drf-auth-throttling"],
short:"رایج‌ترین آسیب‌پذیری‌های وب و چگونگی پیشگیری از آن‌ها در Django.",
deep:"SQL Injection وقتی رخ می‌دهد که ورودی کاربر مستقیم در یک کوئری SQL Concatenate شود (Django ORM با Parameterized Query به‌طور پیش‌فرض از این جلوگیری می‌کند، اما raw() یا extra() بدون احتیاط می‌تواند این محافظت را دور بزند). XSS (Cross-Site Scripting) وقتی رخ می‌دهد که ورودی کاربر بدون Escape در HTML رندر شود و مرورگر آن را به‌عنوان کد اجرا کند؛ سیستم قالب Django به‌طور پیش‌فرض HTML را Auto-escape می‌کند اما استفاده از |safe یا mark_safe روی داده‌ی غیرقابل‌اعتماد این محافظت را از بین می‌برد. CSRF (Cross-Site Request Forgery) وقتی یک سایت مخرب کاربر را وادار می‌کند بدون اطلاع، درخواستی به سایت شما (که در آن Session دارد) بفرستد؛ Django با CSRF Token در فرم‌ها و بررسی هدر Origin/Referer از آن جلوگیری می‌کند. SSRF (Server-Side Request Forgery) وقتی سرور شما بر اساس ورودی کاربر به یک URL دلخواه درخواست می‌فرستد (مثلاً 'پیش‌نمایش لینک')، و مهاجم می‌تواند سرور را وادار کند به منابع داخلی (مثل متادیتای Cloud در 169.254.169.254) دسترسی پیدا کند. IDOR (Insecure Direct Object Reference) وقتی یک API بر اساس شناسهٔ URL (مثل /orders/42/) بدون بررسی مالکیت واقعی، اجازهٔ دسترسی به منابع کاربران دیگر را می‌دهد - رایج‌ترین آسیب‌پذیری واقعی در APIهای DRF بدون Permission Class دقیق.",
objectives:["شناسایی و رفع IDOR در یک endpoint DRF","توضیح چرا mark_safe روی ورودی کاربر خطرناک است"],
example:"# آسیب‌پذیر به IDOR: هر کاربر احرازشده می‌تواند سفارش هر کاربر دیگری را ببیند\nclass OrderDetailView(APIView):\n    def get(self, request, order_id):\n        order = Order.objects.get(id=order_id)  # بدون بررسی مالکیت!\n        return Response(OrderSerializer(order).data)",
py:"class OrderDetailView(APIView):\n    permission_classes = [IsAuthenticated]\n    def get(self, request, order_id):\n        order = get_object_or_404(Order, id=order_id, customer=request.user)  # اکنون فقط سفارش خود کاربر قابل مشاهده است\n        return Response(OrderSerializer(order).data)",
exercise:"کد آسیب‌پذیر به IDOR بالا را با فیلتر کردن بر اساس request.user رفع کنید، سپس یک سناریوی مشابه برای XSS (رندر نظر کاربر بدون Escape) پیدا و رفع کنید.",
project:"چک‌لیست امنیتی کامل برای یک API موجود Django: بررسی IDOR در تمام Endpointها، بررسی استفادهٔ نادرست از mark_safe/raw()، بررسی تنظیمات CSRF/CORS.",
resources:[{t:"OWASP Top 10",u:"https://owasp.org/www-project-top-ten/"},{t:"Django docs - Security",u:"https://docs.djangoproject.com/en/stable/topics/security/"}],
criteria:"می‌توانید در یک API موجود Django، حداقل سه آسیب‌پذیری از نوع IDOR/XSS/CSRF/SSRF را شناسایی و رفع کنید.",
interview:["IDOR چیست و چرا در APIهای REST بسیار رایج است؟","Django چگونه به‌طور پیش‌فرض از CSRF و XSS جلوگیری می‌کند؟","SSRF چگونه می‌تواند به منابع داخلی Cloud دسترسی پیدا کند؟"],
mistakes:["اعتماد به اینکه فقط داشتن IsAuthenticated کافی است، بدون بررسی مالکیت واقعی منبع (که خودِ IDOR است)"],
production:"IDOR مکرراً در گزارش‌های Bug Bounty شرکت‌های بزرگ به‌عنوان رایج‌ترین آسیب‌پذیری واقعی گزارش می‌شود چون از دید تست‌های خودکار معمولی پنهان می‌ماند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. OWASP Top 10 با تمرکز ویژه بر IDOR، XSS و CSRF در Django/DRF را توضیح بده. چند Endpoint آسیب‌پذیر واقعی طراحی کن که من آسیب‌پذیری را پیدا و با کد درست رفع کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"security-crypto-threat-modeling",title:"مبانی رمزنگاری، مدیریت اسرار و مدل‌سازی تهدید (STRIDE)",level:"Advanced",minLadder:4,prereqs:["security-owasp-top"],
short:"فراتر از آسیب‌پذیری‌های تزریق: چگونه داده را واقعاً محافظت کنیم و از قبل به سیستم مثل مهاجم نگاه کنیم.",
deep:"هش کردن (Hashing) برای رمز عبور باید با الگوریتم‌های کند و طراحی‌شده برای این کار مثل bcrypt یا argon2 انجام شود، نه یک هش عمومی سریع مثل SHA-256 (که دقیقاً همان سرعتش آن را برای Brute-force کردن رمز عبور خطرناک می‌کند)؛ رمزنگاری (Encryption) برخلاف هش، برگشت‌پذیر است و برای دادهٔ نیازمند بازیابی (نه اثبات تطابق) استفاده می‌شود. رمزنگاری متقارن (یک کلید مشترک، سریع، برای حجم داده) در برابر نامتقارن (جفت کلید عمومی/خصوصی، کندتر، برای تبادل کلید یا امضای دیجیتال - پایهٔ TLS) تفاوت اساسی دارند. Encryption at Rest (داده روی دیسک/دیتابیس رمزنگاری‌شده) و Encryption in Transit (TLS بین سرویس‌ها) دو لایهٔ مستقل محافظت‌اند که هردو لازم‌اند. مدیریت کلید (KMS/Vault) این اصل را اجرا می‌کند که کلید رمزنگاری هرگز نباید در کنار دادهٔ رمزنگاری‌شده یا در کد ذخیره شود. مدل‌سازی تهدید STRIDE (Spoofing جعل هویت، Tampering دستکاری داده، Repudiation انکار عمل، Information Disclosure افشای اطلاعات، Denial of Service از کار انداختن، Elevation of Privilege ارتقاء غیرمجاز دسترسی) یک چارچوب ساختاریافته است برای اینکه قبل از ساخت یک سیستم (نه بعد از حمله)، از خودتان بپرسید 'یک مهاجم اینجا چه کاری می‌تواند بکند؟'. امنیت زنجیرهٔ تأمین (Supply Chain) یادآوری می‌کند که pip install یک پکیج ناشناس یا Pin-نشده، عملاً اجرای کد شخص ثالث در سرور شماست؛ اسکن Dependency و مفهوم SBOM (فهرست کامل اجزای نرم‌افزاری) این ریسک را قابل مدیریت می‌کنند.",
objectives:["توضیح چرا bcrypt/argon2 برای رمز عبور مناسب‌اند اما SHA-256 نیست","اجرای یک جلسهٔ کوتاه STRIDE روی یک ویژگی جدید قبل از پیاده‌سازی"],
example:"برای یک ویژگی 'آپلود آواتار کاربر'، تحلیل STRIDE نشان می‌دهد یک مهاجم می‌تواند فایل مخرب به‌جای عکس آپلود کند (Tampering) یا فایل بسیار بزرگ برای مصرف منابع بفرستد (DoS).",
py:"import bcrypt\n\npassword = b'user_password_123'\nhashed = bcrypt.hashpw(password, bcrypt.gensalt())  # کند و عمداً پرهزینه، برخلاف hashlib.sha256\nassert bcrypt.checkpw(password, hashed)",
exercise:"برای یک ویژگی جدید (مثلاً 'اشتراک‌گذاری لینک عمومی یک فایل') یک تحلیل STRIDE کامل بنویسید: هرکدام از شش دسته چه ریسکی برای این ویژگی خاص دارد؟",
project:"", resources:[{t:"OWASP - Threat Modeling",u:"https://owasp.org/www-community/Threat_Modeling"},{t:"OWASP Cheat Sheet - Password Storage",u:"https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"},{t:"NIST - Key Management",u:"https://csrc.nist.gov/projects/key-management"}],
criteria:"می‌توانید توضیح دهید چرا رمز عبور نباید با هش سریع ذخیره شود، و برای یک ویژگی واقعی یک تحلیل STRIDE کامل انجام دهید.",
interview:["چرا هش کردن رمز عبور با SHA-256 ساده کافی نیست؟","STRIDE چیست و چگونه در فاز طراحی (نه بعد از حمله) استفاده می‌شود؟"],
mistakes:["ذخیرهٔ کلید رمزنگاری در همان دیتابیس یا کد کنار دادهٔ رمزنگاری‌شده","اعتماد کورکورانه به یک Dependency جدید بدون بررسی منبع یا Pin کردن نسخه"],
production:"بسیاری از نشت‌های بزرگ داده در صنعت، نه به‌خاطر شکستن رمزنگاری، بلکه به‌خاطر مدیریت ضعیف کلید یا یک Dependency آلوده در زنجیرهٔ تأمین بوده‌اند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مبانی رمزنگاری کاربردی برای بک‌اند (هش رمز عبور، رمزنگاری در حال انتقال/سکون)، مدیریت کلید، و مدل‌سازی تهدید STRIDE را آموزش بده. یک ویژگی واقعی بده تا با STRIDE آن را تحلیل کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p34",num:34,title:"Docker",icon:"🐳",summary:"Container، Image، Dockerfile چندمرحله‌ای، شبکه و امنیت.",
topics:[
{id:"docker-images-layers",title:"Image، Layer و Dockerfile چندمرحله‌ای (Multi-stage)",level:"Intermediate",minLadder:2,prereqs:["virtual-memory","linux-filesystem"],
short:"Container چیزی جز یک پروسهٔ لینوکسی ایزوله‌شده با namespaces و cgroups نیست.",
deep:"Container برخلاف Virtual Machine، هستهٔ لینوکس میزبان را با کل سیستم‌عامل‌های دیگر به اشتراک می‌گذارد؛ ایزولاسیون با namespaces (هرکدام یک بعد را ایزوله می‌کنند: PID namespace پروسه‌ها، Network namespace اینترفیس‌های شبکه، Mount namespace فایل‌سیستم) و محدودیت منابع با cgroups (که پیش‌تر در بحث حافظهٔ مجازی دیدیم) پیاده می‌شود - به همین دلیل Containerها بسیار سبک‌تر و سریع‌تر از VM راه‌اندازی می‌شوند. یک Docker Image از Layerهای فقط-خواندنی تشکیل شده که هرکدام یک دستور در Dockerfile (مثل RUN یا COPY) است؛ Docker این Layerها را کش می‌کند، پس اگر فقط کد تغییر کرده باشد (نه dependencies)، فقط Layerهای بعد از آن تغییر دوباره Build می‌شوند - به همین دلیل ترتیب دستورات در Dockerfile (کپی requirements.txt و نصب dependencies قبل از کپی کد اصلی) مستقیماً بر سرعت Build تأثیر دارد. Multi-stage Build اجازه می‌دهد یک مرحله برای Build (با ابزارهای سنگین کامپایل) و یک مرحلهٔ نهایی سبک‌تر فقط با artifact نهایی استفاده شود، که اندازهٔ Image نهایی تولید را به‌شدت کاهش می‌دهد - مهم برای امنیت (سطح حملهٔ کمتر) و سرعت Deploy.",
objectives:["نوشتن Dockerfile با ترتیب صحیح Layer برای بهره‌گیری از کش","نوشتن Multi-stage Build برای کاهش اندازهٔ Image نهایی"],
example:"COPY requirements.txt . \\nRUN pip install -r requirements.txt \\nCOPY . . — این ترتیب یعنی تغییر کد باعث Rebuild دوبارهٔ نصب dependencies نمی‌شود.",
py:"", exercise:"یک Dockerfile برای یک اپلیکیشن Django بنویسید که مرحلهٔ اول dependencies را نصب کند (با کش Layer) و در Dockerfile یک نسخهٔ Multi-stage بسازید که فقط فایل‌های لازم را در Image نهایی کپی کند.",
project:"Dockerize کردن کامل یک پروژهٔ Django+Gunicorn+Nginx با docker-compose، شامل تنظیم Health Check و Resource Limit.",
resources:[{t:"Docker docs - Dockerfile best practices",u:"https://docs.docker.com/build/building/best-practices/"},{t:"Docker docs - Multi-stage builds",u:"https://docs.docker.com/build/building/multi-stage/"}],
criteria:"می‌توانید یک Dockerfile بهینه (کش Layer صحیح + Multi-stage) برای یک اپلیکیشن Django بنویسید که اندازهٔ Image نهایی حداقلی باشد.",
interview:["تفاوت Container و Virtual Machine در سطح فنی چیست؟","چرا ترتیب دستورات در Dockerfile روی سرعت Build تأثیر دارد؟"],
mistakes:["کپی کل کد پروژه قبل از نصب dependencies که باعث می‌شود هر تغییر کوچک کد، کل نصب dependencies را دوباره اجرا کند"],
production:"Imageهای غول‌پیکر (چند گیگابایتی) به‌دلیل عدم استفاده از Multi-stage Build، هم Deploy را کند می‌کنند و هم سطح حملهٔ امنیتی را افزایش می‌دهند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری Docker (namespaces، cgroups، Layer، کش Build) را توضیح بده و کمکم کن یک Dockerfile بهینه با Multi-stage Build برای یک پروژهٔ Django بنویسم که اندازهٔ Image را به حداقل برساند. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"docker-networking-volumes-security",title:"شبکهٔ Docker، Volume و اسکن امنیتی Image",level:"Intermediate",minLadder:2,prereqs:["docker-images-layers"],
short:"Container بدون شبکهٔ درست و ذخیرهٔ پایدار داده، برای اپلیکیشن واقعی کافی نیست.",
deep:"Docker چند حالت شبکه دارد: Bridge (پیش‌فرض، یک شبکهٔ داخلی ایزوله روی یک هاست که Containerها را به هم و به بیرون از طریق NAT وصل می‌کند)، Host (Container مستقیماً از Network Namespace خود هاست استفاده می‌کند - سریع‌تر اما بدون ایزولاسیون شبکه‌ای)، و Overlay (شبکه‌ای که چند هاست مختلف را به هم وصل می‌کند - پایهٔ ارتباط بین Containerها در Docker Swarm یا مفهومی مشابه در Kubernetes). داده‌ای که داخل یک Container نوشته شود با حذف Container از بین می‌رود؛ Volume راه‌حل استاندارد Docker برای داده‌ی پایدار است (مدیریت‌شده توسط خود Docker، قابل Backup و انتقال بین هاست‌ها)، در مقابل Bind Mount که مستقیماً یک مسیر از فایل‌سیستم هاست را داخل Container نمایان می‌کند - مفید برای توسعه (کد را زنده Mount کردن) اما وابسته به ساختار دقیق فایل‌سیستم هاست و کمتر قابل‌انتقال. docker-compose این تکه‌ها (چند Service، شبکه‌های مشترک بین آن‌ها، Volumeها) را در یک فایل واحد YAML تعریف می‌کند تا کل محیط توسعه (مثلاً Django + PostgreSQL + Redis) با یک دستور بالا بیاید. اسکن آسیب‌پذیری Image (با ابزارهایی مثل Trivy یا Docker Scout) یک لایهٔ امنیتی جدا از کد اپلیکیشن است: یک Base Image قدیمی می‌تواند ده‌ها آسیب‌پذیری شناخته‌شده در کتابخانه‌های سیستمی داشته باشد که هیچ ربطی به کد شما ندارد - اسکن در CI قبل از Push به Registry، این ریسک را قبل از رسیدن به تولید نشان می‌دهد.",
objectives:["توضیح تفاوت Volume و Bind Mount و اینکه کدام برای دادهٔ تولید مناسب است","نوشتن یک docker-compose.yml برای Django+PostgreSQL+Redis با شبکه و Volume صحیح"],
example:"docker-compose.yml با سه Service (web، db، redis) که db از یک named volume برای پایداری داده استفاده می‌کند و web با یک bind mount کد را برای توسعهٔ زنده Mount می‌کند.",
py:"", exercise:"یک docker-compose.yml برای یک پروژهٔ Django با PostgreSQL و Redis بنویسید؛ با trivy image خروجی Build شده را اسکن کنید و حداقل یک آسیب‌پذیری گزارش‌شده را بررسی کنید.",
project:"", resources:[{t:"Docker docs - Networking overview",u:"https://docs.docker.com/network/"},{t:"Docker docs - Volumes",u:"https://docs.docker.com/storage/volumes/"},{t:"Trivy (GitHub)",u:"https://github.com/aquasecurity/trivy"}],
criteria:"می‌توانید یک محیط چند-Containeری کامل با docker-compose (شبکه و Volume صحیح) بسازید و Image نهایی را با یک ابزار اسکن آسیب‌پذیری بررسی کنید.",
interview:["چرا داده‌ی پایدار دیتابیس در Container باید در Volume باشد نه در فایل‌سیستم داخلی Container؟","تفاوت شبکهٔ Bridge و Host در Docker چیست؟"],
mistakes:["ذخیرهٔ دادهٔ دیتابیس تولید فقط داخل فایل‌سیستم Container بدون Volume، که با حذف/جایگزینی Container کل داده از بین می‌رود"],
production:"فراموش کردن اسکن Image پایه در CI باعث می‌شود آسیب‌پذیری‌های شناخته‌شدهٔ سیستمی (نه حتی کد خودتان) بدون اطلاع وارد تولید شوند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. شبکهٔ Docker (Bridge/Host/Overlay)، تفاوت Volume و Bind Mount، docker-compose و اسکن امنیتی Image را آموزش بده و کمکم کن یک docker-compose.yml کامل برای Django+PostgreSQL+Redis بسازم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p35",num:35,title:"Kubernetes",icon:"☸️",summary:"Pod، Deployment، Service، HPA، StatefulSet و مدیریت خوشه در مقیاس.",
topics:[
{id:"k8s-core-objects",title:"Pod، Deployment، Service و چرخهٔ حیات در Kubernetes",level:"Advanced",minLadder:4,prereqs:["docker-images-layers","logical-clocks-consensus"],
short:"واحدهای بنیادین Kubernetes و چگونگی مدیریت خودکار در دسترس بودن و مقیاس‌پذیری.",
deep:"Pod کوچک‌ترین واحد قابل استقرار در Kubernetes است که یک یا چند Container را با شبکه و Storage مشترک نگه می‌دارد؛ Podها به‌طور طبیعی فناپذیرند (Ephemeral) - هرگز نباید مستقیماً به یک Pod خاص وابسته شد. Deployment یک لایهٔ مدیریتی بالاتر است که تعداد مشخصی Replica از یک Pod را نگه می‌دارد و به‌طور خودکار Podهای از کار افتاده را جایگزین می‌کند (Self-healing)؛ همچنین Rolling Update (به‌روزرسانی تدریجی بدون Downtime، جایگزینی تدریجی نسخهٔ قدیم با جدید) را مدیریت می‌کند. Service یک آدرس شبکهٔ پایدار (و DNS Name) برای مجموعه‌ای از Podهای در حال تغییر فراهم می‌کند - چون IP هر Pod با هر ری‌استارت عوض می‌شود، Service با Label Selector، ترافیک را به Podهای سالم Load Balance می‌کند. Liveness Probe به Kubernetes می‌گوید آیا Container هنوز 'زنده' است (اگر نه، Restart می‌شود)؛ Readiness Probe می‌گوید آیا Container آمادهٔ دریافت ترافیک است (اگر نه، از Service حذف می‌شود بدون Restart) - تفاوت این دو Probe یک اشتباه رایج مبتدیان است که می‌تواند منجر به قطع سرویس یا Restart بی‌مورد شود. Resource Requests/Limits تعیین می‌کنند چقدر CPU/Memory یک Container نیاز دارد (برای زمان‌بندی) و حداکثر مجاز آن (که عبور از حد Memory منجر به OOM Kill می‌شود، دقیقاً مطابق مفهومی که در بحث حافظهٔ مجازی دیدیم).",
objectives:["توضیح تفاوت Liveness و Readiness Probe","توضیح چرا Deployment به‌جای مدیریت مستقیم Pod استفاده می‌شود"],
example:"apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: django-app}\nspec:\n  replicas: 3\n  template:\n    spec:\n      containers:\n      - name: web\n        image: myapp:1.2\n        readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}\n        resources: {requests: {memory: '256Mi'}, limits: {memory: '512Mi'}}",
py:"", exercise:"یک Deployment با ۳ Replica، Liveness/Readiness Probe و Resource Limits برای یک اپلیکیشن Django بنویسید؛ سپس عمداً یک Pod را با kubectl delete pod حذف کنید و مشاهده کنید Deployment آن را جایگزین می‌کند.",
project:"استقرار کامل یک اپلیکیشن Django روی یک خوشهٔ Kubernetes محلی (minikube/kind) با Deployment، Service، ConfigMap و Secret.",
resources:[{t:"Kubernetes docs - Pods",u:"https://kubernetes.io/docs/concepts/workloads/pods/"},{t:"Kubernetes docs - Deployments",u:"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"},{t:"Kubernetes docs - Probes",u:"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"}],
criteria:"می‌توانید یک Deployment کامل با Probe و Resource Limit صحیح برای یک اپلیکیشن Django بنویسید و رفتار Self-healing را نشان دهید.",
interview:["تفاوت Liveness و Readiness Probe چیست و اشتباه رایج در تنظیم آن‌ها چیست؟","چرا نباید مستقیماً به Pod تکی وابسته شد؟"],
mistakes:["تنظیم Liveness Probe سخت‌گیرانه که باعث Restart مکرر یک Pod سالم اما کمی کند می‌شود (Restart Loop)"],
production:"'Pod مدام Restart می‌شود (CrashLoopBackOff)' یکی از رایج‌ترین اینسیدنت‌های Kubernetes است که ریشه‌اش اغلب Liveness Probe نامناسب یا OOM Kill است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. اجزای بنیادین Kubernetes (Pod، Deployment، Service، Probe، Resource Limit) را توضیح بده و کمکم کن یک Deployment کامل برای یک اپلیکیشن Django بنویسم؛ سپس سناریوی CrashLoopBackOff طراحی کن تا با kubectl describe/logs دیباگش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"k8s-statefulset-hpa-config",title:"StatefulSet، HPA، ConfigMap/Secret و Ingress",level:"Advanced",minLadder:4,prereqs:["k8s-core-objects"],
short:"وقتی یک Pod بی‌نام و بی‌حالت کافی نیست: هویت پایدار، مقیاس خودکار و ورودی ترافیک در Kubernetes.",
deep:"StatefulSet برخلاف Deployment، به هر Replica هویت شبکهٔ پایدار (نام قابل‌پیش‌بینی مثل db-0، db-1) و Storage اختصاصی پایدار (که با حذف/جایگزینی Pod از بین نمی‌رود) می‌دهد - دقیقاً چیزی که یک دیتابیس یا هر Workload Stateful (که نیاز به تشخیص 'کدام Replica کدام است' دارد) لازم دارد، در حالی که یک Pod وب بی‌حالت اصلاً به این هویت نیاز ندارد. Horizontal Pod Autoscaler (HPA) به‌طور خودکار تعداد Replica یک Deployment را بر اساس متریک (پیش‌فرض CPU/Memory، یا متریک سفارشی مثل طول صف) بالا و پایین می‌برد؛ HPA فقط زمانی درست کار می‌کند که Resource Requests به‌درستی تنظیم شده باشند، چون درصد مصرف نسبت به Request محاسبه می‌شود - HPA بدون Request صحیح، یا اصلاً کار نمی‌کند یا تصمیم غلط می‌گیرد. ConfigMap تنظیمات غیرحساس (مثل سطح Log یا آدرس یک سرویس) و Secret مقادیر حساس (رمز عبور، کلید API) را از Image جدا نگه می‌دارند تا بدون Rebuild کردن Image بتوان پیکربندی را عوض کرد - نکتهٔ حیاتی: Secret پیش‌فرض فقط Base64-encoded است نه Encrypted، یعنی هرکسی با دسترسی به آن می‌تواند مقدار را بخواند، پس باید با RBAC محدود شود یا با ابزار خارجی (مثل Vault) رمزنگاری واقعی اضافه شود. Ingress یک نقطهٔ ورود HTTP(S) واحد به خوشه فراهم می‌کند که بر اساس Host/Path به Serviceهای مختلف مسیریابی می‌کند و می‌تواند TLS را Terminate کند - جایگزین ساخت یک Load Balancer جدا برای هر Service. Namespace فضای نام منطقی برای جداسازی منابع (مثلاً بین تیم‌ها یا محیط‌ها) در یک خوشهٔ مشترک است، و RBAC (Role-Based Access Control) تعیین می‌کند چه Userی/ServiceAccountای در کدام Namespace چه عملیاتی مجاز است - اصل Least Privilege دقیقاً همان‌طور که در IAM کلود دیدیم.",
objectives:["توضیح چرا یک دیتابیس در Kubernetes باید StatefulSet باشد نه Deployment","پیکربندی HPA با Resource Requests صحیح برای مقیاس‌پذیری خودکار"],
example:"apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nspec:\n  scaleTargetRef: {kind: Deployment, name: django-app}\n  minReplicas: 2\n  maxReplicas: 10\n  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]",
py:"", exercise:"یک ConfigMap برای تنظیمات غیرحساس و یک Secret برای رمز عبور دیتابیس یک اپلیکیشن Django بسازید؛ یک Ingress بنویسید که مسیر /api را به Service اپلیکیشن هدایت کند؛ سپس یک HPA با محدودهٔ ۲ تا ۸ Replica بر اساس CPU تنظیم کنید.",
project:"", resources:[{t:"Kubernetes docs - StatefulSets",u:"https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"},{t:"Kubernetes docs - HorizontalPodAutoscaler",u:"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"},{t:"Kubernetes docs - Ingress",u:"https://kubernetes.io/docs/concepts/services-networking/ingress/"}],
criteria:"می‌توانید توضیح دهید چه زمانی StatefulSet لازم است، HPA را با Resource Request درست تنظیم کنید، و یک Ingress با مسیریابی چندگانه بنویسید.",
interview:["چرا Secret پیش‌فرض Kubernetes به‌تنهایی کافی برای امنیت داده حساس نیست؟","HPA بدون Resource Requests صحیح چه مشکلی پیدا می‌کند؟"],
mistakes:["استفاده از Deployment معمولی برای یک دیتابیس که نیاز به Storage و هویت پایدار هر Replica دارد","فرض کردن اینکه Secret به‌معنای Encrypted است، در حالی که فقط Base64-encoded است"],
production:"بسیاری از تیم‌ها با Deployment ساده یک دیتابیس را در Kubernetes اجرا می‌کنند و بعد از یک Restart، داده یا هویت Replica را از دست می‌دهند - دقیقاً مشکلی که StatefulSet حل می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. StatefulSet، HPA، ConfigMap/Secret و Ingress در Kubernetes را با تمرکز بر تفاوتشان با اجزای پایه‌ای که قبلاً یاد گرفته‌ام (Pod/Deployment/Service) آموزش بده و کمکم کن یک مانیفست کامل برای یک اپلیکیشن Django با این اجزا بسازم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p36",num:36,title:"کلاود",icon:"☁️",summary:"مفاهیم AWS (IAM، VPC، EC2، S3، RDS) قابل انتقال به سایر کلودها.",
topics:[
{id:"cloud-vpc-iam",title:"VPC، Subnet، Security Group و IAM",level:"Intermediate",minLadder:2,prereqs:["net-tcp-handshake","k8s-core-objects"],
short:"مفاهیم پایه‌ای شبکه و کنترل دسترسی در کلود که مستقل از ارائه‌دهنده قابل انتقال‌اند.",
deep:"VPC (Virtual Private Cloud) یک شبکهٔ ایزولهٔ منطقی درون کلود است که کنترل کامل بر آدرس‌دهی IP، Subnetها و مسیریابی را به شما می‌دهد. Subnet عمومی (با مسیر به Internet Gateway) برای منابعی که باید مستقیم از اینترنت در دسترس باشند (مثل Load Balancer) و Subnet خصوصی (بدون مسیر مستقیم به اینترنت، فقط از طریق NAT Gateway برای خروجی) برای منابع حساس (دیتابیس، اپلیکیشن بک‌اند) استفاده می‌شود - این جداسازی یک اصل امنیتی بنیادین Defense in Depth است. Security Group یک فایروال Stateful در سطح Instance است (اگر ترافیک ورودی مجاز باشد، پاسخ آن خودکار مجاز است)؛ Network ACL فایروال Stateless در سطح Subnet است. IAM (Identity and Access Management) کنترل می‌کند چه کسی (User، Role، Service) به چه منابعی چه دسترسی‌ای دارد، با اصل Least Privilege (حداقل دسترسی لازم، نه بیشتر) - یک اشتباه بسیار رایج و پرهزینه، دادن دسترسی AdministratorAccess به همه به‌جای تعریف دقیق Policy است. IAM Role (برخلاف User) برای اعطای دسترسی موقت به سرویس‌ها (مثل یک EC2 Instance که نیاز به خواندن از S3 دارد) بدون نیاز به ذخیرهٔ کلید دسترسی ثابت در کد استفاده می‌شود - این مفاهیم مستقیماً معادل خودشان در GCP (VPC, IAM) و Azure (VNet, IAM) هم وجود دارند.",
objectives:["طراحی یک VPC با Subnet عمومی/خصوصی برای یک اپلیکیشن سه‌لایه","توضیح چرا IAM Role بهتر از کلید دسترسی ثابت در کد است"],
example:"یک اپلیکیشن Django روی EC2 در Subnet خصوصی، پشت یک Application Load Balancer در Subnet عمومی، با دسترسی به RDS (دیتابیس) در همان Subnet خصوصی.",
py:"", exercise:"معماری شبکهٔ یک اپلیکیشن سه‌لایه (Load Balancer عمومی، اپلیکیشن خصوصی، دیتابیس خصوصی) را روی کاغذ طراحی کنید و Security Groupهای لازم برای هر لایه را مشخص کنید.",
project:"", resources:[{t:"AWS docs - VPC",u:"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{t:"AWS docs - IAM best practices",u:"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"}],
criteria:"می‌توانید یک معماری شبکهٔ سه‌لایه با Subnetهای صحیح و Security Groupهای حداقلی طراحی کنید.",
interview:["تفاوت Security Group و Network ACL چیست؟","چرا دیتابیس معمولاً در Subnet خصوصی قرار می‌گیرد نه عمومی؟"],
mistakes:["قرار دادن دیتابیس در Subnet عمومی با دسترسی مستقیم اینترنت که سطح حمله را به‌شدت افزایش می‌دهد"],
production:"نشت دادهٔ ناشی از دیتابیس‌های در معرض عموم بدون Security Group مناسب، یکی از رایج‌ترین حوادث امنیتی گزارش‌شده در کلود است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم VPC، Subnet عمومی/خصوصی، Security Group و IAM را توضیح بده. یک اپلیکیشن سه‌لایهٔ Django بده تا معماری شبکهٔ ایمن آن را طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"cloud-compute-storage-managed-db",title:"محاسبات، ذخیره‌سازی شیء و دیتابیس مدیریت‌شده در کلود",level:"Intermediate",minLadder:2,prereqs:["cloud-vpc-iam"],
short:"سه سرویس پایه‌ای هر کلود (سرور مجازی، فضای ذخیره‌سازی، دیتابیس مدیریت‌شده) و مصالحه‌های واقعی هرکدام.",
deep:"یک سرور مجازی محاسباتی (مثل EC2) طیفی از انواع Instance (بهینه برای CPU، Memory، یا I/O) و مدل‌های قیمت‌گذاری متفاوت دارد: On-Demand (پرداخت به‌ازای مصرف، انعطاف کامل)، Reserved (تعهد بلندمدت با تخفیف قابل‌توجه برای Workload قابل‌پیش‌بینی)، و Spot (ظرفیت مازاد کلود با تخفیف بسیار زیاد اما قابل‌خاتمه با اخطار کوتاه - مناسب برای Workloadهای قابل‌وقفه مثل پردازش دسته‌ای، نه سرویس‌های حیاتی). ذخیره‌سازی شیء (مثل S3) داده را نه به‌عنوان فایل‌سیستم سنتی بلکه به‌عنوان جفت کلید-مقدار در یک فضای نام تخت ذخیره می‌کند، با مدل دوامِ بسیار بالا (تکرار خودکار داده در چند مرکز داده) و Storage Classes مختلف (دسترسی مکرر در مقابل بایگانی ارزان‌قیمت برای داده کم‌استفاده) - تاریخچهٔ سازگاری آن از Eventually Consistent به Strong Read-after-Write Consistency در نسل‌های جدید تکامل یافته که رفتار برنامه‌هایی که بلافاصله بعد از نوشتن می‌خوانند را تغییر می‌دهد. دیتابیس رابطه‌ای مدیریت‌شده (مثل RDS) بسیاری از کارهای عملیاتی (Backup خودکار، Patch امنیتی، Failover) را از دوش تیم برمی‌دارد اما در ازای آن، کنترل کامل روی تنظیمات سطح پایین یا افزونه‌های خاص را می‌گیرد - مصالحه‌ای که برای اکثر تیم‌ها به‌نفع سرعت و کاهش ریسک عملیاتی است، مگر نیازمندی‌های بسیار خاص (مثل افزونهٔ سفارشی PostgreSQL) وجود داشته باشد. نکتهٔ کلیدی برای یک مهندس بک‌اند: این سه مفهوم (محاسبه، ذخیرهٔ شیء، دیتابیس مدیریت‌شده) در GCP (Compute Engine، Cloud Storage، Cloud SQL) و Azure (VM، Blob Storage، Azure SQL) هم به همین شکل مفهومی وجود دارند - دانش قابل‌انتقال است، فقط نام‌ها فرق دارند.",
objectives:["انتخاب مدل قیمت‌گذاری Instance مناسب (On-Demand/Reserved/Spot) بر اساس نوع Workload","توضیح مصالحهٔ کنترل در برابر راحتی عملیاتی در دیتابیس مدیریت‌شده"],
example:"یک Workload پردازش دسته‌ای شبانه که می‌تواند وقفه را تحمل کند، کاندیدای خوبی برای Spot Instance با هزینهٔ به‌مراتب کمتر است؛ سرویس API حیاتی تولید، نه.",
py:"", exercise:"برای یک اپلیکیشن Django با بار ترافیکی قابل‌پیش‌بینی روزانه، تصمیم بگیرید کدام مدل قیمت‌گذاری Instance (On-Demand/Reserved) منطقی‌تر است و چرا؛ سپس توضیح دهید چرا دیتابیس تولید آن را در RDS/Cloud SQL می‌گذارید نه روی یک VM خودتان.",
project:"", resources:[{t:"AWS docs - EC2 pricing models",u:"https://aws.amazon.com/ec2/pricing/"},{t:"AWS docs - S3 storage classes",u:"https://aws.amazon.com/s3/storage-classes/"},{t:"AWS docs - RDS",u:"https://docs.aws.amazon.com/rds/index.html"}],
criteria:"می‌توانید برای یک Workload مشخص، مدل قیمت‌گذاری Instance مناسب را انتخاب کنید و توضیح دهید چه زمانی دیتابیس مدیریت‌شده بر دیتابیس خودمدیریتی ترجیح دارد.",
interview:["تفاوت Spot Instance و On-Demand چیست و برای چه نوع Workloadای مناسب است؟","دیتابیس مدیریت‌شده (RDS) در ازای چه چیزی، چه چیزی می‌دهد؟"],
mistakes:["اجرای یک سرویس حیاتی تولید روی Spot Instance که می‌تواند با اخطار چند دقیقه‌ای خاتمه یابد"],
production:"بسیاری از تیم‌ها با انتقال از دیتابیس خودمدیریتی به یک سرویس مدیریت‌شده، زمان قابل‌توجهی از عملیات روزمره (Patch، Backup، Failover دستی) را آزاد می‌کنند تا روی محصول تمرکز کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم محاسبات ابری (مدل‌های قیمت‌گذاری Instance)، ذخیره‌سازی شیء و دیتابیس مدیریت‌شده را به‌شکلی مستقل از یک Provider خاص (قابل‌انتقال به AWS/GCP/Azure) آموزش بده. یک سناریوی Workload واقعی بده تا تصمیم زیرساختی مناسب را با استدلال انتخاب کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p37",num:37,title:"زیرساخت به‌عنوان کد",icon:"🧾",summary:"Terraform: State، Provider، Module و مدیریت drift.",
topics:[
{id:"terraform-state-modules",title:"Terraform: State، Plan/Apply و ماژول‌سازی",level:"Advanced",minLadder:4,prereqs:["cloud-vpc-iam"],
short:"چگونه زیرساخت را با کد قابل نسخه‌بندی و بازتولید مدیریت کنیم به‌جای کلیک کردن دستی در کنسول.",
deep:"Terraform State یک فایل (معمولاً JSON، ذخیره‌شده در یک Backend مثل S3+DynamoDB برای Locking) است که نگاشت بین منابع تعریف‌شده در کد و منابع واقعی موجود در Cloud را نگه می‌دارد؛ بدون این State، Terraform نمی‌داند چه چیزی از قبل وجود دارد. terraform plan تغییرات لازم (ایجاد/تغییر/حذف) را بدون اعمال واقعی نشان می‌دهد - این مرحلهٔ حیاتی 'پیش‌نمایش' قبل از هر apply در تولید باید همیشه به‌دقت بازبینی شود. Drift زمانی رخ می‌دهد که کسی دستی (از طریق کنسول کلود) منبعی را تغییر دهد که Terraform مدیریت می‌کند؛ در این حالت State با واقعیت هم‌خوان نیست و apply بعدی می‌تواند رفتار غیرمنتظره داشته باشد - راه‌حل، هرگز تغییر دستی منابع مدیریت‌شده با Terraform و اجرای دورهٔ terraform plan برای تشخیص Drift است. Module امکان بسته‌بندی مجموعه‌ای از منابع (مثلاً یک 'VPC استاندارد شرکت' یا یک 'کلاستر RDS با Backup خودکار') را به‌عنوان یک واحد قابل استفادهٔ مجدد با ورودی/خروجی مشخص (Variables/Outputs) می‌دهد، که تکرار کد بین محیط‌های dev/staging/production را کاهش می‌دهد. Remote State با Locking (مثل DynamoDB Lock) از اجرای هم‌زمان دو terraform apply که می‌تواند State را خراب کند جلوگیری می‌کند - حیاتی برای کار تیمی.",
objectives:["توضیح چرا Terraform State باید Remote و Lock-دار باشد در کار تیمی","ساخت یک Module قابل استفادهٔ مجدد برای زیرساخت تکراری"],
example:"terraform {\n  backend \"s3\" {\n    bucket = \"my-terraform-state\"\n    key    = \"prod/vpc.tfstate\"\n    dynamodb_table = \"terraform-locks\"\n  }\n}",
py:"", exercise:"یک ماژول Terraform برای یک 'VPC استاندارد' (با Subnet عمومی/خصوصی) بسازید که در سه محیط dev/staging/prod با متغیرهای متفاوت (CIDR block) قابل استفاده باشد.",
project:"", resources:[{t:"Terraform docs - State",u:"https://developer.hashicorp.com/terraform/language/state"},{t:"Terraform docs - Modules",u:"https://developer.hashicorp.com/terraform/language/modules"}],
criteria:"می‌توانید یک زیرساخت چندمحیطی (dev/staging/prod) با Terraform Module و Remote State با Locking طراحی کنید.",
interview:["Terraform State چیست و چرا باید Remote و Lock-دار باشد؟","Drift چیست و چگونه تشخیص داده می‌شود؟"],
mistakes:["ذخیرهٔ State به‌صورت محلی (local) در کار تیمی که منجر به Conflict و خرابی State می‌شود"],
production:"از دست دادن یا خراب شدن Terraform State یکی از خطرناک‌ترین اینسیدنت‌های زیرساختی است چون Terraform دیگر نمی‌داند چه چیزی واقعاً وجود دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم Terraform State، Plan/Apply، Drift و Module را توضیح بده. کمکم کن یک ماژول VPC قابل استفادهٔ مجدد برای سه محیط dev/staging/prod بسازم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"secrets-management-kms",title:"مدیریت اسرار (Secrets Management) و KMS",level:"Advanced",minLadder:4,prereqs:["terraform-state-modules"],
short:"چرا 'کلید API را در env var بگذار' کافی نیست، و چگونه اسرار را در مقیاس تیمی درست مدیریت کنیم.",
deep:"مشکل 'پراکندگی اسرار' (Secrets Sprawl) وقتی رخ می‌دهد که رمز عبور دیتابیس، کلید API سرویس‌های خارجی و کلید رمزنگاری در جاهای مختلف (فایل .env، متغیرهای CI، و گاهی حتی به‌اشتباه در کد Commit‌شده در Git) پخش می‌شوند، بدون هیچ کنترل مرکزی روی اینکه چه کسی به کدام مقدار دسترسی دارد یا چه زمانی آخرین بار عوض شده. راه‌حل استاندارد صنعتی، الگوی KMS/Vault است: یک سرویس مرکزی، اسرار را رمزنگاری‌شده نگه می‌دارد و دسترسی به آن‌ها را بر اساس هویت (IAM Role/ServiceAccount) کنترل می‌کند، نه از طریق کپی کردن مقدار خام در جای دیگر؛ برخی سیستم‌ها (مثل Vault) حتی می‌توانند اعتبارنامهٔ دیتابیس Dynamic و کوتاه‌عمر تولید کنند (به‌جای یک رمز عبور ثابت که سال‌ها بدون تغییر می‌ماند) که در صورت نشت، پنجرهٔ سوءاستفاده بسیار کوچک است. چرخش (Rotation) اسرار - عوض کردن دوره‌ای کلیدها حتی بدون نشانهٔ نشت - یک اصل دفاعی است که اگر خودکار نباشد عملاً هرگز اتفاق نمی‌افتد چون همیشه 'زمان مناسبش نیست'. عملکردهای مشخص برای جلوگیری از نشت در Git شامل اسکن Pre-commit (که قبل از هر commit، الگوهای شبیه کلید API را تشخیص می‌دهد) و نگهداری دقیق .gitignore است؛ نکتهٔ حیاتی وقتی نشتی واقعاً اتفاق می‌افتد: صرفاً حذف آن از تاریخچهٔ Git کافی نیست (تاریخچه ممکن است جای دیگر Clone شده باشد) - اقدام درست، چرخاندن فوری همان کلید (Invalidate کردن مقدار قدیم) است، نه فقط پاک کردنش از دید.",
objectives:["توضیح چرا اعتبارنامهٔ Dynamic کوتاه‌عمر امن‌تر از رمز عبور ثابت است","طراحی یک فرآیند پاسخ به نشت اسرار که چرخاندن فوری کلید را در اولویت اول قرار می‌دهد"],
example:"به‌جای گذاشتن DATABASE_PASSWORD ثابت در متغیر محیطی برای همیشه، یک سرویس Vault می‌تواند به‌ازای هر Deploy، یک اعتبارنامهٔ موقت با انقضای چند ساعته صادر کند.",
py:"", exercise:"یک اسکریپت Pre-commit Hook ساده بنویسید (یا از ابزاری مثل gitleaks استفاده کنید) که قبل از هر commit، الگوهای رایج کلید API (مثل AKIA برای AWS) را در فایل‌های Staged جستجو و در صورت یافتن، commit را متوقف کند.",
project:"", resources:[{t:"HashiCorp Vault docs",u:"https://developer.hashicorp.com/vault/docs"},{t:"gitleaks (GitHub)",u:"https://github.com/gitleaks/gitleaks"},{t:"OWASP Cheat Sheet - Secrets Management",u:"https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"}],
criteria:"می‌توانید توضیح دهید چرا کلید ثابت در env var کافی نیست، و در صورت نشت واقعی یک کلید، اولین اقدام درست (چرخاندن کلید) را انجام دهید نه فقط پاک‌سازی ظاهری.",
interview:["چرا اعتبارنامهٔ Dynamic کوتاه‌عمر امن‌تر از رمز عبور ثابت طولانی‌مدت است؟","اگر یک کلید API به‌اشتباه در Git Commit و Push شود، اولین قدم درست چیست؟"],
mistakes:["فرض اینکه حذف یک فایل حاوی کلید از commit بعدی، مشکل نشت را حل می‌کند (در حالی که کلید در تاریخچهٔ Git همچنان قابل‌دسترسی است و باید چرخانده شود)"],
production:"بسیاری از نشت‌های امنیتی بزرگ، نه از یک آسیب‌پذیری پیچیدهٔ کد، بلکه از یک کلید API فراموش‌شده در یک Commit عمومی GitHub کشف شده‌اند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مشکل پراکندگی اسرار، الگوی KMS/Vault، چرخش کلید و روش صحیح واکنش به نشت اسرار در Git را آموزش بده. یک سناریوی نشت واقعی کلید API طراحی کن تا واکنش صحیح را تمرین کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p38",num:38,title:"CI/CD",icon:"🔁",summary:"پایپ‌لاین ساخت/تست/استقرار و استراتژی‌های Deploy (Blue-Green، Canary).",
topics:[
{id:"cicd-deployment-strategies",title:"استراتژی‌های استقرار: Rolling، Blue-Green و Canary",level:"Advanced",minLadder:4,prereqs:["k8s-core-objects","git-branching-strategy"],
short:"چگونه نسخهٔ جدید نرم‌افزار را بدون Downtime و با ریسک کنترل‌شده مستقر کنیم.",
deep:"Rolling Update (پیش‌فرض Kubernetes Deployment) نسخهٔ جدید را تدریجی جایگزین نسخهٔ قدیم می‌کند، Pod به Pod - ساده و بدون منابع اضافی، اما در طول Rollout هر دو نسخه هم‌زمان فعال‌اند که نیازمند سازگاری بین نسخه‌هاست (مثلاً Migration دیتابیس باید Backward Compatible باشد). Blue-Green Deployment دو محیط کاملاً مجزا (Blue=فعلی، Green=جدید) نگه می‌دارد؛ بعد از تست کامل Green، ترافیک یک‌جا (با تغییر Load Balancer یا DNS) به آن سوییچ می‌شود - Rollback فوری است (فقط سوییچ برگردد) اما هزینهٔ دو برابر منابع در طول Deploy دارد. Canary Deployment نسخهٔ جدید را ابتدا به درصد کوچکی از ترافیک واقعی (مثلاً ۵٪) می‌دهد، متریک‌های کلیدی (نرخ خطا، تأخیر) را رصد می‌کند، و اگر سالم بود تدریجی درصد را افزایش می‌دهد - این روش بهترین تعادل بین ریسک و منابع را دارد و برای تغییرات پرریسک ترجیح داده می‌شود، اما نیازمند Observability قوی (برای تشخیص خودکار سالم/ناسالم بودن Canary) و مسیریابی ترافیک دقیق (مثل Service Mesh یا Ingress پیشرفته) است. Feature Flag مکمل این استراتژی‌هاست: کد جدید Deploy می‌شود اما پشت یک Flag غیرفعال می‌ماند و جداگانه (بدون Deploy مجدد) برای کاربران خاص فعال می‌شود، که ریسک Deploy را از ریسک انتشار قابلیت جدا می‌کند.",
objectives:["توضیح تفاوت ریسک/هزینهٔ Rolling، Blue-Green و Canary","طراحی یک پایپ‌لاین CI/CD با مرحلهٔ Canary"],
example:"در یک استقرار Canary در Kubernetes، دو Deployment (v1 با ۹۵٪ Replica و v2 با ۵٪ Replica) پشت یک Service مشترک قرار می‌گیرند.",
py:"", exercise:"یک پایپ‌لاین GitHub Actions طراحی کنید که: تست را اجرا کند → Image بسازد → به یک Registry پوش کند → با کوبرنتیز ابتدا ۵٪ ترافیک (Canary) و بعد از موفقیت، ۱۰۰٪ را به‌روزرسانی کند.",
project:"پایپ‌لاین CI/CD کامل برای یک پروژهٔ Django با GitHub Actions شامل: Lint، تست، Build Docker Image، و Deploy به Kubernetes با استراتژی Rolling.",
resources:[{t:"GitHub Actions docs",u:"https://docs.github.com/en/actions"},{t:"Kubernetes docs - Deployment strategies",u:"https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy"},{t:"Martin Fowler - BlueGreenDeployment",u:"https://martinfowler.com/bliki/BlueGreenDeployment.html"}],
criteria:"می‌توانید یک پایپ‌لاین کامل CI/CD با GitHub Actions بسازید که شامل تست خودکار، Build و Deploy با یک استراتژی مشخص (حداقل Rolling) باشد.",
interview:["تفاوت Blue-Green و Canary Deployment چیست؟ هرکدام چه مصالحه‌ای دارند؟","Feature Flag چگونه ریسک Deploy را از ریسک انتشار قابلیت جدا می‌کند؟"],
mistakes:["استقرار Migration دیتابیس Breaking هم‌زمان با کد جدید در یک Rolling Update که باعث ناسازگاری بین نسخهٔ قدیم و جدید کد در طول Rollout می‌شود"],
production:"شرکت‌های بزرگ (Netflix، Google) به‌طور گسترده از Canary Deployment با رصد خودکار متریک برای کاهش ریسک انتشار استفاده می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. استراتژی‌های استقرار (Rolling، Blue-Green، Canary) و نقش Feature Flag را توضیح بده و کمکم کن یک پایپ‌لاین GitHub Actions با تست خودکار و Deploy به Kubernetes طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"cicd-pipeline-semver",title:"طراحی مراحل پایپ‌لاین CI/CD و نسخه‌بندی معنایی (SemVer)",level:"Intermediate",minLadder:3,prereqs:["cicd-deployment-strategies"],
short:"ترتیب مراحل یک پایپ‌لاین به‌اندازهٔ خود مراحل مهم است، و شماره‌گذاری نسخه باید یک قرارداد باشد نه یک عدد دلخواه.",
deep:"یک پایپ‌لاین CI/CD خوب مراحل را به ترتیب سرعت و هزینه می‌چیند: Lint (چند ثانیه) قبل از Unit Test (چند ثانیه تا دقیقه) قبل از Build (دقایق) قبل از Integration Test (کندتر) قبل از Deploy - این ترتیب Fail-Fast یعنی خطاهای ارزان زودتر گرفته می‌شوند و منابع CI صرف اجرای مراحل گران‌قیمت روی کدی که حتی Lint را رد نکرده، نمی‌شود. کشِ Artifact و Dependency (مثلاً کش کردن پکیج‌های نصب‌شده بین اجراها) می‌تواند زمان اجرای پایپ‌لاین را از دقایق به ثانیه کاهش دهد و مستقیماً روی سرعت بازخورد تیم اثر دارد. نسخه‌بندی معنایی (Semantic Versioning، فرمت MAJOR.MINOR.PATCH) یک قرارداد ارتباطی با مصرف‌کنندگان API/کتابخانه است: افزایش PATCH یعنی فقط رفع باگ بدون تغییر رفتار، افزایش MINOR یعنی قابلیت جدید اما سازگار با گذشته (Backward Compatible)، و افزایش MAJOR یعنی تغییر Breaking که مصرف‌کننده باید کد خودش را عوض کند - نقض این قرارداد (مثلاً یک تغییر Breaking در PATCH) اعتماد مصرف‌کنندگان را از بین می‌برد. مدیریت انتشار (Release Management) شامل نگهداری Changelog قابل‌خواندن (چه چیزی در هر نسخه عوض شده، نه فقط لیست commit خام)، Tag کردن دقیق هر نسخه در Git، و این اصل است که 'چه چیزی عوض شده' باید همیشه بعداً قابل کشف باشد - چه برای دیباگ یک Regression و چه برای اطلاع‌رسانی به مصرف‌کنندگان.",
objectives:["طراحی ترتیب مراحل یک پایپ‌لاین CI بر اساس اصل Fail-Fast","تشخیص اینکه یک تغییر باید MAJOR، MINOR یا PATCH باشد"],
example:"افزودن یک فیلد اختیاری جدید به پاسخ API بدون حذف فیلد قدیمی: افزایش MINOR. حذف یا تغییر نام یک فیلد موجود: افزایش MAJOR (Breaking Change).",
py:"", exercise:"برای یک کتابخانهٔ داخلی Python که تیم شما منتشر می‌کند، سه تغییر فرضی بنویسید (یک رفع باگ، یک قابلیت جدید سازگار، یک تغییر Breaking) و شمارهٔ نسخهٔ درست بعد از هرکدام را مشخص کنید.",
project:"", resources:[{t:"Semantic Versioning 2.0.0",u:"https://semver.org/"},{t:"Keep a Changelog",u:"https://keepachangelog.com/"},{t:"GitHub Actions docs - Caching dependencies",u:"https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows"}],
criteria:"می‌توانید یک پایپ‌لاین CI را با ترتیب Fail-Fast طراحی کنید و برای یک تغییر مشخص، نسخهٔ SemVer صحیح بعدی را تعیین کنید.",
interview:["چرا مراحل ارزان‌تر (مثل Lint) باید قبل از مراحل گران‌تر (مثل Integration Test) در پایپ‌لاین اجرا شوند؟","تفاوت افزایش MINOR و MAJOR در SemVer چیست و چرا این تفاوت برای مصرف‌کنندگان یک API مهم است؟"],
mistakes:["انتشار یک تغییر Breaking API با فقط افزایش نسخهٔ PATCH، که مصرف‌کنندگان را غافلگیر و اعتماد را از بین می‌برد"],
production:"پایپ‌لاینی که مراحل کند را قبل از مراحل سریع اجرا می‌کند، بازخورد به توسعه‌دهنده را به‌طور غیرضروری کند می‌کند و مستقیماً روی سرعت تیم اثر منفی دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی ترتیب مراحل پایپ‌لاین CI/CD بر اساس Fail-Fast، و نسخه‌بندی معنایی (SemVer) با مدیریت انتشار را آموزش بده. چند سناریوی تغییر کد واقعی بده تا شمارهٔ نسخهٔ درست هرکدام را تعیین کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p39",num:39,title:"SRE",icon:"🚨",summary:"SLI/SLO/Error Budget، مدیریت اینسیدنت و پست‌مورتم بدون سرزنش.",
topics:[
{id:"sre-sli-slo-error-budget",title:"SLI، SLO، SLA و Error Budget",level:"Advanced",minLadder:4,prereqs:["math-prob-queueing"],
short:"چگونه قابلیت اطمینان را با اعداد دقیق تعریف کنیم به‌جای احساس مبهم 'سیستم باید همیشه کار کند'.",
deep:"SLI (Service Level Indicator) یک متریک قابل‌اندازه‌گیری از رفتار سرویس است (مثلاً درصد درخواست‌هایی که با موفقیت و زیر ۲۰۰ میلی‌ثانیه پاسخ داده شدند). SLO (Service Level Objective) هدف داخلی تیم برای آن SLI است (مثلاً 99.9٪ درخواست‌ها در یک ماه باید موفق باشند). SLA (Service Level Agreement) تعهد قراردادی به مشتری است که معمولاً کمی سخاوتمندانه‌تر از SLO داخلی تنظیم می‌شود و اغلب جریمهٔ مالی در صورت نقض دارد. Error Budget مکملِ SLO است: اگر SLO 99.9٪ باشد، Error Budget یعنی 0.1٪ خطا/Downtime مجاز است (که در یک ماه ۳۰ روزه تقریباً ۴۳ دقیقه می‌شود) - این عدد به تیم اجازه می‌دهد ریسک‌پذیرانه Deploy کنند تا زمانی که Budget تمام نشده؛ وقتی Error Budget در یک دوره تمام شود، تیم باید موقتاً تمرکز را از قابلیت‌های جدید به پایداری (Reliability Work) منتقل کند - این دقیقاً مکانیزمی است که SRE برای متعادل کردن سرعت توسعه و پایداری استفاده می‌کند، به‌جای بحث ذهنی و احساسی 'آیا این Deploy امن است'. انتخاب SLI درست حیاتی است: SLIهایی که واقعاً تجربهٔ کاربر را نشان می‌دهند (مثل نرخ موفقیت از دید کلاینت، نه فقط سرور) باید انتخاب شوند، نه صرفاً چیزی که اندازه‌گیری آن آسان است.",
objectives:["تعریف SLI/SLO مناسب برای یک API واقعی","محاسبهٔ Error Budget باقی‌مانده در یک دورهٔ زمانی"],
example:"SLO: 99.9٪ درخواست‌های API در ۳۰ روز گذشته باید کد ۲xx/۳xx و زیر ۵۰۰ میلی‌ثانیه باشند؛ Error Budget = 0.1٪ ≈ ۴۳ دقیقه Downtime مجاز در ماه.",
py:"total_requests = 10_000_000\nfailed_requests = 15_000\nslo_target = 0.999\nerror_budget_allowed = total_requests * (1 - slo_target)\nremaining_budget = error_budget_allowed - failed_requests\nprint(f'Error Budget باقی‌مانده: {remaining_budget:.0f} درخواست از {error_budget_allowed:.0f}')",
exercise:"برای یک API با ۵۰ میلیون درخواست در ماه و SLO 99.95٪، Error Budget مجاز را محاسبه کنید و اگر تا امروز (نیمهٔ ماه) ۱۵ هزار درخواست شکست خورده، بررسی کنید آیا Budget در حال تمام شدن است.",
project:"", resources:[{t:"Google SRE Book - Service Level Objectives (رایگان)",u:"https://sre.google/sre-book/service-level-objectives/"},{t:"Google - SRE Workbook (رایگان)",u:"https://sre.google/workbook/table-of-contents/"}],
criteria:"می‌توانید برای یک سرویس واقعی، SLI مناسب انتخاب کنید، یک SLO معقول تعریف کنید و Error Budget را محاسبه و تفسیر کنید.",
interview:["تفاوت SLI، SLO و SLA چیست؟","Error Budget چگونه به تصمیم‌گیری دربارهٔ سرعت Deploy کمک می‌کند؟"],
mistakes:["انتخاب SLI که اندازه‌گیریش آسان است اما تجربهٔ واقعی کاربر را نشان نمی‌دهد (مثل Uptime سرور به‌جای نرخ موفقیت واقعی از دید کلاینت)"],
production:"تیم‌های SRE گوگل و بسیاری شرکت بزرگ، تصمیم 'آیا امروز Deploy کنیم' را مستقیماً بر اساس باقیماندهٔ Error Budget می‌گیرند نه احساس شخصی.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم SLI، SLO، SLA و Error Budget را با مثال یک API واقعی توضیح بده و از من بخواه برای یک سرویس فرضی SLI/SLO مناسب تعریف کنم و Error Budget را محاسبه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"sre-incident-postmortem",title:"مدیریت اینسیدنت و پست‌مورتم بدون سرزنش (Blameless Postmortem)",level:"Advanced",minLadder:4,prereqs:["sre-sli-slo-error-budget"],
short:"چگونه اینسیدنت‌های تولید را مدیریت و از آن‌ها به‌عنوان فرصت یادگیری سیستمی استفاده کنیم.",
deep:"مدیریت اینسیدنت مؤثر نیازمند نقش‌های واضح است: Incident Commander (هماهنگ‌کنندهٔ کلی، تصمیم‌گیرندهٔ نهایی، نه لزوماً کسی که کد را دیباگ می‌کند)، Communications Lead (به‌روزرسانی ذی‌نفعان و مشتریان) و Responderها (کسانی که واقعاً دیباگ می‌کنند)؛ جدا کردن این نقش‌ها از هم مانع می‌شود که یک نفر هم‌زمان دیباگ کند و هم به ۲۰ نفر توضیح دهد. بعد از رفع اینسیدنت، Blameless Postmortem نوشته می‌شود: مستندی که Timeline دقیق (چه زمانی چه اتفاقی افتاد)، Impact (چند کاربر/چقدر درآمد تحت تأثیر بود)، Root Cause (علت ریشه‌ای، نه فقط علامت) و Action Item های مشخص (با مسئول و ضرب‌الاجل) را مستند می‌کند. کلمهٔ 'Blameless' حیاتی است: هدف پیدا کردن 'چه کسی مقصر بود' نیست بلکه 'چرا سیستم (شامل فرآیندها، ابزارها، مستندات) اجازه داد این خطا رخ دهد و به تولید برسد' - چون سرزنش فردی باعث می‌شود افراد اطلاعات را در پست‌مورتم‌های بعدی پنهان کنند و یادگیری سازمانی متوقف شود. یک تکنیک قدرتمند برای رسیدن به Root Cause واقعی (نه فقط علامت سطحی)، روش 5 Whys است: پرسیدن مکرر 'چرا' تا رسیدن به یک علت سیستمی قابل‌اصلاح.",
objectives:["نوشتن یک Blameless Postmortem کامل برای یک اینسیدنت فرضی","استفاده از روش 5 Whys برای رسیدن به Root Cause واقعی"],
example:"اینسیدنت سطحی: 'سرور کرش کرد'. با 5 Whys: چرا کرش کرد؟ حافظه تمام شد. چرا؟ Query Cache بی‌نهایت رشد کرد. چرا؟ TTL تنظیم نشده بود. چرا؟ در Code Review این موضوع بررسی نشد. چرا؟ چک‌لیست Code Review شامل بررسی TTL کش نبود — این علت ریشه‌ای قابل‌اصلاح واقعی است.",
py:"", exercise:"برای یک اینسیدنت فرضی ('API از ساعت ۱۴:۰۰ تا ۱۴:۴۵ خطای ۵۰۰ می‌داد')، یک Blameless Postmortem کامل با Timeline، Impact، 5 Whys و Action Itemهای مشخص بنویسید.",
project:"", resources:[{t:"Google SRE Book - Postmortem Culture (رایگان)",u:"https://sre.google/sre-book/postmortem-culture/"},{t:"PagerDuty - Incident Response documentation (رایگان)",u:"https://response.pagerduty.com/"}],
criteria:"می‌توانید یک Blameless Postmortem کامل بنویسید که با روش 5 Whys به یک علت ریشه‌ای سیستمی (نه فردی) برسد و Action Item های عملی تولید کند.",
interview:["Blameless Postmortem چیست و چرا سرزنش فردی مضر است؟","نقش Incident Commander چیست و چرا باید از Responder جدا باشد؟"],
mistakes:["نوشتن پست‌مورتمی که علت ریشه‌ای را در 'خطای فلان مهندس' خلاصه می‌کند به‌جای بررسی چرا سیستم/فرآیند اجازهٔ آن خطا را داد"],
production:"فرهنگ Blameless Postmortem مستقیماً کیفیت گزارش‌دهی داخلی و سرعت یادگیری سازمانی از اینسیدنت‌ها را تعیین می‌کند؛ سازمان‌هایی با فرهنگ سرزنش، اینسیدنت‌های تکراری بیشتری دارند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدیریت اینسیدنت (نقش‌ها، Incident Commander) و نگارش Blameless Postmortem با روش 5 Whys را آموزش بده. یک سناریوی اینسیدنت واقعی طراحی کن که من پست‌مورتم کامل آن را بنویسم و بازخورد بده آیا به علت ریشهٔ واقعی سیستمی رسیده‌ام یا فقط علامت سطحی را نوشته‌ام. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p40",num:40,title:"مشاهده‌پذیری",icon:"📊",summary:"سه ستون Observability: متریک (Prometheus/Grafana)، لاگ و ردیابی توزیع‌شده (OpenTelemetry).",
topics:[
{id:"observability-three-pillars",title:"سه ستون Observability: Metrics، Logs، Traces",level:"Advanced",minLadder:3,prereqs:["sre-incident-postmortem"],
short:"چگونه رفتار داخلی یک سیستم توزیع‌شده را بدون افزودن کد دیباگ جدید هر بار قابل مشاهده کنیم.",
deep:"Metrics اعداد تجمیع‌شده در طول زمان هستند (مثل تعداد درخواست، تأخیر p99، نرخ خطا) که برای Dashboard و Alerting مناسب‌اند اما جزئیات یک درخواست خاص را نشان نمی‌دهند؛ Prometheus با مدل Pull (خودش هر چند ثانیه Metricها را از یک Endpoint /metrics هر سرویس می‌کشد) و یک زبان کوئری قدرتمند (PromQL) استاندارد صنعتی است، Grafana لایهٔ بصری‌سازی (Dashboard) روی آن است. Logs رویدادهای گسسته با جزئیات کامل هستند (مثلاً 'کاربر ۴۲ سفارش ۱۰۰ ساخت')؛ Structured Logging (لاگ به فرمت JSON با فیلدهای مشخص به‌جای متن آزاد) امکان جستجو و فیلتر دقیق را می‌دهد. Traces مسیر کامل یک درخواست را در طول عبور از چند سرویس (مثل API Gateway → Order Service → Payment Service → Database) با یک Correlation ID مشترک (Trace ID) دنبال می‌کنند و برای دیباگ Latency در سیستم توزیع‌شده حیاتی‌اند - بدون Trace، فهمیدن اینکه کدام سرویس مسئول ۸۰٪ تأخیر یک درخواست کند بوده تقریباً غیرممکن است. OpenTelemetry استاندارد یکپارچهٔ جمع‌آوری هر سه (با یک SDK واحد) است که به Vendor Lock-in کمتر منجر می‌شود. Golden Signals (Latency، Traffic، Errors، Saturation) و RED Method (Rate، Errors، Duration برای سرویس‌ها) و USE Method (Utilization، Saturation، Errors برای منابع) چارچوب‌های استاندارد برای اینکه بدانیم دقیقاً چه چیزی را باید مانیتور کرد.",
objectives:["راه‌اندازی یک Metric سفارشی در Django با Prometheus client","توضیح چرا Trace ID برای دیباگ Latency توزیع‌شده ضروری است"],
example:"REQUEST_LATENCY = Histogram('http_request_duration_seconds', 'زمان پاسخ درخواست', ['endpoint'])\nبا PromQL: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) تأخیر p99 پنج‌دقیقهٔ اخیر را می‌دهد.",
py:"from prometheus_client import Histogram, Counter\nimport time\n\nREQUEST_LATENCY = Histogram('http_request_duration_seconds', 'زمان پاسخ', ['endpoint'])\nREQUEST_COUNT = Counter('http_requests_total', 'تعداد کل درخواست', ['endpoint', 'status'])\n\ndef instrumented_view(request):\n    start = time.time()\n    try:\n        response = actual_view(request)\n        REQUEST_COUNT.labels(endpoint='/api/orders', status=response.status_code).inc()\n        return response\n    finally:\n        REQUEST_LATENCY.labels(endpoint='/api/orders').observe(time.time() - start)",
exercise:"یک Middleware Django بسازید که برای هر درخواست، Metricهای Counter (تعداد) و Histogram (تأخیر) را با برچسب endpoint/status ثبت کند، سپس با Prometheus آن‌ها را جمع‌آوری و در Grafana یک Dashboard ساده بسازید.",
project:"پیاده‌سازی کامل Observability برای یک API Django: Metrics با Prometheus+Grafana، Structured Logging با JSON، و Distributed Tracing با OpenTelemetry بین دو سرویس شبیه‌سازی‌شده.",
resources:[{t:"Prometheus docs",u:"https://prometheus.io/docs/introduction/overview/"},{t:"Grafana docs",u:"https://grafana.com/docs/grafana/latest/"},{t:"OpenTelemetry docs",u:"https://opentelemetry.io/docs/"},{t:"Google SRE Book - Monitoring Distributed Systems (رایگان)",u:"https://sre.google/sre-book/monitoring-distributed-systems/"}],
criteria:"می‌توانید Metrics سفارشی، Structured Logging و Distributed Tracing را برای یک API Django راه‌اندازی کنید و یک Dashboard مفید در Grafana بسازید.",
interview:["سه ستون Observability کدام‌اند و هرکدام چه سؤالی را پاسخ می‌دهند؟","RED Method چیست؟","چرا Correlation/Trace ID برای دیباگ توزیع‌شده ضروری است؟"],
mistakes:["ایجاد Alert برای هر متریک ممکن که منجر به Alert Fatigue (خستگی از هشدار) و نادیده گرفتن هشدارهای واقعاً مهم می‌شود"],
production:"بدون Distributed Tracing، دیباگ 'کدام سرویس در یک زنجیرهٔ ۵ میکروسرویسی مسئول کندی است' می‌تواند ساعت‌ها طول بکشد؛ با Tracing، چند دقیقه.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. سه ستون Observability (Metrics، Logs، Traces) و ابزارهای آن (Prometheus، Grafana، OpenTelemetry) را با مثال عملی Django توضیح بده. کمکم کن یک Middleware اندازه‌گیری Metric بسازم و یک سناریوی 'کدام سرویس کند است' با Tracing حل کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p41",num:41,title:"مهندسی تولید",icon:"🏭",summary:"استقرار بدون Downtime، Migration ایمن، Feature Flag و بازیابی فاجعه.",
topics:[
{id:"prod-zero-downtime-migration",title:"Migration دیتابیس سازگار با گذشته (Backward-Compatible) و استقرار بدون Downtime",level:"Expert",minLadder:5,prereqs:["cicd-deployment-strategies","django-orm-internals"],
short:"چگونه اسکیمای دیتابیس را در یک سیستم زنده تغییر دهیم بدون قطعی، وقتی کد جدید و قدیم هم‌زمان اجرا می‌شوند.",
deep:"در یک Rolling Deployment، برای مدتی هم کد نسخهٔ قدیم و هم جدید هم‌زمان با یک دیتابیس مشترک کار می‌کنند؛ اگر Migration یک تغییر Breaking (مثل تغییر نام یا حذف یک ستون در همان مرحله) اعمال کند، کد نسخهٔ قدیم که هنوز به آن ستون با نام قدیم ارجاع می‌دهد، خطا می‌خورد. راه‌حل استاندارد، Migration چندمرحله‌ای (Expand-Contract Pattern) است: مرحلهٔ Expand، ستون/جدول جدید را اضافه می‌کند بدون حذف قدیمی (کد قدیم و جدید هردو کار می‌کنند)؛ بعد از Deploy کامل کد جدید که هم می‌نویسد و هم می‌خواند از ستون جدید (و شاید Backfill داده‌های قدیمی به فرمت جدید در پس‌زمینه)، و اطمینان از عدم استفادهٔ هیچ کد فعالی از ستون قدیم، مرحلهٔ Contract در یک Deploy جداگانه بعدی، ستون قدیم را حذف می‌کند. یک نکتهٔ حیاتی دیگر: Migrationهایی که یک جدول بزرگ را قفل می‌کنند (مثل افزودن ستون NOT NULL با مقدار پیش‌فرض در نسخه‌های قدیمی PostgreSQL، یا ساخت ایندکس معمولی) می‌توانند برای دقایق یا حتی ساعت‌ها جدول را برای نوشتن قفل کنند - راه‌حل، استفاده از CREATE INDEX CONCURRENTLY (که بدون قفل کامل جدول کار می‌کند اما کندتر است و نمی‌تواند در یک تراکنش Django Migration معمولی اجرا شود، نیازمند atomic=False) و افزودن ستون‌های جدید همیشه به‌صورت Nullable ابتدا.",
objectives:["طراحی یک Migration چندمرحله‌ای Expand-Contract برای تغییر نام یک ستون","استفاده از CREATE INDEX CONCURRENTLY برای جلوگیری از قفل جدول بزرگ"],
example:"تغییر نام ستون customer_name به full_name: مرحلهٔ ۱ افزودن full_name (Nullable) + کپی داده + کد جدید هر دو را می‌نویسد؛ مرحلهٔ ۲ (بعد از اطمینان کامل) حذف customer_name.",
py:"# Django Migration با CREATE INDEX CONCURRENTLY\nfrom django.db import migrations\n\nclass Migration(migrations.Migration):\n    atomic = False  # الزامی برای CONCURRENTLY\n    operations = [\n        migrations.RunSQL(\n            'CREATE INDEX CONCURRENTLY idx_orders_status ON orders (status);',\n            reverse_sql='DROP INDEX CONCURRENTLY idx_orders_status;'\n        )\n    ]",
exercise:"یک Migration دومرحله‌ای (Expand سپس Contract در دو Migration جداگانه) برای تغییر نوع دادهٔ یک ستون در یک جدول شبیه‌سازی‌شدهٔ بزرگ طراحی کنید.",
project:"", resources:[{t:"Django docs - Migrations",u:"https://docs.djangoproject.com/en/stable/topics/migrations/"},{t:"PostgreSQL docs - Building Indexes Concurrently",u:"https://www.postgresql.org/docs/current/sql-createindex.html#SQL-CREATEINDEX-CONCURRENTLY"},{t:"strong_migrations (gem مشابه در Rails، مفهومی قابل انتقال)",u:"https://github.com/ankane/strong_migrations"}],
criteria:"می‌توانید یک تغییر اسکیمای Breaking را با الگوی Expand-Contract در چند Migration جداگانه و بدون Downtime طراحی کنید.",
interview:["چرا نمی‌توان یک تغییر Breaking اسکیما را در یک مرحله در سیستم زنده اعمال کرد؟","Expand-Contract Pattern چیست؟"],
mistakes:["اجرای یک Migration که ستون NOT NULL جدید بدون مقدار پیش‌فرض اضافه می‌کند که در جدول بزرگ می‌تواند به قفل طولانی منجر شود"],
production:"Migration ناایمن روی یک جدول بزرگ در ساعات پرترافیک، یکی از رایج‌ترین دلایل اینسیدنت‌های خودساخته (Self-inflicted) در تیم‌های مهندسی است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. الگوی Expand-Contract برای Migration بدون Downtime و ریسک قفل جدول بزرگ را عمیق توضیح بده. یک سناریوی تغییر اسکیمای Breaking در یک جدول میلیونی بده تا با Migration چندمرحله‌ای ایمن آن را طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"backup-disaster-recovery",title:"استراتژی Backup، RTO/RPO و بازیابی فاجعه",level:"Expert",minLadder:5,prereqs:["prod-zero-downtime-migration"],
short:"یک Backup که هرگز Restore نشده، در واقع Backup نیست - فقط یک فایل ناشناخته است.",
deep:"استراتژی Backup شامل Full (کپی کامل، ساده اما حجیم)، Incremental (فقط تغییرات از آخرین Backup - سریع و کم‌حجم اما زنجیرهٔ بازیابی پیچیده‌تر) و Differential (تغییرات از آخرین Full - تعادلی بین این دو) است؛ در دیتابیس، Backup فیزیکی (کپی خام فایل‌های دیسک، سریع‌تر Restore می‌شود) در برابر Backup منطقی (خروجی SQL مثل pg_dump، قابل‌انتقال بین نسخه‌ها اما کندتر) مصالحهٔ متفاوتی دارند. قانون 3-2-1 (سه نسخه از داده، روی دو نوع رسانهٔ متفاوت، یک نسخه خارج از سایت) یک اصل ساده اما مؤثر برای اطمینان از اینکه یک حادثهٔ واحد (آتش‌سوزی دیتاسنتر، خطای انسانی) همهٔ نسخه‌ها را همزمان از بین نمی‌برد. دو عدد کل استراتژی DR را تعریف می‌کنند: RTO (Recovery Time Objective - چقدر طول می‌کشد سرویس بعد از فاجعه دوباره بالا بیاید) و RPO (Recovery Point Objective - چقدر داده از لحظهٔ آخرین Backup تا لحظهٔ فاجعه از دست می‌رود) - RTO/RPO کوچک‌تر همیشه ممکن است اما هزینهٔ زیرساختی بیشتری دارد (مثلاً Replication مداوم به یک منطقهٔ دیگر برای RPO نزدیک صفر)، پس این یک تصمیم کسب‌وکاری است نه فقط فنی. مهم‌ترین اصل عملی: تمرین بازیابی (Restore Drill) - واقعاً یک Backup را در یک محیط جدا Restore کردن و تأیید سالم بودن داده - باید یک فرآیند دورهای و اجباری باشد، چون تیم‌های زیادی سال‌ها Backup می‌گیرند بدون اینکه هرگز آن را Restore کرده باشند و اولین باری که واقعاً به آن نیاز پیدا می‌کنند، متوجه می‌شوند خراب یا ناقص بوده. یک Playbook از دست دادن کامل یک Region، جزئیات عملیاتی این تصمیمات را (که در بحث Multi-Region/Failover دیدیم) به سطح داده و Backup گسترش می‌دهد: کجا Backup ذخیره شده، چقدر طول می‌کشد در منطقهٔ جدید Restore شود، و چه کسی مسئول اجرای این پروسه است.",
objectives:["محاسبهٔ RTO/RPO موردنیاز یک سرویس بر اساس تأثیر کسب‌وکاری قطعی/از‌دست‌رفتن داده","طراحی و اجرای یک Restore Drill واقعی برای تأیید سالم بودن Backup"],
example:"برای یک سرویس پرداخت، RPO ممکن است نزدیک صفر باشد (هیچ تراکنشی نباید گم شود، نیازمند Replication همزمان)؛ برای یک سرویس گزارش‌گیری داخلی، RPO چند ساعته قابل‌قبول است.",
py:"", exercise:"برای دیتابیس یک پروژهٔ فرضی، یک استراتژی Backup (نوع، فرکانس، محل نگهداری بر اساس قانون 3-2-1) تعریف کنید؛ سپس یک Restore Drill واقعی روی یک محیط تست انجام دهید و زمان واقعی Restore را اندازه بگیرید تا با RTO هدف مقایسه کنید.",
project:"", resources:[{t:"PostgreSQL docs - Backup and Restore",u:"https://www.postgresql.org/docs/current/backup.html"},{t:"AWS - RTO and RPO definitions",u:"https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"}],
criteria:"می‌توانید برای یک سرویس واقعی RTO/RPO مناسب تعیین کنید، استراتژی Backup متناسب طراحی کنید، و با یک Restore Drill واقعی صحت آن را اثبات کنید.",
interview:["تفاوت RTO و RPO چیست و چرا هردو برای طراحی استراتژی DR لازم‌اند؟","چرا یک Backup که هرگز Restore نشده را نمی‌توان یک Backup قابل‌اعتماد دانست؟"],
mistakes:["گرفتن Backup منظم اما هرگز تست نکردن فرآیند Restore، تا روزی که واقعاً لازم می‌شود و مشخص می‌شود Backup خراب یا ناقص بوده"],
production:"در بسیاری از اینسیدنت‌های واقعی از دست رفتن داده، مشکل اصلی نبود Backup نبوده، بلکه نامعتبر بودن آن (هرگز تست‌نشده) در لحظهٔ نیاز واقعی بوده است.",

deep:"مشکل کلاسیک 'نوشتن دوگانه' (Dual Write): اگر یک سرویس ابتدا در تراکنش دیتابیس تغییری اعمال کند و سپس جداگانه یک پیام به Kafka/RabbitMQ منتشر کند، این دو عملیات Atomic نیستند - اگر بین این دو مرحله سرویس کرش کند، یا دیتابیس تغییر می‌کند اما پیام هرگز منتشر نمی‌شود (ناسازگاری) یا برعکس. الگوی Transactional Outbox این را حل می‌کند: به‌جای انتشار مستقیم پیام، رکورد پیام در همان تراکنش دیتابیسی (در یک جدول outbox) درج می‌شود - چون این در همان تراکنش ACID با تغییر اصلی است، هر دو با هم Commit یا هر دو Rollback می‌شوند؛ سپس یک فرآیند جداگانه (Message Relay، اغلب با Debezium و CDC یعنی Change Data Capture از WAL) رکوردهای جدول outbox را می‌خواند و به Kafka منتشر می‌کند، با تضمین at-least-once (پس Consumer باید Idempotent باشد، طبق اصلی که قبلاً دیدیم). CQRS (Command Query Responsibility Segregation) مدل نوشتن (Command، بهینه‌شده برای سازگاری و منطق کسب‌وکار) را از مدل خواندن (Query، اغلب یک View دنرمال‌شده و بهینه برای سرعت خواندن، که از طریق همین رویدادها به‌روز می‌ماند) جدا می‌کند - این برای سیستم‌هایی که الگوی خواندن و نوشتن‌شان بسیار متفاوت است (مثل داشبورد گزارش‌گیری سنگین کنار یک سیستم تراکنشی) مفید است، اما پیچیدگی Eventual Consistency بین دو مدل را اضافه می‌کند.",
