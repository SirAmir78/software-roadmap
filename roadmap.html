ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. صفحه‌بندی Offset در برابر Cursor و استراتژی‌های نسخه‌بندی API را توضیح بده، با مثال DRF پیاده‌سازی کن، و یک سناریوی 'جدول با میلیون‌ها رکورد و Offset کند' بده تا با Cursor Pagination رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"api-graphql-grpc",title:"GraphQL و gRPC: کی از REST بهتر است",level:"Advanced",minLadder:4,prereqs:["api-pagination-versioning"],
short:"چه زمانی GraphQL برای انعطاف کلاینت، و gRPC برای ارتباط سرویس‌به‌سرویس، از REST بهتر عمل می‌کند.",
deep:"GraphQL این مشکل REST را حل می‌کند که کلاینت یا داده‌ای کمتر از نیاز می‌گیرد (Under-fetching، نیازمند چند Round-trip) یا بیشتر از نیاز (Over-fetching). در GraphQL کلاینت دقیقاً فیلدهایی که نیاز دارد را در یک Query مشخص می‌کند و سرور با Resolverها آن‌ها را پر می‌کند؛ اما این آزادی یک مشکل جدید می‌سازد: اگر یک Resolver برای هر آیتم در یک لیست دوباره کوئری بزند (مثلاً گرفتن نویسندهٔ هر پست جدا)، دقیقاً همان مشکل N+1 که در ORM دیدیم رخ می‌دهد؛ راه‌حل استاندارد DataLoader است که درخواست‌های هم‌زمان را در یک Tick از Event Loop batch می‌کند و با یک کوئری IN (...) پاسخ می‌دهد. gRPC در جهت دیگری حرکت می‌کند: به‌جای انعطاف کوئری، روی سرعت و قرارداد سخت‌گیر تمرکز دارد — Schema با Protocol Buffers (باینری، فشرده‌تر از JSON) تعریف می‌شود، روی HTTP/2 اجرا می‌شود (Multiplexing واقعی، نه محدودیت Head-of-line JSON/HTTP1.1) و از RPCهای Unary (یک درخواست/یک پاسخ) تا Streaming دوطرفه پشتیبانی می‌کند. به همین دلیل gRPC انتخاب رایج ارتباط داخلی بین میکروسرویس‌ها است (سرعت و Type-safety) در حالی که REST/GraphQL برای APIهای عمومی رو به کلاینت (وب/موبایل) که نیاز به خوانایی و کش HTTP دارند مناسب‌ترند.",
objectives:["تشخیص مشکل N+1 در Resolver های GraphQL و رفع آن با DataLoader","توضیح چرا gRPC برای ارتباط داخلی میکروسرویس‌ها ترجیح داده می‌شود"],
example:"query { post(id: 1) { title author { name } } } — کلاینت فقط title و author.name را می‌خواهد، نه کل رکورد Post مثل یک REST endpoint معمولی.",
py:"# تعریف سرویس gRPC با Protocol Buffers (order.proto)\n# service OrderService {\n#   rpc GetOrder (OrderRequest) returns (OrderReply);\n# }\n# پیاده‌سازی سمت سرور در پایتون با grpcio پس از تولید کد از .proto",
exercise:"یک اسکیمای GraphQL ساده برای Post و Author طراحی کنید که در آن گرفتن لیست پست‌ها با نویسندهٔ هرکدام، بدون DataLoader مشکل N+1 ایجاد کند؛ سپس با یک DataLoader ساده آن را batch کنید.",
project:"", resources:[{t:"GraphQL - Official docs",u:"https://graphql.org/learn/"},{t:"gRPC - Official docs",u:"https://grpc.io/docs/what-is-grpc/introduction/"},{t:"DataLoader (Facebook)",u:"https://github.com/graphql/dataloader"}],
criteria:"می‌توانید توضیح دهید چرا یک API عمومی رو به موبایل ممکن است GraphQL انتخاب کند در حالی که ارتباط بین دو میکروسرویس داخلی gRPC را ترجیح می‌دهد.",
interview:["مشکل N+1 در GraphQL چگونه رخ می‌دهد و DataLoader چطور آن را حل می‌کند؟","چرا gRPC روی HTTP/2 اجرا می‌شود و این چه مزیتی نسبت به REST/HTTP1.1 دارد؟"],
mistakes:["پیاده‌سازی Resolver های GraphQL بدون توجه به N+1، که فقط زیر بار واقعی نمایان می‌شود","استفاده از gRPC برای APIهای عمومی رو به مرورگر که نیاز به کش HTTP و خوانایی JSON دارند"],
production:"شرکت‌هایی مثل GitHub و Shopify از GraphQL برای API عمومی خود استفاده می‌کنند، در حالی که ارتباط داخلی بین سرویس‌هایشان اغلب روی gRPC یا REST سبک است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تفاوت GraphQL، gRPC و REST را با تمرکز بر «کِی کدام را انتخاب کنیم» آموزش بده، یک سناریوی N+1 در GraphQL Resolver برایم بساز تا با DataLoader رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"api-auth-oauth-oidc",title:"OAuth 2.0 و OpenID Connect: احراز هویت واگذارشده",level:"Advanced",minLadder:3,prereqs:["drf-auth-throttling"],
short:"چگونه یک کاربر بدون دادن رمز عبورش به سرویس شما، به آن اجازهٔ دسترسی محدود به داده‌اش در سرویس دیگر را می‌دهد.",
deep:"OAuth 2.0 پروتکل Authorization (اجازه‌دادن دسترسی) است، نه Authentication؛ Authorization Code Grant رایج‌ترین جریان است: کاربر در سرویس اصلی (مثلاً گوگل) لاگین می‌کند، یک Authorization Code کوتاه‌عمر به اپلیکیشن شما برمی‌گردد، و اپلیکیشن شما (سمت سرور، با یک Client Secret) آن کد را با یک Access Token تعویض می‌کند — این تعویض سمت سرور یعنی Access Token هرگز مستقیماً در مرورگر کاربر ظاهر نمی‌شود. برای اپلیکیشن‌های موبایل/SPA که نمی‌توانند Client Secret را امن نگه دارند، PKCE (Proof Key for Code Exchange) اضافه می‌شود: یک مقدار تصادفی (code_verifier) تولید می‌شود که هش آن (code_challenge) در ابتدای جریان فرستاده و در انتها verifier اصلی بررسی می‌شود، که جلوی سرقت Authorization Code را می‌گیرد؛ به همین دلیل Implicit Grant (که توکن مستقیم در URL برمی‌گشت) و Resource Owner Password Grant امروز منسوخ تلقی می‌شوند. OpenID Connect (OIDC) یک لایهٔ Identity روی OAuth2 اضافه می‌کند: یک ID Token امضاشده (JWT) که هویت کاربر (کی هست) را تضمین می‌کند، مجزا از Access Token (چه اجازه‌ای دارد). Token Introspection به Resource Server اجازه می‌دهد اعتبار یک توکن را از Authorization Server بپرسد، و Refresh Token Rotation با صادر کردن Refresh Token جدید در هر استفاده، ریسک سرقت و استفادهٔ مجدد توکن قدیمی را کاهش می‌دهد.",
objectives:["توضیح تفاوت Access Token و ID Token در OIDC","پیاده‌سازی Authorization Code + PKCE برای یک کلاینت SPA"],
example:"ورود با گوگل: کاربر → گوگل لاگین می‌کند → گوگل کد را به اپ شما برمی‌گرداند → اپ شما کد را با Access Token و ID Token تعویض می‌کند → از ID Token هویت کاربر (ایمیل، نام) استخراج می‌شود.",
py:"# تولید code_verifier و code_challenge برای PKCE\nimport secrets, hashlib, base64\nverifier = secrets.token_urlsafe(64)\nchallenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()",
exercise:"جریان Authorization Code + PKCE را برای یک کلاینت SPA فرضی روی کاغذ یا با یک ابزار مثل oauth.tools شبیه‌سازی کنید و هر مرحله (code_verifier، code_challenge، تعویض کد با توکن) را مشخص کنید.",
project:"", resources:[{t:"OAuth 2.0 - RFC 6749",u:"https://www.rfc-editor.org/rfc/rfc6749"},{t:"OAuth 2.0 for Native Apps (PKCE) - RFC 8252",u:"https://www.rfc-editor.org/rfc/rfc8252"},{t:"OpenID Connect - Official spec",u:"https://openid.net/specs/openid-connect-core-1_0.html"}],
criteria:"می‌توانید توضیح دهید چرا Implicit Grant منسوخ شده و چگونه PKCE همان مشکل امنیتی را برای کلاینت‌های عمومی (SPA/موبایل) حل می‌کند.",
interview:["تفاوت OAuth2 و OpenID Connect چیست؟","PKCE چه مشکل امنیتی‌ای را حل می‌کند و چرا برای اپ‌های موبایل/SPA لازم است؟"],
mistakes:["نگه‌داشتن Client Secret در کد سمت کلاینت (موبایل/SPA) که قابل استخراج است","استفاده از Access Token برای استخراج هویت کاربر به‌جای ID Token"],
production:"تقریباً همهٔ سیستم‌های 'ورود با گوگل/گیت‌هاب' از همین جریان Authorization Code (+ PKCE برای کلاینت‌های عمومی) و OIDC برای هویت استفاده می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. OAuth 2.0 (به‌خصوص Authorization Code + PKCE) و OpenID Connect را با مثال 'ورود با گوگل' آموزش بده و تفاوت Access Token/ID Token/Refresh Token را با یک دیاگرام مرحله‌به‌مرحله روشن کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"api-contracts-docs",title:"API به‌عنوان قرارداد: OpenAPI و Contract Testing",level:"Intermediate",minLadder:3,prereqs:["api-pagination-versioning"],
short:"چگونه اسکیمای API را منبع حقیقت قرار دهیم تا مستندات، کلاینت و تست‌ها همیشه با پیاده‌سازی واقعی همگام بمانند.",
deep:"در طراحی Schema-first، اسکیمای API (با OpenAPI/Swagger برای REST) قبل یا هم‌زمان با پیاده‌سازی نوشته می‌شود و به‌عنوان منبع حقیقت (Single Source of Truth) عمل می‌کند: از همین اسکیما می‌توان مستندات تعاملی (Swagger UI)، کد Client SDK و حتی اسکلت سرور را خودکار تولید کرد، که جلوی مشکل رایج 'مستندات قدیمی و ناهماهنگ با کد واقعی' را می‌گیرد. اما اسکیمای درست هم تضمین نمی‌کند که سرویس واقعاً طبق قرارداد رفتار کند وقتی چند تیم مستقل روی سرویس‌های مختلف کار می‌کنند؛ اینجا Contract Testing وارد می‌شود: در الگوی Consumer-Driven Contracts (مثل ابزار Pact)، تیم مصرف‌کننده (کلاینت) انتظارات خودش از API را به‌صورت یک قرارداد قابل اجرا می‌نویسد، تیم تأمین‌کننده (سرور) این قرارداد را در CI اجرا می‌کند و اگر تغییری قرارداد را نقض کند (مثلاً حذف یک فیلد که کلاینت به آن وابسته است)، پیش از Deploy واقعی و بدون نیاز به تست End-to-End پرهزینه، شکسته شدن سازگاری کشف می‌شود. این رویکرد به‌خصوص در معماری میکروسرویس که تعداد ترکیب‌های ممکن بین سرویس‌ها برای E2E testing بسیار زیاد می‌شود، مقیاس‌پذیرتر است.",
objectives:["تعریف یک Schema با OpenAPI برای یک endpoint واقعی","توضیح چگونه Contract Testing شکستن سازگاری بین سرویس مصرف‌کننده و تأمین‌کننده را زودتر از E2E کشف می‌کند"],
example:"یک فایل openapi.yaml که endpoint POST /orders را با schema دقیق request/response تعریف می‌کند؛ از همین فایل، Swagger UI مستندات تعاملی و کد کلاینت TypeScript خودکار تولید می‌شود.",
py:"", exercise:"برای یک endpoint موجود در پروژه، یک تعریف OpenAPI بنویسید (می‌توانید از drf-spectacular برای تولید خودکار آن از DRF Serializer استفاده کنید) و آن را در Swagger UI مشاهده کنید.",
project:"", resources:[{t:"OpenAPI Specification",u:"https://swagger.io/specification/"},{t:"Pact - Contract Testing",u:"https://docs.pact.io/"},{t:"drf-spectacular",u:"https://drf-spectacular.readthedocs.io/"}],
criteria:"می‌توانید توضیح دهید چرا تولید مستندات از اسکیما (نه نوشتن دستی) تضمین می‌کند مستندات همیشه با کد واقعی همگام بماند.",
interview:["Contract Testing چه مشکلی را حل می‌کند که تست‌های Unit/Integration معمولی حل نمی‌کنند؟","چرا در معماری میکروسرویس، Contract Testing از E2E Testing کامل مقیاس‌پذیرتر است؟"],
mistakes:["نگه‌داشتن مستندات API به‌صورت دستی و جدا از کد که به‌مرور از پیاده‌سازی واقعی عقب می‌افتد"],
production:"تیم‌هایی که چندین سرویس مستقل با تیم‌های جدا دارند، معمولاً Contract Testing را در CI اجباری می‌کنند تا Deploy یک سرویس، سرویس‌های دیگر را بدون اطلاع نشکند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی Schema-first با OpenAPI و مفهوم Contract Testing (با تمرکز بر Consumer-Driven Contracts) را با یک مثال واقعی از یک API سفارش آموزش بده. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p13",num:13,title:"Django",icon:"🎸",summary:"از ساختار پروژه تا داخلی‌های ORM، میان‌افزار و چرخهٔ درخواست.",
topics:[
{id:"django-request-lifecycle",title:"چرخهٔ کامل یک درخواست در Django (Middleware، URL Resolver، View)",level:"Intermediate",minLadder:2,prereqs:["wsgi-asgi"],
short:"مسیر دقیق یک درخواست HTTP از ورود به Gunicorn تا خروج پاسخ از Django.",
deep:"وقتی یک درخواست به Gunicorn می‌رسد، به تابع WSGI application جنگو تحویل داده می‌شود؛ Django یک شیء HttpRequest می‌سازد و آن را از زنجیرهٔ Middleware (به ترتیب تعریف در MIDDLEWARE) از بالا به پایین رد می‌کند — هر Middleware می‌تواند قبل از رسیدن به View کاری انجام دهد (مثل احراز هویت Session، بررسی CSRF) یا حتی درخواست را زودتر متوقف کند. سپس URL Resolver با تطبیق الگوهای urls.py، View مناسب را پیدا می‌کند. View (تابع یا کلاس) منطق کسب‌وکار را اجرا می‌کند، معمولاً با فراخوانی ORM (که SQL می‌سازد و اجرا می‌کند)، و یک HttpResponse برمی‌گرداند. پاسخ دوباره از زنجیرهٔ Middleware اما این‌بار از پایین به بالا عبور می‌کند (هر Middleware می‌تواند پاسخ را تغییر دهد، مثلاً اضافه کردن هدر). Signals (مثل post_save) در نقاط خاص چرخهٔ ORM (نه HTTP) فراخوانی می‌شوند و باید با احتیاط استفاده شوند چون جریان کنترل را implicit می‌کنند و دیباگ را سخت‌تر می‌سازند. فهم دقیق این ترتیب برای دیباگ مشکلاتی مثل 'چرا CSRF قبل از View من چک می‌شود' حیاتی است.",
objectives:["توضیح ترتیب اجرای Middlewareها در رفت و برگشت","توضیح چرا ترتیب MIDDLEWARE در settings.py مهم است"],
example:"MIDDLEWARE = ['...SecurityMiddleware', '...SessionMiddleware', '...CsrfViewMiddleware', '...AuthenticationMiddleware', ...] — هرکدام باید بعد از پیش‌نیاز خودش بیاید.",
py:"# یک Middleware ساده سفارشی\nclass TimingMiddleware:\n    def __init__(self, get_response):\n        self.get_response = get_response\n    def __call__(self, request):\n        import time\n        start = time.time()\n        response = self.get_response(request)\n        response['X-Response-Time'] = f'{time.time()-start:.3f}s'\n        return response",
exercise:"Middleware بالا را به یک پروژهٔ Django اضافه کنید و هدر X-Response-Time را در پاسخ مشاهده کنید؛ سپس ترتیب آن را در MIDDLEWARE تغییر دهید و ببینید چطور روی مقدار اندازه‌گیری‌شده تأثیر می‌گذارد.",
project:"", resources:[{t:"Django docs - Middleware",u:"https://docs.djangoproject.com/en/stable/topics/http/middleware/"},{t:"Django docs - Request/response cycle",u:"https://docs.djangoproject.com/en/stable/ref/request-response/"}],
criteria:"می‌توانید یک Middleware سفارشی بنویسید و توضیح دهید دقیقاً در کدام مرحله از چرخهٔ درخواست اجرا می‌شود.",
interview:["چرخهٔ کامل یک درخواست در Django را توضیح دهید.","چرا ترتیب Middleware در settings.py اهمیت دارد؟"],
mistakes:["قرار دادن Middlewareهای وابسته به Session قبل از SessionMiddleware"],
production:"دیباگ مشکلات احراز هویت یا CSRF اغلب نیازمند فهم دقیق ترتیب اجرای Middleware است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. چرخهٔ کامل درخواست در Django (Middleware، URL Resolver، View، Response) را با یک دیاگرام متنی توضیح بده و از من بخواه یک Middleware سفارشی برای اندازه‌گیری زمان پاسخ بنویسم و محل صحیح آن در MIDDLEWARE را توجیه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"django-orm-internals",title:"داخلی‌های ORM جنگو: QuerySet تنبل، select_related و N+1",level:"Advanced",minLadder:3,prereqs:["django-request-lifecycle","ds-btree"],
short:"چرا QuerySetها تنبل (Lazy) هستند و چگونه با select_related/prefetch_related از مشکل N+1 جلوگیری کنیم.",
deep:"QuerySet در Django بلافاصله SQL اجرا نمی‌کند؛ فقط وقتی واقعاً به داده نیاز باشد (پیمایش، len()، لیست کردن) کوئری واقعی اجرا می‌شود — این تنبلی (Laziness) اجازه می‌دهد فیلترها و ترتیب‌ها زنجیره شوند و در نهایت یک SQL بهینه ساخته شود، اما اگر درست فهمیده نشود منجر به مشکل معروف N+1 Query می‌شود: مثلاً پیمایش روی ۱۰۰ سفارش و دسترسی به order.customer.name برای هرکدام، به‌طور پیش‌فرض ۱۰۰ کوئری اضافی به دیتابیس می‌زند (یکی برای گرفتن لیست سفارش‌ها، و ۱۰۰ کوئری جداگانه برای هر customer). select_related از SQL JOIN استفاده می‌کند تا رابطهٔ ForeignKey/OneToOne را در همان کوئری اول با یک JOIN بیاورد (مناسب برای روابط 'to-one')؛ prefetch_related یک کوئری جداگانه (نه JOIN) برای رابطهٔ ManyToMany یا reverse ForeignKey اجرا می‌کند و نتایج را در پایتون به هم متصل می‌کند (مناسب برای روابط 'to-many' که JOIN باعث تکرار ردیف می‌شود). ابزار django-debug-toolbar یا django-silk برای شناسایی این کوئری‌های اضافی در توسعه ضروری‌اند.",
objectives:["تشخیص و رفع مشکل N+1 با select_related/prefetch_related","توضیح چرا QuerySet تنبل است"],
example:"# بدون select_related: ۱۰۰ کوئری اضافه\nfor order in Order.objects.all():\n    print(order.customer.name)\n\n# با select_related: فقط ۱ کوئری با JOIN\nfor order in Order.objects.select_related('customer'):\n    print(order.customer.name)",
py:"from django.db import connection, reset_queries\nfrom django.test.utils import CaptureQueriesContext\n\nwith CaptureQueriesContext(connection) as ctx:\n    orders = list(Order.objects.select_related('customer'))\n    for o in orders:\n        _ = o.customer.name\nprint('تعداد کوئری‌های اجراشده:', len(ctx.captured_queries))",
exercise:"یک مدل Order با ForeignKey به Customer بسازید، ۱۰۰ سفارش نمونه ایجاد کنید، و با django-debug-toolbar تعداد کوئری‌ها را قبل و بعد از select_related مقایسه کنید.",
project:"داشبورد گزارش سفارشات که تمام روابط را با select_related/prefetch_related بهینه کرده و تعداد کوئری‌ها به ازای هر صفحه ثابت (نه وابسته به تعداد رکورد) باشد.",
resources:[{t:"Django docs - QuerySet API (select_related/prefetch_related)",u:"https://docs.djangoproject.com/en/stable/ref/models/querysets/"},{t:"django-debug-toolbar",u:"https://django-debug-toolbar.readthedocs.io/"}],
criteria:"می‌توانید در یک صفحهٔ Django با روابط تودرتو، با select_related/prefetch_related تعداد کوئری‌ها را از O(n) به O(1) برسانید.",
interview:["مشکل N+1 Query چیست و چگونه آن را در Django تشخیص و رفع می‌کنید؟","تفاوت select_related و prefetch_related چیست؟"],
mistakes:["استفاده از select_related برای رابطهٔ ManyToMany که باعث تکرار ردیف در نتیجهٔ JOIN می‌شود","فراموش کردن بهینه‌سازی کوئری در Serializer های تودرتوی DRF"],
production:"مشکل N+1 Query شایع‌ترین علت کندی API در پروژه‌های واقعی Django است و اغلب فقط زیر بار واقعی (نه در تست محلی با داده کم) نمایان می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مشکل N+1 Query در Django ORM و راه‌حل آن (select_related/prefetch_related) را عمیق توضیح بده، یک مدل با روابط تودرتو برایم بساز که عمداً N+1 داشته باشد، و از من بخواه با django-debug-toolbar پیدا و رفعش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p14",num:14,title:"Django REST Framework",icon:"🧩",summary:"Serializers، ViewSets، Permissions، Throttling و طراحی API حرفه‌ای با DRF.",
topics:[
{id:"drf-serializers-viewsets",title:"Serializers، ViewSets و Routers در DRF",level:"Intermediate",minLadder:2,prereqs:["django-orm-internals","api-idempotency"],
short:"چگونه DRF داده‌های پایتون/ORM را به JSON تبدیل، اعتبارسنجی و مسیرهای API را خودکار می‌سازد.",
deep:"Serializer دو مسئولیت اصلی دارد: تبدیل اشیاء پایتون/مدل به داده‌های قابل رندر (مثل JSON) و اعتبارسنجی/تبدیل داده‌های ورودی به اشیاء پایتون (Deserialization). ModelSerializer فیلدها را خودکار از مدل استنتاج می‌کند اما باید مراقب بود که فیلدهای حساس (مثل password) به‌صورت پیش‌فرض expose نشوند. ViewSet منطق CRUD را در یک کلاس گروه‌بندی می‌کند (list, retrieve, create, update, destroy) و با Router (مثل DefaultRouter) خودکار به URLهای RESTful نگاشت می‌شود، که تکرار کد را کاهش می‌دهد اما انعطاف کمتری نسبت به APIView خام دارد. یک تصمیم معماری کلیدی: برای APIهای ساده CRUD، ModelViewSet سرعت توسعه بالایی می‌دهد؛ برای منطق پیچیده‌تر (مثل چند مرحله تأیید سفارش)، APIView یا حتی Function-based View با کنترل صریح‌تر بهتر است، چون Magic ViewSet می‌تواند خوانایی و قابلیت دیباگ را در سناریوهای پیچیده کاهش دهد.",
objectives:["ساخت Serializer با اعتبارسنجی سفارشی","تصمیم‌گیری بین ModelViewSet و APIView بر اساس پیچیدگی منطق"],
example:"class OrderSerializer(serializers.ModelSerializer):\n    class Meta:\n        model = Order\n        fields = ['id', 'total', 'status', 'created_at']\n        read_only_fields = ['status', 'created_at']",
py:"from rest_framework import serializers, viewsets\n\nclass OrderSerializer(serializers.ModelSerializer):\n    def validate_total(self, value):\n        if value <= 0:\n            raise serializers.ValidationError('مبلغ باید مثبت باشد')\n        return value\n    class Meta:\n        model = Order\n        fields = ['id', 'total', 'status']\n\nclass OrderViewSet(viewsets.ModelViewSet):\n    queryset = Order.objects.select_related('customer').all()\n    serializer_class = OrderSerializer",
exercise:"یک OrderViewSet کامل با Serializer دارای اعتبارسنجی سفارشی (validate_<field> و validate) بسازید و با DefaultRouter مسیرهای CRUD خودکار را تست کنید.",
project:"API کامل مدیریت سفارش با DRF شامل Serializer تودرتو (Nested)، اعتبارسنجی سفارشی و بهینه‌سازی کوئری در ViewSet.",
resources:[{t:"DRF docs - Serializers",u:"https://www.django-rest-framework.org/api-guide/serializers/"},{t:"DRF docs - ViewSets & Routers",u:"https://www.django-rest-framework.org/api-guide/viewsets/"}],
criteria:"می‌توانید یک API کامل CRUD با DRF بسازید که شامل اعتبارسنجی سفارشی و بهینه‌سازی کوئری (queryset با select_related) باشد.",
interview:["تفاوت ModelSerializer و Serializer معمولی چیست؟","چه زمانی ViewSet مناسب نیست و باید از APIView استفاده کرد؟"],
mistakes:["استفادهٔ ناخواسته از ModelViewSet که فیلدهای حساس (مثل رمز عبور هش‌شده) را در پاسخ API expose می‌کند"],
production:"طراحی صحیح Serializer و کنترل دقیق fields/read_only_fields مستقیماً بر امنیت و سطح دادهٔ افشاشدهٔ API تأثیر دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ساخت Serializer و ViewSet در DRF را با یک مثال واقعی (سیستم سفارش) آموزش بده، شامل اعتبارسنجی سفارشی، و به من بگو چه زمانی نباید از ModelViewSet استفاده کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"drf-auth-throttling",title:"احراز هویت، Permission و Throttling در DRF",level:"Advanced",minLadder:3,prereqs:["drf-serializers-viewsets"],
short:"چگونه دسترسی به API را کنترل و از سوءاستفاده (Abuse) با محدودسازی نرخ جلوگیری کنیم.",
deep:"DRF چند مکانیزم احراز هویت پیش‌فرض دارد: SessionAuthentication (مناسب برای کلاینت‌های مرورگری با Cookie)، TokenAuthentication (توکن ساده در هدر) و پشتیبانی از JWT از طریق کتابخانه‌های شخص ثالث مثل djangorestframework-simplejwt. Permission Classes (مثل IsAuthenticated، IsAdminUser یا Permission سفارشی) بعد از احراز هویت بررسی می‌کنند کاربر احرازشده اجازهٔ انجام عملیات را دارد یا نه — تفاوت کلیدی Authentication (شما کی هستید) و Authorization (شما اجازهٔ چه کاری دارید) باید همیشه واضح باشد. Throttling با محدود کردن تعداد درخواست در بازهٔ زمانی (مثلاً ۱۰۰ درخواست در دقیقه به ازای هر کاربر) از سوءاستفاده و DoS ساده جلوگیری می‌کند؛ DRF این را با Throttle Classes (AnonRateThrottle، UserRateThrottle) پیاده می‌کند که معمولاً از یک Cache (Redis) برای شمارش استفاده می‌کنند. برای APIهای حساس (مثل ورود یا پرداخت)، Throttling سخت‌گیرانه‌تر (مثلاً ۵ تلاش در دقیقه) لازم است تا حملات Brute-force را کند کند.",
objectives:["پیاده‌سازی JWT authentication در DRF","تنظیم Throttling برای جلوگیری از Brute-force"],
example:"REST_FRAMEWORK = {\n  'DEFAULT_THROTTLE_CLASSES': ['rest_framework.throttling.UserRateThrottle'],\n  'DEFAULT_THROTTLE_RATES': {'user': '100/minute', 'login': '5/minute'}\n}",
py:"from rest_framework.throttling import SimpleRateThrottle\n\nclass LoginRateThrottle(SimpleRateThrottle):\n    scope = 'login'\n    def get_cache_key(self, request, view):\n        ip = self.get_ident(request)\n        return self.cache_format % {'scope': self.scope, 'ident': ip}",
exercise:"یک Throttle سفارشی برای endpoint ورود بسازید که بعد از ۵ تلاش ناموفق در یک دقیقه، درخواست‌های بعدی از همان IP را با کد 429 رد کند.",
project:"", resources:[{t:"DRF docs - Authentication",u:"https://www.django-rest-framework.org/api-guide/authentication/"},{t:"DRF docs - Throttling",u:"https://www.django-rest-framework.org/api-guide/throttling/"},{t:"django-rest-framework-simplejwt",u:"https://django-rest-framework-simplejwt.readthedocs.io/"}],
criteria:"می‌توانید یک endpoint ورود با Throttling سفارشی بسازید که در برابر حملات Brute-force مقاوم باشد.",
interview:["تفاوت Authentication و Authorization چیست؟","Throttling چگونه در سطح توزیع‌شده (چند سرور) پیاده می‌شود؟"],
mistakes:["پیاده‌سازی Throttling با شمارندهٔ درون‌حافظه‌ای (in-memory) که در معماری چندسروری هرکدام مستقل می‌شمارند و محدودیت واقعی اعمال نمی‌شود"],
production:"در معماری چندسروری، Throttling باید از یک Store مشترک (Redis) استفاده کند وگرنه هر سرور به‌طور مستقل محدودیت را اعمال می‌کند و محدودیت واقعی چند برابر می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. احراز هویت (Session/Token/JWT)، Permission و Throttling در DRF را توضیح بده، سپس یک سناریوی حملهٔ Brute-force به endpoint ورود بده تا با Throttle سفارشی مبتنی بر Redis آن را دفع کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p15",num:15,title:"مبانی دیتابیس",icon:"🗄️",summary:"نظریهٔ رابطه‌ای، نرمال‌سازی و SQL پیشرفته.",
topics:[
{id:"db-relational-modeling",title:"مدل‌سازی رابطه‌ای: ER، کلیدها/محدودیت‌ها و انواع JOIN",level:"Beginner",minLadder:1,prereqs:[],
short:"چگونه موجودیت‌ها و رابطه‌هایشان را در جدول‌های رابطه‌ای مدل کنیم و SQL چگونه دقیقاً این مدل را پیاده می‌کند.",
deep:"مدل‌سازی رابطه‌ای با شناسایی Entity ها (مثلاً Customer، Order) و رابطه‌هایشان (یک-به-یک، یک-به-چند، چند-به-چند) شروع می‌شود؛ نمودار ER (Entity-Relationship) این را پیش از نوشتن هیچ SQL‌ای مشخص می‌کند. کلید اصلی (Primary Key) هر ردیف را یکتا شناسایی می‌کند و کلید خارجی (Foreign Key) یک رابطه بین دو جدول را در سطح دیتابیس، نه فقط در کد اپلیکیشن، اجرا (Enforce) می‌کند — یعنی دیتابیس خودش جلوی درج یک سفارش با customer_id نامعتبر را می‌گیرد، حتی اگر یک باگ در کد اپلیکیشن این چک را فراموش کرده باشد؛ محدودیت‌های UNIQUE و CHECK به همین شکل، فارغ از این‌که اپلیکیشن چه زبانی نوشته شده، تضمین سطح دیتابیسی می‌دهند. انواع JOIN دقیقاً عملیات جبر رابطه‌ای (Relational Algebra) را پیاده می‌کنند: INNER JOIN فقط ردیف‌های منطبق در هر دو جدول را برمی‌گرداند، LEFT/RIGHT JOIN تمام ردیف‌های یک طرف را حتی بدون تطابق حفظ می‌کند (با NULL برای طرف دیگر)، FULL JOIN هر دو را حفظ می‌کند، و Self-Join یک جدول را با خودش JOIN می‌کند (مثلاً پیدا کردن مدیر مستقیم هر کارمند از همان جدول Employee). SQL در واقع یک زبان اعلانی (Declarative) برای بیان عملیات جبر رابطه‌ای (Selection = WHERE، Projection = SELECT columns، Join = JOIN) است، نه یک زبان دستوری که مرحله‌به‌مرحلهٔ اجرا را مشخص کند — همین موضوع به Query Planner اجازه می‌دهد استراتژی اجرای بهینه را خودش انتخاب کند.",
objectives:["ترسیم یک نمودار ER ساده برای یک دامنهٔ واقعی (مثلاً سفارش/مشتری/محصول)","تشخیص این‌که یک محدودیت باید در سطح دیتابیس (FK/UNIQUE/CHECK) اجرا شود نه فقط در اپلیکیشن"],
example:"جدول Order با ستون customer_id به‌عنوان FOREIGN KEY به Customer(id): تلاش برای درج سفارشی با customer_id=9999 که وجود ندارد، توسط خود دیتابیس رد می‌شود، حتی اگر ولیدیشن اپلیکیشن این را چک نکرده باشد.",
py:"", exercise:"برای یک دامنهٔ کوچک (مثلاً کتابخانه: کتاب/نویسنده/امانت) نمودار ER بکشید، سپس آن را با CREATE TABLE و محدودیت‌های PK/FK/UNIQUE/CHECK در SQL پیاده کنید و چهار نوع JOIN را روی آن اجرا کنید.",
project:"", resources:[{t:"PostgreSQL Tutorial - Joins",u:"https://www.postgresqltutorial.com/postgresql-tutorial/postgresql-joins/"},{t:"CMU Database Systems - Relational Model (رایگان)",u:"https://www.youtube.com/@cmudatabasegroup"},{t:"PostgreSQL docs - Constraints",u:"https://www.postgresql.org/docs/current/ddl-constraints.html"}],
criteria:"می‌توانید برای یک دامنهٔ جدید، جدول‌ها و محدودیت‌های آن را طوری طراحی کنید که خود دیتابیس (نه فقط اپلیکیشن) از نقض قوانین پایه جلوگیری کند.",
interview:["تفاوت INNER JOIN و LEFT JOIN چیست و کِی هرکدام را انتخاب می‌کنید؟","چرا محدودیت FOREIGN KEY را در سطح دیتابیس تعریف می‌کنیم وقتی اپلیکیشن هم می‌تواند آن را چک کند؟"],
mistakes:["حذف محدودیت‌های FK/UNIQUE با این فرض که 'اپلیکیشن مراقب است' که در عمل با باگ یا دسترسی مستقیم به دیتابیس نقض می‌شود"],
production:"در سیستم‌های واقعی، محدودیت‌های سطح دیتابیس آخرین خط دفاعی در برابر داده‌های ناسازگارند، حتی وقتی چند سرویس/اسکریپت مختلف مستقیماً به همان دیتابیس می‌نویسند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدل‌سازی ER و انواع JOIN را با یک دامنهٔ واقعی (مثلاً سفارش/مشتری) آموزش بده، از من بخواه نمودار ER بکشم و آن را به SQL با محدودیت‌های مناسب تبدیل کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"db-normalization",title:"نرمال‌سازی (1NF تا BCNF) و دنرمال‌سازی آگاهانه",level:"Intermediate",minLadder:2,prereqs:["ds-btree","db-relational-modeling"],
short:"چگونه طراحی جدول‌ها افزونگی داده و ناسازگاری را کاهش می‌دهد، و چه زمانی عمداً آن را نقض می‌کنیم.",
deep:"1NF می‌گوید هر ستون باید مقدار اتمی (نه لیست/آرایه) داشته باشد. 2NF می‌گوید هر ستون غیرکلیدی باید کاملاً به کل کلید اصلی وابسته باشد (نه فقط بخشی از یک کلید مرکب). 3NF می‌گوید نباید وابستگی گذرا (transitive dependency) بین ستون‌های غیرکلیدی وجود داشته باشد (مثلاً ذخیرهٔ نام شهر در جدول کاربر وقتی کد پستی از قبل شهر را مشخص می‌کند). BCNF نسخهٔ سخت‌گیرانه‌تر 3NF است. هدف نرمال‌سازی، حذف Update/Insert/Delete Anomalies است: مثلاً اگر نام یک محصول در ۱۰۰۰ ردیف سفارش تکرار شده باشد، تغییر نامش نیازمند ۱۰۰۰ آپدیت است و احتمال ناسازگاری بالا می‌رود. اما نرمال‌سازی کامل هزینهٔ خودش را دارد: کوئری‌ها نیازمند JOINهای بیشتر می‌شوند که در سیستم‌های Read-heavy با حجم بالا می‌تواند کند باشد؛ به همین دلیل دنرمال‌سازی آگاهانه (مثلاً نگه‌داشتن یک ستون total_amount محاسبه‌شده در جدول سفارش به‌جای محاسبهٔ همیشگی از رکوردهای آیتم) یک تصمیم مهندسی رایج برای بهبود عملکرد خواندن است، به قیمت پیچیدگی بیشتر در نگه‌داشتن سازگاری.",
objectives:["تشخیص نقض 1NF/2NF/3NF در یک طرح جدول","توضیح مصالحهٔ نرمال‌سازی در برابر عملکرد خواندن"],
example:"جدولی با ستون‌های order_id, product_name, product_price که در هر سفارش تکرار می‌شوند، 2NF را نقض می‌کند؛ باید به جدول Product جداگانه با ForeignKey تجزیه شود.",
py:"", exercise:"یک طرح جدول غیرنرمال (با تکرار داده) طراحی کنید، ناهنجاری‌های Update/Insert/Delete آن را شناسایی کنید و آن را تا 3NF نرمال‌سازی کنید.",
project:"", resources:[{t:"PostgreSQL Tutorial - Normalization",u:"https://www.postgresqltutorial.com/postgresql-tutorial/postgresql-normalization/"},{t:"CMU Database Systems (رایگان، YouTube playlist)",u:"https://www.youtube.com/@cmudatabasegroup"}],
criteria:"می‌توانید یک طرح جدول با ناهنجاری‌های آپدیت را شناسایی و تا سطح 3NF نرمال‌سازی کنید، و توضیح دهید چه زمانی عمداً دنرمال می‌کنید.",
interview:["تفاوت 2NF و 3NF چیست؟","چه زمانی دنرمال‌سازی آگاهانه توجیه‌پذیر است؟"],
mistakes:["دنرمال‌سازی زودهنگام بدون داشتن مشکل واقعی عملکرد (Premature Optimization)"],
production:"ستون‌های محاسبه‌شده و کش‌شده (مثل total_amount یا follower_count) در سیستم‌های بزرگ رایج‌اند اما نیازمند مکانیزم دقیق برای حفظ سازگاری (مثل Trigger یا به‌روزرسانی تراکنشی) هستند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. نرمال‌سازی (1NF تا 3NF) را با مثال یک سیستم سفارش واقعی توضیح بده، از من بخواه یک طرح جدول غیرنرمال را نرمال‌سازی کنم، و بعد یک سناریوی عملکردی بده که در آن دنرمال‌سازی آگاهانه توجیه‌پذیر است. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p16",num:16,title:"داخلی دیتابیس",icon:"⚙️",summary:"Query Planner، انواع ایندکس، اسکن‌ها و اتصال (Join) داخلی.",
topics:[
{id:"db-query-planner",title:"Query Planner، EXPLAIN و انتخاب استراتژی اجرا",level:"Advanced",minLadder:3,prereqs:["db-normalization","ds-btree"],
short:"چگونه دیتابیس تصمیم می‌گیرد یک کوئری را چگونه اجرا کند و چگونه این تصمیم را با EXPLAIN بخوانیم.",
deep:"وقتی یک کوئری SQL می‌رسد، ابتدا Parser آن را به یک درخت نحوی تبدیل می‌کند، سپس Query Planner/Optimizer چندین استراتژی اجرای ممکن (مثلاً استفاده از ایندکس یا Sequential Scan، ترتیب JOIN، الگوریتم JOIN) را بر اساس آمار جدول (Statistics مثل تعداد ردیف، توزیع مقادیر، Cardinality) ارزیابی می‌کند و ارزان‌ترین (Cost-based) را انتخاب می‌کند — این آمار با ANALYZE به‌روزرسانی می‌شود و اگر قدیمی باشد، Planner می‌تواند تصمیم بسیار بدی بگیرد (مثلاً Sequential Scan روی جدولی که ایندکس مناسب دارد). EXPLAIN برنامهٔ اجرای انتخاب‌شده را نشان می‌دهد بدون اجرای واقعی؛ EXPLAIN ANALYZE کوئری را واقعاً اجرا می‌کند و زمان واقعی هر مرحله را هم نشان می‌دهد، که برای یافتن تفاوت بین تخمین Planner و واقعیت حیاتی است (مثلاً وقتی rows=10 تخمین زده شده اما rows=500000 واقعی برگشته، یعنی آمار قدیمی است). Selectivity (نسبت ردیف‌های برگشتی به کل جدول) تعیین می‌کند آیا ایندکس مفید است: برای ستونی با فقط دو مقدار ممکن (مثل is_active)، ایندکس معمولاً کمکی نمی‌کند چون Selectivity پایین است.",
objectives:["خواندن خروجی EXPLAIN ANALYZE و تشخیص Seq Scan در برابر Index Scan","توضیح چرا آمار قدیمی (stale statistics) Query Planner را گمراه می‌کند"],
example:"EXPLAIN ANALYZE SELECT * FROM orders WHERE customer_id = 42; اگر خروجی 'Seq Scan on orders' نشان دهد در حالی که ایندکس روی customer_id وجود دارد، احتمالاً آمار قدیمی است یا Selectivity پایین است.",
py:"", exercise:"یک جدول با یک میلیون ردیف در PostgreSQL بسازید، بدون ایندکس یک فیلتر اجرا کنید و زمان را با EXPLAIN ANALYZE ببینید، سپس ایندکس اضافه کرده و تفاوت را مشاهده کنید.",
project:"", resources:[{t:"PostgreSQL docs - Using EXPLAIN",u:"https://www.postgresql.org/docs/current/using-explain.html"},{t:"Use The Index, Luke!",u:"https://use-the-index-luke.com/"},{t:"CMU Database Systems - Query Optimization (رایگان)",u:"https://www.youtube.com/@cmudatabasegroup"}],
criteria:"می‌توانید یک کوئری کند را با EXPLAIN ANALYZE تحلیل کنید، علت کندی (Seq Scan نامناسب، Join ناکارآمد) را پیدا و رفع کنید.",
interview:["Query Planner چگونه بین Seq Scan و Index Scan تصمیم می‌گیرد؟","چرا EXPLAIN ANALYZE گاهی نشان می‌دهد تخمین Planner با واقعیت فرق دارد؟"],
mistakes:["فراموش کردن اجرای ANALYZE بعد از درج حجم زیاد داده که آمار جدول را قدیمی نگه می‌دارد"],
production:"کوئری‌های کند در تولید تقریباً همیشه با EXPLAIN ANALYZE قابل تشخیص‌اند؛ این اولین ابزار هر SRE/DBA برای دیباگ کندی دیتابیس است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مکانیزم Query Planner در PostgreSQL و نحوهٔ خواندن EXPLAIN ANALYZE را عمیق آموزش بده. یک جدول بزرگ و چند کوئری کند طراحی کن که من با EXPLAIN تحلیل و بهینه‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"db-index-types-joins",title:"انواع ایندکس (Partial، GiST، GIN، BRIN) و الگوریتم‌های JOIN",level:"Advanced",minLadder:3,prereqs:["db-query-planner"],
short:"چرا B-Tree تنها نوع ایندکس نیست، و Query Planner چگونه بین Nested Loop، Hash Join و Merge Join یکی را انتخاب می‌کند.",
deep:"B-Tree ایندکس پیش‌فرض و همه‌کاره است اما همیشه بهینه نیست: Partial Index فقط زیرمجموعه‌ای از ردیف‌ها را ایندکس می‌کند (مثلاً WHERE status = 'pending')، که برای جدولی با اکثریت ردیف‌های 'انجام‌شده' و کوئری‌های مکرر روی چند ردیف 'در انتظار'، حجم ایندکس را به‌شدت کاهش می‌دهد. Covering Index (یا Index-Only Scan) وقتی همهٔ ستون‌های مورد نیاز کوئری در خود ایندکس موجودند، دیتابیس را از رفتن سراغ جدول اصلی (Heap) بی‌نیاز می‌کند. GiST برای داده‌های هندسی/بازه‌ای (مثل محدودهٔ تاریخ یا داده‌های جغرافیایی) طراحی شده، GIN برای مقادیر چندگانه در یک ستون (Full-Text Search، آرایه، JSONB) بهینه است چون هر مقدار داخل ستون را جدا ایندکس می‌کند، و BRIN برای جدول‌های بسیار بزرگ که داده به‌ترتیب درج (مثلاً بر اساس زمان) همبستگی فیزیکی دارد، فقط محدودهٔ بلوک‌های دیسک را نگه می‌دارد و حجمی به‌مراتب کوچک‌تر از B-Tree دارد. برای اجرای JOIN، Planner از میان سه الگوریتم انتخاب می‌کند: Nested Loop (برای هر ردیف طرف بیرونی، جدول داخلی را می‌گردد؛ وقتی مجموعهٔ بیرونی کوچک و روی طرف داخلی ایندکس مناسب هست، سریع‌ترین است)، Hash Join (یک Hash Table از مجموعهٔ کوچک‌تر می‌سازد و طرف دیگر را با آن مچ می‌کند؛ برای دو مجموعهٔ نسبتاً بزرگ و بدون ایندکس مناسب، معمولاً بهتر است)، و Merge Join (وقتی هر دو طرف از قبل بر اساس کلید JOIN مرتب‌اند یا ایندکسی که این ترتیب را می‌دهد وجود دارد، با یک پیمایش خطی هم‌زمان ادغام می‌شوند).",
objectives:["انتخاب نوع ایندکس مناسب برای یک الگوی کوئری مشخص (Partial/GIN/BRIN)","تفسیر این‌که چرا Planner در EXPLAIN یک Hash Join را به Nested Loop ترجیح داده"],
example:"CREATE INDEX idx_pending ON orders (created_at) WHERE status = 'pending'; — یک Partial Index که فقط سفارش‌های در انتظار را ایندکس می‌کند، نه کل جدول.",
py:"", exercise:"روی یک جدول بزرگ با ستون JSONB، یک‌بار بدون ایندکس و یک‌بار با ایندکس GIN یک کوئری فیلتر روی آن ستون اجرا کنید و زمان اجرا را با EXPLAIN ANALYZE مقایسه کنید.",
project:"", resources:[{t:"PostgreSQL docs - Index Types",u:"https://www.postgresql.org/docs/current/indexes-types.html"},{t:"Use The Index, Luke! - Join Algorithms",u:"https://use-the-index-luke.com/sql/join"},{t:"CMU Database Systems - Joins (رایگان)",u:"https://www.youtube.com/@cmudatabasegroup"}],
criteria:"می‌توانید برای سه الگوی متفاوت کوئری (فیلتر روی زیرمجموعهٔ کوچک، جست‌وجوی متن کامل، جدول بسیار بزرگ به‌ترتیب زمان) نوع ایندکس مناسب را توجیه کنید.",
interview:["چه زمانی GIN را به B-Tree ترجیح می‌دهید؟","Planner چگونه بین Hash Join و Merge Join تصمیم می‌گیرد؟"],
mistakes:["ساخت ایندکس B-Tree روی یک ستون JSONB یا آرایه به‌جای GIN که عملاً هیچ کمکی به کوئری‌های داخل آن ستون نمی‌کند"],
production:"انتخاب نادرست نوع ایندکس (مثلاً B-Tree روی ستون Full-Text) یکی از رایج‌ترین دلایل کوئری‌های کند در جدول‌های بزرگ تولیدی است که با تغییر نوع ایندکس، نه بازنویسی کوئری، حل می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. انواع ایندکس (Partial، Covering، GiST، GIN، BRIN) و الگوریتم‌های JOIN (Nested Loop/Hash/Merge) را با مثال EXPLAIN واقعی آموزش بده و چند سناریوی کوئری بده تا نوع ایندکس مناسب را انتخاب کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p17",num:17,title:"تراکنش و همروندی دیتابیس",icon:"🔒",summary:"ACID، سطوح Isolation، قفل‌ها و MVCC.",
topics:[
{id:"db-acid-isolation",title:"ACID و سطوح Isolation (Dirty Read، Phantom Read)",level:"Advanced",minLadder:3,prereqs:["db-query-planner","concurrency-primitives"],
short:"تراکنش‌ها چگونه سازگاری داده را در برابر همروندی و خطا تضمین می‌کنند.",
