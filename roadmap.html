{id:"project-l2",title:"پروژه سطح دو: کاتالوگ جست‌وجو + صف رزرو با کش",level:"Beginner",minLadder:2,prereqs:["project-l1","ladder-se2"],
short:"فیچر مستقل کامل: جست‌وجوی کاتالوگ کتاب با فیلتر/صفحه‌بندی/کش Redis، به‌علاوهٔ صف رزرو FIFO برای کتاب‌های ناموجود، روی همان سامانهٔ کتابخانه.",
deep:"روی سامانهٔ همان L1 (که حالا مدل Loan را دارد)، این دو قابلیت مستقل را دقیقاً به این شکل اضافه کنید:\n۱) GET /api/books/?q=&author=&available_only=&page= : جست‌وجوی متنی روی title/author (icontains) به‌همراه فیلتر available_only=true (فقط کتاب‌هایی که available_copies>0)، با صفحه‌بندی PageNumberPagination (۲۰ آیتم در صفحه). نتیجهٔ هر ترکیب پارامتر باید در Redis با کلید قطعی (hash مرتب‌شدهٔ پارامترها) و TTL=۳۰۰ ثانیه کش شود.\n۲) هر بار که Loan ساخته یا برگردانده می‌شود (یعنی available_copies تغییر می‌کند)، تمام کلیدهای کش مرتبط با آن کتاب باید Invalidate شوند - نه با پاک‌کردن کل کش، بلکه با نگه‌داشتن یک نسخه (version) سراسری کاتالوگ در Redis که در کلید کش لحاظ می‌شود و با هر تغییر موجودی یک واحد افزایش می‌یابد (Cache Versioning).\n۳) مدل Reservation(id, book FK, member FK, requested_at, status[waiting|ready|expired|fulfilled], expires_at nullable): وقتی عضوی می‌خواهد کتابی را که available_copies=0 است امانت بگیرد، به‌جای ۴۰۹ باید بتواند POST /api/reservations/ بزند و در صف FIFO آن کتاب قرار بگیرد (ترتیب بر اساس requested_at).\n۴) وقتی یک نسخه از آن کتاب برگردانده می‌شود (endpoint بازگشت L1)، باید اولین Reservation با status=waiting برای آن کتاب به status=ready تغییر کند و expires_at آن now+۴۸ساعت شود؛ کتاب هنوز به available_copies برنمی‌گردد بلکه برای همان عضو 'نگه داشته' می‌شود (کسر مجدد از available_copies برای این عضو). اگر عضو تا expires_at اقدام به امانت نکند، یک Job زمان‌بندی‌شده باید status را expired کند، available_copies را واقعاً افزایش دهد، و نوبت را به نفر بعدی صف بدهد.\n۵) نسخه‌بندی API: GET /api/v2/books/{id}/ باید فیلد اضافهٔ queue_length (تعداد Reservation های waiting) را هم برگرداند، بدون شکستن پاسخ v1 موجود.\nچون در L2 انتظار می‌رود عضوی با استقلال کاری بیشتر، فیدبک مستقیم و قابل‌اجرا به هم‌تیمی‌ها بدهد، بخشی از تحویل این پروژه، انجام یک Code Review مکتوب روی PR فیچر L1 (که قبلاً نوشته‌اید) با حداقل دو بازخورد واقعی است.",
objectives:["پیاده‌سازی جست‌وجو/فیلتر/صفحه‌بندی کاتالوگ با کش Redis و Cache Versioning (نه TTL تنها)","پیاده‌سازی صف رزرو FIFO با انتقال صف (waiting→ready) هنگام بازگشت کتاب","پیاده‌سازی انقضای خودکار hold ۴۸ساعته و انتقال نوبت به نفر بعدی","افزودن v2 با فیلد queue_length بدون شکستن Contract v1"],
example:"دو عضو پشت‌سرهم برای یک کتاب ناموجود رزرو می‌کنند؛ وقتی یک نسخه برمی‌گردد، فقط عضو اول status=ready می‌گیرد و ۴۸ ساعت فرصت دارد؛ اگر اقدام نکند، عضو دوم ready می‌شود نه اینکه هر دو هم‌زمان بتوانند کتاب را بردارند.",
py:"import hashlib, json\n\ndef cache_key(params: dict, catalog_version: int) -> str:\n    raw = json.dumps(params, sort_keys=True)\n    return f'books:v{catalog_version}:' + hashlib.sha256(raw.encode()).hexdigest()\n\ndef bump_catalog_version():\n    redis_client.incr('books:catalog_version')  # هر تغییر موجودی این را صدا می‌زند؛ کلیدهای قدیمی خودبه‌خود بی‌اثر می‌شوند",
exercise:"با اندازه‌گیری زمان پاسخ نشان دهید Cache Hit حداقل ۵ برابر سریع‌تر از Cache Miss است؛ سپس یک Loan جدید بسازید و نشان دهید نتیجهٔ جست‌وجوی available_only=true بلافاصله (بدون صبر برای TTL) به‌روز است چون نسخهٔ کاتالوگ عوض شده.",
project:"جست‌وجوی کاتالوگ با کش نسخه‌دار Redis + صف رزرو FIFO با hold ۴۸ساعته و انقضای خودکار + v2 سازگار با گذشته، به‌همراه Code Review مکتوب روی PR فیچر L1.",
resources:[{t:"Redis - Caching Patterns",u:"https://redis.io/docs/latest/develop/use/patterns/"},{t:"DRF - Pagination",u:"https://www.django-rest-framework.org/api-guide/pagination/"},{t:"Celery Periodic Tasks (برای انقضای hold)",u:"https://docs.celeryq.dev/en/stable/userguide/periodic-tasks.html"}],
criteria:"کش با Cache Versioning پیاده شده و بلافاصله بعد از تغییر موجودی داده‌ی تازه برمی‌گرداند (نه بعد از انقضای TTL)؛ صف رزرو دقیقاً یک نفر را در هر لحظه ready می‌کند؛ انقضای ۴۸ساعته و انتقال نوبت با تست پوشش داده شده؛ v2 فیلد جدید دارد بدون تغییر ساختار v1؛ Code Review مکتوب روی PR قبلی ثبت شده.",
interview:["چرا TTL به‌تنهایی برای Invalidation این کش کافی نیست؟","اگر دو عضو هم‌زمان بخواهند اولین نفر صف شوند، چطور از Race Condition جلوگیری می‌کنید؟"],
mistakes:["پاک‌کردن کامل کش (cache.clear()) به‌جای Invalidation هدفمند که در مقیاس واقعی کارایی کش را نابود می‌کند","انتقال نوبت صف بدون قفل که می‌تواند دو نفر را هم‌زمان ready کند"],
production:"این مقیاس دقیقاً همان 'راهکار مؤثر برای فیچرهای پروداکت با اونرشیپ روی فضای مسئلهٔ کوچک' است که از L2 انتظار می‌رود.",
ai:"در نقش یک Senior Engineer که استقلال بیشتری به من داده رفتار کن. فقط صورت‌مسئلهٔ کلی (کش نسخه‌دار + صف رزرو) را تأیید کن و بگذار خودم طراحی کنم؛ وقتی طراحی Cache Versioning یا مدیریت هم‌زمانی صف را ارائه دادم، فقط با سؤال چالشی راهنمایی کن نه با دادن مستقیم جواب. در پایان روی Code Review مکتوبی که برای PR فیچر L1 نوشته‌ام هم بازخورد بده که آیا بازخوردهایم واقعاً قابل‌اجرا و مشخص بوده‌اند یا کلی و مبهم."},

{id:"project-l3",title:"پروژه سطح سه: سرویس مستقل کتابخانه با جریمه، امنیت و استقرار کامل",level:"Intermediate",minLadder:3,prereqs:["project-l2","ladder-se3"],
short:"مالکیت کامل SDLC: تبدیل کد فعلی به یک سرویس مستقل کتابخانه با محاسبهٔ جریمهٔ دیرکرد async، تعلیق عضویت، محافظت امنیتی، و استقرار کامل Docker با Design Doc.",
deep:"سرویس L1+L2 را به یک سرویس مستقل و آمادهٔ پروداکشن تبدیل کنید؛ الزامات دقیق:\n۱) مدل Fine(id, loan FK, amount_cents, calculated_at, paid_at nullable). یک Celery beat task روزانه (calculate_daily_fines) که روی تمام Loan هایی با due_at < امروز و returned_at is null اجرا می‌شود: برای هر روز تأخیر ۵۰ سنت جریمه اضافه می‌کند تا سقف ۲۰۰۰ سنت (۲۰ دلار) به‌ازای هر Loan؛ این Job باید Idempotent باشد (اجرای دوباره برای همان روز جریمهٔ تکراری نسازد - از یک ستون unique (loan_id, date) روی جدول Fine کمک بگیرید).\n۲) قانون تعلیق: اگر مجموع amount_cents پرداخت‌نشدهٔ یک عضو از ۵۰۰۰ سنت (۵۰ دلار) بگذرد، membership_status عضو باید خودکار suspended شود و تلاش برای POST /api/loans/ جدید باید ۴۰۳ با پیام 'عضویت به‌دلیل جریمهٔ معوق تعلیق شده' برگرداند.\n۳) امنیت: (الف) Rate Limiting روی POST /api/loans/ محدود به ۵ درخواست در دقیقه به‌ازای هر عضو (جلوگیری از انباشت خودکار امانت با اسکریپت)، (ب) اعتبارسنجی فرمت ISBN در ایجاد/ویرایش کتاب با چک‌سام واقعی ISBN-13 (نه فقط طول رشته)، (ج) اطمینان از این‌که یک عضو معمولی (non-staff) نمی‌تواند لیست کامل اعضای دیگر یا جزئیات جریمهٔ آن‌ها را از طریق GET /api/fines/ ببیند مگر جریمهٔ خودش (بستن IDOR در سطح Object).\n۴) کل سرویس باید Containerized شود: Dockerfile چندمرحله‌ای (build layer جدا از runtime) برای Django app، و docker-compose.yml شامل Postgres، Redis، Celery worker، Celery beat و web در یک شبکهٔ مشترک، با یک دستور واحد (docker compose up) که کل سرویس را بالا می‌آورد.\n۵) یک Design Doc کوتاه (یک تا دو صفحه) بنویسید که این تصمیم‌ها را با Trade-off مستند کند: چرا جریمه به‌صورت async روزانه محاسبه می‌شود نه real-time در لحظهٔ هر درخواست؛ چرا سقف جریمه و آستانهٔ تعلیق همین اعداد انتخاب شده و چطور در آینده قابل تنظیم می‌شوند؛ و ریسک اصلی این طراحی (مثلاً 'اگر Celery beat یک روز اجرا نشود، جریمهٔ آن روز برای همیشه گم می‌شود مگر Backfill دستی شود') را صریح توضیح دهد.",
objectives:["پیاده‌سازی محاسبهٔ جریمهٔ روزانهٔ Idempotent با Celery beat و سقف مشخص","پیاده‌سازی تعلیق خودکار عضویت بالای آستانهٔ ۵۰۰۰ سنت و مسدودسازی امانت جدید","بستن سه حفرهٔ امنیتی مشخص: Rate Limiting، اعتبارسنجی ISBN-13 واقعی، IDOR در فهرست جریمه‌ها","Containerize کامل با Dockerfile چندمرحله‌ای و docker-compose تک‌دستوره","نوشتن Design Doc با Trade-off صریح دربارهٔ async بودن جریمه و ریسک از‌دست‌رفتن اجرای روزانه"],
example:"عضوی ۱۰ روز کتابی را دیر برمی‌گرداند: جریمه ۱۰×۵۰=۵۰۰ سنت محاسبه می‌شود (زیر سقف ۲۰۰۰)؛ اگر همان عضو سه امانت دیگر هم هرکدام ۱۵ روز دیر شوند و مجموع جریمه‌های پرداخت‌نشده از ۵۰۰۰ سنت بگذرد، عضویتش خودکار suspended می‌شود و امانت جدید ۴۰۳ می‌گیرد.",
py:"@app.task\ndef calculate_daily_fines():\n    today = timezone.now().date()\n    overdue = Loan.objects.filter(returned_at__isnull=True, due_at__lt=timezone.now())\n    for loan in overdue:\n        _, created = Fine.objects.get_or_create(loan=loan, date=today, defaults={'amount_cents': 50})\n        if not created:\n            continue\n        total = Fine.objects.filter(loan__member=loan.member, paid_at__isnull=True).aggregate(s=Sum('amount_cents'))['s'] or 0\n        capped = min(total, 2000)\n        if total >= 5000:\n            Member.objects.filter(id=loan.member_id).update(membership_status='suspended')",
exercise:"اجرای calculate_daily_fines را دوبار پشت‌سرهم برای همان روز اجرا کنید و نشان دهید جریمهٔ دوم ساخته نمی‌شود (Idempotency)؛ سپس تست بار (locust یا hey) روی POST /api/loans/ اجرا کنید و نشان دهید Rate Limiting دقیقاً بعد از ۵ درخواست در دقیقه، ۴۲۹ برمی‌گرداند.",
project:"سرویس مستقل کتابخانه با جریمهٔ دیرکرد async و Idempotent، تعلیق خودکار عضویت، سه محافظت امنیتی مشخص، Docker Compose تک‌دستوره، و Design Doc با Trade-off صریح.",
resources:[{t:"Celery - Periodic Tasks",u:"https://docs.celeryq.dev/en/stable/userguide/periodic-tasks.html"},{t:"DRF Throttling",u:"https://www.django-rest-framework.org/api-guide/throttling/"},{t:"Docker - Multi-stage builds",u:"https://docs.docker.com/build/building/multi-stage/"}],
criteria:"اجرای دوگانهٔ Job روزانه جریمهٔ تکراری نمی‌سازد، آستانهٔ تعلیق ۵۰۰۰ سنت دقیقاً و خودکار عضویت را می‌بندد، هر سه محافظت امنیتی با تست مشخص اثبات شده‌اند، docker compose up کل سیستم را بدون خطا بالا می‌آورد، و Design Doc ریسک اصلی طراحی (گم‌شدن اجرای روزانه) را با راه Backfill توضیح می‌دهد.",
interview:["چرا جریمه را real-time در لحظهٔ هر درخواست GET محاسبه نکردید؟","اگر Celery beat یک روز کامل از کار بیفتد، چطور بدون آسیب به داده جبرانش می‌کنید؟"],
mistakes:["محاسبهٔ جریمه بدون قید Idempotency که با هر اجرای دوبارهٔ Job جریمهٔ تکراری می‌سازد","نبود بررسی سطح Object روی /api/fines/ که به هر عضو اجازه می‌دهد جریمهٔ اعضای دیگر را ببیند"],
production:"این پروژه هم‌ارز 'مالکیت کامل چرخهٔ حیات یک پروژه یا فیچر با اندازهٔ متوسط' L3 است: از طراحی تا امنیت تا استقرار، به‌تنهایی و با کیفیتی که 'می‌شود روی آن حساب کرد'.",
ai:"در نقش یک Staff Engineer که به من اعتماد کامل برای اونرشیپ این سرویس داده، اما برای Design Review در دسترس است رفتار کن. قبل از کدنویسی، Design Doc من (به‌خصوص Trade-off async بودن جریمه) را نقد کن؛ بعد از پیاده‌سازی هر بخش امنیتی، مثل یک Security Review واقعی سؤال‌های سخت (مثلاً 'اگر عضو Rate Limit را با چند اکانت دور بزند چه؟') بپرس."},

{id:"project-l4",title:"پروژه سطح چهار: شبکهٔ چندشعبه‌ای کتابخانه با انتقال کتاب بین‌شعبه‌ای (Tech Lead)",level:"Advanced",minLadder:4,prereqs:["project-l3","ladder-se4"],
short:"پروژهٔ بزرگ در مقیاس یک OKR: تبدیل سرویس تک‌شعبه‌ای به سه سرویس مستقل (کاتالوگ، امانت، انتقال بین‌شعبه‌ای) با Saga، روی Kubernetes با CI/CD و SLO مشخص.",
deep:"سرویس L3 اکنون باید برای یک شبکهٔ چندشعبه‌ای (حداقل ۳ شعبه) بازطراحی شود؛ الزامات دقیق:\n۱) سه سرویس مستقل: Catalog Service (کاتالوگ سراسری، فقط خواندنی برای بقیه)، Branch Loan Service (هر شعبه موجودی و Loan های خودش را دارد - دقیقاً همان منطق L1-L3 اما به‌ازای هر شعبه)، و Transfer Service (درخواست انتقال کتاب بین شعبه‌ها).\n۲) سناریوی الزامی Transfer: عضو شعبهٔ A کتابی را می‌خواهد که فقط در شعبهٔ B موجود است. جریان دقیق: (الف) Transfer Service درخواست transfer.requested منتشر می‌کند، (ب) Branch Loan Service شعبهٔ B با دریافت آن، اگر موجودی داشته باشد یک نسخه را Reserve می‌کند و transfer.reserved منتشر می‌کند (وگرنه transfer.rejected)، (پ) Transfer Service وضعیت را in_transit می‌کند و بعد از تأیید دستی/شبیه‌سازی‌شدهٔ 'رسیدن بسته' (یک اندپوینت POST /api/transfers/{id}/arrived/) رویداد transfer.arrived منتشر می‌کند، (ت) Branch Loan Service شعبهٔ A با دریافت آن، Loan واقعی را برای عضو در شعبهٔ A می‌سازد. مسیر جبرانی الزامی: اگر شعبهٔ B قبل از ارسال اعلام کند کتاب آسیب‌دیده/گم‌شده (POST /api/transfers/{id}/cancel/)، باید transfer.cancelled منتشر شود، رزرو شعبهٔ B آزاد شود، و به عضو در شعبهٔ A اطلاع داده شود (Notification Service مصرف‌کننده) - این باید با تست واقعی اثبات شود، نه فقط مسیر خوشبینانه.\n۳) هر سه سرویس باید با Kubernetes Manifest (Deployment+Service+HPA) مستقر شوند، در یک پایپ‌لاین CI/CD واحد (build→test→deploy با Rolling Update) با health check قبل از تکمیل Deploy.\n۴) سه ستون Observability: متریک (نرخ موفقیت/شکست Transfer، تعداد Transfer در وضعیت in_transit)، لاگ ساختاریافته، و Trace توزیع‌شده که یک Transfer را از ابتدا تا انتها در هر سه سرویس ردیابی کند.\n۵) SLO مشخص برای Branch Loan Service: p99 زیر ۳۰۰ میلی‌ثانیه برای اندپوینت امانت، Error Rate زیر ۰٫۱٪، به‌همراه یک Runbook که دقیقاً بگوید هنگام تخطی از Error Budget چه اقدامی انجام شود.\n۶) یک سند Onboarding دقیق برای Transfer Service بنویسید که فرض می‌کند یک مهندس سطح ۲/۳ تازه‌وارد قرار است این سرویس را نگهداری کند - شامل نمودار جریان رویدادها، نحوهٔ دیباگ یک Transfer گیرکرده در in_transit، و لینک به Runbook.",
objectives:["پیاده‌سازی Saga (Choreography) کامل انتقال کتاب بین سه سرویس با مسیر جبرانی cancel تست‌شده","استقرار هر سه سرویس روی Kubernetes با Deployment/Service/HPA و پایپ‌لاین CI/CD یکپارچه با Rolling Update","پیاده‌سازی Trace توزیع‌شده‌ای که یک Transfer را در هر سه سرویس ردیابی کند","تعریف SLO عددی برای Branch Loan Service به‌همراه Runbook واکنش به تخطی از Error Budget","نوشتن سند Onboarding قابل‌فهم برای یک مهندس تازه‌وارد سطح ۲/۳"],
example:"رویداد transfer.requested با payload {transfer_id, book_id, from_branch, to_branch, member_id}؛ اگر شعبهٔ B قبل از ارسال، کتاب را آسیب‌دیده اعلام کند، Transfer Service باید وضعیت را cancelled کند و Notification Service پیام 'متاسفانه این کتاب دیگر در دسترس نیست، لطفاً کتاب جایگزین را از کاتالوگ انتخاب کنید' برای عضو بسازد - نه اینکه Transfer برای همیشه در in_transit بماند.",
py:"# Transfer Service - انتشار درخواست انتقال با Outbox\n@transaction.atomic\ndef request_transfer(book_id, from_branch, to_branch, member_id):\n    t = Transfer.objects.create(book_id=book_id, from_branch=from_branch, to_branch=to_branch, member_id=member_id, status='requested')\n    OutboxEvent.objects.create(topic='transfer.requested', payload={'transfer_id': t.id, 'book_id': book_id, 'to_branch': to_branch})\n    return t",
exercise:"سناریوی 'کتاب در شعبهٔ B آسیب‌دیده اعلام می‌شود درست قبل از ارسال' را عمداً اجرا کنید و با Trace توزیع‌شده نشان دهید عضو در شعبهٔ A پیام لغو را دریافت می‌کند و هیچ Loan نامعتبری ساخته نمی‌شود.",
project:"شبکهٔ سه‌سرویسی کتابخانه (کاتالوگ/امانت شعبه/انتقال) با Saga کامل شامل مسیر جبرانی، استقرار Kubernetes+CI/CD، Trace توزیع‌شده، SLO/Runbook و سند Onboarding.",
resources:[{t:"microservices-communication-gateway و resilience-patterns (فاز ۲۵ و ۲۹)",u:"#"},{t:"OpenTelemetry docs",u:"https://opentelemetry.io/docs/"},{t:"Google SRE Book - SLOs",u:"https://sre.google/sre-book/service-level-objectives/"}],
criteria:"مسیر جبرانی cancel با تست واقعی اثبات شده (نه فقط مسیر خوشبینانه)، Trace کامل یک Transfer در هر سه سرویس قابل مشاهده است، CI/CD به‌صورت خودکار با Rolling Update دیپلوی می‌کند، SLO/Runbook عددی و مکتوب است، و سند Onboarding به‌تنهایی برای شروع کار یک مهندس تازه‌وارد کافی است.",
interview:["چرا Choreography را به Orchestration ترجیح دادید (یا برعکس) برای این Saga؟","اگر Transfer Service بین انتشار transfer.reserved و دریافت آن توسط شعبهٔ A کرش کند، دقیقاً چه اتفاقی می‌افتد؟"],
mistakes:["پیاده‌سازی فقط مسیر خوشبینانهٔ Transfer بدون تست واقعی مسیر لغو/جبران","نبود Trace توزیع‌شده که دیباگ یک Transfer گیرکرده در in_transit را عملاً غیرممکن می‌کند"],
production:"این پروژه هم‌ارز 'رهبری دلیوری پروژه‌های بزرگ/پیچیده در مقیاس OKR' L4 است، با تمرکز مضاعف روی مستندسازی و آماده‌سازی دیگران برای نگهداری سیستم.",
ai:"در نقش یک Staff/Principal Engineer که پروژهٔ شبکهٔ چندشعبه‌ای را به یک Tech Lead سطح چهار سپرده رفتار کن. طراحی Saga من را با تمرکز ویژه روی مسیر جبرانی (نه فقط مسیر خوشبینانه) به چالش بکش؛ در پایان سند Onboarding من را از منظر 'آیا یک مهندس سطح دو واقعاً فقط با این سند می‌تواند یک Transfer گیرکرده را دیباگ کند؟' نقد کن."},

{id:"project-l5",title:"پروژه سطح پنج: مهاجرت به دفتر رویداد قابل‌ممیزی + دسترس‌پذیری دومنطقه‌ای (Senior Tech Lead)",level:"Advanced",minLadder:5,prereqs:["project-l4","ladder-se5"],
short:"ابتکار سطح دامین: مهاجرت بدون Downtime تاریخچهٔ Loan/Fine به یک دفتر رویدادمحور قابل‌ممیزی (الزام مقرراتی برای کنسرسیوم کتابخانه‌های عمومی) با HA دومنطقه‌ای و آزمایش Chaos.",
deep:"شبکهٔ کتابخانهٔ L4 اکنون توسط یک نهاد نظارتی ملزم شده تاریخچهٔ کامل هر حرکت کتاب و هر جریمه را به‌شکل غیرقابل‌تغییر و قابل‌ممیزی نگه دارد (نه فقط وضعیت فعلی در جدول Loan). الزامات دقیق:\n۱) طراحی و پیاده‌سازی EventStore(aggregate_id, sequence_no, event_type, payload, created_at) به‌عنوان منبع حقیقت برای هر Loan/Fine/Transfer؛ رویدادهایی مثل LoanCreated، LoanReturned، FineAssessed، MembershipSuspended باید به‌ترتیب و بدون گم‌شدن (با Transactional Outbox، مشابه L4) ثبت شوند.\n۲) یک Read Model جدا (LoanHistorySummary) بسازید که از مصرف همین رویدادها ساخته می‌شود و برای گزارش‌گیری نظارتی (چند کتاب در سال، توسط کدام عضو، با چند روز تأخیر) استفاده می‌شود - بدون فشار آوردن به جدول عملیاتی Loan.\n۳) این مهاجرت باید بدون Downtime و Backward-Compatible انجام شود: در طول انتقال، هر دو مسیر (نوشتن مستقیم قدیمی به جدول Loan و نوشتن رویدادمحور جدید به EventStore) هم‌زمان اجرا شوند (Dual-Write)، و یک Job شبانه نتیجهٔ دو مسیر را مقایسه کند (Shadow Read/Diff) تا پیش از قطع کامل مسیر قدیمی، عدم‌تطابق صفر باشد.\n۴) شبکهٔ کتابخانه باید در دو منطقه (Region) جغرافیایی مستقل مستقر شود (مثلاً دیتاسنتر اصلی و دیتاسنتر پشتیبان)؛ RPO (حداکثر داده‌ی قابل قبول برای از دست دادن) باید کمتر از ۵ دقیقه و RTO (زمان بازیابی) کمتر از ۱۵ دقیقه باشد - هر دو باید مستند و با آزمایش واقعی اثبات شوند.\n۵) حداقل یک آزمایش Chaos Engineering واقعی اجرا کنید: مثلاً قطع عمدی ارتباط EventStore منطقهٔ اصلی در حین بار واقعی، با فرضیهٔ از پیش نوشته‌شده ('انتظار داریم Failover به منطقهٔ دوم در کمتر از ۱۵ دقیقه رخ دهد و هیچ رویدادی گم نشود') و Blast Radius محدود (فقط روی محیط Staging یا یک زیرمجموعهٔ کوچک از شعب).\n۶) یک Roadmap افزایشی (نه Big Bang) بنویسید که این مهاجرت را به فازها تقسیم می‌کند (مثلاً فاز اول فقط Loan، فاز دوم Fine، فاز سوم Transfer) و ریسک/معیار موفقیت هر فاز را مشخص کند، به‌همراه تقسیم‌کار بین حداقل دو مهندس فرضی سطح ۳/۴ که هرکدام مالک یک فاز هستند.",
objectives:["پیاده‌سازی EventStore + Outbox برای Loan/Fine/Transfer بدون گم‌شدن رویداد","ساخت Read Model گزارش نظارتی جدا از مسیر عملیاتی","اجرای Migration کامل با Dual-Write و Shadow Read Diff تا رسیدن به عدم‌تطابق صفر پیش از قطع مسیر قدیمی","استقرار دومنطقه‌ای با RPO<۵ دقیقه و RTO<۱۵ دقیقه اثبات‌شده با آزمایش واقعی","اجرای یک آزمایش Chaos Engineering با فرضیهٔ مکتوب، Blast Radius محدود و پست‌مورتم نتیجه","نوشتن Roadmap افزایشی چندفازه با تقسیم‌کار مشخص بین مهندسان سطح ۳/۴"],
example:"در طول یک ماه Dual-Write، Job شبانهٔ Diff هر روز تعداد Loan هایی که بین جدول قدیمی و EventStore بازسازی‌شده مغایرت دارند را گزارش می‌دهد؛ فقط وقتی این عدد ۳۰ روز پیاپی صفر شد، مسیر نوشتن قدیمی رسماً قطع می‌شود.",
py:"# بازسازی وضعیت از Stream رویدادها برای گزارش نظارتی\ndef rebuild_loan_state(events: list[dict]) -> dict:\n    state = {'status': 'unknown', 'fines_cents': 0, 'version': 0}\n    for e in sorted(events, key=lambda x: x['sequence_no']):\n        if e['event_type'] == 'LoanCreated':\n            state['status'] = 'active'\n        elif e['event_type'] == 'LoanReturned':\n            state['status'] = 'returned'\n        elif e['event_type'] == 'FineAssessed':\n            state['fines_cents'] += e['payload']['amount_cents']\n        state['version'] = e['sequence_no']\n    return state",
exercise:"در حین بار واقعی (شبیه‌سازی‌شده با locust)، اتصال EventStore منطقهٔ اصلی را عمداً قطع کنید؛ زمان واقعی Failover تا منطقهٔ دوم و تعداد رویدادهای گم‌شده (باید صفر باشد) را اندازه بگیرید و در قالب گزارش Chaos Engineering (فرضیه، روش، نتیجه، اقدام بعدی) مستند کنید.",
project:"مهاجرت کامل و بدون Downtime تاریخچهٔ کتابخانه به EventStore قابل‌ممیزی با Dual-Write/Shadow-Read، استقرار دومنطقه‌ای با RPO/RTO اثبات‌شده، آزمایش Chaos مستند، و Roadmap افزایشی با تقسیم‌کار تیمی.",
resources:[{t:"eda-event-sourcing و eda-outbox-cqrs (فاز ۴۴)",u:"#"},{t:"prod-zero-downtime-migration و chaos-engineering-basics (فاز ۴۱ و ۴۳)",u:"#"},{t:"ha-failover-multiregion (فاز ۴۲)",u:"#"}],
criteria:"مهاجرت بدون Downtime قابل‌مشاهده انجام شده و Diff دو مسیر پیش از قطع مسیر قدیمی به صفر رسیده، RPO/RTO با آزمایش واقعی (نه فقط ادعا) اثبات شده، آزمایش Chaos با فرضیهٔ مکتوب اجرا و مستند شده، و Roadmap افزایشی با تقسیم‌کار و معیار موفقیت هر فاز مشخص است.",
interview:["چرا این مهاجرت را Big Bang نکردید و دقیقاً چه ریسکی با Dual-Write کاهش دادید؟","اگر در وسط آزمایش Chaos متوجه شوید RTO واقعی از ۱۵ دقیقهٔ تعریف‌شده بیشتر است، چه تصمیمی می‌گیرید؟"],
mistakes:["قطع مسیر قدیمی قبل از رسیدن Diff به صفر که ریسک از‌دست‌رفتن دادهٔ نظارتی ایجاد می‌کند","اجرای Chaos Engineering مستقیم روی محیط پروداکشن کامل بدون محدود کردن Blast Radius"],
production:"این پروژه هم‌ارز 'مالکیت پروژه‌های بدتعریف با تاثیر گستردهٔ دامین' و 'ایجاد roadmap افزایشی' L5 است: یک الزام مقرراتی مبهم که باید به یک راه‌حل فنی کامل و ایمن تبدیل شود.",
ai:"در نقش یک گروه ذی‌نفعان (رهبر دامین، تیم SRE، و یک مهندس سطح سه که مالک اجرای فاز اول است) رفتار کن. Roadmap افزایشی من را از دیدگاه هرکدام به چالش بکش (رهبر دامین: آیا این الزام نظارتی واقعاً تا مهلت مقرراتی محقق می‌شود؟ SRE: RPO/RTO واقعی با آزمایش چطور اثبات می‌شود؟). در پایان به من کمک کن نتیجهٔ آزمایش Chaos را به‌صورت پست‌مورتم بدون سرزنش بنویسم."},

{id:"project-l6",title:"پروژه سطح شش: معماری مرجع و استانداردهای دامین «شبکهٔ کتابخانه» (Staff)",level:"Expert",minLadder:6,prereqs:["project-l5","ladder-se6"],
short:"ابتکار استراتژیک سطح دامین (سند، نه کد): معماری مرجع دو تا سه‌ساله برای کل دامین کتابخانه (کاتالوگ، امانت/شعبه، هویت اعضا) که سه تیم مستقل را هدایت می‌کند.",
deep:"اکنون مسئول فنی کل دامین 'شبکهٔ کتابخانه' هستید که سه تیم مستقل دارد: تیم کاتالوگ، تیم امانت/شعبه، و تیم هویت اعضا (Member Identity، که بین کتابخانه و بخش محتوای دیجیتال مشترک است). باید سند 'معماری مرجع دامین کتابخانه' را دقیقاً با این پنج بخش بنویسید:\n۱) تحلیل وضعیت موجود با شواهد عددی واقعی از پروژه‌های L1-L5 (نه حدس): مثلاً 'سه تیم سه فرمت رویداد متفاوت برای LoanCreated دارند که باعث شده هر گزارش مشترک، نیازمند ETL دستی شود' یا 'میانگین زمان افزودن یک شعبهٔ جدید به شبکه به‌دلیل نبود استاندارد استقرار، ۶ هفته طول می‌کشد'.\n۲) معماری هدف با Trade-off صریح: تصمیم بگیرید چه مقدار Consistency در برابر Availability بین شعبه‌ها می‌پذیرید (با استناد به CAP/PACELC - مثلاً موجودی کاتالوگ Eventually Consistent قابل قبول است اما وضعیت Loan یک عضو باید Strongly Consistent باشد)، مرزبندی دقیق سرویس‌ها (آیا Member Identity باید یک سرویس مستقل کاملاً جدا از Loan شود؟) و استراتژی داده (تعمیم الگوی EventStore از L5 به کل دامین، نه فقط Loan/Fine).\n۳) حداقل پنج استاندارد الزامی و قابل‌ممیزی خودکار برای هر سرویس در این دامین: مثلاً 'هر رویداد منتشرشده در دامین باید یک Schema ثبت‌شده در Schema Registry مشترک داشته باشد'، 'هر سرویس باید SLO مشخص با p99 مستند و Alert متصل داشته باشد'، 'هر اندپوینت نوشتنی باید Idempotency Key بپذیرد' - هرکدام باید با یک اسکریپت CI قابل بررسی خودکار باشد، نه صرفاً یک توصیه.\n۴) برنامهٔ اجرای چندفازه بین سه تیم: مشخص کنید کدام تیم در کدام فصل (Q1/Q2/Q3/Q4) کدام استاندارد را پیاده می‌کند و وابستگی بین تیم‌ها (مثلاً تیم امانت نمی‌تواند Schema Registry مشترک را استفاده کند تا تیم کاتالوگ آن را نسخهٔ اول راه‌اندازی نکرده) را با یک نمودار وابستگی نشان دهید.\n۵) مسیر منتورینگ: مشخص کنید کدام مهندسان سطح ۴/۵ فرضی مالک اجرای کدام بخش خواهند بود و چگونه رشدشان (مثلاً آماده‌شدن یکی از آن‌ها برای مالکیت کامل دامین Member Identity) را در این پروژه پشتیبانی می‌کنید.\nاین سند باید طوری نوشته شود که واقعاً قابل ارائه و دفاع در برابر رهبری محصول و مهندسی باشد.",
objectives:["نوشتن تحلیل وضعیت موجود دامین کتابخانه با شواهد عددی مشخص از پروژه‌های L1-L5","طراحی معماری هدف با تصمیم صریح Consistency/Availability به‌ازای هر نوع داده (کاتالوگ در برابر Loan)","تعریف پنج استاندارد الزامی قابل‌ممیزی خودکار با اسکریپت CI نمونه برای حداقل یکی","برنامهٔ اجرای سه‌تیمی چندفصلی با نمودار وابستگی صریح","مسیر رشد/منتورینگ برای مهندسان سطح ۴/۵ درگیر در اجرا"],
example:"استاندارد نمونه: 'هر Event Schema منتشرشده در دامین کتابخانه باید Backward Compatible باشد (نمی‌تواند فیلد الزامی جدید بدون Default اضافه کند)'؛ اسکریپت CI این را روی هر PR که Schema جدید معرفی می‌کند خودکار بررسی می‌کند و اگر ناقض باشد PR را رد می‌کند.",
py:"def is_schema_backward_compatible(old_schema: dict, new_schema: dict) -> bool:\n    old_required = set(old_schema.get('required', []))\n    new_required = set(new_schema.get('required', []))\n    if new_required - old_required:\n        return False  # فیلد الزامی جدید، مصرف‌کننده‌های قدیمی (مثلاً تیم گزارش‌گیری) را می‌شکند\n    return True",
exercise:"سند معماری مرجع را در برابر یک 'هیئت بازبینی معماری' فرضی (نمایندهٔ هر سه تیم + امنیت + SRE) دفاع کنید و حداقل دو ایراد جدی (مثلاً 'تیم کاتالوگ ظرفیت این فصل را برای Schema Registry ندارد') را با تغییر واقعی در برنامهٔ اجرا برطرف کنید.",
project:"سند معماری مرجع دامین شبکهٔ کتابخانه: تحلیل وضعیت با شواهد، معماری هدف با Trade-off صریح، پنج استاندارد قابل‌ممیزی، برنامهٔ اجرای سه‌تیمی، و مسیر منتورینگ.",
resources:[{t:"eda-event-sourcing (فاز ۴۴) و cap-theorem (فاز ۲۵)",u:"#"},{t:"Staff Engineer: Leadership beyond the management track (Will Larson)",u:"https://staffeng.com/"},{t:"eng-practices-adr-review (فاز ۴۸)",u:"#"}],
criteria:"سند شامل تحلیل مبتنی بر شواهد عددی، معماری هدف با Trade-off صریح Consistency/Availability، پنج استاندارد با حداقل یک اسکریپت ممیزی خودکار واقعی، برنامهٔ سه‌تیمی با نمودار وابستگی، و مسیر منتورینگ مشخص است؛ و در برابر نقد چندجانبه دفاع‌پذیر و بر اساس آن اصلاح‌شده است.",
interview:["اگر تیم کاتالوگ با اولویت‌بندی شما در این roadmap مخالف باشد، چه می‌کنید؟","کدام‌یک از پنج استاندارد شما بیشترین مقاومت عملی را ایجاد می‌کند و چرا همچنان الزامی نگهش می‌دارید؟"],
mistakes:["نوشتن استراتژی به‌عنوان آرزوی فنی بدون برنامهٔ اجرای زمان‌بندی‌شده و وابستگی صریح بین تیم‌ها","تعریف استانداردهایی که قابل ممیزی خودکار نیستند و در عمل هرگز واقعاً رعایت نمی‌شوند"],
production:"این دقیقاً معادل 'راهبری استراتژی فنی برای دامین' و 'رهبری معماری در چند تیم' است که در سند رسمی نردبان، هستهٔ قلمرو L6 (Staff) تعریف شده.",
ai:"در نقش هیئت بازبینی معماری (نمایندهٔ سه تیم دامین + امنیت + SRE) رفتار کن. سند معماری مرجع دامین کتابخانه‌ام را ارائه می‌دهم؛ هر نقش باید سؤال‌های سخت و واقع‌بینانه از زاویهٔ خودش بپرسد، نه صرفاً تأیید کند. در پایان مشخص کن کدام بخش سند برای رفتن به مرحلهٔ اجرا هنوز به‌اندازهٔ کافی محکم نیست."},

{id:"project-l7",title:"پروژه سطح هفت: یکپارچه‌سازی هویت اعضا میان دامین کتابخانه و دامین محتوای دیجیتال (Senior Staff)",level:"Expert",minLadder:7,prereqs:["project-l6","ladder-se7"],
short:"همان مقیاس تصمیم‌گیری L6 اما در تلاقی دو دامین مستقل: رفع دوباره‌کاری هویت/رویداد بین دامین «شبکهٔ کتابخانه» و دامین جدا «محتوای دیجیتال/کتاب الکترونیک» بدون اختیار مدیریتی مستقیم بر هیچ‌کدام.",
deep:"سند رسمی نردبان این سطح را مختصر تعریف کرده و می‌گوید همان معیارهای L6 با قلمرو وسیع‌تر (بیش از یک دامین) تکرار می‌شود؛ بنابراین این پروژه تعمیم پروژهٔ L6 به نقطهٔ تلاقی دو دامین است. شرکت علاوه بر دامین 'شبکهٔ کتابخانه' (که در L6 معماری مرجعش را نوشتید)، یک دامین کاملاً مستقل 'محتوای دیجیتال/کتاب الکترونیک' هم دارد (تیم جدا، معماری جدا) که کاربران آن هم اعضای همان کتابخانه‌اند اما با یک مدل هویت و صف رویداد کاملاً جدا. این دوباره‌کاری باعث شده: عضوی که در دامین کتابخانه suspended شده همچنان بتواند کتاب الکترونیک امانت بگیرد (ناسازگاری سیاست عضویت)، و هر گزارش مشترک (مثلاً 'کل امانت‌های یک عضو، فیزیکی+دیجیتال') نیازمند یکپارچه‌سازی دستی دو منبع باشد. بدون این‌که مدیر مستقیم هیچ‌کدام از دو تیم دامین باشید، باید:\n۱) این دوباره‌کاری و هزینهٔ واقعی آن را مستند کنید: با داده، نه حدس (مثلاً 'در سه ماه گذشته ۱۲ مورد ثبت شده که عضو suspended همچنان محتوای دیجیتال امانت گرفته، و میانگین ۴ ساعت کار مهندسی هفتگی صرف یکپارچه‌سازی دستی گزارش دوگانه می‌شود').\n۲) یک لایهٔ مشترک 'Member Identity Backbone' پیشنهاد دهید: یک سرویس هویت مرکزی (یا یک Schema Registry مشترک برای رویداد MembershipStatusChanged) که هر دو دامین بتوانند بدون بازنویسی کامل معماری داخلی خودشان، به آن متصل شوند - عضویت suspended باید در هر دو دامین هم‌زمان (یا با تأخیر مشخص و قابل قبول، مثلاً کمتر از ۵ دقیقه) اعمال شود.\n۳) مسیر مهاجرت تدریجی طراحی کنید که هر دامین بتواند مستقل و با سرعت خودش (نه هم‌زمان و اجباری) به این Backbone متصل شود - شبیه Strangler Fig اما در سطح دو دامین مستقل، نه یک مونولیت.\n۴) این پیشنهاد را در برابر مقاومت واقعی دفاع کنید: تیم محتوای دیجیتال ممکن است بگوید 'ما این فصل ظرفیت مهندسی برای این مهاجرت نداریم' یا 'معماری هویت فعلی ما به دلایل فنی خودمان طراحی شده و نمی‌خواهیم دورش بریزیم' - باید با استدلال کسب‌وکاری (ریسک انطباق/تجربهٔ کاربری، نه فقط تمیزی فنی) این مقاومت را پاسخ دهید، نه با اجبار سلسله‌مراتبی (که اختیارش را ندارید).",
objectives:["مستندسازی کمی هزینهٔ دوباره‌کاری هویت/رویداد بین دو دامین با داده واقعی (نه حدس)","طراحی یک Member Identity Backbone مشترک که استقلال معماری داخلی هر دامین را حفظ می‌کند","طراحی مسیر مهاجرت تدریجی و غیرهماهنگ که هر دامین با سرعت خودش حرکت کند","تدوین استدلال کسب‌وکاری (ریسک انطباق/تجربهٔ کاربری) برای اقناع تیمی که اختیار مدیریتی مستقیم روی آن ندارید"],
example:"رویداد مشترک MembershipStatusChanged {member_id, status, changed_at, source_domain} در یک Schema Registry مشترک منتشر می‌شود؛ هر دو دامین (کتابخانه و محتوای دیجیتال) آن را مصرف می‌کنند و وضعیت suspended را در حداکثر ۵ دقیقه در سیستم خودشان اعمال می‌کنند، بدون نیاز به یکی‌شدن کامل پایگاه‌دادهٔ هویت دو دامین.",
py:"# اعتبارسنجی سازگاری نسخهٔ رویداد مشترک هویت قبل از انتشار در Registry\ndef is_backward_compatible(old_schema: dict, new_schema: dict) -> bool:\n    old_required = set(old_schema.get('required', []))\n    new_required = set(new_schema.get('required', []))\n    return not (new_required - old_required)",
exercise:"با تیم‌های فرضی دو دامین (که هرکدام اولویت رقابتی دارند) یک جلسهٔ 'تصمیم معماری بین‌دامینی' شبیه‌سازی کنید؛ استدلال کسب‌وکاری‌تان را ارائه دهید و به اعتراض واقع‌بینانهٔ 'ما ظرفیت این فصل را نداریم' با یک راه میانی (مثلاً مهاجرت غیرمسدودکننده که تیم محتوای دیجیتال فقط باید Consumer رویداد را اضافه کند، نه معماری داخلی‌اش را عوض کند) پاسخ دهید.",
project:"طراحی و اقناع‌سازی برای Member Identity Backbone مشترک بین دامین کتابخانه و دامین محتوای دیجیتال، با مستندسازی هزینهٔ دوباره‌کاری، مسیر مهاجرت تدریجی مستقل، و استدلال کسب‌وکاری قابل دفاع بدون اختیار مدیریتی مستقیم.",
resources:[{t:"eda-event-sourcing (فاز ۴۴)",u:"#"},{t:"microservices-communication-gateway - Strangler Fig (فاز ۲۹)",u:"#"},{t:"Staff Engineer: Leadership beyond the management track (Will Larson)",u:"https://staffeng.com/"}],
criteria:"هزینهٔ دوباره‌کاری با داده واقعی مستند شده، طرح Backbone استقلال معماری داخلی هر دامین را حفظ می‌کند (نه بازنویسی اجباری هم‌زمان)، مسیر مهاجرت هر دامین را با سرعت خودش پیش می‌برد، و استدلال کسب‌وکاری در برابر حداقل یک اعتراض واقع‌بینانهٔ ظرفیت محدود دفاع‌پذیر است.",
interview:["اگر دامین محتوای دیجیتال اصلاً همکاری نکند، چه مسیر جایگزینی برای کاهش ریسک ناسازگاری عضویت دارید؟","چطور بدون اختیار مدیریتی مستقیم، دو تیم مستقل را به سمت یک استاندارد هویت مشترک هم‌راستا می‌کنید؟"],
mistakes:["طراحی یک Backbone که عملاً دامین محتوای دیجیتال را مجبور به بازنویسی کامل معماری هویت خودش می‌کند","تکیهٔ صرف بر استدلال فنی/تمیزی معماری بدون ترجمهٔ آن به ریسک انطباق یا تجربهٔ کاربری قابل‌فهم برای رهبری دامین دیگر"],
production:"چون سند رسمی این سطح جزئیات کمی دارد، این پروژه عمداً تمرکزش را از 'عمق فنی درون یک دامین' (L6) به 'اثرگذاری بدون اختیار مستقیم در چند دامین' منتقل می‌کند - دقیقاً تفاوت عملی بین L6 و L7.",
ai:"در نقش رهبران فنی دو دامین مستقل (کتابخانه و محتوای دیجیتال) که هرکدام منابع محدود و اولویت رقابتی خودشان را دارند و مشتاق بازنویسی معماری هویت فعلی خودشان نیستند رفتار کن. پیشنهاد Member Identity Backbone من را با مقاومت واقع‌بینانه به چالش بکش، و کمکم کن پیشنهادم را طوری بازنویسی کنم که برای هر دو دامین به‌اندازهٔ کافی کم‌ریسک باشد که بپذیرندش."},

{id:"project-l8",title:"پروژه سطح هشت: چشم‌انداز پلتفرم واحد هویت/دفتر مالی کل شرکت (Principal)",level:"Expert",minLadder:8,prereqs:["project-l7","ladder-se8"],
short:"ابتکار فراتر از هر دامین: یکپارچه‌سازی هویت مشتری و دفتر مالی (جریمه، اشتراک دیجیتال، خرید خرده‌فروشی) در کل شرکت -که علاوه بر کتابخانه‌ها یک بازوی محتوای دیجیتال و یک بازوی خرده‌فروشی کتاب هم دارد- با افق ۳ تا ۵ سال.",
deep:"سند رسمی نردبان تأکید می‌کند مسیر L8 کاملاً فردی و متکی به تخصص/مهارت حیاتی برای شرکت است و تضمینی نیست؛ اما صورت‌مسئلهٔ این پروژه مشخص و ثابت است تا مبنایی برای تمرین واقعی باشد: شرکت (فراتر از دامین‌های کتابخانه و محتوای دیجیتالی که در L6/L7 دیدید) یک بازوی سوم هم دارد - فروشگاه خرده‌فروشی کتاب فیزیکی/آنلاین - با هویت مشتری و دفتر مالی کاملاً جدای خودش. نتیجه: یک نفر که هم عضو کتابخانه، هم مشترک محتوای دیجیتال، و هم مشتری فروشگاه است، در سه سیستم مالی/هویتی جدا دیده می‌شود؛ هیچ گزارش مالی واحدی در سطح شرکت (مثلاً 'کل تعاملات مالی این مشتری در سال') قابل تولید نیست و این خودش یک ریسک انطباق مقرراتی (حسابرسی مالی) شده. کار این است:\n۱) این مسئله را با شواهد مستند کنید: چند نمونهٔ واقعی حسابرسی/گزارش مالی که به‌دلیل پراکندگی سه سیستم شکست خورده یا هفته‌ها طول کشیده.\n۲) یک چشم‌انداز معماری سه تا پنج‌ساله بنویسید برای یک 'دفتر مالی/هویت واحد سطح‌شرکت' (Unified Ledger & Identity Platform) که سه منبع (جریمهٔ کتابخانه، اشتراک محتوای دیجیتال، خرید فروشگاه) را بدون نابود کردن استقلال عملیاتی هرکدام، در یک لایهٔ حسابداری/هویت غیرقابل‌تغییر و قابل‌ممیزی گرد هم می‌آورد؛ این چشم‌انداز باید با رشد احتمالی کسب‌وکار (مثلاً افزودن یک بازوی چهارم در آینده) سازگار و انعطاف‌پذیر باشد.\n۳) شخصاً (نه فقط با تفویض) یک اثبات مفهوم (Proof of Concept) روی سخت‌ترین بخش فنی این چشم‌انداز بسازید: یک Ledger Append-Only با اثبات یکپارچگی زنجیره‌ای (هر رکورد Hash رکورد قبلی را در خود دارد تا هرگونه دستکاری بعدی قابل کشف باشد) که بتواند رکوردهایی با فرمت‌های متفاوت از هر سه منبع را وارد کند و یک تابع verify_chain داشته باشد که یکپارچگی کل زنجیره را در O(n) اثبات کند.\n۴) الگوها و استانداردهایی تعریف کنید که قرار است در کل شرکت (نه فقط این سه بازو) به کار گرفته شوند - مثلاً 'هر تراکنش مالی در هر سیستم شرکت باید در همان لحظه (یا با تأخیر مشخص) یک رکورد در Unified Ledger ثبت کند' - و توضیح دهید این الگو چطور با یک بازوی کسب‌وکار کاملاً جدید و ناشناخته (که هنوز طراحی نشده) هم سازگار خواهد بود.\n۵) یک برنامهٔ اقناع در سطح رهبری شرکت بنویسید: چرا این ابتکار برای ریسک انطباق مقرراتی و اعتماد مشتری حیاتی است (نه صرفاً 'تمیزی معماری')، و اگر بودجه/زمان کافی برای اجرای کامل در پنج سال نباشد، کدام بخش (مثلاً فقط یکپارچه‌سازی هویت، بدون یکپارچه‌سازی کامل دفتر مالی) را در فاز اول اولویت می‌دهید و چرا.",

// ---------- Storage ----------
const STORAGE_KEY = 'roadmap_progress_v1';
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); } catch(e) { console.error('storage failed', e); }
}
let PROGRESS = loadProgress(); // { topicId: {status, note, bookmark, review:{lastDate, nextDate, ease}} }

// ---------- Export / Import progress ----------
function exportProgress() {
  const payload = {exportedAt: new Date().toISOString(), version: 1, progress: PROGRESS};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `roadmap-progress-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importProgress() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch(e) {
        alert('فایل معتبر JSON نیست.');
        return;
      }
      const incoming = (parsed && typeof parsed === 'object' && parsed.progress) ? parsed.progress : parsed;
      if (!incoming || typeof incoming !== 'object') {
        alert('ساختار فایل پیشرفت نامعتبر است.');
        return;
      }
      const replace = confirm('برای جایگزینی کامل پیشرفت فعلی با فایل وارد شده OK بزنید؛ برای ادغام (merge) با پیشرفت فعلی Cancel بزنید.');
      if (replace) {
        PROGRESS = incoming;
      } else {
        PROGRESS = Object.assign({}, PROGRESS, incoming);
      }
      saveProgress();
      render();
      alert('پیشرفت با موفقیت وارد شد.');
    };
    reader.readAsText(file);
  };
  input.click();
}

function getEntry(topicId) {
  if (!PROGRESS[topicId]) PROGRESS[topicId] = {status:'not_started', note:'', bookmark:false, review:null};
  return PROGRESS[topicId];
}

function statusLabel(s) {
  return {not_started:'شروع نشده', learning:'در حال یادگیری', practicing:'در حال تمرین', completed:'تکمیل‌شده', mastered:'مسلط'}[s] || s;
}
function levelFa(l) {
  return {Beginner:'مبتدی', Intermediate:'متوسط', Advanced:'پیشرفته', Expert:'خبره'}[l] || l;
}
function ladderBadge(n) {
  if (n == null) return `<span class="badge ladder optional" title="برای هیچ سطح نردبانی الزامی نیست — دانش تکمیلی/تخصصی که بسته به نقش و علاقه یاد می‌گیرید">اختیاری</span>`;
  return `<span class="badge ladder" title="حداقل سطح نردبانی که باید این موضوع را بداند (سطوح بالاتر هم باید بدانند)">L${n}+</span>`;
}
function computeStats() {
  const total = ALL_TOPICS.length;
  let completed=0, mastered=0, learning=0, practicing=0;
  ALL_TOPICS.forEach(t => {
    const e = PROGRESS[t.id];
    if (!e) return;
    if (e.status==='completed') completed++;
    else if (e.status==='mastered') mastered++;
    else if (e.status==='learning') learning++;
    else if (e.status==='practicing') practicing++;
  });
  const done = completed + mastered;
  return {total, completed, mastered, learning, practicing, done, pct: total? Math.round((done/total)*100):0};
}
function phaseStats(phase) {
  const total = phase.topics.length;
  let done = 0;
  phase.topics.forEach(t => {
    const e = PROGRESS[t.id];
    if (e && (e.status==='completed' || e.status==='mastered')) done++;
  });
  return {total, done, pct: total? Math.round((done/total)*100):0};
}

      <div class="badges"><span class="badge">${st.done}/${st.total} تکمیل</span></div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('mainContent').innerHTML = html;
}

function renderGapAnalysis() {
  // Maturity checks for key domains
  const domains = [
    {name:'PostgreSQL', ids:['db-normalization','db-query-planner','db-acid-isolation','pg-vacuum-wal','pg-replication-partitioning'], msgOk:'شما دانش تولیدی PostgreSQL (تراکنش، MVCC، Replication) را پوشش داده‌اید.', msgBad:'شما مبانی دیتابیس را می‌دانید اما هنوز برای کار تولیدی با PostgreSQL آماده نیستید — تراکنش، MVCC، Replication را کامل کنید.'},
    {name:'سیستم‌های توزیع‌شده', ids:['logical-clocks-consensus','cap-theorem','resilience-patterns','sharding-consistent-hashing'], msgOk:'درک قوی از مصالحه‌های سیستم توزیع‌شده دارید.', msgBad:'مفاهیم پایه را می‌دانید اما CAP/Consensus/الگوهای تحمل خطا را کامل نکرده‌اید.'},
    {name:'Kubernetes/DevOps', ids:['docker-images-layers','k8s-core-objects','cicd-deployment-strategies','terraform-state-modules'], msgOk:'برای عملیات تولیدی Kubernetes/CI-CD آماده‌اید.', msgBad:'Docker را می‌دانید اما Kubernetes/CI-CD/IaC را کامل نکرده‌اید.'},
    {name:'امنیت', ids:['security-owasp-top','drf-auth-throttling'], msgOk:'مبانی امنیت بک‌اند را پوشش داده‌اید.', msgBad:'هنوز آسیب‌پذیری‌های رایج (OWASP) را کامل مرور نکرده‌اید.'},
    {name:'SRE/Observability', ids:['sre-sli-slo-error-budget','sre-incident-postmortem','observability-three-pillars','chaos-engineering-basics'], msgOk:'دانش SRE سطح تولیدی دارید.', msgBad:'مفاهیم SRE را شروع کرده‌اید اما هنوز کامل نیست (SLO، Postmortem، Observability، Chaos).'},
  ];
  let html = '';
  domains.forEach(d => {
    const doneCount = d.ids.filter(id => {
      const e = PROGRESS[id];
      return e && (e.status==='completed'||e.status==='mastered');
    }).length;
    const pct = Math.round((doneCount/d.ids.length)*100);
    const cls = pct===100 ? 'ok' : (pct===0 ? 'bad' : '');
    html += `<div class="gap-card ${cls}"><b>${d.name}</b> (${doneCount}/${d.ids.length} تکمیل، ${pct}٪) — ${pct===100 ? d.msgOk : d.msgBad}</div>`;
  });
  return html;
}

// ---------- Render: Phases / topic grid ----------
function matchesFilters(t) {
  if (SEARCH_QUERY) {
    const q = SEARCH_QUERY.toLowerCase();
    const hay = (t.title + ' ' + t.short + ' ' + t.deep).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (FILTER_LEVEL && t.level !== FILTER_LEVEL) return false;
  if (FILTER_LADDER === 'none') { if (t.minLadder != null) return false; }
  else if (FILTER_LADDER && t.minLadder !== Number(FILTER_LADDER)) return false;
  if (FILTER_STATUS) {
    const e = PROGRESS[t.id];
    const s = e ? e.status : 'not_started';
    if (s !== FILTER_STATUS) return false;
  }
  if (FILTER_BOOKMARK) {
    const e = PROGRESS[t.id];
    if (!e || !e.bookmark) return false;
  }
  return true;
}

// ---------- Render: Review (spaced repetition) view ----------
function renderReviewView() {
  const now = new Date();
  const withReview = ALL_TOPICS.filter(t => PROGRESS[t.id] && PROGRESS[t.id].review);
  const due = withReview.filter(t => new Date(PROGRESS[t.id].review.nextDate) <= now);
  const upcoming = withReview.filter(t => new Date(PROGRESS[t.id].review.nextDate) > now)
    .sort((a,b) => new Date(PROGRESS[a.id].review.nextDate) - new Date(PROGRESS[b.id].review.nextDate));

  let html = `<div class="topbar"><div><h2>مرور دوره‌ای (Spaced Repetition)</h2><div class="sub">بعد از تکمیل هر موضوع، سیستم فاصلهٔ مرور بعدی را بر اساس بازخورد شما پیشنهاد می‌دهد.</div></div>
  <button class="iconbtn" onclick="toggleTheme()">🌓</button></div>`;

  html += `<div class="section-title">امروز نیازمند مرور (${due.length}) <div class="line"></div></div>`;
  if (due.length === 0) html += `<div class="empty">چیزی برای مرور امروز نیست 🎉</div>`;
  due.forEach(t => {
    html += `<div class="review-item"><span>${t.title} — فاز ${t.phaseNum}</span><button class="navbtn" style="flex:none;" onclick="openTopic('${t.id}')">مرور کن</button></div>`;
  });

  html += `<div class="section-title">مرورهای آینده (${upcoming.length}) <div class="line"></div></div>`;
  if (upcoming.length === 0) html += `<div class="empty">هیچ مرور برنامه‌ریزی‌شده‌ای وجود ندارد. بعد از تکمیل موضوعات، دکمهٔ مرور را در جزئیات هر موضوع بزنید.</div>`;
  upcoming.slice(0,30).forEach(t => {
    const d = new Date(PROGRESS[t.id].review.nextDate);
    html += `<div class="review-item"><span>${t.title}</span><span style="color:var(--muted);">${d.toLocaleDateString('fa-IR')}</span></div>`;
  });
  document.getElementById('mainContent').innerHTML = html;
}

// ---------- Render: Capstone view ----------
function renderCapstoneView() {
  let html = `<div class="topbar"><div><h2>آزمون جامع نهایی (Capstone)</h2><div class="sub">ارزیابی نهایی ترکیبی از تمام حوزه‌های نقشه راه</div></div>
  <button class="iconbtn" onclick="toggleTheme()">🌓</button></div>
  <div class="footer-note">⚠️ توجه: تکمیل این چک‌لیست به‌تنهایی شما را «مهندس ارشد» نمی‌کند. فرمول واقعی این است:<br>
  <b>دانش + پیاده‌سازی + دیباگ + تجربهٔ تولید + معماری + مالکیت = توانمندی مهندسی ارشد</b><br>
  این آزمون فقط بخش «دانش و پیاده‌سازی» را می‌سنجد؛ بقیه از طریق کار واقعی روی سیستم‌های تولیدی به دست می‌آید.</div>`;
  CAPSTONE.sections.forEach(sec => {
    html += `<div class="section-title">${sec.title}<div class="line"></div></div><div class="topic-grid">`;
    sec.items.forEach((item, idx) => {
      const key = `capstone_${sec.title}_${idx}`;
      const checked = PROGRESS[key] && PROGRESS[key].status==='completed';
      html += `<div class="topic-card" style="cursor:default;" onclick="toggleCapstoneItem('${key}')">
        <div class="status-dot ${checked?'completed':''}"></div>
        <p style="margin-top:14px;">${item}</p>
      </div>`;
    });
    html += `</div>`;
  });

}
function toggleCapstoneItem(key) {
  if (!PROGRESS[key]) PROGRESS[key] = {status:'not_started'};
  PROGRESS[key].status = PROGRESS[key].status === 'completed' ? 'not_started' : 'completed';
  saveProgress();
  render();
}

// ---------- Topic Modal ----------
function openTopic(id) {
  const t = TOPIC_BY_ID[id];
  if (!t) return;
  const e = getEntry(id);
  const resHtml = (t.resources||[]).map(r => `<a class="resbtn" href="${r.u}" target="_blank" rel="noopener">🔗 ${r.t}</a>`).join(' ');
  const prereqHtml = (t.prereqs||[]).length ? (t.prereqs||[]).map(p => {
    const pt = TOPIC_BY_ID[p];
    const pe = PROGRESS[p];
    const done = pe && (pe.status==='completed'||pe.status==='mastered');
    return `<span class="badge" style="color:${done?'var(--good)':'var(--bad)'}">${done?'✓':'✗'} ${pt?pt.title:p}</span>`;
  }).join(' ') : '<span class="badge">ندارد</span>';

  const html = `
    <span class="modal-close" onclick="closeTopic()">×</span>
    <h3>${t.title}</h3>
    <div class="modal-sub">فاز ${t.phaseNum}: ${t.phaseTitle} · سطح: ${levelFa(t.level)} · ${t.minLadder == null ? 'نردبان' : 'حداقل سطح نردبان'}: ${ladderBadge(t.minLadder)}</div>

    <div class="statusbar">
      ${['not_started','learning','practicing','completed','mastered'].map(s =>
        `<div class="statusbtn ${e.status===s?'on':''}" onclick="setStatus('${id}','${s}')">${statusLabel(s)}</div>`
      ).join('')}
      <div class="statusbtn ${e.bookmark?'on':''}" onclick="toggleBookmark('${id}')">★ بوکمارک</div>
    </div>

    <div class="mrow"><h5>🎯 پیش‌نیازها</h5><div class="body">${prereqHtml}</div></div>
    <div class="mrow"><h5>📌 توضیح کوتاه</h5><div class="body">${t.short}</div></div>
    <div class="mrow"><h5>🔬 توضیح عمیق</h5><div class="body">${t.deep}</div></div>
    ${t.objectives && t.objectives.length ? `<div class="mrow"><h5>🎓 اهداف یادگیری</h5><ul>${t.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>` : ''}
    ${t.example ? `<div class="mrow"><h5>💡 مثال</h5><div class="body">${t.example}</div></div>` : ''}
    ${t.py ? `<div class="mrow"><h5>🐍 مثال پایتون</h5><pre>${escapeHtml(t.py)}</pre></div>` : ''}
    ${t.exercise ? `<div class="mrow"><h5>✍️ تمرین</h5><div class="body">${t.exercise}</div></div>` : ''}
    ${t.project ? `<div class="mrow"><h5>🏗️ پروژهٔ مرتبط</h5><div class="body">${t.project}</div></div>` : ''}
    ${t.criteria ? `<div class="mrow"><h5>✅ معیار تکمیل</h5><div class="body">${t.criteria}</div></div>` : ''}
    ${t.interview && t.interview.length ? `<div class="mrow"><h5>🎤 سؤالات مصاحبه</h5><ul>${t.interview.map(q=>`<li>${q}</li>`).join('')}</ul></div>` : ''}
    ${t.mistakes && t.mistakes.length ? `<div class="mrow"><h5>⚠️ اشتباهات رایج</h5><ul>${t.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul></div>` : ''}
    ${t.production ? `<div class="mrow"><h5>🏭 ارتباط با تولید</h5><div class="body">${t.production}</div></div>` : ''}
    <div class="mrow"><h5>📚 منابع رایگان</h5><div class="body">${resHtml || 'به‌زودی'}</div></div>
    ${t.ai ? `<div class="mrow"><h5>🤖 پرامپت مربی AI</h5><div class="aiprompt" id="aiprompt-${id}">${escapeHtml(t.ai)}</div><button class="copybtn" onclick="copyPrompt('${id}')">کپی پرامپت</button></div>` : ''}

    <div class="mrow"><h5>📝 یادداشت شخصی</h5><textarea class="notearea" id="note-${id}" oninput="saveNote('${id}', this.value)" placeholder="یادداشت خودتان را اینجا بنویسید...">${e.note||''}</textarea></div>

    <div class="mrow"><h5>🔁 مرور دوره‌ای</h5><div class="body" style="font-size:12px;color:var(--muted);">بعد از یادگیری، بازخورد بده تا فاصلهٔ مرور بعدی تنظیم شود.</div>
    <div class="reviewbtns">
      <button class="rb-forgot" onclick="scheduleReview('${id}','forgot')">فراموش کردم</button>
      <button class="rb-hard" onclick="scheduleReview('${id}','hard')">سخت بود</button>
      <button class="rb-good" onclick="scheduleReview('${id}','good')">خوب بود</button>
      <button class="rb-easy" onclick="scheduleReview('${id}','easy')">آسان بود</button>
    </div>
    ${e.review ? `<div style="font-size:11px;color:var(--muted);margin-top:6px;">مرور بعدی: ${new Date(e.review.nextDate).toLocaleDateString('fa-IR')}</div>` : ''}
    </div>
  `;
  document.getElementById('topicModal').innerHTML = html;
  document.getElementById('topicOverlay').classList.add('show');
}
function closeTopic() {
  document.getElementById('topicOverlay').classList.remove('show');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function setStatus(id, status) {
  const e = getEntry(id);
  e.status = status;
  saveProgress();
  openTopic(id);
  renderPhaseNav();
}
function toggleBookmark(id) {
  const e = getEntry(id);
  e.bookmark = !e.bookmark;
  saveProgress();
  openTopic(id);
}
function saveNote(id, val) {
  const e = getEntry(id);
  e.note = val;
  saveProgress();
}
function copyPrompt(id) {
  const t = TOPIC_BY_ID[id];
  if (!t || !t.ai) return;
  navigator.clipboard.writeText(t.ai).catch(()=>{});
}
const REVIEW_INTERVALS = {forgot:1, hard:3, good:7, easy:14};
const REVIEW_SEQUENCE = [1,3,7,14,30,90];
function scheduleReview(id, quality) {
  const e = getEntry(id);
  if (!e.review) e.review = {lastDate: new Date().toISOString(), stage:0};
  let stage = e.review.stage || 0;
  if (quality === 'forgot') stage = 0;
  else if (quality === 'hard') stage = Math.max(0, stage);
  else if (quality === 'good') stage = Math.min(REVIEW_SEQUENCE.length-1, stage+1);
  else if (quality === 'easy') stage = Math.min(REVIEW_SEQUENCE.length-1, stage+2);
  const days = REVIEW_SEQUENCE[stage] || 1;
  const next = new Date();
  next.setDate(next.getDate() + days);
  e.review = {lastDate: new Date().toISOString(), nextDate: next.toISOString(), stage};
  saveProgress();
  openTopic(id);
}

// ---------- Search ----------
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    SEARCH_QUERY = e.target.value.trim();
    if (SEARCH_QUERY && CURRENT_VIEW !== 'phases') {
      CURRENT_VIEW = 'phases';
      CURRENT_PHASE_FILTER = null;
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view==='phases'));
    }
    render();
  });
  document.getElementById('topicOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'topicOverlay') closeTopic();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTopic();
  });
  renderPhaseNav();
  render();
});

// ---------- Master render ----------
function render() {
  renderPhaseNav();
  if (CURRENT_VIEW === 'dashboard') renderDashboard();
  else if (CURRENT_VIEW === 'phases') renderPhasesView();
  else if (CURRENT_VIEW === 'compare') renderCompareView();
  else if (CURRENT_VIEW === 'scenarios') renderScenariosView();
  else if (CURRENT_VIEW === 'review') renderReviewView();
  else if (CURRENT_VIEW === 'capstone') renderCapstoneView();
}
