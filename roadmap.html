<style>

*{box-sizing:border-box;}
body{margin:0;font-family:'Vazirmatn','Tahoma',sans-serif;background:var(--bg);color:var(--text);transition:.2s;}
@font-face{font-family:'Vazirmatn';src:local('Vazirmatn');}
a{color:var(--accent);text-decoration:none;}
::-webkit-scrollbar{width:9px;height:9px;}

.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
.sidebar{background:var(--bg2);border-left:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;}
.brand h1{font-size:15px;margin:0;line-height:1.4;}
.brand p{margin:0;font-size:11px;color:var(--muted);}
.searchbox{position:relative;margin-bottom:12px;}
.searchbox input{width:100%;padding:10px 36px 10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;}
.searchbox span{position:absolute;right:12px;top:9px;color:var(--muted);}
.navbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.navbtn{flex:1 1 auto;font-size:11.5px;padding:7px 8px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;text-align:center;}
.navbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.phaselist{display:flex;flex-direction:column;gap:4px;}
.phase-item{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);}
.phase-item:hover{background:var(--card);}
.phase-item.active{background:var(--chip);color:var(--text);font-weight:700;}
.phase-item .pnum{background:var(--card2);border-radius:6px;padding:1px 6px;font-size:10px;margin-left:6px;color:var(--accent);}
.phase-item .pct{font-size:10px;color:var(--good);}
.main{padding:22px 28px;max-width:1300px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.topbar h2{margin:0;font-size:20px;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat-card .num{font-size:26px;font-weight:800;}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
.progressbar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:8px;}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filters select,.filters input{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;}
.section-title{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title .line{flex:1;height:1px;background:var(--border);}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;position:relative;}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.topic-card h4{margin:0 0 6px;font-size:14px;}
.topic-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.6;max-height:52px;overflow:hidden;}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--chip);color:var(--muted);}
.badge.lvl-Beginner{color:var(--good);} .badge.lvl-Intermediate{color:var(--accent);}

.badge.ladder{border:1px solid var(--border);font-weight:600;}
.status-dot{position:absolute;top:12px;left:12px;width:10px;height:10px;border-radius:50%;background:var(--border);}
.status-dot.mastered{background:var(--good);}
.status-dot.completed{background:var(--accent);}
.status-dot.practicing{background:var(--warn);}
.status-dot.learning{background:var(--accent2);}
.bm-star{position:absolute;top:10px;left:26px;font-size:13px;color:var(--warn);}

.overlay{position:fixed;inset:0;background:rgba(5,8,15,.6);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:30px 12px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:760px;width:100%;padding:24px 26px;box-shadow:var(--shadow);}
.modal h3{margin:0 0 3px;font-size:19px;}
.modal .modal-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.modal-close{float:left;cursor:pointer;font-size:20px;color:var(--muted);}
.mrow{margin-bottom:16px;}
.mrow h5{margin:0 0 6px;font-size:13px;color:var(--accent);display:flex;gap:6px;align-items:center;}
.mrow .body{font-size:13px;line-height:1.9;color:var(--text);}
.mrow ul{margin:4px 0;padding-right:20px;}
pre{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;direction:ltr;text-align:left;font-family:var(--mono);font-size:12.5px;}
.resbtn{display:inline-block;font-size:11.5px;padding:5px 10px;border-radius:8px;background:var(--chip);margin:3px;color:var(--text);}
.statusbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.statusbtn{font-size:11.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;}
.statusbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
textarea.notearea{width:100%;min-height:70px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px;font-size:12.5px;font-family:inherit;}
.reviewbtns{display:flex;gap:6px;margin-top:8px;}
.reviewbtns button{flex:1;padding:7px;border-radius:8px;border:none;cursor:pointer;font-size:11.5px;color:#fff;}
.rb-easy{background:var(--good);} .rb-good{background:var(--accent);} .rb-hard{background:var(--warn);} .rb-forgot{background:var(--bad);}
.aiprompt{background:var(--card);border:1px dashed var(--border);padding:10px;border-radius:9px;font-size:12px;line-height:1.8;white-space:pre-wrap;}
.copybtn{font-size:11px;padding:4px 10px;border-radius:7px;background:var(--accent);color:#fff;border:none;cursor:pointer;margin-top:6px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:10px;overflow:hidden;}
table th,table td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;}
table th{background:var(--card2);color:var(--accent);font-size:12px;}
.compare-wrap{overflow-x:auto;margin-bottom:20px;border:1px solid var(--border);border-radius:12px;}
.scenario{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:12px 14px;}
.scenario summary{cursor:pointer;font-weight:700;font-size:13.5px;}
.scenario .sc-body{margin-top:10px;font-size:12.5px;line-height:1.9;}
.gap-card{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.8;}
.gap-card.ok{border-right-color:var(--good);}
.gap-card.bad{border-right-color:var(--bad);}
.footer-note{color:var(--muted);font-size:11.5px;margin:30px 0 10px;line-height:2;}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px;}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.review-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:12.5px;}
@media(max-width:900px){.app{grid-template-columns:1fr;} .sidebar{position:relative;height:auto;}}
</style>

deep:"استفادهٔ درست از AI یعنی: اول خودتان تلاش کنید، بعد از AI فقط راهنمایی (hint) بخواهید نه راه‌حل کامل، پیاده‌سازی کنید، سپس از AI بخواهید کد را نقد کند، بعد راه‌حل را بدون کمک AI برای خودتان توضیح دهید و در نهایت از حافظه دوباره بنویسید. مشکل اصلی وابستگی به AI این است که توهم شایستگی (illusion of competence) ایجاد می‌کند: کد کار می‌کند اما شما نمی‌توانید آن را توضیح دهید یا در شرایط جدید تعمیم دهید. برای تأیید پاسخ‌های AI باید همیشه در مقابل مستندات رسمی، اجرای واقعی کد، و RFCها راستی‌آزمایی کنید، چون مدل‌های زبانی می‌توانند با اطمینان کامل جزئیات نادرست (hallucination) تولید کنند، به‌خصوص در نسخه‌های خاص کتابخانه‌ها یا رفتار Edge-case.",

py:"import timeit\n# اندازه‌گیری واقعی زمان اجرا به‌جای اعتماد کورکورانه به ادعای پیچیدگی",
exercise:"یک پاسخ AI دربارهٔ یک تابع پایتون بگیرید و آن را با مستندات رسمی python.org راستی‌آزمایی کنید.",
project:"", resources:[{t:"Anthropic - Prompt engineering overview",u:"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview"}],

interview:["چطور مطمئن می‌شوید کدی که AI تولید کرده درست است؟"],
mistakes:["کپی مستقیم کد AI بدون فهمیدن","استفاده از AI برای دور زدن یادگیری مبانی"],
production:"در تیم‌های حرفه‌ای، مهندسی که نتواند کد تولیدشده توسط AI را توضیح دهد در Code Review رد می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من می‌خواهم یاد بگیرم چطور از AI به‌عنوان ابزار یادگیری استفاده کنم نه جایگزین تفکر. وقتی سؤالی می‌پرسم، ابتدا از من بخواه خودم تلاش کنم، بعد فقط راهنمایی بده، و در پایان از من بخواه راه‌حل را بدون کمک تو توضیح دهم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}

{id:"p1",num:1,title:"مبانی معماری کامپیوتر",icon:"🖥️",summary:"فهم سخت‌افزار زیربنایی: CPU، حافظه، کش و I/O — چرا این‌ها برای بک‌اند مهم‌اند.",
topics:[
{id:"cpu-basics",title:"CPU، رجیسترها و چرخهٔ اجرای دستورات",level:"Beginner",minLadder:1,prereqs:[],
short:"واحد پردازش مرکزی چگونه دستورات ماشین را واکشی، رمزگشایی و اجرا می‌کند.",
deep:"CPU با چرخهٔ Fetch-Decode-Execute کار می‌کند: دستور از حافظه واکشی می‌شود، رمزگشایی می‌شود تا مشخص شود چه عملیاتی باید انجام شود، و سپس روی داده‌های موجود در رجیسترها اجرا می‌شود. رجیسترها سریع‌ترین و کوچک‌ترین واحد ذخیره‌سازی هستند و مستقیماً در ALU (واحد محاسبه و منطق) استفاده می‌شوند. تکنیک‌های مدرن مثل Pipelining (اجرای هم‌زمان مراحل چند دستور)، Branch Prediction (حدس زدن مسیر شرط‌ها قبل از محاسبهٔ واقعی) و Speculative Execution سرعت را بالا می‌برند اما منشأ آسیب‌پذیری‌هایی مثل Spectre/Meltdown هم بوده‌اند. برای مهندس بک‌اند، فهم این‌که CPU مدرن instruction-level parallelism دارد کمک می‌کند بفهمید چرا کد cache-friendly (locality of reference) می‌تواند چند برابر سریع‌تر از کد مشابه با الگوی دسترسی پراکنده به حافظه اجرا شود.",
objectives:["توضیح چرخهٔ fetch-decode-execute","فهم branch prediction و تأثیر آن بر عملکرد کد"],
example:"یک حلقهٔ ساده روی آرایه که به ترتیب پیمایش می‌شود در مقابل پیمایش تصادفی، تفاوت چشمگیر سرعت دارد چون کش CPU بهتر پیش‌بینی می‌کند.",
py:"import time, random\nN=10_000_000\narr=list(range(N))\nt=time.time()\ns=sum(arr[i] for i in range(N))\nprint('sequential', time.time()-t)",
exercise:"با ماژول timeit سرعت پیمایش ترتیبی لیست را با پیمایش با ایندکس‌های شافل‌شده مقایسه کنید.",
project:"", resources:[{t:"CS:APP - Computer Systems (CMU)",u:"https://csapp.cs.cmu.edu/"},{t:"nand2tetris (رایگان)",u:"https://www.nand2tetris.org/"},{t:"CrashCourse Computer Science (YouTube)",u:"https://www.youtube.com/playlist?list=PL8dPuuaLjXtNlUrzyH5r6jN9ulIgZBpdo"}],
criteria:"می‌توانید توضیح دهید چرا دسترسی متوالی به حافظه سریع‌تر از دسترسی پراکنده است.",
interview:["Branch prediction چیست و چرا مهم است؟","چرا CPU مدرن instruction pipeline دارد؟"],
mistakes:["نادیده گرفتن تأثیر cache locality در کد پرفورمنس-حساس"],
production:"در سیستم‌های حساس به تأخیر (مثل موتور تطبیق سفارش در صرافی)، درک این لایه به بهینه‌سازی واقعی کمک می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من در حال یادگیری معماری کامپیوتر برای مهندسی بک‌اند هستم، نه برای طراحی سخت‌افزار. مفاهیم CPU، رجیستر و چرخهٔ اجرا را با تمرکز بر 'چرا برای برنامه‌نویس مهم است' آموزش بده و با مثال‌های عملکردی در پایتون آن را ملموس کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"memory-hierarchy",title:"سلسله‌مراتب حافظه: کش، RAM، دیسک",level:"Intermediate",minLadder:2,prereqs:["cpu-basics"],
short:"چرا داده در سطوح مختلف (L1/L2/L3، RAM، SSD/NVMe) ذخیره می‌شود و چه تفاوت سرعتی دارند.",
deep:"سلسله‌مراتب حافظه بر اساس یک مصالحهٔ بنیادین شکل گرفته: حافظهٔ سریع‌تر گران‌تر و کوچک‌تر است. L1 cache در حدود ۱ نانوثانیه، RAM حدود ۱۰۰ نانوثانیه، SSD NVMe حدود ۱۰۰ میکروثانیه و HDD حدود ۱۰ میلی‌ثانیه تأخیر دارند — یعنی تفاوت چند مرتبهٔ بزرگی. این اعداد (که در جدول معروف 'Latency Numbers Every Programmer Should Know' آمده) توضیح می‌دهند چرا هر بار Page Fault یا I/O دیسک برای یک برنامهٔ بک‌اند فاجعه‌بار است و چرا کش کردن (مثل Redis) این‌قدر مؤثر است: چون RAM را جایگزین دیسک می‌کند. Locality of Reference دو نوع دارد: Temporal (دادهٔ اخیراً استفاده‌شده احتمالاً دوباره استفاده می‌شود) و Spatial (داده‌های نزدیک به هم در حافظه احتمالاً با هم استفاده می‌شوند) — طراحی ایندکس دیتابیس، الگوریتم صفحه‌بندی حافظه و حتی طراحی ساختار داده‌ها (مثل B-Tree به‌جای Binary Tree برای دیسک) مستقیماً از این اصل نشأت می‌گیرد.",
objectives:["به خاطر سپردن مرتبهٔ بزرگی تأخیر هر سطح حافظه","توضیح چرا B-Tree برای دیسک بهتر از Binary Tree است"],
example:"جدول Latency Numbers: L1 cache ~0.5ns, RAM ~100ns, SSD random read ~150μs, HDD seek ~10ms, round trip در همان دیتاسنتر ~0.5ms.",
py:"", exercise:"لیستی با ۱۰ میلیون عنصر بسازید، یک بار پیمایش ترتیبی و یک بار پیمایش با گام‌های بزرگ (مثلاً هر ۶۴ عنصر) انجام دهید و زمان را مقایسه کنید.",
project:"", resources:[{t:"Latency Numbers Every Programmer Should Know",u:"https://gist.github.com/jboner/2841832"},{t:"What Every Programmer Should Know About Memory (Ulrich Drepper, PDF رایگان)",u:"https://people.freebsd.org/~lstewart/articles/cpumemory.pdf"}],
criteria:"می‌توانید توضیح دهید چرا کش کردن در RAM (Redis) هزاران برابر سریع‌تر از خواندن از دیتابیس روی دیسک است.",
interview:["چرا B-Tree برای ایندکس دیتابیس روی دیسک انتخاب می‌شود نه Binary Search Tree؟"],
mistakes:["نادیده گرفتن هزینهٔ واقعی I/O دیسک در طراحی سیستم"],
production:"طراحی صحیح کش (Redis) و ایندکس دیتابیس مستقیماً از فهم این سلسله‌مراتب می‌آید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم سلسله‌مراتب حافظه (cache/RAM/disk) را برایم با تمرکز بر تأثیرش در طراحی سیستم‌های بک‌اند (کشینگ، ایندکس دیتابیس) توضیح بده و از من در مورد اعداد latency تقریبی سؤال بپرس تا حفظ کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p2",num:2,title:"سیستم‌عامل",icon:"🐧",summary:"پردازش، نخ، حافظهٔ مجازی، همروندی و مکانیزم‌های هم‌گام‌سازی.",
topics:[
{id:"process-vs-thread",title:"Process، Thread و Context Switching",level:"Intermediate",minLadder:2,prereqs:["cpu-basics"],
short:"تفاوت پردازش و نخ، و اینکه چرا سوییچ کانتکست هزینه دارد.",
deep:"Process یک نمونهٔ اجراییِ ایزوله از برنامه است با فضای آدرس حافظهٔ مستقل، فایل دیسکریپتورها و شناسهٔ خودش (PID)؛ Thread واحد اجرای کوچک‌تری درون یک Process است که Stack خودش را دارد ولی حافظهٔ Heap و فایل دیسکریپتورها را با سایر نخ‌های همان Process به اشتراک می‌گذارد. سوییچ کانتکست بین Processها گران‌تر از بین Threadها است چون شامل تعویض کامل جدول صفحه (page table) و حافظهٔ مجازی است، در حالی که سوییچ بین Threadها فقط رجیسترها و Stack Pointer را عوض می‌کند. سیستم‌عامل با استفاده از الگوریتم‌های زمان‌بندی (مثل Completely Fair Scheduler در لینوکس) تصمیم می‌گیرد کدام Thread چه زمانی روی CPU اجرا شود. برای مهندس بک‌اند، این مفهوم توضیح می‌دهد چرا مدل‌های worker پروسه‌محور (مثل Gunicorn با چند worker) در برابر خطای یک worker مقاوم‌ترند اما حافظهٔ بیشتری مصرف می‌کنند، در حالی که مدل‌های Thread یا Async سبک‌تر اما نسبت به خطاهای یک تسک آسیب‌پذیرترند.",
objectives:["تمایز Process و Thread از نظر حافظه و ایزولاسیون","توضیح هزینهٔ context switch"],
example:"Gunicorn با پیش‌فرض worker از نوع sync، هر ری‌کوئست را در یک Process جدا مدیریت می‌کند؛ در مقابل Uvicorn با asyncio همه‌چیز در یک Thread رخ می‌دهد.",
py:"import os, threading\nprint('PID:', os.getpid())\ndef worker():\n    print('Thread:', threading.current_thread().name)\nthreading.Thread(target=worker).start()",
exercise:"با ماژول multiprocessing و threading در پایتون، یک تسک CPU-bound را یک‌بار با پروسه و یک‌بار با نخ اجرا کنید و به دلیل GIL تفاوت را مشاهده کنید.",
project:"", resources:[{t:"Linux Kernel Docs - Scheduler",u:"https://www.kernel.org/doc/html/latest/scheduler/index.html"},{t:"OSTEP (رایگان، دانشگاه Wisconsin)",u:"https://pages.cs.wisc.edu/~remzi/OSTEP/"}],
criteria:"می‌توانید توضیح دهید چرا Gunicorn معمولاً با چند worker process اجرا می‌شود نه چند thread.",
interview:["تفاوت Process و Thread چیست؟","Context switching چگونه کار می‌کند و چرا هزینه دارد؟"],
mistakes:["فرض اینکه thread همیشه سریع‌تر از process است"],
production:"انتخاب مدل worker (sync/thread/async) در Gunicorn/Uvicorn مستقیماً بر throughput و resilience سرویس تأثیر دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم Process و Thread و Context Switching را طوری برایم توضیح بده که به تصمیم‌گیری دربارهٔ تنظیمات worker در Gunicorn/Uvicorn برای یک اپلیکیشن Django مرتبط شود. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"concurrency-primitives",title:"Mutex، Semaphore، Race Condition و Deadlock",level:"Advanced",minLadder:4,prereqs:["process-vs-thread"],
short:"ابزارهای هم‌گام‌سازی همروندی و مشکلاتی که بدون آن‌ها رخ می‌دهند.",
deep:"Race Condition زمانی رخ می‌دهد که نتیجهٔ نهایی به ترتیب زمانی اجرای Threadها بستگی داشته باشد، مثلاً دو Thread هم‌زمان یک متغیر مشترک را افزایش دهند و یکی از افزایش‌ها گم شود. Mutex (Mutual Exclusion) تضمین می‌کند فقط یک Thread در هر لحظه به یک بخش بحرانی (critical section) دسترسی دارد. Semaphore عمومی‌تر است و اجازه می‌دهد تا N منبع هم‌زمان مصرف شود (مثلاً محدود کردن تعداد کانکشن‌های هم‌زمان به دیتابیس). Deadlock وقتی رخ می‌دهد که دو یا چند Thread هرکدام منتظر منبعی باشند که Thread دیگر آن را قفل کرده و رها نمی‌کند — چهار شرط کلاسیک Coffman (Mutual Exclusion، Hold and Wait، No Preemption، Circular Wait) باید هم‌زمان برقرار باشند تا Deadlock رخ دهد؛ شکستن هرکدام (مثلاً همیشه قفل‌ها را به یک ترتیب مشخص بگیرید) از آن جلوگیری می‌کند. در پایتون، به‌دلیل GIL، Race Condition روی بایت‌کدهای اتمیک کمتر پیش می‌آید اما همچنان در عملیات مرکب (مثل +=) و در تعامل با دیتابیس (مثل دو تراکنش که هم‌زمان یک ردیف را می‌خوانند و می‌نویسند) کاملاً واقعی است.",
objectives:["تشخیص Race Condition در کد هم‌روند","توضیح چهار شرط لازم برای Deadlock"],
example:"دو تراکنش دیتابیس که هر کدام سعی می‌کنند دو ردیف را به ترتیب معکوس قفل کنند، کلاسیک‌ترین مثال Deadlock در دیتابیس است.",
py:"import threading\nlock = threading.Lock()\ncounter = 0\ndef increment():\n    global counter\n    with lock:\n        counter += 1\nthreads=[threading.Thread(target=increment) for _ in range(1000)]\n[t.start() for t in threads]; [t.join() for t in threads]\nprint(counter)",
exercise:"کد بالا را بدون lock اجرا کنید و مشاهده کنید نتیجه گاهی کمتر از ۱۰۰۰ می‌شود؛ سپس با threading.Lock رفعش کنید.",
project:"", resources:[{t:"Python threading docs",u:"https://docs.python.org/3/library/threading.html"},{t:"OSTEP - Concurrency (رایگان)",u:"https://pages.cs.wisc.edu/~remzi/OSTEP/#concurrency"}],
criteria:"می‌توانید یک Race Condition واقعی در کد پایتون بسازید، آن را با ابزار مناسب (Lock/Semaphore) رفع کنید و دلیل رفع را توضیح دهید.",
interview:["Deadlock چیست و چه شرایطی باعث آن می‌شود؟","تفاوت Mutex و Semaphore چیست؟","چرا در پایتون با وجود GIL باز هم Race Condition ممکن است؟"],
mistakes:["فرض غلط که GIL همهٔ مشکلات همروندی را حل می‌کند","قفل گرفتن به ترتیب متفاوت در بخش‌های مختلف کد که منجر به Deadlock می‌شود"],
production:"Deadlock در سطح دیتابیس یکی از رایج‌ترین اینسیدنت‌های تولید در سیستم‌های با تراکنش‌های همزمان بالاست (مثل سیستم‌های مالی).",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من می‌خواهم Race Condition، Deadlock، Mutex و Semaphore را عمیق یاد بگیرم. مثال‌های واقعی در پایتون برایم بساز که در آن‌ها Race Condition رخ دهد، از من بخواه قبل از دیدن جواب حدس بزنم چه اتفاقی می‌افتد، و بعد راه‌حل صحیح را با من بررسی کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"virtual-memory",title:"حافظهٔ مجازی، Paging و Page Fault",level:"Advanced",minLadder:4,prereqs:["memory-hierarchy"],
short:"چگونه سیستم‌عامل توهم حافظهٔ نامحدود و ایزوله برای هر Process ایجاد می‌کند.",
deep:"هر Process فضای آدرس مجازی خودش را می‌بیند که توسط MMU (Memory Management Unit) به آدرس‌های فیزیکی RAM نگاشت می‌شود، از طریق جدول صفحه (Page Table). این نگاشت اجازه می‌دهد چند Process بدون تداخل در حافظهٔ یکدیگر اجرا شوند و امکان Swapping (انتقال صفحات کم‌استفاده به دیسک) را فراهم می‌کند. Page Fault زمانی رخ می‌دهد که Process به صفحه‌ای دسترسی پیدا کند که در حال حاضر در RAM نیست (یا اصلاً هنوز تخصیص نیافته)؛ سیستم‌عامل آن را از دیسک بارگذاری می‌کند که هزاران برابر کندتر از دسترسی مستقیم RAM است. وقتی حافظهٔ فیزیکی کم باشد و سیستم مدام صفحات را Swap کند، پدیدهٔ Thrashing رخ می‌دهد که عملکرد سیستم را به‌شدت فلج می‌کند — این دقیقاً همان چیزی است که در سرورهای تولید هنگام OOM (Out of Memory) نزدیک اتفاق می‌افتد. cgroups در لینوکس (که پایهٔ Docker و Kubernetes است) با محدود کردن حافظهٔ قابل‌دسترس هر Container، از این پدیده در سطح میزبان جلوگیری می‌کند اما در داخل Container، اگر برنامه از حد مجاز عبور کند، OOM Killer آن را می‌کشد.",
objectives:["توضیح نگاشت حافظهٔ مجازی به فیزیکی","تشخیص علائم Thrashing و OOM"],
example:"وقتی یک Pod در Kubernetes از memory limit عبور می‌کند، کرنل با OOM Killer پروسه را Kill می‌کند و Pod با کد خروج ۱۳۷ ری‌استارت می‌شود.",
py:"import resource\nprint(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)  # حداکثر حافظهٔ مصرفی فرآیند",
exercise:"با دستور free -h و vmstat 1 در لینوکس وضعیت حافظه و صفحه‌بندی سیستم خود را مشاهده کنید.",
project:"", resources:[{t:"OSTEP - Virtual Memory (رایگان)",u:"https://pages.cs.wisc.edu/~remzi/OSTEP/#virtualization"},{t:"cgroups v2 - kernel docs",u:"https://docs.kernel.org/admin-guide/cgroup-v2.html"}],
criteria:"می‌توانید توضیح دهید چرا Pod در Kubernetes با کد خطای 137 ری‌استارت می‌شود.",
interview:["Page Fault چیست و چه زمانی رخ می‌دهد؟","OOM Killer چگونه تصمیم می‌گیرد کدام پروسه را بکشد؟"],
mistakes:["تنظیم نکردن memory limit برای container که منجر به OOM غیرقابل‌پیش‌بینی می‌شود"],
production:"تنظیم صحیح requests/limits حافظه در Kubernetes مستقیماً از فهم Paging و OOM Killer می‌آید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم حافظهٔ مجازی، Page Fault و OOM Killer را طوری توضیح بده که به من کمک کند تنظیمات memory request/limit در Kubernetes را درست انتخاب کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

topics:[
{id:"linux-filesystem",title:"فایل‌سیستم لینوکس، inode و مجوزها",level:"Beginner",minLadder:1,prereqs:[],
short:"ساختار فایل‌سیستم لینوکس، inode، لینک‌ها و مدل مجوز.",
deep:"در لینوکس هر فایل یک inode دارد که متادیتای آن (اندازه، مالک، مجوزها، زمان‌ها، اشاره‌گر به بلوک‌های داده) را نگه می‌دارد؛ نام فایل صرفاً یک ورودی در دایرکتوری است که به یک inode اشاره می‌کند — به همین دلیل چند نام (Hard Link) می‌توانند به یک inode اشاره کنند و حذف یک نام، داده را از بین نمی‌برد تا زمانی‌که شمارندهٔ لینک به صفر برسد. Symbolic Link برخلاف Hard Link، یک فایل جداگانه است که فقط مسیر را نگه می‌دارد. مدل مجوز کلاسیک یونیکس (owner/group/other × read/write/execute) با bit‌های خاص مثل setuid و sticky bit تکمیل می‌شود. برای مهندس بک‌اند، فهم اینکه 'حذف' یک فایل باز روی لینوکس بلافاصله فضا را آزاد نمی‌کند (بلکه وقتی همهٔ فرآیندها آن را بستند) توضیح می‌دهد چرا لاگ‌فایل‌های حذف‌شده اما هنوز باز، می‌توانند دیسک را پر نگه دارند — یک اینسیدنت رایج در تولید.",
objectives:["توضیح تفاوت Hard Link و Symbolic Link","توضیح چرا دیسک پر می‌ماند وقتی فایل حذف شده اما فضا آزاد نشده"],
example:"وقتی nginx به یک فایل لاگ می‌نویسد و شما آن را rm می‌کنید بدون logrotate، فضای دیسک آزاد نمی‌شود تا nginx ری‌استارت شود چون فایل دسکریپتور هنوز باز است.",
py:"", exercise:"با دستورات ls -li، stat و df -h رفتار inode و فضای دیسک را در یک ماشین لینوکس (یا کانتینر) بررسی کنید. یک فایل بزرگ بسازید، آن را در حال باز بودن یک پروسه حذف کنید و مشاهده کنید df همچنان فضا را اشغال‌شده نشان می‌دهد.",
project:"", resources:[{t:"Linux Filesystem Hierarchy Standard",u:"https://refspecs.linuxfoundation.org/FHS_3.0/fhs-3.0.html"},{t:"The Linux Command Line (رایگان، PDF)",u:"https://linuxcommand.org/tlcl.php"}],
criteria:"می‌توانید توضیح دهید چرا حذف یک فایل لاگ باز، فضای دیسک را فوراً آزاد نمی‌کند و چگونه آن را رفع کنید.",
interview:["تفاوت Hard Link و Symbolic Link چیست؟","چرا df و du گاهی اعداد متفاوتی نشان می‌دهند؟"],
mistakes:["استفاده از rm روی لاگ‌فایل باز به‌جای logrotate یا truncate"],
production:"'دیسک پر است اما هیچ فایل بزرگی پیدا نمی‌کنم' یکی از کلاسیک‌ترین اینسیدنت‌های SRE است که ریشه‌اش در همین مفهوم است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفاهیم inode، Hard Link، Symbolic Link و مدیریت فضای دیسک در لینوکس را طوری توضیح بده که سناریوی واقعی «دیسک پر شده ولی du فایل بزرگی نشان نمی‌دهد» را بتوانم دیباگ کنم، و بعد از توضیح یک سناریوی مشابه به من بده تا حلش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-process-tools",title:"ابزارهای مانیتورینگ و عیب‌یابی پردازش (ps, top, strace, lsof)",level:"Intermediate",minLadder:2,prereqs:["linux-filesystem","process-vs-thread"],
short:"ابزارهای خط فرمان برای مشاهدهٔ وضعیت زندهٔ سیستم و عیب‌یابی مشکلات عملکردی.",
deep:"top/htop مصرف لحظه‌ای CPU و حافظه را نشان می‌دهند؛ ps aux لیست پروسه‌ها را نمایش می‌دهد؛ lsof -p PID فایل‌ها و سوکت‌های باز یک پروسه را نشان می‌دهد که برای پیدا کردن file descriptor leak یا کانکشن‌های آویزان حیاتی است؛ strace -p PID سیستم‌کال‌های واقعی که یک پروسه صادر می‌کند را نشان می‌دهد و برای فهمیدن اینکه یک پروسهٔ 'گیر کرده' دقیقاً منتظر چه چیزی است (مثلاً read روی یک سوکت) بی‌نظیر است؛ vmstat و iostat وضعیت حافظه و I/O دیسک را در طول زمان نشان می‌دهند. یک روش استاندارد عیب‌یابی: وقتی سرویسی کند شده، ابتدا top برای دیدن CPU/Memory، سپس vmstat 1 برای دیدن اگر CPU منتظر I/O است (ستون wa)، سپس iostat -x 1 برای دیدن دیسک کدام دستگاه درگیر است، و در نهایت strace یا perf برای عمیق‌تر شدن.",
objectives:["استفاده از strace برای فهمیدن اینکه پروسه منتظر چیست","استفاده از lsof برای پیدا کردن file descriptor leak"],
example:"اگر یک پروسهٔ پایتون هزاران فایل باز کرده و نبسته، lsof -p PID | wc -l تعداد آن‌ها را نشان می‌دهد و به شما می‌گوید 'Too many open files' از کجا می‌آید.",
py:"import resource\nprint(resource.getrlimit(resource.RLIMIT_NOFILE))  # محدودیت تعداد فایل دیسکریپتور باز",
exercise:"یک اسکریپت پایتون بنویسید که عمداً فایل دیسکریپتور لیک کند (فایل باز می‌کند و نمی‌بندد)، سپس با lsof رشد تعداد فایل‌های باز آن را رصد کنید.",
project:"", resources:[{t:"Brendan Gregg - Linux Performance",u:"https://www.brendangregg.com/linuxperf.html"},{t:"strace man page",u:"https://man7.org/linux/man-pages/man1/strace.1.html"}],
criteria:"در یک سناریوی 'سرویس گیر کرده' می‌توانید با ترکیب top/strace/lsof علت را در چند دقیقه پیدا کنید.",
interview:["strace چیست و چه زمانی استفاده می‌شود؟","چطور file descriptor leak را در تولید تشخیص می‌دهید؟"],
mistakes:["اجرای strace روی سرویس پرترافیک تولید بدون آگاهی از overhead آن"],
production:"'Too many open files' یک اینسیدنت رایج در سرویس‌های بک‌اند است که ریشه‌اش نبستن فایل/کانکشن است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. می‌خواهم ابزارهای عیب‌یابی لینوکس (top, ps, lsof, strace, vmstat, iostat) را در قالب سناریوهای واقعی SRE یاد بگیرم. یک سناریوی 'سرویس کند شده' طراحی کن و مرا قدم‌به‌قدم راهنمایی کن کدام ابزار را کِی استفاده کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"linux-networking-tools",title:"ابزارهای شبکه: ss, tcpdump, dig, curl",level:"Intermediate",minLadder:2,prereqs:["linux-process-tools"],
short:"عیب‌یابی مشکلات شبکه از لایهٔ DNS تا TCP با ابزارهای خط فرمان.",
deep:"dig/nslookup برای عیب‌یابی DNS استفاده می‌شوند (آیا نام دامنه حل می‌شود؟ کدام سرور اقتدار پاسخ می‌دهد؟)؛ curl -v برای دیدن کامل چرخهٔ HTTP شامل هدرها و زمان‌بندی؛ ss -tulnp (جایگزین مدرن netstat) پورت‌های باز و کانکشن‌های TCP/UDP را نشان می‌دهد؛ tcpdump بسته‌های واقعی شبکه را capture می‌کند و برای دیدن اینکه آیا بسته‌ها اصلاً به سرور می‌رسند یا نه، یا آیا TLS handshake موفق است، حیاتی است. یک تکنیک کلیدی SRE: وقتی یک سرویس نمی‌تواند به سرویس دیگری متصل شود، ابتدا با dig بررسی کنید DNS درست resolve می‌شود، سپس با curl -v اتصال HTTP را تست کنید، و اگر مشکوک به مشکل شبکهٔ پایین‌تر بودید (مثل firewall)، با tcpdump ببینید آیا SYN packet اصلاً پاسخ SYN-ACK می‌گیرد یا خیر — این به شما می‌گوید مشکل در برنامه است یا در شبکه.",
objectives:["تشخیص اینکه مشکل اتصال در DNS، TCP یا اپلیکیشن است","خواندن خروجی tcpdump برای TCP handshake"],
example:"curl -v https://example.com نشان می‌دهد آیا DNS resolve شد، TCP connect چقدر طول کشید، TLS handshake موفق بود یا نه، و زمان دریافت هدرهای پاسخ.",
py:"import socket\ntry:\n    print(socket.gethostbyname('example.com'))\nexcept socket.gaierror as e:\n    print('DNS failed:', e)",
exercise:"با tcpdump -i any port 443 -c 20 یک درخواست HTTPS واقعی را رصد کنید و SYN/SYN-ACK/ACK را در خروجی پیدا کنید.",
project:"", resources:[{t:"tcpdump man page",u:"https://www.tcpdump.org/manpages/tcpdump.1.html"},{t:"ss(8) man page",u:"https://man7.org/linux/man-pages/man8/ss.8.html"}],
criteria:"می‌توانید در یک سناریوی 'سرویس A نمی‌تواند به سرویس B متصل شود' با ترکیب dig/curl/tcpdump لایهٔ مشکل را مشخص کنید.",
interview:["چطور تشخیص می‌دهید مشکل اتصال، DNS است یا TCP یا برنامه؟"],
mistakes:["فرض کردن مشکل در کد اپلیکیشن قبل از بررسی لایه‌های شبکه پایین‌تر"],
production:"در محیط‌های Kubernetes، بسیاری از مشکلات اتصال ریشه در DNS (CoreDNS) یا Network Policy دارند نه کد برنامه.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ابزارهای شبکهٔ لینوکس (dig, curl -v, ss, tcpdump) را در قالب چند سناریوی واقعی 'سرویس نمی‌تواند متصل شود' به من آموزش بده و از من بخواه لایهٔ مشکل (DNS/TCP/TLS/App) را تشخیص دهم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p4",num:4,title:"برنامه‌نویسی پایتون",icon:"🐍",summary:"از مبانی زبان تا مفاهیم پیشرفته: async، GIL، مدیریت حافظه و CPython.",
topics:[
{id:"py-oop-typing",title:"OOP، Typing و Dataclasses در پایتون",level:"Beginner",minLadder:1,prereqs:[],
short:"شیءگرایی، تایپ‌های ایستا (type hints) و dataclass برای کد قابل نگهداری.",
deep:"پایتون OOP کلاسیک (وراثت، ترکیب، چندریختی) را پشتیبانی می‌کند اما فرهنگ مدرن پایتون Composition over Inheritance و Protocol-based typing (duck typing رسمی‌شده با typing.Protocol) را ترجیح می‌دهد. Type Hints (PEP 484) نوع را در زمان اجرا اجبار نمی‌کنند اما با ابزارهایی مثل mypy یا pyright بررسی ایستا انجام می‌شود و خطاهای زیادی قبل از اجرا کشف می‌شوند. dataclasses (PEP 557) کدهای boilerplate مثل __init__ و __repr__ را خودکار می‌سازند و برای مدل‌سازی داده (نه رفتار پیچیده) ایده‌آل‌اند. یک نکتهٔ مهم برای مهندس ارشد: در Django، مدل‌ها ORM-محورند نه dataclass، اما برای DTOها (Data Transfer Objects) بین لایه‌های سرویس، dataclass یا pydantic گزینهٔ بهتری است تا وابستگی به ORM در لایهٔ منطق کسب‌وکار نشت نکند.",
objectives:["استفادهٔ صحیح از type hints برای مستندسازی و بررسی ایستا","تشخیص کجا composition بهتر از inheritance است"],
example:"from dataclasses import dataclass\n@dataclass\nclass Money:\n    amount: int\n    currency: str",
py:"from dataclasses import dataclass\nfrom typing import Protocol\n\nclass Notifier(Protocol):\n    def send(self, msg: str) -> None: ...\n\n@dataclass(frozen=True)\nclass Money:\n    amount_cents: int\n    currency: str\n    def __add__(self, other: 'Money') -> 'Money':\n        if self.currency != other.currency:\n            raise ValueError('ارز متفاوت')\n        return Money(self.amount_cents + other.amount_cents, self.currency)",
exercise:"یک کلاس Money با dataclass(frozen=True) بسازید که جمع دو مبلغ با ارز متفاوت را رد کند؛ سپس با mypy بررسی تایپ آن را اجرا کنید.",
project:"سرویس ساده مدیریت کیف‌پول با کلاس‌های Money، Wallet و Transaction با استفاده از dataclass و Protocol.",
resources:[{t:"Python typing docs",u:"https://docs.python.org/3/library/typing.html"},{t:"Real Python - Dataclasses",u:"https://realpython.com/python-data-classes/"},{t:"mypy",u:"https://mypy-lang.org/"}],
criteria:"می‌توانید یک ماژول پایتون با type hint کامل بنویسید که mypy بدون خطا آن را تأیید کند.",
interview:["Type hints در پایتون در زمان اجرا اجبار می‌شوند یا نه؟ چرا؟","تفاوت dataclass و کلاس معمولی چیست؟"],
mistakes:["استفادهٔ mutable default argument در dataclass بدون field(default_factory=...)"],
production:"استفادهٔ منظم از type hint در سرویس‌های بزرگ Django باعث کاهش چشمگیر باگ‌های ناشی از نوع نادرست داده می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من در حال یادگیری OOP، Type Hints و dataclass در پایتون هستم، در سطح {مبتدی/متوسط}. مثال‌های واقعی مرتبط با یک سیستم مالی (کیف پول، تراکنش) برایم بساز و بعد از هر مثال یک باگ عمدی در تایپ بگذار تا من با mypy پیدا کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"py-generators-async",title:"Generator، Coroutine و Event Loop",level:"Advanced",minLadder:4,prereqs:["py-oop-typing","process-vs-thread"],
short:"چگونه async/await در پایتون به‌صورت غیرمسدودکننده I/O را مدیریت می‌کند.",
deep:"Generator با yield اجرای تابع را متوقف و بعداً از همان نقطه ادامه می‌دهد و پایهٔ حافظه‌کارآمد پردازش دنباله‌های بزرگ است. Coroutine (با async def) تعمیم همین ایده برای I/O غیرمسدودکننده است: وقتی یک coroutine به await می‌رسد (مثلاً منتظر پاسخ شبکه)، کنترل را به Event Loop برمی‌گرداند تا کارهای دیگر اجرا شوند، و وقتی I/O آماده شد Event Loop اجرای coroutine را از همان نقطه ادامه می‌دهد. این مدل تک‌نخی (single-threaded) اجازه می‌دهد هزاران اتصال هم‌زمان بدون هزینهٔ سنگین Thread مدیریت شوند (مدل معروف C10K) — دلیل اصلی استفاده از ASGI/Uvicorn برای WebSocket و APIهای با I/O سنگین. نکتهٔ کلیدی: async فقط برای I/O-bound مفید است؛ برای CPU-bound (مثل پردازش تصویر) باید از multiprocessing استفاده کرد چون GIL اجازهٔ اجرای واقعی موازی بایت‌کد پایتون روی چند هستهٔ CPU را نمی‌دهد. یک اشتباه رایج، فراخوانی یک تابع sync مسدودکننده (مثل requests.get) داخل کد async است که کل Event Loop را فریز می‌کند.",
objectives:["توضیح تفاوت Generator و Coroutine","تشخیص I/O-bound در برابر CPU-bound برای انتخاب async یا multiprocessing"],
example:"async def fetch(session, url):\n    async with session.get(url) as resp:\n        return await resp.text()",
py:"import asyncio\nimport time\n\nasync def fetch(i):\n    await asyncio.sleep(1)  # شبیه‌سازی I/O شبکه\n    return i\n\nasync def main():\n    start = time.time()\n    results = await asyncio.gather(*[fetch(i) for i in range(10)])\n    print('elapsed:', time.time()-start)  # حدود ۱ ثانیه، نه ۱۰\n\nasyncio.run(main())",
exercise:"کد بالا را اجرا کنید و ببینید ۱۰ تسک هم‌زمان در حدود ۱ ثانیه تمام می‌شوند؛ سپس یک تابع time.sleep (مسدودکننده) به‌جای asyncio.sleep داخل یکی از تسک‌ها بگذارید و ببینید چطور کل event loop بلاک می‌شود.",
project:"یک fetcher async بسازید که ۵۰ URL را هم‌زمان با aiohttp دریافت کند و زمان را با نسخهٔ sync (requests) مقایسه کنید.",
resources:[{t:"Python asyncio docs",u:"https://docs.python.org/3/library/asyncio.html"},{t:"Real Python - Async IO",u:"https://realpython.com/async-io-python/"},{t:"David Beazley - Generators (رایگان)",u:"https://www.dabeaz.com/generators/"}],
criteria:"می‌توانید توضیح دهید چرا فراخوانی یک تابع sync مسدودکننده داخل async def مشکل‌ساز است و آن را با run_in_executor رفع کنید.",
interview:["Event Loop چگونه کار می‌کند؟","چرا GIL مانع موازی‌سازی واقعی CPU-bound نمی‌شود ولی برای I/O-bound مشکلی ایجاد نمی‌کند؟","تفاوت asyncio.gather و asyncio.wait چیست؟"],
mistakes:["فراخوانی کد sync مسدودکننده داخل تابع async","استفاده از async برای تسک‌های CPU-bound بدون بهبود واقعی عملکرد"],
production:"سرویس‌های Django با ASGI (مثل چت یا اعلان‌های real-time) از این مدل برای مدیریت هزاران کانکشن هم‌زمان استفاده می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. می‌خواهم async/await، Event Loop و تفاوت آن با Thread/Process را در پایتون عمیق یاد بگیرم. مثال‌هایی با aiohttp بساز، از من بخواه پیش‌بینی کنم زمان اجرا چقدر خواهد بود، و بعد اشتباه رایج 'blocking call در async' را در کد من پیدا کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"py-memory-gc",title:"مدیریت حافظه، Reference Counting و Garbage Collector",level:"Expert",minLadder:5,prereqs:["py-generators-async","memory-hierarchy"],
short:"CPython چگونه حافظهٔ اشیاء را مدیریت می‌کند و چرا نشت حافظه در پایتون هم ممکن است.",
deep:"CPython اصلی‌ترین مکانیزم مدیریت حافظه‌اش Reference Counting است: هر شیء شمارنده‌ای دارد که تعداد ارجاعات به آن را نگه می‌دارد و وقتی به صفر برسد، حافظه بلافاصله آزاد می‌شود. این روش نمی‌تواند چرخه‌های ارجاعی (Reference Cycles، مثل دو شیء که به هم اشاره می‌کنند) را پاک کند، بنابراین CPython یک Garbage Collector مکمل نسلی (Generational GC) دارد که به‌صورت دوره‌ای اشیاء درگیر در چرخه را شناسایی و آزاد می‌کند. نشت حافظه در پایتون معمولاً از نگه‌داشتن ناخواستهٔ ارجاع (مثلاً یک cache global که هرگز پاک نمی‌شود، یا closures/signals در Django که reference نگه می‌دارند) ناشی می‌شود، نه از باگ در خود GC. ابزارهایی مثل tracemalloc و gc.get_objects() برای تشخیص نشت حافظه در پروداکشن استفاده می‌شوند. یک نکتهٔ مهم برای Django: نگه‌داشتن Queryset‌های بزرگ در حافظه یا استفاده از سیگنال‌هایی که به اشیاء بزرگ ارجاع نگه می‌دارند، از دلایل رایج رشد تدریجی حافظهٔ یک worker Gunicorn در طول زمان است.",
objectives:["توضیح تفاوت Reference Counting و Generational GC","استفاده از tracemalloc برای یافتن نشت حافظه"],
example:"import gc\ngc.collect()  # اجرای دستی جمع‌آوری زباله برای اشیاء درگیر در چرخهٔ ارجاعی",
py:"import tracemalloc\ntracemalloc.start()\n# ... کد مشکوک به نشت حافظه ...\nsnapshot = tracemalloc.take_snapshot()\ntop_stats = snapshot.statistics('lineno')\nfor stat in top_stats[:5]:\n    print(stat)",
exercise:"یک اسکریپت بنویسید که عمداً یک لیست global را در هر درخواست بزرگ‌تر کند (نشت حافظه شبیه‌سازی‌شده) و با tracemalloc رشد حافظه را ردیابی کنید.",
project:"", resources:[{t:"CPython Memory Management docs",u:"https://docs.python.org/3/c-api/memory.html"},{t:"tracemalloc docs",u:"https://docs.python.org/3/library/tracemalloc.html"}],
criteria:"می‌توانید یک نشت حافظهٔ شبیه‌سازی‌شده در یک اسکریپت پایتون را با tracemalloc پیدا کنید.",
interview:["چرا Reference Counting به‌تنهایی کافی نیست و به Generational GC هم نیاز داریم؟","چطور نشت حافظه در یک سرویس پایتون طولانی‌مدت (long-running) را دیباگ می‌کنید؟"],
mistakes:["نگه‌داشتن ناخواستهٔ ارجاع در کش‌های global یا سیگنال‌های Django"],
production:"'حافظهٔ worker Gunicorn به‌تدریج رشد می‌کند تا OOM می‌شود' یک اینسیدنت کلاسیک است که با tracemalloc و بررسی سیگنال‌ها/کش‌های global رفع می‌شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدیریت حافظهٔ CPython (Reference Counting و Generational GC) را برایم توضیح بده و بعد یک سناریوی نشت حافظهٔ واقعی در یک اپلیکیشن Django طراحی کن که من با tracemalloc آن را پیدا کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p5",num:5,title:"ساختمان داده",icon:"🌳",summary:"از آرایه تا B+Tree و LSM Tree — پیاده‌سازی، پیچیدگی و کاربرد واقعی در بک‌اند.",
topics:[
{id:"ds-hash-table",title:"Hash Table",level:"Intermediate",minLadder:2,prereqs:[],
short:"ساختار داده‌ای که با تابع هش، دسترسی میانگین O(1) به مقدار می‌دهد.",
deep:"Hash Table مقدار کلید را با یک تابع هش به یک اندیس در آرایهٔ داخلی نگاشت می‌دهد. برخورد (Collision) وقتی دو کلید متفاوت به یک اندیس نگاشت شوند رخ می‌دهد و با دو روش اصلی مدیریت می‌شود: Separate Chaining (هر خانه یک لیست پیوندی از عناصر برخوردکننده نگه می‌دارد) یا Open Addressing (به‌دنبال خانهٔ خالی بعدی می‌گردد). عملکرد میانگین O(1) است اما در بدترین حالت (مثلاً همهٔ کلیدها برخورد کنند) می‌تواند به O(n) برسد؛ Load Factor (نسبت تعداد عناصر به اندازهٔ جدول) بالا باعث افزایش برخورد و کاهش عملکرد می‌شود، به همین دلیل Hash Tableها هنگام پر شدن Resize (معمولاً دو برابر) می‌شوند. dict در پایتون از یک Hash Table بهینه‌شده استفاده می‌کند و از پایتون ۳.۷ به بعد ترتیب درج را هم حفظ می‌کند. در بک‌اند، Hash Index در دیتابیس‌ها (متفاوت از B-Tree Index) برای جستجوی برابری (equality) بسیار سریع است اما از Range Query پشتیبانی نمی‌کند، و Redis اساساً یک Hash Table توزیع‌شدهٔ در حافظه است.",
objectives:["توضیح مکانیزم برخورد و Load Factor","تشخیص چه زمانی Hash Index بهتر از B-Tree Index است"],
example:"یک دیکشنری پایتون {user_id: user_object} برای دسترسی O(1) میانگین به کاربر بر اساس شناسه.",
py:"class SimpleHashTable:\n    def __init__(self, size=8):\n        self.size = size\n        self.buckets = [[] for _ in range(size)]\n    def _hash(self, key):\n        return hash(key) % self.size\n    def put(self, key, value):\n        idx = self._hash(key)\n        for i, (k, v) in enumerate(self.buckets[idx]):\n            if k == key:\n                self.buckets[idx][i] = (key, value)\n                return\n        self.buckets[idx].append((key, value))\n    def get(self, key):\n        idx = self._hash(key)\n        for k, v in self.buckets[idx]:\n            if k == key:\n                return v\n        raise KeyError(key)",
exercise:"پیاده‌سازی بالا را با Separate Chaining کامل کنید و متد resize را طوری اضافه کنید که وقتی Load Factor از 0.75 عبور کرد، اندازهٔ جدول دو برابر شود.",
project:"", resources:[{t:"Python dict implementation (CPython source)",u:"https://github.com/python/cpython/blob/main/Objects/dictobject.c"},{t:"MIT 6.006 - Hashing (رایگان)",u:"https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"}],
criteria:"می‌توانید یک Hash Table با Separate Chaining و Resize خودکار از صفر پیاده‌سازی کنید.",
interview:["Hash Table در بدترین حالت چه پیچیدگی زمانی دارد و چرا؟","Hash Index در PostgreSQL چه محدودیتی نسبت به B-Tree دارد؟"],
mistakes:["استفاده از Hash Index برای کوئری‌های Range در دیتابیس"],
production:"Redis اساساً یک Hash Table توزیع‌شده در حافظه است؛ فهم برخورد و Load Factor به فهم رفتار آن کمک می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. می‌خواهم Hash Table را از صفر در پایتون پیاده‌سازی کنم، شامل مدیریت Collision و Resize خودکار. مرا قدم‌به‌قدم راهنمایی کن، اول بدون دیدن کد کامل تلاش کنم و بعد کد من را بررسی و اشکالات را نشان بده. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"ds-btree",title:"B-Tree و B+Tree",level:"Advanced",minLadder:4,prereqs:["ds-hash-table","memory-hierarchy"],
short:"ساختار داده‌ای درختی بهینه‌شده برای دیسک که پایهٔ ایندکس اکثر دیتابیس‌های رابطه‌ای است.",
deep:"برخلاف Binary Search Tree که هر گره فقط دو فرزند دارد، B-Tree هر گره می‌تواند صدها کلید و فرزند داشته باشد (fan-out بالا)، که ارتفاع درخت را برای میلیون‌ها رکورد به تنها ۳ یا ۴ سطح می‌رساند. این طراحی مستقیماً از مفهوم سلسله‌مراتب حافظه نشأت می‌گیرد: هر گره B-Tree معمولاً به‌اندازهٔ یک صفحهٔ دیسک (مثلاً ۴ یا ۸ کیلوبایت) طراحی می‌شود، پس هر خواندن گره تنها یک I/O دیسک است؛ در نتیجه جستجو در میلیون‌ها رکورد فقط به ۳-۴ خواندن دیسک نیاز دارد، نه لگاریتم پایه ۲ عمق یک Binary Tree که می‌تواند ده‌ها سطح باشد. B+Tree (که PostgreSQL و MySQL InnoDB واقعاً از آن استفاده می‌کنند) تفاوت کلیدی دارد: تمام دادهٔ واقعی فقط در برگ‌ها (leaf nodes) ذخیره می‌شود و برگ‌ها به‌صورت لیست پیوندی به هم متصل‌اند، که Range Query (مثل BETWEEN یا ORDER BY) را بسیار کارآمد می‌کند چون بعد از پیدا کردن نقطهٔ شروع، فقط باید برگ‌ها را به ترتیب پیمایش کرد. این دقیقاً دلیل این است که ایندکس پیش‌فرض PostgreSQL از نوع B-Tree است.",
objectives:["توضیح چرا B-Tree برای دیسک بهینه است نه Binary Tree","توضیح تفاوت B-Tree و B+Tree برای Range Query"],
example:"CREATE INDEX idx_users_email ON users(email); در پستگرس به‌صورت پیش‌فرض یک B-Tree Index می‌سازد که هم برای = و هم برای BETWEEN/ORDER BY کارآمد است.",
py:"# پیاده‌سازی ساده‌شدهٔ یک گرهٔ B-Tree (مفهومی، نه کامل)\nclass BTreeNode:\n    def __init__(self, leaf=True, t=3):\n        self.leaf = leaf\n        self.keys = []\n        self.children = []\n        self.t = t  # حداقل درجه\n    def is_full(self):\n        return len(self.keys) == 2 * self.t - 1",
exercise:"با EXPLAIN (ANALYZE) در PostgreSQL روی یک جدول با ایندکس B-Tree، تفاوت Index Scan و Seq Scan را برای یک کوئری Range مشاهده کنید.",
project:"", resources:[{t:"CMU Database Systems - B+Trees (رایگان، YouTube)",u:"https://www.youtube.com/watch?v=DoR58zSJJvQ"},{t:"Use The Index, Luke!",u:"https://use-the-index-luke.com/"}],
criteria:"می‌توانید توضیح دهید چرا یک B-Tree با فن‌اوت بالا برای دیسک بهتر از Binary Search Tree است و چرا B+Tree برای Range Query بهتر از B-Tree ساده است.",
interview:["چرا دیتابیس‌ها از B-Tree استفاده می‌کنند نه Binary Search Tree؟","تفاوت B-Tree و B+Tree چیست؟","LSM Tree چه تفاوتی با B-Tree دارد و کِی بهتر است؟"],
mistakes:["ساخت ایندکس‌های زیاد و غیرضروری که هزینهٔ نوشتن را بالا می‌برد بدون فهم ساختار داخلی"],
production:"تصمیم دربارهٔ اینکه چه ستون‌هایی ایندکس شوند مستقیماً وابسته به فهم B+Tree و هزینهٔ نگهداری آن در نوشتن است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. می‌خواهم بفهمم چرا دیتابیس‌ها از B+Tree برای ایندکس استفاده می‌کنند نه Binary Search Tree یا Hash Table. با تصویرسازی مفهومی (متن) و مثال EXPLAIN ANALYZE در PostgreSQL توضیح بده و در پایان چند سؤال مفهومی از من بپرس. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"ds-lsm-tree",title:"LSM Tree",level:"Expert",minLadder:5,prereqs:["ds-btree"],
short:"ساختار داده‌ای بهینه برای نوشتن سنگین، پایهٔ Cassandra، RocksDB و بسیاری دیتابیس‌های NoSQL مدرن.",
deep:"LSM Tree (Log-Structured Merge-Tree) به‌جای به‌روزرسانی درجا (in-place update) مثل B-Tree، نوشته‌ها را ابتدا در حافظه (Memtable، معمولاً یک ساختار مرتب مثل Skip List) جمع می‌کند و به‌صورت متوالی (sequential write که روی دیسک/SSD بسیار سریع‌تر از random write است) به فایل‌های تغییرناپذیر روی دیسک به نام SSTable (Sorted String Table) تخلیه می‌کند. با گذر زمان، فرآیند Compaction در پس‌زمینه SSTableهای کوچک را ادغام می‌کند، رکوردهای تکراری/حذف‌شده (با نشانهٔ Tombstone) را پاک می‌کند و SSTableهای بزرگ‌تر و مرتب‌شده می‌سازد. این طراحی نوشتن را بسیار سریع می‌کند (چون نوشتن تصادفی دیسک را با نوشتن متوالی جایگزین می‌کند) اما خواندن ممکن است کندتر باشد چون باید چند SSTable و Memtable بررسی شود؛ Bloom Filter برای هر SSTable ساخته می‌شود تا سریع بگوید یک کلید قطعاً در آن SSTable نیست و از خواندن غیرضروری دیسک جلوگیری کند. Cassandra، RocksDB، LevelDB و بسیاری دیتابیس‌های Write-heavy از این معماری استفاده می‌کنند؛ تصمیم بین B-Tree و LSM Tree اساساً یک مصالحهٔ Read-Write است: اگر Workload شما Write-heavy است (مثل ثبت لاگ یا متریک) LSM Tree برتری دارد، اگر Read-heavy با کوئری‌های پیچیده است، B-Tree (PostgreSQL) بهتر است.",
objectives:["توضیح چرخهٔ Memtable → SSTable → Compaction","توضیح مصالحهٔ Read Amplification در برابر Write Amplification"],
example:"Cassandra برای هر نوشتن، ابتدا آن را به Commit Log و Memtable می‌نویسد؛ وقتی Memtable پر شود، به یک SSTable جدید flush می‌شود.",
py:"", exercise:"مستندات RocksDB دربارهٔ Compaction را بخوانید و توضیح دهید Leveled Compaction چه تفاوتی با Size-Tiered Compaction دارد.",
project:"", resources:[{t:"RocksDB Wiki - Compaction",u:"https://github.com/facebook/rocksdb/wiki/Compaction"},{t:"CMU Database Systems - LSM Trees (رایگان، YouTube)",u:"https://www.youtube.com/watch?v=6uNZDZ4y8Sg"}],
criteria:"می‌توانید توضیح دهید چرا Cassandra برای Write-heavy workload بهتر از PostgreSQL است و چه هزینه‌ای (Read Amplification) در ازای آن پرداخت می‌شود.",
interview:["LSM Tree چگونه نوشتن را سریع‌تر از B-Tree می‌کند؟","Compaction چیست و چرا لازم است؟","Bloom Filter در LSM Tree چه نقشی دارد؟"],
mistakes:["انتخاب دیتابیس LSM-based برای Workload که عمدتاً Read با کوئری‌های پیچیده Join دارد"],
production:"انتخاب بین دیتابیس مبتنی بر B-Tree (PostgreSQL) و LSM Tree (Cassandra) یکی از تصمیمات معماری کلیدی در طراحی سیستم است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم LSM Tree، Memtable، SSTable و Compaction را با مقایسهٔ مستقیم با B+Tree توضیح بده، و یک سناریوی انتخاب دیتابیس (Write-heavy logging system) به من بده تا تصمیم بگیرم و توجیه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p6",num:6,title:"الگوریتم‌ها",icon:"🧮",summary:"پیچیدگی، جستجو، مرتب‌سازی، گراف و برنامه‌نویسی پویا با کاربرد بک‌اند.",
topics:[
{id:"algo-complexity",title:"تحلیل پیچیدگی (Big O)",level:"Beginner",minLadder:1,prereqs:[],
short:"چگونه رشد زمان اجرا یا حافظهٔ یک الگوریتم را نسبت به اندازهٔ ورودی توصیف کنیم.",
deep:"Big O بدترین‌حالت رشد را توصیف می‌کند و به ما اجازه می‌دهد الگوریتم‌ها را مستقل از سخت‌افزار مقایسه کنیم. O(1) ثابت، O(log n) لگاریتمی (مثل جستجوی دودویی)، O(n) خطی، O(n log n) (مرتب‌سازی‌های کارآمد)، O(n²) درجه دوم (حلقهٔ تودرتو ساده) و O(2ⁿ) نمایی (بازگشت ساده‌لوح روی زیرمجموعه‌ها) رایج‌ترین کلاس‌ها هستند. Amortized Analysis برای عملیاتی مثل append در لیست پویا (که گاه‌به‌گاه resize می‌شود اما میانگین هزینه O(1) است) استفاده می‌شود. برای مهندس بک‌اند، این تحلیل مستقیماً به کوئری‌های N+1 (که O(n) کوئری دیتابیس به‌جای یک کوئری O(1) اجرا می‌کنند) و طراحی API (pagination به‌جای بارگذاری کل جدول با O(n) حافظه) مرتبط است.",
objectives:["محاسبهٔ Big O برای الگوریتم‌های ساده","تشخیص N+1 Query به‌عنوان یک مشکل پیچیدگی در سطح دیتابیس"],
example:"یک حلقهٔ تودرتو ساده برای پیدا کردن جفت‌های تکراری در یک لیست O(n²) است، اما با یک Set می‌توان آن را به O(n) رساند.",
py:"# O(n^2)\ndef has_duplicate_slow(lst):\n    for i in range(len(lst)):\n        for j in range(i+1, len(lst)):\n            if lst[i] == lst[j]:\n                return True\n    return False\n\n# O(n)\ndef has_duplicate_fast(lst):\n    seen = set()\n    for x in lst:\n        if x in seen:\n            return True\n        seen.add(x)\n    return False",
exercise:"دو تابع بالا را با timeit روی لیست‌های ۱۰۰۰، ۱۰۰۰۰ و ۱۰۰۰۰۰ عنصری اجرا کنید و رشد زمان اجرا را رسم کنید.",
project:"", resources:[{t:"MIT 6.006 Introduction to Algorithms (رایگان)",u:"https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"},{t:"Big O Cheat Sheet",u:"https://www.bigocheatsheet.com/"}],
criteria:"می‌توانید Big O یک قطعه کد پایتون دلخواه را بدون اجرا کردن آن محاسبه کنید.",
interview:["پیچیدگی زمانی جستجوی دودویی چقدر است و چرا؟","Amortized Analysis چیست؟"],
mistakes:["نادیده گرفتن پیچیدگی کوئری دیتابیس در حلقه (مشکل N+1)"],
production:"مشکل N+1 Query یکی از رایج‌ترین دلایل کندی API در Django است و مستقیماً یک مسئلهٔ پیچیدگی الگوریتمی در سطح دیتابیس است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. می‌خواهم Big O را با تمرکز بر کاربرد در کدهای بک‌اند پایتون/Django (مثل N+1 query) یاد بگیرم. چند قطعه کد به من بده و از من بخواه پیچیدگی آن‌ها را حدس بزنم قبل از توضیح. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"algo-graph-bfs-dfs",title:"BFS، DFS و کوتاه‌ترین مسیر (Dijkstra)",level:"Intermediate",minLadder:2,prereqs:["algo-complexity","ds-hash-table"],
short:"پیمایش گراف برای مسائلی مثل یافتن نزدیک‌ترین دوستان، مسیریابی و تشخیص وابستگی‌های چرخه‌ای.",
deep:"BFS (پیمایش سطحی) با استفاده از یک Queue، گره‌ها را لایه‌به‌لایه از نزدیک به دور کشف می‌کند و برای یافتن کوتاه‌ترین مسیر در گراف بدون وزن (مثل «فاصلهٔ اجتماعی» در شبکهٔ اجتماعی) ایده‌آل است. DFS (پیمایش عمقی) با Stack یا بازگشت، تا حد امکان در یک مسیر پیش می‌رود و برای تشخیص چرخه (مثلاً وابستگی دایره‌ای بین ماژول‌ها) و Topological Sort استفاده می‌شود. Dijkstra کوتاه‌ترین مسیر در گراف با وزن مثبت را با یک Priority Queue پیدا می‌کند و پایهٔ الگوریتم‌های مسیریابی شبکه (مثل OSPF) و سیستم‌های مسیریابی مثل اپلیکیشن‌های نقشه است. برای بک‌اند، این مفاهیم مستقیماً در طراحی سیستم‌های Recommendation (گراف کاربران/محصولات)، تشخیص Deadlock (گراف انتظار که چرخه دارد یعنی Deadlock)، و Dependency Resolution (مثل ترتیب اجرای Migrationهای دیتابیس) کاربرد دارند.",
objectives:["پیاده‌سازی BFS و DFS با Queue/Stack","تشخیص چرخه در گراف با DFS"],
example:"تشخیص Deadlock در دیتابیس معادل جستجوی چرخه در گراف انتظار (Wait-for Graph) بین تراکنش‌هاست.",
py:"from collections import deque\n\ndef bfs_shortest_path(graph, start, goal):\n    queue = deque([[start]])\n    visited = {start}\n    while queue:\n        path = queue.popleft()\n        node = path[-1]\n        if node == goal:\n            return path\n        for neighbor in graph.get(node, []):\n            if neighbor not in visited:\n                visited.add(neighbor)\n                queue.append(path + [neighbor])\n    return None",
exercise:"با تابع بالا کوتاه‌ترین مسیر بین دو کاربر در یک گراف دوستی نمونه پیدا کنید. سپس یک تابع DFS برای تشخیص چرخه در گراف وابستگی ماژول‌ها بنویسید.",
project:"سیستم ساده «دوستان مشترک» و «پیشنهاد دوستی» بر پایهٔ BFS روی گراف دوستی.",
resources:[{t:"MIT 6.006 - Graph Search (رایگان)",u:"https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"},{t:"NetworkX (کتابخانهٔ پایتون برای گراف)",u:"https://networkx.org/documentation/stable/"}],
criteria:"می‌توانید BFS، DFS و Dijkstra را بدون کمک از صفر در پایتون پیاده‌سازی کنید.",
interview:["چه زمانی از BFS و چه زمانی از DFS استفاده می‌کنید؟","چطور Deadlock در دیتابیس با گراف تشخیص داده می‌شود؟"],
mistakes:["استفاده از DFS برای یافتن کوتاه‌ترین مسیر (که تضمین نمی‌کند کوتاه‌ترین باشد)"],
production:"موتور تشخیص Deadlock در PostgreSQL از یک الگوریتم مشابه تشخیص چرخه در گراف انتظار استفاده می‌کند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. BFS، DFS و Dijkstra را با تمرکز بر کاربردهای بک‌اندی (گراف دوستی، تشخیص Deadlock، ترتیب Migration) آموزش بده. بعد از هر الگوریتم یک مسئلهٔ کوچک بده که خودم پیاده‌سازی کنم و کدم را نقد کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p7",num:7,title:"ریاضیات مهندسی نرم‌افزار",icon:"➗",summary:"فقط ریاضیاتی که ارزش عملی مستقیم برای مهندسی دارد: احتمال، ترکیبیات، صف و اطلاعات.",
topics:[
{id:"math-prob-queueing",title:"احتمال و تئوری صف (Queueing Theory) برای ظرفیت‌سنجی",level:"Intermediate",minLadder:2,prereqs:[],
short:"چگونه با مدل‌های ریاضی صف، رفتار سیستم زیر بار را پیش‌بینی کنیم.",
deep:"تئوری صف روابطی بین نرخ ورود درخواست‌ها (λ)، نرخ سرویس‌دهی (μ) و تأخیر/طول صف ارائه می‌دهد. قانون Little (L = λW) می‌گوید میانگین تعداد درخواست‌های در حال پردازش در سیستم برابر است با نرخ ورودی ضرب در میانگین زمان ماندگاری هر درخواست — این قانون به‌طور مستقیم برای محاسبهٔ اینکه چند Worker یا Thread برای یک throughput مشخص لازم است استفاده می‌شود. یک نکتهٔ حیاتی که اغلب نادیده گرفته می‌شود: وقتی نرخ ورودی (λ) به نرخ سرویس‌دهی (μ) نزدیک می‌شود (Utilization نزدیک ۱۰۰٪)، طول صف و تأخیر به‌صورت نمایی (نه خطی) رشد می‌کند — به همین دلیل سیستم‌های تولید معمولاً هدف Utilization حدود ۷۰-۸۰٪ را دنبال می‌کنند نه ۱۰۰٪، و همین اصل توضیح می‌دهد چرا سیستم‌ها معمولاً نه به‌آرامی بلکه ناگهانی (cliff-like) هنگام افزایش ترافیک 'می‌افتند'.",
objectives:["استفاده از قانون Little برای تخمین ظرفیت","توضیح چرا تأخیر نزدیک به ۱۰۰٪ Utilization به‌صورت نمایی رشد می‌کند"],
example:"اگر هر درخواست به‌طور میانگین ۲۰۰ میلی‌ثانیه طول بکشد و بخواهیم ۵۰۰ درخواست در ثانیه پاسخ دهیم، طبق قانون Little به حداقل ۱۰۰ Worker هم‌زمان نیاز داریم (L=λW=500×0.2=100).",
py:"# محاسبهٔ ساده قانون Little\nlambda_req_per_sec = 500\nW_seconds = 0.2\nL = lambda_req_per_sec * W_seconds\nprint('میانگین درخواست‌های هم‌زمان لازم:', L)",
exercise:"با فرض نرخ‌های مختلف ورودی و افزایش تدریجی Utilization (از ۵۰٪ تا ۹۹٪) با فرمول M/M/1 (W = 1/(μ-λ)) نمودار رشد تأخیر را رسم کنید.",
project:"", resources:[{t:"MIT 6.041 Probability (رایگان)",u:"https://ocw.mit.edu/courses/6-041-probabilistic-systems-analysis-and-applied-probability-fall-2010/"},{t:"Queueing theory - practical intro (Brendan Gregg)",u:"https://www.brendangregg.com/"}],
criteria:"می‌توانید توضیح دهید چرا Utilization بالای ۸۰٪ در یک سرویس تولید خطرناک است.",
interview:["قانون Little چیست و چگونه در ظرفیت‌سنجی استفاده می‌شود؟","چرا تأخیر یک سیستم نزدیک به اشباع به‌صورت نمایی رشد می‌کند؟"],
mistakes:["طراحی ظرفیت سیستم برای Utilization 100٪ که هیچ Headroomی برای اسپایک ترافیک باقی نمی‌گذارد"],
production:"تعیین تعداد Podهای Kubernetes یا Workerهای Gunicorn/Celery مستقیماً باید بر پایهٔ این محاسبات باشد نه حدس.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تئوری صف و قانون Little را با تمرکز بر ظرفیت‌سنجی سرویس‌های بک‌اند (تعداد Worker لازم، Utilization ایمن) آموزش بده و چند سناریوی عددی واقعی به من بده تا محاسبه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p8",num:8,title:"Git و کنترل نسخه",icon:"🌿",summary:"مدل داده‌ای Git، استراتژی‌های شاخه‌بندی و بازبینی کد حرفه‌ای.",
topics:[
{id:"git-internals",title:"معماری داخلی Git: Objects، Blobs، Trees، Refs",level:"Intermediate",minLadder:2,prereqs:[],
short:"Git یک دیتابیس محتوا-محور (content-addressable) است، نه صرفاً ابزار ذخیرهٔ تغییرات.",
deep:"در سطح داخلی، Git چهار نوع Object دارد که همگی با هش SHA-1/SHA-256 محتوایشان شناسایی می‌شوند: Blob (محتوای یک فایل)، Tree (نگاشت نام فایل به Blob یا Tree دیگر، معادل یک دایرکتوری)، Commit (اشاره به یک Tree به‌همراه متادیتا و اشاره به Commit(های) والد) و Tag. این طراحی یعنی هر Commit در واقع اسنپ‌شات کامل کل درخت فایل‌هاست نه صرفاً یک Diff — Gitها Diffها را فقط برای نمایش محاسبه می‌کنند، نه برای ذخیره‌سازی. HEAD یک اشاره‌گر به شاخهٔ فعلی است (که خودش اشاره‌گر به آخرین Commit است)؛ Detached HEAD یعنی مستقیماً به یک Commit اشاره می‌کنید نه یک شاخه، پس هر Commit جدید در آن حالت به هیچ شاخه‌ای متصل نمی‌شود و می‌تواند گم شود مگر با reflog. فهم این مدل توضیح می‌دهد چرا rebase تاریخچه را بازنویسی می‌کند (Commitهای جدید با هش متفاوت می‌سازد) در حالی که merge تاریخچه را حفظ و یک Commit ادغام جدید اضافه می‌کند.",
objectives:["توضیح تفاوت Blob/Tree/Commit","توضیح چرا rebase هش کامیت‌ها را تغییر می‌دهد"],
example:"git cat-file -p HEAD نشان می‌دهد یک Commit شامل اشاره به یک Tree، والد(ها)، نویسنده و پیام است.",
py:"", exercise:"در یک ریپوی آزمایشی، با git cat-file -p به Blob، Tree و Commit مربوط به یک فایل نگاه کنید و مسیر Commit → Tree → Blob را دستی دنبال کنید.",
project:"", resources:[{t:"Pro Git Book (رایگان، فصل Git Internals)",u:"https://git-scm.com/book/en/v2/Git-Internals-Plumbing-and-Porcelain"},{t:"git-scm.com docs",u:"https://git-scm.com/doc"}],
criteria:"می‌توانید مسیر یک فایل خاص را از Commit تا Blob با دستورات plumbing گیت دستی دنبال کنید.",
interview:["Git چگونه تغییرات را داخلی ذخیره می‌کند؟ آیا Diff ذخیره می‌شود یا Snapshot؟","تفاوت rebase و merge از نظر تاریخچه چیست؟"],
mistakes:["rebase کردن شاخه‌ای که دیگران روی آن کار می‌کنند و از قبل push شده است"],
production:"فهم عمیق Git برای عیب‌یابی مشکلات پیچیده مثل بازیابی Commitهای گم‌شده با reflog حیاتی است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری داخلی Git (Blob, Tree, Commit, Refs) را برایم توضیح بده، سپس با دستورات plumbing (cat-file, hash-object) در یک ریپوی آزمایشی مرا راهنمایی کن که ساختار را با دست ببینم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"git-branching-strategy",title:"استراتژی شاخه‌بندی: Trunk-Based vs GitFlow",level:"Intermediate",minLadder:2,prereqs:["git-internals"],
short:"چگونه تیم‌ها تغییرات موازی زیاد را بدون تداخل مدیریت می‌کنند.",
deep:"GitFlow شاخه‌های طولانی‌مدت زیادی دارد (develop, feature/*, release/*, hotfix/*) و برای پروژه‌هایی با چرخهٔ انتشار کند و نسخه‌های موازی متعدد (مثل نرم‌افزار نصبی) مناسب است، اما در تیم‌های CI/CD مدرن با استقرار مکرر، پیچیدگی merge بالا و Merge Conflict زیادی ایجاد می‌کند. Trunk-Based Development برعکس، همه روی یک شاخهٔ اصلی (main/trunk) کار می‌کنند با شاخه‌های بسیار کوتاه‌مدت (کمتر از یک روز) و به‌شدت به Feature Flag برای مخفی کردن قابلیت‌های ناتمام متکی است، که امکان استقرار مداوم (Continuous Deployment) چندین‌بار در روز را فراهم می‌کند. انتخاب استراتژی مستقیماً بر سرعت تیم، ریسک Merge Conflict و پیچیدگی CI/CD تأثیر می‌گذارد؛ اکثر شرکت‌های با مقیاس بالا (Google، Meta، Netflix) از Trunk-Based با Feature Flag استفاده می‌کنند.",
objectives:["توضیح مصالحهٔ GitFlow در برابر Trunk-Based","توضیح نقش Feature Flag در Trunk-Based Development"],
example:"در Trunk-Based، یک قابلیت نیمه‌کاره پشت if feature_flags.is_enabled('new_checkout') مخفی می‌شود تا کد ناقص هم بتواند merge و deploy شود.",
py:"", exercise:"یک سناریوی تیمی فرضی با ۵ توسعه‌دهنده و استقرار روزانه طراحی کنید و توضیح دهید چرا Trunk-Based برای آن مناسب‌تر از GitFlow است.",
project:"", resources:[{t:"Trunk Based Development",u:"https://trunkbaseddevelopment.com/"},{t:"Atlassian - Gitflow Workflow",u:"https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow"}],
criteria:"می‌توانید برای یک تیم و سناریوی مشخص، استراتژی شاخه‌بندی مناسب را با استدلال انتخاب کنید.",
interview:["چرا تیم‌های CI/CD مدرن معمولاً Trunk-Based را به GitFlow ترجیح می‌دهند؟"],
mistakes:["استفاده از شاخه‌های طولانی‌مدت feature که هفته‌ها بدون merge باقی می‌مانند و Conflict عظیم ایجاد می‌کنند"],
production:"استقرار مداوم (چند بار در روز) عملاً بدون Trunk-Based Development و Feature Flag امکان‌پذیر نیست.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. استراتژی‌های شاخه‌بندی Git (GitFlow، Trunk-Based، GitHub Flow) را با مثال‌های تیمی واقعی مقایسه کن و بعد یک سناریوی تیمی به من بده تا استراتژی مناسب را انتخاب و توجیه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p9",num:9,title:"شبکه",icon:"🌐",summary:"از مدل OSI تا TCP، DNS، HTTP/2 و HTTP/3 — عمیق و کاربردی.",
topics:[
{id:"net-tcp-handshake",title:"TCP: هندشیک، کنترل ازدحام و چرخهٔ اتصال",level:"Advanced",minLadder:4,prereqs:[],
short:"TCP چگونه تحویل قابل‌اعتماد و ترتیب‌دار داده را روی یک شبکهٔ غیرقابل‌اعتماد تضمین می‌کند.",
deep:"TCP با یک هندشیک سه‌مرحله‌ای (SYN → SYN-ACK → ACK) اتصال برقرار می‌کند تا هر دو طرف روی شمارهٔ توالی اولیه (Sequence Number) توافق کنند. تحویل قابل‌اعتماد با Acknowledgement و Retransmission تضمین می‌شود: اگر ACK یک بسته در زمان معین نرسد، فرستنده آن را دوباره ارسال می‌کند. کنترل ازدحام (Congestion Control) با الگوریتم‌هایی مثل Slow Start (شروع آهسته و افزایش نمایی پنجرهٔ ارسال تا برخورد با ازدحام) و Congestion Avoidance مانع پر شدن شبکه می‌شود؛ Sliding Window هم به‌صورت هم‌زمان کنترل جریان (Flow Control، جلوگیری از سرریز بافر گیرنده) را انجام می‌دهد. بستن اتصال با یک تبادل FIN چهارمرحله‌ای انجام می‌شود و حالت TIME_WAIT (که یک طرف برای مدتی پس از بسته شدن باقی می‌ماند) برای اطمینان از رسیدن آخرین ACK طراحی شده — اما وقتی هزاران اتصال کوتاه‌مدت (مثل یک Load Balancer با keep-alive خاموش) باز و بسته می‌شوند، انباشت اتصالات در TIME_WAIT می‌تواند پورت‌های موجود سرور را تمام کند (اینسیدنت معروف 'connection refused' زیر بار بالا).",
objectives:["توضیح هندشیک سه‌مرحله‌ای و علت آن","توضیح چرا TIME_WAIT زیاد می‌تواند سرور را از کار بیندازد"],
example:"با ss -tan state time-wait | wc -l می‌توان تعداد اتصالات در حالت TIME_WAIT روی یک سرور لینوکس را دید.",
py:"import socket\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.connect(('example.com', 80))\nprint(s.getsockname())  # نمایش پورت لوکال اختصاص‌یافته برای این اتصال TCP",
exercise:"با tcpdump یک درخواست HTTP ساده به یک سایت بگیرید (curl) و در خروجی، بسته‌های SYN، SYN-ACK، ACK و در پایان FIN را شناسایی کنید.",
project:"", resources:[{t:"RFC 793 - TCP",u:"https://www.rfc-editor.org/rfc/rfc793"},{t:"Computer Networking: A Top-Down Approach (خلاصه‌های رایگان آنلاین دانشگاهی)",u:"https://gaia.cs.umass.edu/kurose_ross/lectures.php"},{t:"Hussein Nasser - TCP deep dive (YouTube)",u:"https://www.youtube.com/@hnasr"}],
criteria:"می‌توانید در خروجی tcpdump مراحل هندشیک TCP را شناسایی کنید و توضیح دهید چرا TIME_WAIT زیاد مشکل‌ساز است.",
interview:["چرا TCP هندشیک سه‌مرحله‌ای دارد نه دومرحله‌ای؟","TIME_WAIT چیست و چرا می‌تواند مشکل‌ساز شود؟","Slow Start در کنترل ازدحام چگونه کار می‌کند؟"],
mistakes:["نادیده گرفتن Connection Pooling که منجر به تعداد زیاد اتصالات کوتاه‌مدت و انباشت TIME_WAIT می‌شود"],
production:"'ERROR: could not bind socket / address already in use' زیر بار بالا معمولاً ریشه در تمام‌شدن پورت‌های موقت به‌دلیل TIME_WAIT انباشته‌شده دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. چرخهٔ کامل TCP (Handshake، Data Transfer، Congestion Control، Termination و TIME_WAIT) را عمیق توضیح بده و یک سناریوی واقعی (سرور زیر بار بالا connection refused می‌دهد) طراحی کن که با tcpdump/ss دیباگش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"net-dns",title:"DNS: Resolver، Authoritative Server و TTL",level:"Intermediate",minLadder:2,prereqs:[],
short:"سیستمی سلسله‌مراتبی و توزیع‌شده که نام دامنه را به آدرس IP تبدیل می‌کند.",
deep:"وقتی مرورگر یک دامنه را جستجو می‌کند، ابتدا کش لوکال، سپس Recursive Resolver (معمولاً ISP یا 8.8.8.8/1.1.1.1) بررسی می‌شود؛ اگر پاسخ در کش نباشد، Resolver به‌ترتیب از Root Server، TLD Server (مثل .com) و در نهایت Authoritative Nameserver دامنه، پاسخ نهایی را می‌گیرد و آن را برای مدت TTL کش می‌کند. TTL پایین یعنی تغییرات DNS سریع‌تر منتشر می‌شود اما بار بیشتری روی Authoritative Server می‌گذارد؛ TTL بالا برعکس. یک اشتباه رایج در عملیات: قبل از یک Migration بزرگ (مثل تغییر IP سرور)، فراموش کردن کاهش TTL چند روز قبل، که باعث می‌شود بعضی کلاینت‌ها ساعت‌ها یا روزها IP قدیمی را کش کرده باشند و Downtime پخش‌شده (نه یکجا) ایجاد شود. رکوردهای رایج شامل A (IPv4)، AAAA (IPv6)، CNAME (Alias)، MX (میل سرور)، TXT و NS هستند؛ DNS Propagation در واقع یک انتشار همزمان نیست بلکه گذشت زمان لازم برای انقضای TTL کش‌های مختلف در سراسر دنیا است.",
objectives:["توضیح مسیر کامل یک DNS Lookup","توضیح چرا کاهش TTL قبل از Migration مهم است"],
example:"dig +trace example.com مسیر کامل از Root تا Authoritative Server را نشان می‌دهد.",
py:"import socket\nprint(socket.getaddrinfo('example.com', 443))  # نمایش نتایج resolve شده",
