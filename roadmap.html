ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مشکل Dual Write و راه‌حل آن با الگوی Transactional Outbox، همچنین مفهوم CQRS را عمیق توضیح بده. کمکم کن یک مدل OutboxEvent و Management Command مربوطه را در Django پیاده‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"eda-event-sourcing",title:"Event Sourcing: ذخیرهٔ رویداد به‌جای وضعیت",level:"Expert",minLadder:null,prereqs:["eda-outbox-cqrs"],
short:"به‌جای ذخیرهٔ 'وضعیت فعلی'، هر تغییری که تا امروز رخ داده را ذخیره کن؛ وضعیت فعلی فقط بازپخش همان تاریخچه است.",
deep:"در مدل معمول (Active Record)، جدول Order فقط وضعیت فعلی را نگه می‌دارد (مثلاً status='shipped') و تاریخچهٔ اینکه چگونه به این وضعیت رسیده از بین می‌رود مگر جداگانه Log شود. Event Sourcing این را برعکس می‌کند: به‌جای ذخیرهٔ وضعیت، هر تغییر به‌عنوان یک رویداد Append-only در یک Event Store ذخیره می‌شود (OrderCreated، OrderPaid، OrderShipped)، و وضعیت فعلی هرگز مستقیم ذخیره نمی‌شود بلکه با Replay کردن (پخش مجدد) همهٔ رویدادها از ابتدا به ترتیب، محاسبه می‌شود. مزیت‌های این مدل: تاریخچهٔ کامل و غیرقابل‌تغییر برای Audit (چه کسی، چه زمانی، چه چیزی را تغییر داد - حیاتی در سیستم‌های مالی)، امکان بازسازی هر وضعیت گذشته (Time Travel debugging)، و امکان ساخت Viewهای جدید از داده‌های قدیمی بدون از دست دادن اطلاعات (چون رویداد خام همیشه باقی می‌ماند، برخلاف مدل سنتی که با هر Overwrite داده‌های قبلی گم می‌شوند). چالش اصلی عملی: Replay کردن هزاران رویداد از ابتدا برای هر خواندن، کند است - راه‌حل، Snapshot (ذخیرهٔ دوره‌ای وضعیت محاسبه‌شده تا یک نقطه، و Replay فقط از آن نقطه به بعد). Event Sourcing طبیعتاً با CQRS (که در Outbox/CQRS دیدیم) ترکیب می‌شود: رویدادها منبع حقیقت نوشتن‌اند، و Viewهای خواندن از همان رویدادها ساخته و به‌روز نگه داشته می‌شوند - اما این الگو پیچیدگی قابل‌توجهی اضافه می‌کند و فقط برای دامنه‌هایی با نیاز واقعی به Audit Trail کامل یا بازسازی وضعیت تاریخی (مثل سیستم‌های مالی/حسابداری) توصیه می‌شود، نه هر CRUD سادهٔ معمولی.",
objectives:["توضیح تفاوت ذخیرهٔ وضعیت (Active Record) و ذخیرهٔ رویداد (Event Sourcing)","طراحی یک Snapshot ساده برای جلوگیری از Replay کامل تاریخچهٔ طولانی"],
example:"وضعیت فعلی یک حساب بانکی به‌جای فیلد balance، از جمع رویدادهای MoneyDeposited و MoneyWithdrawn از ابتدای حساب محاسبه می‌شود - دقیقاً همان اصل Ledger که در بحث سیستم پرداخت دیدیم.",
py:"events = [\n    {'type': 'AccountOpened', 'amount': 0},\n    {'type': 'MoneyDeposited', 'amount': 100},\n    {'type': 'MoneyWithdrawn', 'amount': 30},\n]\n\ndef replay(events):\n    balance = 0\n    for e in events:\n        if e['type'] == 'MoneyDeposited':\n            balance += e['amount']\n        elif e['type'] == 'MoneyWithdrawn':\n            balance -= e['amount']\n    return balance\n\nprint(replay(events))  # 70 - وضعیت فعلی از Replay رویدادها به دست می‌آید",
exercise:"یک Event Store سادهٔ درون‌حافظه‌ای برای یک حساب کاربری بسازید (رویدادهای AccountOpened/MoneyDeposited/MoneyWithdrawn)؛ تابعی بنویسید که موجودی فعلی را با Replay محاسبه کند، سپس یک مکانیزم Snapshot ساده اضافه کنید که هر ۱۰۰۰ رویداد یک Checkpoint ذخیره کند.",
project:"", resources:[{t:"Martin Fowler - Event Sourcing",u:"https://martinfowler.com/eaaDev/EventSourcing.html"},{t:"Greg Young - CQRS and Event Sourcing (talk notes)",u:"https://cqrs.files.wordpress.com/2010/11/cqrs_documents.pdf"}],
criteria:"می‌توانید توضیح دهید Event Sourcing چه مشکلی (فقدان تاریخچه/Audit) را حل می‌کند و چرا Snapshot برای مقیاس لازم می‌شود.",
interview:["تفاوت اصلی مدل Active Record و Event Sourcing چیست؟","چرا Event Sourcing نیازمند Snapshot دوره‌ای است و بدون آن چه مشکلی پیش می‌آید؟"],
mistakes:["استفاده از Event Sourcing برای یک CRUD سادهٔ بدون نیاز واقعی به Audit Trail یا بازسازی تاریخی، که فقط پیچیدگی غیرضروری اضافه می‌کند"],
production:"سیستم‌های مالی/حسابداری اغلب از Event Sourcing استفاده می‌کنند چون Regulator ممکن است بخواهد دقیقاً بداند وضعیت یک حساب در هر لحظهٔ گذشته چه بوده - چیزی که مدل 'فقط وضعیت فعلی' هرگز نمی‌تواند پاسخ دهد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. Event Sourcing (ذخیرهٔ رویداد به‌جای وضعیت، Replay، Snapshot) را با تمایز از مدل Active Record معمولی و ارتباطش با CQRS که قبلاً یاد گرفتم توضیح بده. کمکم کن یک Event Store ساده برای یک حساب کاربری پیاده‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p45",num:45,title:"مهندسی داده",icon:"📊",summary:"ETL/ELT، پردازش دسته‌ای/جریانی و انبار داده، تا حد نیاز یک بک‌اند ارشد.",
topics:[
{id:"data-eng-etl-cdc",title:"ETL/ELT و Change Data Capture (CDC)",level:"Intermediate",minLadder:null,prereqs:["eda-outbox-cqrs"],
short:"چگونه داده از سیستم‌های تراکنشی به انبار داده برای تحلیل منتقل می‌شود.",
deep:"ETL (Extract, Transform, Load) داده را از منبع استخراج می‌کند، قبل از بارگذاری تبدیل می‌کند (تمیزکاری، تجمیع) و در انبار داده ذخیره می‌کند - رایج در معماری سنتی با منابع محدود پردازش انبار. ELT (Extract, Load, Transform) خام داده را ابتدا بارگذاری می‌کند و تبدیل را درون خود انبار داده (که امروزه با موتورهای قدرتمند مثل Snowflake/BigQuery قدرت پردازش بالایی دارند) انجام می‌دهد - این الگوی مدرن‌تر انعطاف بیشتری می‌دهد چون داده خام همیشه در دسترس است برای تبدیل‌های جدید بعدی. Change Data Capture (CDC) به‌جای Batch Job های دوره‌ای که کل جدول را می‌خوانند (که برای جداول بزرگ کند و پرهزینه است)، تغییرات را به‌صورت Real-time مستقیم از WAL/Binlog دیتابیس می‌خواند (با ابزارهایی مثل Debezium) و به یک Stream (Kafka) منتشر می‌کند - این هم بار دیتابیس منبع را کاهش می‌دهد (چون دیگر Query سنگین دوره‌ای لازم نیست) و هم داده را تقریباً بلادرنگ به مصرف‌کنندگان (انبار داده، Cache، سرویس‌های دیگر) می‌رساند. برای مهندس بک‌اند ارشد، فهم این‌که CDC چگونه از همان WAL که برای Replication و Durability استفاده می‌شود بهره می‌برد (موضوعی که قبلاً در بحث PostgreSQL دیدیم)، پل مفهومی بین دیتابیس عملیاتی و دنیای مهندسی داده است.",
objectives:["توضیح تفاوت ETL و ELT","توضیح چرا CDC کارآمدتر از Batch Extraction دوره‌ای است"],
example:"Debezium یک Kafka Connector است که مستقیماً WAL دیتابیس PostgreSQL را می‌خواند و هر INSERT/UPDATE/DELETE را به‌عنوان یک رویداد به Kafka منتشر می‌کند.",
py:"", exercise:"معماری یک پایپ‌لاین CDC را طراحی کنید: PostgreSQL → Debezium → Kafka → مصرف‌کننده‌ای که جدول یک انبار داده را به‌روز نگه می‌دارد. توضیح دهید این چگونه با Batch ETL شبانه متفاوت است.",
project:"", resources:[{t:"Debezium docs",u:"https://debezium.io/documentation/reference/stable/index.html"},{t:"Fivetran - ETL vs ELT (توضیح مفهومی رایگان)",u:"https://www.fivetran.com/learn/etl-vs-elt"}],
criteria:"می‌توانید معماری یک پایپ‌لاین CDC از دیتابیس عملیاتی به یک مصرف‌کنندهٔ تحلیلی را طراحی و توجیه کنید.",
interview:["تفاوت ETL و ELT چیست؟","CDC چگونه کار می‌کند و چه مزیتی نسبت به Query دوره‌ای دارد؟"],
mistakes:["اجرای Query سنگین تحلیلی مستقیماً روی دیتابیس تراکنشی تولید که منابع آن را برای ترافیک واقعی کاربران مصرف می‌کند"],
production:"اجرای مستقیم گزارش‌گیری سنگین روی دیتابیس تولید (به‌جای Replica جداگانه یا انبار داده) یکی از رایج‌ترین دلایل کندی ناگهانی API در ساعات خاص (مثل پایان روز کاری) است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. ETL در برابر ELT و مفهوم Change Data Capture (با Debezium) را با تمرکز بر ارتباط با WAL دیتابیس که قبلاً یاد گرفتم توضیح بده. کمکم کن معماری یک پایپ‌لاین CDC ساده طراحی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"dataeng-warehousing-streaming",title:"مدل‌سازی انبار داده و پردازش جریانی (Stream Processing)",level:"Advanced",minLadder:null,prereqs:["data-eng-etl-cdc"],
short:"چگونه داده در انبار داده برای تحلیل سازمان‌دهی می‌شود، و چرا برخی پردازش‌ها نمی‌توانند منتظر Batch شبانه بمانند.",
deep:"مدل‌سازی ابعادی (Dimensional Modeling، رایج‌ترین شکل آن Star Schema) داده را به یک جدول Fact مرکزی (رویدادهای اندازه‌گیری‌شونده، مثل هر تراکنش فروش با مقادیر عددی) و چند جدول Dimension اطراف آن (توصیف‌کنندهٔ متن، مثل مشتری/محصول/زمان) تقسیم می‌کند - این ساختار برخلاف نرمال‌سازی دیتابیس تراکنشی، عمداً برای سرعت Query تحلیلی (تجمیع/Group By روی حجم بالا) دنرمال شده است، نه برای جلوگیری از ناهنجاری نوشتن. Batch Processing (پردازش دوره‌ای، مثلاً هر شب کل دادهٔ روز را پردازش کردن) برای گزارش‌های تجمعی که نیازی به بلادرنگ بودن ندارند کافی و ساده‌تر است؛ اما برخی نیازها (تشخیص تقلب لحظه‌ای، داشبورد زنده) به Stream Processing نیاز دارند که داده را رکورد به رکورد یا در پنجره‌های زمانی کوچک (مثلاً هر ۵ ثانیه) پردازش می‌کند - فریمورک‌هایی مثل Spark Structured Streaming یا Flink این را با مفاهیمی مثل Windowing (تجمیع در بازهٔ زمانی متحرک) و مدیریت داده‌های دیرآمده (Late-arriving Data) ممکن می‌کنند. ارکستراسیون (مثل Airflow یا dbt) پایپ‌لاین‌های چندمرحله‌ای وابسته به هم (مثلاً 'اول Extract کن، بعد Transform، بعد Load، و اگر مرحلهٔ دوم شکست خورد، سوم اجرا نشود') را با DAG (گراف بدون‌دور) مدیریت، زمان‌بندی، و در صورت خطا Retry یا هشدار می‌دهد - بدون ارکستراسیون، این وابستگی‌ها معمولاً با اسکریپت‌های Cron شکننده و بدون دید مدیریت می‌شوند.",
objectives:["طراحی یک Star Schema ساده (Fact + Dimension) برای یک سناریوی تحلیلی","توضیح چه زمانی Batch Processing کافی است و چه زمانی Stream Processing واقعاً لازم است"],
example:"جدول fact_sales (order_id, customer_id, product_id, date_id, amount) کنار جدول‌های dim_customer، dim_product و dim_date - این ساختار Star Schema اجازه می‌دهد 'مجموع فروش هر محصول در هر ماه' با یک Join ساده و سریع محاسبه شود.",
py:"", exercise:"برای یک فروشگاه آنلاین، یک Star Schema (یک Fact Table و حداقل دو Dimension Table) روی کاغذ طراحی کنید؛ سپس توضیح دهید کدام گزارش‌ها را می‌توان Batch شبانه پردازش کرد و کدام (مثلاً موجودی لحظه‌ای انبار) به Stream Processing نیاز دارد.",
project:"", resources:[{t:"Kimball Group - Dimensional Modeling Techniques",u:"https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/"},{t:"Apache Airflow docs",u:"https://airflow.apache.org/docs/"},{t:"Apache Flink docs - Concepts",u:"https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/overview/"}],
criteria:"می‌توانید یک Star Schema ساده طراحی کنید و برای یک نیاز داده مشخص، توجیه کنید که Batch یا Stream Processing مناسب‌تر است.",
interview:["چرا انبار داده معمولاً دنرمال‌شده (Star Schema) طراحی می‌شود در حالی که دیتابیس تراکنشی نرمال‌شده است؟","Stream Processing چه مشکلی را حل می‌کند که Batch Processing نمی‌تواند؟"],
mistakes:["استفاده از یک مدل کاملاً نرمال‌شده (مثل دیتابیس تراکنشی) برای انبار داده، که Queryهای تحلیلی را با Joinهای زیاد و کند می‌کند"],
production:"داشبوردهای 'زنده' (مثل نرخ سفارش لحظه‌ای در یک رویداد فروش ویژه) که با تأخیر چند ثانیه‌ای کار می‌کنند تقریباً همیشه روی یک پایپ‌لاین Stream Processing ساخته شده‌اند، نه Batch Job.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مدل‌سازی ابعادی (Star Schema)، تفاوت Batch و Stream Processing، و نقش ارکستراسیون (Airflow) را آموزش بده. یک سناریوی داده واقعی بده تا Star Schema آن را طراحی و تصمیم Batch/Stream را برایش توجیه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p46",num:46,title:"جستجو",icon:"🔍",summary:"ایندکس معکوس، تحلیلگرها، Relevance (BM25) و معماری Elasticsearch.",
topics:[
{id:"search-inverted-index-bm25",title:"ایندکس معکوس، تحلیلگرها و رتبه‌بندی BM25",level:"Advanced",minLadder:null,prereqs:["ds-hash-table"],
short:"چگونه موتورهای جستجو میلیون‌ها سند را در میلی‌ثانیه بر اساس Relevance رتبه‌بندی می‌کنند.",
deep:"ایندکس معکوس (Inverted Index) برخلاف یک ایندکس معمولی دیتابیس که سند را به کلمات نگاشت می‌دهد (Forward Index)، هر کلمه (Term) را به لیست اسنادی که آن کلمه در آن‌ها وجود دارد نگاشت می‌دهد؛ این ساختار جستجوی 'کدام اسناد شامل این کلمه هستند' را در O(1) یا نزدیک به آن ممکن می‌کند به‌جای اسکن کل مجموعه اسناد. قبل از ساخت ایندکس، متن از Analyzer عبور می‌کند: Tokenization (شکستن متن به کلمات)، Lowercasing، حذف Stop Words (کلمات پرتکرار بی‌معنی مثل 'the'، 'و') و Stemming/Lemmatization (تبدیل کلمات به ریشه، مثل 'running' به 'run') تا جستجو مستقل از شکل دقیق کلمه کار کند. برای رتبه‌بندی نتایج بر اساس ارتباط (Relevance)، الگوریتم BM25 (جانشین مدرن TF-IDF) استفاده می‌شود: TF (Term Frequency) می‌گوید کلمهٔ جستجوشده چند بار در سند تکرار شده (اما با اشباع، یعنی تکرار ۱۰۰ بار خیلی بهتر از ۱۰ بار نیست)، IDF (Inverse Document Frequency) می‌گوید کلماتی که در همهٔ اسناد رایج‌اند (مثل 'است') وزن کمتری در تشخیص Relevance دارند نسبت به کلمات نادر و مشخص. Elasticsearch/OpenSearch این مفاهیم را با یک معماری توزیع‌شده (Shard و Replica، مشابه مفاهیمی که در Sharding دیدیم) در مقیاس میلیارد سندی پیاده‌سازی می‌کنند.",
objectives:["توضیح مکانیزم ایندکس معکوس و چرا سریع‌تر از LIKE '%...%' در دیتابیس رابطه‌ای است","توضیح اجزای BM25 (TF و IDF) و نقش هرکدام"],
example:"جستجوی 'گوشی سامسونگ ارزان' در یک فروشگاه آنلاین، اسنادی که همهٔ سه کلمه را دارند و 'سامسونگ' (نادرتر) در آن‌ها تکرار بیشتری دارد، رتبهٔ بالاتری می‌گیرند تا صرفاً اسنادی با کلمهٔ پرتکرار 'ارزان'.",
py:"# مثال بسیار ساده‌شدهٔ ساخت ایندکس معکوس\nfrom collections import defaultdict\n\ndef build_inverted_index(documents):\n    index = defaultdict(set)\n    for doc_id, text in documents.items():\n        for word in text.lower().split():\n            index[word].add(doc_id)\n    return index\n\ndocs = {1: 'گوشی سامسونگ ارزان', 2: 'لپ‌تاپ سامسونگ گران'}\nindex = build_inverted_index(docs)\nprint(index['سامسونگ'])  # {1, 2}",
exercise:"با تابع بالا یک ایندکس معکوس ساده روی ۱۰ سند متنی بسازید و یک تابع جستجوی چندکلمه‌ای (اشتراک مجموعه‌ها) بنویسید که اسناد حاوی همهٔ کلمات را برگرداند.",
project:"راه‌اندازی Elasticsearch محلی، ایندکس کردن یک مجموعه دادهٔ نمونه (مثل محصولات فروشگاه)، و ساخت یک API جستجو در Django که با کوئری‌های match و پاسخ‌های امتیازدهی‌شده کار کند.",
resources:[{t:"Elasticsearch docs - Inverted index",u:"https://www.elastic.co/guide/en/elasticsearch/reference/current/index.html"},{t:"Elasticsearch docs - BM25 relevance",u:"https://www.elastic.co/guide/en/elasticsearch/guide/current/scoring-theory.html"}],
criteria:"می‌توانید یک ایندکس معکوس ساده در پایتون بسازید و توضیح دهید BM25 چگونه تکرار کلمه و نادر بودن آن را در امتیاز ترکیب می‌کند.",
interview:["ایندکس معکوس چیست و چرا برای جستجوی متنی از LIKE در SQL بهتر است؟","TF-IDF/BM25 چگونه Relevance را محاسبه می‌کند؟"],
mistakes:["استفاده از LIKE '%keyword%' در PostgreSQL برای جستجوی متنی روی جدول بزرگ که نمی‌تواند از ایندکس معمولی B-Tree به‌طور کامل بهره ببرد و کند است"],
production:"جستجوی محصول در فروشگاه‌های بزرگ آنلاین همیشه روی Elasticsearch/OpenSearch ساخته می‌شود نه کوئری LIKE مستقیم روی دیتابیس اصلی.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم ایندکس معکوس، Analyzer (Tokenization/Stemming) و رتبه‌بندی BM25 را عمیق توضیح بده. کمکم کن یک ایندکس معکوس سادهٔ پایتونی بسازم و بعد با Elasticsearch واقعی مقایسه‌اش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"search-vector-semantic",title:"جستجوی برداری/معنایی (Vector Search) و جستجوی فازی",level:"Advanced",minLadder:null,prereqs:["search-inverted-index-bm25"],
short:"وقتی کاربر کلمهٔ دقیق سند را نمی‌داند یا اشتباه تایپ می‌کند، BM25 به‌تنهایی کافی نیست.",
deep:"BM25 و ایندکس معکوس بر تطابق دقیق کلمه (Lexical Match) تکیه دارند - اگر کاربر 'ماشین حساب' جستجو کند اما سند از عبارت 'کلکولاتور' استفاده کرده باشد، هیچ تطابقی پیدا نمی‌شود چون از نظر معنایی مرتبطند اما از نظر کلمه یکسان نیستند. جستجوی برداری (Vector/Semantic Search) این مشکل را حل می‌کند: متن (یا تصویر) با یک مدل Embedding به یک بردار عددی با ابعاد بالا تبدیل می‌شود که 'معنا' را در فضای برداری کدگذاری می‌کند - متن‌های معنایی نزدیک، بردارهای نزدیک به هم دارند (با معیارهایی مثل شباهت کسینوسی)؛ جستجو یعنی یافتن نزدیک‌ترین بردارها به بردار Query، که در مقیاس میلیونی با ایندکس‌های تقریبی نزدیک‌ترین همسایه (ANN، مثل HNSW) در زمان معقول انجام می‌شود چون جستجوی دقیق نزدیک‌ترین همسایه در ابعاد بالا برای دیتاست بزرگ عملاً غیرممکن کند است. جستجوی فازی (Fuzzy Search) مشکل دیگری را حل می‌کند: غلط املایی/تایپی - با معیار Edit Distance (تعداد کمینه تغییرات حرفی برای رسیدن از یک کلمه به کلمهٔ دیگر) کلماتی که 'نزدیک' کلمهٔ جستجوشده‌اند هم در نظر گرفته می‌شوند. در عمل، بهترین سیستم‌های جستجوی مدرن Hybrid Search هستند: نتایج BM25 (دقیق، سریع، قابل‌توضیح) را با نتایج جستجوی برداری (معنایی، برای Queryهای مبهم یا هم‌معنا) ترکیب می‌کنند تا هم دقت کلمه‌ای و هم درک معنایی را همزمان داشته باشند.",
objectives:["توضیح تفاوت جستجوی Lexical (BM25) و Semantic (Vector) و چه مشکلی هرکدام حل می‌کنند","توضیح مفهوم ANN Index و چرا جستجوی دقیق نزدیک‌ترین همسایه در مقیاس بزرگ عملی نیست"],
example:"جستجوی 'خودروی دست‌دوم ارزان' با Vector Search می‌تواند سندی با عنوان 'ماشین کارکرده مقرون‌به‌صرفه' را هم پیدا کند، در حالی که BM25 به‌تنهایی این تطابق را از دست می‌دهد چون هیچ کلمه‌ای دقیقاً یکسان نیست.",
py:"# مثال بسیار ساده‌شدهٔ شباهت کسینوسی بین دو بردار Embedding\nimport math\n\ndef cosine_similarity(a, b):\n    dot = sum(x*y for x, y in zip(a, b))\n    norm_a = math.sqrt(sum(x*x for x in a))\n    norm_b = math.sqrt(sum(y*y for y in b))\n    return dot / (norm_a * norm_b)",
exercise:"با یک کتابخانهٔ Embedding سبک (یا حتی بردارهای دستی ساده)، برای ۵ جملهٔ کوتاه Embedding محاسبه کنید و با شباهت کسینوسی نزدیک‌ترین جمله به یک Query را پیدا کنید؛ نتیجه را با جستجوی کلمه‌ای ساده مقایسه کنید.",
project:"", resources:[{t:"Pinecone - What is a Vector Database (توضیح مفهومی رایگان)",u:"https://www.pinecone.io/learn/vector-database/"},{t:"Elasticsearch docs - Dense vector / kNN search",u:"https://www.elastic.co/guide/en/elasticsearch/reference/current/dense-vector.html"}],
criteria:"می‌توانید توضیح دهید چه زمانی BM25 به‌تنهایی کافی نیست، و یک سیستم Hybrid Search (ترکیب Lexical و Semantic) را در سطح مفهومی طراحی کنید.",
interview:["Vector Search چه مشکلی را حل می‌کند که BM25 نمی‌تواند؟","چرا برای جستجوی نزدیک‌ترین همسایه در مقیاس بزرگ از ایندکس تقریبی (ANN) به‌جای جستجوی دقیق استفاده می‌شود؟"],
mistakes:["استفاده صرف از Vector Search بدون BM25 برای Queryهای دقیق و کوتاه (مثل جستجوی شمارهٔ محصول)، که در آن تطابق دقیق کلمه‌ای معمولاً بهتر از شباهت معنایی است"],
production:"موتورهای توصیه و جستجوی مدرن (مثل جستجوی محصول در فروشگاه‌های بزرگ) اغلب از Hybrid Search استفاده می‌کنند تا هم Queryهای دقیق و هم Queryهای مبهم/هم‌معنا را خوب پوشش دهند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. جستجوی برداری/معنایی (Embedding، ANN Index) و جستجوی فازی را در تمایز با BM25 که قبلاً یاد گرفتم آموزش بده و مفهوم Hybrid Search را با مثال نشان بده. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p47",num:47,title:"سیستم‌های بلادرنگ",icon:"💬",summary:"WebSocket، SSE، Pub/Sub و معماری چت/اعلان.",
topics:[
{id:"realtime-websocket-presence",title:"WebSocket، Django Channels و مدیریت Presence",level:"Advanced",minLadder:3,prereqs:["wsgi-asgi","redis-data-structures"],
short:"چگونه ارتباط دوطرفهٔ بلادرنگ (مثل چت) را در Django پیاده‌سازی و در چند سرور مقیاس دهیم.",
deep:"WebSocket برخلاف HTTP معمولی، یک اتصال دوطرفهٔ پایدار (Full-duplex) روی یک اتصال TCP باز نگه می‌دارد که هم سرور و هم کلاینت می‌توانند در هر لحظه پیام بفرستند، بدون نیاز به Polling مکرر - ایده‌آل برای چت، اعلان بلادرنگ یا داشبورد زنده. Django Channels این قابلیت را با معماری ASGI به Django اضافه می‌کند: هر اتصال WebSocket یک Consumer (مشابه View اما برای پیام‌های async) دارد. چالش اصلی مقیاس‌پذیری: وقتی چند سرور Django Channels دارید، اتصال WebSocket کاربر A به سرور ۱ وصل است اما پیامی که باید به او برسد ممکن است از سرور ۲ (که کاربر دیگری در آن فعالیت کرده) تولید شود - راه‌حل، یک Channel Layer مشترک (معمولاً Redis Pub/Sub) است که پیام را بین تمام سرورها پخش می‌کند تا سروری که واقعاً اتصال کاربر مقصد را دارد، آن را به WebSocket برساند. Presence (نشان دادن 'کاربر آنلاین است') با نگه‌داشتن یک کلید در Redis با TTL کوتاه (که هر چند ثانیه توسط یک Heartbeat از کلاینت تمدید می‌شود) پیاده می‌شود؛ اگر Heartbeat قطع شود (کاربر آفلاین شده یا اتصال قطع شده)، کلید منقضی می‌شود و سیستم بدون نیاز به دریافت پیام صریح 'قطع اتصال' (که ممکن است هرگز نرسد، مثلاً موبایل خاموش شد) کاربر را آفلاین تشخیص می‌دهد.",
objectives:["پیاده‌سازی یک Consumer چت ساده با Django Channels","توضیح نقش Redis Channel Layer در معماری چندسروری WebSocket"],
example:"# routing.py\nwebsocket_urlpatterns = [path('ws/chat/<room_name>/', ChatConsumer.as_asgi())]",
py:"from channels.generic.websocket import AsyncWebsocketConsumer\nimport json\n\nclass ChatConsumer(AsyncWebsocketConsumer):\n    async def connect(self):\n        self.room_group_name = f'chat_{self.scope[\"url_route\"][\"kwargs\"][\"room_name\"]}'\n        await self.channel_layer.group_add(self.room_group_name, self.channel_name)\n        await self.accept()\n\n    async def receive(self, text_data):\n        data = json.loads(text_data)\n        await self.channel_layer.group_send(self.room_group_name, {'type': 'chat_message', 'message': data['message']})\n\n    async def chat_message(self, event):\n        await self.send(text_data=json.dumps({'message': event['message']}))",
exercise:"با کد بالا یک اتاق چت ساده بسازید که چند کاربر بتوانند از طریق مرورگر (با یک HTML ساده حاوی new WebSocket) با هم چت کنند؛ سپس دو نمونهٔ سرور Django را با یک Redis Channel Layer مشترک اجرا کنید و نشان دهید پیام بین سرورها منتقل می‌شود.",
project:"سیستم چت کامل با Django Channels، Redis Channel Layer، مدیریت Presence (آنلاین/آفلاین) و تاریخچهٔ پیام ذخیره‌شده در PostgreSQL.",
resources:[{t:"Django Channels docs",u:"https://channels.readthedocs.io/en/latest/"},{t:"MDN - WebSocket API",u:"https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API"}],
criteria:"می‌توانید یک سیستم چت چندنفره با Django Channels بسازید که در معماری چندسروری (با Redis Channel Layer) به‌درستی کار کند.",
interview:["تفاوت WebSocket و Server-Sent Events (SSE) چیست و هرکدام کِی مناسب‌ترند؟","چرا در معماری چندسروری WebSocket به یک Channel Layer مشترک نیاز داریم؟"],
mistakes:["فراموش کردن Channel Layer مشترک که باعث می‌شود پیام فقط بین کاربران متصل به همان سرور مشخص کار کند (به‌ظاهر در تست تک‌سروری کار می‌کند اما در تولید چندسروری می‌شکند)"],
production:"بسیاری از باگ‌های 'چت فقط گاهی کار می‌کند' در تولید ریشه در نبود یا پیکربندی نادرست Channel Layer مشترک در معماری چندسروری دارند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. معماری WebSocket با Django Channels، نقش Redis Channel Layer در مقیاس‌پذیری چندسروری و مدیریت Presence را توضیح بده. کمکم کن یک سیستم چت ساده بسازم و سناریوی 'پیام بین سرورها منتقل نمی‌شود' را دیباگ کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"realtime-sse-webhooks",title:"Server-Sent Events (SSE) و طراحی Webhook قابل‌اعتماد",level:"Intermediate",minLadder:3,prereqs:["realtime-websocket-presence"],
short:"وقتی فقط سرور نیاز دارد حرف بزند (نه دوطرفه)، و وقتی سیستم شما باید به سیستم دیگری خبر بدهد.",
deep:"Server-Sent Events (SSE) یک اتصال HTTP یک‌طرفه و پایدار است که فقط سرور به کلاینت پیام می‌فرستد (بدون نیاز کلاینت به فرستادن پیام از همان کانال) - برخلاف WebSocket که Full-duplex و پیچیده‌تر است، SSE روی HTTP معمولی کار می‌کند (بدون نیاز به Upgrade پروتکل)، به‌طور خودکار در صورت قطعی Reconnect می‌کند، و برای سناریوهایی مثل پیشرفت یک Job طولانی، اعلان‌های یک‌طرفه، یا استریم پاسخ یک مدل زبانی، ساده‌تر و سبک‌تر از WebSocket است؛ انتخاب بین این دو باید بر اساس نیاز واقعی به ارتباط دوطرفه باشد نه صرفاً 'مدرن‌تر بودن'. Webhook مکانیزم متفاوتی است: به‌جای اینکه سیستم شما مرتب یک API خارجی را Poll کند ('آیا پرداخت انجام شد؟')، سیستم خارجی خودش، وقتی رویداد اتفاق افتاد، یک درخواست HTTP POST به یک URL از‌پیش‌تعریف‌شدهٔ شما می‌فرستد. طراحی درست Webhook نیازمند سه چیز است: امضای درخواست (Signature، معمولاً HMAC با یک Secret مشترک، که تأیید می‌کند درخواست واقعاً از فرستندهٔ ادعایی آمده نه یک مهاجم که آدرس شما را حدس زده)، تلاش مجدد با Backoff از سمت فرستنده (چون شبکه/سرور شما ممکن است لحظه‌ای در دسترس نباشد)، و Idempotent بودن گیرنده (چون تلاش مجدد یعنی همان رویداد ممکن است بیش از یک بار برسد - دقیقاً همان اصل Idempotency-Key که در بحث API دیدیم، اینجا با یک شناسهٔ رویداد یکتا در Payload).",
objectives:["توضیح چه زمانی SSE به‌جای WebSocket انتخاب درست است","طراحی یک گیرندهٔ Webhook امن (تأیید امضا) و Idempotent (مقاوم به تحویل تکراری)"],
example:"سرویس پرداختی که بعد از تکمیل تراکنش، یک POST با هدر X-Signature (امضای HMAC بدنهٔ درخواست با یک کلید مشترک) به آدرس Webhook شما می‌فرستد؛ شما باید امضا را قبل از پردازش، اعتبارسنجی کنید.",
py:"import hmac, hashlib\n\ndef verify_webhook_signature(payload: bytes, signature: str, secret: str) -> bool:\n    expected = hmac.new(secret.encode(), payload, hashlib.sha256).hexdigest()\n    return hmac.compare_digest(expected, signature)  # compare_digest برای جلوگیری از Timing Attack",
exercise:"یک Endpoint Django بسازید که یک Webhook دریافت می‌کند: امضای HMAC را تأیید کند، شناسهٔ رویداد را در دیتابیس با یک محدودیت Unique ذخیره کند (برای Idempotency در برابر تحویل تکراری)، و در صورت تکراری بودن، بدون خطا فقط 200 برگرداند.",
project:"", resources:[{t:"MDN - Server-Sent Events",u:"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events"},{t:"Stripe docs - Webhooks (نمونهٔ صنعتی طراحی Webhook)",u:"https://stripe.com/docs/webhooks"}],
criteria:"می‌توانید توضیح دهید چه زمانی SSE بر WebSocket ترجیح دارد، و یک گیرندهٔ Webhook امن و Idempotent پیاده‌سازی کنید.",
interview:["چه زمانی SSE مناسب‌تر از WebSocket است؟","چرا یک گیرندهٔ Webhook باید هم امضا را تأیید کند و هم Idempotent باشد؟"],
mistakes:["پردازش Webhook بدون تأیید امضا (که به هرکس آدرس URL را حدس بزند اجازهٔ ارسال رویداد جعلی می‌دهد) یا بدون محافظت در برابر تحویل تکراری همان رویداد"],
production:"بسیاری از باگ‌های 'دو بار پردازش شدن یک پرداخت' ریشه در گیرندهٔ Webhook دارند که فرض کرده هر رویداد فقط یک‌بار می‌رسد، در حالی که تحویل حداقل‌یک‌بار (At-least-once) استاندارد صنعتی اکثر فرستنده‌های Webhook است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تفاوت SSE و WebSocket، و طراحی امن و Idempotent یک گیرندهٔ Webhook (امضای HMAC، تحویل تکراری) را آموزش بده. یک سناریوی Webhook واقعی (مثل تأیید پرداخت) بده تا گیرندهٔ آن را پیاده‌سازی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p48",num:48,title:"شیوه‌های مهندسی",icon:"📝",summary:"کد تمیز، Code Review، ADR/RFC و مدیریت بدهی فنی.",
topics:[
{id:"eng-practices-adr-review",title:"Architecture Decision Record (ADR) و Code Review مؤثر",level:"Intermediate",minLadder:3,prereqs:["clean-architecture-ddd"],
short:"چگونه تصمیمات معماری را مستند کنیم و بازبینی کد را به ابزار یادگیری تیمی تبدیل کنیم نه صرفاً دروازهٔ Merge.",
deep:"ADR (Architecture Decision Record) یک سند کوتاه (معمولاً یک صفحه) است که یک تصمیم معماری مهم را مستند می‌کند: Context (چه مشکلی حل می‌شد و چه محدودیت‌هایی وجود داشت)، Decision (چه تصمیمی گرفته شد)، Alternatives Considered (چه گزینه‌های دیگری بررسی و چرا رد شدند) و Consequences (چه مصالحه‌هایی پذیرفته شد). بدون ADR، شش ماه بعد هیچ‌کس (حتی نویسندهٔ اصلی) به یاد نمی‌آورد چرا مثلاً MongoDB به‌جای PostgreSQL انتخاب شد، و ریسک این وجود دارد که همان بحث از صفر دوباره تکرار شود یا تصمیم اشتباه بدون فهم Context اصلی معکوس شود. Code Review مؤثر فراتر از پیدا کردن باگ نحوی است: باید بررسی کند آیا طراحی با اصول تیم (مثل SOLID، مرزهای معماری) همسو است، آیا تست کافی وجود دارد، و آیا کد برای یک عضو جدید تیم قابل فهم است - اما باید از Nitpicking بیش از حد (تمرکز روی جزئیات سبک کدنویسی که با ابزارهای خودکار مثل linter/formatter باید حل شوند نه بحث انسانی) پرهیز کرد. بازخورد باید Actionable (قابل اقدام مشخص) و محترمانه باشد؛ تفاوت گذاشتن بین 'این یک مشکل جدی است' و 'این یک پیشنهاد اختیاری است' (مثلاً با پیشوندهایی مثل nit: یا blocking:) ارتباط را شفاف‌تر می‌کند.",
objectives:["نوشتن یک ADR کامل برای یک تصمیم معماری واقعی","ارائهٔ بازخورد Code Review که هم دقیق و هم محترمانه باشد"],
example:"ADR-007: انتخاب PostgreSQL به‌جای MongoDB برای سرویس سفارش. Context: نیاز به تراکنش ACID بین چند جدول مرتبط. Decision: PostgreSQL. Alternatives: MongoDB (رد شد چون تراکنش چندسندی پیچیده‌تر بود).",
py:"", exercise:"برای یک تصمیم معماری واقعی که اخیراً در پروژهٔ خودتان گرفته‌اید (یا فرضی، مثل انتخاب Celery به‌جای Kafka برای صف تسک ساده)، یک ADR کامل با چهار بخش بنویسید.",
project:"", resources:[{t:"ADR GitHub organization (نمونه‌ها و ابزار رایگان)",u:"https://adr.github.io/"},{t:"Google Engineering Practices - Code Review",u:"https://google.github.io/eng-practices/review/"}],
criteria:"می‌توانید یک ADR کامل و قابل‌فهم برای یک تصمیم معماری بنویسید و یک بازخورد Code Review actionable و محترمانه ارائه دهید.",
interview:["ADR چیست و چه مشکلی را حل می‌کند؟","چطور بین بازخورد 'الزامی' و 'اختیاری' در Code Review تمایز قائل می‌شوید؟"],
mistakes:["ندادن دلیل رد شدن گزینه‌های جایگزین در ADR، که باعث می‌شود بعداً همان بحث بدون دانستن چرایی رد قبلی دوباره مطرح شود"],
production:"تیم‌های بزرگ مهندسی (Google، AWS) به‌طور رسمی از ADR و سند طراحی قبل از پیاده‌سازی تغییرات معماری بزرگ استفاده می‌کنند تا از تصمیم‌گیری‌های عجولانه جلوگیری شود.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. مفهوم ADR و اصول Code Review مؤثر را توضیح بده. یک تصمیم معماری فرضی بده تا یک ADR کامل بنویسم، و یک قطعه کد با چند مشکل بده تا بازخورد Code Review دقیق و محترمانه بنویسم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"eng-clean-code-techdebt",title:"کد تمیز فراتر از SOLID، و مدیریت بدهی فنی",level:"Intermediate",minLadder:3,prereqs:["dry-kiss-yagni"],
short:"اصولی که به تنهایی 'قانون' نیستند اما تفاوت بین کد قابل‌نگهداری و کد کابوس‌وار را می‌سازند.",
deep:"کد تمیز فراتر از رعایت الگوهای طراحی است: نام‌گذاری که نیت را بدون کامنت اضافی بیان می‌کند (get_active_users_since به‌جای get_users با یک پارامتر مبهم)، توابع کوچک با یک سطح انتزاع یکسان درون خودشان (ترکیب نکردن جزئیات پیاده‌سازی سطح‌پایین با منطق سطح‌بالا در یک تابع)، و حذف تدریجی کد مرده/کامنت‌شده به‌جای نگه‌داشتن 'شاید بعداً لازم شود'. بدهی فنی (Technical Debt) استعارهٔ مفیدی است: یک میان‌بر عمدی (مثلاً Hardcode کردن یک مقدار برای رسیدن به Deadline) مثل قرض گرفتن پول است - قابل قبول اگر آگاهانه و با برنامهٔ بازپرداخت باشد، فاجعه‌بار اگر ناخودآگاه انباشته شود و 'بهرهٔ' آن (کندتر شدن توسعهٔ هر فیچر بعدی به‌خاطر پیچیدگی انباشته) هرگز پرداخت نشود. مدیریت بدهی فنی نیازمند دیده‌شدن است: ثبت آن (نه فقط در ذهن یک نفر، بلکه در یک بک‌لاگ یا Issue Tracker قابل جستجو)، اولویت‌بندی بر اساس تأثیر واقعی (بدهی که مانع سرعت تیم می‌شود باید زودتر از بدهی زیبایی‌شناختی صرف پرداخت شود)، و تخصیص زمان مشخص (مثل ۲۰٪ ظرفیت اسپرینت) برای پرداخت آن، وگرنه همیشه فداي فیچرهای فوری‌تر می‌شود. یک نشانهٔ رایج بدهی فنی انباشته‌شده: زمان تخمینی برای فیچرهای مشابه هر ماه بیشتر از ماه قبل می‌شود، بدون اینکه دلیل مشخصی (به‌جز 'کد قدیمی سخت است') وجود داشته باشد.",
objectives:["بازنویسی یک تابع با نام‌گذاری مبهم و سطوح انتزاع مخلوط به نسخهٔ خوانا","طراحی یک فرآیند ثبت و اولویت‌بندی بدهی فنی برای یک تیم"],
example:"تابعی به نام process(data, flag) که هم اعتبارسنجی، هم محاسبه و هم ارسال ایمیل انجام می‌دهد، نمونهٔ کلاسیک ترکیب سطوح انتزاع مختلف در یک تابع است که باید به سه تابع مجزا تقسیم شود.",
py:"# قبل: نام‌گذاری مبهم و سطوح انتزاع مخلوط\ndef process(data, flag):\n    if not data.get('email'):\n        return None\n    total = sum(i['price'] * i['qty'] for i in data['items'])\n    if flag:\n        send_mail(data['email'], f'جمع: {total}')\n    return total\n\n# بعد: نام‌گذاری واضح، هر تابع یک مسئولیت\ndef calculate_order_total(items):\n    return sum(i['price'] * i['qty'] for i in items)\n\ndef notify_customer_of_total(email, total):\n    send_mail(email, f'جمع سفارش شما: {total}')",
exercise:"یک بدهی فنی واقعی در یک پروژهٔ فرضی شناسایی کنید (مثلاً 'یک Endpoint هنوز از یک کتابخانهٔ منسوخ استفاده می‌کند')؛ تأثیر آن را (کندی توسعه، ریسک امنیتی) بنویسید و یک برنامهٔ اولویت‌بندی و بازپرداخت پیشنهاد دهید.",
project:"", resources:[{t:"Martin Fowler - TechnicalDebt",u:"https://martinfowler.com/bliki/TechnicalDebt.html"},{t:"Clean Code (Robert C. Martin) - خلاصه‌های مفهومی رایگان",u:"https://www.oreilly.com/library/view/clean-code-a/9780136083238/"}],
criteria:"می‌توانید یک تابع با نام‌گذاری مبهم را به کد خوانا با سطح انتزاع یکسان بازنویسی کنید، و برای یک بدهی فنی واقعی یک برنامهٔ اولویت‌بندی مستدل ارائه دهید.",
interview:["چرا بدهی فنی همیشه بد نیست، و چه زمانی پذیرفتن آن یک تصمیم آگاهانهٔ درست است؟","چرا مخلوط کردن سطوح انتزاع مختلف در یک تابع خوانایی را کاهش می‌دهد؟"],
mistakes:["انباشتن بدهی فنی بدون ثبت یا اولویت‌بندی، تا جایی که تیم دیگر نمی‌داند کجا شروع کند یا چرا هر فیچر جدید کندتر از قبل است"],
production:"تیم‌هایی که زمان مشخصی (مثل بخشی از هر اسپرینت) را به پرداخت بدهی فنی اختصاص نمی‌دهند، معمولاً بعد از یک تا دو سال با سرعت توسعهٔ به‌شدت کاهش‌یافته مواجه می‌شوند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. اصول کد تمیز (نام‌گذاری، سطح انتزاع یکسان) فراتر از SOLID، و مدیریت عملی بدهی فنی (ثبت، اولویت‌بندی، بازپرداخت) را آموزش بده. یک تابع با کد نامرتب بده تا بازنویسی‌اش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p49",num:49,title:"مهارت دیباگ",icon:"🐞",summary:"سناریوهای واقعی اینسیدنت: CPU 100%، نشت حافظه، Connection Pool Exhaustion و بیشتر.",
topics:[
{id:"debug-cpu-100-connection-exhaustion",title:"سناریوی دیباگ: CPU ناگهان به ۱۰۰٪ می‌رسد و Connection Pool تمام می‌شود",level:"Expert",minLadder:5,prereqs:["linux-process-tools","perf-profiling","db-query-planner"],
short:"یک اینسیدنت واقع‌گرایانهٔ ترکیبی که نیازمند ترکیب چند مهارت دیباگ (Linux، پروفایلینگ، دیتابیس) است.",
deep:"سناریو: ساعت ۱۴:۳۰، Dashboard مانیتورینگ نشان می‌دهد CPU سرورهای اپلیکیشن به ۱۰۰٪ رسیده و کاربران گزارش خطای 'connection pool exhausted' می‌دهند. روند تحقیق سیستماتیک: (۱) با top/htop مشخص می‌شود آیا CPU توسط پروسه‌های Python (Gunicorn Worker) یا فرآیندی دیگر (مثل یک Backup ناخواسته) اشغال شده؛ (۲) اگر Workerها مقصرند، با py-spy dump --pid به یکی از آن‌ها متصل می‌شویم تا ببینیم دقیقاً کدام تابع در حال اجراست - فرض کنیم نتیجه نشان می‌دهد اکثر Workerها در حال اجرای یک متد سریالایزیشن پیچیده روی یک Queryset بزرگ هستند؛ (۳) با بررسی لاگ‌های اخیر Deploy، معلوم می‌شود یک تغییر کد اخیر یک select_related را حذف کرده، که یک N+1 Query شدید ایجاد کرده (این را با EXPLAIN ANALYZE و pg_stat_activity در دیتابیس تأیید می‌کنیم - تعداد کوئری‌های فعال ناگهان بالا رفته)؛ (۴) این یعنی هر Worker به‌جای پردازش سریع، اکنون صدها کوئری کوچک برای هر درخواست می‌زند که هم CPU (سریالایزیشن نتایج بیشتر) و هم Connection Pool دیتابیس (چون هر کوئری یک Connection را برای مدت طولانی‌تر اشغال می‌کند) را تحت فشار می‌گذارد؛ رفع فوری: Rollback فوری Deploy اخیر (اقدام تسکین‌دهنده)؛ رفع ریشه‌ای: بازگرداندن select_related و افزودن یک تست Regression که تعداد کوئری‌ها را برای این Endpoint اندازه‌گیری و در صورت افزایش غیرمنتظره Fail می‌کند.",
objectives:["اجرای فرآیند سیستماتیک تشخیص از علائم تا علت ریشه‌ای برای یک اینسیدنت چندلایه","نوشتن یک تست Regression که از بازگشت N+1 Query جلوگیری کند"],
example:"pg_stat_activity در PostgreSQL نشان می‌دهد تعداد کانکشن‌های active از ۱۰ به ۹۵ (نزدیک max_connections) در عرض چند دقیقه رسیده - نشانهٔ واضح یک تغییر کد اخیر.",
py:"# تست Regression برای جلوگیری از بازگشت N+1\nimport pytest\nfrom django.test.utils import CaptureQueriesContext\nfrom django.db import connection\n\n@pytest.mark.django_db\ndef test_order_list_query_count_is_constant():\n    from myapp.models import Order, Customer\n    customer = Customer.objects.create(name='test')\n    for _ in range(20):\n        Order.objects.create(customer=customer, total=100)\n    with CaptureQueriesContext(connection) as ctx:\n        response = client.get('/api/orders/')\n    assert len(ctx.captured_queries) < 5  # صرف‌نظر از تعداد سفارش‌ها، تعداد کوئری ثابت باید بماند",
exercise:"سناریوی بالا را به‌صورت مکتوب کامل کنید: علائم، فرضیه‌های اول تا آخر (شامل فرضیه‌های رد‌شده)، دستورات دقیق استفاده‌شده در هر مرحله، علت ریشه‌ای، رفع فوری، رفع ریشه‌ای و اقدام پیشگیرانه.",
project:"", resources:[{t:"PostgreSQL docs - pg_stat_activity",u:"https://www.postgresql.org/docs/current/monitoring-stats.html"},{t:"py-spy (GitHub)",u:"https://github.com/benfred/py-spy"}],
criteria:"می‌توانید یک اینسیدنت ترکیبی (CPU + Connection Pool) را با ترتیب صحیح ابزارها (top → py-spy → pg_stat_activity → EXPLAIN) از علامت تا علت ریشه‌ای دنبال کنید و اقدام پیشگیرانه (تست Regression) طراحی کنید.",
interview:["اگر CPU سرورهای اپلیکیشن ناگهان ۱۰۰٪ شود و کاربران خطای connection pool ببینند، دقیقاً چه مراحلی را طی می‌کنید؟"],
mistakes:["ری‌استارت سریع سرورها بدون بررسی علت ریشه‌ای که مشکل را موقتاً پنهان می‌کند اما ساعتی بعد دوباره ظاهر می‌شود"],
production:"این دقیقاً الگوی یک اینسیدنت واقعی رایج در تیم‌های Django است که معمولاً ریشه در یک Deploy اخیر بدون Review کافی روی تعداد کوئری‌ها دارد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. یک سناریوی کامل اینسیدنت 'CPU 100٪ و Connection Pool Exhaustion' طراحی کن، فقط علائم اولیه را به من بده (نه علت)، و من را قدم‌به‌قدم (top → py-spy → pg_stat_activity → کد) در فرآیند تشخیص راهنمایی کن، فقط بعد از هر فرضیهٔ من بازخورد بده که آیا این آزمایش می‌تواند فرضیه را رد یا تأیید کند. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p50",num:50,title:"کیفیت کد",icon:"💎",summary:"خوانایی، Coupling/Cohesion، طراحی خطا و سازگاری با گذشته.",
topics:[
{id:"code-quality-error-handling",title:"طراحی مدیریت خطا (Exception Design) و خوانایی کد",level:"Intermediate",minLadder:2,prereqs:["solid-principles"],
short:"چگونه استثناها را طوری طراحی کنیم که خطاها معنادار، قابل‌ردیابی و قابل‌مدیریت باشند.",
deep:"یک اشتباه رایج، استفاده از استثناهای عمومی (Exception, ValueError برای همه‌چیز) است که مدیریت انتخابی خطا را غیرممکن می‌کند - کلاینت کد نمی‌تواند تشخیص دهد آیا خطا یک مشکل موقتی قابل Retry است یا یک خطای دائمی کسب‌وکاری. طراحی خوب، سلسله‌مراتب استثنای دامنه‌محور می‌سازد (مثلاً InsufficientFundsError(PaymentError) و ExternalGatewayTimeoutError(PaymentError)) که به کد فراخوان اجازه می‌دهد با except دقیق، رفتار متفاوت (Retry برای Timeout، پیام کاربر برای موجودی ناکافی) اعمال کند. یک اصل مهم: 'Never Swallow Exceptions Silently' - گرفتن except Exception: pass بدون لاگ، دقیقاً یکی از مخرب‌ترین الگوهای کد است چون خطا بی‌صدا ناپدید می‌شود و ردیابی بعدی آن تقریباً غیرممکن است. خوانایی کد به‌معنای این است که یک مهندس دیگر (یا خودتان شش ماه بعد) بتواند بدون کامنت اضافی منظور کد را بفهمد - نام‌گذاری واضح (تابعی به نام calculate_total به‌جای process، متغیری به نام is_eligible_for_discount به‌جای flag) و توابع کوچک با یک مسئولیت مشخص (که مستقیماً به SRP وصل می‌شود) بیشترین تأثیر را دارند، بیشتر از هر کامنت طولانی.",
objectives:["طراحی یک سلسله‌مراتب استثنای دامنه‌محور برای یک سرویس پرداخت","بازنویسی یک except Exception عمومی به مدیریت خطای دقیق"],
example:"class PaymentError(Exception): pass\nclass InsufficientFundsError(PaymentError): pass\nclass GatewayTimeoutError(PaymentError): pass\n# کد فراخوان می‌تواند با except GatewayTimeoutError دوباره تلاش کند اما با except InsufficientFundsError پیام کاربر نمایش دهد",
py:"class PaymentError(Exception):\n    '''خطای پایهٔ همهٔ خطاهای پرداخت'''\n\nclass InsufficientFundsError(PaymentError):\n    def __init__(self, required, available):\n        self.required = required\n        self.available = available\n        super().__init__(f'موجودی ناکافی: نیاز {required}, موجود {available}')\n\nclass GatewayTimeoutError(PaymentError):\n    pass\n\ndef charge(amount):\n    try:\n        result = external_gateway.charge(amount)\n    except TimeoutError as e:\n        raise GatewayTimeoutError('درگاه پرداخت پاسخ نداد') from e\n    if not result.success:\n        raise InsufficientFundsError(amount, result.available_balance)\n    return result",
exercise:"یک تابع با except Exception: pass عمومی و بی‌صدا بنویسید (که یک باگ رایج را شبیه‌سازی می‌کند)، سپس آن را با یک سلسله‌مراتب استثنای دقیق و مدیریت جداگانهٔ هر نوع خطا بازنویسی کنید.",
project:"", resources:[{t:"Python docs - Built-in Exceptions",u:"https://docs.python.org/3/library/exceptions.html"},{t:"Google Python Style Guide",u:"https://google.github.io/styleguide/pyguide.html"}],
criteria:"می‌توانید یک سلسله‌مراتب استثنای دامنه‌محور برای یک سرویس واقعی طراحی کنید که کد فراخوان بتواند بر اساس نوع خطا رفتار متفاوت (Retry، پیام کاربر، لاگ بحرانی) اعمال کند.",
interview:["چرا except Exception: pass یک ضد-الگوی خطرناک است؟","چگونه یک سلسله‌مراتب استثنای معنادار طراحی می‌کنید؟"],
mistakes:["گرفتن استثنا و بی‌صدا نادیده گرفتن آن بدون لاگ، که خطا را برای همیشه پنهان می‌کند"],
production:"بسیاری از 'باگ‌های شبح' (که هرگز خطا نشان نمی‌دهند اما رفتار اشتباه دارند) ریشه در except عمومی بی‌صدا دارند که خطای واقعی را قورت داده است.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی استثنا (Exception Design) و اصول خوانایی کد را با مثال یک سرویس پرداخت آموزش بده. یک تابع با except عمومی بی‌صدا بده تا آن را با سلسله‌مراتب استثنای دقیق بازنویسی کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"code-quality-coupling-cohesion",title:"Coupling و Cohesion، و تکامل سازگار با گذشتهٔ API",level:"Advanced",minLadder:3,prereqs:["code-quality-error-handling"],
short:"دو معیار نامرئی که تعیین می‌کنند یک تغییر کوچک، چند فایل دیگر را هم مجبور به تغییر می‌کند یا نه.",
deep:"Cohesion (انسجام) می‌گوید عناصر درون یک ماژول/کلاس چقدر منطقاً به هم مرتبط و حول یک مسئولیت واحدند - یک کلاس OrderService با متدهایی مثل create_order، cancel_order و calculate_total انسجام بالا دارد؛ کلاسی که هم سفارش، هم ارسال ایمیل و هم گزارش‌گیری مالی را مدیریت می‌کند انسجام پایین دارد (نقض SRP). Coupling (وابستگی متقابل) می‌گوید دو ماژول چقدر به جزئیات داخلی هم وابسته‌اند - Coupling پایین یعنی تغییر پیاده‌سازی داخلی یک ماژول (بدون تغییر رابط عمومی‌اش) نیازی به تغییر ماژول‌های دیگر ندارد. هدف طراحی خوب، Cohesion بالا و Coupling پایین است؛ رابطهٔ این دو با معماری‌های قبلی (Clean Architecture، Bounded Context در Microservices) مستقیم است - یک Bounded Context ضعیف طراحی‌شده دقیقاً یعنی Coupling بالا بین سرویس‌هایی که باید مستقل باشند. تکامل سازگار با گذشته (Backward-Compatible API Evolution) این اصول را به سطح قرارداد عمومی می‌برد: افزودن یک فیلد اختیاری جدید به پاسخ API، تغییری سازگار است (کلاینت‌های قدیمی همچنان کار می‌کنند)؛ حذف یا تغییر نوع یک فیلد موجود، تغییری Breaking است. سیاست Deprecation درست، یک فیلد/Endpoint قدیمی را بلافاصله حذف نمی‌کند بلکه آن را علامت‌گذاری می‌کند (مثلاً هدر Deprecation در پاسخ HTTP)، برای مدتی مشخص (با اعلام قبلی) هر دو نسخه را نگه می‌دارد، و فقط بعد از دورهٔ مهلت مشخص و اطمینان از عدم استفادهٔ فعال، آن را حذف می‌کند - دقیقاً همان اصل Expand-Contract که در Migration دیتابیس دیدیم، این‌بار در سطح قرارداد API.",
objectives:["ارزیابی Coupling/Cohesion یک ماژول موجود و پیشنهاد بازطراحی برای بهبود آن","طراحی یک سیاست Deprecation برای یک فیلد API که به‌درستی مشتریان موجود را نمی‌شکند"],
example:"افزودن فیلد اختیاری shipping_estimate به پاسخ API سفارش: تغییر سازگار (MINOR). حذف فیلد قدیمی customer_name به‌نفع full_name بدون دورهٔ گذار: تغییر Breaking که کلاینت‌های قدیمی را می‌شکند.",
py:"", exercise:"یک کلاس فرضی با انسجام پایین (چند مسئولیت نامرتبط) پیدا کنید یا بسازید؛ آن را به چند کلاس با انسجام بالا و Coupling پایین بین آن‌ها بازطراحی کنید؛ سپس برای یک فیلد API قدیمی، یک سیاست Deprecation دومرحله‌ای (علامت‌گذاری → حذف بعد از مهلت) بنویسید.",
project:"", resources:[{t:"Martin Fowler - Coupling",u:"https://martinfowler.com/ieeeSoftware/coupling.pdf"},{t:"Stripe API - Versioning و Changelog (نمونهٔ عملی Deprecation)",u:"https://stripe.com/docs/api/versioning"}],
criteria:"می‌توانید Coupling/Cohesion یک ماژول موجود را ارزیابی و بهبود دهید، و یک تغییر API را به‌درستی به سازگار/Breaking دسته‌بندی و برایش سیاست Deprecation طراحی کنید.",
interview:["چرا هدف طراحی، Cohesion بالا و Coupling پایین است، نه برعکس؟","چرا حذف مستقیم و فوری یک فیلد API قدیمی (بدون دورهٔ Deprecation) خطرناک است؟"],
mistakes:["حذف یا تغییر رفتار یک فیلد API موجود بدون اعلام قبلی یا دورهٔ گذار، که کلاینت‌های موجود را بدون هشدار می‌شکند"],
production:"شرکت‌هایی مثل Stripe سال‌ها نسخه‌های قدیمی API را همزمان با جدید نگه می‌دارند دقیقاً چون شکستن سازگاری با گذشته اعتماد مشتریان به یک پلتفرم را از بین می‌برد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. Coupling و Cohesion را با مثال کد واقعی، و تکامل سازگار با گذشتهٔ API (شامل سیاست Deprecation) را آموزش بده. یک ماژول با انسجام پایین بده تا بازطراحی‌اش کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

topics:[
{id:"eng-maturity-levels",title:"واژگان بلوغ مهندسی در سطح صنعت و نگاشت آن به نردبان بیت‌پین",level:"Advanced",minLadder:4,prereqs:["eng-practices-adr-review","sre-incident-postmortem"],
short:"عنوان‌های Junior/Mid/Senior/Staff/Principal در شرکت‌های مختلف معنای یکسانی ندارند - چطور این واژگان را ترجمه کنیم، از جمله به نردبان خودمان.",
deep:"برخلاف فاز بعدی (نردبان مهندسی نرم‌افزار بیت‌پین، فاز ۵۴) که سطوح رسمی و دقیق شرکت خودمان را با معیارهای مشخص (قلمرو، اثرگذاری، مهارت، رفتار) تعریف می‌کند، این موضوع دربارهٔ واژگان عمومی صنعت است: چرا 'Senior' در یک استارتاپ ۲۰ نفره می‌تواند معادل 'Staff' در یک شرکت ۵۰۰۰ نفره باشد، و چرا مقایسهٔ مستقیم عنوان‌ها بین شرکت‌ها (مثلاً هنگام مصاحبه یا مذاکرهٔ حقوق) بدون نگاه به تعریف واقعی هر شرکت گمراه‌کننده است. با این حال، چند محور مشترک تقریباً در همهٔ نردبان‌های صنعتی تکرار می‌شود و به همان محورهای نردبان بیت‌پین در فاز ۵۴ نگاشت می‌شوند: قلمرو (Scope - از Task در سطوح ابتدایی تا Domain/Company در سطوح بالا)، استقلال (نیاز به راهنمایی که با سطح کاهش می‌یابد)، و جهت اثرگذاری (از 'تحویل کار خودم' به 'تحویل کار از طریق دیگران'). منابعی مثل levels.fyi (مقایسهٔ عمومی سطوح بین شرکت‌های بزرگ فناوری) و چارچوب‌های منتشرشدهٔ عمومی (مثل همان سند Monzo که مبنای نردبان بیت‌پین است) به شما اجازه می‌دهند وقتی بیرون از شرکت فعلی‌تان (مثلاً در مصاحبه) صحبت می‌کنید، بفهمید طرف مقابل از 'Senior' دقیقاً چه انتظاری دارد، و تجربهٔ خودتان را با زبان قابل‌فهم برای آن‌ها (نه صرفاً عنوان داخلی بیت‌پین) توضیح دهید. برای تعریف دقیق و رسمی هر سطح در بیت‌پین - قلمرو، اثرگذاری، مهارت و رفتار مورد انتظار - به نردبان مهندسی نرم‌افزار بیت‌پین (فاز ۵۴) مراجعه کنید؛ این‌جا فقط دربارهٔ ترجمهٔ آن زبان به زبان مشترک صنعت صحبت می‌کنیم.",
objectives:["نگاشت واژگان صنعتی رایج (Junior/Mid/Senior/Staff/Principal) به سطوح نردبان بیت‌پین (فاز ۵۴)","توضیح دادن سطح و تجربهٔ خود به‌شکلی قابل‌فهم برای یک مصاحبه‌کننده یا شرکت دیگر، مستقل از عنوان داخلی"],
example:"یک 'Senior Engineer' در یک استارتاپ ۱۵ نفره ممکن است از نظر قلمرو و استقلال، معادل نردبان‌سطح L4 (Tech Lead) یا حتی L5 در بیت‌پین باشد - چون در شرکت کوچک، مسئولیت‌ها زودتر تجمیع می‌شوند تا در سازمان بزرگ با لایه‌های بیشتر.",
py:"", exercise:"سطح فعلی خودتان در نردبان بیت‌پین (فاز ۵۴) را مشخص کنید؛ سپس با مراجعه به یک منبع عمومی (مثل levels.fyi یا یک شرح‌شغل واقعی از یک شرکت دیگر)، توضیح دهید این سطح در آن شرکت دقیقاً به چه عنوانی و با چه انتظاراتی نزدیک‌تر است.",
project:"", resources:[{t:"levels.fyi - مقایسهٔ سطوح مهندسی بین شرکت‌ها",u:"https://www.levels.fyi/"},{t:"Monzo - Engineering Progression Framework (سند مرجع نردبان بیت‌پین)",u:"https://monzo.com/documents/engineering-progression-framework-v3-0.pdf"},{t:"Will Larson - Staff Engineer (خلاصه‌ها و مقالات رایگان نویسنده)",u:"https://staffeng.com/"}],
criteria:"می‌توانید سطح خودتان در نردبان بیت‌پین را با واژگان عمومی صنعت (Junior تا Principal) توضیح دهید و آن را با یک منبع مقایسهٔ بیرونی (مثل levels.fyi) نگاشت کنید.",
interview:["اگر بخواهید تجربهٔ خود را برای یک شرکت دیگر توضیح دهید که از عنوان‌های متفاوتی استفاده می‌کند، چه چیزهایی (نه عنوان) را مبنای مقایسه قرار می‌دهید؟","چرا مقایسهٔ مستقیم عنوان‌ها بین دو شرکت بدون نگاه به تعریف واقعی هرکدام گمراه‌کننده است؟"],
mistakes:["مقایسهٔ مستقیم عنوان شغلی بین دو شرکت (مثلاً 'من Senior هستم پس معادل Senior آن‌جا هستم') بدون بررسی قلمرو و انتظارات واقعی پشت آن عنوان در هر شرکت"],
production:"در مذاکرهٔ حقوق یا مصاحبهٔ شغلی، مهندسانی که بتوانند تجربهٔ خود را بر اساس قلمرو/اثرگذاری واقعی (نه فقط عنوان) توضیح دهند، ارزیابی دقیق‌تر و منصفانه‌تری از سطح خود دریافت می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. تفاوت واژگان سطح مهندسی بین شرکت‌های مختلف صنعت (نه نردبان داخلی بیت‌پین که در فاز ۵۴ پوشش داده شده) و چگونگی نگاشت این دو زبان به هم را آموزش بده. کمکم کن سطح فعلی خودم در نردبان بیت‌پین را به زبان قابل‌فهم برای یک مصاحبهٔ شغلی خارج از شرکت ترجمه کنم. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p52",num:52,title:"طراحی سیستم سطح Senior/Staff",icon:"🏆",summary:"طراحی سیستم‌های واقعاً پیچیده: صرافی، سیستم پرداخت، فید خبر مقیاس‌بزرگ.",
topics:[
{id:"sysdesign-payment-ledger",title:"طراحی سیستم پرداخت و Ledger با تضمین سازگاری قوی",level:"Expert",minLadder:5,prereqs:["sysdesign-url-shortener","db-acid-isolation","resilience-patterns","api-idempotency"],
short:"یک طراحی سیستم سطح Staff که تمام مفاهیم دوره (تراکنش، Idempotency، Saga، Observability) را در یک مسئلهٔ واحد ترکیب می‌کند.",
deep:"سیستم پرداخت باید سه ویژگی سخت‌گیرانه داشته باشد: هرگز پول نباید 'گم' شود (Durability + Consistency)، هرگز عملیات نباید دوبار اجرا شود (Idempotency)، و کل تاریخچهٔ تراکنش‌ها باید قابل‌ممیزی (Auditable) باشد. طراحی معمولاً بر پایهٔ Double-Entry Ledger است (مانند حسابداری سنتی): هر تراکنش دقیقاً دو (یا بیشتر) رکورد ایجاد می‌کند که مجموعشان صفر است (بدهکار از یک حساب، بستانکار به حساب دیگر) - این طراحی به‌طور ذاتی خطاهای ناسازگاری را آشکار می‌کند (اگر مجموع کل Ledger صفر نشود، یک باگ وجود دارد) و از تغییر مستقیم 'موجودی' (که تاریخچه را از دست می‌دهد) اجتناب می‌کند؛ موجودی همیشه از جمع رکوردهای Ledger محاسبه می‌شود (یا با یک Snapshot دوره‌ای برای سرعت، به‌همراه رکوردهای Ledger بعد از آن نقطه). برای جلوگیری از Race Condition روی یک حساب (دو تراکنش هم‌زمان)، select_for_update در یک تراکنش دیتابیسی روی ردیف حساب قفل می‌گیرد، ولی باید همیشه به یک ترتیب ثابت (مثلاً بر اساس ID حساب مرتب‌شده) قفل گرفته شود تا از Deadlock جلوگیری شود. برای تراکنش‌هایی که چند سرویس مستقل را درگیر می‌کنند (مثل کیف‌پول + سرویس ارسال کالا)، Saga با Idempotency Key در هر مرحله ترکیب می‌شود. Observability حیاتی است: هر تراکنش باید یک Correlation ID داشته باشد که در تمام لاگ‌ها و Trace ها قابل ردیابی باشد تا در صورت شکایت کاربر ('پولم کسر شد ولی سفارش ثبت نشد')، مسیر دقیق تراکنش در چند دقیقه قابل بازسازی باشد.",
objectives:["طراحی یک مدل Double-Entry Ledger با Django ORM","ترکیب select_for_update، Idempotency Key و Saga در یک طراحی واحد"],
example:"یک انتقال ۱۰۰ تومانی از A به B، دو رکورد Ledger می‌سازد: {account: A, amount: -100}, {account: B, amount: +100} — مجموع صفر، تاریخچه کامل حفظ می‌شود.",
py:"from django.db import transaction\nfrom django.db.models import F\n\n@transaction.atomic\ndef transfer(from_account_id, to_account_id, amount, idempotency_key):\n    if LedgerEntry.objects.filter(idempotency_key=idempotency_key).exists():\n        return  # قبلاً پردازش شده، از تکرار جلوگیری می‌شود\n    ids_in_order = sorted([from_account_id, to_account_id])  # ترتیب ثابت قفل برای جلوگیری از Deadlock\n    accounts = Account.objects.select_for_update().filter(id__in=ids_in_order)\n    from_acc = next(a for a in accounts if a.id == from_account_id)\n    if from_acc.balance() < amount:\n        raise InsufficientFundsError()\n    LedgerEntry.objects.create(account_id=from_account_id, amount=-amount, idempotency_key=idempotency_key)\n    LedgerEntry.objects.create(account_id=to_account_id, amount=amount, idempotency_key=idempotency_key)",
exercise:"مدل LedgerEntry و Account را در Django طراحی کنید، تابع transfer بالا را کامل پیاده‌سازی کنید، و یک تست بنویسید که ۱۰۰ انتقال هم‌زمان (با threading) بین دو حساب را بدون Race Condition و بدون Deadlock تضمین کند.",
project:"سیستم کیف‌پول کامل با Double-Entry Ledger، Idempotency، select_for_update با ترتیب ثابت قفل، Observability (Correlation ID در لاگ)، و تست بار همزمانی با Locust.",
resources:[{t:"Martin Fowler - Accounting Patterns (مفهومی، از کتاب Analysis Patterns)",u:"https://martinfowler.com/eaaDev/AccountingNarrative.html"},{t:"Stripe Engineering blog - practical payment system design (رایگان)",u:"https://stripe.com/blog/engineering"}],
criteria:"می‌توانید یک سیستم Ledger مالی کامل طراحی کنید که در برابر Race Condition، Deadlock و درخواست تکراری مقاوم باشد و تاریخچهٔ کامل قابل‌ممیزی داشته باشد.",
interview:["چرا سیستم‌های مالی از Double-Entry Ledger به‌جای فقط یک ستون 'موجودی' استفاده می‌کنند؟","چگونه از Deadlock هنگام قفل گرفتن روی دو حساب هم‌زمان جلوگیری می‌کنید؟"],
mistakes:["به‌روزرسانی مستقیم ستون balance با UPDATE accounts SET balance = balance - X بدون Ledger، که تاریخچه و قابلیت ممیزی را از بین می‌برد و در برابر Race Condition آسیب‌پذیرتر است"],
production:"تمام سیستم‌های پرداخت واقعی بزرگ (Stripe، بانک‌ها) از الگوی Double-Entry Ledger برای تضمین صحت مالی و قابلیت حسابرسی استفاده می‌کنند.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی کامل یک سیستم Ledger مالی (با Double-Entry، Idempotency، قفل ایمن در برابر Deadlock) را مثل یک مصاحبهٔ System Design سطح Staff با من پیش ببر. از نیازمندی‌ها شروع کن، مرا به چالش بکش دربارهٔ Race Condition و Deadlock، و در پایان طراحی من را نقد کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"sysdesign-newsfeed-ranking",title:"طراحی فید خبر مقیاس‌بزرگ: Fan-out و رتبه‌بندی",level:"Expert",minLadder:null,prereqs:["sysdesign-payment-ledger","cache-strategies"],
short:"چالش اصلی یک فید خبر (مثل توییتر/اینستاگرام) توزیع محتوا به میلیون‌ها دنبال‌کننده و رتبه‌بندی آن است، نه صرفاً ذخیرهٔ پست.",
deep:"مسئلهٔ اصلی فید خبر این است: وقتی کاربری با میلیون‌ها دنبال‌کننده پست می‌گذارد، چگونه این پست به فید همهٔ آن‌ها می‌رسد؟ Fan-out on Write (Push) بلافاصله بعد از پست، آن را در فید ذخیره‌شدهٔ (مثلاً در Redis) هر دنبال‌کننده می‌نویسد - خواندن فید در این مدل فوق‌العاده سریع است (فقط یک خواندن از یک لیست از‌پیش‌آماده) اما نوشتن برای کاربران بسیار پرفالوور (Celebrity Problem) کند و پرهزینه است (میلیون‌ها نوشتن برای یک پست). Fan-out on Read (Pull) برعکس عمل می‌کند: چیزی از قبل ذخیره نمی‌شود، و وقتی کاربری فیدش را باز می‌کند، پست‌های همهٔ دنبال‌شونده‌هایش در لحظه واکشی و ترکیب می‌شوند - نوشتن ارزان است اما خواندن (به‌خصوص برای کاربری که هزاران نفر را دنبال می‌کند) کند می‌شود. راه‌حل عملی صنعتی، ترکیبی (Hybrid) است: کاربران عادی از Fan-out on Write استفاده می‌کنند (چون تعداد دنبال‌کننده‌شان کم است و این مدل سریع است)، اما پست‌های Celebrity ها با Fan-out on Read در لحظهٔ باز کردن فید به فید کاربر تزریق می‌شوند تا از نوشتن میلیونی جلوگیری شود. لایهٔ رتبه‌بندی (Ranking) روی این معماری قرار می‌گیرد: به‌جای نمایش پست‌ها به ترتیب زمانی خام، یک مدل امتیازدهی (بر اساس تازگی، تعامل پیش‌بینی‌شده، رابطهٔ کاربر با نویسنده) ترتیب نمایش را تعیین می‌کند - این لایه معمولاً به‌صورت یک سرویس مجزا با کش شدید (چون محاسبهٔ امتیاز برای هزاران پست به‌ازای هر بار باز شدن فید گران است) پیاده می‌شود.",
objectives:["توضیح مصالحهٔ Fan-out on Write در برابر Fan-out on Read و چرا مدل Hybrid رایج‌ترین راه‌حل صنعتی است","طراحی معماری سطح بالای یک لایهٔ رتبه‌بندی فید که از محاسبهٔ مکرر گران جلوگیری کند"],
example:"یک حساب با ۵۰ میلیون دنبال‌کننده (Celebrity) که Fan-out on Write برایش استفاده شود، هر پست باعث ۵۰ میلیون نوشتن می‌شود - به همین دلیل توییتر/اینستاگرام برای چنین حساب‌هایی از مدل Pull استفاده می‌کنند.",
py:"", exercise:"برای یک سرویس فید خبر فرضی، معماری Fan-out را طراحی کنید: چه آستانه‌ای از تعداد دنبال‌کننده باعث سوییچ از Push به Pull می‌شود؟ چگونه در لحظهٔ باز کردن فید، پست‌های Push-شده و Pull-شده را ترکیب می‌کنید؟",
project:"", resources:[{t:"High Scalability - How Twitter/Instagram feed works (توضیح مفهومی)",u:"http://highscalability.com/"},{t:"Meta Engineering - News Feed ranking (مقالات عمومی رایگان)",u:"https://engineering.fb.com/"}],
criteria:"می‌توانید معماری Fan-out ترکیبی (Push برای اکثریت، Pull برای Celebrity) را طراحی کنید و توضیح دهید لایهٔ رتبه‌بندی چگونه روی آن قرار می‌گیرد.",
interview:["چرا Fan-out on Write برای حساب‌های با میلیون‌ها دنبال‌کننده مشکل‌ساز است؟","چگونه یک سیستم فید، Push و Pull را برای کاربران مختلف ترکیب می‌کند؟"],
mistakes:["استفادهٔ یکسان از Fan-out on Write برای همهٔ کاربران بدون در نظر گرفتن تعداد دنبال‌کننده، که برای حساب‌های بسیار پرفالوور به یک گلوگاه نوشتن فاجعه‌بار تبدیل می‌شود"],
production:"پلتفرم‌های بزرگ شبکهٔ اجتماعی (توییتر مستندسازی‌شده در مقالات عمومی‌شان) دقیقاً به همین دلیل (مشکل Celebrity) از معماری Fan-out ترکیبی استفاده می‌کنند نه یک مدل واحد ساده.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی یک فید خبر مقیاس‌بزرگ (Fan-out on Write/Read، مشکل Celebrity، لایهٔ رتبه‌بندی) را مثل یک مصاحبهٔ System Design با من پیش ببر؛ از نیازمندی‌ها شروع کن و مرا دربارهٔ مصالحهٔ Push/Pull به چالش بکش. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."},
{id:"sysdesign-exchange-matching",title:"طراحی موتور تطبیق سفارش صرافی (Matching Engine)",level:"Expert",minLadder:5,prereqs:["sysdesign-payment-ledger","concurrency-primitives"],
short:"چرا یک صرافی نمی‌تواند مثل بقیه سیستم‌ها Eventually Consistent باشد و چگونه سفارش‌ها را عادلانه و سریع تطبیق می‌دهد.",
deep:"هستهٔ یک صرافی، دفتر سفارش (Order Book) است: دو لیست مرتب‌شده از سفارش‌های خرید (Bid، مرتب‌شده نزولی بر اساس قیمت) و فروش (Ask، مرتب‌شده صعودی) برای هر جفت‌ارز/نماد. موتور تطبیق (Matching Engine) وقتی سفارش جدیدی می‌رسد، بررسی می‌کند آیا با بهترین سفارش طرف مقابل (Best Bid/Best Ask) تطبیق دارد؛ اگر بله، معامله انجام و از هردو دفتر کم می‌شود. اصل Price-Time Priority قانون عدالت بازار است: در قیمت یکسان، سفارشی که زودتر ثبت شده اول تطبیق می‌شود - این یعنی ترتیب پردازش سفارش‌ها باید کاملاً قطعی و بدون ابهام باشد، که نیازمند یک صف پردازش تک‌رشته‌ای (Single-threaded) یا مکانیزم قفل بسیار دقیق در سطح هر نماد است (نه کل سیستم، برای موازی‌سازی بین نمادهای مختلف). بر خلاف بسیاری از سیستم‌های توزیع‌شده که Eventual Consistency را می‌پذیرند، موتور تطبیق باید Strong Consistency و ترتیب کاملاً قطعی داشته باشد چون یک میلی‌ثانیه تأخیر یا ترتیب اشتباه می‌تواند به معنای میلیون‌ها تومان سود/ضرر ناعادلانه برای یک طرف معامله باشد. عملکرد (Latency) در این حوزه حیاتی است: موتورهای تطبیق واقعی صرافی‌های بزرگ برای رسیدن به تأخیر میکروثانیه‌ای، اغلب کل دفتر سفارش یک نماد را در حافظه (نه دیتابیس) نگه می‌دارند و تغییرات را به‌صورت Append-only Log (شبیه WAL) برای Durability و بازسازی بعد از Crash ثبت می‌کنند - دقیقاً همان الگوی Event Sourcing که قبلاً دیدیم، اینجا با فشار عملکردی شدیدتر.",
objectives:["توضیح اصل Price-Time Priority و چرا ترتیب پردازش سفارش باید کاملاً قطعی باشد","طراحی معماری یک موتور تطبیق تک‌رشته‌ای در سطح هر نماد با Append-only Log برای بازیابی"],
example:"دو سفارش خرید با قیمت یکسان ۱۰۰,۰۰۰ تومان: سفارشی که ۲۰۰ میلی‌ثانیه زودتر ثبت شده، حتی اگر تفاوت زمانی ناچیز باشد، باید اول تطبیق داده شود - نقض این قانون یعنی نقض عدالت بازار.",
py:"", exercise:"یک موتور تطبیق سادهٔ درون‌حافظه‌ای در پایتون بنویسید: دو لیست Bid/Ask مرتب، تابعی که سفارش جدید را می‌گیرد، بهترین تطبیق ممکن را پیدا می‌کند، معامله را ثبت و دفترها را به‌روزرسانی می‌کند - با رعایت Price-Time Priority.",
project:"", resources:[{t:"Investopedia - Order Book & Price-Time Priority (مفهومی)",u:"https://www.investopedia.com/terms/o/order-book.asp"},{t:"Wikipedia - Order Matching System",u:"https://en.wikipedia.org/wiki/Order_matching_system"}],
criteria:"می‌توانید یک موتور تطبیق سادهٔ Price-Time Priority پیاده‌سازی کنید و توضیح دهید چرا این حوزه به Strong Consistency (نه Eventual) نیاز دارد.",
interview:["چرا موتور تطبیق صرافی نمی‌تواند مثل بسیاری سیستم‌های دیگر Eventually Consistent باشد؟","Price-Time Priority چیست و چرا ترتیب پردازش سفارش باید کاملاً قطعی باشد؟"],
mistakes:["پردازش موازی و بدون ترتیب قطعی سفارش‌های یک نماد که می‌تواند اصل Price-Time Priority را نقض کند و به شکایات/مسائل حقوقی جدی منجر شود"],
production:"صرافی‌های واقعی (سهام و رمزارز) میلیون‌ها دلار روی کاهش Latency موتور تطبیق سرمایه‌گذاری می‌کنند چون حتی چند میلی‌ثانیه تأخیر می‌تواند مزیت غیرمنصفانه به معامله‌گران پرسرعت (High-Frequency Trading) بدهد.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. طراحی یک موتور تطبیق سفارش صرافی (Order Book، Price-Time Priority، نیاز به Strong Consistency) را مثل یک مصاحبهٔ System Design سطح Staff با من پیش ببر و پیاده‌سازی سادهٔ آن را در پایتون هدایت کن. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}
]},

{id:"p53",num:53,title:"آزمون جامع نهایی (Capstone)",icon:"🎯",summary:"ارزیابی نهایی ترکیبی از تمام حوزه‌ها: نظری، کدنویسی، SQL، دیباگ، طراحی سیستم و زیرساخت.",
topics:[

short:"ساخت یک سیستم واقعی و کامل که تمام دانش این نقشه راه را در یک پروژهٔ واحد به کار می‌گیرد.",
deep:"این پروژه باید شامل باشد: کاربران و احراز هویت (JWT + Permission)، کیف‌پول با Double-Entry Ledger، سفارش‌ها و پرتفوی سرمایه‌گذاری، قیمت‌گذاری (با به‌روزرسانی از یک منبع خارجی شبیه‌سازی‌شده)، پردازش ناهمگام سفارش‌ها با Celery+Redis، رویدادهای Kafka برای اطلاع‌رسانی بین بخش‌های سیستم (مثلاً 'سفارش اجرا شد' → به‌روزرسانی پرتفوی)، جستجوی تراکنش‌ها با Elasticsearch، تمام موارد Dockerize و قابل استقرار روی Kubernetes با Health Probe صحیح، Observability کامل (Prometheus Metrics، Structured Logs، Distributed Tracing با Correlation ID)، و مستندسازی با حداقل سه ADR برای تصمیمات معماری کلیدی. باید به‌طور آگاهانه با چالش‌های زیر دست‌وپنجه نرم کنید: Race Condition واقعی در پردازش هم‌زمان سفارش‌ها (حل با select_for_update و/یا صف)، Idempotency در تمام Endpointهای حساس، ترتیب رویدادها در Kafka (انتخاب صحیح Partition Key)، مقیاس‌پذیری دیتابیس (تصمیم آگاهانه دربارهٔ Read Replica یا Partitioning)، و یک تمرین Disaster Recovery واقعی (شبیه‌سازی از دست رفتن یک Node/Replica و بازیابی). ارزیابی نهایی باید شامل حداقل یک آزمایش بار واقعی (با Locust یا k6) و یک آزمایش Chaos (خاموش کردن عمدی یک وابستگی) با مستندسازی نتیجه در قالب یک گزارش شبیه پست‌مورتم باشد.",
objectives:["ادغام تمام مفاهیم دوره در یک سیستم واحد قابل‌استقرار","اجرای یک آزمایش بار و یک آزمایش Chaos واقعی روی پروژه و مستندسازی نتایج"],
example:"معماری نهایی: Nginx → Gunicorn/Uvicorn (Django+DRF) → PostgreSQL (Primary+Replica) + Redis (کش/صف) + Kafka (رویداد) + Elasticsearch (جستجو)، همه روی Kubernetes با Prometheus+Grafana.",
py:"", exercise:"معماری کامل این پروژه را به‌صورت یک دیاگرام (حتی متنی/ASCII) رسم کنید، شامل تمام اجزا و جهت جریان داده بین آن‌ها.",
project:"پیاده‌سازی کامل پلتفرم توضیح‌داده‌شده در بالا، طبق ساختار زیر: Repository گیت با README کامل، حداقل ۳ ADR، Dockerfile+docker-compose برای توسعهٔ محلی، Manifestهای Kubernetes، پایپ‌لاین CI/CD (تست+build+deploy)، Dashboard Grafana با حداقل ۵ Panel معنادار، و یک گزارش Postmortem از یک آزمایش Chaos واقعی که روی سیستم اجرا کرده‌اید.",
resources:[{t:"System Design Primer (مرور نهایی، رایگان)",u:"https://github.com/donnemartin/system-design-primer"},{t:"Google SRE Book (مرور نهایی فصل‌های کلیدی، رایگان)",u:"https://sre.google/books/"}],
criteria:"پروژه باید بدون کمک بیرونی توسط شما قابل توضیح کامل باشد: چرا هر تصمیم معماری گرفته شد، چه مصالحه‌ای داشت، و چگونه سیستم تحت بار/خرابی رفتار می‌کند (با شواهد واقعی، نه فرضی).",
interview:["این پروژه را از ابتدا تا انتها برای من (به‌عنوان یک مصاحبه‌گر Staff-level) توضیح دهید: چرا این معماری، چه جایگزین‌هایی را رد کردید و چرا، و بزرگ‌ترین ریسک باقی‌مانده در طراحی فعلی چیست؟"],
mistakes:["ساخت یک سیستم صرفاً 'CRUD با چند تکنولوژی مد روز' بدون درگیر شدن واقعی با چالش‌های همزمانی، مقیاس‌پذیری و مشاهده‌پذیری که کل هدف این نقشه راه بود"],
production:"این پروژه دقیقاً الگویی از پیچیدگی واقعی است که در یک سیستم مالی تولیدی واقعی (نه یک تمرین آموزشی سطحی) با آن مواجه می‌شوید.",
ai:"در نقش یک منتور واقعی و باتجربه با من رفتار کن، نه یک پاسخ‌دهندهٔ صرف. من در پایان این نقشه راه هستم و می‌خواهم پروژهٔ Capstone (پلتفرم مالی کامل) را بسازم. مثل یک Staff Engineer که در حال Design Review است با من رفتار کن: طراحی من را قدم‌به‌قدم به چالش بکش، خصوصاً دربارهٔ همزمانی، Idempotency، مقیاس‌پذیری و Observability، و در پایان بگو آیا این کار برای نمونه‌کار سطح Senior قابل ارائه است یا چه چیزی کم دارد. مرحله به مرحله پیش برو: اول با یک سؤال کوتاه بسنج سطح فعلی دانشم دربارهٔ این موضوع چقدر است، بعد دقیقاً طبق همین درخواست آموزش بده، و در پایان با پرسیدن یک سؤال مفهومی یا خواستن توضیح موضوع با کلمات خودم مطمئن شو که واقعاً یاد گرفته‌ام؛ اگر پاسخم ناقص یا اشتباه بود، به‌جای رد شدن از کنارش، دوباره و با روشی دیگر توضیح بده تا کاملاً یاد بگیرم."}

{id:"p55",num:55,title:"پروژه‌های عملی نردبان (Career Ladder Projects)",icon:"🏗️",summary:"یک محصول واحد و واقعی -سامانهٔ شبکهٔ کتابخانه- که در ۸ گام، هم‌زمان با نردبان (فاز ۵۴)، رشد می‌کند: هر سطح دقیقاً یک تسک/پروژه/ابتکار با موجودیت‌ها، قوانین کسب‌وکار، اندپوینت‌ها و معیار پذیرش مشخص و عددی است - نه یک توصیف کلی.",
topics:[
{id:"project-l1",title:"پروژه سطح یک: فیچر «امانت کتاب» در سامانهٔ کتابخانه",level:"Beginner",minLadder:1,prereqs:["ladder-se1"],
short:"یک تسک دقیقاً مشخص (۱ تا ۲ هفته) روی یک اپ Django/DRF موجود که مدل‌های Book و Member را از قبل دارد: افزودن مدل Loan و دو اندپوینت امانت/بازگشت با قوانین کسب‌وکار ثابت.",
deep:"صورت‌مسئلهٔ ثابت (نه انتخابی): یک پروژهٔ Django با دو مدل موجود Book(id, isbn, title, author, total_copies, available_copies) و Member(id, user, membership_status) در اختیار دارید. باید دقیقاً همین‌ها را اضافه کنید:\n۱) مدل Loan(id, book FK, member FK, borrowed_at, due_at, returned_at nullable).\n۲) اندپوینت POST /api/loans/ با بدنهٔ {book_id, member_id}: اگر available_copies کتاب صفر باشد باید HTTP 409 با پیام 'کتاب موجود نیست' برگرداند؛ اگر همان عضو همین کتاب را در حال حاضر امانت گرفته (returned_at is null) باید 400 برگرداند؛ اگر عضو در حال حاضر ۳ امانت فعال (returned_at is null) داشته باشد باید 400 با پیام 'سقف امانت (۳ کتاب) پر شده' برگرداند؛ در غیر این صورت Loan بسازد، due_at را دقیقاً ۱۴ روز بعد از borrowed_at بگذارد و available_copies کتاب را یکی کم کند - این دو عملیات باید در یک تراکنش اتمیک (select_for_update روی ردیف Book) انجام شوند تا Race Condition دو درخواست هم‌زمان، available_copies را منفی نکند.\n۳) اندپوینت POST /api/loans/{id}/return/: اگر returned_at از قبل مقدار داشته باشد باید 400 'قبلاً بازگردانده شده' برگرداند؛ در غیر این صورت returned_at را now بگذارد و available_copies کتاب را یکی زیاد کند.\n۴) Permission: هر عضو فقط می‌تواند برای خودش امانت بگیرد/برگرداند (member_id باید برابر کاربر لاگین‌کرده باشد مگر کاربر staff باشد)؛ تلاش برای امانت/بازگشت به‌نام عضو دیگر باید 403 برگرداند (IDOR را ببندید).\n۵) GET /api/loans/?member_id=&active=true|false برای فهرست امانت‌ها با صفحه‌بندی پیش‌فرض DRF.\nاین پروژه هم‌ارز دقیق قلمرو رسمی L1 است: تسکی با تعریف پایان کاملاً روشن، بدون نیاز به تصمیم معماری مستقل.",
objectives:["پیاده‌سازی مدل Loan و Migration با Constraint دیتابیسی مناسب (مثلاً CheckConstraint برای due_at > borrowed_at)","پیاده‌سازی سه قانون کسب‌وکار (موجودی صفر، تکراری، سقف سه امانت) دقیقاً با کدهای HTTP گفته‌شده","بستن Race Condition هم‌زمانی با select_for_update روی ردیف Book در یک تراکنش","نوشتن حداقل ۱۰ تست pytest: یکی برای هرکدام از ۵ قانون/حالت بالا + حالت موفق + سه حالت مجوز (403) + یک تست هم‌زمانی (دو ثرد/دو کوئری هم‌زمان روی آخرین نسخهٔ کتاب)"],
example:"عضو با ۲ امانت فعال تلاش می‌کند کتابی با available_copies=1 امانت بگیرد → موفق، available_copies به ۰ می‌رسد. عضو دیگری بلافاصله همان کتاب را درخواست می‌دهد → باید 409 بگیرد، نه یک Race Condition که هر دو موفق شوند.",
py:"from django.db import transaction\nfrom django.utils import timezone\nfrom datetime import timedelta\n\nMAX_ACTIVE_LOANS = 3\nLOAN_PERIOD_DAYS = 14\n\n@transaction.atomic\ndef borrow_book(book_id, member_id):\n    book = Book.objects.select_for_update().get(id=book_id)\n    if book.available_copies <= 0:\n        raise Conflict('کتاب موجود نیست')\n    if Loan.objects.filter(member_id=member_id, book_id=book_id, returned_at__isnull=True).exists():\n        raise BadRequest('این کتاب در حال حاضر امانت گرفته شده')\n    active_count = Loan.objects.filter(member_id=member_id, returned_at__isnull=True).count()\n    if active_count >= MAX_ACTIVE_LOANS:\n        raise BadRequest('سقف امانت (۳ کتاب) پر شده')\n    book.available_copies -= 1\n    book.save(update_fields=['available_copies'])\n    now = timezone.now()\n    return Loan.objects.create(book=book, member_id=member_id, borrowed_at=now, due_at=now+timedelta(days=LOAN_PERIOD_DAYS))",
exercise:"با ThreadPoolExecutor دو درخواست POST /api/loans/ کاملاً هم‌زمان برای یک کتاب با available_copies=1 بفرستید و نشان دهید فقط یکی موفق می‌شود؛ بدون select_for_update این تست را تکرار کنید تا Bug واقعی را با چشم ببینید، سپس رفعش کنید.",
project:"اپ 'امانت کتاب' کامل روی سامانهٔ کتابخانه: مدل Loan، دو اندپوینت borrow/return با ۵ قانون کسب‌وکار دقیق، Permission مالکیتی، و حداقل ۱۰ تست pytest شامل یک تست هم‌زمانی.",
resources:[{t:"Django - select_for_update docs",u:"https://docs.djangoproject.com/en/stable/ref/models/querysets/#select-for-update"},{t:"DRF - Permissions",u:"https://www.django-rest-framework.org/api-guide/permissions/"},{t:"pytest-django docs",u:"https://pytest-django.readthedocs.io/"}],
